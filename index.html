入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B057","topicId":"","stem":"在「耳部血流調整→熱交換改變→維持體溫範圍」這個文字流程中，最後一項是什麼角色？","correct":"BIO-B01-Ch1.1-B057:A","options":[{"id":"BIO-B01-Ch1.1-B057:A","text":"前面調整所支持的內部維持結果","explanation":"題幹用調整手段支援體溫維持。"},{"id":"BIO-B01-Ch1.1-B057:B","text":"表示繁殖已完成","explanation":"流程未說產生後代。"},{"id":"BIO-B01-Ch1.1-B057:C","text":"表示任何環境下體溫絕無波動","explanation":"維持範圍不等於永遠完全固定。"},{"id":"BIO-B01-Ch1.1-B057:D","text":"表示個體在一刻內完成族群演化","explanation":"沒有多代族群資料。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B058","topicId":"","stem":"同學想知道「數值有變」是否足以否定調節。最應請他再看哪項資訊？","correct":"BIO-B01-Ch1.1-B058:B","options":[{"id":"BIO-B01-Ch1.1-B058:A","text":"對象是否具有想讓數值固定的願望","explanation":"調節不以主觀願望作必要條件。"},{"id":"BIO-B01-Ch1.1-B058:B","text":"變動是否受到控制並維持在可運作範圍","explanation":"這才直接對應調節的判準。"},{"id":"BIO-B01-Ch1.1-B058:C","text":"個體是否顏色漂亮","explanation":"顏色不回答內部控制是否合適。"},{"id":"BIO-B01-Ch1.1-B058:D","text":"個體是否每一秒都產生後代","explanation":"繁殖頻率非此調節判準。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B059","topicId":"","stem":"某題寫「調整散熱以維持體溫」並同時提到耳朵形狀。若問最直接生命性質，為何仍優先選調節？","correct":"BIO-B01-Ch1.1-B059:C","options":[{"id":"BIO-B01-Ch1.1-B059:A","text":"因為有形狀就不可能有秩序","explanation":"有形狀與有組織不衝突。"},{"id":"BIO-B01-Ch1.1-B059:B","text":"因為調節只能根據器官名稱判斷","explanation":"應依功能與條件判斷，不只看名詞。"},{"id":"BIO-B01-Ch1.1-B059:C","text":"主要因果描述是調整熱交換以維持內部條件","explanation":"不能被題幹中的構造名詞帶離維持體溫的焦點。"},{"id":"BIO-B01-Ch1.1-B059:D","text":"只要提耳朵就一定選繁殖","explanation":"耳朵不是後代形成線索。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B060","topicId":"","stem":"如何用一句話區別調節與演化適應，並避免把調節說成不變？","correct":"BIO-B01-Ch1.1-B060:D","options":[{"id":"BIO-B01-Ch1.1-B060:A","text":"調節是所有量完全不變，適應是個體想變就變","explanation":"兩者都採錯誤絕對或目的論說法。"},{"id":"BIO-B01-Ch1.1-B060:B","text":"調節等於產子，適應等於單個體增高","explanation":"把兩者錯換成繁殖與生長。"},{"id":"BIO-B01-Ch1.1-B060:C","text":"兩者都不需要任何時間與對象資訊","explanation":"區別正需要看個體當下與族群世代。"},{"id":"BIO-B01-Ch1.1-B060:D","text":"調節是個體當下控制內部範圍，適應涉及族群遺傳特徵經世代累積","explanation":"同時保留控制範圍和族群世代兩組條件。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B061","topicId":"","stem":"捕蠅草在受到碰觸後閉合，學生據此寫「植物想抓住昆蟲，所以已證明它有意識」。哪個修正最恰當？","correct":"BIO-B01-Ch1.1-B061:A","options":[{"id":"BIO-B01-Ch1.1-B061:A","text":"保留刺激引起反應的觀察，刪除已證明意識的推論","explanation":"可見反應與主觀意識的證據層次不同。"},{"id":"BIO-B01-Ch1.1-B061:B","text":"保留全部，因為任何反應都必然有意圖","explanation":"把反應直接當成意圖證明。"},{"id":"BIO-B01-Ch1.1-B061:C","text":"刪除反應，因為植物不可能回應環境","explanation":"與已觀察到的閉合矛盾。"},{"id":"BIO-B01-Ch1.1-B061:D","text":"改成葉片每次閉合都產生後代","explanation":"閉合不是繁殖。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B062","topicId":"","stem":"紀錄依序為「葉片原先張開、昆蟲碰觸、葉片快速閉合」。哪個理由最能支持回應環境的配對？","correct":"BIO-B01-Ch1.1-B062:B","options":[{"id":"BIO-B01-Ch1.1-B062:A","text":"因為張開到閉合證明基因已被意志改寫","explanation":"沒有意志或基因改寫證據。"},{"id":"BIO-B01-Ch1.1-B062:B","text":"描述外在刺激與生物反應的連結","explanation":"碰觸是刺激，閉合是反應，完整對應定義。"},{"id":"BIO-B01-Ch1.1-B062:C","text":"因為葉片閉合必須經過許多世代","explanation":"快速反應不是族群多代變化。"},{"id":"BIO-B01-Ch1.1-B062:D","text":"因為所有閉合都代表新個體誕生","explanation":"構造位置改變不等於後代形成。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B063","topicId":"","stem":"某植物仍固定在土中，但局部構造對碰觸改變狀態。何種解讀最合理？","correct":"BIO-B01-Ch1.1-B063:C","options":[{"id":"BIO-B01-Ch1.1-B063:A","text":"固定在土中就不可能有任何生命活動","explanation":"植物仍有多種生命活動。"},{"id":"BIO-B01-Ch1.1-B063:B","text":"沒有整株位移就表示反應紀錄必定虛假","explanation":"反應不需整株位移，不能因此否定紀錄。"},{"id":"BIO-B01-Ch1.1-B063:C","text":"整株不位移與局部反應可同時存在","explanation":"回應環境不要求整體主動移到別處。"},{"id":"BIO-B01-Ch1.1-B063:D","text":"局部反應證明整株一定已走動","explanation":"局部與整體位移不能混同。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B064","topicId":"","stem":"一段解析寫「觀察到刺激後反應，因此足以確認動物式意識」。本節最支持哪個批評？","correct":"BIO-B01-Ch1.1-B064:D","options":[{"id":"BIO-B01-Ch1.1-B064:A","text":"應改說所有生命都沒有反應","explanation":"本節列回應環境為生命性質。"},{"id":"BIO-B01-Ch1.1-B064:B","text":"應改說植物不是生命，所以觀察無意義","explanation":"植物是生命，觀察仍有意義。"},{"id":"BIO-B01-Ch1.1-B064:C","text":"只要加上反應速度很快就能確定意識","explanation":"速度快仍不是意識的充分證據。"},{"id":"BIO-B01-Ch1.1-B064:D","text":"可觀察反應不等於已獲得意識的充分證據","explanation":"需要區分反應現象與意識推論。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B065","topicId":"","stem":"甲說「對刺激有反應就是回應環境」，乙說「凡有反應者都必定有主觀意圖」。對這兩句如何評價？","correct":"BIO-B01-Ch1.1-B065:A","options":[{"id":"BIO-B01-Ch1.1-B065:A","text":"甲符合此性質的描述，乙多推了一個未被證明的意圖","explanation":"不能由外顯反應直接推知主觀意識。"},{"id":"BIO-B01-Ch1.1-B065:B","text":"甲乙都正確，反應與意圖本來同義","explanation":"兩者不是同義詞。"},{"id":"BIO-B01-Ch1.1-B065:C","text":"甲錯乙對，只有有意識才可能反應","explanation":"回應環境不要求先證明意識。"},{"id":"BIO-B01-Ch1.1-B065:D","text":"甲乙都錯，生物不能感受刺激","explanation":"與本節回應環境的定義相反。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B066","topicId":"","stem":"學生看到捕蠅草快速閉合，就選演化適應。哪個追問最能指出配對問題？","correct":"BIO-B01-Ch1.1-B066:B","options":[{"id":"BIO-B01-Ch1.1-B066:A","text":"閉合是否能從無到有創造能量？","explanation":"能量創造不是合理的反應判準。"},{"id":"BIO-B01-Ch1.1-B066:B","text":"這是同一個體當下反應，還是族群多代遺傳特徵變化？","explanation":"確認對象與時間尺度可區分反應與適應。"},{"id":"BIO-B01-Ch1.1-B066:C","text":"這片葉子顏色是否漂亮？","explanation":"顏色美觀不能解決尺度混淆。"},{"id":"BIO-B01-Ch1.1-B066:D","text":"這株植物是否必定在走路？","explanation":"整株位移不是反應必要條件。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B067","topicId":"","stem":"甲紀錄「受碰觸後立刻閉合」，乙紀錄「同一幼苗逐步形成葉片」。依時間與事件內容，何者最合適？","correct":"BIO-B01-Ch1.1-B067:C","options":[{"id":"BIO-B01-Ch1.1-B067:A","text":"甲偏族群演化，乙偏個體意識","explanation":"缺多代資料與意識證據。"},{"id":"BIO-B01-Ch1.1-B067:B","text":"甲乙都只代表能量被創造","explanation":"兩者均不是能量創造。"},{"id":"BIO-B01-Ch1.1-B067:C","text":"甲偏回應環境，乙偏生長發育","explanation":"刺激後即時反應與逐步構造形成具有不同焦點。"},{"id":"BIO-B01-Ch1.1-B067:D","text":"甲乙都一定是繁殖","explanation":"沒有同類後代形成資料。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B068","topicId":"","stem":"若要修訂句子「捕蠅草想閉合才會閉合」，使它只表達本節支持的內容，哪句最佳？","correct":"BIO-B01-Ch1.1-B068:D","options":[{"id":"BIO-B01-Ch1.1-B068:A","text":"捕蠅草沒有整株行走，所以不會閉合","explanation":"局部閉合不需整株行走。"},{"id":"BIO-B01-Ch1.1-B068:B","text":"捕蠅草每次閉合都代表族群累積一代適應","explanation":"單次反應不是一代族群演化。"},{"id":"BIO-B01-Ch1.1-B068:C","text":"捕蠅草只要閉合就不需要能量","explanation":"反應不會消除能量需求。"},{"id":"BIO-B01-Ch1.1-B068:D","text":"捕蠅草能在受到環境刺激後出現閉合反應","explanation":"保留可觀察的刺激反應連結，不加入意圖。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B069","topicId":"","stem":"某題列出「外界刺激→生物反應」，但學生只想記物種名字。為何完整關係更有助於判題？","correct":"BIO-B01-Ch1.1-B069:A","options":[{"id":"BIO-B01-Ch1.1-B069:A","text":"它說明判作回應環境的原因，而非只靠名字猜","explanation":"同一生物可展現不同性質，需看題幹活動。"},{"id":"BIO-B01-Ch1.1-B069:B","text":"因為看到植物名稱就一定代表繁殖","explanation":"植物題不一定有後代。"},{"id":"BIO-B01-Ch1.1-B069:C","text":"因為只有名字可以判斷是否存在意識","explanation":"名字不能證明意識。"},{"id":"BIO-B01-Ch1.1-B069:D","text":"因為所有生命性質都只有一個固定物種","explanation":"同一性質可出現在不同生命例子中。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B070","topicId":"","stem":"同學聲稱「不能證明植物有意識，就不能承認它對環境有反應」。最佳回應為何？","correct":"BIO-B01-Ch1.1-B070:B","options":[{"id":"BIO-B01-Ch1.1-B070:A","text":"否定說法，因為每株植物已被此現象證明有意識","explanation":"結論不應靠另一個未被支持的意識主張。"},{"id":"BIO-B01-Ch1.1-B070:B","text":"意識是否被證明與觀察到反應是不同問題","explanation":"不能因缺意識證據便抹除刺激反應。"},{"id":"BIO-B01-Ch1.1-B070:C","text":"接受說法，因為反應必須先有語言","explanation":"本節沒有語言門檻。"},{"id":"BIO-B01-Ch1.1-B070:D","text":"接受說法，因為只有行走才算反應","explanation":"局部反應也成立。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B071","topicId":"","stem":"某族群原本存在不同的可遺傳外觀，其中隱蔽性較佳者較常留下後代；多代後此特徵更常見。哪個解釋最好？","correct":"BIO-B01-Ch1.1-B071:C","options":[{"id":"BIO-B01-Ch1.1-B071:A","text":"只要一個個體散熱就能解釋整個多代結果","explanation":"當下調節不足以代替族群世代過程。"},{"id":"BIO-B01-Ch1.1-B071:B","text":"所有個體原本完全相同，所以不需遺傳差異","explanation":"與題幹原本存在不同遺傳外觀相反。"},{"id":"BIO-B01-Ch1.1-B071:C","text":"有利的可遺傳特徵經繁殖差異在族群中累積","explanation":"同時具備遺傳變異、留下後代差異與世代改變。"},{"id":"BIO-B01-Ch1.1-B071:D","text":"每個個體因想躲藏而立刻設計自己的新外觀","explanation":"將族群世代結果改成個體意圖。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B072","topicId":"","stem":"「某動物今天為了需要而演化」這句話最缺乏哪一組必要說明？","correct":"BIO-B01-Ch1.1-B072:D","options":[{"id":"BIO-B01-Ch1.1-B072:A","text":"動物當下的願望有多強烈","explanation":"願望強弱不是演化適應的必要證據。"},{"id":"BIO-B01-Ch1.1-B072:B","text":"個體今天體積增大多少","explanation":"個體生長不等於族群適應。"},{"id":"BIO-B01-Ch1.1-B072:C","text":"個體是否能像汽車快速行駛","explanation":"行駛速度不是此演化判準。"},{"id":"BIO-B01-Ch1.1-B072:D","text":"族群中可遺傳特徵如何經世代累積","explanation":"個體今日需要不能代替族群世代的遺傳變化。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B073","topicId":"","stem":"甲紀錄同一隻野兔當日為散熱、維持體溫而調整耳部血流；乙紀錄某有利可遺傳保護特徵在族群多代間增加。哪個比較正確？","correct":"BIO-B01-Ch1.1-B073:A","options":[{"id":"BIO-B01-Ch1.1-B073:A","text":"甲屬當下調節，乙可支持演化適應的概念","explanation":"二者差異在個體與族群、當下與世代。"},{"id":"BIO-B01-Ch1.1-B073:B","text":"甲乙都只能叫個體生長","explanation":"沒有同一個體增大或成熟的焦點。"},{"id":"BIO-B01-Ch1.1-B073:C","text":"甲乙都是個體有意識地演化","explanation":"兩者都不需要這種意圖假定。"},{"id":"BIO-B01-Ch1.1-B073:D","text":"甲是繁殖，乙是瞬間刺激反應","explanation":"兩個配對顛倒了實際條件。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B074","topicId":"","stem":"一位學生說保護色「有用，所以每個需要它的個體都能立即獲得」。應如何修正？","correct":"BIO-B01-Ch1.1-B074:B","options":[{"id":"BIO-B01-Ch1.1-B074:A","text":"改成適應只表示同個體變大","explanation":"生長不能替代演化適應。"},{"id":"BIO-B01-Ch1.1-B074:B","text":"適應性特徵的累積需看可遺傳變異與族群世代，不能只靠需要","explanation":"有用不等於個體可依願望立即獲得。"},{"id":"BIO-B01-Ch1.1-B074:C","text":"只要把立即改成一小時就正確","explanation":"仍是個體需要直接導致演化的錯誤因果。"},{"id":"BIO-B01-Ch1.1-B074:D","text":"改成所有有用特徵都不可能遺傳","explanation":"不能由此推翻遺傳性特徵存在。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B075","topicId":"","stem":"報告已說某動物的外觀讓個體較難被捕食，但未談這項特徵能否傳給後代。若要用本節框架解釋多代適應，還應確認什麼？","correct":"BIO-B01-Ch1.1-B075:C","options":[{"id":"BIO-B01-Ch1.1-B075:A","text":"個體是否單靠願望獲得特徵","explanation":"願望不是所需證據。"},{"id":"BIO-B01-Ch1.1-B075:B","text":"只確認外觀是否好看即可","explanation":"美觀不能代替遺傳與多代資訊。"},{"id":"BIO-B01-Ch1.1-B075:C","text":"此特徵是否可遺傳，以及在族群世代間如何累積","explanation":"有利效果需與遺傳與世代資訊相連，才形成此適應解釋。"},{"id":"BIO-B01-Ch1.1-B075:D","text":"個體是否曾在同一天閉合葉片","explanation":"與動物外觀的遺傳累積無直接關聯。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B076","topicId":"","stem":"假設某保護色可遺傳且有助於留下後代；早期100個體中有20個具此色，數代後100個體中有60個。最合適的入門解讀是什麼？","correct":"BIO-B01-Ch1.1-B076:D","options":[{"id":"BIO-B01-Ch1.1-B076:A","text":"比例沒有改變，因為兩次都觀察100個體","explanation":"分母相同不表示分子比例相同。"},{"id":"BIO-B01-Ch1.1-B076:B","text":"每一個原個體都在當天變成保護色","explanation":"題幹比較不同世代的族群，不能當作同日個體變色。"},{"id":"BIO-B01-Ch1.1-B076:C","text":"保護色是由個體需要憑空設計出來的","explanation":"資料沒有支持意圖導致特徵產生。"},{"id":"BIO-B01-Ch1.1-B076:D","text":"比例由20%升至60%，與此有利遺傳特徵在族群中累積相符","explanation":"20除100為20%，60除100為60%；題幹另給遺傳性與繁殖優勢，支持適應框架。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B077","topicId":"","stem":"若解析只說「外觀改變，所以一定演化」，哪個補充最能避免誤判？","correct":"BIO-B01-Ch1.1-B077:A","options":[{"id":"BIO-B01-Ch1.1-B077:A","text":"區分個體短期改變與族群可遺傳特徵的跨世代變化","explanation":"不是所有外觀改變都代表演化適應。"},{"id":"BIO-B01-Ch1.1-B077:B","text":"所有外觀改變都只會發生在非生命","explanation":"生物也會生長發育或反應而改變外觀。"},{"id":"BIO-B01-Ch1.1-B077:C","text":"凡有外觀改變都證明個體有意圖","explanation":"外觀變化不能直接證明意識或意圖。"},{"id":"BIO-B01-Ch1.1-B077:D","text":"完全不需要考慮對象與時間","explanation":"對象與時間正是區分的重點。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B078","topicId":"","stem":"課堂以海馬的隱蔽外觀說明適應，哪個句子保留本節最重要的因果條件？","correct":"BIO-B01-Ch1.1-B078:B","options":[{"id":"BIO-B01-Ch1.1-B078:A","text":"因個體體型增大，族群一定形成新保護色","explanation":"體型生長不能推出族群保護特徵。"},{"id":"BIO-B01-Ch1.1-B078:B","text":"具合適可遺傳特徵者較成功留下後代，使相關特徵經世代累積","explanation":"連起遺傳性、繁殖成功與族群累積。"},{"id":"BIO-B01-Ch1.1-B078:C","text":"因海馬想躲藏，外觀就立即由意識完成","explanation":"把適應寫成個體意圖的直接結果。"},{"id":"BIO-B01-Ch1.1-B078:D","text":"因外觀像環境，所有世代都不必繁殖","explanation":"繁殖成功與世代延續恰是此框架的一部分。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B079","topicId":"","stem":"一題要區分「長大」「受刺激反應」「演化適應」。何者最適合單獨放入第三類？","correct":"BIO-B01-Ch1.1-B079:C","options":[{"id":"BIO-B01-Ch1.1-B079:A","text":"同一葉片受碰觸後快速閉合","explanation":"這是當下回應環境。"},{"id":"BIO-B01-Ch1.1-B079:B","text":"同一個體為了需要而立即改造所有遺傳特徵","explanation":"這是本節否定的演化誤解。"},{"id":"BIO-B01-Ch1.1-B079:C","text":"可遺傳的有利特徵在族群中經多代累積","explanation":"完整給出族群、遺傳與世代線索。"},{"id":"BIO-B01-Ch1.1-B079:D","text":"同一幼苗在幾週內形成根葉","explanation":"這是個體生長發育。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B080","topicId":"","stem":"同學把「適應」縮寫成「需要→主動變化」。若要改成符合本節的入門流程，何者最好？","correct":"BIO-B01-Ch1.1-B080:D","options":[{"id":"BIO-B01-Ch1.1-B080:A","text":"想要更強→立即變強→整族群同時成功","explanation":"仍是意圖直接改造，缺遺傳與世代證據。"},{"id":"BIO-B01-Ch1.1-B080:B","text":"體型增加→形成新葉→每片葉等於一代","explanation":"把個體發育誤當族群世代。"},{"id":"BIO-B01-Ch1.1-B080:C","text":"單次刺激→立刻閉合→已完成無數代適應","explanation":"把即時反應誤當長期演化。"},{"id":"BIO-B01-Ch1.1-B080:D","text":"有利可遺傳差異→留下後代的差異→族群多代累積","explanation":"保留天擇與世代框架，沒有個體意圖跳步。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B081","topicId":"","stem":"學生把導讀清單寫成「組織、資訊、能量與物質、交互作用、繁殖」。若要還原五個統整主題，最小修訂為何？","correct":"BIO-B01-Ch1.1-B081:A","options":[{"id":"BIO-B01-Ch1.1-B081:A","text":"把繁殖換成演化","explanation":"繁殖是生命性質；五主題清單的第五項為演化。"},{"id":"BIO-B01-Ch1.1-B081:B","text":"把組織換成生長","explanation":"組織本來是五主題，生長不能替代。"},{"id":"BIO-B01-Ch1.1-B081:C","text":"把資訊換成顏色","explanation":"資訊本來正確，顏色不是指定主題。"},{"id":"BIO-B01-Ch1.1-B081:D","text":"把能量與物質拆成兩項並保留繁殖","explanation":"能量與物質在此是同一主題，拆分仍漏演化。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B082","topicId":"","stem":"某段學習記錄關注「基因攜帶的訊息如何影響生命活動」，而沒有討論多代族群變化。為何應優先連到資訊主題？","correct":"BIO-B01-Ch1.1-B082:B","options":[{"id":"BIO-B01-Ch1.1-B082:A","text":"因為資訊等於能量憑空創造","explanation":"兩者不是同義，且能量創造錯誤。"},{"id":"BIO-B01-Ch1.1-B082:B","text":"焦點是訊息的作用，而非僅因出現基因就判演化","explanation":"需依題幹問的關係配主題，基因不只出現在演化敘述。"},{"id":"BIO-B01-Ch1.1-B082:C","text":"因為所有有基因的敘述都排除生命","explanation":"基因與生命資訊相關，不能推非生命。"},{"id":"BIO-B01-Ch1.1-B082:D","text":"因為資訊主題只研究生物的體積","explanation":"體積不是資訊主題的定義。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B083","topicId":"","stem":"甲導讀著重生命層級，乙導讀著重分子、細胞與環境的相互影響。哪個配對最恰當？","correct":"BIO-B01-Ch1.1-B083:C","options":[{"id":"BIO-B01-Ch1.1-B083:A","text":"甲為能量創造，乙為意識","explanation":"兩者都不是本節五主題的對應。"},{"id":"BIO-B01-Ch1.1-B083:B","text":"甲乙都只能歸演化","explanation":"題幹沒有共同的跨世代演化焦點。"},{"id":"BIO-B01-Ch1.1-B083:C","text":"甲為組織，乙為交互作用","explanation":"甲看層級安排，乙看不同部分之間的互動。"},{"id":"BIO-B01-Ch1.1-B083:D","text":"甲為資訊，乙為繁殖","explanation":"甲未突出訊息，乙未描述後代。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B084","topicId":"","stem":"為何不能把五個統整主題理解成「每個例子只能放進一格，而且永遠不能相連」？","correct":"BIO-B01-Ch1.1-B084:D","options":[{"id":"BIO-B01-Ch1.1-B084:A","text":"因為五主題本來是沒有內容的裝飾字","explanation":"主題有實際概念與整理功能。"},{"id":"BIO-B01-Ch1.1-B084:B","text":"因為五主題其實只有一個：會移動","explanation":"位移不是本節主題框架。"},{"id":"BIO-B01-Ch1.1-B084:C","text":"因為只有列名字才算生物學，解釋關係不算","explanation":"生物學包括研究生命現象與關係。"},{"id":"BIO-B01-Ch1.1-B084:D","text":"主題是幫助串聯內容的觀念框架，相關角度可以並用","explanation":"例如發育可連遺傳資訊，不要求機械互斥。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B085","topicId":"","stem":"某摘要寫「DNA與基因表現」卻標成「能量與物質」。若原段焦點是遺傳訊息的作用，哪個修正最好？","correct":"BIO-B01-Ch1.1-B085:A","options":[{"id":"BIO-B01-Ch1.1-B085:A","text":"改標資訊，並保留原段的訊息焦點","explanation":"資訊主題在本節概略涵蓋DNA、基因與表現。"},{"id":"BIO-B01-Ch1.1-B085:B","text":"改標繁殖，因為出現DNA就等於已產生後代","explanation":"DNA存在或作用不能單獨證明後代事件。"},{"id":"BIO-B01-Ch1.1-B085:C","text":"改標意識，因為訊息一定有主觀覺察","explanation":"遺傳資訊不等於意識。"},{"id":"BIO-B01-Ch1.1-B085:D","text":"保留原標，因為所有主題名稱都可任意互換","explanation":"主題有不同焦點，不能隨意互換。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B086","topicId":"","stem":"導讀卡的標題是「生命的統一性與多樣性」。依本節五主題框架，最合適的核心標籤與理由為何？","correct":"BIO-B01-Ch1.1-B086:B","options":[{"id":"BIO-B01-Ch1.1-B086:A","text":"顏色，因所有生命必定外表一模一樣","explanation":"顏色不是五主題，生命並非全同外觀。"},{"id":"BIO-B01-Ch1.1-B086:B","text":"演化，因其被提出為解釋統一性與多樣性的核心主題","explanation":"此為本節總覽的概念連結，尚未展開機制。"},{"id":"BIO-B01-Ch1.1-B086:C","text":"調節，因每項內部條件都永遠不變","explanation":"調節不是五主題的此核心標籤，且不等於永遠不變。"},{"id":"BIO-B01-Ch1.1-B086:D","text":"繁殖，因所有個體每一刻都必須產子","explanation":"繁殖個體條件錯誤，且非此處主題角色。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B087","topicId":"","stem":"甲寫「能量流動與轉換」，乙寫「物質被吸收與轉換」。在導入的五主題命名中，應如何整理？","correct":"BIO-B01-Ch1.1-B087:C","options":[{"id":"BIO-B01-Ch1.1-B087:A","text":"甲乙都只能標有意識","explanation":"沒有意識證據，且意識非五主題。"},{"id":"BIO-B01-Ch1.1-B087:B","text":"甲必須改叫繁殖，乙必須改叫生長","explanation":"原句未提供後代或個體發育的直接焦點。"},{"id":"BIO-B01-Ch1.1-B087:C","text":"可一起連到能量與物質主題","explanation":"此名稱同時涵蓋兩種焦點，但不代表能量與物質是同一詞。"},{"id":"BIO-B01-Ch1.1-B087:D","text":"因為有兩句，必須把五主題改成六個","explanation":"描述有兩句不改變主題清單的命名。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B088","topicId":"","stem":"學生看到「分子與細胞」就一律選組織，但題幹強調的是「相互影響」。哪個判題提醒最好？","correct":"BIO-B01-Ch1.1-B088:D","options":[{"id":"BIO-B01-Ch1.1-B088:A","text":"只要有細胞就一定是族群演化","explanation":"細胞名詞不能提供跨世代條件。"},{"id":"BIO-B01-Ch1.1-B088:B","text":"只要有分子就一定沒有生命相關性","explanation":"分子層次也可研究生命相關現象。"},{"id":"BIO-B01-Ch1.1-B088:C","text":"所有主題本來沒有意義，隨機選即可","explanation":"主題有可辨認的概略焦點。"},{"id":"BIO-B01-Ch1.1-B088:D","text":"除了看名詞，也要看題幹強調層級還是互動","explanation":"本題動詞指向交互作用，不能只因名詞就固定分類。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B089","topicId":"","stem":"若想用五主題整理新學的生物例子，下列哪項做法最合理？","correct":"BIO-B01-Ch1.1-B089:A","options":[{"id":"BIO-B01-Ch1.1-B089:A","text":"依例子實際關係連到適合主題，必要時標明不同角度","explanation":"主題用於理解關係，不是忽略內容的硬分類。"},{"id":"BIO-B01-Ch1.1-B089:B","text":"只按文章字數決定主題","explanation":"字數不是五主題的概念判準。"},{"id":"BIO-B01-Ch1.1-B089:C","text":"看到任何變化都固定放演化","explanation":"很多變化是個體反應或發育，不能一概演化。"},{"id":"BIO-B01-Ch1.1-B089:D","text":"把五主題改成每個個體必須同時做到的五個動作","explanation":"主題不是五個同時動作的生命門檻。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B090","topicId":"","stem":"甲把五主題當成後續學習的索引，乙把它們當成可取代所有章節的五句結論。哪個評價較恰當？","correct":"BIO-B01-Ch1.1-B090:B","options":[{"id":"BIO-B01-Ch1.1-B090:A","text":"甲乙都錯，五主題只描述非生命物品","explanation":"主題是生命研究的統整框架。"},{"id":"BIO-B01-Ch1.1-B090:B","text":"甲符合框架用途，乙省略了仍需學習的具體內容","explanation":"五主題幫助組織知識，不等於全文教材。"},{"id":"BIO-B01-Ch1.1-B090:C","text":"甲乙都正確，讀完五個名字就已掌握全部機制","explanation":"總覽不等於掌握全部內容。"},{"id":"BIO-B01-Ch1.1-B090:D","text":"甲錯乙對，概念不能拿來連結後續章節","explanation":"主題正用於跨內容連結。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B091","topicId":"","stem":"某段說明「幼苗依遺傳資訊形成新構造」。若分別問生命活動與統整主題，哪一組答案及理由最完整？","correct":"BIO-B01-Ch1.1-B091:C","options":[{"id":"BIO-B01-Ch1.1-B091:A","text":"調節與有意識；因構造形成必須先有想法","explanation":"題幹未談內部範圍維持與意識。"},{"id":"BIO-B01-Ch1.1-B091:B","text":"能量創造與位移；因植物必須邊走邊發育","explanation":"能量創造錯誤，植物也不必整株位移。"},{"id":"BIO-B01-Ch1.1-B091:C","text":"生長發育與資訊；前者描述構造形成，後者指出訊息作用","explanation":"同一個體的構造形成屬生長發育，基因資訊的作用則連到資訊主題。"},{"id":"BIO-B01-Ch1.1-B091:D","text":"繁殖與演化；因每片新葉都是下一代","explanation":"新構造不是下一代，更不能由此當多代演化。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B092","topicId":"","stem":"記錄甲是「碰觸後迅速閉合」，乙是「耳部血流改變來維持體溫」。若問最直接生命性質，何者最佳？","correct":"BIO-B01-Ch1.1-B092:D","options":[{"id":"BIO-B01-Ch1.1-B092:A","text":"甲是繁殖，乙是生長","explanation":"缺後代形成與個體成熟的焦點。"},{"id":"BIO-B01-Ch1.1-B092:B","text":"甲乙都證明主觀意識","explanation":"這些外顯活動不等於意識證據。"},{"id":"BIO-B01-Ch1.1-B092:C","text":"甲乙都是族群多代演化","explanation":"題幹均為個體當下活動。"},{"id":"BIO-B01-Ch1.1-B092:D","text":"甲是回應環境，乙是調節","explanation":"甲強調刺激反應；乙強調內部條件維持。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B093","topicId":"","stem":"一位學生把「生命系統有繁殖特徵」寫成「不能繁殖的個體不是生命」，又把「反應」寫成「意識」。哪個修訂能同時修好兩處？","correct":"BIO-B01-Ch1.1-B093:A","options":[{"id":"BIO-B01-Ch1.1-B093:A","text":"保留繁殖的個體例外，並區分刺激反應與意識推論","explanation":"兩處問題分別是個體門檻與證據過度推論。"},{"id":"BIO-B01-Ch1.1-B093:B","text":"只把不能繁殖改成體型太小，其餘保留","explanation":"大小仍非生命門檻，且意識混淆未修。"},{"id":"BIO-B01-Ch1.1-B093:C","text":"只把意識改成想法，其餘保留","explanation":"只是換近義用語，沒有修正兩種誤解。"},{"id":"BIO-B01-Ch1.1-B093:D","text":"把生命特徵清單全部改成會移動","explanation":"新增另一個單項判準錯誤。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B094","topicId":"","stem":"甲例是食物化學能支持活動，乙例是各部分相互影響。若兩例都要使用五主題名稱，何者配對正確？","correct":"BIO-B01-Ch1.1-B094:B","options":[{"id":"BIO-B01-Ch1.1-B094:A","text":"甲為非生命，乙為單次意圖演化","explanation":"均不是適當的五主題配對。"},{"id":"BIO-B01-Ch1.1-B094:B","text":"甲為能量與物質，乙為交互作用","explanation":"分別依能量關係與互動關係歸類。"},{"id":"BIO-B01-Ch1.1-B094:C","text":"甲為繁殖，乙為生長","explanation":"這是性質名稱且不符題幹焦點。"},{"id":"BIO-B01-Ch1.1-B094:D","text":"甲為資訊，乙為意識","explanation":"甲未重視訊息，意識也非五主題。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B095","topicId":"","stem":"表中三列依序是「同個體長大」「同類後代出現」「有利遺傳特徵多代累積」。哪組標籤依序正確？","correct":"BIO-B01-Ch1.1-B095:C","options":[{"id":"BIO-B01-Ch1.1-B095:A","text":"調節、秩序、反應","explanation":"三列都未以這些性質為直接焦點。"},{"id":"BIO-B01-Ch1.1-B095:B","text":"意識、能量創造、位移","explanation":"均不能由資料直接支持。"},{"id":"BIO-B01-Ch1.1-B095:C","text":"生長發育、繁殖、演化適應","explanation":"三列分別是原個體、後代、族群世代的不同焦點。"},{"id":"BIO-B01-Ch1.1-B095:D","text":"繁殖、演化適應、生長發育","explanation":"各標籤與對象時間不符。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B096","topicId":"","stem":"小組將「構造有組織」與「體溫受控制」都解釋成「所有東西永遠不動」。最完整的修正是什麼？","correct":"BIO-B01-Ch1.1-B096:D","options":[{"id":"BIO-B01-Ch1.1-B096:A","text":"只有前者應改為繁殖，後者保留完全不動","explanation":"前者不是繁殖，後者也不等於零變動。"},{"id":"BIO-B01-Ch1.1-B096:B","text":"兩者都表示個體有意識地演化","explanation":"缺主觀意識與族群多代條件。"},{"id":"BIO-B01-Ch1.1-B096:C","text":"兩者都代表沒有生命活動","explanation":"與題幹兩項生命性質相反。"},{"id":"BIO-B01-Ch1.1-B096:D","text":"前者是秩序，後者是調節，兩者都不要求完全靜止","explanation":"結構組織性與內部控制皆可伴隨活動或受控變化。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B097","topicId":"","stem":"一張導入圖列五主題，另一張列七項生命性質。何種使用方式最不容易混淆？","correct":"BIO-B01-Ch1.1-B097:A","options":[{"id":"BIO-B01-Ch1.1-B097:A","text":"先分清圖的目的，再按題幹問活動性質或統整框架回答","explanation":"名稱與用途不同，但可相互連結。"},{"id":"BIO-B01-Ch1.1-B097:B","text":"把兩張所有名稱視為完全相同","explanation":"兩張清單並不相同。"},{"id":"BIO-B01-Ch1.1-B097:C","text":"只背數字五與七，不讀名稱與例子","explanation":"數字不能代替概念理解。"},{"id":"BIO-B01-Ch1.1-B097:D","text":"要求每個個體每刻同時做完十二個動作","explanation":"把兩組框架錯當十二項行為門檻。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B098","topicId":"","stem":"某報告以「變了」概括幼苗形成葉、野兔散熱調整與族群多代有利可遺傳保護色增加。為何需要再區分？","correct":"BIO-B01-Ch1.1-B098:B","options":[{"id":"BIO-B01-Ch1.1-B098:A","text":"因為只要變化就能證明主觀意識","explanation":"外顯變化不能直接證明意識。"},{"id":"BIO-B01-Ch1.1-B098:B","text":"變化可能屬發育、調節或演化適應，須看對象與尺度","explanation":"同樣有變化，不代表同一生命性質。"},{"id":"BIO-B01-Ch1.1-B098:C","text":"因為只有沒有變化的對象才有生命","explanation":"生命活動可以有變化。"},{"id":"BIO-B01-Ch1.1-B098:D","text":"因為三種變化都必定表示繁殖完成","explanation":"並非每項都有後代形成事件。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B099","topicId":"","stem":"同學想寫一段不超出導入範圍的總結，哪句最合適？","correct":"BIO-B01-Ch1.1-B099:C","options":[{"id":"BIO-B01-Ch1.1-B099:A","text":"以個體意圖取代族群世代，說明所有適應","explanation":"錯置演化原因與尺度。"},{"id":"BIO-B01-Ch1.1-B099:B","text":"以五個主題名稱證明已學完全部基因機制","explanation":"主題總覽不能代替下層機制學習。"},{"id":"BIO-B01-Ch1.1-B099:C","text":"以多項生命特徵辨認生命，並用五主題串聯後續知識","explanation":"保留本節兩大功能與導入層次。"},{"id":"BIO-B01-Ch1.1-B099:D","text":"以會移動當唯一生命標準，再略過所有例外","explanation":"違反單項判準限制。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B100","topicId":"","stem":"做完本節情境題後，哪套檢查順序最能避免常見混淆？","correct":"BIO-B01-Ch1.1-B100:D","options":[{"id":"BIO-B01-Ch1.1-B100:A","text":"先找漂亮圖片，不需閱讀題幹","explanation":"外觀不能代替條件與活動分析。"},{"id":"BIO-B01-Ch1.1-B100:B","text":"只要題幹有變化，一律寫個體主動演化","explanation":"這是錯誤的統一套用與目的論。"},{"id":"BIO-B01-Ch1.1-B100:C","text":"只要對象不會行走，就停止判讀並寫非生命","explanation":"會漏掉仍有生命活動的植物。"},{"id":"BIO-B01-Ch1.1-B100:D","text":"先看實際活動，再分個體或族群世代，最後核對概念與理由","explanation":"可避免只看關鍵詞、把生長反應全當演化，以及省略判斷原因。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle" ation":"同種、同區域、同時間的個體集合符合族群。"},{"id":"BIO-B01-Ch1.1.1-S009:B","text":"群集","explanation":"群集包含該區域各物種族群。"},{"id":"BIO-B01-Ch1.1.1-S009:C","text":"生態系","explanation":"生態系還包括非生物環境。"},{"id":"BIO-B01-Ch1.1.1-S009:D","text":"生物圈","explanation":"生物圈的範圍遍及全球生命與環境。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S010","topicId":"","stem":"一處草地中的植物、動物、真菌及細菌等各物種族群合在一起，稱為什麼？","correct":"BIO-B01-Ch1.1.1-S010:C","options":[{"id":"BIO-B01-Ch1.1.1-S010:A","text":"個體","explanation":"個體是單一生物。"},{"id":"BIO-B01-Ch1.1.1-S010:B","text":"族群","explanation":"族群限同一物種。"},{"id":"BIO-B01-Ch1.1.1-S010:C","text":"群集","explanation":"同區域各物種族群的總和是群集。"},{"id":"BIO-B01-Ch1.1.1-S010:D","text":"分子","explanation":"分子是化學層級，與題意不符。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S011","topicId":"","stem":"把森林內的所有生物連同土壤、水與光照一起考慮，最適合使用哪個名稱？","correct":"BIO-B01-Ch1.1.1-S011:B","options":[{"id":"BIO-B01-Ch1.1.1-S011:A","text":"族群","explanation":"族群只包含同種個體。"},{"id":"BIO-B01-Ch1.1.1-S011:B","text":"生態系","explanation":"生物群集加上非生物環境是生態系。"},{"id":"BIO-B01-Ch1.1.1-S011:C","text":"器官","explanation":"器官是多種組織構成的功能單位。"},{"id":"BIO-B01-Ch1.1.1-S011:D","text":"組織","explanation":"組織是細胞合作的層級。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S012","topicId":"","stem":"地球上所有生態系及生命存在的環境，整體稱為什麼？","correct":"BIO-B01-Ch1.1.1-S012:D","options":[{"id":"BIO-B01-Ch1.1.1-S012:A","text":"器官系統","explanation":"器官系統位於個體內。"},{"id":"BIO-B01-Ch1.1.1-S012:B","text":"群集","explanation":"群集只指特定區域的生物集合。"},{"id":"BIO-B01-Ch1.1.1-S012:C","text":"族群","explanation":"族群限同種同區域個體。"},{"id":"BIO-B01-Ch1.1.1-S012:D","text":"生物圈","explanation":"生物圈包含地球所有生命及其生活環境。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S013","topicId":"","stem":"群集與生態系相比，生態系的定義特別把哪一類項目納入？","correct":"BIO-B01-Ch1.1.1-S013:A","options":[{"id":"BIO-B01-Ch1.1.1-S013:A","text":"非生物環境","explanation":"生態系包含群集及水、土壤等非生物環境。"},{"id":"BIO-B01-Ch1.1.1-S013:B","text":"更多同種個體","explanation":"增加同種個體不會自動成為生態系。"},{"id":"BIO-B01-Ch1.1.1-S013:C","text":"只納入動物","explanation":"生態系不限動物。"},{"id":"BIO-B01-Ch1.1.1-S013:D","text":"只納入大型植物","explanation":"生態系也包含其他生物與環境。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S014","topicId":"","stem":"下列哪個描述最符合「族群」？","correct":"BIO-B01-Ch1.1.1-S014:C","options":[{"id":"BIO-B01-Ch1.1.1-S014:A","text":"全世界全部生物","explanation":"全球生命與環境對應生物圈。"},{"id":"BIO-B01-Ch1.1.1-S014:B","text":"一座山林的全部物種","explanation":"多物種的總和對應群集。"},{"id":"BIO-B01-Ch1.1.1-S014:C","text":"同一時間一塊草地上的全部某種草","explanation":"同種、同區域與同時間的條件都具備。"},{"id":"BIO-B01-Ch1.1.1-S014:D","text":"一處濕地的生物與水土","explanation":"生物連同水土對應生態系。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S015","topicId":"","stem":"若只按生態組織層級由小範圍到大範圍排列，何者正確？","correct":"BIO-B01-Ch1.1.1-S015:B","options":[{"id":"BIO-B01-Ch1.1.1-S015:A","text":"群集→族群→生態系","explanation":"族群是群集的組成，前兩者倒置。"},{"id":"BIO-B01-Ch1.1.1-S015:B","text":"族群→群集→生態系","explanation":"各物種族群合成群集，再加非生物環境構成生態系。"},{"id":"BIO-B01-Ch1.1.1-S015:C","text":"生態系→群集→族群","explanation":"此列的方向是由高至低。"},{"id":"BIO-B01-Ch1.1.1-S015:D","text":"生物圈→族群→群集","explanation":"生物圈是所列最高層級，不應排在起點。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S016","topicId":"","stem":"較低層級的成分排列並互動後，出現個別成分沒有的新功能，稱為什麼？","correct":"BIO-B01-Ch1.1.1-S016:D","options":[{"id":"BIO-B01-Ch1.1.1-S016:A","text":"胞器分類","explanation":"胞器分類不是整體新功能的名稱。"},{"id":"BIO-B01-Ch1.1.1-S016:B","text":"單一分子清單","explanation":"列出分子未呈現組合後的新功能。"},{"id":"BIO-B01-Ch1.1.1-S016:C","text":"物種名稱","explanation":"命名物種與題幹無關。"},{"id":"BIO-B01-Ch1.1.1-S016:D","text":"湧現性質","explanation":"湧現性質就是組織與互動所產生的較高層級新性質。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-5 頁（PDF 53-54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S017","topicId":"","stem":"湧現性質的關鍵通常是下列哪一項？","correct":"BIO-B01-Ch1.1.1-S017:B","options":[{"id":"BIO-B01-Ch1.1.1-S017:A","text":"只有組件總重量","explanation":"重量本身不足以解釋整體功能。"},{"id":"BIO-B01-Ch1.1.1-S017:B","text":"組件的排列與互動","explanation":"特定排列與互動是湧現性質的來源。"},{"id":"BIO-B01-Ch1.1.1-S017:C","text":"組件必須都完全相同","explanation":"不同組件也可合作產生新性質。"},{"id":"BIO-B01-Ch1.1.1-S017:D","text":"觀察者替系統命名","explanation":"名稱不會創造系統功能。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S018","topicId":"","stem":"關於湧現性質，哪個說法正確？","correct":"BIO-B01-Ch1.1.1-S018:C","options":[{"id":"BIO-B01-Ch1.1.1-S018:A","text":"它完全不依賴組件","explanation":"湧現性質依賴組件及其關係。"},{"id":"BIO-B01-Ch1.1.1-S018:B","text":"它必定無法研究","explanation":"可以用科學方法研究組件間互動。"},{"id":"BIO-B01-Ch1.1.1-S018:C","text":"它可由組件的組織與互動加以理解","explanation":"觀察組織方式與互動有助於解釋新性質。"},{"id":"BIO-B01-Ch1.1.1-S018:D","text":"每個單一組件原本就具有相同整體功能","explanation":"整體新功能不等於每個組件原本都具備。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S019","topicId":"","stem":"為何單純把葉綠素與其他葉綠體分子混在試管中，不能等同完整光合作用系統？","correct":"BIO-B01-Ch1.1.1-S019:A","options":[{"id":"BIO-B01-Ch1.1.1-S019:A","text":"仍缺少正確的組織與協調互動","explanation":"完整功能需要分子在系統中的特定安排與互動。"},{"id":"BIO-B01-Ch1.1.1-S019:B","text":"葉綠素完全無法吸光","explanation":"葉綠素可以吸光，問題在完整系統的組織。"},{"id":"BIO-B01-Ch1.1.1-S019:C","text":"完整光合作用只由一個分子執行","explanation":"完整光合作用需要多種分子協調。"},{"id":"BIO-B01-Ch1.1.1-S019:D","text":"分子只要靠近便能完成全部功能","explanation":"靠近或混合不代表組織與互動已正確。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S020","topicId":"","stem":"單一葉綠素可吸光，這是否等於它能獨自完成完整光合作用？","correct":"BIO-B01-Ch1.1.1-S020:D","options":[{"id":"BIO-B01-Ch1.1.1-S020:A","text":"是，兩者完全同義","explanation":"吸光是其中一項性質，不是完整光合作用。"},{"id":"BIO-B01-Ch1.1.1-S020:B","text":"是，其他分子只作裝飾","explanation":"其他分子有協調功能，並非裝飾。"},{"id":"BIO-B01-Ch1.1.1-S020:C","text":"是，只看顏色即可確定","explanation":"顏色不能證明完整過程可獨自完成。"},{"id":"BIO-B01-Ch1.1.1-S020:D","text":"否，完整過程需要組織化的多分子系統","explanation":"單一分子功能與系統完整功能須分開。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S021","topicId":"","stem":"用腳踏車零件組裝後可讓人踩踏前進的例子，主要說明什麼？","correct":"BIO-B01-Ch1.1.1-S021:B","options":[{"id":"BIO-B01-Ch1.1.1-S021:A","text":"腳踏車是活細胞","explanation":"這是非生命系統的類比，不是細胞。"},{"id":"BIO-B01-Ch1.1.1-S021:B","text":"非生命系統也可呈現組合後的新功能","explanation":"排列互動產生整體功能並非生命專有。"},{"id":"BIO-B01-Ch1.1.1-S021:C","text":"任何零件單獨都有載人騎行功能","explanation":"單個零件不等於完整腳踏車。"},{"id":"BIO-B01-Ch1.1.1-S021:D","text":"組裝後不需外力便永遠移動","explanation":"騎行仍需踩踏或其他外力，並非永動。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁（正式第9張，16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S022","topicId":"","stem":"哪個敘述正確保留了腳踏車類比的意義？","correct":"BIO-B01-Ch1.1.1-S022:C","options":[{"id":"BIO-B01-Ch1.1.1-S022:A","text":"只要材料相同就必有相同功能","explanation":"材料相同而連接不同，功能仍可能不同。"},{"id":"BIO-B01-Ch1.1.1-S022:B","text":"湧現性質只存在於動物","explanation":"非生命系統也有組合後功能。"},{"id":"BIO-B01-Ch1.1.1-S022:C","text":"正確連接零件能形成單件沒有的騎行功能","explanation":"連接與配合讓系統具有新的功能。"},{"id":"BIO-B01-Ch1.1.1-S022:D","text":"一個車輪便能取代所有部件","explanation":"車輪只是整個系統的一部分。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第7頁（正式第9張，16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S023","topicId":"","stem":"下列哪個例子最直接強調「組合與互動產生功能」？","correct":"BIO-B01-Ch1.1.1-S023:A","options":[{"id":"BIO-B01-Ch1.1.1-S023:A","text":"葉綠體內多種分子協調進行光合作用","explanation":"此例明確包含組織化的分子與整體功能。"},{"id":"BIO-B01-Ch1.1.1-S023:B","text":"只抄寫一個分子的名稱","explanation":"名稱紀錄沒有呈現互動。"},{"id":"BIO-B01-Ch1.1.1-S023:C","text":"只數出一片葉的字母標籤","explanation":"字母標籤與生物功能無關。"},{"id":"BIO-B01-Ch1.1.1-S023:D","text":"只記錄試管的顏色","explanation":"顏色紀錄本身不能顯示整體協調。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S024","topicId":"","stem":"學生把湧現性質解釋成「不依賴下層成分，憑空出現」。應如何修正？","correct":"BIO-B01-Ch1.1.1-S024:D","options":[{"id":"BIO-B01-Ch1.1.1-S024:A","text":"改成所有分子都有完整生命","explanation":"分子並非完整生命單位。"},{"id":"BIO-B01-Ch1.1.1-S024:B","text":"改成完全不用研究互動","explanation":"互動正是重要研究內容。"},{"id":"BIO-B01-Ch1.1.1-S024:C","text":"保留原說法，這就是定義","explanation":"憑空出現並不是本節定義。"},{"id":"BIO-B01-Ch1.1.1-S024:D","text":"改成來自下層成分的特定排列與互動","explanation":"新性質有物質組成與互動的基礎。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S025","topicId":"","stem":"要理解葉綠體的完整光合作用功能，除分子有哪些之外，還應注意什麼？","correct":"BIO-B01-Ch1.1.1-S025:B","options":[{"id":"BIO-B01-Ch1.1.1-S025:A","text":"筆記標題用何種字體","explanation":"字體不決定生物系統功能。"},{"id":"BIO-B01-Ch1.1.1-S025:B","text":"各分子在系統中的安排和相互配合","explanation":"功能取決於組件及其組織互動。"},{"id":"BIO-B01-Ch1.1.1-S025:C","text":"試管標籤是否很長","explanation":"標籤長短無法解釋完整功能。"},{"id":"BIO-B01-Ch1.1.1-S025:D","text":"各分子是否只取相同名稱","explanation":"同名不是形成協調系統的必要條件。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S026","topicId":"","stem":"把一個複雜生命系統拆成容易研究的小部分，這種策略叫什麼？","correct":"BIO-B01-Ch1.1.1-S026:C","options":[{"id":"BIO-B01-Ch1.1.1-S026:A","text":"湧現性質","explanation":"湧現性質是整體新性質，非拆解策略的名稱。"},{"id":"BIO-B01-Ch1.1.1-S026:B","text":"生態系命名","explanation":"命名生態系不等於拆解研究。"},{"id":"BIO-B01-Ch1.1.1-S026:C","text":"還原論","explanation":"還原論以較小組成部分理解複雜系統。"},{"id":"BIO-B01-Ch1.1.1-S026:D","text":"族群統計","explanation":"題幹沒有計數族群個體。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S027","topicId":"","stem":"團隊專門分析從細胞中取出的DNA分子結構，最接近哪種研究取向？","correct":"BIO-B01-Ch1.1.1-S027:A","options":[{"id":"BIO-B01-Ch1.1.1-S027:A","text":"還原論","explanation":"聚焦取出的分子，是把系統拆小研究。"},{"id":"BIO-B01-Ch1.1.1-S027:B","text":"只看生物圈","explanation":"研究對象是分子，不是全球尺度。"},{"id":"BIO-B01-Ch1.1.1-S027:C","text":"只做群集名錄","explanation":"DNA結構不是物種名錄。"},{"id":"BIO-B01-Ch1.1.1-S027:D","text":"拒絕研究組成部分","explanation":"團隊正是在研究組成部分。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S028","topicId":"","stem":"研究細胞中許多成分如何互相影響並產生整體動態，最符合哪個領域？","correct":"BIO-B01-Ch1.1.1-S028:D","options":[{"id":"BIO-B01-Ch1.1.1-S028:A","text":"單純列分子名稱","explanation":"只列名稱缺少相互影響。"},{"id":"BIO-B01-Ch1.1.1-S028:B","text":"器官命名","explanation":"器官命名未研究動態。"},{"id":"BIO-B01-Ch1.1.1-S028:C","text":"只量單一零件","explanation":"只看單件無法代表題幹的整合網絡。"},{"id":"BIO-B01-Ch1.1.1-S028:D","text":"系統生物學","explanation":"系統生物學以互動與整體行為為研究重點。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S029","topicId":"","stem":"還原論與系統生物學的關係，何者最適當？","correct":"BIO-B01-Ch1.1.1-S029:B","options":[{"id":"BIO-B01-Ch1.1.1-S029:A","text":"必須二選一","explanation":"拆解與整合可以同時用於研究。"},{"id":"BIO-B01-Ch1.1.1-S029:B","text":"可以互補","explanation":"拆小研究與分析互動提供互補資訊。"},{"id":"BIO-B01-Ch1.1.1-S029:C","text":"彼此內容完全相同","explanation":"它們的重點不同，並非同義詞。"},{"id":"BIO-B01-Ch1.1.1-S029:D","text":"兩者都不能研究細胞","explanation":"細胞可作兩種取向的研究對象。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S030","topicId":"","stem":"哪句話正確描述還原論的價值？","correct":"BIO-B01-Ch1.1.1-S030:C","options":[{"id":"BIO-B01-Ch1.1.1-S030:A","text":"研究分子一定沒有用","explanation":"分子研究可提供重要資訊。"},{"id":"BIO-B01-Ch1.1.1-S030:B","text":"它只適用於地球整體","explanation":"還原論將系統拆成較小部分。"},{"id":"BIO-B01-Ch1.1.1-S030:C","text":"它能幫助了解系統的組成部分","explanation":"把複雜問題拆小有助於研究部分性質。"},{"id":"BIO-B01-Ch1.1.1-S030:D","text":"它保證單靠零件清單就能解釋全部生命","explanation":"零件清單仍缺組織與互動資訊。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-5 頁（PDF 53-54 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S031","topicId":"","stem":"下列哪項可以被視為系統生物學研究的系統？","correct":"BIO-B01-Ch1.1.1-S031:A","options":[{"id":"BIO-B01-Ch1.1.1-S031:A","text":"單一活的葉肉細胞及其成分互動","explanation":"細胞內也有組成部分及互動，可視為系統。"},{"id":"BIO-B01-Ch1.1.1-S031:B","text":"只有整個地球才可以","explanation":"系統研究不限全球尺度。"},{"id":"BIO-B01-Ch1.1.1-S031:C","text":"只有體型很大的動物才可以","explanation":"小至細胞也可以研究。"},{"id":"BIO-B01-Ch1.1.1-S031:D","text":"只有同一物種的全部個體才可以","explanation":"系統的範圍不只族群。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S032","topicId":"","stem":"系統生物學特別關心下列哪個問題？","correct":"BIO-B01-Ch1.1.1-S032:D","options":[{"id":"BIO-B01-Ch1.1.1-S032:A","text":"蛋白質名稱有幾個字","explanation":"名稱字數不是生物互動機制。"},{"id":"BIO-B01-Ch1.1.1-S032:B","text":"圖表使用哪個顏色","explanation":"圖表配色不等於系統行為。"},{"id":"BIO-B01-Ch1.1.1-S032:C","text":"資料夾如何排序","explanation":"檔案排序不是生物系統的關係。"},{"id":"BIO-B01-Ch1.1.1-S032:D","text":"組件間關係如何形成整體行為","explanation":"成分互動與動態行為是核心問題。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S033","topicId":"","stem":"只知道細胞有哪些成分，還不足以完整理解細胞。接著應補什麼？","correct":"BIO-B01-Ch1.1.1-S033:B","options":[{"id":"BIO-B01-Ch1.1.1-S033:A","text":"把成分名稱縮短","explanation":"縮短名稱不補科學資訊。"},{"id":"BIO-B01-Ch1.1.1-S033:B","text":"分析成分間的互動和變化","explanation":"互動和動態可補足成分清單。"},{"id":"BIO-B01-Ch1.1.1-S033:C","text":"完全丟掉已有成分資料","explanation":"原有成分資料仍有價值。"},{"id":"BIO-B01-Ch1.1.1-S033:D","text":"假設所有成分互不影響","explanation":"忽略互動正是問題所在。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S034","topicId":"","stem":"「還原論完全無用，應停止研究分子。」這句話錯在哪裡？","correct":"BIO-B01-Ch1.1.1-S034:C","options":[{"id":"BIO-B01-Ch1.1.1-S034:A","text":"錯把分子放在細胞外","explanation":"題意的錯誤不是分子位置。"},{"id":"BIO-B01-Ch1.1.1-S034:B","text":"錯把所有分子當成器官","explanation":"原句沒有器官分類的主張。"},{"id":"BIO-B01-Ch1.1.1-S034:C","text":"否定了拆解研究能提供的資訊","explanation":"還原論能幫助理解部分，只是不能單獨涵蓋整體。"},{"id":"BIO-B01-Ch1.1.1-S034:D","text":"錯把系統生物學當成一種胞器","explanation":"原句沒有把系統生物學當胞器。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S035","topicId":"","stem":"先分析各部分，再研究彼此如何配合，這樣安排的主要好處是什麼？","correct":"BIO-B01-Ch1.1.1-S035:A","options":[{"id":"BIO-B01-Ch1.1.1-S035:A","text":"結合部分性質與整體互動","explanation":"兩種取向結合有助理解生命系統。"},{"id":"BIO-B01-Ch1.1.1-S035:B","text":"保證不必觀察任何生物","explanation":"兩者仍需觀察與證據。"},{"id":"BIO-B01-Ch1.1.1-S035:C","text":"證明組織方式不重要","explanation":"互動分析恰好重視組織方式。"},{"id":"BIO-B01-Ch1.1.1-S035:D","text":"讓所有層級都變成分子","explanation":"研究方法不會消除實際層級差異。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S036","topicId":"","stem":"「構造與功能相關」最適合用哪句話說明？","correct":"BIO-B01-Ch1.1.1-S036:D","options":[{"id":"BIO-B01-Ch1.1.1-S036:A","text":"外觀永遠與功能無關","explanation":"構造常會支援或限制功能。"},{"id":"BIO-B01-Ch1.1.1-S036:B","text":"只知道名稱就知道全部功能","explanation":"名稱不能取代結構分析。"},{"id":"BIO-B01-Ch1.1.1-S036:C","text":"這個原則只適用於整株植物","explanation":"此原則可跨多個組織層級。"},{"id":"BIO-B01-Ch1.1.1-S036:D","text":"形狀、位置與排列可提供功能線索","explanation":"結構特徵可協助判斷如何運作。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S037","topicId":"","stem":"葉片通常寬而扁，這樣的構造主要有利於哪個面向？","correct":"BIO-B01-Ch1.1.1-S037:B","options":[{"id":"BIO-B01-Ch1.1.1-S037:A","text":"取消所有細胞分工","explanation":"葉內仍有細胞分工。"},{"id":"BIO-B01-Ch1.1.1-S037:B","text":"增加受光面積","explanation":"寬扁葉面有利捕捉光線。"},{"id":"BIO-B01-Ch1.1.1-S037:C","text":"讓葉片成為族群","explanation":"形狀不會把器官變成族群。"},{"id":"BIO-B01-Ch1.1.1-S037:D","text":"讓葉綠素不再需要光","explanation":"吸光色素仍需光線才能吸光。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S038","topicId":"","stem":"蜂鳥翅膀可在肩關節大幅旋轉，配合快速拍動，有利於哪項活動？","correct":"BIO-B01-Ch1.1.1-S038:C","options":[{"id":"BIO-B01-Ch1.1.1-S038:A","text":"將葉片分成組織","explanation":"翅膀構造與植物組織切分無關。"},{"id":"BIO-B01-Ch1.1.1-S038:B","text":"把身體變成原核細胞","explanation":"翅膀運動不改變細胞類型。"},{"id":"BIO-B01-Ch1.1.1-S038:C","text":"懸停取食花蜜","explanation":"這種翅膀活動支援懸停。"},{"id":"BIO-B01-Ch1.1.1-S038:D","text":"不再依賴任何細胞活動","explanation":"個體運動仍以細胞活動為基礎。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S039","topicId":"","stem":"構造功能關係可以在哪些層級討論？","correct":"BIO-B01-Ch1.1.1-S039:A","options":[{"id":"BIO-B01-Ch1.1.1-S039:A","text":"分子、胞器、細胞與器官等多個層級","explanation":"此關係可跨生物組織層級分析。"},{"id":"BIO-B01-Ch1.1.1-S039:B","text":"只有器官","explanation":"胞器及分子等層級也適用。"},{"id":"BIO-B01-Ch1.1.1-S039:C","text":"只有個體","explanation":"個體以下仍存在構造功能關係。"},{"id":"BIO-B01-Ch1.1.1-S039:D","text":"只能用在無生命物體","explanation":"生命系統也有明確構造功能關係。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S040","topicId":"","stem":"閱讀一個構造的圖示時，哪個問題最能連到本節觀念？","correct":"BIO-B01-Ch1.1.1-S040:D","options":[{"id":"BIO-B01-Ch1.1.1-S040:A","text":"它的中文有多少筆畫","explanation":"字形不是生物功能證據。"},{"id":"BIO-B01-Ch1.1.1-S040:B","text":"如何只記外觀而不問功能","explanation":"只記外觀會漏掉功能關聯。"},{"id":"BIO-B01-Ch1.1.1-S040:C","text":"它的標籤能否全部刪掉","explanation":"刪標籤不等於理解構造。"},{"id":"BIO-B01-Ch1.1.1-S040:D","text":"它的形狀與排列如何支援功能","explanation":"以構造如何支援功能作提問符合原則。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S041","topicId":"","stem":"葉肉細胞內含葉綠體，這項觀察最直接把哪兩件事連起來？","correct":"BIO-B01-Ch1.1.1-S041:B","options":[{"id":"BIO-B01-Ch1.1.1-S041:A","text":"族群與同種條件","explanation":"葉綠體不是族群條件。"},{"id":"BIO-B01-Ch1.1.1-S041:B","text":"細胞內構造與光合作用功能","explanation":"葉綠體位於葉肉細胞內並支援光合作用。"},{"id":"BIO-B01-Ch1.1.1-S041:C","text":"生物圈與命名","explanation":"此觀察不是全球命名問題。"},{"id":"BIO-B01-Ch1.1.1-S041:D","text":"DNA序列與考試分數","explanation":"題幹沒有DNA序列資料。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S042","topicId":"","stem":"能執行維持生命所需基本活動的最小組織單位是什麼？","correct":"BIO-B01-Ch1.1.1-S042:C","options":[{"id":"BIO-B01-Ch1.1.1-S042:A","text":"分子","explanation":"分子不是最小完整生命單位。"},{"id":"BIO-B01-Ch1.1.1-S042:B","text":"胞器","explanation":"胞器只執行部分功能。"},{"id":"BIO-B01-Ch1.1.1-S042:C","text":"細胞","explanation":"細胞是生命的基本結構與功能單位。"},{"id":"BIO-B01-Ch1.1.1-S042:D","text":"器官","explanation":"器官比細胞層級高，不是最小。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S043","topicId":"","stem":"依本節細胞學說，所有生物的構成共同基礎是什麼？","correct":"BIO-B01-Ch1.1.1-S043:A","options":[{"id":"BIO-B01-Ch1.1.1-S043:A","text":"細胞","explanation":"所有生物都由細胞構成。"},{"id":"BIO-B01-Ch1.1.1-S043:B","text":"葉綠體","explanation":"非所有生物有葉綠體。"},{"id":"BIO-B01-Ch1.1.1-S043:C","text":"葉片","explanation":"葉片是部分植物的器官。"},{"id":"BIO-B01-Ch1.1.1-S043:D","text":"器官系統","explanation":"單細胞生物不具有器官系統。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S044","topicId":"","stem":"胞器能執行特定工作，為何仍不取代細胞成為最小完整生命單位？","correct":"BIO-B01-Ch1.1.1-S044:D","options":[{"id":"BIO-B01-Ch1.1.1-S044:A","text":"胞器完全沒有功能","explanation":"胞器具有特定功能。"},{"id":"BIO-B01-Ch1.1.1-S044:B","text":"胞器一定比細胞大","explanation":"胞器位於細胞內，並非更高層級。"},{"id":"BIO-B01-Ch1.1.1-S044:C","text":"胞器都是完整個體","explanation":"胞器不是獨立完整生物。"},{"id":"BIO-B01-Ch1.1.1-S044:D","text":"單獨胞器不能完成所有基本生命活動","explanation":"部分功能不等於完整基本生命活動。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S045","topicId":"","stem":"單細胞生物的基本生命活動由哪一層級完成？","correct":"BIO-B01-Ch1.1.1-S045:B","options":[{"id":"BIO-B01-Ch1.1.1-S045:A","text":"必須先形成組織","explanation":"單細胞生物不必先有組織。"},{"id":"BIO-B01-Ch1.1.1-S045:B","text":"同一個細胞","explanation":"一個細胞即可構成單細胞生物並進行生命活動。"},{"id":"BIO-B01-Ch1.1.1-S045:C","text":"必須先形成葉片","explanation":"葉片並非單細胞生物的必要構造。"},{"id":"BIO-B01-Ch1.1.1-S045:D","text":"只由游離分子清單完成","explanation":"清單不是運作中的細胞。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S046","topicId":"","stem":"多細胞生物的各種細胞，主要如何共同支持個體活動？","correct":"BIO-B01-Ch1.1.1-S046:C","options":[{"id":"BIO-B01-Ch1.1.1-S046:A","text":"每一種細胞都獨自完成整個個體的一切功能","explanation":"特化細胞不必各自完成整個個體全部功能。"},{"id":"BIO-B01-Ch1.1.1-S046:B","text":"所有細胞都只是沒有功能的填充物","explanation":"細胞具有功能並支持個體活動。"},{"id":"BIO-B01-Ch1.1.1-S046:C","text":"分工合作","explanation":"多細胞生物以特化細胞分工合作。"},{"id":"BIO-B01-Ch1.1.1-S046:D","text":"每個細胞都是獨立生態系","explanation":"細胞不等於生態系層級。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S047","topicId":"","stem":"原核與真核細胞最基本的構造判別重點之一為何？","correct":"BIO-B01-Ch1.1.1-S047:A","options":[{"id":"BIO-B01-Ch1.1.1-S047:A","text":"有無膜包圍的細胞核","explanation":"真核具有膜包圍細胞核，原核沒有。"},{"id":"BIO-B01-Ch1.1.1-S047:B","text":"是否都由原子構成","explanation":"兩者都由物質構成，不能據此區分。"},{"id":"BIO-B01-Ch1.1.1-S047:C","text":"是否有體積","explanation":"兩者都有體積。"},{"id":"BIO-B01-Ch1.1.1-S047:D","text":"是否能被命名","explanation":"名稱不是構造差別。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S048","topicId":"","stem":"哪項正確描述原核細胞？","correct":"BIO-B01-Ch1.1.1-S048:D","options":[{"id":"BIO-B01-Ch1.1.1-S048:A","text":"沒有DNA","explanation":"原核細胞具有DNA。"},{"id":"BIO-B01-Ch1.1.1-S048:B","text":"具有膜包圍細胞核","explanation":"原核沒有膜包圍細胞核。"},{"id":"BIO-B01-Ch1.1.1-S048:C","text":"一定不是生物","explanation":"細菌與古菌都是生物。"},{"id":"BIO-B01-Ch1.1.1-S048:D","text":"有DNA，但沒有膜包圍的細胞核","explanation":"缺少的是細胞核，並非DNA。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S049","topicId":"","stem":"本節把細菌與古菌歸入哪一類？","correct":"BIO-B01-Ch1.1.1-S049:B","options":[{"id":"BIO-B01-Ch1.1.1-S049:A","text":"都是真核細胞","explanation":"細菌與古菌均為原核。"},{"id":"BIO-B01-Ch1.1.1-S049:B","text":"都屬原核生物","explanation":"兩群的細胞缺少膜包圍的細胞核。"},{"id":"BIO-B01-Ch1.1.1-S049:C","text":"都是葉綠體","explanation":"葉綠體是胞器，不是這兩群生物。"},{"id":"BIO-B01-Ch1.1.1-S049:D","text":"都是器官","explanation":"它們可為單細胞生物，不是器官。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S050","topicId":"","stem":"觀察典型真核細胞時，哪項構造特徵符合本節描述？","correct":"BIO-B01-Ch1.1.1-S050:C","options":[{"id":"BIO-B01-Ch1.1.1-S050:A","text":"沒有任何內部構造","explanation":"真核細胞具有內部構造。"},{"id":"BIO-B01-Ch1.1.1-S050:B","text":"DNA必定完全不存在","explanation":"真核細胞有DNA。"},{"id":"BIO-B01-Ch1.1.1-S050:C","text":"有細胞核及膜狀胞器","explanation":"膜包圍細胞核及胞器是本節判斷重點。"},{"id":"BIO-B01-Ch1.1.1-S050:D","text":"所有構造都等於一個葉綠素分子","explanation":"細胞是多成分構成，不等於單分子。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1.1.1-B001","topicId":"","stem":"某同學先觀察整片葉，再看葉片表皮的細胞群，最後看其中一個細胞。觀察尺度依序如何變化？","correct":"BIO-B01-Ch1.1.1-B001:A","options":[{"id":"BIO-B01-Ch1.1.1-B001:A","text":"器官→組織→細胞","explanation":"整片葉是器官，表皮是組織，其中單一細胞是細胞。"},{"id":"BIO-B01-Ch1.1.1-B001:B","text":"組織→器官→胞器","explanation":"前兩項分類反了，末項也非胞器。"},{"id":"BIO-B01-Ch1.1.1-B001:C","text":"個體→族群→細胞","explanation":"一片葉不是完整植物個體，表皮也不是族群。"},{"id":"BIO-B01-Ch1.1.1-B001:D","text":"胞器→分子→器官","explanation":"所列三者都不符題幹對象。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B002","topicId":"","stem":"甲是一群合作的葉表皮細胞，乙是含甲及其他組織的完整葉片。哪項比較正確？","correct":"BIO-B01-Ch1.1.1-B002:C","options":[{"id":"BIO-B01-Ch1.1.1-B002:A","text":"甲是器官，乙是組織","explanation":"甲乙層級被顛倒。"},{"id":"BIO-B01-Ch1.1.1-B002:B","text":"甲是族群，乙是群集","explanation":"此處是個體內細胞與組織，不是物種族群。"},{"id":"BIO-B01-Ch1.1.1-B002:C","text":"甲是組織，乙是器官","explanation":"細胞群合作成組織，多種組織形成葉器官。"},{"id":"BIO-B01-Ch1.1.1-B002:D","text":"甲是分子，乙是胞器","explanation":"甲乙均高於分子及胞器。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B003","topicId":"","stem":"影像甲顯示一個葉肉細胞，影像乙放大甲內的一個葉綠體。從甲到乙是何種尺度切換？","correct":"BIO-B01-Ch1.1.1-B003:B","options":[{"id":"BIO-B01-Ch1.1.1-B003:A","text":"胞器到細胞","explanation":"此列方向相反。"},{"id":"BIO-B01-Ch1.1.1-B003:B","text":"細胞到胞器","explanation":"從細胞看其內部胞器，尺度降低。"},{"id":"BIO-B01-Ch1.1.1-B003:C","text":"組織到器官","explanation":"沒有由細胞群看整片器官。"},{"id":"BIO-B01-Ch1.1.1-B003:D","text":"分子到群集","explanation":"兩影像均非此組對象。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B004","topicId":"","stem":"研究者已定位一個葉綠體，接著研究它所含葉綠素的化學結構。研究單位如何改變？","correct":"BIO-B01-Ch1.1.1-B004:D","options":[{"id":"BIO-B01-Ch1.1.1-B004:A","text":"分子到胞器","explanation":"方向與題幹相反。"},{"id":"BIO-B01-Ch1.1.1-B004:B","text":"器官到組織","explanation":"葉綠體不是器官，葉綠素不是組織。"},{"id":"BIO-B01-Ch1.1.1-B004:C","text":"細胞到器官","explanation":"兩個對象皆不是此組層級。"},{"id":"BIO-B01-Ch1.1.1-B004:D","text":"胞器到分子","explanation":"從葉綠體功能構造縮小至葉綠素分子。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B005","topicId":"","stem":"有人把「一株樹」和「這株樹的一片葉」都歸為器官。應如何更正？","correct":"BIO-B01-Ch1.1.1-B005:A","options":[{"id":"BIO-B01-Ch1.1.1-B005:A","text":"整株是個體，葉是器官","explanation":"完整單一生物是個體，葉是其多組織器官。"},{"id":"BIO-B01-Ch1.1.1-B005:B","text":"兩者都是分子","explanation":"兩者都遠高於分子層級。"},{"id":"BIO-B01-Ch1.1.1-B005:C","text":"整株是器官，葉是個體","explanation":"個體和器官被顛倒。"},{"id":"BIO-B01-Ch1.1.1-B005:D","text":"整株是族群，葉是群集","explanation":"單株與單葉都不是多個個體的集合。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-5 頁（PDF 53-54 頁）｜本節筆記 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B006","topicId":"","stem":"某片葉有多種組織。學生說每種組織都必須由外形完全相同的細胞構成才算組織。依本節應採哪個判準？","correct":"BIO-B01-Ch1.1.1-B006:C","options":[{"id":"BIO-B01-Ch1.1.1-B006:A","text":"細胞顏色全部相同","explanation":"相同顏色不是組織定義。"},{"id":"BIO-B01-Ch1.1.1-B006:B","text":"細胞必須互不影響","explanation":"組織強調合作而非互不影響。"},{"id":"BIO-B01-Ch1.1.1-B006:C","text":"一群細胞合作執行特定功能","explanation":"功能性合作是判斷核心，不要求外形完全一致。"},{"id":"BIO-B01-Ch1.1.1-B006:D","text":"細胞數量固定為十個","explanation":"組織沒有固定十個細胞的定義。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B007","topicId":"","stem":"哪個配對可同時符合「構造」及其「直接層級」？","correct":"BIO-B01-Ch1.1.1-B007:B","options":[{"id":"BIO-B01-Ch1.1.1-B007:A","text":"葉綠體—器官；葉片—胞器","explanation":"葉綠體與葉片層級顛倒。"},{"id":"BIO-B01-Ch1.1.1-B007:B","text":"葉綠素—分子；葉綠體—胞器","explanation":"葉綠素是分子，葉綠體是細胞內胞器。"},{"id":"BIO-B01-Ch1.1.1-B007:C","text":"葉表皮—族群；葉片—群集","explanation":"表皮與葉片不是生態集合層級。"},{"id":"BIO-B01-Ch1.1.1-B007:D","text":"整株植物—組織；葉肉細胞—器官","explanation":"整株是個體，葉肉細胞是細胞。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B008","topicId":"","stem":"筆記圖把原子、分子、胞器、細胞放入「含化學層級」的示意。哪個解讀最妥當？","correct":"BIO-B01-Ch1.1.1-B008:D","options":[{"id":"BIO-B01-Ch1.1.1-B008:A","text":"原子已是完整生命","explanation":"原子不是完整生命單位。"},{"id":"BIO-B01-Ch1.1.1-B008:B","text":"胞器與細胞是同義詞","explanation":"胞器是細胞內構造，兩者不同。"},{"id":"BIO-B01-Ch1.1.1-B008:C","text":"分子一定比個體更高階","explanation":"分子層級低於個體。"},{"id":"BIO-B01-Ch1.1.1-B008:D","text":"原子可作化學補充，但本節標準生命層級微觀端為分子","explanation":"原圖的化學補充不改變標準層級定位。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-5 頁（PDF 53-54 頁）｜本節筆記 正文第1頁（正式第3張，10_imagegen_page_03.png）; 正文第2頁（正式第4張，11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B009","topicId":"","stem":"甲包含多種組織並執行整片葉的功能，乙是甲內一個細胞的葉綠體。甲與乙之間有何關係？","correct":"BIO-B01-Ch1.1.1-B009:A","options":[{"id":"BIO-B01-Ch1.1.1-B009:A","text":"甲是器官，乙是較低層級的胞器","explanation":"器官內的細胞含胞器，因此甲比乙層級高。"},{"id":"BIO-B01-Ch1.1.1-B009:B","text":"甲是胞器，乙是較高層級器官","explanation":"器官與胞器的定位相反。"},{"id":"BIO-B01-Ch1.1.1-B009:C","text":"甲乙均為同一個組織","explanation":"甲乙都不是同一組織。"},{"id":"BIO-B01-Ch1.1.1-B009:D","text":"乙內必定包含完整的甲","explanation":"完整葉不在單一葉綠體內。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B010","topicId":"","stem":"某觀察紀錄寫成「葉片→葉表皮→表皮細胞→細胞內功能構造」。這是怎樣的分析？","correct":"BIO-B01-Ch1.1.1-B010:C","options":[{"id":"BIO-B01-Ch1.1.1-B010:A","text":"逐步擴至更多物種","explanation":"紀錄仍限同一植物構造。"},{"id":"BIO-B01-Ch1.1.1-B010:B","text":"由分子逐步升至生物圈","explanation":"起點為器官，方向往微觀端。"},{"id":"BIO-B01-Ch1.1.1-B010:C","text":"從器官逐步深入較低層級","explanation":"器官、組織、細胞、胞器依序降低。"},{"id":"BIO-B01-Ch1.1.1-B010:D","text":"把器官直接變成另一物種","explanation":"尺度切換不代表物種轉變。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B011","topicId":"","stem":"四張卡寫著「分子、細胞、組織、器官」。若按由低到高排列，哪張卡應位於細胞與器官之間？","correct":"BIO-B01-Ch1.1.1-B011:B","options":[{"id":"BIO-B01-Ch1.1.1-B011:A","text":"分子","explanation":"分子在細胞之下。"},{"id":"BIO-B01-Ch1.1.1-B011:B","text":"組織","explanation":"組織由細胞合作形成，並組成器官。"},{"id":"BIO-B01-Ch1.1.1-B011:C","text":"生物圈","explanation":"生物圈高於個體等層級。"},{"id":"BIO-B01-Ch1.1.1-B011:D","text":"個體","explanation":"個體包含器官，不在兩者之間。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B012","topicId":"","stem":"某葉的表皮與內部光合作用組織執行不同工作，兩者一起構成葉。這最直接支持哪個判斷？","correct":"BIO-B01-Ch1.1.1-B012:D","options":[{"id":"BIO-B01-Ch1.1.1-B012:A","text":"葉必須只由一種組織構成","explanation":"題幹明示至少兩種組織。"},{"id":"BIO-B01-Ch1.1.1-B012:B","text":"各組織必須有完全相同功能","explanation":"不同組織可有不同貢獻。"},{"id":"BIO-B01-Ch1.1.1-B012:C","text":"葉是一個物種族群","explanation":"葉是個體內器官，不是個體集合。"},{"id":"BIO-B01-Ch1.1.1-B012:D","text":"器官功能可由多種組織共同支持","explanation":"多種組織分工貢獻同一器官功能。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B013","topicId":"","stem":"把「細胞內的葉綠體」誤寫成「由多種組織構成的器官」，主要混淆何者？","correct":"BIO-B01-Ch1.1.1-B013:A","options":[{"id":"BIO-B01-Ch1.1.1-B013:A","text":"胞器與器官","explanation":"葉綠體為胞器，多組織構造為器官。"},{"id":"BIO-B01-Ch1.1.1-B013:B","text":"族群與群集","explanation":"題目未涉及同種或多種集合。"},{"id":"BIO-B01-Ch1.1.1-B013:C","text":"個體與生物圈","explanation":"沒有比較單一生物與全球。"},{"id":"BIO-B01-Ch1.1.1-B013:D","text":"細胞與物種","explanation":"錯誤重點是胞器與器官而非物種。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B014","topicId":"","stem":"若放大一片葉後看到一群合作的細胞，尚未分辨每個細胞的內部胞器，此時最直接觀察哪一層級？","correct":"BIO-B01-Ch1.1.1-B014:C","options":[{"id":"BIO-B01-Ch1.1.1-B014:A","text":"生態系","explanation":"沒有區域生物和非生物環境。"},{"id":"BIO-B01-Ch1.1.1-B014:B","text":"分子","explanation":"看到的是細胞群而不是原子結合。"},{"id":"BIO-B01-Ch1.1.1-B014:C","text":"組織","explanation":"合作的細胞群符合組織層級。"},{"id":"BIO-B01-Ch1.1.1-B014:D","text":"生物圈","explanation":"沒有全球生命的尺度。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B015","topicId":"","stem":"某圖的框線由外至內標示「葉→組織→細胞→葉綠體」。哪個說明正確？","correct":"BIO-B01-Ch1.1.1-B015:B","options":[{"id":"BIO-B01-Ch1.1.1-B015:A","text":"每個內框都應包含外框全部內容","explanation":"包含關係是外層包含內層，非相反。"},{"id":"BIO-B01-Ch1.1.1-B015:B","text":"外層構造包含內層構成，層級逐步降低","explanation":"器官經組織、細胞深入至胞器，符合層級關係。"},{"id":"BIO-B01-Ch1.1.1-B015:C","text":"四個名稱其實屬同一層級","explanation":"各名稱代表不同層級。"},{"id":"BIO-B01-Ch1.1.1-B015:D","text":"這表示葉綠體會直接長成一片葉","explanation":"結構包含圖不代表發育轉變。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B016","topicId":"","stem":"「一片葉」與「同一棵植物的多片葉」相比，單片葉的層級是否因葉片數改變？","correct":"BIO-B01-Ch1.1.1-B016:D","options":[{"id":"BIO-B01-Ch1.1.1-B016:A","text":"會，兩片葉就各自變成族群","explanation":"器官數增加不把器官變同種個體群。"},{"id":"BIO-B01-Ch1.1.1-B016:B","text":"會，一片葉永遠是分子","explanation":"單片葉包含細胞與組織，不是分子。"},{"id":"BIO-B01-Ch1.1.1-B016:C","text":"會，三片葉就都變細胞","explanation":"數量不改每片葉的構造層級。"},{"id":"BIO-B01-Ch1.1.1-B016:D","text":"不會，單片葉仍是器官","explanation":"分類以構造身分判定，不因旁邊多了葉而變更。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-5 頁（PDF 53-54 頁）｜本節筆記 正文第3頁（正式第5張，12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B017","topicId":"","stem":"甲記錄同日同池全部某種魚；乙記錄同池所有物種族群。甲乙的尺度如何對應？","correct":"BIO-B01-Ch1.1.1-B017:A","options":[{"id":"BIO-B01-Ch1.1.1-B017:A","text":"甲族群，乙群集","explanation":"甲限一種，乙含各物種，分別為族群及群集。"},{"id":"BIO-B01-Ch1.1.1-B017:B","text":"甲群集，乙族群","explanation":"同種與多物種條件被顛倒。"},{"id":"BIO-B01-Ch1.1.1-B017:C","text":"甲生態系，乙分子","explanation":"甲未納非生物環境，乙也非分子。"},{"id":"BIO-B01-Ch1.1.1-B017:D","text":"甲器官，乙組織","explanation":"題意是個體集合，不是個體內構造。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B018","topicId":"","stem":"原紀錄已包含森林內各物種族群，後來加入土壤含水量及光照。研究範圍的名稱最適合從何者改為何者？","correct":"BIO-B01-Ch1.1.1-B018:C","options":[{"id":"BIO-B01-Ch1.1.1-B018:A","text":"族群→細胞","explanation":"前後都不是細胞研究。"},{"id":"BIO-B01-Ch1.1.1-B018:B","text":"生態系→族群","explanation":"納入環境使範圍擴充，非縮為同種個體。"},{"id":"BIO-B01-Ch1.1.1-B018:C","text":"群集→生態系","explanation":"群集加非生物環境形成生態系範圍。"},{"id":"BIO-B01-Ch1.1.1-B018:D","text":"器官→個體","explanation":"非個體內層級的轉換。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B019","topicId":"","stem":"學生把同池的蛙、魚、植物及微生物各族群統稱一個族群。應指出什麼錯誤？","correct":"BIO-B01-Ch1.1.1-B019:B","options":[{"id":"BIO-B01-Ch1.1.1-B019:A","text":"微生物不能列為生物","explanation":"微生物也是生物群集的成員。"},{"id":"BIO-B01-Ch1.1.1-B019:B","text":"族群限同種；各物種族群總和應稱群集","explanation":"題幹跨多物種，符合群集而非單一族群。"},{"id":"BIO-B01-Ch1.1.1-B019:C","text":"池塘內不能有族群","explanation":"可依同種個體界定池塘內族群。"},{"id":"BIO-B01-Ch1.1.1-B019:D","text":"只要個體多就必須稱生物圈","explanation":"個體數多不代表全球尺度。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B020","topicId":"","stem":"同一草地上有一種草及一種鹿的全部個體。若兩者分開按物種記錄，至少形成幾個族群單位？","correct":"BIO-B01-Ch1.1.1-B020:D","options":[{"id":"BIO-B01-Ch1.1.1-B020:A","text":"只能一個，因為地點相同","explanation":"同地點不消除不同物種界線。"},{"id":"BIO-B01-Ch1.1.1-B020:B","text":"零個，植物不能形成族群","explanation":"植物同種個體也可形成族群。"},{"id":"BIO-B01-Ch1.1.1-B020:C","text":"一個器官","explanation":"草與鹿不是一個器官的組成。"},{"id":"BIO-B01-Ch1.1.1-B020:D","text":"兩個，分別對應兩個物種","explanation":"依題幹兩個不同物種，各有一個族群。"}],"concept":"","example":"物種分開記錄：草族群＋鹿族群。","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B021","topicId":"","stem":"一份清單只有池塘的魚、植物、細菌等各物種生物，沒有環境資料。它直接描述什麼？","correct":"BIO-B01-Ch1.1.1-B021:A","options":[{"id":"BIO-B01-Ch1.1.1-B021:A","text":"群集；若要描述生態系還須納入非生物環境","explanation":"生物部分是群集，生態系定義另含環境。"},{"id":"BIO-B01-Ch1.1.1-B021:B","text":"生態系；非生物項目不屬於其定義","explanation":"非生物環境正是生態系定義的一部分。"},{"id":"BIO-B01-Ch1.1.1-B021:C","text":"族群；只要在同池就是同種","explanation":"同池不代表同種。"},{"id":"BIO-B01-Ch1.1.1-B021:D","text":"生物圈；只要有微生物就是全球","explanation":"微生物的出現不使區域變成全球。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B022","topicId":"","stem":"研究者把一整片森林生態系中的非生物因素暫時排除，只討論所有生物族群。剩下的研究範圍最貼近哪一層級？","correct":"BIO-B01-Ch1.1.1-B022:C","options":[{"id":"BIO-B01-Ch1.1.1-B022:A","text":"分子","explanation":"仍為多種生物集合，非分子。"},{"id":"BIO-B01-Ch1.1.1-B022:B","text":"單一個體","explanation":"排除環境未把多個生物縮為一個。"},{"id":"BIO-B01-Ch1.1.1-B022:C","text":"群集","explanation":"生態系中的生物群組是群集。"},{"id":"BIO-B01-Ch1.1.1-B022:D","text":"一個胞器","explanation":"沒有改成細胞內構造研究。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B023","topicId":"","stem":"下列哪項改動會使「同日同地某種植物的全部個體」的描述跨出單一族群？","correct":"BIO-B01-Ch1.1.1-B023:B","options":[{"id":"BIO-B01-Ch1.1.1-B023:A","text":"補記該種植物的數量","explanation":"計數仍只針對同種族群。"},{"id":"BIO-B01-Ch1.1.1-B023:B","text":"加入同地其他物種的全部族群","explanation":"加入其他物種後變成多族群範圍。"},{"id":"BIO-B01-Ch1.1.1-B023:C","text":"將同一物種個體依序編號","explanation":"編號不改物種組成。"},{"id":"BIO-B01-Ch1.1.1-B023:D","text":"確認仍為同一物種","explanation":"確認同種不擴大範圍。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B024","topicId":"","stem":"在同一時間同一地區，甲是全部某種樹，乙是所有物種族群，丙是乙連同水土光。哪個配對正確？","correct":"BIO-B01-Ch1.1.1-B024:D","options":[{"id":"BIO-B01-Ch1.1.1-B024:A","text":"甲群集、乙族群、丙細胞","explanation":"同種多種和環境都對應錯誤。"},{"id":"BIO-B01-Ch1.1.1-B024:B","text":"甲個體、乙器官、丙組織","explanation":"甲乙丙是個體以上的生態尺度。"},{"id":"BIO-B01-Ch1.1.1-B024:C","text":"甲生物圈、乙個體、丙分子","explanation":"題幹不含全球尺度或分子。"},{"id":"BIO-B01-Ch1.1.1-B024:D","text":"甲族群、乙群集、丙生態系","explanation":"同種、各物種、加非生物環境依序對應三層級。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B025","topicId":"","stem":"「一處沙漠的群集」可以包含細菌嗎？哪個理由最恰當？","correct":"BIO-B01-Ch1.1.1-B025:A","options":[{"id":"BIO-B01-Ch1.1.1-B025:A","text":"可以，群集涵蓋該區域各物種族群，不限肉眼可見生物","explanation":"群集包含各類生物，細菌也在其中。"},{"id":"BIO-B01-Ch1.1.1-B025:B","text":"不可以，群集只含動物","explanation":"群集不限動物。"},{"id":"BIO-B01-Ch1.1.1-B025:C","text":"不可以，群集必須排除單細胞生物","explanation":"單細胞生物也可形成族群並屬群集。"},{"id":"BIO-B01-Ch1.1.1-B025:D","text":"可以，但有細菌就不能再有植物","explanation":"細菌與植物可同屬該區域群集。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B026","topicId":"","stem":"某報告比較「單一森林內的生命與環境」及「全球所有生命與其環境」。兩者最適合分別稱為何者？","correct":"BIO-B01-Ch1.1.1-B026:C","options":[{"id":"BIO-B01-Ch1.1.1-B026:A","text":"個體與族群","explanation":"兩者都涵蓋非生物環境，不是這組單位。"},{"id":"BIO-B01-Ch1.1.1-B026:B","text":"族群與組織","explanation":"第二者是全球尺度，不是組織。"},{"id":"BIO-B01-Ch1.1.1-B026:C","text":"生態系與生物圈","explanation":"一處完整區域系統對應生態系，全球總體對應生物圈。"},{"id":"BIO-B01-Ch1.1.1-B026:D","text":"群集與細胞","explanation":"前者含環境，後者不是細胞。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B027","topicId":"","stem":"「群集包含非生物環境，而生態系只包含同種個體」應如何訂正？","correct":"BIO-B01-Ch1.1.1-B027:B","options":[{"id":"BIO-B01-Ch1.1.1-B027:A","text":"兩句皆正確","explanation":"兩句都混淆層級定義。"},{"id":"BIO-B01-Ch1.1.1-B027:B","text":"群集是各物種族群總和；生態系還包含非生物環境","explanation":"群集先取生物部分，生態系再包括環境。"},{"id":"BIO-B01-Ch1.1.1-B027:C","text":"群集是器官；生態系是組織","explanation":"群集和生態系皆非個體內構造。"},{"id":"BIO-B01-Ch1.1.1-B027:D","text":"只需把同種改成單一細胞","explanation":"單一細胞仍不等同生態系。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B028","topicId":"","stem":"同日同地有某種樹50株，新增10株同種樹後，單就分類範圍而言，下列何者成立？","correct":"BIO-B01-Ch1.1.1-B028:D","options":[{"id":"BIO-B01-Ch1.1.1-B028:A","text":"必定變為群集","explanation":"個體數增加未增加物種。"},{"id":"BIO-B01-Ch1.1.1-B028:B","text":"必定變為生態系","explanation":"數量增加未把環境納入定義。"},{"id":"BIO-B01-Ch1.1.1-B028:C","text":"從族群變成器官","explanation":"生態集合不會變成器官。"},{"id":"BIO-B01-Ch1.1.1-B028:D","text":"仍是該物種的族群","explanation":"同種同區同時條件不變，數量為60株仍屬族群。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B029","topicId":"","stem":"同一濕地的甲清單有各種生物，乙清單另有水、土壤及光。要描述生態系，最適當做法是什麼？","correct":"BIO-
