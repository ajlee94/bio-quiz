境","explanation":"土壤、空氣等與生物體之間可有物質往返。"},{"id":"BIO-B01-Ch1.1.3-S031:B","text":"只有活的動物之間","explanation":"還包括植物與非生物環境。"},{"id":"BIO-B01-Ch1.1.3-S031:C","text":"只有太陽內部","explanation":"本節循環發生於生態系生物與環境間。"},{"id":"BIO-B01-Ch1.1.3-S031:D","text":"只有生物體內而不涉及環境","explanation":"環境是循環的一部分。"}],"concept":"","example":"植物吸收、動物取食與分解皆連結不同場所。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S032","topicId":"","stem":"動物吃植物後，植物中的物質可能移向哪裡？","correct":"BIO-B01-Ch1.1.3-S032:B","options":[{"id":"BIO-B01-Ch1.1.3-S032:A","text":"必定變成太陽光","explanation":"取食不把全部物質變成陽光。"},{"id":"BIO-B01-Ch1.1.3-S032:B","text":"動物體內","explanation":"取食可把植物物質帶入動物。"},{"id":"BIO-B01-Ch1.1.3-S032:C","text":"完全不存在","explanation":"物質沒有因取食就消失。"},{"id":"BIO-B01-Ch1.1.3-S032:D","text":"永遠只能留在植物","explanation":"已被吃入的物質可進入動物。"}],"concept":"","example":"取食除了能量傳遞，也會轉移物質。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S033","topicId":"","stem":"完成「物質回到環境」後，哪個事件可接續形成循環？","correct":"BIO-B01-Ch1.1.3-S033:C","options":[{"id":"BIO-B01-Ch1.1.3-S033:A","text":"環境中的熱全部變成新能量","explanation":"這不符合能量原則。"},{"id":"BIO-B01-Ch1.1.3-S033:B","text":"植物永遠停止吸收","explanation":"停止吸收不會接續該循環。"},{"id":"BIO-B01-Ch1.1.3-S033:C","text":"植物再次吸收化學物質","explanation":"物質回收後可再進入植物體內。"},{"id":"BIO-B01-Ch1.1.3-S033:D","text":"物質完全從宇宙消失","explanation":"循環不等於物質消滅。"}],"concept":"","example":"回到土壤的成分可再被植物利用。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S034","topicId":"","stem":"化學物質循環的「再利用」，最合適的意思是什麼？","correct":"BIO-B01-Ch1.1.3-S034:D","options":[{"id":"BIO-B01-Ch1.1.3-S034:A","text":"同一食物分子必須永遠不改變","explanation":"循環容許分子轉換，不要求原分子不變。"},{"id":"BIO-B01-Ch1.1.3-S034:B","text":"能量一定全部回到起點","explanation":"物質再利用不等於能量循環。"},{"id":"BIO-B01-Ch1.1.3-S034:C","text":"化學成分只能用一次","explanation":"這否定了循環。"},{"id":"BIO-B01-Ch1.1.3-S034:D","text":"化學成分可返回環境再進入生物","explanation":"原子及成分可在不同形式中被回收。"}],"concept":"","example":"分解後的成分可重新組成植物分子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S035","topicId":"","stem":"下列哪個概念屬於物質路徑，而非能量形式？","correct":"BIO-B01-Ch1.1.3-S035:A","options":[{"id":"BIO-B01-Ch1.1.3-S035:A","text":"土壤中的礦物質被植物吸收","explanation":"這描述物質從環境進入生物。"},{"id":"BIO-B01-Ch1.1.3-S035:B","text":"光能轉成化學能","explanation":"這是能量形式轉換。"},{"id":"BIO-B01-Ch1.1.3-S035:C","text":"熱散到環境","explanation":"這是能量的散失。"},{"id":"BIO-B01-Ch1.1.3-S035:D","text":"化學能被用來做功","explanation":"這描述能量利用。"}],"concept":"","example":"判斷時先問追蹤的是化學成分還是能量。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S036","topicId":"","stem":"下列哪個路徑可示意本節的物質循環？","correct":"BIO-B01-Ch1.1.3-S036:B","options":[{"id":"BIO-B01-Ch1.1.3-S036:A","text":"光→植物→熱→太陽","explanation":"把能量畫成返回太陽不符合本節。"},{"id":"BIO-B01-Ch1.1.3-S036:B","text":"環境物質→植物→動物→分解→環境物質","explanation":"包含吸收、取食與分解返回環境。"},{"id":"BIO-B01-Ch1.1.3-S036:C","text":"熱→消費者→新陽光","explanation":"消費者不把熱製成新陽光。"},{"id":"BIO-B01-Ch1.1.3-S036:D","text":"植物→動物→物質永久消失","explanation":"物質不因被吃就永久消失。"}],"concept":"","example":"這是簡化路徑；落葉也可直接進入分解途徑。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S037","topicId":"","stem":"分解者對生態系物質循環的重要作用為何？","correct":"BIO-B01-Ch1.1.3-S037:C","options":[{"id":"BIO-B01-Ch1.1.3-S037:A","text":"創造太陽的光能","explanation":"分解者不創造太陽能。"},{"id":"BIO-B01-Ch1.1.3-S037:B","text":"讓全部物質不再被植物利用","explanation":"其作用相反，是促進回收。"},{"id":"BIO-B01-Ch1.1.3-S037:C","text":"使廢物與遺體的化學物質回到環境","explanation":"分解可讓成分重新進入環境。"},{"id":"BIO-B01-Ch1.1.3-S037:D","text":"把所有熱完整回收到食物","explanation":"分解者不完整回收散熱。"}],"concept":"","example":"細菌及真菌可分解死亡生物。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S038","topicId":"","stem":"哪一組是本節列出的分解者例子？","correct":"BIO-B01-Ch1.1.3-S038:D","options":[{"id":"BIO-B01-Ch1.1.3-S038:A","text":"太陽與雲","explanation":"非生物事物不是分解者。"},{"id":"BIO-B01-Ch1.1.3-S038:B","text":"土壤與空氣","explanation":"這些是環境，不是分解生物。"},{"id":"BIO-B01-Ch1.1.3-S038:C","text":"糖與礦物質","explanation":"兩者是物質，不是生態角色。"},{"id":"BIO-B01-Ch1.1.3-S038:D","text":"分解有機物的細菌與真菌","explanation":"教材以這些生物說明分解者。"}],"concept":"","example":"描述功能時應指出其分解有機物的活動。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S039","topicId":"","stem":"分解者分解廢物時，本身如何維持生命活動？","correct":"BIO-B01-Ch1.1.3-S039:A","options":[{"id":"BIO-B01-Ch1.1.3-S039:A","text":"利用有機物中的化學能","explanation":"分解者也是需要能量的生物。"},{"id":"BIO-B01-Ch1.1.3-S039:B","text":"完全不需要任何能量","explanation":"分解者的細胞工作需要能量。"},{"id":"BIO-B01-Ch1.1.3-S039:C","text":"從無創造能量","explanation":"不符合能量不憑空產生。"},{"id":"BIO-B01-Ch1.1.3-S039:D","text":"只把環境熱完整回收","explanation":"這不是其能量取得方式。"}],"concept":"","example":"分解過程也伴隨能量利用與散熱。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S040","topicId":"","stem":"分解者「回收」的主要對象，依本節比較是什麼？","correct":"BIO-B01-Ch1.1.3-S040:B","options":[{"id":"BIO-B01-Ch1.1.3-S040:A","text":"全部散失的熱","explanation":"熱不能被其直接完整回收。"},{"id":"BIO-B01-Ch1.1.3-S040:B","text":"化學物質","explanation":"分解將物質送回環境供再利用。"},{"id":"BIO-B01-Ch1.1.3-S040:C","text":"太陽本身","explanation":"分解者不回收太陽。"},{"id":"BIO-B01-Ch1.1.3-S040:D","text":"所有已經做過的功","explanation":"做功不是能如此回收的物質。"}],"concept":"","example":"回收養分不能被說成回收能量。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S041","topicId":"","stem":"「分解者只是清除垃圾，與循環無關。」哪種修正最好？","correct":"BIO-B01-Ch1.1.3-S041:C","options":[{"id":"BIO-B01-Ch1.1.3-S041:A","text":"分解者只會產生陽光","explanation":"不符合分解功能。"},{"id":"BIO-B01-Ch1.1.3-S041:B","text":"分解者讓物質永久消失","explanation":"分解是轉換及回收，不是消滅。"},{"id":"BIO-B01-Ch1.1.3-S041:C","text":"分解者使物質返回環境，支持再利用","explanation":"補出了與物質循環的重要連結。"},{"id":"BIO-B01-Ch1.1.3-S041:D","text":"分解者完全不做細胞工作","explanation":"分解者的生命活動也需能量。"}],"concept":"","example":"看到落葉變少，還要追蹤其成分去向。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）; 正式第12張／正文第10頁（19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S042","topicId":"","stem":"對分解者的敘述，哪一項正確？","correct":"BIO-B01-Ch1.1.3-S042:D","options":[{"id":"BIO-B01-Ch1.1.3-S042:A","text":"只參與物質循環，完全不利用能量","explanation":"它也利用化學能並散熱。"},{"id":"BIO-B01-Ch1.1.3-S042:B","text":"只參與能量流，不能讓養分返回環境","explanation":"其分解活動也促進物質回收。"},{"id":"BIO-B01-Ch1.1.3-S042:C","text":"所有熱都由它變回化學能","explanation":"它不具有完整回收散熱的功能。"},{"id":"BIO-B01-Ch1.1.3-S042:D","text":"參與物質循環，也參與能量流動","explanation":"物質回收與能量利用可在同一生物發生。"}],"concept":"","example":"同一分解者兼具兩條路徑中的角色。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁（15_imagegen_page_08.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S043","topicId":"","stem":"何者可成為本節分解者處理的有機物來源？","correct":"BIO-B01-Ch1.1.3-S043:A","options":[{"id":"BIO-B01-Ch1.1.3-S043:A","text":"廢物、落葉與死亡生物","explanation":"教材明列這些分解來源。"},{"id":"BIO-B01-Ch1.1.3-S043:B","text":"只有完整太陽光","explanation":"陽光不是被分解的有機物。"},{"id":"BIO-B01-Ch1.1.3-S043:C","text":"只有離開生態系的熱","explanation":"散熱不是分解的有機物。"},{"id":"BIO-B01-Ch1.1.3-S043:D","text":"完全沒有物質的空間","explanation":"分解需要實際有機物來源。"}],"concept":"","example":"植物落葉不必先被動物吃，便能成為分解來源。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S044","topicId":"","stem":"能量與物質在生態系中的典型差別是哪項？","correct":"BIO-B01-Ch1.1.3-S044:B","options":[{"id":"BIO-B01-Ch1.1.3-S044:A","text":"兩者都完全不動","explanation":"能量與物質都可轉移。"},{"id":"BIO-B01-Ch1.1.3-S044:B","text":"能量通常單向流動，物質可循環","explanation":"能量常最後散熱，化學成分可回收。"},{"id":"BIO-B01-Ch1.1.3-S044:C","text":"能量循環而物質必定消失","explanation":"把兩者特徵顛倒並誤稱物質消失。"},{"id":"BIO-B01-Ch1.1.3-S044:D","text":"兩者都由植物憑空製造","explanation":"生產者不創造能量或無中生有的物質。"}],"concept":"","example":"相同食物關係可同時傳遞能量與物質。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S045","topicId":"","stem":"研究者追蹤「光進入、熱離開」，最適合使用哪個標題？","correct":"BIO-B01-Ch1.1.3-S045:C","options":[{"id":"BIO-B01-Ch1.1.3-S045:A","text":"物質完整回收","explanation":"題述追蹤的是能量，不是化學成分回收。"},{"id":"BIO-B01-Ch1.1.3-S045:B","text":"分解者種類清單","explanation":"題目不是在列生物種類。"},{"id":"BIO-B01-Ch1.1.3-S045:C","text":"能量流動","explanation":"光與熱顯示能量的輸入與輸出。"},{"id":"BIO-B01-Ch1.1.3-S045:D","text":"物質從無產生","explanation":"未描述物質生成。"}],"concept":"","example":"標題應配合被追蹤的對象。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S046","topicId":"","stem":"研究者追蹤「吸收、取食、分解後再吸收」，最適合的主題為何？","correct":"BIO-B01-Ch1.1.3-S046:D","options":[{"id":"BIO-B01-Ch1.1.3-S046:A","text":"太陽能憑空增加","explanation":"這不是太陽能的生成。"},{"id":"BIO-B01-Ch1.1.3-S046:B","text":"環境熱完整重用","explanation":"循環化學成分不能推論熱重用。"},{"id":"BIO-B01-Ch1.1.3-S046:C","text":"只有動物運動","explanation":"還包含植物與分解過程。"},{"id":"BIO-B01-Ch1.1.3-S046:D","text":"化學物質循環","explanation":"描述成分在生物與環境間往返。"}],"concept":"","example":"物質的重複利用可用此路徑呈現。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S047","topicId":"","stem":"哪一句把能量與物質的特徵混淆了？","correct":"BIO-B01-Ch1.1.3-S047:A","options":[{"id":"BIO-B01-Ch1.1.3-S047:A","text":"能量會像礦物質一樣在生態系完整循環","explanation":"能量通常單向流動而非完整回收。"},{"id":"BIO-B01-Ch1.1.3-S047:B","text":"化學物質可經分解返回環境","explanation":"這是物質循環的正確描述。"},{"id":"BIO-B01-Ch1.1.3-S047:C","text":"生物利用化學能時會散熱","explanation":"符合能量轉換。"},{"id":"BIO-B01-Ch1.1.3-S047:D","text":"消費者可由食物取得物質","explanation":"食物同時含物質與化學能。"}],"concept":"","example":"完整回收的說法不能直接套在能量上。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第11張／正文第9頁（18_imagegen_page_11.png）; 正式第12張／正文第10頁（19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S048","topicId":"","stem":"哪一組「線索—觀念」配對正確？","correct":"BIO-B01-Ch1.1.3-S048:B","options":[{"id":"BIO-B01-Ch1.1.3-S048:A","text":"熱散失—物質憑空消失","explanation":"熱散失不表示物質消失。"},{"id":"BIO-B01-Ch1.1.3-S048:B","text":"熱散失—能量流動","explanation":"散熱是能量離開生態系的路徑。"},{"id":"BIO-B01-Ch1.1.3-S048:C","text":"礦物質被吸收—太陽能生成","explanation":"礦物質吸收屬物質轉移。"},{"id":"BIO-B01-Ch1.1.3-S048:D","text":"落葉被分解—熱全部回收","explanation":"分解回收物質而非全部熱。"}],"concept":"","example":"追蹤熱時，不把它當作土壤養分。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S049","topicId":"","stem":"圖上畫「土壤成分→植物→落葉分解→土壤成分」，箭頭應稱為何者？","correct":"BIO-B01-Ch1.1.3-S049:C","options":[{"id":"BIO-B01-Ch1.1.3-S049:A","text":"能量完整循環","explanation":"箭頭追蹤的是成分，不是能量。"},{"id":"BIO-B01-Ch1.1.3-S049:B","text":"陽光的返回路徑","explanation":"沒有追蹤光返回太陽。"},{"id":"BIO-B01-Ch1.1.3-S049:C","text":"物質循環的簡圖","explanation":"植物與土壤間的成分可經分解往返。"},{"id":"BIO-B01-Ch1.1.3-S049:D","text":"物質只能利用一次","explanation":"這與圖中回到土壤相反。"}],"concept":"","example":"循環不一定要每次都經過動物。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S050","topicId":"","stem":"把本節濃縮成一組配對，哪項最合適？","correct":"BIO-B01-Ch1.1.3-S050:D","options":[{"id":"BIO-B01-Ch1.1.3-S050:A","text":"能量—身體唯一原料；物質—毫無作用","explanation":"能量不能代替所有物質，物質也非無作用。"},{"id":"BIO-B01-Ch1.1.3-S050:B","text":"能量—由無創造；物質—必定消失","explanation":"兩個敘述都不符合本節。"},{"id":"BIO-B01-Ch1.1.3-S050:C","text":"能量—完整循環；物質—只能散熱","explanation":"混淆能量與物質的特徵。"},{"id":"BIO-B01-Ch1.1.3-S050:D","text":"能量—支援做功並常以熱離開；物質—構成身體並可回收","explanation":"同時呈現兩者的功能與路徑。"}],"concept":"","example":"身體的原料與工作所需能量應分開理解。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1.1.3-B001","topicId":"","stem":"幼苗未移動位置，卻持續形成新組織。哪項推論最合理？","correct":"BIO-B01-Ch1.1.3-B001:C","options":[{"id":"BIO-B01-Ch1.1.3-B001:A","text":"未移動，所以不需能量","explanation":"形成組織涉及生長與細胞工作，仍需能量。"},{"id":"BIO-B01-Ch1.1.3-B001:B","text":"只需能量，不需任何原料","explanation":"新組織必須有物質組成。"},{"id":"BIO-B01-Ch1.1.3-B001:C","text":"生長需要能量，也需要構成組織的物質","explanation":"能量支援工作，物質提供結構原料。"},{"id":"BIO-B01-Ch1.1.3-B001:D","text":"只需物質，細胞合成不涉及能量","explanation":"細胞合成等工作有能量需求。"}],"concept":"","example":"位置不變不能當作沒有生命活動的證據。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）; 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B002","topicId":"","stem":"兩個細胞外觀都沒有位移，其中一個正在分裂。能否由「沒有位移」斷定其不做功？","correct":"BIO-B01-Ch1.1.3-B002:A","options":[{"id":"BIO-B01-Ch1.1.3-B002:A","text":"不能，分裂本身就是需要能量的工作","explanation":"細胞活動的做功不限整個細胞位移。"},{"id":"BIO-B01-Ch1.1.3-B002:B","text":"能，做功只能指整個細胞移動","explanation":"把做功限縮成位移忽略細胞分裂。"},{"id":"BIO-B01-Ch1.1.3-B002:C","text":"能，只有動物肌肉會利用化學能","explanation":"植物與其他細胞也會利用化學能。"},{"id":"BIO-B01-Ch1.1.3-B002:D","text":"不能，因為分裂會創造能量","explanation":"結論雖是否定，但理由錯在創造能量。"}],"concept":"","example":"觀察細胞工作要看過程，不能只看外觀位置。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B003","topicId":"","stem":"有人主張「給幼苗足夠原料，它就不再需要任何能量輸入」。本節如何評估？","correct":"BIO-B01-Ch1.1.3-B003:D","options":[{"id":"BIO-B01-Ch1.1.3-B003:A","text":"正確，物質可取消所有做功","explanation":"有原料不表示工作不需能量。"},{"id":"BIO-B01-Ch1.1.3-B003:B","text":"正確，生長只是物質被動堆積","explanation":"生長涉及生命活動而非單純堆放。"},{"id":"BIO-B01-Ch1.1.3-B003:C","text":"錯誤，因為植物完全不用物質","explanation":"植物也需要物質，這個理由錯誤。"},{"id":"BIO-B01-Ch1.1.3-B003:D","text":"錯誤，形成與維持生命活動仍需能量","explanation":"原料與能量各有功能，不能以一方取消另一方。"}],"concept":"","example":"有建造材料，仍需能量來進行細胞工作。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）; 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B004","topicId":"","stem":"一份活動表列出肌肉收縮與細胞分裂。若要替兩者寫共同註解，哪句最準確？","correct":"BIO-B01-Ch1.1.3-B004:B","options":[{"id":"BIO-B01-Ch1.1.3-B004:A","text":"只有第一項是生命活動","explanation":"細胞分裂也屬生命活動。"},{"id":"BIO-B01-Ch1.1.3-B004:B","text":"兩者都是能量支持的生物工作","explanation":"教材把兩者列為利用化學能做功的例子。"},{"id":"BIO-B01-Ch1.1.3-B004:C","text":"第二項一定不耗能","explanation":"細胞分裂需要能量。"},{"id":"BIO-B01-Ch1.1.3-B004:D","text":"兩者都必須直接吞入陽光","explanation":"生物工作利用化學能，不等於直接吞入陽光。"}],"concept":"","example":"不同尺度的活動仍可共享能量需求。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B005","topicId":"","stem":"學生把「繁殖」放進「不用能量的活動」欄。應如何修改？","correct":"BIO-B01-Ch1.1.3-B005:C","options":[{"id":"BIO-B01-Ch1.1.3-B005:A","text":"保留，因為繁殖不是運動","explanation":"不是運動也可能需能量。"},{"id":"BIO-B01-Ch1.1.3-B005:B","text":"改成只有植物繁殖不用能量","explanation":"植物繁殖仍是生命活動。"},{"id":"BIO-B01-Ch1.1.3-B005:C","text":"移到需要能量的生命活動欄","explanation":"繁殖是教材列出的做功活動。"},{"id":"BIO-B01-Ch1.1.3-B005:D","text":"移到非生物環境欄","explanation":"繁殖是生物的活動而非環境物質。"}],"concept":"","example":"是否有移動不是判定能量需求的唯一線索。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B006","topicId":"","stem":"小型生物沒有可見肌肉，但細胞仍合成分子。哪項結論合理？","correct":"BIO-B01-Ch1.1.3-B006:A","options":[{"id":"BIO-B01-Ch1.1.3-B006:A","text":"它仍有細胞工作的能量需求","explanation":"分子合成也是生命工作。"},{"id":"BIO-B01-Ch1.1.3-B006:B","text":"它必須完全不需能量","explanation":"沒有肌肉不等於沒有細胞工作。"},{"id":"BIO-B01-Ch1.1.3-B006:C","text":"它的所有物質都由熱直接變成","explanation":"本節不支持這種物質來源。"},{"id":"BIO-B01-Ch1.1.3-B006:D","text":"它因此必定會光合作用","explanation":"合成分子不能單獨證明能光合作用。"}],"concept":"","example":"不能用「沒有肌肉」排除生命能量需求。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）; 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B007","topicId":"","stem":"某觀察只記錄到細胞變大，尚未發現細胞數目增加。哪句符合本節的生長概念？","correct":"BIO-B01-Ch1.1.3-B007:D","options":[{"id":"BIO-B01-Ch1.1.3-B007:A","text":"細胞數不增加就絕不可能生長","explanation":"生長也可包含細胞變大與物質合成。"},{"id":"BIO-B01-Ch1.1.3-B007:B","text":"只要細胞變大就不需能量","explanation":"細胞生長仍可涉及耗能工作。"},{"id":"BIO-B01-Ch1.1.3-B007:C","text":"有變大便證明能量從無產生","explanation":"大小變化不代表創造能量。"},{"id":"BIO-B01-Ch1.1.3-B007:D","text":"生長不必只限於細胞數增加","explanation":"教材說明生長可有多種構成過程。"}],"concept":"","example":"細胞變大與物質合成也是生長的面向。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B008","topicId":"","stem":"將「物質原料」和「能量供應」畫成兩格，哪種連結較合理？","correct":"BIO-B01-Ch1.1.3-B008:B","options":[{"id":"BIO-B01-Ch1.1.3-B008:A","text":"物質只連到散熱，不連身體組成","explanation":"物質可用於構成身體。"},{"id":"BIO-B01-Ch1.1.3-B008:B","text":"物質連到身體組成，能量連到做功","explanation":"分別抓住本節兩者的基本功能。"},{"id":"BIO-B01-Ch1.1.3-B008:C","text":"能量連到所有原料，不再需要物質","explanation":"能量不能取代構成身體的物質。"},{"id":"BIO-B01-Ch1.1.3-B008:D","text":"兩格完全相同，無需區分","explanation":"兩者功能與典型路徑有所不同。"}],"concept":"","example":"簡圖可以分開表示原料流和能量流。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）; 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B009","topicId":"","stem":"研究記錄顯示某生物持續做細胞工作並向周圍散熱；下列哪項解釋較好？","correct":"BIO-B01-Ch1.1.3-B009:C","options":[{"id":"BIO-B01-Ch1.1.3-B009:A","text":"散熱表示能量沒有被轉換","explanation":"散熱正是能量轉換過程的一部分。"},{"id":"BIO-B01-Ch1.1.3-B009:B","text":"只有出現奔跑才算用能量","explanation":"細胞工作也使用能量。"},{"id":"BIO-B01-Ch1.1.3-B009:C","text":"生物利用化學能工作，同時有部分能量散熱","explanation":"兩個觀察能同時成立。"},{"id":"BIO-B01-Ch1.1.3-B009:D","text":"散熱表示化學物質已完全消失","explanation":"能量散熱不代表物質消滅。"}],"concept":"","example":"能量利用與散熱可發生在同一段活動中。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）; 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B010","topicId":"","stem":"若某生物的可用能量長期不足，為何不能只靠保有身體原料維持所有工作？","correct":"BIO-B01-Ch1.1.3-B010:A","options":[{"id":"BIO-B01-Ch1.1.3-B010:A","text":"做功仍需要能量，原料存在不等於能量充足","explanation":"結構物質和能量供應要分開考量。"},{"id":"BIO-B01-Ch1.1.3-B010:B","text":"原料必定瞬間完全消失","explanation":"能量不足不表示物質瞬間不存在。"},{"id":"BIO-B01-Ch1.1.3-B010:C","text":"只要原料存在，工作就永不受限","explanation":"這忽略能量需求。"},{"id":"BIO-B01-Ch1.1.3-B010:D","text":"原料會自動完整回收所有散熱","explanation":"物質不具有這種完整能量回收功能。"}],"concept":"","example":"有材料不保證能持續進行需要能量的活動。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）; 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B011","topicId":"","stem":"表格將移動、生長、繁殖、細胞活動分為四列。哪種整體判讀正確？","correct":"BIO-B01-Ch1.1.3-B011:D","options":[{"id":"BIO-B01-Ch1.1.3-B011:A","text":"只移動一列需要能量","explanation":"另外三列也屬需要能量的生命活動。"},{"id":"BIO-B01-Ch1.1.3-B011:B","text":"只有大型動物進行這些活動時才需能量","explanation":"能量需求不是僅限大型動物。"},{"id":"BIO-B01-Ch1.1.3-B011:C","text":"每列的工作都必須以創造能量開始","explanation":"生物使用和轉換能量，不從無創造。"},{"id":"BIO-B01-Ch1.1.3-B011:D","text":"這些活動均與做功和能量需求有關","explanation":"四列都符合本節的總體描述。"}],"concept":"","example":"不同活動可用同一能量原則理解。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B012","topicId":"","stem":"一段解釋說「主動運輸屬細胞工作，所以需要能量」。依本節內容，應如何處理？","correct":"BIO-B01-Ch1.1.3-B012:B","options":[{"id":"BIO-B01-Ch1.1.3-B012:A","text":"拒絕，只有肌肉收縮是工作","explanation":"細胞工作不只有肌肉收縮。"},{"id":"BIO-B01-Ch1.1.3-B012:B","text":"接受，這是本節列出的細胞工作例子","explanation":"本題只考能量需求，未涉及運輸機制細節。"},{"id":"BIO-B01-Ch1.1.3-B012:C","text":"拒絕，細胞只要有物質便不需能量","explanation":"工作仍有能量需求。"},{"id":"BIO-B01-Ch1.1.3-B012:D","text":"接受，並推論所有運輸都必須同樣耗能","explanation":"本節此例不能擴張成所有運輸一律耗能。"}],"concept":"","example":"一個主動運輸例子不能推出所有運輸的機制。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B013","topicId":"","stem":"葉片得到光照後形成含化學能的食物。下列哪種因果說明最合適？","correct":"BIO-B01-Ch1.1.3-B013:C","options":[{"id":"BIO-B01-Ch1.1.3-B013:A","text":"糖的形成讓宇宙總能量從無增加","explanation":"食物生產不代表創造能量。"},{"id":"BIO-B01-Ch1.1.3-B013:B","text":"植物把土壤養分全部當成陽光","explanation":"物質吸收與光能輸入不同。"},{"id":"BIO-B01-Ch1.1.3-B013:C","text":"光合作用把吸收的光能轉成化學能","explanation":"能量形式轉換解釋此過程。"},{"id":"BIO-B01-Ch1.1.3-B013:D","text":"形成糖表示植物沒有任何物質需求","explanation":"糖等物質仍需物質原料。"}],"concept":"","example":"同一過程可有物質參與及能量轉換。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B014","topicId":"","stem":"教材旁的註記寫「太陽供應光能，植物製造能量」。保留前半句，後半句應改成哪句？","correct":"BIO-B01-Ch1.1.3-B014:A","options":[{"id":"BIO-B01-Ch1.1.3-B014:A","text":"植物把光能轉換成食物中的化學能","explanation":"修正創造能量的錯誤，同時保留光合角色。"},{"id":"BIO-B01-Ch1.1.3-B014:B","text":"植物把散熱完整送回太陽","explanation":"不符合光合作用過程。"},{"id":"BIO-B01-Ch1.1.3-B014:C","text":"植物只負責取得動物遺體","explanation":"這不是此處光合生產者的描述。"},{"id":"BIO-B01-Ch1.1.3-B014:D","text":"植物不需要使用任何能量","explanation":"植物本身也需能量工作。"}],"concept":"","example":"製造糖與創造能量是不同的主張。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第12張／正文第10頁（19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B015","topicId":"","stem":"池中藻類吸收光能製成有機物，小動物再吃藻。藻類在這段能量路徑中先完成什麼？","correct":"BIO-B01-Ch1.1.3-B015:D","options":[{"id":"BIO-B01-Ch1.1.3-B015:A","text":"先將所有化學能變回陽光","explanation":"藻的光合作用方向相反。"},{"id":"BIO-B01-Ch1.1.3-B015:B","text":"先完整回收小動物的熱","explanation":"這不是藻引入能量的方式。"},{"id":"BIO-B01-Ch1.1.3-B015:C","text":"先把物質永久消滅","explanation":"形成有機物不會消滅物質。"},{"id":"BIO-B01-Ch1.1.3-B015:D","text":"先將光能轉為有機物的化學能","explanation":"食物的化學能可再傳給取食者。"}],"concept":"","example":"這裡不需要展開光合作用反應式。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B016","topicId":"","stem":"圖表左端為太陽，中央為光合植物，右端為食物分子。左右箭頭應如何標能量形式？","correct":"BIO-B01-Ch1.1.3-B016:B","options":[{"id":"BIO-B01-Ch1.1.3-B016:A","text":"左化學能，右光能","explanation":"把輸入與儲存的形式顛倒。"},{"id":"BIO-B01-Ch1.1.3-B016:B","text":"左光能，右化學能","explanation":"光合植物把光能轉成食物化學能。"},{"id":"BIO-B01-Ch1.1.3-B016:C","text":"兩端都是礦物質","explanation":"礦物質不是這兩個能量形式。"},{"id":"BIO-B01-Ch1.1.3-B016:D","text":"兩端都是完整回收的熱","explanation":"圖意不是熱的完整回收。"}],"concept":"","example":"先確認箭頭表示能量形式，再辨識起終點。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B017","topicId":"","stem":"若只有「植物增加了糖」這句資訊，哪種說法最應避免？","correct":"BIO-B01-Ch1.1.3-B017:C","options":[{"id":"BIO-B01-Ch1.1.3-B017:A","text":"糖可含有化學能","explanation":"這是食物分子的能量性質。"},{"id":"BIO-B01-Ch1.1.3-B017:B","text":"光合作用可將光能轉為化學能","explanation":"這是本節基本原則。"},{"id":"BIO-B01-Ch1.1.3-B017:C","text":"糖增加證明植物憑空創造能量","explanation":"糖增加不能支持無中生有的能量。"},{"id":"BIO-B01-Ch1.1.3-B017:D","text":"植物也有能量轉換過程","explanation":"符合生產者角色。"}],"concept":"","example":"增加食物存量不等於創造能量。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B018","topicId":"","stem":"學生把「藻吸光製有機物」與「昆蟲吃葉」寫成相同的取能方式。哪個修改正確？","correct":"BIO-B01-Ch1.1.3-B018:A","options":[{"id":"BIO-B01-Ch1.1.3-B018:A","text":"前者轉換光能，後者取得食物化學能","explanation":"兩者均涉及能量，但取得方式不同。"},{"id":"BIO-B01-Ch1.1.3-B018:B","text":"前者只取得物質，後者只取得光","explanation":"兩邊的能量判斷均有錯。"},{"id":"BIO-B01-Ch1.1.3-B018:C","text":"前者創造能量，後者回收全部熱","explanation":"兩種角色都沒有這些功能。"},{"id":"BIO-B01-Ch1.1.3-B018:D","text":"兩者都直接把陽光吞下","explanation":"取食有機物不等於直接吞光。"}],"concept":"","example":"看有機物從哪裡來，可幫助區分兩種角色。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B019","topicId":"","stem":"依本節「許多生態系」的用語，下列哪項推論過度？","correct":"BIO-B01-Ch1.1.3-B019:D","options":[{"id":"BIO-B01-Ch1.1.3-B019:A","text":"太陽常是主要能量輸入","explanation":"符合教材的限定。"},{"id":"BIO-B01-Ch1.1.3-B019:B","text":"光合生物可把光能轉成化學能","explanation":"本節明確支持。"},{"id":"BIO-B01-Ch1.1.3-B019:C","text":"植物不會憑空製造能量","explanation":"符合能量轉換的意義。"},{"id":"BIO-B01-Ch1.1.3-B019:D","text":"所有生態系都只可能靠太陽供能","explanation":"把常見路徑說成唯一無例外來源，超過原文。"}],"concept":"","example":"不必知道其他生態系細節，也可判斷絕對化不受支持。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B020","topicId":"","stem":"光合植物先形成糖，之後自己利用糖的化學能做功。何者正確？","correct":"BIO-B01-Ch1.1.3-B020:B","options":[{"id":"BIO-B01-Ch1.1.3-B020:A","text":"生產者只能儲存能量，不能使用","explanation":"植物也需要做功。"},{"id":"BIO-B01-Ch1.1.3-B020:B","text":"生產者也能利用食物化學能，並伴隨散熱","explanation":"生產和使用能量並不矛盾。"},{"id":"BIO-B01-Ch1.1.3-B020:C","text":"植物使用糖證明它不曾光合作用","explanation":"兩個過程可以發生在同一植物。"},{"id":"BIO-B01-Ch1.1.3-B020:D","text":"植物做功不可能散熱","explanation":"生產者也有散熱。"}],"concept":"","example":"生產者不是只供其他生物取食的靜態儲存箱。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B021","topicId":"","stem":"在「光合作用為生態系引入能量」旁加入補充，哪句最準確？","correct":"BIO-B01-Ch1.1.3-B021:C","options":[{"id":"BIO-B01-Ch1.1.3-B021:A","text":"這代表植物造出了原本不存在的能量","explanation":"輸入與轉換不等於創造。"},{"id":"BIO-B01-Ch1.1.3-B021:B","text":"這代表植物只吸收散失熱","explanation":"主要輸入是光能。"},{"id":"BIO-B01-Ch1.1.3-B021:C","text":"引入的光能可轉成食物分子的化學能","explanation":"說明能量如何進入可傳遞的形式。"},{"id":"BIO-B01-Ch1.1.3-B021:D","text":"引入能量後便不需要任何物質循環","explanation":"能量輸入不能取代物質回收。"}],"concept":"","example":"食物是後續能量傳遞的重要媒介。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B022","topicId":"","stem":"日照草地中，哪個說明能連接太陽與吃草動物的能量來源？","correct":"BIO-B01-Ch1.1.3-B022:A","options":[{"id":"BIO-B01-Ch1.1.3-B022:A","text":"草先把光能轉成化學能，動物再由取食取得","explanation":"包含必要的光合轉換與食物傳遞。"},{"id":"BIO-B01-Ch1.1.3-B022:B","text":"草先把光轉成礦物質，動物只吃熱","explanation":"混淆能量與物質。"},{"id":"BIO-B01-Ch1.1.3-B022:C","text":"動物直接從草中取得未變形的光線","explanation":"食物中主要是化學能，不是未轉換光線。"},{"id":"BIO-B01-Ch1.1.3-B022:D","text":"草與動物都從無產生能量","explanation":"兩者都不創造能量。"}],"concept":"","example":"間接依賴陽光與直接以光取能要分開。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B023","topicId":"","stem":"將「植物能製造食物」改成「植物能製造能量」，為何不恰當？","correct":"BIO-B01-Ch1.1.3-B023:D","options":[{"id":"BIO-B01-Ch1.1.3-B023:A","text":"因為食物從不含能量","explanation":"食物含化學能，這理由錯。"},{"id":"BIO-B01-Ch1.1.3-B023:B","text":"因為植物完全沒有能量需求","explanation":"植物需要能量。"},{"id":"BIO-B01-Ch1.1.3-B023:C","text":"因為植物不能形成任何有機物","explanation":"光合植物可形成有機物。"},{"id":"BIO-B01-Ch1.1.3-B023:D","text":"前者描述食物形成，後者誤稱能量從無產生","explanation":"食物形成伴隨能量轉換，不是創造能量。"}],"concept":"","example":"同一個「製造」動詞用在不同對象上可能改變科學意義。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B024","topicId":"","stem":"葉片吸收陽光，根部吸收土壤中的化學物質。最合適的比較為何？","correct":"BIO-B01-Ch1.1.3-B024:B","options":[{"id":"BIO-B01-Ch1.1.3-B024:A","text":"兩者都是同一種光能輸入","explanation":"根吸收的是化學物質，不是陽光。"},{"id":"BIO-B01-Ch1.1.3-B024:B","text":"前者主要描述能量輸入，後者描述物質進入","explanation":"可分別追蹤能量形式與化學成分。"},{"id":"BIO-B01-Ch1.1.3-B024:C","text":"前者一定不與食物形成有關","explanation":"光合作用可把光能轉入食物。"},{"id":"BIO-B01-Ch1.1.3-B024:D","text":"後者表示能量完整循環","explanation":"物質吸收不能證明能量循環。"}],"concept":"","example":"區分「光」與「化學成分」可避免畫錯箭頭。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第9張／正文第7頁（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B025","topicId":"","stem":"一張說明卡要同時避免「所有生態系只有太陽」與「生產者造能量」兩個錯誤，應選哪句？","correct":"BIO-B01-Ch1.1.3-B025:C","options":[{"id":"BIO-B01-Ch1.1.3-B025:A","text":"每個生態系都靠植物從無製造能量","explanation":"同時保留兩個錯誤。"},{"id":"BIO-B01-Ch1.1.3-B025:B","text":"只有動物才把光能轉成糖","explanation":"顛倒本節光合生物的角色。"},{"id":"BIO-B01-Ch1.1.3-B025:C","text":"許多生態系靠光合生物將太陽光能轉成化學能","explanation":"兼顧常見範圍與轉換而非創造。"},{"id":"BIO-B01-Ch1.1.3-B025:D","text":"分解者先回收所有熱，再產生太陽光","explanation":"不符合分解與能量流動。"}],"concept":"","example":"準確的限定詞和動詞都會影響答案。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第12張／正文第10頁（19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B026","topicId":"","stem":"光合生物形成的食物被另一生物吃下。若追蹤傳入取食者的能量，應記錄哪項？","correct":"BIO-B01-Ch1.1.3-B026:B","options":[{"id":"BIO-B01-Ch1.1.3-B026:A","text":"食物中原先未轉換的太陽光","explanation":"食物儲存的是化學能，不是原樣陽光。"},{"id":"BIO-B01-Ch1.1.3-B026:B","text":"隨食物進入的化學能","explanation":"能量經光合轉換後隨有機物傳遞。"},{"id":"BIO-B01-Ch1.1.3-B026:C","text":"取食者創造的新能量","explanation":"取食者取得既有化學能。"},{"id":"BIO-B01-Ch1.1.3-B026:D","text":"已散到太空的熱全部返回","explanation":"食物傳遞不表示全部熱返回。"}],"concept":"","example":"能量經過轉換，不會永遠維持光的形式。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B027","topicId":"","stem":"植物由外界吸收光能後，能量儲存在糖等分子中。若把此事稱為「能量不曾改變形式」，錯在哪裡？","correct":"BIO-B01-Ch1.1.3-B027:D","options":[{"id":"BIO-B01-Ch1.1.3-B027:A","text":"錯在植物不能接收光","explanation":"光合植物可接收光。"},{"id":"BIO-B01-Ch1.1.3-B027:B","text":"錯在糖不是任何物質","explanation":"糖是物質。"},{"id":"BIO-B01-Ch1.1.3-B027:C","text":"錯在化學能和光能必須完全同名","explanation":"能量形式本就可用不同名稱區分。"},{"id":"BIO-B01-Ch1.1.3-B027:D","text":"光能與化學能是不同形式，這正是轉換","explanation":"總能量原則不表示形式永不改變。"}],"concept":"","example":"能量守恆與能量形式改變並不衝突。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B028","topicId":"","stem":"某光合生態系持續有熱散出，為何仍強調外界光能輸入？","correct":"BIO-B01-Ch1.1.3-B028:A","options":[{"id":"BIO-B01-Ch1.1.3-B028:A","text":"光能可經生產者轉成可利用的化學能，支援持續活動","explanation":"散熱不會全部自動回收，需要能量來源。"},{"id":"BIO-B01-Ch1.1.3-B028:B","text":"輸入光能會讓所有化學成分停止循環","explanation":"能量輸入不會取消物質循環。"},{"id":"BIO-B01-Ch1.1.3-B028:C","text":"只要有一次日照，以後就不需任何輸入","explanation":"忽略持續散熱與能量需求。"},{"id":"BIO-B01-Ch1.1.3-B028:D","text":"光能的主要作用是把所有物質消滅","explanation":"這不是光合作用的功能。"}],"concept":"","example":"能量的流入和流出須同時考量。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B029","topicId":"","stem":"兔子吃草後生長，也進行活動。從這兩項用途應如何描述食物？","correct":"BIO-B01-Ch1.1.3-B029:C","options":[{"id":"BIO-B01-Ch1.1.3-B029:A","text":"食物只提供活動能量","explanation":"忽略生長所需的物質。"},{"id":"BIO-B01-Ch1.1.3-B029:B","text":"食物只提供結構原料","explanation":"忽略食物化學能。"},{"id":"BIO-B01-Ch1.1.3-B029:C","text":"食物可同時提供化學能與身體原料","explanation":"能量和物質可由同一食物取得。"},{"id":"BIO-B01-Ch1.1.3-B029:D","text":"食物只能提供尚未被吸收的陽光","explanation":"植物食物中的能量已為化學能。"}],"concept":"","example":"同一片葉子可兼具原料與能量來源。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B030","topicId":"","stem":"已知草被蝗蟲吃，蝗蟲被鳥吃。鳥此刻攝食所得的直接能量來源，與較上游的光能入口如何配對？","correct":"BIO-B01-Ch1.1.3-B030:A","options":[{"id":"BIO-B01-Ch1.1.3-B030:A","text":"直接為蝗蟲有機物；上游可由草的光合作用引入","explanation":"區分直接食物和上游能量入口。"},{"id":"BIO-B01-Ch1.1.3-B030:B","text":"直接為太陽；上游為鳥的肌肉","explanation":"顛倒取食來源與工作位置。"},{"id":"BIO-B01-Ch1.1.3-B030:C","text":"直接為土壤熱；上游為鳥創造能量","explanation":"兩項皆不符合題意。"},{"id":"BIO-B01-Ch1.1.3-B030:D","text":"直接與上游都只能稱為未轉換陽光","explanation":"能量經光合作用已轉成化學能。"}],"concept":"","example":"鳥吃昆蟲不需要直接進行光合作用才能獲能。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B031","topicId":"","stem":"學生畫「植物→昆蟲」，卻註解「昆蟲把化學能送給植物」。箭頭已指定為取食能量方向，應如何處理？","correct":"BIO-B01-Ch1.1.3-B031:D","options":[{"id":"BIO-B01-Ch1.1.3-B031:A","text":"保留，所有箭頭均無方向意義","explanation":"題目已明訂箭頭代表方向。"},{"id":"BIO-B01-Ch1.1.3-B031:B","text":"把植物改成熱就能正確","explanation":"改節點未解決取食關係。"},{"id":"BIO-B01-Ch1.1.3-B031:C","text":"把昆蟲說成光合生產者","explanation":"題意是昆蟲吃植物，不能任意改角色。"},{"id":"BIO-B01-Ch1.1.3-B031:D","text":"改註解為植物的食物化學能傳給昆蟲","explanation":"與既定箭頭及取食關係一致。"}],"concept":"","example":"解讀圖示須同時核對箭頭與文字。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B032","topicId":"","stem":"某動物以其他動物遺體為食；「不是吃活體，因此不能算消費者」合理嗎？","correct":"BIO-B01-Ch1.1.3-B032:B","options":[{"id":"BIO-B01-Ch1.1.3-B032:A","text":"合理，消費者只能吃活植物","explanation":"教材未如此限定。"},{"id":"BIO-B01-Ch1.1.3-B032:B","text":"不合理，消費者可取食其他生物或其遺體","explanation":"是否活體不是此定義的唯一界線。"},{"id":"BIO-B01-Ch1.1.3-B032:C","text":"合理，遺體完全不含化學能","explanation":"遺體有機物仍可含化學能。"},{"id":"BIO-B01-Ch1.1.3-B032:D","text":"不合理，因為吃遺體等於光合作用","explanation":"雖是否定，但理由錯誤。"}],"concept":"","example":"本題只判消費者廣義取食描述，不細分其餘角色。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B033","topicId":"","stem":"若把「植物→草食動物」箭頭標成「只有能量，完全無物質」，哪項修正較好？","correct":"BIO-B01-Ch1.1.3-B033:C","options":[{"id":"BIO-B01-Ch1.1.3-B033:A","text":"改成只有物質，完全沒有能量","explanation":"同樣漏掉食物的另一面。"},{"id":"BIO-B01-Ch1.1.3-B033:B","text":"改成只傳陽光，沒有有機物","explanation":"取食是有機物的轉移。"},{"id":"BIO-B01-Ch1.1.3-B033:C","text":"改成食物有機物傳遞物質及化學能","explanation":"同一食物可帶入兩者。"},{"id":"BIO-B01-Ch1.1.3-B033:D","text":"改成所有物質必定完全留在植物","explanation":"與取食轉移矛盾。"}],"concept":"","example":"一條取食關係可分別畫能量與物質兩種追蹤線。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B034","topicId":"","stem":"鳥由食物取得化學能後，哪種後續描述符合本節？","correct":"BIO-B01-Ch1.1.3-B034:A","options":[{"id":"BIO-B01-Ch1.1.3-B034:A","text":"可用來做功，部分能量以熱散失","explanation":"食物能量利用與散熱相連。"},{"id":"BIO-B01-Ch1.1.3-B034:B","text":"全部能量永遠封存在鳥體內","explanation":"能量會被利用並散熱。"},{"id":"BIO-B01-Ch1.1.3-B034:C","text":"立刻完整回到植物作為同一束光","explanation":"能量不依此路徑完整循環。"},{"id":"BIO-B01-Ch1.1.3-B034:D","text":"全部化學物質必定同時消失","explanation":"能量散熱不代表物質消失。"}],"concept":"","example":"吃進食物只是能量路徑的一個環節。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）; 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B035","topicId":"","stem":"一份說明把草食者與肉食者分在不同食性欄，但問兩者共同的取能方式。何者最合理？","correct":"BIO-B01-Ch1.1.3-B035:D","options":[{"id":"BIO-B01-Ch1.1.3-B035:A","text":"都必須直接吸收光能造糖","explanation":"不是兩者共同的消費者方式。"},{"id":"BIO-B01-Ch1.1.3-B035:B","text":"都只吸收土壤中的無機養分取得食物","explanation":"不符合題述取食植物或動物。"},{"id":"BIO-B01-Ch1.1.3-B035:C","text":"都回收全部散熱來建立食物","explanation":"沒有完整回收功能。"},{"id":"BIO-B01-Ch1.1.3-B035:D","text":"都能從被取食的有機物取得化學能","explanation":"食物種類不同但都涉及有機物化學能。"}],"concept":"","example":"吃植物與吃動物有共同的化學能取得原則。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B036","topicId":"","stem":"某圖只畫「太陽→兔子」，箭頭標示「兔子吃草所得能量的實際傳遞」。哪個補充最必要？","correct":"BIO-B01-Ch1.1.3-B036:B","options":[{"id":"BIO-B01-Ch1.1.3-B036:A","text":"加上太陽從兔子取得糖","explanation":"方向錯誤。"},{"id":"BIO-B01-Ch1.1.3-B036:B","text":"加入光合植物先轉能、兔子再吃植物","explanation":"補足實際的轉換與取食環節。"},{"id":"BIO-B01-Ch1.1.3-B036:C","text":"刪除所有食物，使兔子憑空取能","explanation":"沒有來源。"},{"id":"BIO-B01-Ch1.1.3-B036:D","text":"把兔子全身標成光合作用器官","explanation":"題目沒有此依據。"}],"concept":"","example":"簡化圖仍要保留必要的中介過程。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B037","topicId":"","stem":"昆蟲吃葉片後有部分葉片成分進入其身體。此觀察可以支持哪項，而不能單憑它證明能量循環？","correct":"BIO-B01-Ch1.1.3-B037:C","options":[{"id":"BIO-B01-Ch1.1.3-B037:A","text":"葉片是沒有能量的物質","explanation":"食物仍含化學能。"},{"id":"BIO-B01-Ch1.1.3-B037:B","text":"昆蟲取得原樣陽光","explanation":"葉片內主要是化學能。"},{"id":"BIO-B01-Ch1.1.3-B037:C","text":"取食可造成物質由植物轉入動物","explanation":"觀察追蹤的是成分移動。"},{"id":"BIO-B01-Ch1.1.3-B037:D","text":"所有能量必會回到葉片","explanation":"物質轉移不能證明能量全部返回。"}],"concept":"","example":"物質去向的資料不能直接替代能量流的證據。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B038","topicId":"","stem":"某生物取食另一生物，並利用食物能量做功。說它「吃掉能量後使能量消滅」有何問題？","correct":"BIO-B01-Ch1.1.3-B038:A","options":[{"id":"BIO-B01-Ch1.1.3-B038:A","text":"應描述能量轉換與散熱，而非能量從存在變成不存在","explanation":"生物使用能量不表示消滅能量。"},{"id":"BIO-B01-Ch1.1.3-B038:B","text":"其實生物從來不使用化學能","explanation":"它會使用化學能。"},{"id":"BIO-B01-Ch1.1.3-B038:C","text":"其實食物完全沒有物質","explanation":"食物也是物質。"},{"id":"BIO-B01-Ch1.1.3-B038:D","text":"其實取食只在生產者中發生","explanation":"本題取食者是消費者範例。"}],"concept":"","example":"能量離開生態系不等於能量在宇宙消失。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B039","topicId":"","stem":"一隻鳥取食昆蟲，另一隻取食植物果實。若只判斷取能原則，哪句可適用兩者？","correct":"BIO-B01-Ch1.1.3-B039:D","options":[{"id":"BIO-B01-Ch1.1.3-B039:A","text":"只有吃昆蟲的一隻能取得物質","explanation":"果實也是物質。"},{"id":"BIO-B01-Ch1.1.3-B039:B","text":"只有吃果實的一隻取得化學能","explanation":"昆蟲有機物也有化學能。"},{"id":"BIO-B01-Ch1.1.3-B039:C","text":"兩隻皆直接以陽光取代食物","explanation":"題意是取食。"},{"id":"BIO-B01-Ch1.1.3-B039:D","text":"兩隻皆由食物中的有機物取得化學能和物質","explanation":"食物不同不改變這項原則。"}],"concept":"","example":"不需加入特定物種或消化機制便可判斷。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B040","topicId":"","stem":"對「消費者得到的是植物轉換後的能量」最恰當的理解為何？","correct":"BIO-B01-Ch1.1.3-B040:B","options":[{"id":"BIO-B01-Ch1.1.3-B040:A","text":"每一個消費者都必須直接吃植物","explanation":"肉食者可透過更上游食物取得。"},{"id":"BIO-B01-Ch1.1.3-B040:B","text":"食物鏈可把生產者引入的化學能間接傳給消費者","explanation":"能量可經不同取食環節傳遞。"},{"id":"BIO-B01-Ch1.1.3-B040:C","text":"植物把光線原封不動傳進動物胃裡","explanation":"植物先將光能轉成化學能。"},{"id":"BIO-B01-Ch1.1.3-B040:D","text":"所有消費者都不需要物質","explanation":"消費者也取得物質。"}],"concept":"","example":"間接傳遞不等於直接取食。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B041","topicId":"","stem":"「食物關係只與能量有關，與物質無關」應如何評價？","correct":"BIO-B01-Ch1.1.3-B041:C","options":[{"id":"BIO-B01-Ch1.1.3-B041:A","text":"正確，食物沒有原子或成分","explanation":"食物具有物質組成。"},{"id":"BIO-B01-Ch1.1.3-B041:B","text":"正確，物質只能停在環境不能入生物","explanation":"物質可被吸收納入身體。"},{"id":"BIO-B01-Ch1.1.3-B041:C","text":"錯誤，取食也把被吃生物的物質帶入消費者","explanation":"食物關係同時涉及物質轉移。"},{"id":"BIO-B01-Ch1.1.3-B041:D","text":"錯誤，因為能量在食物關係中從未轉移","explanation":"能量也會轉移，此理由錯。"}],"concept":"","example":"兩種追蹤可以使用相同的食物關係。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）; 正式第9張／正文第7頁（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B042","topicId":"","stem":"植物落葉直接被真菌分解，沒有先被昆蟲吃。哪個結論合理？","correct":"BIO-B01-Ch1.1.3-B042:A","options":[{"id":"BIO-B01-Ch1.1.3-B042:A","text":"分解者可利用落葉有機物中的化學能","explanation":"能量不必先經過草食動物才到分解者。"},{"id":"BIO-B01-Ch1.1.3-B042:B","text":"分解者因此不能取得任何能量","explanation":"落葉有機物含化學能。"},{"id":"BIO-B01-Ch1.1.3-B042:C","text":"所有物質循環都必須先經昆蟲","explanation":"本節容許落葉直接分解。"},{"id":"BIO-B01-Ch1.1.3-B042:D","text":"真菌只好先把熱變回光","explanation":"不符合其能量來源。"}],"concept":"","example":"能量流的簡圖不能被誤當成唯一必經順序。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B043","topicId":"","stem":"某生物利用一份食物的化學能做功，同時向環境散熱。哪種圖最不會誤導？","correct":"BIO-B01-Ch1.1.3-B043:D","options":[{"id":"BIO-B01-Ch1.1.3-B043:A","text":"化學能→熱→所有工作已完成，且禁止其他分支","explanation":"把單一路徑與先後規定過強。"},{"id":"BIO-B01-Ch1.1.3-B043:B","text":"化學能全部回到原食物","explanation":"忽略做功及散熱。"},{"id":"BIO-B01-Ch1.1.3-B043:C","text":"所有工作結束前絕不可能散熱","explanation":"題目指出同時散熱。"},{"id":"BIO-B01-Ch1.1.3-B043:D","text":"化學能分別指向做功與熱散失","explanation":"分支能表達同時發生的能量去向。"}],"concept":"","example":"此處只表示簡化分配，不深入代謝機制。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B044","topicId":"","stem":"簡化記帳中，80 J化學能全部分配為做功及散熱，做功為30 J，其他去向忽略。散熱是多少？","correct":"BIO-B01-Ch1.1.3-B044:B","options":[{"id":"BIO-B01-Ch1.1.3-B044:A","text":"30 J","explanation":"30 J是題目給的做功量。"},{"id":"BIO-B01-Ch1.1.3-B044:B","text":"50 J","explanation":"依完整分配，80−30＝50 J。"},{"id":"BIO-B01-Ch1.1.3-B044:C","text":"80 J","explanation":"把全部能量都算散熱會漏掉做功。"},{"id":"BIO-B01-Ch1.1.3-B044:D","text":"110 J","explanation":"80＋30重複計入做功能量。"}],"concept":"","example":"只有題目明示這兩個去向，才可用此減法。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B045","topicId":"","stem":"某簡化能量帳：輸入120 J，做功45 J，散熱75 J，無其他項。這份紀錄支持什麼？","correct":"BIO-B01-Ch1.1.3-B045:C","options":[{"id":"BIO-B01-Ch1.1.3-B045:A","text":"能量從無增加了45 J","explanation":"45 J包含在輸入能量的分配內。"},{"id":"BIO-B01-Ch1.1.3-B045:B","text":"熱被全部回收了75 J","explanation":"帳目只記散熱，沒記回收。"},{"id":"BIO-B01-Ch1.1.3-B045:C","text":"能量輸入可由做功及散熱兩項對應","explanation":"45＋75＝120 J，符合題設收支。"},{"id":"BIO-B01-Ch1.1.3-B045:D","text":"所有物質變成120 J而消失","explanation":"資料只談能量，未證明物質消失。"}],"concept":"","example":"相加核對能量去向，不把做功算成額外生成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B046","topicId":"","stem":"題目只寫「生物從食物取得100 J化學能」，未列用途。能直接斷定熱散失恰為40 J嗎？","correct":"BIO-B01-Ch1.1.3-B046:A","options":[{"id":"BIO-B01-Ch1.1.3-B046:A","text":"不能，尚缺做功與其他能量去向資料","explanation":"本節原則不提供固定散熱比例。"},{"id":"BIO-B01-Ch1.1.3-B046:B","text":"能，任何生物都固定散失40%","explanation":"來源沒有這種固定比例。"},{"id":"BIO-B01-Ch1.1.3-B046:C","text":"能，所有化學能都等於40 J","explanation":"與已知100 J不一致。"},{"id":"BIO-B01-Ch1.1.3-B046:D","text":"不能，因為生物永不散熱","explanation":"不能推定數值，但生物可散熱。"}],"concept":"","example":"缺少比例時不可套入未提供的效率。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B047","topicId":"","stem":"能量以熱離開生態系，是否違反「能量不會憑空消滅」的理解？","correct":"BIO-B01-Ch1.1.3-B047:D","options":[{"id":"BIO-B01-Ch1.1.3-B047:A","text":"是，離開生態系就等於不存在","explanation":"系統邊界外仍有能量。"},{"id":"BIO-B01-Ch1.1.3-B047:B","text":"是，散熱只能表示物質消失","explanation":"熱與物質不是同一概念。"},{"id":"BIO-B01-Ch1.1.3-B047:C","text":"否，因為能量其實從未離開","explanation":"題目已指出散熱離開。"},{"id":"BIO-B01-Ch1.1.3-B047:D","text":"否，能量轉移到周圍，不等於消滅","explanation":"系統流出與能量消失須區分。"}],"concept":"","example":"以生態系為記帳邊界時，熱可列為流出。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B048","topicId":"","stem":"一位學生只在動物旁畫熱箭頭，植物與分解者旁寫「絕不散熱」。如何修正？","correct":"BIO-B01-Ch1.1.3-B048:B","options":[{"id":"BIO-B01-Ch1.1.3-B048:A","text":"保留，只有肌肉才會散熱","explanation":"植物與分解者的工作也散熱。"},{"id":"BIO-B01-Ch1.1.3-B048:B","text":"三類生物均可利用化學能做功並散熱","explanation":"應補上生產者與分解者的能量使用。"},{"id":"BIO-B01-Ch1.1.3-B048:C","text":"把所有熱箭頭改成能量循環","explanation":"這會引入新的錯誤。"},{"id":"BIO-B01-Ch1.1.3-B048:D","text":"移除動物熱箭頭，僅分解者能散熱","explanation":"動物也散熱。"}],"concept":"","example":"散熱不只與可見的動物運動相關。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B049","topicId":"","stem":"某生態系物質仍能循環，卻持續有能量以熱流出。為何不能據此說「不再需能量輸入」？","correct":"BIO-B01-Ch1.1.3-B049:C","options":[{"id":"BIO-B01-Ch1.1.3-B049:A","text":"因為物質完全不能回收","explanation":"物質可以回收。"},{"id":"BIO-B01-Ch1.1.3-B049:B","text":"因為熱根本不是能量","explanation":"熱與能量轉移有關。"},{"id":"BIO-B01-Ch1.1.3-B049:C","text":"物質回收不能補成所有流失的可用化學能","explanation":"兩者路徑不同，不能用物質循環取消能量需求。"},{"id":"BIO-B01-Ch1.1.3-B049:D","text":"因為生產者可從無造能量","explanation":"生產者只轉能。"}],"concept":"","example":"回收原料與補充可用能量是兩件事。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B050","topicId":"","stem":"一份簡化能量記帳只有做功與散熱：輸入60 J，散熱24 J。依題設，做功所用能量是多少？","correct":"BIO-B01-Ch1.1.3-B050:A","options":[{"id":"BIO-B01-Ch1.1.3-B050:A","text":"36 J","explanation":"60−24＝36 J，與24 J合計60 J。"},{"id":"BIO-B01-Ch1.1.3-B050:B","text":"24 J","explanation":"這是已知散熱值，不是剩餘做功。"},{"id":"BIO-B01-Ch1.1.3-B050:C","text":"60 J","explanation":"忽略24 J散熱。"},{"id":"BIO-B01-Ch1.1.3-B050:D","text":"84 J","explanation":"把輸入與散熱相加會超過輸入。"}],"concept":"","example":"數字為練習題條件，並非任何物種固定效率。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B051","topicId":"","stem":"兩去向記帳列本次可分配化學能90 J、做功20 J、散熱80 J，且沒有其他能量來源。應如何判斷？","correct":"BIO-B01-Ch1.1.3-B051:D","options":[{"id":"BIO-B01-Ch1.1.3-B051:A","text":"完全一致，因為做功不算能量去向","explanation":"做功是已列出的能量分配。"},{"id":"BIO-B01-Ch1.1.3-B051:B","text":"完全一致，因為散熱可創造10 J","explanation":"散熱不能創造能量。"},{"id":"BIO-B01-Ch1.1.3-B051:C","text":"必定是物質循環的證據","explanation":"記帳談能量，不能推出物質循環。"},{"id":"BIO-B01-Ch1.1.3-B051:D","text":"不一致，兩項支出合計100 J，大於輸入90 J","explanation":"20＋80＝100 J，超出10 J，須查記帳條件或數值。"}],"concept":"","example":"計算失配應查資料，不能以創造能量補洞。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B052","topicId":"","stem":"兩個簡化系統各有100 J可分配化學能，甲做功40 J，乙做功55 J；其餘全散熱。哪項正確？","correct":"BIO-B01-Ch1.1.3-B052:B","options":[{"id":"BIO-B01-Ch1.1.3-B052:A","text":"甲散熱40 J，乙55 J","explanation":"這是做功值，不是餘額。"},{"id":"BIO-B01-Ch1.1.3-B052:B","text":"甲散熱60 J，乙45 J","explanation":"分別為100−40與100−55。"},{"id":"BIO-B01-Ch1.1.3-B052:C","text":"甲與乙都散熱100 J","explanation":"忽略各自做功。"},{"id":"BIO-B01-Ch1.1.3-B052:D","text":"乙散熱較多15 J","explanation":"依題設乙散熱反而少15 J。"}],"concept":"","example":"只按給定收支比較，不假設真實物種效率。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B053","topicId":"","stem":"只有「做功35 J、散熱15 J」兩項能量去向，且能量全來自同一輸入。輸入應是多少？","correct":"BIO-B01-Ch1.1.3-B053:C","options":[{"id":"BIO-B01-Ch1.1.3-B053:A","text":"20 J","explanation":"相減不能得到總輸入。"},{"id":"BIO-B01-Ch1.1.3-B053:B","text":"35 J","explanation":"漏掉散熱15 J。"},{"id":"BIO-B01-Ch1.1.3-B053:C","text":"50 J","explanation":"35＋15＝50 J，符合完整分配。"},{"id":"BIO-B01-Ch1.1.3-B053:D","text":"525 J","explanation":"兩項相乘不符合能量收支。"}],"concept":"","example":"總輸入等於題設兩項去向之和。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B054","topicId":"","stem":"某箭頭圖由「熱離開」再連回「原來全部食物化學能」，並標「自動100%回收」。這個部分應如何評估？","correct":"BIO-B01-Ch1.1.3-B054:A","options":[{"id":"BIO-B01-Ch1.1.3-B054:A","text":"不符合本節，散熱通常不會被同一生態系直接完整回收","explanation":"應把熱表為流出，避免閉合能量環。"},{"id":"BIO-B01-Ch1.1.3-B054:B","text":"正確，物質能循環就代表熱必定循環","explanation":"兩者不能混推。"},{"id":"BIO-B01-Ch1.1.3-B054:C","text":"正確，所有分解者都能完成這種回收","explanation":"分解者回收物質而非全部熱。"},{"id":"BIO-B01-Ch1.1.3-B054:D","text":"不符合，因為生物不會產生熱","explanation":"反對理由錯誤，生物會散熱。"}],"concept":"","example":"正確的系統圖要區分物質回路與能量流出。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B055","topicId":"","stem":"若追蹤葉片糖中的能量被植物自己利用，哪個終點可納入本節的能量流示意？","correct":"BIO-B01-Ch1.1.3-B055:D","options":[{"id":"BIO-B01-Ch1.1.3-B055:A","text":"全部返回原來那束陽光","explanation":"不會完整返回原光束。"},{"id":"BIO-B01-Ch1.1.3-B055:B","text":"永遠只留在糖裡","explanation":"植物利用能量即有轉換與散熱。"},{"id":"BIO-B01-Ch1.1.3-B055:C","text":"化學物質從宇宙消失","explanation":"題目追蹤能量，不是物質消失。"},{"id":"BIO-B01-Ch1.1.3-B055:D","text":"部分以熱轉移到周圍","explanation":"植物也能用化學能做功並散熱。"}],"concept":"","example":"太陽不是每個能量箭頭的返回終點。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B056","topicId":"","stem":"分解者沒有出現在「太陽→植物→昆蟲→鳥」這張簡圖。能否因此說它與能量流無關？","correct":"BIO-B01-Ch1.1.3-B056:B","options":[{"id":"BIO-B01-Ch1.1.3-B056:A","text":"可以，所有未畫出的生物都不耗能","explanation":"簡圖省略不等於沒有活動。"},{"id":"BIO-B01-Ch1.1.3-B056:B","text":"不可以，分解者也利用有機物化學能並散熱","explanation":"需根據角色功能判斷，不能只看簡圖有無。"},{"id":"BIO-B01-Ch1.1.3-B056:C","text":"可以，分解者只由土壤礦物質取得陽光","explanation":"錯置其能量來源。"},{"id":"BIO-B01-Ch1.1.3-B056:D","text":"不可以，因為分解者能回收所有熱","explanation":"結論否定但理由錯誤。"}],"concept":"","example":"教材的簡化順序不是完整列舉。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁（15_imagegen_page_08.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B057","topicId":"","stem":"某記錄只有熱散失量，沒有化學能輸入量。能否據此算出「輸入有多少比例散熱」？","correct":"BIO-B01-Ch1.1.3-B057:C","options":[{"id":"BIO-B01-Ch1.1.3-B057:A","text":"可以，比例永遠等於100%","explanation":"不能無條件設定全部散熱。"},{"id":"BIO-B01-Ch1.1.3-B057:B","text":"可以，散熱數值本身就是百分比","explanation":"能量量值與百分比不同。"},{"id":"BIO-B01-Ch1.1.3-B057:C","text":"不能，還需要相應輸入量","explanation":"比例須用散熱量除以相應輸入量。"},{"id":"BIO-B01-Ch1.1.3-B057:D","text":"不能，因為散熱不涉及任何能量","explanation":"散熱涉及能量，只是缺資料。"}],"concept":"","example":"比較比例前先確認分母與單位。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B058","topicId":"","stem":"有人把「使用食物能量」理解為「所有能量都永遠留在原生物，繼續供它做功」。哪項反例最直接？","correct":"BIO-B01-Ch1.1.3-B058:A","options":[{"id":"BIO-B01-Ch1.1.3-B058:A","text":"生物做功時有部分能量向周圍散熱","explanation":"散熱顯示不會全部留在原生物供後續使用。"},{"id":"BIO-B01-Ch1.1.3-B058:B","text":"植物可吸收土壤成分","explanation":"談物質，不直接反駁能量全留說。"},{"id":"BIO-B01-Ch1.1.3-B058:C","text":"落葉有顏色","explanation":"與能量去向無直接關係。"},{"id":"BIO-B01-Ch1.1.3-B058:D","text":"動物的身體由物質構成","explanation":"為真但不是最直接的能量流反例。"}],"concept":"","example":"反駁某主張要用相同對象的證據。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B059","topicId":"","stem":"在僅含做功與散熱的模型中，40 J化學能有10 J用於做功。散熱占輸入比例多少？","correct":"BIO-B01-Ch1.1.3-B059:D","options":[{"id":"BIO-B01-Ch1.1.3-B059:A","text":"25%","explanation":"10÷40是做功比例。"},{"id":"BIO-B01-Ch1.1.3-B059:B","text":"50%","explanation":"30÷40並非一半。"},{"id":"BIO-B01-Ch1.1.3-B059:C","text":"100%","explanation":"仍有10 J分配做功。"},{"id":"BIO-B01-Ch1.1.3-B059:D","text":"75%","explanation":"散熱40−10＝30 J；30÷40＝75%。"}],"concept":"","example":"比例源自題目數值，不能當作普遍生態效率。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B060","topicId":"","stem":"某說明把「能量單向流動」理解為「能量只能保持光能、不許變成化學能」。哪項修正最合適？","correct":"BIO-B01-Ch1.1.3-B060:B","options":[{"id":"BIO-B01-Ch1.1.3-B060:A","text":"保留，單向就是不轉換","explanation":"方向和形式是不同問題。"},{"id":"BIO-B01-Ch1.1.3-B060:B","text":"單向指整體通過生態系的方向，過程中仍可轉換形式","explanation":"光能可轉成化學能，最後常散熱。"},{"id":"BIO-B01-Ch1.1.3-B060:C","text":"改為能量完全循環且不散熱","explanation":"與本節核心相反。"},{"id":"BIO-B01-Ch1.1.3-B060:D","text":"改為能量只能停在土壤中","explanation":"不符合能量路徑。"}],"concept":"","example":"方向性與能量轉換可同時成立。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B061","topicId":"","stem":"若用某化學成分追蹤「空氣或土壤→植物身體→草食動物」，哪項推論受支持？","correct":"BIO-B01-Ch1.1.3-B061:C","options":[{"id":"BIO-B01-Ch1.1.3-B061:A","text":"這證明原分子永遠不改變","explanation":"成分可被重新組成不同分子。"},{"id":"BIO-B01-Ch1.1.3-B061:B","text":"這證明能量已完整循環","explanation":"追蹤物質不能直接證明能量循環。"},{"id":"BIO-B01-Ch1.1.3-B061:C","text":"環境中的物質可經植物與取食進入動物","explanation":"與所列路徑直接相符。"},{"id":"BIO-B01-Ch1.1.3-B061:D","text":"這證明物質一定永久消失於動物","explanation":"進入動物不等於消失。"}],"concept":"","example":"追蹤化學成分可以不要求原分子形態固定。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B062","topicId":"","stem":"已知遺體成分經分解回到土壤，要證明此物質路徑可接成循環，接下來應追蹤哪項？","correct":"BIO-B01-Ch1.1.3-B062:A","options":[{"id":"BIO-B01-Ch1.1.3-B062:A","text":"植物是否再吸收返回環境的成分","explanation":"重新進入生物可接續本節循環。"},{"id":"BIO-B01-Ch1.1.3-B062:B","text":"熱是否回到原太陽","explanation":"這不是物質循環的下一步。"},{"id":"BIO-B01-Ch1.1.3-B062:C","text":"動物能否直接吞光","explanation":"與物質回收無關。"},{"id":"BIO-B01-Ch1.1.3-B062:D","text":"遺體是否完全無物質","explanation":"遺體本來含物質。"}],"concept":"","example":"「返回環境」與「重新吸收」是相接的兩步。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B063","topicId":"","stem":"某圖把所有物質路徑畫成「植物→動物→消失」。依本節，最必要的修正是什麼？","correct":"BIO-B01-Ch1.1.3-B063:D","options":[{"id":"BIO-B01-Ch1.1.3-B063:A","text":"補上動物把所有物質變成陽光","explanation":"這會形成錯誤來源。"},{"id":"BIO-B01-Ch1.1.3-B063:B","text":"將植物從圖中刪除","explanation":"植物是吸收物質的環節。"},{"id":"BIO-B01-Ch1.1.3-B063:C","text":"把消失改名為能量循環即可","explanation":"改名不能修復錯誤路徑。"},{"id":"BIO-B01-Ch1.1.3-B063:D","text":"加入廢物或遺體經分解返回環境並再被吸收","explanation":"可完整表達回收路徑。"}],"concept":"","example":"物質的去向不應在取食後無故截斷。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B064","topicId":"","stem":"一片葉子脫落後直接被分解，其中成分再被植物吸收。這條路徑缺少動物，還能叫物質循環嗎？","correct":"BIO-B01-Ch1.1.3-B064:B","options":[{"id":"BIO-B01-Ch1.1.3-B064:A","text":"不能，動物必定是每次循環的必要一步","explanation":"本節落葉分解不必先經動物。"},{"id":"BIO-B01-Ch1.1.3-B064:B","text":"能，物質已經過生物、環境與再吸收","explanation":"循環不要求每次通過所有角色。"},{"id":"BIO-B01-Ch1.1.3-B064:C","text":"不能，沒有動物就沒有化學物質","explanation":"植物及環境也含化學物質。"},{"id":"BIO-B01-Ch1.1.3-B064:D","text":"能，因為所有散熱都被收回","explanation":"答案雖可，但理由錯誤。"}],"concept":"","example":"簡圖不能當作每個物質必經的固定路線。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B065","topicId":"","stem":"若「土壤→植物」箭頭的標籤寫成「已散失的能量完整返回」，應改成哪項？","correct":"BIO-B01-Ch1.1.3-B065:C","options":[{"id":"BIO-B01-Ch1.1.3-B065:A","text":"土壤創造新能量","explanation":"仍把物質來源混成創造能量。"},{"id":"BIO-B01-Ch1.1.3-B065:B","text":"植物把土壤變成太陽","explanation":"沒有此過程。"},{"id":"BIO-B01-Ch1.1.3-B065:C","text":"植物吸收環境中的化學物質","explanation":"符合物質由環境進入植物的路徑。"},{"id":"BIO-B01-Ch1.1.3-B065:D","text":"植物停止一切能量需求","explanation":"吸收物質不取消工作需求。"}],"concept":"","example":"土壤養分回收與能量回收要區分。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B066","topicId":"","stem":"追蹤同一元素的原子在不同生物與環境間轉移，為何不必要求「同一分子永遠不變」？","correct":"BIO-B01-Ch1.1.3-B066:A","options":[{"id":"BIO-B01-Ch1.1.3-B066:A","text":"原子可被納入不同分子，成分仍可回收","explanation":"化學轉換不妨礙物質循環。"},{"id":"BIO-B01-Ch1.1.3-B066:B","text":"循環表示原子必定消滅","explanation":"循環不是消滅。"},{"id":"BIO-B01-Ch1.1.3-B066:C","text":"不同分子表示根本沒有物質","explanation":"分子改變後仍有物質。"},{"id":"BIO-B01-Ch1.1.3-B066:D","text":"只要分子改變就證明能量完全回收","explanation":"物質形態改變不能推出能量循環。"}],"concept":"","example":"原料可重新組合，仍屬物質的再利用。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B067","topicId":"","stem":"研究表只有「植物中的某成分進入動物體內」。哪個結論尚不能單憑此資料成立？","correct":"BIO-B01-Ch1.1.3-B067:D","options":[{"id":"BIO-B01-Ch1.1.3-B067:A","text":"物質可沿取食關係轉移","explanation":"觀察直接支持。"},{"id":"BIO-B01-Ch1.1.3-B067:B","text":"動物取得了植物的一部分物質","explanation":"同樣直接支持。"},{"id":"BIO-B01-Ch1.1.3-B067:C","text":"食物涉及實際化學成分","explanation":"與觀察相符。"},{"id":"BIO-B01-Ch1.1.3-B067:D","text":"該成分已完成返回環境再被植物吸收的整個循環","explanation":"資料只涵蓋其中一段，未證實後續。"}],"concept":"","example":"單一箭頭可支持轉移，完整回路需要更多環節。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B068","topicId":"","stem":"某成分已由植物轉進動物；若要畫本節常見回環境路徑，哪一項合適？","correct":"BIO-B01-Ch1.1.3-B068:B","options":[{"id":"BIO-B01-Ch1.1.3-B068:A","text":"動物把成分直接變成太陽光","explanation":"不符合物質回收。"},{"id":"BIO-B01-Ch1.1.3-B068:B","text":"廢物或遺體經分解，使成分回到環境","explanation":"符合分解者的物質回收功能。"},{"id":"BIO-B01-Ch1.1.3-B068:C","text":"該成分只能永久封存在動物","explanation":"物質可經排泄與分解回環境。"},{"id":"BIO-B01-Ch1.1.3-B068:D","text":"熱代替全部原子回到土壤","explanation":"熱不能作為相同化學成分的替代。"}],"concept":"","example":"活體內的物質可透過不同出口進入回收路徑。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B069","topicId":"","stem":"在同一片草地，物質可返回土壤，能量可向外散熱。對這兩項觀察，哪句解釋最好？","correct":"BIO-B01-Ch1.1.3-B069:C","options":[{"id":"BIO-B01-Ch1.1.3-B069:A","text":"土壤回收成分表示光能完全回來","explanation":"把物質回收誤當能量回收。"},{"id":"BIO-B01-Ch1.1.3-B069:B","text":"熱散失表示化學成分永不回來","explanation":"能量流出不否定物質循環。"},{"id":"BIO-B01-Ch1.1.3-B069:C","text":"兩者追蹤不同對象，可以同時發生","explanation":"物質循環與能量流動不矛盾。"},{"id":"BIO-B01-Ch1.1.3-B069:D","text":"若能量外流就絕不能存在生物","explanation":"有外界能量輸入可支持活動。"}],"concept":"","example":"同一生態系可以使用兩套不同方向的箭頭。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B070","topicId":"","stem":"圖表四格為環境、植物、動物、分解過程；若箭頭代表化學成分，哪組可形成教學用回路？","correct":"BIO-B01-Ch1.1.3-B070:A","options":[{"id":"BIO-B01-Ch1.1.3-B070:A","text":"環境→植物→動物→分解過程→環境","explanation":"符合吸收、取食及分解回收。"},{"id":"BIO-B01-Ch1.1.3-B070:B","text":"環境→熱→太陽→植物→環境","explanation":"混入能量形式而非同一物質追蹤。"},{"id":"BIO-B01-Ch1.1.3-B070:C","text":"植物→動物→能量消失→環境","explanation":"把物質路徑寫成能量消失。"},{"id":"BIO-B01-Ch1.1.3-B070:D","text":"動物→植物→太陽→分解過程","explanation":"不符合已給的取食與分解方向。"}],"concept":"","example":"這是可能的簡化回路，而非每個原子的唯一旅程。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B071","topicId":"","stem":"「物質循環」是否表示生態系內每一個原子都一定永遠留在原地？","correct":"BIO-B01-Ch1.1.3-B071:D","options":[{"id":"BIO-B01-Ch1.1.3-B071:A","text":"是，循環就是永不移動","explanation":"循環包含移動與轉換。"},{"id":"BIO-B01-Ch1.1.3-B071:B","text":"是，只要離開原生物就不再是物質","explanation":"物質在環境仍是物質。"},{"id":"BIO-B01-Ch1.1.3-B071:C","text":"否，因為物質必定完全消失","explanation":"不必原地保留不等於消失。"},{"id":"BIO-B01-Ch1.1.3-B071:D","text":"否，本節說的是成分可在生物與環境間回收利用","explanation":"循環概念不要求所有原子永遠固定一處。"}],"concept":"","example":"循環包含位置轉移，不是原子永遠固定不動。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B072","topicId":"","stem":"兩組落葉中，甲組分解較慢，乙組分解較快；其餘條件相同。依本節，可先關注哪項差異？","correct":"BIO-B01-Ch1.1.3-B072:B","options":[{"id":"BIO-B01-Ch1.1.3-B072:A","text":"兩組各自創造太陽能的速率","explanation":"分解不創造太陽能。"},{"id":"BIO-B01-Ch1.1.3-B072:B","text":"葉中化學成分返回環境的進程","explanation":"分解速率可能影響物質回收進程。"},{"id":"BIO-B01-Ch1.1.3-B072:C","text":"所有植物必然立即死亡的時間","explanation":"本節不足以推出立即死亡。"},{"id":"BIO-B01-Ch1.1.3-B072:D","text":"物質從宇宙消滅的速度","explanation":"分解不是物質消滅。"}],"concept":"","example":"可推論影響回收進程，不必宣稱整個生態系立即崩潰。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B073","topicId":"","stem":"為何把「分解後成分回到空氣或土壤」列入循環，而不是當作物質消失？","correct":"BIO-B01-Ch1.1.3-B073:C","options":[{"id":"BIO-B01-Ch1.1.3-B073:A","text":"因為環境中完全沒有物質","explanation":"環境含可被吸收的化學物質。"},{"id":"BIO-B01-Ch1.1.3-B073:B","text":"因為成分已全變成太陽光","explanation":"不符合本節。"},{"id":"BIO-B01-Ch1.1.3-B073:C","text":"成分仍在環境，後續可再被生物吸收","explanation":"位置改變不等於不存在。"},{"id":"BIO-B01-Ch1.1.3-B073:D","text":"因為回到環境就必定成為原來同一分子","explanation":"再利用不要求原分子不變。"}],"concept":"","example":"物質出了生物體，仍有可追蹤的去向。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B074","topicId":"","stem":"一個示意圖以藍線追蹤化學成分、紅線追蹤能量；藍線經土壤回植物。此時應如何處理紅線？","correct":"BIO-B01-Ch1.1.3-B074:A","options":[{"id":"BIO-B01-Ch1.1.3-B074:A","text":"另依能量輸入、轉換及散熱畫出，不照抄藍色回路","explanation":"同場景的兩種對象有不同典型路徑。"},{"id":"BIO-B01-Ch1.1.3-B074:B","text":"也必須經土壤回到全部原來的化學能","explanation":"物質回路不能強制套在能量。"},{"id":"BIO-B01-Ch1.1.3-B074:C","text":"直接刪除能量，因為物質已循環","explanation":"物質循環不取消能量流動。"},{"id":"BIO-B01-Ch1.1.3-B074:D","text":"標紅線為新的物質原子","explanation":"改變了原先追蹤對象。"}],"concept":"","example":"顏色只是標記，真正重要的是箭頭追蹤的對象。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B075","topicId":"","stem":"植物所需化學成分的一部分曾在先前生物體內，這項敘述最合理的來源解釋是什麼？","correct":"BIO-B01-Ch1.1.3-B075:D","options":[{"id":"BIO-B01-Ch1.1.3-B075:A","text":"先前生物的全部熱變成該成分","explanation":"化學成分不是由全部散熱回收而來。"},{"id":"BIO-B01-Ch1.1.3-B075:B","text":"所有植物都必須直接吃先前生物","explanation":"植物可從環境吸收回收成分。"},{"id":"BIO-B01-Ch1.1.3-B075:C","text":"成分只能由植物從無創造","explanation":"物質有來源，非無中生有。"},{"id":"BIO-B01-Ch1.1.3-B075:D","text":"先前生物的廢物或遺體經分解，使成分回到環境","explanation":"可再被植物吸收，符合物質循環。"}],"concept":"","example":"物質再利用可跨越不同生物個體。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B076","topicId":"","stem":"一份資料記錄「空氣中的成分→植物→落葉→分解→空氣中的成分」。這組資訊最直接支持哪項？","correct":"BIO-B01-Ch1.1.3-B076:B","options":[{"id":"BIO-B01-Ch1.1.3-B076:A","text":"每個原分子在全程一定不變","explanation":"資料只追蹤成分，不能推出原分子不變。"},{"id":"BIO-B01-Ch1.1.3-B076:B","text":"化學成分可往返於生物與環境","explanation":"路徑具有進入植物與返回環境的環節。"},{"id":"BIO-B01-Ch1.1.3-B076:C","text":"全部光能已由空氣回收","explanation":"資料未追蹤能量。"},{"id":"BIO-B01-Ch1.1.3-B076:D","text":"植物不需要外界物質","explanation":"資料明確包含外界成分進入植物。"}],"concept":"","example":"物質回路可以包含空氣，不只包含土壤。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B077","topicId":"","stem":"分解者處理落葉後，使植物可重新利用一些成分。為何不能把這項作用寫成「分解者回收能量」？","correct":"BIO-B01-Ch1.1.3-B077:C","options":[{"id":"BIO-B01-Ch1.1.3-B077:A","text":"因為分解者根本沒有生命活動","explanation":"分解者是活的生物，有細胞工作。"},{"id":"BIO-B01-Ch1.1.3-B077:B","text":"因為植物不使用任何物質","explanation":"植物會吸收化學成分。"},{"id":"BIO-B01-Ch1.1.3-B077:C","text":"回到環境供再吸收的是物質，分解者利用能量時仍散熱","explanation":"兩條路徑的方向不同。"},{"id":"BIO-B01-Ch1.1.3-B077:D","text":"因為落葉原本毫無化學能","explanation":"落葉有機物可含化學能。"}],"concept":"","example":"可同時說「回收物質」和「利用化學能」。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B078","topicId":"","stem":"同時測得分解落葉的真菌生長、向外散熱及成分回到土壤。最合適的綜合解釋為何？","correct":"BIO-B01-Ch1.1.3-B078:A","options":[{"id":"BIO-B01-Ch1.1.3-B078:A","text":"真菌利用有機物能量維持活動，也使物質回環境","explanation":"三個現象符合分解者的角色。"},{"id":"BIO-B01-Ch1.1.3-B078:B","text":"真菌只回收熱，從未利用有機物","explanation":"與題述分解落葉矛盾。"},{"id":"BIO-B01-Ch1.1.3-B078:C","text":"真菌不參與物質循環","explanation":"成分回土壤正涉及循環。"},{"id":"BIO-B01-Ch1.1.3-B078:D","text":"真菌的散熱表示所有物質消失","explanation":"熱散失不代表物質消滅。"}],"concept":"","example":"分解者不是只在物質圖中出現的角色。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B079","topicId":"","stem":"某環境中分解活動受到抑制。只依本節，哪個預期最有根據？","correct":"BIO-B01-Ch1.1.3-B079:D","options":[{"id":"BIO-B01-Ch1.1.3-B079:A","text":"太陽會立刻停止發光","explanation":"分解者不控制太陽發光。"},{"id":"BIO-B01-Ch1.1.3-B079:B","text":"植物將立刻不需要任何原料","explanation":"原料需求不會因此取消。"},{"id":"BIO-B01-Ch1.1.3-B079:C","text":"能量將從此完整循環","explanation":"抑制分解不使熱完整回收。"},{"id":"BIO-B01-Ch1.1.3-B079:D","text":"廢物或遺體成分返回環境的過程可能受阻","explanation":"分解者是促進回收的重要角色。"}],"concept":"","example":"本節支持回收受影響，不支持所有生物立即死亡的絕對推論。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B080","topicId":"","stem":"下列哪一項觀察最直接顯示分解者的物質回收功能？","correct":"BIO-B01-Ch1.1.3-B080:B","options":[{"id":"BIO-B01-Ch1.1.3-B080:A","text":"光線由太陽射入葉片","explanation":"這是能量入口。"},{"id":"BIO-B01-Ch1.1.3-B080:B","text":"遺體經分解後，部分成分回土壤並可被植物再吸收","explanation":"直接連結分解與回收。"},{"id":"BIO-B01-Ch1.1.3-B080:C","text":"動物肌肉收縮","explanation":"這是做功例子。"},{"id":"BIO-B01-Ch1.1.3-B080:D","text":"葉片把光能轉成化學能","explanation":"這是光合作用轉能。"}],"concept":"","example":"觀察對象要能連到「返回環境」這個步驟。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B081","topicId":"","stem":"學生說「分解者把物質送回循環，因此不會向外散熱」。哪句指出錯誤？","correct":"BIO-B01-Ch1.1.3-B081:C","options":[{"id":"BIO-B01-Ch1.1.3-B081:A","text":"物質不能循環，整句都應改為物質消失","explanation":"物質可以循環。"},{"id":"BIO-B01-Ch1.1.3-B081:B","text":"只要不運動就一定不能散熱","explanation":"細胞工作也可散熱。"},{"id":"BIO-B01-Ch1.1.3-B081:C","text":"回收物質不排除利用化學能做功及散熱","explanation":"兩種作用可以並行。"},{"id":"BIO-B01-Ch1.1.3-B081:D","text":"散熱代表分解者必須創造新能量","explanation":"它利用既有能量，不創造。"}],"concept":"","example":"不要用物質功能去否定能量需求。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁（15_imagegen_page_08.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B082","topicId":"","stem":"設計分解者教學圖時，哪組兩條線的安排正確？","correct":"BIO-B01-Ch1.1.3-B082:A","options":[{"id":"BIO-B01-Ch1.1.3-B082:A","text":"物質線通往環境可再被吸收；能量線由有機物經利用並向外散熱","explanation":"兩條線分別對應其物質及能量角色。"},{"id":"BIO-B01-Ch1.1.3-B082:B","text":"物質線終於完全消失；能量線完整回太陽","explanation":"兩條線都錯。"},{"id":"BIO-B01-Ch1.1.3-B082:C","text":"物質線完全不連植物；能量線表示從無生成","explanation":"忽略再利用並誤稱創能。"},{"id":"BIO-B01-Ch1.1.3-B082:D","text":"兩條線都標成原樣陽光","explanation":"未區分物質與能量形式。"}],"concept":"","example":"分解者圖可以同時顯示兩種追蹤。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B083","topicId":"","stem":"一塊枯木被分解，原有的部分化學成分之後出現在環境中。哪項結論不受支持？","correct":"BIO-B01-Ch1.1.3-B083:D","options":[{"id":"BIO-B01-Ch1.1.3-B083:A","text":"枯木可提供分解的有機物","explanation":"死亡植物組織可被分解。"},{"id":"BIO-B01-Ch1.1.3-B083:B","text":"成分可由遺體返回環境","explanation":"觀察直接支持。"},{"id":"BIO-B01-Ch1.1.3-B083:C","text":"分解者可參與物質回收","explanation":"符合此處作用。"},{"id":"BIO-B01-Ch1.1.3-B083:D","text":"枯木中的全部化學能已完整回收到植物","explanation":"追蹤成分不代表所有能量被回收。"}],"concept":"","example":"物質回收的證據不能跨用為全部能量回收證據。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B084","topicId":"","stem":"真菌正在分解有機廢物。若問它的能量角色，哪項最準確？","correct":"BIO-B01-Ch1.1.3-B084:B","options":[{"id":"BIO-B01-Ch1.1.3-B084:A","text":"沒有角色，因為它只做物質回收","explanation":"它的工作也需要能量。"},{"id":"BIO-B01-Ch1.1.3-B084:B","text":"可利用廢物中有機物的化學能並散熱","explanation":"這是分解者參與能量流的方式。"},{"id":"BIO-B01-Ch1.1.3-B084:C","text":"它必定先直接吸收陽光才可分解","explanation":"本節不把直接光合作用設為分解條件。"},{"id":"BIO-B01-Ch1.1.3-B084:D","text":"它可將任何散熱100%回收","explanation":"不符合本節散熱描述。"}],"concept":"","example":"分解者不是能量流之外的例外。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B085","topicId":"","stem":"一張概念卡列「分解者→土壤、水或空氣→植物再吸收」。中央那格應如何命名？","correct":"BIO-B01-Ch1.1.3-B085:C","options":[{"id":"BIO-B01-Ch1.1.3-B085:A","text":"完整回收的光能","explanation":"中央不是光能回收。"},{"id":"BIO-B01-Ch1.1.3-B085:B","text":"從無生成的食物","explanation":"題述是環境化學成分。"},{"id":"BIO-B01-Ch1.1.3-B085:C","text":"回到環境的化學物質","explanation":"可被植物再吸收的對象是物質。"},{"id":"BIO-B01-Ch1.1.3-B085:D","text":"已經消滅的原料","explanation":"消滅的原料不能再被吸收，且不符分解原則。"}],"concept":"","example":"節點名稱需和後續吸收箭頭一致。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B086","topicId":"","stem":"若把分解者從物質循環示意圖刪除，又未提供其他回收途徑，最容易漏掉哪個連結？","correct":"BIO-B01-Ch1.1.3-B086:A","options":[{"id":"BIO-B01-Ch1.1.3-B086:A","text":"廢物與遺體的成分如何返回環境","explanation":"這是分解者的重要功能。"},{"id":"BIO-B01-Ch1.1.3-B086:B","text":"太陽如何從植物獲得能量","explanation":"本節沒有這種返回路徑。"},{"id":"BIO-B01-Ch1.1.3-B086:C","text":"能量如何從無生成","explanation":"沒有此合法環節。"},{"id":"BIO-B01-Ch1.1.3-B086:D","text":"光合生物如何直接吃昆蟲","explanation":"並非本節必要的回收連結。"}],"concept":"","example":"刪圖示角色時，要核對是否失去必要功能。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）; 正式第12張／正文第10頁（19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B087","topicId":"","stem":"有人因為細菌與真菌可作分解者，就說「只要看到細菌，就能斷定它當下正在分解落葉」。哪種評估較好？","correct":"BIO-B01-Ch1.1.3-B087:D","options":[{"id":"BIO-B01-Ch1.1.3-B087:A","text":"正確，名稱足以證明任何當下活動","explanation":"生物名稱不能證明特定當下過程。"},{"id":"BIO-B01-Ch1.1.3-B087:B","text":"正確，細菌只能處理落葉","explanation":"本節分解來源包含多種有機物，不是只有落葉。"},{"id":"BIO-B01-Ch1.1.3-B087:C","text":"錯誤，因為沒有細菌可分解","explanation":"教材列細菌為分解者例子。"},{"id":"BIO-B01-Ch1.1.3-B087:D","text":"證據不足，仍須看到或知道其分解有機物的活動","explanation":"類群例子不能取代特定情境的功能證據。"}],"concept":"","example":"本題要求辨識功能，不延伸細菌分類細節。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B088","topicId":"","stem":"分解者與光合生產者在物質回收路徑上的互補關係，哪項描述正確？","correct":"BIO-B01-Ch1.1.3-B088:B","options":[{"id":"BIO-B01-Ch1.1.3-B088:A","text":"兩者都把物質完全消滅","explanation":"兩者都不是消滅物質。"},{"id":"BIO-B01-Ch1.1.3-B088:B","text":"分解使成分回環境，植物可再吸收","explanation":"呈現返回與重新進入生物的連結。"},{"id":"BIO-B01-Ch1.1.3-B088:C","text":"植物把所有散熱交給分解者變回陽光","explanation":"不符合能量路徑。"},{"id":"BIO-B01-Ch1.1.3-B088:D","text":"分解者存在使植物不再需要能量","explanation":"物質供應不取消能量需求。"}],"concept":"","example":"只討論本節的分解與吸收，不展開其他交互作用機制。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B089","topicId":"","stem":"同一圖中，實線追蹤食物化學能到熱，虛線追蹤化學成分回土壤。最合理的圖例為何？","correct":"BIO-B01-Ch1.1.3-B089:C","options":[{"id":"BIO-B01-Ch1.1.3-B089:A","text":"實線與虛線皆為完整能量循環","explanation":"實線有熱流出，虛線追蹤的是物質。"},{"id":"BIO-B01-Ch1.1.3-B089:B","text":"實線是物質消失，虛線是太陽創造","explanation":"都與箭頭對象不符。"},{"id":"BIO-B01-Ch1.1.3-B089:C","text":"實線為能量流動，虛線為物質循環","explanation":"兩條路徑的對象與終點符合本節。"},{"id":"BIO-B01-Ch1.1.3-B089:D","text":"實線只描述物質，虛線只描述熱","explanation":"把兩線身份顛倒。"}],"concept":"","example":"圖例必須對應實際被追蹤的量。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B090","topicId":"","stem":"學生看見某種化學成分在植物、動物與環境間轉移，便斷言「能量也一定沿同樣回路完全回收」。應如何修正？","correct":"BIO-B01-Ch1.1.3-B090:A","options":[{"id":"BIO-B01-Ch1.1.3-B090:A","text":"物質循環不能直接證明能量循環；還需依能量轉換與散熱判斷","explanation":"兩者不是可直接互換的證據。"},{"id":"BIO-B01-Ch1.1.3-B090:B","text":"只要成分進入生物，就不再屬於物質","explanation":"化學成分進入生物體後仍然是物質。"},{"id":"BIO-B01-Ch1.1.3-B090:C","text":"所有物質也必定只能單向散熱","explanation":"物質不是以熱散失的能量形式。"},{"id":"BIO-B01-Ch1.1.3-B090:D","text":"原推論正確，任何回路都必定回收能量","explanation":"忽略熱散失與追蹤對象差異。"}],"concept":"","example":"資料說明哪一種對象，就先限制在那種對象。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正
