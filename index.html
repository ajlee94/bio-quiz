正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B071","topicId":"BIO-C1.1I-ADAPT","stem":"假想族群原有深、淺兩種可遺傳體色。深色個體在暗背景較少被捕食並留下較多後代，數代後深色比例上升。何者符合資料？","correct":"BIO-B01-Ch1.1-B071:C","options":[{"id":"BIO-B01-Ch1.1-B071:A","text":"所有淺色個體因想躲藏而當場變黑","explanation":"資料是後代組成改變，非所有淺色個體即時變黑。"},{"id":"BIO-B01-Ch1.1-B071:B","text":"只要背景變暗，遺傳差異就不再重要","explanation":"可遺傳差異正是世代累積的基礎。"},{"id":"BIO-B01-Ch1.1-B071:C","text":"原有可遺傳差異與繁殖成功相關，使族群比例改變","explanation":"此項依原有差異、成功差別與多代結果推導。"},{"id":"BIO-B01-Ch1.1-B071:D","text":"深色增加表示每個個體當天都改變了基因","explanation":"族群比例變化不要求每個個體當天改變基因。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：先有可遺傳差異，再有環境下的繁殖成功差別，最後表現為多代比例改變。這條因果鏈無需假設個體主動變色或當天遺傳改寫。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B072","topicId":"BIO-C1.1I-ADAPT","stem":"同一動物遇到暗背景後短時間改變外觀，研究未測遺傳性或後代。僅憑此資料，哪項結論最適合？","correct":"BIO-B01-Ch1.1-B072:D","options":[{"id":"BIO-B01-Ch1.1-B072:A","text":"已證明整個族群演化為新物種","explanation":"一個個體短期變化不支持物種形成。"},{"id":"BIO-B01-Ch1.1-B072:B","text":"已證明所有後代都會有相同外觀","explanation":"沒有後代資料不能推其特徵。"},{"id":"BIO-B01-Ch1.1-B072:C","text":"已證明此變化永遠有利","explanation":"有利與否須依環境及結果，不能全稱保證。"},{"id":"BIO-B01-Ch1.1-B072:D","text":"可描述個體反應，尚不能證明跨代演化適應","explanation":"此項限定於已觀察的個體反應，保留演化證據缺口。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：短期個體變化可屬反應或調整；演化適應還需遺傳性、繁殖成功及族群世代資料。資料不足不等於否認此能力可能有演化歷史。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B073","topicId":"BIO-C1.1I-ADAPT","stem":"假想生物被人工塗上深色後在暗背景較不易被捕食，但塗色不會遺傳。若只靠這個塗色效果，還缺哪個演化適應的關鍵環節？","correct":"BIO-B01-Ch1.1-B073:A","options":[{"id":"BIO-B01-Ch1.1-B073:A","text":"色彩差異可經繁殖傳給後代的證據","explanation":"可遺傳性是由個體效果進到世代累積所需的環節。"},{"id":"BIO-B01-Ch1.1-B073:B","text":"證明深色肉眼可見的證據","explanation":"題設已有深色處理，不是主要缺口。"},{"id":"BIO-B01-Ch1.1-B073:C","text":"證明暗背景存在的證據","explanation":"題設已明定暗背景。"},{"id":"BIO-B01-Ch1.1-B073:D","text":"個體當下能存活的證據","explanation":"題面已給較少被捕食的效果，問題不在此處。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：題設已有環境與當下存活效果，卻明說塗色不遺傳。人工塗色不會因親代存活而自動傳給後代，所以缺的是跨代延續的可遺傳基礎。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B074","topicId":"BIO-C1.1I-ADAPT","stem":"某族群的一項可遺傳特徵起初占20%，多代後占60%。資料另證明該特徵在此環境有助留下後代。哪項解讀正確？","correct":"BIO-B01-Ch1.1-B074:B","options":[{"id":"BIO-B01-Ch1.1-B074:A","text":"所有個體都在一次成長中增加40%體重","explanation":"百分比是族群特徵比例，並非個體體重。"},{"id":"BIO-B01-Ch1.1-B074:B","text":"特徵比例增加40個百分點，符合題設的適應性累積","explanation":"此項計算及尺度均正確，且以題設繁殖成功支持解讀。"},{"id":"BIO-B01-Ch1.1-B074:C","text":"有此特徵的個體必定增加40個","explanation":"未提供各代總數，不能由比例差求個體數差。"},{"id":"BIO-B01-Ch1.1-B074:D","text":"每個個體都主動把自己轉為該型","explanation":"比例變化不表示每個個體主動轉型。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：60%−20%＝40個百分點，指族群中可遺傳特徵的比例變化。結合較多後代的證據，支持適應性累積；沒有總個體數就不能算增加幾個。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B075","topicId":"BIO-C1.1I-ADAPT","stem":"觀察到某可遺傳特徵在環境甲有利，能否直接宣布它在所有環境都一定有利？","correct":"BIO-B01-Ch1.1-B075:C","options":[{"id":"BIO-B01-Ch1.1-B075:A","text":"可以，所有環境的選擇條件都相同","explanation":"不同環境可能有不同條件，不能假定一致。"},{"id":"BIO-B01-Ch1.1-B075:B","text":"可以，凡可遺傳者都必完美","explanation":"可遺傳不等於完美或在所有情況有利。"},{"id":"BIO-B01-Ch1.1-B075:C","text":"不可以，有利與否須依特定環境及繁殖結果判斷","explanation":"此項保留環境與繁殖成功的必要條件。"},{"id":"BIO-B01-Ch1.1-B075:D","text":"不可以，因為所有可遺傳特徵都無法影響後代","explanation":"可遺傳特徵能傳給後代，此理由錯誤。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：演化適應具有環境條件。某特徵在特定環境有利，不保證換一環境仍有同樣結果；遺傳性與普遍有利不是同義詞。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B076","topicId":"BIO-C1.1I-ADAPT","stem":"研究者要支持「某保護色是由天擇累積」，哪組資料最相關？","correct":"BIO-B01-Ch1.1-B076:D","options":[{"id":"BIO-B01-Ch1.1-B076:A","text":"單一個體喜歡哪種背景及一天的心情","explanation":"主觀偏好不等於遺傳差異與繁殖成功。"},{"id":"BIO-B01-Ch1.1-B076:B","text":"只有某個體變大前後的尺寸","explanation":"個體尺寸前後變化主要支持生長。"},{"id":"BIO-B01-Ch1.1-B076:C","text":"只有植物葉片閉合前後的位置","explanation":"葉片動作主要支持刺激反應。"},{"id":"BIO-B01-Ch1.1-B076:D","text":"體色的遺傳性、不同體色的後代數及多代族群比例","explanation":"三類資料對應遺傳基礎、選擇結果與世代累積。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：天擇解釋需把可遺傳差異、繁殖成功差異與多代結果連在一起。意願、成長或短期反應資料不足以替代這些要素。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B077","topicId":"BIO-C1.1I-ADAPT","stem":"某假想族群中，甲型親代在一代留下80個後代，乙型親代留下20個後代，全部後代只來自這兩型。甲型親代所留下的後代占本代全部後代多少？","correct":"BIO-B01-Ch1.1-B077:A","options":[{"id":"BIO-B01-Ch1.1-B077:A","text":"80%","explanation":"80除以總數100等於80%，符合所問比例。"},{"id":"BIO-B01-Ch1.1-B077:B","text":"20%","explanation":"20%是乙型所占比例。"},{"id":"BIO-B01-Ch1.1-B077:C","text":"60%","explanation":"以80−20求差得到60，不能把差額當成甲型占總數的百分比。"},{"id":"BIO-B01-Ch1.1-B077:D","text":"400%","explanation":"80/20比較兩型比值，不是甲型占總後代的比例。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：本代後代總數為80＋20＝100，甲型占80/100＝80%。這只算給定繁殖結果；是否構成適應性累積仍須另有遺傳性及多代資料，不把本題算術當完整演化證明。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B078","topicId":"BIO-C1.1I-ADAPT","stem":"「環境改變使較有利的可遺傳特徵經多代增加」應避免被改寫成哪句話？","correct":"BIO-B01-Ch1.1-B078:B","options":[{"id":"BIO-B01-Ch1.1-B078:A","text":"族群成員原有可遺傳差異","explanation":"原有可遺傳差異是合理的選擇基礎。"},{"id":"BIO-B01-Ch1.1-B078:B","text":"個體因為需要，就必定立即產生指定性狀","explanation":"此句加入意願或需求必然造成即時性狀的錯誤因果。"},{"id":"BIO-B01-Ch1.1-B078:C","text":"不同特徵可能導致留下後代的差異","explanation":"繁殖成功差異正是天擇的重要環節。"},{"id":"BIO-B01-Ch1.1-B078:D","text":"多代後族群特徵比例可以改變","explanation":"多代比例改變是可支持演化的結果。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：需要導向的即時改造不是天擇的必要邏輯。天擇對差異及繁殖成功起作用，結果在族群多代中顯現；不能寫成有需要就保證得到。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B079","topicId":"BIO-C1.1I-ADAPT","stem":"甲觀察同一動物熱時增加散熱；乙追蹤有利可遺傳外觀在族群中多代增加。下列哪項比較正確？","correct":"BIO-B01-Ch1.1-B079:C","options":[{"id":"BIO-B01-Ch1.1-B079:A","text":"甲與乙都是單一個體主動演化","explanation":"兩者都不支持個體以意志主動演化。"},{"id":"BIO-B01-Ch1.1-B079:B","text":"甲是繁殖，乙是同一個體生長","explanation":"甲未產生後代，乙不是同一個體長大。"},{"id":"BIO-B01-Ch1.1-B079:C","text":"甲直接屬調節，乙符合演化適應尺度","explanation":"此項將控制與跨代累積各自正確定位。"},{"id":"BIO-B01-Ch1.1-B079:D","text":"甲與乙都不涉及任何生命性質","explanation":"調節與演化適應均屬生命性質。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：甲是在個體當下控制內部條件，乙是族群跨世代的遺傳性狀累積。兩者可能在生物歷史上有關，但本次證據的對象與時間不同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B080","topicId":"BIO-C1.1I-ADAPT","stem":"某族群多代後有利的可遺傳外觀更常見。哪項結論超出已給資料？","correct":"BIO-B01-Ch1.1-B080:D","options":[{"id":"BIO-B01-Ch1.1-B080:A","text":"觀察尺度涉及族群與世代","explanation":"多代族群比例正屬此尺度，沒有超出。"},{"id":"BIO-B01-Ch1.1-B080:B","text":"題設可能由繁殖成功差異解釋","explanation":"若有相關繁殖成功資料，這是符合概念的可能解釋。"},{"id":"BIO-B01-Ch1.1-B080:C","text":"可遺傳性對跨代累積有關","explanation":"遺傳性使特徵可傳到後代，是合理關聯。"},{"id":"BIO-B01-Ch1.1-B080:D","text":"每個具有該特徵的個體都必存活且留下最多後代","explanation":"全體個體必然成功是額外的絕對保證，資料不支持。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：某特徵整體較有利是相對趨勢，不等於每個個體都保證存活或留下最多後代。演化敘述應避免把群體差異誤寫成個體必然結果。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B081","topicId":"BIO-C1.1I-THEMES","stem":"一份報告同時描述幼苗的有序構造、遺傳資訊影響發育及食物能量利用。應如何運用五個統整主題？","correct":"BIO-B01-Ch1.1-B081:C","options":[{"id":"BIO-B01-Ch1.1-B081:A","text":"只能選一項，其餘內容必須刪掉","explanation":"五主題可重疊使用，沒有必須刪除其他焦點的規則。"},{"id":"BIO-B01-Ch1.1-B081:B","text":"既然有多項就無法使用框架","explanation":"多項內容正適合借框架連結。"},{"id":"BIO-B01-Ch1.1-B081:C","text":"分別以組織、資訊及能量與物質連結各觀察焦點","explanation":"此項按構造、訊息與能量各自映射。"},{"id":"BIO-B01-Ch1.1-B081:D","text":"一律歸為演化，不需檢查時間尺度","explanation":"未給多代變化，不能全部當演化。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：這份報告有三個明確焦點，可由多主題協助串連。同一生物可同時涉及多項，並不需要強迫歸為單一互斥類別。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B082","topicId":"BIO-C1.1I-THEMES","stem":"甲句討論「遺傳訊息影響發育」；乙句討論「同個體大小增加」。若分別問統整主題與生命性質，哪組最直接？","correct":"BIO-B01-Ch1.1-B082:D","options":[{"id":"BIO-B01-Ch1.1-B082:A","text":"甲演化；乙繁殖","explanation":"甲未描述跨代變化，乙也未形成後代。"},{"id":"BIO-B01-Ch1.1-B082:B","text":"甲能量與物質；乙秩序","explanation":"甲不是能量收支，乙重點不是排列。"},{"id":"BIO-B01-Ch1.1-B082:C","text":"甲交互作用；乙演化適應","explanation":"乙為個體大小變化，不具演化的世代尺度。"},{"id":"BIO-B01-Ch1.1-B082:D","text":"甲資訊；乙生長","explanation":"此配對分別對應訊息作用及個體增大。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：題目第一部分問框架，第二部分問生命性質。遺傳訊息指資訊；同一個體增大指生長，不能只因兩者都是發育相關就混用層次。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B083","topicId":"BIO-C1.1I-THEMES","stem":"將「能量與物質」拆成兩項，又漏掉交互作用，仍宣稱完整列出五主題。主要錯誤是什麼？","correct":"BIO-B01-Ch1.1-B083:A","options":[{"id":"BIO-B01-Ch1.1-B083:A","text":"以項目數量代替正確概念組成，造成漏項與錯分","explanation":"此項指出數量不等於成員正確的問題。"},{"id":"BIO-B01-Ch1.1-B083:B","text":"五主題本來就沒有交互作用","explanation":"交互作用是五主題之一，不能刪除。"},{"id":"BIO-B01-Ch1.1-B083:C","text":"資訊必須和演化視為同一項","explanation":"資訊及演化分別是不同主題，不應合併替代。"},{"id":"BIO-B01-Ch1.1-B083:D","text":"只要總數是五就不必核對內容","explanation":"總數相同仍可漏項，必須核對各主題意義。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：五主題的完整性不只看數字。能量與物質在此是同一統整主題，交互作用另為一項；重組後數量相同也可能內容錯誤。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B084","topicId":"BIO-C1.1I-THEMES","stem":"研究者觀察個體與環境彼此影響，同時追蹤食物材料與能量的轉移。哪項說法最恰當？","correct":"BIO-B01-Ch1.1-B084:B","options":[{"id":"BIO-B01-Ch1.1-B084:A","text":"有交互作用就排除能量與物質","explanation":"兩主題可同時適用，無互斥條件。"},{"id":"BIO-B01-Ch1.1-B084:B","text":"可分別從交互作用及能量與物質理解同一系統","explanation":"此項保留兩種焦點並用框架連結。"},{"id":"BIO-B01-Ch1.1-B084:C","text":"只要有材料轉移就一定在演化","explanation":"材料轉移沒有必然的跨代遺傳變化。"},{"id":"BIO-B01-Ch1.1-B084:D","text":"統整主題只能用於課本第一章","explanation":"五主題是後續各章可反覆使用的框架。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：同一系統可有不同觀察焦點。彼此影響與能量材料的流向可各有對應主題，並不互相排斥或限於特定章節。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B085","topicId":"BIO-C1.1I-THEMES","stem":"某題幹同時出現「DNA」與「食物」，但問題明確問食物化學能如何支持活動。最直接的主題判斷應依什麼？","correct":"BIO-B01-Ch1.1-B085:C","options":[{"id":"BIO-B01-Ch1.1-B085:A","text":"只見DNA便排除全部其他主題","explanation":"DNA可能是背景，不能只憑一詞覆蓋明確的提問。"},{"id":"BIO-B01-Ch1.1-B085:B","text":"只看哪個詞字數較多","explanation":"詞的長度與生物學意義無關。"},{"id":"BIO-B01-Ch1.1-B085:C","text":"依問題指定的能量處理焦點，選能量與物質","explanation":"此項按問題所問關係選主題，避免機械關鍵字猜答。"},{"id":"BIO-B01-Ch1.1-B085:D","text":"不讀問題，一律選資訊","explanation":"一律選資訊忽略了題設能量焦點。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：關鍵字可提示，不能取代完整題意。問題限定食物能量的利用，應選能量與物質；DNA出現不表示它必是每次作答焦點。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B086","topicId":"BIO-C1.1I-THEMES","stem":"「五主題是思考框架」與「七項生命性質是觀察線索」的關係，哪項正確？","correct":"BIO-B01-Ch1.1-B086:D","options":[{"id":"BIO-B01-Ch1.1-B086:A","text":"兩張清單完全同名，可以任意替換","explanation":"兩清單的成員及用途並不完全相同。"},{"id":"BIO-B01-Ch1.1-B086:B","text":"七項性質要求每個個體每刻全部展示","explanation":"個體狀態與時間尺度有差異，無此要求。"},{"id":"BIO-B01-Ch1.1-B086:C","text":"五主題排除了生命活動之間的關聯","explanation":"框架正用來連結現象，非排除關聯。"},{"id":"BIO-B01-Ch1.1-B086:D","text":"兩者用途不同但可配合，協助組織與判讀生命現象","explanation":"此項保留兩者差異和互補用途。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：生命性質幫助辨認生物做什麼；統整主題幫助把廣泛知識連成框架。兩者相關且可互相連結，不能視為同一清單或即時檢核表。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B087","topicId":"BIO-C1.1I-THEMES","stem":"某教師用「構造安排、遺傳訊息、能量材料、部分互動、跨代變化」提示五主題。哪項配對正確？","correct":"BIO-B01-Ch1.1-B087:A","options":[{"id":"BIO-B01-Ch1.1-B087:A","text":"遺傳訊息—資訊；部分互動—交互作用","explanation":"兩組均依各自觀察焦點正確映射。"},{"id":"BIO-B01-Ch1.1-B087:B","text":"構造安排—演化；跨代變化—組織","explanation":"構造與跨代變化的主題被互換了。"},{"id":"BIO-B01-Ch1.1-B087:C","text":"能量材料—資訊；遺傳訊息—繁殖主題","explanation":"能量材料不等於遺傳訊息；繁殖不是五主題中的名稱。"},{"id":"BIO-B01-Ch1.1-B087:D","text":"部分互動—能量必然全部循環","explanation":"交互作用不能推出能量完全循環。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：提示詞是對各框架焦點的描述：構造為組織，訊息為資訊，能量材料為能量與物質，部分互動為交互作用，跨代變化為演化。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B088","topicId":"BIO-C1.1I-THEMES","stem":"當新章節出現未見過的生物例子，如何使用五主題最合理？","correct":"BIO-B01-Ch1.1-B088:B","options":[{"id":"BIO-B01-Ch1.1-B088:A","text":"先強迫歸入唯一類別，再忽略其他關係","explanation":"互斥歸類會抹去現象同時具備的多種關係。"},{"id":"BIO-B01-Ch1.1-B088:B","text":"先辨認例子描述的關係，再用適合的主題連結既有觀念","explanation":"此步驟能讓主題幫助理解，而非代替閱讀證據。"},{"id":"BIO-B01-Ch1.1-B088:C","text":"只要不是第一章例子就不可使用","explanation":"五主題可延伸作後續各章的思考方式。"},{"id":"BIO-B01-Ch1.1-B088:D","text":"直接按生物名稱的字數分類","explanation":"名稱字數與生物學的關係無關。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：框架的價值是可重用的關係理解。先讀清例子的結構、訊息、能量材料、互動或世代焦點，再連結相應主題；不靠名稱或章號機械分類。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B089","topicId":"BIO-C1.1I-THEMES","stem":"以文字列出五條概念連結：生命研究—組織；生命研究—資訊；生命研究—能量與物質；生命研究—交互作用；生命研究—演化。這組關係最恰當的讀法是什麼？","correct":"BIO-B01-Ch1.1-B089:C","options":[{"id":"BIO-B01-Ch1.1-B089:A","text":"五主題彼此隔離，不能同時使用","explanation":"共同中心並不意味著互斥或隔離。"},{"id":"BIO-B01-Ch1.1-B089:B","text":"任何主題都能取代全部其他主題","explanation":"各主題焦點不同，不能由一項取代全部。"},{"id":"BIO-B01-Ch1.1-B089:C","text":"它們以不同角度協助理解同一個生命研究領域","explanation":"此項依文字所列概念連結的統整用途解讀。"},{"id":"BIO-B01-Ch1.1-B089:D","text":"每條概念連結都表示一條代謝反應途徑","explanation":"未定義為代謝路徑的概念連結，不能直接當成代謝反應。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：文字概念連結表示思考框架的關聯，不自動代表物理因果或代謝路徑。五個角度各有焦點，可共同理解生命現象。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B090","topicId":"BIO-C1.1I-THEMES","stem":"有同學把「看到變化就選演化」當作五主題解題法。哪個評述最適合？","correct":"BIO-B01-Ch1.1-B090:D","options":[{"id":"BIO-B01-Ch1.1-B090:A","text":"正確，所有時間長短都等價","explanation":"數秒與多代的證據尺度不同。"},{"id":"BIO-B01-Ch1.1-B090:B","text":"正確，個體成熟就是族群演化","explanation":"成熟是同一個體的發育，不自動成為族群演化。"},{"id":"BIO-B01-Ch1.1-B090:C","text":"正確，環境反應不需辨認對象","explanation":"反應也須有刺激與相應變化的對象。"},{"id":"BIO-B01-Ch1.1-B090:D","text":"不完整，還須區分個體變化與族群跨世代變化","explanation":"此項補上演化判斷的尺度條件。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：「變化」可指成長、調節、反應或演化。應先辨認對象及時間尺度，演化不能只由一般詞彙判定。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B091","topicId":"BIO-C1.1I-INTEGRATE","stem":"題設三段紀錄：甲為幼體逐漸成熟；乙為受觸碰而閉合葉片；丙為有利可遺傳體色在族群多代增加。哪項配對全對？","correct":"BIO-B01-Ch1.1-B091:D","options":[{"id":"BIO-B01-Ch1.1-B091:A","text":"甲繁殖、乙演化、丙調節","explanation":"甲未形成後代，乙非跨代，丙不是個體控制。"},{"id":"BIO-B01-Ch1.1-B091:B","text":"甲調節、乙生長、丙繁殖","explanation":"甲是成熟不是內部穩定，乙未長大，丙不是只產後代。"},{"id":"BIO-B01-Ch1.1-B091:C","text":"甲秩序、乙繁殖、丙反應","explanation":"三項皆與各段主要證據不符。"},{"id":"BIO-B01-Ch1.1-B091:D","text":"甲發育、乙回應環境、丙演化適應","explanation":"此項分別以成熟、刺激及世代遺傳三條線索判斷。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：先看甲是同個體成熟、乙是刺激反應、丙是族群跨代遺傳特徵累積，即可依各自判準配對；三段不能只以「都有變化」合併。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B092","topicId":"BIO-C1.1I-INTEGRATE","stem":"同一事件可以同時符合生長發育及能量處理。哪個例子最清楚呈現這種關聯？","correct":"BIO-B01-Ch1.1-B092:A","options":[{"id":"BIO-B01-Ch1.1-B092:A","text":"幼體利用食物能量支持新構造形成","explanation":"這個例子同時給出發育及其能量支持。"},{"id":"BIO-B01-Ch1.1-B092:B","text":"晶體因外界材料附著而變大","explanation":"晶體增大不能直接當作生物發育。"},{"id":"BIO-B01-Ch1.1-B092:C","text":"車輛加油後依程式前進","explanation":"車輛用能不代表具有生命發育。"},{"id":"BIO-B01-Ch1.1-B092:D","text":"物體被風吹動後停在地上","explanation":"被動位移未提供幼體構造形成或生命能量處理。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：幼體的新構造形成屬發育，食物能量支持其過程屬能量處理。其他選項雖可能有材料增加或運動，不具題設的生物發育關係。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B093","topicId":"BIO-C1.1I-INTEGRATE","stem":"一份觀察同時記錄「規則構造」和「食物化學能被利用」。最嚴謹的摘要是什麼？","correct":"BIO-B01-Ch1.1-B093:B","options":[{"id":"BIO-B01-Ch1.1-B093:A","text":"兩者都是繁殖的直接證據","explanation":"構造與用能不一定含有後代形成。"},{"id":"BIO-B01-Ch1.1-B093:B","text":"前者關於秩序，後者關於能量處理，均應放回整體判斷","explanation":"此項正確分別映射並保留整體證據原則。"},{"id":"BIO-B01-Ch1.1-B093:C","text":"前者必證明意識，後者必證明演化","explanation":"兩種資料都不直接支持意識或多代演化。"},{"id":"BIO-B01-Ch1.1-B093:D","text":"只需前者就可取消其他生命性質","explanation":"單一秩序不能取代生命其他面向。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：規則構造描述安排，食物用能描述過程。兩項可以補充理解生命活動，但任何一項都不能取代其餘完整證據。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B094","topicId":"BIO-C1.1I-INTEGRATE","stem":"某同學把「原個體由2 g長到5 g」稱為繁殖，把「親代形成兩個後代」稱為生長。哪項修正正確？","correct":"BIO-B01-Ch1.1-B094:C","options":[{"id":"BIO-B01-Ch1.1-B094:A","text":"兩個名詞原本完全同義，不需修正","explanation":"生長和繁殖的個體判準不同。"},{"id":"BIO-B01-Ch1.1-B094:B","text":"將兩者都改成演化適應","explanation":"兩者均未提供族群跨代遺傳改變。"},{"id":"BIO-B01-Ch1.1-B094:C","text":"前者是原個體生長，後者是繁殖","explanation":"此修正同時依單位與個體身分區分。"},{"id":"BIO-B01-Ch1.1-B094:D","text":"只要數字增加，就一律屬調節","explanation":"調節需內部可運作範圍的控制，不是所有增加。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：2到5 g是同個體質量增加，兩個後代則是新個體形成。重量與個體數是不同計量，不能因都增加就混為同一活動。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B095","topicId":"BIO-C1.1I-INTEGRATE","stem":"假想動物的體溫在正常範圍內波動，並在外界升溫後增加散熱。若要描述已有的生命活動，何者最合理？","correct":"BIO-B01-Ch1.1-B095:D","options":[{"id":"BIO-B01-Ch1.1-B095:A","text":"體溫只要不同就證明失去生命","explanation":"生命調節不要求完全相同的體溫讀值。"},{"id":"BIO-B01-Ch1.1-B095:B","text":"外界升溫讓個體立即演化新基因","explanation":"個體短期反應不直接證明基因或族群跨代改變。"},{"id":"BIO-B01-Ch1.1-B095:C","text":"散熱表示能量從此不存在","explanation":"熱仍是能量，離開個體不代表消失。"},{"id":"BIO-B01-Ch1.1-B095:D","text":"環境反應有助於調節，波動不等於調節失敗","explanation":"此項把反應、調節與波動的關係正確整合。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：題面同時給出環境刺激、反應及可運作範圍。範圍內波動可與控制並存；能量以熱轉移也不等於消滅。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B096","topicId":"BIO-C1.1I-INTEGRATE","stem":"甲描述某活體具有規則安排但暫不繁殖；乙說它因此必定沒有生命。哪項回應最符合整體判斷？","correct":"BIO-B01-Ch1.1-B096:A","options":[{"id":"BIO-B01-Ch1.1-B096:A","text":"是否活著需結合其他活動，不能只因暫不繁殖就否定","explanation":"此項同時避免只憑秩序肯定及只憑未繁殖否定。"},{"id":"BIO-B01-Ch1.1-B096:B","text":"只要規則排列就已證明其全部生命性質","explanation":"秩序可見於非生命物，不能推出完整性質。"},{"id":"BIO-B01-Ch1.1-B096:C","text":"暫不繁殖表示所有細胞同時停止活動","explanation":"未繁殖不表示所有細胞活動停止。"},{"id":"BIO-B01-Ch1.1-B096:D","text":"必須觀察到它每秒產生後代才算生命","explanation":"繁殖不是每個個體每一刻的要求。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：甲的秩序線索本身不足，但乙由暫不繁殖否定生命也過度。應再看代謝、調節等整體活動，並保留個體與時間差異。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B097","topicId":"BIO-C1.1I-INTEGRATE","stem":"題面寫「某基因資訊影響幼體構造形成；同時此幼體需要能量維持」。哪項解說沒有混淆概念？","correct":"BIO-B01-Ch1.1-B097:B","options":[{"id":"BIO-B01-Ch1.1-B097:A","text":"資訊等於食物化學能，所以只算能量","explanation":"遺傳訊息與食物化學能不是同一概念。"},{"id":"BIO-B01-Ch1.1-B097:B","text":"發育可受資訊影響，也需能量支持；兩條關係可並存","explanation":"此項保留資訊與能量的不同角色及共同作用。"},{"id":"BIO-B01-Ch1.1-B097:C","text":"只有資訊而無任何物質，就必能形成器官","explanation":"器官形成仍需物質基礎，不能只靠抽象資訊。"},{"id":"BIO-B01-Ch1.1-B097:D","text":"形成構造必等同產生另一物種","explanation":"個體發育不能直接當成物種演化。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：資訊指生命活動的訊息控制，能量則支持活動進行，兩者不能互相取代。構造形成還涉及個體發育，不意味另一物種出現。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B098","topicId":"BIO-C1.1I-INTEGRATE","stem":"三個假想記錄：甲為同一株植物受碰觸後於當日閉合葉片；乙為同一幼體成熟；丙為族群中可遺傳外觀在多代間改變。哪項共同檢查最能避免將三者全誤稱為演化？","correct":"BIO-B01-Ch1.1-B098:C","options":[{"id":"BIO-B01-Ch1.1-B098:A","text":"只數中文句子長短","explanation":"句長與生命過程的尺度無關。"},{"id":"BIO-B01-Ch1.1-B098:B","text":"只看有沒有「改變」一詞","explanation":"「改變」太廣，不能區分三種性質。"},{"id":"BIO-B01-Ch1.1-B098:C","text":"逐項確認是個體過程還是族群跨代資料","explanation":"此步驟直接檢查演化與個體過程的關鍵差別。"},{"id":"BIO-B01-Ch1.1-B098:D","text":"將所有含有生物名稱的句子改成演化","explanation":"出現生物名稱不代表描述演化。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：三者表面都含變化，但甲為刺激反應、乙為發育、丙才具跨代族群尺度。辨對象與時間比搜尋單一動詞更能判斷。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B099","topicId":"BIO-C1.1I-INTEGRATE","stem":"某報告只見植物受碰觸後閉合葉片便寫「有意識」，只見動物增重便寫「繁殖」。兩處共同的修正原則是什麼？","correct":"BIO-B01-Ch1.1-B099:D","options":[{"id":"BIO-B01-Ch1.1-B099:A","text":"都應換成演化適應","explanation":"兩者都未給族群多代資料，不能改稱演化。"},{"id":"BIO-B01-Ch1.1-B099:B","text":"所有可觀察變化都不能用於科學","explanation":"可觀察變化能提供科學證據，問題在推論過度。"},{"id":"BIO-B01-Ch1.1-B099:C","text":"只要是生物，任何推論都成立","explanation":"生命身分不會使所有推論自動正確。"},{"id":"BIO-B01-Ch1.1-B099:D","text":"區分直接觀察與額外推論，依各概念的必要條件判斷","explanation":"此項同時修正兩種越過證據的概念混用。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：閉合直接支持刺激反應，不等於意識；增重支持生長，不等於新後代。兩處都從已知變化跳到缺乏相應證據的概念，須回到必要條件。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B100","topicId":"BIO-C1.1I-INTEGRATE","stem":"假想研究同時給出：幼體依遺傳資訊發育、取得能量、對刺激反應；其族群多代累積有利可遺傳特徵。哪項結論最全面且正確？","correct":"BIO-B01-Ch1.1-B100:A","options":[{"id":"BIO-B01-Ch1.1-B100:A","text":"多項生命活動相互連結，但個體過程與族群演化仍要分清","explanation":"此項兼顧多活動的關聯與個體／族群尺度。"},{"id":"BIO-B01-Ch1.1-B100:B","text":"只要有演化資料，就不再需要理解個體活動","explanation":"族群演化不會使個體生命過程失去研究意義。"},{"id":"BIO-B01-Ch1.1-B100:C","text":"所有活動都是同一個個體以意志完成的改造","explanation":"題面沒有意志直接改造性狀的證據。"},{"id":"BIO-B01-Ch1.1-B100:D","text":"四段資料只能擇一保留，其餘均與生命無關","explanation":"多項活動可並存並協助完整理解，不需任意刪去。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：題面同時呈現個體發育、用能、反應及族群演化。整合並不表示混成同一過程；對象、時間及因果仍須分別判讀，才可使用統整框架連結。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"bio-chapter-01-concept-1-1-child-01-theme-new-properties-emerge-at-successive-levels-of-biological-organization","title":"Ch1.1.1 主題：生物組織層級逐層提升時，會出現新的性質","version":"B01-v2-20260911:d78eda7bc3fb3f3cc4f4","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["Campbell Biology 12e｜第一輪","Ch1 演化、生物學主題與科學探究","Ch1.1 生命的統整主題"],"comparison":{"status":"BASELINE","reason":"中國醫為主要題庫及唯一比對基準。"},"banks":[{"depth":"掃過","target":50,"questions":[{"id":"BIO-B01-Ch1.1.1-S001","topicId":"BIO-1.1.1-MIC","stem":"學生將「一個葉綠素分子」貼上層級標籤。下列哪個標籤最恰當？","correct":"BIO-B01-Ch1.1.1-S001:B","options":[{"id":"BIO-B01-Ch1.1.1-S001:A","text":"組織","explanation":"不正確。組織由合作的細胞組成，不是單一色素。"},{"id":"BIO-B01-Ch1.1.1-S001:B","text":"分子","explanation":"正確。葉綠素是由原子構成的化學分子。"},{"id":"BIO-B01-Ch1.1.1-S001:C","text":"胞器","explanation":"不正確。葉綠體才是含葉綠素等分子的胞器。"},{"id":"BIO-B01-Ch1.1.1-S001:D","text":"細胞","explanation":"不正確。葉肉細胞含有葉綠體，層級較高。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：題面指定的是單一葉綠素分子，並非含有色素的葉綠體或葉肉。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S002","topicId":"BIO-1.1.1-MIC","stem":"在葉肉細胞內辨認到一個葉綠體。若只為這個葉綠體分類，應列在哪一層？","correct":"BIO-B01-Ch1.1.1-S002:C","options":[{"id":"BIO-B01-Ch1.1.1-S002:A","text":"分子","explanation":"不正確。葉綠體包含許多分子，本身不是單一分子。"},{"id":"BIO-B01-Ch1.1.1-S002:B","text":"個體","explanation":"不正確。葉綠體不是能獨立完成全部生命活動的生物。"},{"id":"BIO-B01-Ch1.1.1-S002:C","text":"胞器","explanation":"正確。葉綠體是細胞內執行特定功能的構造。"},{"id":"BIO-B01-Ch1.1.1-S002:D","text":"器官","explanation":"不正確。葉才是由多種組織組成的器官。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：題目以細胞內部的功能構造為對象，符合胞器定義。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S003","topicId":"BIO-1.1.1-MIC","stem":"把一個完整葉肉細胞與其中一個葉綠體相比，何者正確？","correct":"BIO-B01-Ch1.1.1-S003:D","options":[{"id":"BIO-B01-Ch1.1.1-S003:A","text":"細胞是葉綠體內的一個分子","explanation":"不正確。分子層級低於細胞，不能倒置包含關係。"},{"id":"BIO-B01-Ch1.1.1-S003:B","text":"葉綠體由多個葉肉細胞組成","explanation":"不正確。葉肉細胞包含葉綠體，方向相反。"},{"id":"BIO-B01-Ch1.1.1-S003:C","text":"兩者都只是組織的另一名稱","explanation":"不正確。組織是細胞合作形成的較高層級。"},{"id":"BIO-B01-Ch1.1.1-S003:D","text":"細胞包含胞器，兩者層級不同","explanation":"正確。葉綠體位在葉肉細胞內，是細胞的組成部分。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：先找包含方向：葉肉細胞內有葉綠體，因此細胞的層級較高。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S004","topicId":"BIO-1.1.1-MIC","stem":"某卡片寫著「由兩個以上原子以化學鍵結合形成，例如葉綠素」。這是在介紹什麼？","correct":"BIO-B01-Ch1.1.1-S004:A","options":[{"id":"BIO-B01-Ch1.1.1-S004:A","text":"分子","explanation":"正確。原子以化學鍵構成分子，符合卡片內容。"},{"id":"BIO-B01-Ch1.1.1-S004:B","text":"組織","explanation":"不正確。組織是細胞合作的單位，不是原子鍵結。"},{"id":"BIO-B01-Ch1.1.1-S004:C","text":"器官系統","explanation":"不正確。器官系統由器官協作構成。"},{"id":"BIO-B01-Ch1.1.1-S004:D","text":"族群","explanation":"不正確。族群是同種同域的個體集合。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：卡片的組件是原子，連接方式是化學鍵，故對應分子層級。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S005","topicId":"BIO-1.1.1-MIC","stem":"由一片葉的葉肉細胞逐步觀察到細胞內胞器，再看胞器內分子。這段觀察方向為何？","correct":"BIO-B01-Ch1.1.1-S005:B","options":[{"id":"BIO-B01-Ch1.1.1-S005:A","text":"由較低組織層級走向較高層級","explanation":"不正確。向更小組件觀察是降低組織層級。"},{"id":"BIO-B01-Ch1.1.1-S005:B","text":"由較高組織層級走向較低層級","explanation":"正確。細胞包含胞器，胞器含分子，層級依次降低。"},{"id":"BIO-B01-Ch1.1.1-S005:C","text":"由族群走向生物圈","explanation":"不正確。族群到生物圈屬生態尺度，並非題述。"},{"id":"BIO-B01-Ch1.1.1-S005:D","text":"由分子走向器官系統","explanation":"不正確。題目起點是細胞，終點是分子。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：依序為細胞→胞器→分子，這是分解觀察的方向。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S006","topicId":"BIO-1.1.1-BODY","stem":"一片葉具有表皮組織、葉肉組織和輸導組織。整片葉最適合歸在哪一層？","correct":"BIO-B01-Ch1.1.1-S006:C","options":[{"id":"BIO-B01-Ch1.1.1-S006:A","text":"胞器","explanation":"不正確。胞器位在細胞內，葉不在此層級。"},{"id":"BIO-B01-Ch1.1.1-S006:B","text":"族群","explanation":"不正確。葉不是同種完整個體的集合。"},{"id":"BIO-B01-Ch1.1.1-S006:C","text":"器官","explanation":"正確。多種組織形成有功能的葉，屬器官。"},{"id":"BIO-B01-Ch1.1.1-S006:D","text":"組織","explanation":"不正確。單一組織只是整片葉的部分。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：已知整片葉由多種組織組成，直接符合器官的組成條件。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S007","topicId":"BIO-1.1.1-BODY","stem":"「一群細胞合作，完成某種特定工作」最直接描述哪個層級？","correct":"BIO-B01-Ch1.1.1-S007:D","options":[{"id":"BIO-B01-Ch1.1.1-S007:A","text":"器官系統","explanation":"不正確。器官系統的直接組成單位是器官。"},{"id":"BIO-B01-Ch1.1.1-S007:B","text":"族群","explanation":"不正確。族群由同種完整個體組成。"},{"id":"BIO-B01-Ch1.1.1-S007:C","text":"生態系","explanation":"不正確。生態系包含生物群集與非生物環境。"},{"id":"BIO-B01-Ch1.1.1-S007:D","text":"組織","explanation":"正確。合作執行特定工作的細胞群構成組織。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：題目強調合作的細胞，不是多器官或完整個體。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S008","topicId":"BIO-1.1.1-BODY","stem":"心臟與血管等器官共同參與血液循環。把這些合作器官合在一起，最適合稱為什麼？","correct":"BIO-B01-Ch1.1.1-S008:A","options":[{"id":"BIO-B01-Ch1.1.1-S008:A","text":"器官系統","explanation":"正確。多個器官協作，形成循環器官系統。"},{"id":"BIO-B01-Ch1.1.1-S008:B","text":"單一組織","explanation":"不正確。組織由細胞形成，低於器官。"},{"id":"BIO-B01-Ch1.1.1-S008:C","text":"單一胞器","explanation":"不正確。胞器是細胞內構造，不能涵蓋心臟與血管。"},{"id":"BIO-B01-Ch1.1.1-S008:D","text":"生物圈","explanation":"不正確。生物圈是全球生命及生活環境的範圍。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：題目已明定多個器官合作，因此是器官系統。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S009","topicId":"BIO-1.1.1-BODY","stem":"校園標記的一株完整蒲公英，包含根、莖、葉與花。若以整株為研究對象，是哪個層級？","correct":"BIO-B01-Ch1.1.1-S009:B","options":[{"id":"BIO-B01-Ch1.1.1-S009:A","text":"群集","explanation":"不正確。群集包含同域各物種族群。"},{"id":"BIO-B01-Ch1.1.1-S009:B","text":"個體","explanation":"正確。一株完整生物是一個個體。"},{"id":"BIO-B01-Ch1.1.1-S009:C","text":"單一器官","explanation":"不正確。根、莖、葉等各為器官，整株較高。"},{"id":"BIO-B01-Ch1.1.1-S009:D","text":"族群","explanation":"不正確。族群需同種在界定區域的所有個體。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：研究單位是整株蒲公英，不是單片葉，也不是全校所有蒲公英。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S010","topicId":"BIO-1.1.1-BODY","stem":"若排列一般多細胞生物體內的組成關係，下列何者由低至高正確？","correct":"BIO-B01-Ch1.1.1-S010:C","options":[{"id":"BIO-B01-Ch1.1.1-S010:A","text":"組織→器官→細胞","explanation":"不正確。細胞應先於組織及器官。"},{"id":"BIO-B01-Ch1.1.1-S010:B","text":"細胞→器官→組織","explanation":"不正確。組織應介於細胞與器官之間。"},{"id":"BIO-B01-Ch1.1.1-S010:C","text":"細胞→組織→器官","explanation":"正確。細胞合作成組織，多種組織成器官。"},{"id":"BIO-B01-Ch1.1.1-S010:D","text":"器官→細胞→組織","explanation":"不正確。器官由組織與細胞構成，應位在後。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：依直接組成關係排序，而非依肉眼可否看見。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S011","topicId":"BIO-1.1.1-POP","stem":"某日池塘內所有同種青蛙合在一起，應稱為什麼？","correct":"BIO-B01-Ch1.1.1-S011:D","options":[{"id":"BIO-B01-Ch1.1.1-S011:A","text":"群集","explanation":"不正確。群集需納入同域其他物種族群。"},{"id":"BIO-B01-Ch1.1.1-S011:B","text":"生態系","explanation":"不正確。生態系還包含群集與非生物環境。"},{"id":"BIO-B01-Ch1.1.1-S011:C","text":"器官系統","explanation":"不正確。器官系統是同一個體內多器官合作。"},{"id":"BIO-B01-Ch1.1.1-S011:D","text":"族群","explanation":"正確。同日同塘同種所有個體符合族群條件。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：同種、同區域、同時間都已限定，故屬族群。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S012","topicId":"BIO-1.1.1-POP","stem":"研究者要列出花園內某日的玫瑰族群，最應把哪些對象列入？","correct":"BIO-B01-Ch1.1.1-S012:A","options":[{"id":"BIO-B01-Ch1.1.1-S012:A","text":"園內當日同一玫瑰物種的所有植株","explanation":"正確。同物種、同園區、同日所有植株符合族群。"},{"id":"BIO-B01-Ch1.1.1-S012:B","text":"園內當日所有開花植物","explanation":"不正確。不同開花植物可能屬多個物種。"},{"id":"BIO-B01-Ch1.1.1-S012:C","text":"全世界歷年出現過的玫瑰","explanation":"不正確。全球及跨歷年不是題目指定的空間時間。"},{"id":"BIO-B01-Ch1.1.1-S012:D","text":"園內當日的植物與土壤","explanation":"不正確。土壤是非生物環境，不是玫瑰個體。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：族群名單的界線由物種、花園及日期共同決定。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S013","topicId":"BIO-1.1.1-POP","stem":"一座池塘的同種魚有幼魚與成魚。只因年齡不同，就把牠們分成兩個物種族群，問題出在哪裡？","correct":"BIO-B01-Ch1.1.1-S013:B","options":[{"id":"BIO-B01-Ch1.1.1-S013:A","text":"族群定義必須排除不同大小個體","explanation":"不正確。族群包含不同大小及年齡的同種個體。"},{"id":"BIO-B01-Ch1.1.1-S013:B","text":"同種同域個體不因年齡差異而自動分屬不同族群","explanation":"正確。年齡分組可作樣本分析，但不改變同種族群的基本界定。"},{"id":"BIO-B01-Ch1.1.1-S013:C","text":"幼魚沒有資格算個體","explanation":"不正確。幼魚仍是完整生物個體。"},{"id":"BIO-B01-Ch1.1.1-S013:D","text":"成魚只能算群集","explanation":"不正確。一尾成魚是個體，並不是群集。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：題面已指定同種同塘，年齡差異不會自動改變物種及空間邊界。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S014","topicId":"BIO-1.1.1-POP","stem":"下列調查標題中，哪個最清楚指向族群層級？","correct":"BIO-B01-Ch1.1.1-S014:C","options":[{"id":"BIO-B01-Ch1.1.1-S014:A","text":"九月甲池水溫與鹽度總覽","explanation":"不正確。只有水溫鹽度是非生物資料，非族群。"},{"id":"BIO-B01-Ch1.1.1-S014:B","text":"全球湖泊生物與環境總覽","explanation":"不正確。全球多個生態系的尺度高於單一族群。"},{"id":"BIO-B01-Ch1.1.1-S014:C","text":"九月甲池全部同種水蚤","explanation":"正確。同一時間及水域內同種所有個體是族群。"},{"id":"BIO-B01-Ch1.1.1-S014:D","text":"九月甲池各物種生物總覽","explanation":"不正確。各物種總覽屬群集範圍。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：只有水蚤選項同時界定同種、甲池及九月。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S015","topicId":"BIO-1.1.1-COMM","stem":"草地調查納入該地所有植物、動物、真菌與細菌的族群，未把土壤及光列為研究組成。整體最適合稱為什麼？","correct":"BIO-B01-Ch1.1.1-S015:D","options":[{"id":"BIO-B01-Ch1.1.1-S015:A","text":"單一族群","explanation":"不正確。多物種集合超出單一族群。"},{"id":"BIO-B01-Ch1.1.1-S015:B","text":"單一個體","explanation":"不正確。集合包含許多完整生物，非一個個體。"},{"id":"BIO-B01-Ch1.1.1-S015:C","text":"完整生態系","explanation":"不正確。完整生態系還應涵蓋非生物環境及互動。"},{"id":"BIO-B01-Ch1.1.1-S015:D","text":"群集","explanation":"正確。同一草地各物種族群總和為群集。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：題目研究的是所有生物族群，非生物成分沒有被納入，故選群集。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S016","topicId":"BIO-1.1.1-COMM","stem":"在一個森林群集的研究中，再加入光照、雨水與土壤等互動環境，研究範圍提升至哪一層？","correct":"BIO-B01-Ch1.1.1-S016:A","options":[{"id":"BIO-B01-Ch1.1.1-S016:A","text":"生態系","explanation":"正確。群集與非生物環境一起構成生態系。"},{"id":"BIO-B01-Ch1.1.1-S016:B","text":"組織","explanation":"不正確。組織是個體內細胞合作單位。"},{"id":"BIO-B01-Ch1.1.1-S016:C","text":"族群","explanation":"不正確。族群只限同種個體，不包含土壤等。"},{"id":"BIO-B01-Ch1.1.1-S016:D","text":"器官","explanation":"不正確。器官由多種組織構成，不是森林研究範圍。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：新增的是非生物環境，這正是群集與生態系範圍的差別。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S017","topicId":"BIO-1.1.1-COMM","stem":"下列哪項屬於生態系的非生物環境成分？","correct":"BIO-B01-Ch1.1.1-S017:B","options":[{"id":"BIO-B01-Ch1.1.1-S017:A","text":"草地上的禾草","explanation":"不正確。禾草是植物個體，屬生物成分。"},{"id":"BIO-B01-Ch1.1.1-S017:B","text":"照到草地的日光","explanation":"正確。日光不是生物，是可與生命互動的環境因素。"},{"id":"BIO-B01-Ch1.1.1-S017:C","text":"草地裡的細菌","explanation":"不正確。細菌屬生物成分，即使肉眼看不見。"},{"id":"BIO-B01-Ch1.1.1-S017:D","text":"草地上的真菌","explanation":"不正確。真菌有細胞，屬於群集中的生物。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：應區分是否為生物，不能以體積大小或能否移動判斷。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S018","topicId":"BIO-1.1.1-COMM","stem":"有人把「湖泊群集」定義成湖內所有魚類，最合適的修正是什麼？","correct":"BIO-B01-Ch1.1.1-S018:C","options":[{"id":"BIO-B01-Ch1.1.1-S018:A","text":"還須把全球所有魚納入","explanation":"不正確。研究範圍是此湖，不是全球魚類。"},{"id":"BIO-B01-Ch1.1.1-S018:B","text":"應刪掉所有微生物才完整","explanation":"不正確。微生物也是群集成員，不應刪除。"},{"id":"BIO-B01-Ch1.1.1-S018:C","text":"還須納入湖內其他生物物種的族群","explanation":"正確。群集包含湖內各物種，不只魚。"},{"id":"BIO-B01-Ch1.1.1-S018:D","text":"只需把魚依大小再分組","explanation":"不正確。按大小分組仍未補足其他物種。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：只列魚漏掉植物、微生物等生物；補齊同湖各物種才是完整群集。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S019","topicId":"BIO-1.1.1-BIO","stem":"研究把海洋、森林、沙漠等所有生態系合起來，討論地球生命及其生活環境。此尺度稱為什麼？","correct":"BIO-B01-Ch1.1.1-S019:D","options":[{"id":"BIO-B01-Ch1.1.1-S019:A","text":"單一群集","explanation":"不正確。群集限定特定區域生物，範圍不足。"},{"id":"BIO-B01-Ch1.1.1-S019:B","text":"單一族群","explanation":"不正確。族群限一物種，無法涵蓋全球生態系。"},{"id":"BIO-B01-Ch1.1.1-S019:C","text":"器官系統","explanation":"不正確。器官系統是個體內層級。"},{"id":"BIO-B01-Ch1.1.1-S019:D","text":"生物圈","explanation":"正確。全球全部生態系及生命環境對應生物圈。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：題面把所有生態系納入，達到生物圈尺度。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S020","topicId":"BIO-1.1.1-BIO","stem":"「分子→細胞→個體→生態系」被標為部分代表層級。這串箭頭最適合如何理解？","correct":"BIO-B01-Ch1.1.1-S020:A","options":[{"id":"BIO-B01-Ch1.1.1-S020:A","text":"由較低到較高層級，但省略部分中間層級","explanation":"正確。方向正確，但省略胞器、組織等中間層級。"},{"id":"BIO-B01-Ch1.1.1-S020:B","text":"每相鄰兩項都是直接相鄰完整層級","explanation":"不正確。題目明寫部分，不能當完整相鄰表。"},{"id":"BIO-B01-Ch1.1.1-S020:C","text":"每個分子先演化成細胞再變成生態系","explanation":"不正確。組成層級不是個別分子的演化歷程。"},{"id":"BIO-B01-Ch1.1.1-S020:D","text":"分子與生態系其實是同一層級","explanation":"不正確。兩者代表的組成及空間範圍明顯不同。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：標題已說明部分代表，應保留層級方向並辨認省略。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S021","topicId":"BIO-1.1.1-BIO","stem":"下列哪個敘述正確區分生物圈與一個草地生態系？","correct":"BIO-B01-Ch1.1.1-S021:B","options":[{"id":"BIO-B01-Ch1.1.1-S021:A","text":"兩者都必須只有同一物種","explanation":"不正確。一生態系或生物圈通常包含多物種。"},{"id":"BIO-B01-Ch1.1.1-S021:B","text":"生物圈包含全球各生態系，草地只是其中之一","explanation":"正確。生物圈尺度涵蓋所有生態系。"},{"id":"BIO-B01-Ch1.1.1-S021:C","text":"草地生態系包含全球所有生命環境","explanation":"不正確。單一草地不涵蓋全球所有生活環境。"},{"id":"BIO-B01-Ch1.1.1-S021:D","text":"生物圈只包含動物而不含植物","explanation":"不正確。生物圈包含各類生命，不只動物。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：比較研究邊界即可：草地為地方範圍，生物圈為全球生命系統。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S022","topicId":"BIO-1.1.1-EM","stem":"若一種功能必須由多個組件正確排列及互動才出現，單獨組件沒有該功能，最符合哪個概念？","correct":"BIO-B01-Ch1.1.1-S022:C","options":[{"id":"BIO-B01-Ch1.1.1-S022:A","text":"單一分子的既有性質","explanation":"不正確。題幹已說單獨組件沒有該功能。"},{"id":"BIO-B01-Ch1.1.1-S022:B","text":"器官的名稱","explanation":"不正確。器官是一種層級，不是此現象的通用名稱。"},{"id":"BIO-B01-Ch1.1.1-S022:C","text":"湧現性質","explanation":"正確。新功能出現在組織互動後，符合湧現。"},{"id":"BIO-B01-Ch1.1.1-S022:D","text":"族群定義","explanation":"不正確。族群定義關於同種同域個體，非功能來源。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：判斷關鍵是組件單獨沒有、組成互動系統後才有。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S023","topicId":"BIO-1.1.1-EM","stem":"說明湧現性質時，除了知道有哪些組件，下列哪項資訊最關鍵？","correct":"BIO-B01-Ch1.1.1-S023:D","options":[{"id":"BIO-B01-Ch1.1.1-S023:A","text":"單獨組件依質量由小到大的排名","explanation":"不正確。質量排名仍是組件資料，不等於互動關係。"},{"id":"BIO-B01-Ch1.1.1-S023:B","text":"單獨組件被發現的歷史先後","explanation":"不正確。發現先後不表示目前系統如何協作。"},{"id":"BIO-B01-Ch1.1.1-S023:C","text":"單獨組件各自的中文名稱","explanation":"不正確。名稱清單是起點，但無法代替組織與作用。"},{"id":"BIO-B01-Ch1.1.1-S023:D","text":"組件如何排列並彼此作用","explanation":"正確。排列與作用能解釋整體新性質的來源。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：新功能依賴組織與互動；其他資料可能有用途，仍不直接填補關係資訊。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S024","topicId":"BIO-1.1.1-EM","stem":"學生說「湧現就是零件多一點，任何擺法都一樣」。最適當的指正為何？","correct":"BIO-B01-Ch1.1.1-S024:A","options":[{"id":"BIO-B01-Ch1.1.1-S024:A","text":"數量之外，排列和互動也會影響整體功能","explanation":"正確。相同組件可能因連接方式不同而有不同結果。"},{"id":"BIO-B01-Ch1.1.1-S024:B","text":"只要零件夠多就不需互動","explanation":"不正確。多數量不能取代必要組織。"},{"id":"BIO-B01-Ch1.1.1-S024:C","text":"每個零件必須先有完整整體功能","explanation":"不正確。湧現正是單獨組件原無的高層性質。"},{"id":"BIO-B01-Ch1.1.1-S024:D","text":"湧現表示功能不能被研究","explanation":"不正確。可以透過分析組織與互動研究湧現。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：錯處在把組件數量當充分條件，漏了排列及互動。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S025","topicId":"BIO-1.1.1-EM","stem":"某系統的新功能可由零件連接方式解釋。將它稱為湧現性質，是否一定要假設超自然力量？","correct":"BIO-B01-Ch1.1.1-S025:B","options":[{"id":"BIO-B01-Ch1.1.1-S025:A","text":"不需要；因整體與組件完全無關","explanation":"不正確。整體性質來自組件關係，並非與組件無關。"},{"id":"BIO-B01-Ch1.1.1-S025:B","text":"不需要；可以研究組件排列與互動","explanation":"正確。湧現有可分析的組織及互動基礎。"},{"id":"BIO-B01-Ch1.1.1-S025:C","text":"需要；否則不算湧現","explanation":"不正確。超自然不是湧現定義的必要條件。"},{"id":"BIO-B01-Ch1.1.1-S025:D","text":"需要；因零件沒有任何性質","explanation":"不正確。零件各有性質，只是不等於完整高層功能。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：本題已給出可研究的連接解釋，符合湧現的科學意義。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S026","topicId":"BIO-1.1.1-PHOTO","stem":"葉綠素分子能吸收光，但不能獨自完成整套光合作用。這說明什麼？","correct":"BIO-B01-Ch1.1.1-S026:C","options":[{"id":"BIO-B01-Ch1.1.1-S026:A","text":"任何吸光物質都能完成光合作用","explanation":"不正確。吸光只是部分條件，不保證完整光合作用。"},{"id":"BIO-B01-Ch1.1.1-S026:B","text":"葉綠體必須是多細胞生物","explanation":"不正確。葉綠體是胞器，不是多細胞生物。"},{"id":"BIO-B01-Ch1.1.1-S026:C","text":"單一組件的能力不等於整個系統的完整功能","explanation":"正確。吸光是部分作用，完整功能需要組織化的多分子合作。"},{"id":"BIO-B01-Ch1.1.1-S026:D","text":"葉綠素完全沒有功能","explanation":"不正確。題面已指出葉綠素能吸光。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：分清部分反應與完整程序，便不會把吸光能力當成完整光合作用。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S027","topicId":"BIO-1.1.1-PHOTO","stem":"兩份材料含相同種類及數量的光合作用相關分子，光照與其他條件相同：甲維持葉綠體內的組織，乙只是散亂混合。若甲有完整功能、乙沒有，最直接支持什麼？","correct":"BIO-B01-Ch1.1.1-S027:D","options":[{"id":"BIO-B01-Ch1.1.1-S027:A","text":"只有分子種類決定全部功能","explanation":"不正確。此解釋無法說明相同種類卻有不同結果。"},{"id":"BIO-B01-Ch1.1.1-S027:B","text":"乙中的所有分子均沒有化學性質","explanation":"不正確。失去完整功能不代表每個分子失去性質。"},{"id":"BIO-B01-Ch1.1.1-S027:C","text":"甲一定含乙沒有的新元素","explanation":"不正確。題面未提供元素改變證據，不可推論。"},{"id":"BIO-B01-Ch1.1.1-S027:D","text":"分子的組織及互動對完整功能重要","explanation":"正確。同種組件但組織不同，功能也可不同。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：兩組的已知差別是組織狀態，支持其與完整功能有關。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S028","topicId":"BIO-1.1.1-PHOTO","stem":"介紹葉綠體功能時，哪句話最精確？","correct":"BIO-B01-Ch1.1.1-S028:A","options":[{"id":"BIO-B01-Ch1.1.1-S028:A","text":"多種分子在適當結構中協調，形成完整功能","explanation":"正確。不同組件按位置及功能合作是關鍵。"},{"id":"BIO-B01-Ch1.1.1-S028:B","text":"只有一個葉綠素分子就等於葉綠體","explanation":"不正確。葉綠體含許多不同分子及結構。"},{"id":"BIO-B01-Ch1.1.1-S028:C","text":"只要所有分子放在同一杯即可保證功能","explanation":"不正確。共同放置不保證正確組織與互動。"},{"id":"BIO-B01-Ch1.1.1-S028:D","text":"酵素與葉綠素必須做完全相同的工作","explanation":"不正確。不同分子可分工，吸光與催化並非相同工作。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：整體功能來自分工與組織，而非把組件名稱等同於整個胞器。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S029","topicId":"BIO-1.1.1-BIKE","stem":"腳踏車零件正確組裝後，在人踩踏時能載人前進；散落零件無此整體功能。這個類比強調什麼？","correct":"BIO-B01-Ch1.1.1-S029:B","options":[{"id":"BIO-B01-Ch1.1.1-S029:A","text":"組裝可以讓車不需任何能量輸入","explanation":"不正確。題幹明訂仍由人踩踏供能。"},{"id":"BIO-B01-Ch1.1.1-S029:B","text":"組件的排列與配合能產生整體功能","explanation":"正確。正確組織後形成單一零件不具備的功能。"},{"id":"BIO-B01-Ch1.1.1-S029:C","text":"腳踏車是由細胞構成的生物","explanation":"不正確。這是非生命的類比，不是細胞學說實例。"},{"id":"BIO-B01-Ch1.1.1-S029:D","text":"每個零件單獨都能完成載人騎行","explanation":"不正確。散落零件沒有整體載人騎行能力。"}],"concept":"腳踏車的車架、輪子與傳動零件各有性質；適當組裝後，配合騎乘者施力，才可整體載人前進。這用來類比排列與互動產生新功能，並不表示腳踏車有生命或能無能源自行運作。湧現並非生命專有，生命系統通常比此類例子複雜。\n本題判斷：保留人踩踏條件，這個例子只說明組裝與整體功能的關係。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁／正式第9張（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S030","topicId":"BIO-1.1.1-BIKE","stem":"為何可用腳踏車說明湧現性質，卻不能因此認定腳踏車是生物？","correct":"BIO-B01-Ch1.1.1-S030:C","options":[{"id":"BIO-B01-Ch1.1.1-S030:A","text":"只有生物才能由零件組成","explanation":"不正確。非生命機械也有組成部分。"},{"id":"BIO-B01-Ch1.1.1-S030:B","text":"腳踏車其實是單細胞個體","explanation":"不正確。腳踏車沒有細胞作為生命基本單位。"},{"id":"BIO-B01-Ch1.1.1-S030:C","text":"湧現不是生命專有，組合功能不等於具生命","explanation":"正確。非生命系統也有組合後功能，不能用此一點判為生命。"},{"id":"BIO-B01-Ch1.1.1-S030:D","text":"凡能移動的東西都是生物","explanation":"不正確。物體可因外力移動，移動不是充分判準。"}],"concept":"腳踏車的車架、輪子與傳動零件各有性質；適當組裝後，配合騎乘者施力，才可整體載人前進。這用來類比排列與互動產生新功能，並不表示腳踏車有生命或能無能源自行運作。湧現並非生命專有，生命系統通常比此類例子複雜。\n本題判斷：類比共享的是組合產生功能，不是所有生命特徵。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁／正式第9張（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S031","topicId":"BIO-1.1.1-BIKE","stem":"組裝完成的腳踏車若無人踩踏或其他驅動，就不前進。這是否推翻其載人前進功能來自組裝？","correct":"BIO-B01-Ch1.1.1-S031:D","options":[{"id":"BIO-B01-Ch1.1.1-S031:A","text":"推翻；湧現功能必須在任何條件自行出現","explanation":"不正確。湧現不是無條件、自發維持所有功能。"},{"id":"BIO-B01-Ch1.1.1-S031:B","text":"推翻；車輪應獨自完成全部功能","explanation":"不正確。車輪仍須與車架和傳動等配合。"},{"id":"BIO-B01-Ch1.1.1-S031:C","text":"不推翻；因人踩踏其實沒有作用","explanation":"不正確。題面已指定踩踏是驅動條件之一。"},{"id":"BIO-B01-Ch1.1.1-S031:D","text":"不推翻；功能仍需適當操作條件與能量輸入","explanation":"正確。有某功能不等於不需啟動及能源條件。"}],"concept":"腳踏車的車架、輪子與傳動零件各有性質；適當組裝後，配合騎乘者施力，才可整體載人前進。這用來類比排列與互動產生新功能，並不表示腳踏車有生命或能無能源自行運作。湧現並非生命專有，生命系統通常比此類例子複雜。\n本題判斷：組裝提供功能基礎，踩踏提供運作條件，二者可同時必要。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁／正式第9張（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S032","topicId":"BIO-1.1.1-RED","stem":"研究者從細胞取出一種蛋白質，單獨研究它的性質。這個策略最接近什麼？","correct":"BIO-B01-Ch1.1.1-S032:A","options":[{"id":"BIO-B01-Ch1.1.1-S032:A","text":"還原論","explanation":"正確。從複雜細胞抽出較小組件研究，符合還原論。"},{"id":"BIO-B01-Ch1.1.1-S032:B","text":"只研究群集全部互動","explanation":"不正確。題面沒有群集互動研究。"},{"id":"BIO-B01-Ch1.1.1-S032:C","text":"只描述生物圈環境","explanation":"不正確。尺度及研究對象是細胞組件，非全球環境。"},{"id":"BIO-B01-Ch1.1.1-S032:D","text":"把個體當成物種的分類法","explanation":"不正確。這裡是研究策略，不是物種分類。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：將系統拆為較易研究的蛋白質是還原研究的典型做法。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S033","topicId":"BIO-1.1.1-RED","stem":"下列哪項最能說明還原論的價值？","correct":"BIO-B01-Ch1.1.1-S033:B","options":[{"id":"BIO-B01-Ch1.1.1-S033:A","text":"拆小後可取消整體層級的研究","explanation":"不正確。整體及互動問題仍需其他互補研究。"},{"id":"BIO-B01-Ch1.1.1-S033:B","text":"把複雜系統拆小後，可較清楚研究組件的性質","explanation":"正確。降低複雜性有助辨認個別組件如何運作。"},{"id":"BIO-B01-Ch1.1.1-S033:C","text":"拆小後不必再驗證組件功能","explanation":"不正確。還原研究仍須以觀察或實驗支持結論。"},{"id":"BIO-B01-Ch1.1.1-S033:D","text":"拆小後保證保留原系統一切互動","explanation":"不正確。分離可能失去原有組織及互動。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：優點是讓部分更容易研究，不能把它誇大成保留全部系統資訊。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S034","topicId":"BIO-1.1.1-RED","stem":"DNA從細胞分離後，其分子結構被用來理解遺傳的化學基礎。這主要是哪一類研究思路？","correct":"BIO-B01-Ch1.1.1-S034:C","options":[{"id":"BIO-B01-Ch1.1.1-S034:A","text":"忽略組件的整體描述","explanation":"不正確。操作就是聚焦具體組件，不是忽略它。"},{"id":"BIO-B01-Ch1.1.1-S034:B","text":"以生物圈取代分子研究","explanation":"不正確。沒有以全球尺度取代分子觀察。"},{"id":"BIO-B01-Ch1.1.1-S034:C","text":"還原研究","explanation":"正確。將遺傳問題拆到DNA分子結構，符合還原論。"},{"id":"BIO-B01-Ch1.1.1-S034:D","text":"只研究整個生態系","explanation":"不正確。題目研究的是分子而非生態系。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：把遺傳現象定位到DNA分子構造，是以較小組件協助解釋較大生命現象；此成果仍不等於解釋了細胞的全部活動。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S035","topicId":"BIO-1.1.1-RED","stem":"某人說「拆開細胞看零件沒有任何用處」。最恰當的回答是什麼？","correct":"BIO-B01-Ch1.1.1-S035:D","options":[{"id":"BIO-B01-Ch1.1.1-S035:A","text":"這是對的，組件性質完全不重要","explanation":"不正確。組件性質是理解功能的重要基礎。"},{"id":"BIO-B01-Ch1.1.1-S035:B","text":"只需還原研究即可解釋全部生命現象","explanation":"不正確。知道部分不保證知道完整互動行為。"},{"id":"BIO-B01-Ch1.1.1-S035:C","text":"既然有系統生物學，就不能研究分子","explanation":"不正確。系統生物學可使用分子研究的成果。"},{"id":"BIO-B01-Ch1.1.1-S035:D","text":"還原研究可了解組件，但需整體互動研究補充","explanation":"正確。組件及互動兩種資訊都能協助解釋生命。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：避免全盤否定或過度肯定；採取互補的定位。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S036","topicId":"BIO-1.1.1-SYS","stem":"團隊追蹤細胞內多種成分彼此影響及隨時間變動的整體行為，最接近什麼？","correct":"BIO-B01-Ch1.1.1-S036:A","options":[{"id":"BIO-B01-Ch1.1.1-S036:A","text":"系統生物學","explanation":"正確。互動與動態整體行為是系統生物學重點。"},{"id":"BIO-B01-Ch1.1.1-S036:B","text":"以成分名稱為主的分類整理","explanation":"不正確。名稱清單欠缺成分間關係及時間變化。"},{"id":"BIO-B01-Ch1.1.1-S036:C","text":"僅研究單一組件的性質","explanation":"不正確。題面處理多成分的關係，超過單獨研究一個組件。"},{"id":"BIO-B01-Ch1.1.1-S036:D","text":"只比較同種個體數量","explanation":"不正確。題目對象是細胞內互動，非族群數量。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：關鍵在各成分如何互相影響並形成隨時間變化的整體結果。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S037","topicId":"BIO-1.1.1-SYS","stem":"下列哪個問題最具有系統生物學的特徵？","correct":"BIO-B01-Ch1.1.1-S037:B","options":[{"id":"BIO-B01-Ch1.1.1-S037:A","text":"某個胞器在靜態照片中的尺寸多大？","explanation":"不正確。靜態尺寸可有用，但未直接回答動態互動。"},{"id":"BIO-B01-Ch1.1.1-S037:B","text":"細胞內各成分互相影響時，整體反應如何變化？","explanation":"正確。題目分析關係及整體行為，符合系統觀。"},{"id":"BIO-B01-Ch1.1.1-S037:C","text":"分離的單一蛋白質本身具有哪些性質？","explanation":"不正確。聚焦分離組件屬還原研究，未分析彼此關係。"},{"id":"BIO-B01-Ch1.1.1-S037:D","text":"一個葉綠素分子由哪些原子組成？","explanation":"不正確。組成清單是部分資訊，尚未研究系統互動。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：是否分析部分間的關係，比資料量或研究物體大小更能辨識系統研究。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S038","topicId":"BIO-1.1.1-SYS","stem":"系統生物學中的「系統」只能是一整個生態系嗎？","correct":"BIO-B01-Ch1.1.1-S038:C","options":[{"id":"BIO-B01-Ch1.1.1-S038:A","text":"是；個體沒有組成部分","explanation":"不正確。個體由許多組成部分協作。"},{"id":"BIO-B01-Ch1.1.1-S038:B","text":"不是；但系統不能包括細胞內成分","explanation":"不正確。細胞內成分正可成為系統分析對象。"},{"id":"BIO-B01-Ch1.1.1-S038:C","text":"不是；單一細胞也可當作系統","explanation":"正確。細胞有多種彼此作用的成分，可研究其整體行為。"},{"id":"BIO-B01-Ch1.1.1-S038:D","text":"是；比生態系小都沒有互動","explanation":"不正確。細胞及個體內同樣有互動。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：系統可位於不同層級，只要有可界定的組成及關係。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S039","topicId":"BIO-1.1.1-SYS","stem":"甲組研究單一酵素，乙組把甲組結果與其他成分的作用一起建立互動模型。兩組研究的關係最合理為何？","correct":"BIO-B01-Ch1.1.1-S039:D","options":[{"id":"BIO-B01-Ch1.1.1-S039:A","text":"互斥，乙組不能使用甲組資料","explanation":"不正確。方法不同不妨礙成果互相利用。"},{"id":"BIO-B01-Ch1.1.1-S039:B","text":"甲組必然無效，只有整體資料有用","explanation":"不正確。單酵素研究可提供有價值的性質。"},{"id":"BIO-B01-Ch1.1.1-S039:C","text":"乙組只是把名詞排序，沒有分析互動","explanation":"不正確。題面明說建立互動模型，非單純排序。"},{"id":"BIO-B01-Ch1.1.1-S039:D","text":"互補，組件資料可支援系統模型","explanation":"正確。分子性質是模型的一部分，兩種研究可結合。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：甲提供部分資訊，乙研究這些部分的關係，角色不同而相輔。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S040","topicId":"BIO-1.1.1-SF","stem":"葉片通常寬而扁，這項構造特徵最直接有利於哪個功能？","correct":"BIO-B01-Ch1.1.1-S040:A","options":[{"id":"BIO-B01-Ch1.1.1-S040:A","text":"增加受光面積","explanation":"正確。寬扁形狀有助攔截光線、提供受光面積。"},{"id":"BIO-B01-Ch1.1.1-S040:B","text":"保證永遠不缺水","explanation":"不正確。形狀不能保證所有供水條件。"},{"id":"BIO-B01-Ch1.1.1-S040:C","text":"讓一片葉成為完整族群","explanation":"不正確。葉是器官，不是同種個體集合。"},{"id":"BIO-B01-Ch1.1.1-S040:D","text":"讓每個分子自行光合作用","explanation":"不正確。單分子仍不能取代組織化光合作用。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：把寬扁與受光面積相連，而不作超出該構造可支持的保證。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S041","topicId":"BIO-1.1.1-SF","stem":"蜂鳥翅膀能在肩部大幅旋轉，配合快速拍動而有利於懸停。這最能說明什麼？","correct":"BIO-B01-Ch1.1.1-S041:B","options":[{"id":"BIO-B01-Ch1.1.1-S041:A","text":"所有鳥的運動方式必然完全相同","explanation":"不正確。不同鳥類構造及運動可有差異。"},{"id":"BIO-B01-Ch1.1.1-S041:B","text":"構造及運動方式支持特定功能","explanation":"正確。題面把肩部構造及拍動連到懸停功能。"},{"id":"BIO-B01-Ch1.1.1-S041:C","text":"構造與功能完全獨立","explanation":"不正確。此例直接呈現兩者的關係。"},{"id":"BIO-B01-Ch1.1.1-S041:D","text":"只要有喙就不需翅膀","explanation":"不正確。喙用於取食，不能代替翅膀支持懸停。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：肩關節旋轉是構造線索，與拍動共同支持懸停。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S042","topicId":"BIO-1.1.1-SF","stem":"讀到細胞中某構造的位置與形狀時，哪種追問最有助理解其功能？","correct":"BIO-B01-Ch1.1.1-S042:C","options":[{"id":"BIO-B01-Ch1.1.1-S042:A","text":"能否由位置直接認定所有構造功能相同？","explanation":"不正確。位置可提供線索，不保證功能相同。"},{"id":"BIO-B01-Ch1.1.1-S042:B","text":"能否只記構造名稱而省略其作用？","explanation":"不正確。名稱不能取代構造與作用的關聯。"},{"id":"BIO-B01-Ch1.1.1-S042:C","text":"這種位置與形狀如何支持它的工作？","explanation":"正確。把構造特徵連到作用方式，才能理解功能。"},{"id":"BIO-B01-Ch1.1.1-S042:D","text":"能否只把所有構造依尺寸排序？","explanation":"不正確。尺寸排序可描述外形，但未解釋如何工作。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：結構資訊應用來推理功能如何發生，不只作名稱記憶。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S043","topicId":"BIO-1.1.1-SF","stem":"「構造與功能相關」可適用在哪些層級？","correct":"BIO-B01-Ch1.1.1-S043:D","options":[{"id":"BIO-B01-Ch1.1.1-S043:A","text":"只限肉眼看得到的器官","explanation":"不正確。分子及胞器也有構造功能關係。"},{"id":"BIO-B01-Ch1.1.1-S043:B","text":"只限動物而不適用植物","explanation":"不正確。葉片受光就是植物的例子。"},{"id":"BIO-B01-Ch1.1.1-S043:C","text":"只限生態系而不適用細胞","explanation":"不正確。細胞構造也支持其活動，不限生態系。"},{"id":"BIO-B01-Ch1.1.1-S043:D","text":"分子、胞器、細胞及器官等多個層級","explanation":"正確。不同尺度的形狀及組成均可影響功能。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：原則是跨層級的，不由肉眼能否看到或動植物身分決定。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S044","topicId":"BIO-1.1.1-CELL","stem":"在分子、胞器、細胞與組織之中，哪一層是能進行基本生命活動的最低組織層級？","correct":"BIO-B01-Ch1.1.1-S044:A","options":[{"id":"BIO-B01-Ch1.1.1-S044:A","text":"細胞","explanation":"正確。細胞整合各部分，成為生命基本單位。"},{"id":"BIO-B01-Ch1.1.1-S044:B","text":"分子","explanation":"不正確。單一分子沒有完整生命活動系統。"},{"id":"BIO-B01-Ch1.1.1-S044:C","text":"胞器","explanation":"不正確。胞器僅執行部分工作。"},{"id":"BIO-B01-Ch1.1.1-S044:D","text":"組織","explanation":"不正確。組織雖有功能，但由細胞組成，並非最低。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：先辨認完整基本生命活動，再在符合條件者中選最低層級。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S045","topicId":"BIO-1.1.1-CELL","stem":"某生物只有一個細胞，這個細胞能完成該生物的生命活動。最恰當的說法是什麼？","correct":"BIO-B01-Ch1.1.1-S045:B","options":[{"id":"BIO-B01-Ch1.1.1-S045:A","text":"它就是群集，因為具多種功能","explanation":"不正確。多功能不等於多物種族群總和。"},{"id":"BIO-B01-Ch1.1.1-S045:B","text":"此生物的細胞層級也對應整個個體","explanation":"正確。單細胞生物的一個細胞就是一個完整個體。"},{"id":"BIO-B01-Ch1.1.1-S045:C","text":"它必須先長出器官才能算生物","explanation":"不正確。單細胞生物不必有器官才具生命。"},{"id":"BIO-B01-Ch1.1.1-S045:D","text":"它是胞器，因為只有一個細胞","explanation":"不正確。細胞不是胞器，二者層級不同。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：細胞與個體可在單細胞生物上重合，不能套用多細胞的全部層級。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S046","topicId":"BIO-1.1.1-CELL","stem":"細胞學說認為生命活動以細胞活動為基礎。下列何者與此一致？","correct":"BIO-B01-Ch1.1.1-S046:C","options":[{"id":"BIO-B01-Ch1.1.1-S046:A","text":"每一個胞器都是獨立生物","explanation":"不正確。胞器是細胞內部功能構造。"},{"id":"BIO-B01-Ch1.1.1-S046:B","text":"只有不停分裂的細胞才算生命單位","explanation":"不正確。部分分化細胞不持續分裂，仍是細胞。"},{"id":"BIO-B01-Ch1.1.1-S046:C","text":"多細胞生物的功能可由不同細胞分工合作完成","explanation":"正確。分化細胞的合作可形成個體功能。"},{"id":"BIO-B01-Ch1.1.1-S046:D","text":"每種細胞都必須能獨立完成整個生物的一切功能","explanation":"不正確。多細胞生物存在分工及相互依賴。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：基本單位並不等於每種細胞各自包辦整個生物的全部工作。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S047","topicId":"BIO-1.1.1-TYPE","stem":"比較典型原核與真核細胞，下列哪個構造最能直接區分兩者？","correct":"BIO-B01-Ch1.1.1-S047:D","options":[{"id":"BIO-B01-Ch1.1.1-S047:A","text":"有無任何DNA","explanation":"不正確。原核也有DNA，不能用有無DNA區分。"},{"id":"BIO-B01-Ch1.1.1-S047:B","text":"是否由原子組成","explanation":"不正確。兩者都由原子組成的物質構成。"},{"id":"BIO-B01-Ch1.1.1-S047:C","text":"是否具有化學分子","explanation":"不正確。兩種細胞都含多種化學分子。"},{"id":"BIO-B01-Ch1.1.1-S047:D","text":"有無膜包圍的細胞核","explanation":"正確。真核有膜包圍的核，原核沒有此核。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：區別在DNA是否位於膜包圍的細胞核，而非有無遺傳物質。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S048","topicId":"BIO-1.1.1-TYPE","stem":"細菌有DNA卻沒有膜包圍的細胞核，應如何解釋？","correct":"BIO-B01-Ch1.1.1-S048:A","options":[{"id":"BIO-B01-Ch1.1.1-S048:A","text":"沒有細胞核不等於沒有遺傳物質","explanation":"正確。原核DNA不被核膜包圍，仍屬遺傳物質。"},{"id":"BIO-B01-Ch1.1.1-S048:B","text":"只要有DNA就一定是真核","explanation":"不正確。DNA並非真核專有。"},{"id":"BIO-B01-Ch1.1.1-S048:C","text":"DNA只能存在核膜內","explanation":"不正確。原核的DNA可在沒有核膜的區域。"},{"id":"BIO-B01-Ch1.1.1-S048:D","text":"沒有核的細菌只是一個分子","explanation":"不正確。細菌是細胞及個體，不是單分子。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：DNA存在與核膜包圍是兩個不同的條件。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S049","topicId":"BIO-1.1.1-TYPE","stem":"依基本細胞分類，細菌與古菌分別屬於哪一類？","correct":"BIO-B01-Ch1.1.1-S049:B","options":[{"id":"BIO-B01-Ch1.1.1-S049:A","text":"細菌真核、古菌原核","explanation":"不正確。細菌也是原核，不是此組合。"},{"id":"BIO-B01-Ch1.1.1-S049:B","text":"兩者都屬原核生物","explanation":"正確。細菌及古菌都沒有膜包圍的細胞核。"},{"id":"BIO-B01-Ch1.1.1-S049:C","text":"兩者都屬真核生物","explanation":"不正確。兩者不具有真核型細胞核。"},{"id":"BIO-B01-Ch1.1.1-S049:D","text":"細菌原核、古菌真核","explanation":"不正確。古菌仍是原核，不能因名稱不同判真核。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：兩群的分類名稱不同，但都具有原核型細胞組織。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-S050","topicId":"BIO-1.1.1-TYPE","stem":"原核細胞DNA集中的區域稱為核區或擬核。哪個敘述正確？","correct":"BIO-B01-Ch1.1.1-S050:C","options":[{"id":"BIO-B01-Ch1.1.1-S050:A","text":"有核區代表這個細胞沒有DNA","explanation":"不正確。核區名稱正是描述DNA集中的區域。"},{"id":"BIO-B01-Ch1.1.1-S050:B","text":"有核區就表示細胞已變成器官","explanation":"不正確。細胞內區域不會把細胞升為器官。"},{"id":"BIO-B01-Ch1.1.1-S050:C","text":"核區沒有包圍它的核膜，不等同真核細胞核","explanation":"正確。核區是DNA所在區域，沒有真核型核膜。"},{"id":"BIO-B01-Ch1.1.1-S050:D","text":"核區就是有雙層核膜的細胞核","explanation":"不正確。把核區與膜包圍細胞核混淆了。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：判斷核與核區的差異要看膜包圍，不是只看名稱含「核」。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1.1.1-B001","topicId":"BIO-1.1.1-MIC","stem":"某葉肉細胞內可見葉綠體，葉綠體內含許多葉綠素分子。若依「被包含者→包含者」連線，何者正確？","correct":"BIO-B01-Ch1.1.1-B001:C","options":[{"id":"BIO-B01-Ch1.1.1-B001:A","text":"葉綠體→葉肉細胞→葉綠素","explanation":"不正確。葉綠素不包含葉肉細胞。"},{"id":"BIO-B01-Ch1.1.1-B001:B","text":"葉綠素→葉肉細胞→葉綠體","explanation":"不正確。最後一段倒置，應是葉綠體在細胞內。"},{"id":"BIO-B01-Ch1.1.1-B001:C","text":"葉綠素→葉綠體→葉肉細胞","explanation":"正確。分子在胞器內，胞器在細胞內。"},{"id":"BIO-B01-Ch1.1.1-B001:D","text":"葉肉細胞→葉綠素→葉綠體","explanation":"不正確。細胞不是被葉綠素分子包含。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：逐段核對包含關係即可；箭頭定義已給，不需猜是放大或縮小方向。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B002","topicId":"BIO-1.1.1-MIC","stem":"甲是單一化學分子；乙由多種分子構成，位於細胞內並完成特定工作；丙包含乙並執行基本生命活動。三者最合理的標籤是？","correct":"BIO-B01-Ch1.1.1-B002:D","options":[{"id":"BIO-B01-Ch1.1.1-B002:A","text":"甲胞器、乙分子、丙細胞","explanation":"不正確。甲明定單分子，乙反而由多分子構成。"},{"id":"BIO-B01-Ch1.1.1-B002:B","text":"甲分子、乙細胞、丙胞器","explanation":"不正確。胞器應位於細胞內，乙丙被顛倒。"},{"id":"BIO-B01-Ch1.1.1-B002:C","text":"甲細胞、乙組織、丙器官","explanation":"不正確。題面甲不是細胞，整組標籤起點錯誤。"},{"id":"BIO-B01-Ch1.1.1-B002:D","text":"甲分子、乙胞器、丙細胞","explanation":"正確。依化學單位、細胞內功能構造、完整細胞依序判斷。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：先由甲的化學分子確定起點，再用乙的位置及丙的功能確認兩級。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B003","topicId":"BIO-1.1.1-MIC","stem":"一份報告量測純化葉綠素的吸光性，另一份報告觀察整個葉肉細胞。兩份研究的直接對象如何分類？","correct":"BIO-B01-Ch1.1.1-B003:A","options":[{"id":"BIO-B01-Ch1.1.1-B003:A","text":"前者分子，後者細胞","explanation":"正確。純化色素是分子對象，完整葉肉細胞是細胞。"},{"id":"BIO-B01-Ch1.1.1-B003:B","text":"前者細胞，後者胞器","explanation":"不正確。前者沒有完整細胞，後者也不是胞器。"},{"id":"BIO-B01-Ch1.1.1-B003:C","text":"兩者都屬器官","explanation":"不正確。器官如整片葉，不是這兩個對象。"},{"id":"BIO-B01-Ch1.1.1-B003:D","text":"前者胞器，後者組織","explanation":"不正確。葉綠素不是胞器，單細胞也不是組織。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：用研究的直接對象判斷層級，不能因都取自葉片而都標成器官。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B004","topicId":"BIO-1.1.1-MIC","stem":"某胞器離開細胞後仍能短暫執行一項特定反應。根據這一觀察，最合理的結論是什麼？","correct":"BIO-B01-Ch1.1.1-B004:B","options":[{"id":"BIO-B01-Ch1.1.1-B004:A","text":"細胞不再是基本生命單位","explanation":"不正確。觀察到部分反應並未推翻細胞學說。"},{"id":"BIO-B01-Ch1.1.1-B004:B","text":"有特定反應能力仍不足以證明它是完整生命單位","explanation":"正確。部分功能不等於能維持全部基本生命活動。"},{"id":"BIO-B01-Ch1.1.1-B004:C","text":"它已必然成為單細胞生物","explanation":"不正確。尚無完整生命活動的證據。"},{"id":"BIO-B01-Ch1.1.1-B004:D","text":"只要離開細胞，胞器就變成分子","explanation":"不正確。移動位置不改變其多分子構造層級。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：題目只提供一項短暫反應，不能擴推獨立完整生命能力。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B005","topicId":"BIO-1.1.1-MIC","stem":"甲是一片含許多細胞的微小葉片；乙是另一種生物的一個尺寸較大的細胞。若只憑甲比乙小就說甲的組織層級較低，合理嗎？","correct":"BIO-B01-Ch1.1.1-B005:C","options":[{"id":"BIO-B01-Ch1.1.1-B005:A","text":"合理；所有器官必大於所有細胞","explanation":"不正確。不同對象的尺寸可重疊，並非定義標準。"},{"id":"BIO-B01-Ch1.1.1-B005:B","text":"不合理；大小完全不可能影響任何功能","explanation":"不正確。不能只以尺寸判層級，不等於否定尺寸與功能的關係。"},{"id":"BIO-B01-Ch1.1.1-B005:C","text":"不合理；層級依組成與功能界定，不能只比長度","explanation":"正確。甲為器官、乙為細胞，不能只憑尺寸排序。"},{"id":"BIO-B01-Ch1.1.1-B005:D","text":"合理；較小物體必為分子","explanation":"不正確。微小物體仍可有不同組成層級。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：器官由多種組織構成，葉片是植物器官。題面甲是一片多細胞葉片，乙是一個細胞；兩者取自不同生物，應依器官與細胞的組成定義判斷，而非單憑尺寸。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B006","topicId":"BIO-1.1.1-MIC","stem":"學生將分子、胞器、細胞三張卡排成「胞器→分子→細胞」，並宣稱由低至高。最少應修正哪項相鄰順序？","correct":"BIO-B01-Ch1.1.1-B006:D","options":[{"id":"BIO-B01-Ch1.1.1-B006:A","text":"將後兩張互換，成胞器→細胞→分子","explanation":"不正確。把分子置於最高仍錯。"},{"id":"BIO-B01-Ch1.1.1-B006:B","text":"維持不動，原順序正確","explanation":"不正確。原排序把胞器放在分子以下。"},{"id":"BIO-B01-Ch1.1.1-B006:C","text":"將首尾互換，成細胞→分子→胞器","explanation":"不正確。細胞應在三者最高，不能置於起點。"},{"id":"BIO-B01-Ch1.1.1-B006:D","text":"將前兩張互換，成分子→胞器→細胞","explanation":"正確。分子構成胞器，胞器在細胞內，互換前兩張即可。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：依分子\u003c胞器\u003c細胞逐張對照，錯的是原第一與第二張。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B007","topicId":"BIO-1.1.1-MIC","stem":"「葉綠體由分子組成，所以葉綠體與葉綠素都應標成分子。」這句推論錯在哪裡？","correct":"BIO-B01-Ch1.1.1-B007:A","options":[{"id":"BIO-B01-Ch1.1.1-B007:A","text":"由某層級組成，不表示整體仍屬該組件層級","explanation":"正確。胞器以分子為組件，但形成較高組織層級。"},{"id":"BIO-B01-Ch1.1.1-B007:B","text":"葉綠體內不可能有分子","explanation":"不正確。葉綠體的確含許多分子。"},{"id":"BIO-B01-Ch1.1.1-B007:C","text":"分子只能出現在細胞外","explanation":"不正確。分子也存在細胞及胞器內。"},{"id":"BIO-B01-Ch1.1.1-B007:D","text":"葉綠素其實是整個器官","explanation":"不正確。葉綠素是色素分子，葉才是器官。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：組成材料與整體分類需分開；人由細胞構成也不等於一個細胞。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1
