— New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B008","topicId":"BIO-1.1.1-MIC","stem":"研究人員從細胞中分離一個完整細胞核，核內仍有多種分子。最恰當的分類是什麼？","correct":"BIO-B01-Ch1.1.1-B008:B","options":[{"id":"BIO-B01-Ch1.1.1-B008:A","text":"細胞核由分子組成所以是單一分子","explanation":"不正確。由多種分子組成不等於單一分子。"},{"id":"BIO-B01-Ch1.1.1-B008:B","text":"細胞核是胞器，分離位置不使它成為完整細胞","explanation":"正確。核是細胞內的功能構造，不含完整細胞活動系統。"},{"id":"BIO-B01-Ch1.1.1-B008:C","text":"細胞核只要離開細胞就是器官","explanation":"不正確。器官要由多種組織構成。"},{"id":"BIO-B01-Ch1.1.1-B008:D","text":"細胞核有DNA所以等同單細胞生物","explanation":"不正確。有DNA不是獨立完整生物的充分條件。"}],"concept":"分子是原子以化學鍵結合形成的結構；胞器是細胞內執行特定工作的構造；細胞則整合各組成部分，進行維持生命所需的基本活動。判斷層級應看組成及包含關係，不能只憑大小或名稱。葉綠素是分子，葉綠體是胞器，葉肉細胞是細胞。\n本題判斷：結構身分由組成與功能決定，不因被取出或有DNA而升級。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B009","topicId":"BIO-1.1.1-BODY","stem":"某植物部位由表皮、葉肉與輸導等多種組織協作完成受光等功能。學生只因「它有很多細胞」而判為組織，最應補查什麼？","correct":"BIO-B01-Ch1.1.1-B009:C","options":[{"id":"BIO-B01-Ch1.1.1-B009:A","text":"它是否一定屬於動物","explanation":"不正確。植物也有器官及組織。"},{"id":"BIO-B01-Ch1.1.1-B009:B","text":"細胞數是否大於固定的一萬個","explanation":"不正確。沒有用一萬個細胞當通用分類門檻。"},{"id":"BIO-B01-Ch1.1.1-B009:C","text":"是否由多種組織形成一個功能器官","explanation":"正確。多種組織協作是區分器官的重要組成線索。"},{"id":"BIO-B01-Ch1.1.1-B009:D","text":"這個部位的名稱有幾個字","explanation":"不正確。字數不決定層級。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：題面已有多種組織，應判為器官；很多細胞本身不足以區分組織與器官。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B010","topicId":"BIO-1.1.1-BODY","stem":"甲是葉片的一層表皮組織，乙是整片葉，丙是含根莖葉的整株植物。哪個敘述正確？","correct":"BIO-B01-Ch1.1.1-B010:D","options":[{"id":"BIO-B01-Ch1.1.1-B010:A","text":"甲是器官、乙是組織、丙是族群","explanation":"不正確。甲乙倒置，單株丙也不是族群。"},{"id":"BIO-B01-Ch1.1.1-B010:B","text":"甲是胞器、乙是細胞、丙是組織","explanation":"不正確。表皮層不在胞器層級，後續也不符。"},{"id":"BIO-B01-Ch1.1.1-B010:C","text":"甲乙丙皆是同一層級，只差尺寸","explanation":"不正確。三者有不同組成關係，不僅尺寸差。"},{"id":"BIO-B01-Ch1.1.1-B010:D","text":"甲是組織、乙是器官、丙是個體","explanation":"正確。依合作細胞、多種組織及完整生物順序判斷。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：逐項使用題面身分標記，不把植物全部層級混為一類。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B011","topicId":"BIO-1.1.1-BODY","stem":"一群細胞合作形成某組織，其中細胞形狀並不完全一致。這是否足以否定它是組織？","correct":"BIO-B01-Ch1.1.1-B011:A","options":[{"id":"BIO-B01-Ch1.1.1-B011:A","text":"不足；組織強調合作與功能，不要求所有細胞完全相同","explanation":"正確。細胞形態差異不排除共同組織化功能。"},{"id":"BIO-B01-Ch1.1.1-B011:B","text":"足以；組織內細胞必須像複製品","explanation":"不正確。完全相同不是組織的必要定義。"},{"id":"BIO-B01-Ch1.1.1-B011:C","text":"足以；形狀不同就必為不同物種族群","explanation":"不正確。同一個體細胞形態差異不等於不同物種。"},{"id":"BIO-B01-Ch1.1.1-B011:D","text":"不足；因任何散放細胞都自動成為器官","explanation":"不正確。散放細胞不保證組織化，更不必然成器官。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：題面已提供合作的組織功能，形狀不完全相同並非否定理由。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B012","topicId":"BIO-1.1.1-BODY","stem":"某記錄把「一顆心臟」與「循環系統」視為同義詞。最精確的修正為何？","correct":"BIO-B01-Ch1.1.1-B012:B","options":[{"id":"BIO-B01-Ch1.1.1-B012:A","text":"心臟無功能；只有系統才有功能","explanation":"不正確。器官有自身功能，亦可參與系統協作。"},{"id":"BIO-B01-Ch1.1.1-B012:B","text":"心臟是器官；循環系統由多個器官協作","explanation":"正確。單器官與多器官系統有組成層級差異。"},{"id":"BIO-B01-Ch1.1.1-B012:C","text":"心臟是細胞；循環系統是胞器","explanation":"不正確。心臟不是單細胞，系統也非胞器。"},{"id":"BIO-B01-Ch1.1.1-B012:D","text":"心臟是族群；循環系統是群集","explanation":"不正確。二者是個體內層級，不是生態集合。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：心臟提供系統的一部分功能，但不能把其中一個器官等同整個系統。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B013","topicId":"BIO-1.1.1-BODY","stem":"將同一株植物的十片葉放在一起，僅憑「有很多器官」，能否保證它們已構成完整個體？","correct":"BIO-B01-Ch1.1.1-B013:C","options":[{"id":"BIO-B01-Ch1.1.1-B013:A","text":"能；器官數多就自動成為族群","explanation":"不正確。族群由同種完整個體組成，不是器官堆。"},{"id":"BIO-B01-Ch1.1.1-B013:B","text":"不能；因為葉片不屬器官","explanation":"不正確。葉片是器官，問題在是否形成完整個體。"},{"id":"BIO-B01-Ch1.1.1-B013:C","text":"不能；個體需要完整組織與協作，器官堆放不保證完整生物","explanation":"正確。完整個體並非器官數量的簡單門檻。"},{"id":"BIO-B01-Ch1.1.1-B013:D","text":"能；任何十個器官都是一個個體","explanation":"不正確。十這個數量不是定義條件。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：原來屬同株不代表離散葉片集合維持整株完整功能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B014","topicId":"BIO-1.1.1-BODY","stem":"動物甲只有一個完整身體，內有多個合作的器官系統。若要研究甲的整體活動，最適合把研究單位設為什麼？","correct":"BIO-B01-Ch1.1.1-B014:D","options":[{"id":"BIO-B01-Ch1.1.1-B014:A","text":"單一器官","explanation":"不正確。單器官不足涵蓋全部身體系統。"},{"id":"BIO-B01-Ch1.1.1-B014:B","text":"單一組織","explanation":"不正確。組織範圍更小，不是整隻甲。"},{"id":"BIO-B01-Ch1.1.1-B014:C","text":"同種族群","explanation":"不正確。未研究同區域所有同種個體。"},{"id":"BIO-B01-Ch1.1.1-B014:D","text":"個體","explanation":"正確。整隻甲是個體，能整合各器官系統活動。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：研究問題的邊界是單一完整身體，應選個體尺度。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B015","topicId":"BIO-1.1.1-BODY","stem":"學生畫了「細胞→組織→器官→器官系統→個體」的一般多細胞生物組成圖。以下何種解讀最合理？","correct":"BIO-B01-Ch1.1.1-B015:A","options":[{"id":"BIO-B01-Ch1.1.1-B015:A","text":"箭頭描述組成層級，不表示每個細胞都能單獨長成完整個體","explanation":"正確。層級圖說明協作組成，不是各細胞再生能力。"},{"id":"BIO-B01-Ch1.1.1-B015:B","text":"箭頭保證每個分化細胞都能再生成整個身體","explanation":"不正確。再生完整個體不是此圖能保證的能力。"},{"id":"BIO-B01-Ch1.1.1-B015:C","text":"箭頭表示所有單細胞生物都必須有心臟","explanation":"不正確。單細胞生物沒有多細胞的器官系統要求。"},{"id":"BIO-B01-Ch1.1.1-B015:D","text":"箭頭表示器官系統位於細胞內","explanation":"不正確。器官系統由器官組成，包含許多細胞。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：把結構層級與發育能力分開，避免從圖上多推一個未給的結論。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B016","topicId":"BIO-1.1.1-BODY","stem":"同一人身上的皮膚某組織、心臟及消化系統，依其名稱指涉的層級分別為何？","correct":"BIO-B01-Ch1.1.1-B016:B","options":[{"id":"BIO-B01-Ch1.1.1-B016:A","text":"族群、群集、生態系","explanation":"不正確。全部都是個體內部範圍，不是生態層級。"},{"id":"BIO-B01-Ch1.1.1-B016:B","text":"組織、器官、器官系統","explanation":"正確。題面三者分別指定組織、單一心臟和多器官系統。"},{"id":"BIO-B01-Ch1.1.1-B016:C","text":"細胞、組織、器官","explanation":"不正確。把每項各壓低一級，不符合組成。"},{"id":"BIO-B01-Ch1.1.1-B016:D","text":"器官、器官系統、個體","explanation":"不正確。消化系統不是完整人，其他也錯移層級。"}],"concept":"組織是一群合作執行特定功能的細胞；器官由多種組織構成；多個器官協作形成器官系統；單一完整生物是個體。這是組成層級，並非只按細胞數量排序。組織不要求每個細胞完全相同，單細胞生物也不必經過組織與器官層級才成為個體。\n本題判斷：組織不是整個皮膚，題面特別限定某組織；再配對心臟及消化系統。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第3頁／正式第5張（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B017","topicId":"BIO-1.1.1-POP","stem":"甲日某封閉池塘僅有同種魚，魚的幼成體都計入。乙日仍在同塘調查同種魚。兩次記錄最適合如何處理？","correct":"BIO-B01-Ch1.1.1-B017:C","options":[{"id":"BIO-B01-Ch1.1.1-B017:A","text":"因日期不同就必然是兩個不同物種","explanation":"不正確。時間改變不直接使物種改變。"},{"id":"BIO-B01-Ch1.1.1-B017:B","text":"只要同塘就不用確認魚種","explanation":"不正確。同區域可有多物種，仍須核對物種。"},{"id":"BIO-B01-Ch1.1.1-B017:C","text":"作為同一界定族群在不同時間的觀察，保留日期","explanation":"正確。時間標記可保留同一族群的不同時點資訊。"},{"id":"BIO-B01-Ch1.1.1-B017:D","text":"把兩日所有記錄相加當作甲日的個體總數","explanation":"不正確。相加可能重複計同個體且混合時點。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：族群可被連續研究，但單一時點的數量不能混用不同日期。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B018","topicId":"BIO-1.1.1-POP","stem":"一項完整清點確認甲池今日有30隻A種魚、20隻B種魚及10隻C種蝦。僅就這三個已列物種，可辨識幾個族群？","correct":"BIO-B01-Ch1.1.1-B018:D","options":[{"id":"BIO-B01-Ch1.1.1-B018:A","text":"1個","explanation":"不正確。一個水域不等於只有一個物種族群。"},{"id":"BIO-B01-Ch1.1.1-B018:B","text":"2個","explanation":"不正確。A魚、B魚為不同物種，不能合併成一類魚族群。"},{"id":"BIO-B01-Ch1.1.1-B018:C","text":"60個","explanation":"不正確。60是個體總數，不是族群數。"},{"id":"BIO-B01-Ch1.1.1-B018:D","text":"3個","explanation":"正確。同塘三物種各對應一個族群，共3個。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：先按物種分組，A、B、C三組；30+20+10=60只代表個體合計。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B019","topicId":"BIO-1.1.1-POP","stem":"乙池今日有同一物種的15隻雄魚、25隻雌魚，已確認無其他該物種個體。此物種的族群個體數為何？","correct":"BIO-B01-Ch1.1.1-B019:A","options":[{"id":"BIO-B01-Ch1.1.1-B019:A","text":"40隻","explanation":"正確。15+25=40，性別不使同種族群分開。"},{"id":"BIO-B01-Ch1.1.1-B019:B","text":"15隻","explanation":"不正確。漏計同物種雌魚。"},{"id":"BIO-B01-Ch1.1.1-B019:C","text":"25隻","explanation":"不正確。漏計同物種雄魚。"},{"id":"BIO-B01-Ch1.1.1-B019:D","text":"2隻","explanation":"不正確。2是性別組別數，不是個體數。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：同種同塘同時的雄雌都納入，總數為40隻。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B020","topicId":"BIO-1.1.1-POP","stem":"一份校園麻雀記錄只有「看見12隻」，未界定日期或區域。要把它當作特定族群的完整數量，還缺什麼關鍵資料？","correct":"BIO-B01-Ch1.1.1-B020:B","options":[{"id":"BIO-B01-Ch1.1.1-B020:A","text":"只需要校園全部樹木的數量","explanation":"不正確。其他物種的數量不能界定本次麻雀記錄。"},{"id":"BIO-B01-Ch1.1.1-B020:B","text":"時間空間邊界及是否涵蓋該界線內所有同種個體","explanation":"正確。族群及完整清點需有時間、區域及覆蓋範圍。"},{"id":"BIO-B01-Ch1.1.1-B020:C","text":"只需要當天所有鳥類的物種數","explanation":"不正確。全部鳥類物種數不能補麻雀族群的邊界及清點完整性。"},{"id":"BIO-B01-Ch1.1.1-B020:D","text":"只需要一隻麻雀的身長","explanation":"不正確。個體身長不表示族群總數。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：12是已觀察個體數，未必是明確族群總量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B021","topicId":"BIO-1.1.1-POP","stem":"甲公園及相隔很遠的乙公園各有同一物種的樹。若調查範圍已限定甲公園，乙公園的樹應如何處理？","correct":"BIO-B01-Ch1.1.1-B021:C","options":[{"id":"BIO-B01-Ch1.1.1-B021:A","text":"把乙公園的樹改稱非生物成分","explanation":"不正確。樹仍是生物，只是在本次邊界外。"},{"id":"BIO-B01-Ch1.1.1-B021:B","text":"把兩園所有樹合稱一個器官","explanation":"不正確。多棵樹不是單一器官。"},{"id":"BIO-B01-Ch1.1.1-B021:C","text":"不納入甲公園的族群清單，另保留其地點資料","explanation":"正確。指定空間邊界不包含乙園。"},{"id":"BIO-B01-Ch1.1.1-B021:D","text":"只要同種就必須計入甲公園","explanation":"不正確。同種之外還須符合指定區域。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：本題按已給調查範圍分類，並不判斷兩園是否存在基因交流。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B022","topicId":"BIO-1.1.1-POP","stem":"研究生把同塘所有蛙放在一起，卻未確認是否同一物種。能直接稱為「一個蛙族群」嗎？","correct":"BIO-B01-Ch1.1.1-B022:D","options":[{"id":"BIO-B01-Ch1.1.1-B022:A","text":"可以；凡同叫蛙即同物種","explanation":"不正確。日常類群名稱不等於單一物種。"},{"id":"BIO-B01-Ch1.1.1-B022:B","text":"可以；同塘就排除所有物種差異","explanation":"不正確。同水域可以同時存在不同物種。"},{"id":"BIO-B01-Ch1.1.1-B022:C","text":"不能；因所有蛙都不是個體","explanation":"不正確。一隻蛙是生物個體。"},{"id":"BIO-B01-Ch1.1.1-B022:D","text":"不能確定；需先確認物種是否一致","explanation":"正確。俗稱蛙可能含多物種，族群需同種條件。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：空間條件已符合，但物種條件仍待確認，不能把廣泛俗名當精確物種。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B023","topicId":"BIO-1.1.1-POP","stem":"同日同園區的同種樹，分為高樹與矮樹兩組量測。這種分組最合理的解讀為何？","correct":"BIO-B01-Ch1.1.1-B023:A","options":[{"id":"BIO-B01-Ch1.1.1-B023:A","text":"同一族群內依高度分組，未因此變成兩個物種族群","explanation":"正確。物種及時空條件未變，仍屬同一界定族群。"},{"id":"BIO-B01-Ch1.1.1-B023:B","text":"每一種高度都是一個新物種","explanation":"不正確。身高差異不是自動產生新物種。"},{"id":"BIO-B01-Ch1.1.1-B023:C","text":"矮樹只算組織，高樹才是個體","explanation":"不正確。矮樹只要完整仍是個體。"},{"id":"BIO-B01-Ch1.1.1-B023:D","text":"高度不同表示一定不在同一區域","explanation":"不正確。題面明說同園區，不能反向改條件。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：統計分組與組織層級分類不同，高度資料不改變族群身分。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B024","topicId":"BIO-1.1.1-POP","stem":"甲組列出今日甲池所有A種魚；乙組列出今日甲池所有A種魚及B種魚。對兩份清單最精確的說法是？","correct":"BIO-B01-Ch1.1.1-B024:B","options":[{"id":"BIO-B01-Ch1.1.1-B024:A","text":"乙已必然包含完整池塘群集","explanation":"不正確。未說列出全部其他物種，不保證完整群集。"},{"id":"BIO-B01-Ch1.1.1-B024:B","text":"甲是一族群；乙包含兩個物種的族群","explanation":"正確。A一物種一族群，A加B包含兩族群。"},{"id":"BIO-B01-Ch1.1.1-B024:C","text":"甲是胞器；乙是器官","explanation":"不正確。兩清單皆是個體集合，不是個體內構造。"},{"id":"BIO-B01-Ch1.1.1-B024:D","text":"甲與乙都是單一物種族群","explanation":"不正確。乙明確含兩物種，不是單一物種族群。"}],"concept":"族群是指定時間與區域內同一物種所有個體的集合；年齡、性別或大小不同，不會因此自動分成不同物種的族群。判斷時依序確認物種、空間與時間邊界。抽查到的部分個體是樣本，不等於已清點該族群全部個體。\n本題判斷：認定多族群不等於認定已涵蓋完整群集；需看全部物種覆蓋。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B025","topicId":"BIO-1.1.1-COMM","stem":"某湖調查記錄了所有魚和水草，但沒有調查細菌與真菌。若報告宣稱「已列出湖內全部群集成員」，最合理的評估是？","correct":"BIO-B01-Ch1.1.1-B025:C","options":[{"id":"BIO-B01-Ch1.1.1-B025:A","text":"宣稱正確，真菌應歸非生物環境","explanation":"不正確。真菌是生物，不是非生物環境。"},{"id":"BIO-B01-Ch1.1.1-B025:B","text":"宣稱過度，只需補水溫就能完成生物名單","explanation":"不正確。水溫有助生態系描述，但不能補齊生物名單。"},{"id":"BIO-B01-Ch1.1.1-B025:C","text":"宣稱過度，微生物及其他遺漏物種也屬群集","explanation":"正確。群集包含同域所有物種族群，不能漏掉微生物。"},{"id":"BIO-B01-Ch1.1.1-B025:D","text":"宣稱正確，肉眼可見者就是全部生物","explanation":"不正確。肉眼可見不是生物成員的限制。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：缺口是生物成員未調查，應補物種覆蓋而非只補環境數據。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B026","topicId":"BIO-1.1.1-COMM","stem":"甲報告研究草地全部生物族群；乙報告另把土壤、水分、日照及它們與生物的互動納入。何者配對正確？","correct":"BIO-B01-Ch1.1.1-B026:D","options":[{"id":"BIO-B01-Ch1.1.1-B026:A","text":"甲族群、乙群集","explanation":"不正確。甲含各物種，乙又包含非生物，不符這組標籤。"},{"id":"BIO-B01-Ch1.1.1-B026:B","text":"甲器官、乙器官系統","explanation":"不正確。兩者皆為生態層級，不是個體內器官。"},{"id":"BIO-B01-Ch1.1.1-B026:C","text":"甲生態系、乙單一個體","explanation":"不正確。乙比甲涵蓋更多環境，並非單一個體。"},{"id":"BIO-B01-Ch1.1.1-B026:D","text":"甲群集、乙生態系","explanation":"正確。乙增加非生物環境，符合生態系的範圍。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：先區分只有各生物族群，還是生物與非生物環境共同分析。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B027","topicId":"BIO-1.1.1-COMM","stem":"某教具把森林所有生物放在綠卡，把水、岩石及日光放在灰卡。若要表示森林生態系，應如何使用？","correct":"BIO-B01-Ch1.1.1-B027:A","options":[{"id":"BIO-B01-Ch1.1.1-B027:A","text":"綠卡和灰卡都納入，並連出相互影響","explanation":"正確。生態系包括群集、非生物環境及互動。"},{"id":"BIO-B01-Ch1.1.1-B027:B","text":"只放綠卡，因環境與生物無關","explanation":"不正確。只有綠卡較接近群集，漏了非生物。"},{"id":"BIO-B01-Ch1.1.1-B027:C","text":"只放灰卡，因生態系不含生命","explanation":"不正確。只有環境而無生物不是完整生態系。"},{"id":"BIO-B01-Ch1.1.1-B027:D","text":"把每張灰卡都改名為族群","explanation":"不正確。族群由同種生物個體組成，非岩石日光。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：卡片含義已明示，組合兩類才能表達生態系範圍。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B028","topicId":"BIO-1.1.1-COMM","stem":"草地內細菌肉眼看不見，日光卻看得見。據此把細菌排除於群集、把日光納入群集，錯誤原因為何？","correct":"BIO-B01-Ch1.1.1-B028:B","options":[{"id":"BIO-B01-Ch1.1.1-B028:A","text":"沒有把細菌當作器官系統","explanation":"不正確。細菌是原核細胞及個體，不是器官系統。"},{"id":"BIO-B01-Ch1.1.1-B028:B","text":"把可見性當作生物成員的判準","explanation":"正確。群集依是否為生物族群界定，非可見性。"},{"id":"BIO-B01-Ch1.1.1-B028:C","text":"把所有生命都納入了群集","explanation":"不正確。事實上它漏了細菌並加錯非生物。"},{"id":"BIO-B01-Ch1.1.1-B028:D","text":"沒有把日光當作一種細胞","explanation":"不正確。日光不是細胞，無須改作細胞。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：細菌屬生物；日光屬非生物。肉眼能否看見不能決定群集成員。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B029","topicId":"BIO-1.1.1-COMM","stem":"調查甲池的生態系時，研究者只保留水溫、水深與光照三項資料。哪一類資料最能補足生態系層級的核心缺口？","correct":"BIO-B01-Ch1.1.1-B029:C","options":[{"id":"BIO-B01-Ch1.1.1-B029:A","text":"只有單一葉片的器官組成","explanation":"不正確。單葉器官不是完整甲池生態系的唯一缺口。"},{"id":"BIO-B01-Ch1.1.1-B029:B","text":"只有全球所有生態系的位置","explanation":"不正確。本題界定甲池，不須以全球清單補此缺口。"},{"id":"BIO-B01-Ch1.1.1-B029:C","text":"生物群集及其與環境的互動","explanation":"正確。三項都是環境量，未描述生物及互動。"},{"id":"BIO-B01-Ch1.1.1-B029:D","text":"已記錄的水溫與光照","explanation":"不正確。題面已列出水溫與光照，不能說尚未涵蓋。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：可取得環境資料不等於已研究完整生態系，需要再納入生命成分及相互影響。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B030","topicId":"BIO-1.1.1-COMM","stem":"完整調查某小區域，確認其中只有A、B、C三物種，分別有8、12、20個個體。若只描述該區域全部生物組成，最合理為何？","correct":"BIO-B01-Ch1.1.1-B030:D","options":[{"id":"BIO-B01-Ch1.1.1-B030:A","text":"40個族群，共3個個體","explanation":"不正確。把物種分組數及個體加總數倒置。"},{"id":"BIO-B01-Ch1.1.1-B030:B","text":"1個族群，共40個個體","explanation":"不正確。題面有三物種，不能合為單一物種族群。"},{"id":"BIO-B01-Ch1.1.1-B030:C","text":"只要數完生物就已涵蓋所有非生物環境","explanation":"不正確。生物清點不能代替非生物環境資料。"},{"id":"BIO-B01-Ch1.1.1-B030:D","text":"3個族群構成該區域群集，共40個個體","explanation":"正確。按物種得3族群，個體數8+12+20=40。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：三物種完整清單可涵蓋此區域群集；加總的是個體而非物種。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B031","topicId":"BIO-1.1.1-COMM","stem":"某森林群集包含多種植物、真菌、動物及細菌。研究者想把「群集」改為「族群」，最需要縮限哪個條件？","correct":"BIO-B01-Ch1.1.1-B031:A","options":[{"id":"BIO-B01-Ch1.1.1-B031:A","text":"選定同區域同時間的一個物種全部個體","explanation":"正確。族群需一物種，保留時空邊界。"},{"id":"BIO-B01-Ch1.1.1-B031:B","text":"只刪除體型最大的動物","explanation":"不正確。刪一類大型動物仍可能有多物種。"},{"id":"BIO-B01-Ch1.1.1-B031:C","text":"只保留所有能移動的物種","explanation":"不正確。能移動者也可能屬多個不同物種。"},{"id":"BIO-B01-Ch1.1.1-B031:D","text":"只把土壤測量改成光照測量","explanation":"不正確。改環境變項不會使生物集合變成一物種。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：群集到族群的核心縮限是物種範圍，不是體型或運動能力。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B032","topicId":"BIO-1.1.1-COMM","stem":"同一草地有三張清單：甲列某一物種所有個體；乙列各物種所有族群；丙列乙並加上土壤、水與光。順序應標為何？","correct":"BIO-B01-Ch1.1.1-B032:B","options":[{"id":"BIO-B01-Ch1.1.1-B032:A","text":"個體→器官→器官系統","explanation":"不正確。三者都是區域生物集合，非個體內層級。"},{"id":"BIO-B01-Ch1.1.1-B032:B","text":"族群→群集→生態系","explanation":"正確。由同種、多種到加非生物環境，範圍依次擴展。"},{"id":"BIO-B01-Ch1.1.1-B032:C","text":"群集→族群→生態系","explanation":"不正確。前兩項同種與多種被交換。"},{"id":"BIO-B01-Ch1.1.1-B032:D","text":"生態系→群集→族群","explanation":"不正確。丙的範圍最大，不能列為族群。"}],"concept":"群集是同一區域內各物種族群的總和，包含植物、動物、真菌與微生物。把群集及與它互動的水、土壤、光等非生物環境一起研究，就是生態系層級。單一物種是族群；只有非生物環境則不足以構成完整生態系。\n本題判斷：逐步增加物種與非生物環境，正好對應三種尺度。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B033","topicId":"BIO-1.1.1-BIO","stem":"甲團隊整合全球所有海洋與陸地的生命及生活環境；乙團隊只研究一座森林內的生物與非生物環境。兩者的整體研究範圍依序為何？","correct":"BIO-B01-Ch1.1.1-B033:C","options":[{"id":"BIO-B01-Ch1.1.1-B033:A","text":"森林群集、全球一個器官","explanation":"不正確。全球整合不是森林群集，森林也不是器官。"},{"id":"BIO-B01-Ch1.1.1-B033:B","text":"單一個體、生物圈","explanation":"不正確。將兩者尺度方向倒置，且全球不等於個體。"},{"id":"BIO-B01-Ch1.1.1-B033:C","text":"生物圈、森林生態系","explanation":"正確。全球全部生命環境為生物圈，單一森林是地方生態系。"},{"id":"BIO-B01-Ch1.1.1-B033:D","text":"單一族群、單一細胞","explanation":"不正確。兩者涵蓋範圍遠高於此組合。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：先看是否整合所有生態系，再看是否限定一座森林。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B034","topicId":"BIO-1.1.1-BIO","stem":"有人把層級圖「分子→胞器→細胞」說成「每個分子一生都會變成一個細胞」。最適當的修正是什麼？","correct":"BIO-B01-Ch1.1.1-B034:D","options":[{"id":"BIO-B01-Ch1.1.1-B034:A","text":"箭頭代表每個胞器都能長成完整個體","explanation":"不正確。胞器不能被保證長成個體。"},{"id":"BIO-B01-Ch1.1.1-B034:B","text":"箭頭代表細胞不能含分子","explanation":"不正確。細胞確實含分子，此說相反。"},{"id":"BIO-B01-Ch1.1.1-B034:C","text":"箭頭代表分子比細胞有更多組織層級","explanation":"不正確。細胞是較高整合層級，不是分子更高。"},{"id":"BIO-B01-Ch1.1.1-B034:D","text":"箭頭代表組成層級，不是單個組件的成長歷程","explanation":"正確。分子組成胞器等結構，不是單一分子的必然人生歷程。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：組成圖描述不同尺度的關係，不能轉讀為每個物體沿線發育。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B035","topicId":"BIO-1.1.1-BIO","stem":"學生用「生態系→群集→族群→個體」描述由大範圍縮小觀察。要讓這段說明嚴謹，哪項補充最佳？","correct":"BIO-B01-Ch1.1.1-B035:A","options":[{"id":"BIO-B01-Ch1.1.1-B035:A","text":"每次縮小需明確選定區域、物種及個體對象","explanation":"正確。縮小研究邊界須說清在同域中選哪個集合或個體。"},{"id":"BIO-B01-Ch1.1.1-B035:B","text":"縮小就表示上層不含下層","explanation":"不正確。上層通常包含下層組成，縮小非否定包含。"},{"id":"BIO-B01-Ch1.1.1-B035:C","text":"縮小就是各物種演化成同一個個體","explanation":"不正確。觀察尺度轉換不是演化或融合過程。"},{"id":"BIO-B01-Ch1.1.1-B035:D","text":"所有層級必須有相同個體數","explanation":"不正確。不同邊界涵蓋不同對象，不要求數量相等。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：此序列表達觀察範圍縮限，須維持選定對象及邊界的一致。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B036","topicId":"BIO-1.1.1-BIO","stem":"一段講義列出「細胞、器官、個體」並稱為部分代表層級。學生說講義一定宣稱組織不存在，這個批評合理嗎？","correct":"BIO-B01-Ch1.1.1-B036:B","options":[{"id":"BIO-B01-Ch1.1.1-B036:A","text":"不合理；因任何層級次序都可以任意排列","explanation":"不正確。省略可接受，但次序及層級仍須正確。"},{"id":"BIO-B01-Ch1.1.1-B036:B","text":"不合理；部分列舉可省略中間層級而不否定其存在","explanation":"正確。部分代表不等於完整清單，省略不等於否認。"},{"id":"BIO-B01-Ch1.1.1-B036:C","text":"合理；未寫出的層級都不存在","explanation":"不正確。未列出不能推出不存在。"},{"id":"BIO-B01-Ch1.1.1-B036:D","text":"合理；細胞一定直接就是器官","explanation":"不正確。器官由組織構成，不能抹去中間關係。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：題面明說部分，因此應檢查所列順序而非推論未列者不存在。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B037","topicId":"BIO-1.1.1-BIO","stem":"下列哪一組研究對象由較低到較高組織範圍排列正確？","correct":"BIO-B01-Ch1.1.1-B037:C","options":[{"id":"BIO-B01-Ch1.1.1-B037:A","text":"一個葉肉細胞→整片葉→一個葉綠體","explanation":"不正確。末項胞器比細胞低，方向倒轉。"},{"id":"BIO-B01-Ch1.1.1-B037:B","text":"整片葉→一個葉肉細胞→一個葉綠體","explanation":"不正確。這是由較高至較低，不符題意。"},{"id":"BIO-B01-Ch1.1.1-B037:C","text":"一個葉綠體→一個葉肉細胞→整片葉","explanation":"正確。胞器在細胞內，葉為含多種組織的器官；順序向上。"},{"id":"BIO-B01-Ch1.1.1-B037:D","text":"整片葉→一個葉綠體→一個葉肉細胞","explanation":"不正確。器官不應在胞器之前作最低。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：對照胞器、細胞、器官的包含關係即可；題目不要求列全中間組織。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B038","topicId":"BIO-1.1.1-BIO","stem":"談生物圈時只寫「全球所有生物」，若想把定義補完整，最應增加哪部分？","correct":"BIO-B01-Ch1.1.1-B038:D","options":[{"id":"BIO-B01-Ch1.1.1-B038:A","text":"只增加一隻代表動物","explanation":"不正確。一隻動物已屬生命，不能補環境缺項。"},{"id":"BIO-B01-Ch1.1.1-B038:B","text":"只增加某物種的DNA序列","explanation":"不正確。單物種分子資料不足以補全球生活環境範圍。"},{"id":"BIO-B01-Ch1.1.1-B038:C","text":"只增加細胞核名稱","explanation":"不正確。胞器名稱不是缺漏的環境部分。"},{"id":"BIO-B01-Ch1.1.1-B038:D","text":"生命存在及互動的生活環境","explanation":"正確。生物圈包含全球生命以及生命存在的環境。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：全球生命是定義一部分，生活場所與環境也是生物圈範圍。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B039","topicId":"BIO-1.1.1-BIO","stem":"同一研究可從分子機制談到生態系現象。關於層級，何者最合理？","correct":"BIO-B01-Ch1.1.1-B039:A","options":[{"id":"BIO-B01-Ch1.1.1-B039:A","text":"需標清每項證據的尺度，較小尺度不能自動代替所有較大尺度結論","explanation":"正確。層級可連結，但跨尺度推論仍需對應關係。"},{"id":"BIO-B01-Ch1.1.1-B039:B","text":"只要分子證據成立，所有全球結論必然成立","explanation":"不正確。單分子證據不保證完整系統行為。"},{"id":"BIO-B01-Ch1.1.1-B039:C","text":"大尺度現象與細胞活動一定無關","explanation":"不正確。較大生命現象可以建立在細胞活動上。"},{"id":"BIO-B01-Ch1.1.1-B039:D","text":"不同尺度的研究永遠不能互相補充","explanation":"不正確。不同層級資訊可互補而非互斥。"}],"concept":"生物圈涵蓋地球上所有生命及其生活環境，可理解為所有生態系的總和。層級由分子、胞器、細胞、組織、器官、器官系統、個體，延伸至族群、群集、生態系與生物圈；其中列出部分代表層級不等於各項直接相鄰。這套圖示表達組成與範圍，不是演化先後。\n本題判斷：組成與互動連結各層級，不能省掉跨尺度的解釋與證據。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第1頁／正式第3張（10_imagegen_page_03.png）；正文第3頁／正式第5張（12_imagegen_page_05.png）；正文第4頁／正式第6張（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B040","topicId":"BIO-1.1.1-EM","stem":"兩個模型使用相同零件數及種類，只有連接方式不同；測得只有甲有整體輸出。最直接否定哪句話？","correct":"BIO-B01-Ch1.1.1-B040:B","options":[{"id":"BIO-B01-Ch1.1.1-B040:A","text":"單一零件資訊未必足夠","explanation":"本題不選。結果反而顯示單一零件資訊不足。"},{"id":"BIO-B01-Ch1.1.1-B040:B","text":"只要零件清單相同，完整功能必然相同","explanation":"本題應選。相同清單卻輸出不同，否定清單足夠的必然說。"},{"id":"BIO-B01-Ch1.1.1-B040:C","text":"零件的連接方式可能影響功能","explanation":"本題不選。這正是結果支持的可能性。"},{"id":"BIO-B01-Ch1.1.1-B040:D","text":"整體功能可以依賴多零件合作","explanation":"本題不選。兩模型差異與合作形式有關，此說未被否定。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：題目問被否定的敘述；只有必然相同與觀察直接矛盾。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B041","topicId":"BIO-1.1.1-EM","stem":"模型實驗保持零件種類、數量及輸入相同，僅將原本必要連接打斷，整體功能隨之消失。最保守的解釋為何？","correct":"BIO-B01-Ch1.1.1-B041:C","options":[{"id":"BIO-B01-Ch1.1.1-B041:A","text":"任何連接方式都一定可得到原功能","explanation":"不正確。被打斷後功能消失，反對任意連接皆可。"},{"id":"BIO-B01-Ch1.1.1-B041:B","text":"證明所有生物功能都只由這個連接決定","explanation":"不正確。此模型不能外推所有生物功能。"},{"id":"BIO-B01-Ch1.1.1-B041:C","text":"這種連接對題述條件下的整體功能重要","explanation":"正確。控制其餘條件，結果支持此連接與功能相關。"},{"id":"BIO-B01-Ch1.1.1-B041:D","text":"所有零件都已失去其任何性質","explanation":"不正確。失去整體功能不代表各零件全部性質消失。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：依比較只推及該連接在本模型條件下的作用，不加總體普遍性。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B042","topicId":"BIO-1.1.1-EM","stem":"甲零件可做工作X，乙可做Y；甲乙以特定方式連接後可做新工作Z，且單獨任一零件都不能做Z。關於Z何者正確？","correct":"BIO-B01-Ch1.1.1-B042:D","options":[{"id":"BIO-B01-Ch1.1.1-B042:A","text":"Z證明甲乙原本毫無性質","explanation":"不正確。甲乙原本各有X、Y能力。"},{"id":"BIO-B01-Ch1.1.1-B042:B","text":"Z表示X與Y必定全部消失","explanation":"不正確。有新功能不代表所有原性質消失。"},{"id":"BIO-B01-Ch1.1.1-B042:C","text":"Z必須來自第三種未被觀察的神秘物質","explanation":"不正確。已給出組合互動，沒有神秘物質證據。"},{"id":"BIO-B01-Ch1.1.1-B042:D","text":"Z可視為此組合層級的湧現功能","explanation":"正確。Z在組織互動後才有，符合湧現。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：依單獨與組合能力比較，Z是新出現的整體功能；X、Y仍是組件資訊。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B043","topicId":"BIO-1.1.1-EM","stem":"某人把湧現性質只理解為「體積變大」。下列哪個觀察更直接呈現湧現的核心？","correct":"BIO-B01-Ch1.1.1-B043:A","options":[{"id":"BIO-B01-Ch1.1.1-B043:A","text":"同量零件改變排列後出現新的協作功能","explanation":"正確。新功能由組織關係產生，不需只靠增加體積。"},{"id":"BIO-B01-Ch1.1.1-B043:B","text":"把原本無協作的零件數量加倍，仍只有原有性能","explanation":"不正確。只增加數量而沒有新功能，不足展示湧現。"},{"id":"BIO-B01-Ch1.1.1-B043:C","text":"測出一個單獨零件原本就有的質量","explanation":"不正確。原有單件質量不是組合後新生性質。"},{"id":"BIO-B01-Ch1.1.1-B043:D","text":"把同一物體在照片上的影像放大","explanation":"不正確。影像放大改變顯示，不代表實體新功能。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：要辨認的是功能是否因排列互動改變，不是外觀大小增加。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B044","topicId":"BIO-1.1.1-EM","stem":"甲研究記錄所有零件性質；乙研究再記錄連接關係。為解釋「單獨沒有、組合才有」的功能，為何乙通常更有幫助？","correct":"BIO-B01-Ch1.1.1-B044:B","options":[{"id":"BIO-B01-Ch1.1.1-B044:A","text":"乙不必說明任何組件的作用","explanation":"不正確。理解互動通常仍須知道組件如何作用。"},{"id":"BIO-B01-Ch1.1.1-B044:B","text":"乙補上組件如何形成互動系統的資訊","explanation":"正確。湧現功能依賴關係，乙補足此關鍵部分。"},{"id":"BIO-B01-Ch1.1.1-B044:C","text":"乙讓零件性質變得完全不重要","explanation":"不正確。零件性質仍是系統行為的基礎。"},{"id":"BIO-B01-Ch1.1.1-B044:D","text":"乙只要資料較多就一定正確","explanation":"不正確。資料數量不能保證品質及解釋正確。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：兩者差別是有無關係資訊，不應將其誤讀為多資料必勝。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B045","topicId":"BIO-1.1.1-EM","stem":"完整系統拆散後失去新功能，研究者卻能測出零件各自仍有原本的特性。兩個結果能並存嗎？","correct":"BIO-B01-Ch1.1.1-B045:C","options":[{"id":"BIO-B01-Ch1.1.1-B045:A","text":"不能；拆散一定破壞所有分子的全部性質","explanation":"不正確。拆散可改關係，不必消除全部組件性質。"},{"id":"BIO-B01-Ch1.1.1-B045:B","text":"能；因整體功能與任何零件都無關","explanation":"不正確。整體依靠組件及關係，不能說完全無關。"},{"id":"BIO-B01-Ch1.1.1-B045:C","text":"能；組件性質仍在，不代表組織化整體功能仍在","explanation":"正確。部分特性與整體功能屬不同組織層級。"},{"id":"BIO-B01-Ch1.1.1-B045:D","text":"不能；只要零件有特性，整體功能就必在","explanation":"不正確。漏了排列及互動條件。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：拆散破壞組織可能使湧現功能消失，但個別組件測量仍正常。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B046","topicId":"BIO-1.1.1-EM","stem":"老師要用一句話概括湧現，哪句最完整？","correct":"BIO-B01-Ch1.1.1-B046:D","options":[{"id":"BIO-B01-Ch1.1.1-B046:A","text":"零件越多就必然得到所有想要的功能","explanation":"不正確。數量不能保證特定功能。"},{"id":"BIO-B01-Ch1.1.1-B046:B","text":"上層功能出現後便不再依賴下層組件","explanation":"不正確。高層仍依賴其組成及互動。"},{"id":"BIO-B01-Ch1.1.1-B046:C","text":"凡是暫時不懂的現象都叫湧現","explanation":"不正確。湧現是有明確組織意義的概念，不是未知的代稱。"},{"id":"BIO-B01-Ch1.1.1-B046:D","text":"較低層級組件以特定方式排列互動，使較高層級出現單件原無的性質","explanation":"正確。同時指出組件、組織互動及新的高層性質。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：完整定義需有來源層級、形成條件及性質的新生性。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B047","topicId":"BIO-1.1.1-EM","stem":"模型甲的零件單獨和組合時都只呈現各自原有的顏色；模型乙在協調組裝後能完成單件做不到的運輸。哪個觀察更直接展示湧現？","correct":"BIO-B01-Ch1.1.1-B047:A","options":[{"id":"BIO-B01-Ch1.1.1-B047:A","text":"模型乙的整體運輸能力","explanation":"正確。協調後才有運輸能力，具有新整體功能。"},{"id":"BIO-B01-Ch1.1.1-B047:B","text":"模型甲零件原有顏色","explanation":"不正確。已存在的單件顏色不是此題新生功能證據。"},{"id":"BIO-B01-Ch1.1.1-B047:C","text":"兩者都僅因零件有顏色而湧現","explanation":"不正確。顏色存在本身沒有組合後新功能條件。"},{"id":"BIO-B01-Ch1.1.1-B047:D","text":"兩者都不能，因湧現只限生命","explanation":"不正確。非生命系統也可以展示組合新功能。"}],"concept":"湧現性質是較低層級組件以特定方式排列並互動後，較高層級出現單獨組件沒有的性質。組件的自身性質仍重要，但只有清單或增加數量，不能保證完整功能。研究排列及互動可解釋這些現象，因此不需假設神秘力量，也不是只限生命才有的現象。\n本題判斷：要比較的是新能力，而非所有可見特徵；乙明確符合單件無、整體有。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第5頁／正式第7張（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B048","topicId":"BIO-1.1.1-PHOTO","stem":"某混合物含葉綠素與多種相關分子，可吸光但不能完成完整光合作用。這個結果如何與湧現觀點相容？","correct":"BIO-B01-Ch1.1.1-B048:B","options":[{"id":"BIO-B01-Ch1.1.1-B048:A","text":"湧現要求每個分子單獨先完成光合作用","explanation":"不正確。完整功能可在組織後才出現，不需單件先有。"},{"id":"BIO-B01-Ch1.1.1-B048:B","text":"保有吸光等部分性質，但缺適當組織時未必有完整功能","explanation":"正確。單分子或部分作用可保留，整合程序仍可能缺失。"},{"id":"BIO-B01-Ch1.1.1-B048:C","text":"既能吸光就已等於完成光合作用","explanation":"不正確。吸光是部分作用，不是整套程序。"},{"id":"BIO-B01-Ch1.1.1-B048:D","text":"失去完整功能表示所有分子都不存在","explanation":"不正確。題面明定分子存在，不能推成不存在。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：吸光與完整光合作用不是同一個測量終點，因此兩項觀察不矛盾。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B049","topicId":"BIO-1.1.1-PHOTO","stem":"某學生主張「只要加入更多葉綠素，就一定能讓散亂分子混合物完成光合作用」。最適當的評估是？","correct":"BIO-B01-Ch1.1.1-B049:C","options":[{"id":"BIO-B01-Ch1.1.1-B049:A","text":"充分；葉綠素本來就是完整葉綠體","explanation":"不正確。葉綠素是分子，葉綠體是胞器。"},{"id":"BIO-B01-Ch1.1.1-B049:B","text":"不充分；因葉綠素不會吸光","explanation":"不正確。葉綠素能吸光，問題在完整功能的條件不足。"},{"id":"BIO-B01-Ch1.1.1-B049:C","text":"不充分；分子數量不能取代必要的組織與協作","explanation":"正確。增加一種成分不保證建立完整系統。"},{"id":"BIO-B01-Ch1.1.1-B049:D","text":"充分；葉綠素越多就能代替所有其他組件","explanation":"不正確。其他組件及其協作不能由增加色素自動取代。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：必要條件不只色素數量，故「一定」的推論過強。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B050","topicId":"BIO-1.1.1-PHOTO","stem":"比較完整葉綠體與其中單一葉綠素分子，哪項配對最合適？","correct":"BIO-B01-Ch1.1.1-B050:D","options":[{"id":"BIO-B01-Ch1.1.1-B050:A","text":"葉綠體是單一分子；葉綠素是多細胞器官","explanation":"不正確。分子及器官層級皆被顛倒。"},{"id":"BIO-B01-Ch1.1.1-B050:B","text":"葉綠體不需分子；葉綠素需整個器官才存在","explanation":"不正確。葉綠體由分子構成，色素存在也不需整個器官完整。"},{"id":"BIO-B01-Ch1.1.1-B050:C","text":"兩者各自都必然能完成完整生物的一切活動","explanation":"不正確。胞器及分子都不是完整生命個體。"},{"id":"BIO-B01-Ch1.1.1-B050:D","text":"葉綠體是協作系統；葉綠素提供吸光等部分作用","explanation":"正確。胞器功能由多分子組織支援，色素只是部分。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：比較組織化整體與部分分子的角色，兩者有關卻不等同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B051","topicId":"BIO-1.1.1-PHOTO","stem":"甲保留葉綠體原有組織，乙將相同來源分子單純混合。兩者都照光且材料供應相同。若要檢查整體功能是否保留，哪種觀察最切題？","correct":"BIO-B01-Ch1.1.1-B051:A","options":[{"id":"BIO-B01-Ch1.1.1-B051:A","text":"檢查能否完成整體光合作用，而非只檢查是否吸光","explanation":"正確。整體程序是要比較的功能，吸光只代表部分作用。"},{"id":"BIO-B01-Ch1.1.1-B051:B","text":"只檢查葉綠素是否仍能吸光","explanation":"不正確。吸光可保留，仍不能證明完整程序。"},{"id":"BIO-B01-Ch1.1.1-B051:C","text":"只確認兩組包含相同分子名稱","explanation":"不正確。清單相同不表示組織及互動相同。"},{"id":"BIO-B01-Ch1.1.1-B051:D","text":"只確認一種酵素仍能催化其特定反應","explanation":"不正確。單酵素作用正常不保證其他部分已協調。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：題目比較組織是否保留完整功能，測量指標必須對應完整功能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B052","topicId":"BIO-1.1.1-PHOTO","stem":"某葉綠體中，分子位置受到擾亂，但分子種類仍可被檢測。能否只因種類齊全而斷言完整功能正常？","correct":"BIO-B01-Ch1.1.1-B052:B","options":[{"id":"BIO-B01-Ch1.1.1-B052:A","text":"不能；因位置一變就證明所有分子消失","explanation":"不正確。檢測仍有各分子，不能推成全部消失。"},{"id":"BIO-B01-Ch1.1.1-B052:B","text":"不能；還需確認排列與互動及實際功能","explanation":"正確。組件齊全不代表協作關係未受影響。"},{"id":"BIO-B01-Ch1.1.1-B052:C","text":"能；清單等於功能證據","explanation":"不正確。名稱清單不能代替功能測量。"},{"id":"BIO-B01-Ch1.1.1-B052:D","text":"能；葉綠體只是不同分子的名稱總和","explanation":"不正確。葉綠體還有組織結構，不只是清單。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：現有證據只支持成分在場，尚不支持功能未變。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B053","topicId":"BIO-1.1.1-PHOTO","stem":"把「葉綠素吸光」與「葉綠體的完整光合作用」分別寫在兩張卡上。若要說明兩者關係，哪個連接語最精確？","correct":"BIO-B01-Ch1.1.1-B053:C","options":[{"id":"BIO-B01-Ch1.1.1-B053:A","text":"後者與前者及任何分子都無關","explanation":"不正確。完整系統依賴其分子，不是無關。"},{"id":"BIO-B01-Ch1.1.1-B053:B","text":"兩卡都是同一分子的同義名稱","explanation":"不正確。一張說分子作用，一張說胞器整體功能。"},{"id":"BIO-B01-Ch1.1.1-B053:C","text":"部分分子的作用，需在組織化系統中與其他作用配合","explanation":"正確。完整功能要整合多種部分作用。"},{"id":"BIO-B01-Ch1.1.1-B053:D","text":"前者必然單獨完成後者全部工作","explanation":"不正確。吸光不等於完成整套光合作用。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：連線應表達部分對整體的貢獻，不能畫成完全等號。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B054","topicId":"BIO-1.1.1-PHOTO","stem":"某分離材料仍含會吸光的葉綠素與可催化反應的酵素，卻缺少原有空間組織。哪句話最能避免誤解？","correct":"BIO-B01-Ch1.1.1-B054:D","options":[{"id":"BIO-B01-Ch1.1.1-B054:A","text":"只要酵素會催化，就等於任何完整程序都能完成","explanation":"不正確。酵素催化有特定作用，不能代替整套組織條件。"},{"id":"BIO-B01-Ch1.1.1-B054:B","text":"葉綠素與酵素的功能必須完全相同","explanation":"不正確。色素吸光與酵素催化是不同角色。"},{"id":"BIO-B01-Ch1.1.1-B054:C","text":"缺空間組織就表示材料沒有原子","explanation":"不正確。空間組織改變不等於物質消失。"},{"id":"BIO-B01-Ch1.1.1-B054:D","text":"各分子可有自身性質，完整功能仍需正確協作","explanation":"正確。保留部分性質與失去整體功能可以並存。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：分子性質、分工與空間安排要一併考慮，才不會以一項能力推定全部。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B055","topicId":"BIO-1.1.1-PHOTO","stem":"若要用葉綠體例子反駁「高層功能都能由單一分子獨自完成」，最適合提出哪項理由？","correct":"BIO-B01-Ch1.1.1-B055:A","options":[{"id":"BIO-B01-Ch1.1.1-B055:A","text":"完整光合作用需要多種分子按特定方式組織協作","explanation":"正確。完整功能需要系統整合，是對單一分子包辦的反例。"},{"id":"BIO-B01-Ch1.1.1-B055:B","text":"葉綠素完全不會吸光","explanation":"不正確。葉綠素可吸光，這不是正確反駁。"},{"id":"BIO-B01-Ch1.1.1-B055:C","text":"葉綠體沒有任何分子","explanation":"不正確。葉綠體確由多種分子組成。"},{"id":"BIO-B01-Ch1.1.1-B055:D","text":"有綠色的物體就必然是完整生物","explanation":"不正確。顏色不能決定生命完整性。"}],"concept":"葉綠素能吸收光，酵素可催化特定反應，但任何單一分子的作用都不等於完整光合作用。葉綠體把多種分子安排在適當結構與位置，使它們協調作用。只把相關分子混合，未必保留完整功能；這說明整體功能依賴組織與互動，而不是否定分子的化學性質。\n本題判斷：反駁要保留分子本身的作用，再指出單件不足以涵蓋完整程序。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁／正式第8張（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B056","topicId":"BIO-1.1.1-BIKE","stem":"甲把腳踏車各零件逐一拍照；乙另外記錄鏈條、踏板及車輪如何連接。為解釋踩踏後能載人前進，乙多提供什麼？","correct":"BIO-B01-Ch1.1.1-B056:B","options":[{"id":"BIO-B01-Ch1.1.1-B056:A","text":"腳踏車能永遠不用能源的證據","explanation":"不正確。仍需踩踏等輸入，不能推出永動。"},{"id":"BIO-B01-Ch1.1.1-B056:B","text":"零件彼此配合形成整體功能的關係資訊","explanation":"正確。連接關係協助解釋力量如何經組合形成整體作用。"},{"id":"BIO-B01-Ch1.1.1-B056:C","text":"腳踏車具有生命的證據","explanation":"不正確。機械連接不等於生命。"},{"id":"BIO-B01-Ch1.1.1-B056:D","text":"所有零件均無自身性質的證據","explanation":"不正確。記錄關係不否定零件自身特性。"}],"concept":"腳踏車的車架、輪子與傳動零件各有性質；適當組裝後，配合騎乘者施力，才可整體載人前進。這用來類比排列與互動產生新功能，並不表示腳踏車有生命或能無能源自行運作。湧現並非生命專有，生命系統通常比此類例子複雜。\n本題判斷：一份零件清單與一份連接描述回答不同問題，後者補足整體運作。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁／正式第9張（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B057","topicId":"BIO-1.1.1-BIKE","stem":"同一套腳踏車零件在散放與組裝時總數相同。只有正確組裝並踩踏才能載人前進，哪個推論合理？","correct":"BIO-B01-Ch1.1.1-B057:C","options":[{"id":"BIO-B01-Ch1.1.1-B057:A","text":"散放零件必定沒有重量","explanation":"不正確。沒有載人功能不表示沒有重量。"},{"id":"BIO-B01-Ch1.1.1-B057:B","text":"組裝能讓物質不再受任何條件限制","explanation":"不正確。組裝仍需操作及能源，不能取消條件。"},{"id":"BIO-B01-Ch1.1.1-B057:C","text":"功能差異可來自組織方式，而非必須增加零件數","explanation":"正確。數量不變而關係改變，可形成新整體功能。"},{"id":"BIO-B01-Ch1.1.1-B057:D","text":"一定是組裝後新增了另一套零件","explanation":"不正確。題面已明說同一套且總數相同。"}],"concept":"腳踏車的車架、輪子與傳動零件各有性質；適當組裝後，配合騎乘者施力，才可整體載人前進。這用來類比排列與互動產生新功能，並不表示腳踏車有生命或能無能源自行運作。湧現並非生命專有，生命系統通常比此類例子複雜。\n本題判斷：固定數量使排列與連接成為關鍵差異，但仍保留踩踏前提。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁／正式第9張（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B058","topicId":"BIO-1.1.1-BIKE","stem":"某人指出「單一車輪也可以被推動」，因此說腳踏車不能作湧現例子。最適當的回答是？","correct":"BIO-B01-Ch1.1.1-B058:D","options":[{"id":"BIO-B01-Ch1.1.1-B058:A","text":"只要車輪會動，所有整車功能都已具備","explanation":"不正確。部分移動能力不能代替整車協作。"},{"id":"BIO-B01-Ch1.1.1-B058:B","text":"單輪只要移動就有生命","explanation":"不正確。被外力推動不代表生命。"},{"id":"BIO-B01-Ch1.1.1-B058:C","text":"湧現要求每個零件完全沒有任何能力","explanation":"不正確。零件可以有自身能力，只是無完整整體功能。"},{"id":"BIO-B01-Ch1.1.1-B058:D","text":"單輪可移動不等於具整車的載人騎行功能","explanation":"正確。比較的整體功能是協調載人騎行，不是任何形式的移動。"}],"concept":"腳踏車的車架、輪子與傳動零件各有性質；適當組裝後，配合騎乘者施力，才可整體載人前進。這用來類比排列與互動產生新功能，並不表示腳踏車有生命或能無能源自行運作。湧現並非生命專有，生命系統通常比此類例子複雜。\n本題判斷：必須把觀察終點說精確：單輪移動與整車載人騎行不是同一功能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁／正式第9張（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B059","topicId":"BIO-1.1.1-BIKE","stem":"腳踏車類比生命系統時，哪個延伸最不恰當？","correct":"BIO-B01-Ch1.1.1-B059:A","options":[{"id":"BIO-B01-Ch1.1.1-B059:A","text":"只要有組合後的新功能，就必定具有細胞與生命","explanation":"本題應選。非生命也可湧現，不能由此推得細胞與生命。"},{"id":"BIO-B01-Ch1.1.1-B059:B","text":"組件排列可能影響整體功能","explanation":"本題不選。這是類比可支持的共同點。"},{"id":"BIO-B01-Ch1.1.1-B059:C","text":"零件研究有助理解組裝後系統","explanation":"本題不選。了解零件可支援系統解釋，沒有過度延伸。"},{"id":"BIO-B01-Ch1.1.1-B059:D","text":"生命系統的互動可能比腳踏車更複雜","explanation":"本題不選。此比較符合生命系統更複雜的說明。"}],"concept":"腳踏車的車架、輪子與傳動零件各有性質；適當組裝後，配合騎乘者施力，才可整體載人前進。這用來類比排列與互動產生新功能，並不表示腳踏車有生命或能無能源自行運作。湧現並非生命專有，生命系統通常比此類例子複雜。\n本題判斷：問最不恰當，應選把共有特徵錯當生命充分條件的選項。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁／正式第9張（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B060","topicId":"BIO-1.1.1-BIKE","stem":"一輛腳踏車拆下鏈條後仍有車架、車輪及踏板，但踩踏無法照原方式驅動車輪。下列何者最能解釋這個結果？","correct":"BIO-B01-Ch1.1.1-B060:B","options":[{"id":"BIO-B01-Ch1.1.1-B060:A","text":"人想以踩踏前進就足以取代原本的連接","explanation":"不正確。人的目的不能自動建立實際機械連接。"},{"id":"BIO-B01-Ch1.1.1-B060:B","text":"必要連接受破壞，部分零件仍在不足以保證原整體功能","explanation":"正確。題給鏈條拆除使原驅動連接受阻，組件在場不保證協作。"},{"id":"BIO-B01-Ch1.1.1-B060:C","text":"只要車輪仍在，完整騎行功能必不變","explanation":"不正確。車輪只是部分，原踩踏驅動仍需適當連接。"},{"id":"BIO-B01-Ch1.1.1-B060:D","text":"只要少一個零件，其餘零件就失去所有自身性質","explanation":"不正確。失去整體功能不表示所有零件全部性質消失。"}],"concept":"腳踏車的車架、輪子與傳動零件各有性質；適當組裝後，配合騎乘者施力，才可整體載人前進。這用來類比排列與互動產生新功能，並不表示腳踏車有生命或能無能源自行運作。湧現並非生命專有，生命系統通常比此類例子複雜。\n本題判斷：題面已給出拆除連接與原驅動方式失效的結果；應歸因於組織協作受破壞，而不是把部分仍在或操作意圖當成完整功能保證。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁／正式第9張（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B061","topicId":"BIO-1.1.1-BIKE","stem":"若將組裝後的腳踏車再次拆散，但保存所有原零件，以下何者最有可能？","correct":"BIO-B01-Ch1.1.1-B061:C","options":[{"id":"BIO-B01-Ch1.1.1-B061:A","text":"拆散會自動讓零件成為細胞","explanation":"不正確。機械拆解不產生細胞。"},{"id":"BIO-B01-Ch1.1.1-B061:B","text":"拆散證明零件研究永遠無用","explanation":"不正確。零件研究仍可了解組成及各部分作用。"},{"id":"BIO-B01-Ch1.1.1-B061:C","text":"零件仍在，原本整體載人功能卻不再保持","explanation":"正確。拆散改變互動與連接，可能失去整體功能。"},{"id":"BIO-B01-Ch1.1.1-B061:D","text":"只要零件全保留，所有整體功能一定不變","explanation":"不正確。保存清單不等於保存組織。"}],"concept":"腳踏車的車架、輪子與傳動零件各有性質；適當組裝後，配合騎乘者施力，才可整體載人前進。這用來類比排列與互動產生新功能，並不表示腳踏車有生命或能無能源自行運作。湧現並非生命專有，生命系統通常比此類例子複雜。\n本題判斷：保留材料與保留組織是兩回事，這也是湧現研究的重點。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁／正式第9張（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B062","topicId":"BIO-1.1.1-RED","stem":"研究者先分離甲分子研究其作用，再回到細胞檢查它與其他成分共同產生的行為。這套流程最合理的評價是？","correct":"BIO-B01-Ch1.1.1-B062:D","options":[{"id":"BIO-B01-Ch1.1.1-B062:A","text":"前一步一旦完成，後一步必然多餘","explanation":"不正確。單一組件結果未必包含原系統互動。"},{"id":"BIO-B01-Ch1.1.1-B062:B","text":"兩步方法不同所以不能放同一研究","explanation":"不正確。互補方法可共用研究問題。"},{"id":"BIO-B01-Ch1.1.1-B062:C","text":"只有第二步才算任何有效觀察","explanation":"不正確。前步也能提供組件性質的有效證據。"},{"id":"BIO-B01-Ch1.1.1-B062:D","text":"結合還原研究與系統層級的互動核對","explanation":"正確。部分與關係的資料可相互補充。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：先看部分再回系統，能避免分離結果被直接當成整體全部結論。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B063","topicId":"BIO-1.1.1-RED","stem":"純化某組件後測得它有特定作用。報告接著說「已因此完整解釋整個細胞的一切行為」。主要問題是什麼？","correct":"BIO-B01-Ch1.1.1-B063:A","options":[{"id":"BIO-B01-Ch1.1.1-B063:A","text":"由單一組件過度推及整體，尚需互動與組織證據","explanation":"正確。部分作用不足以自動推出全部整體行為。"},{"id":"BIO-B01-Ch1.1.1-B063:B","text":"只要純化過的資料都完全無效","explanation":"不正確。純化研究可有效回答組件問題。"},{"id":"BIO-B01-Ch1.1.1-B063:C","text":"細胞不可能包含任何組件","explanation":"不正確。細胞由多種組件整合而成。"},{"id":"BIO-B01-Ch1.1.1-B063:D","text":"完整細胞永遠不能被科學研究","explanation":"不正確。細胞整體可用適當研究分析。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：問題在結論範圍超過證據，不在純化方法本身無價值。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B064","topicId":"BIO-1.1.1-RED","stem":"一篇研究把葉片問題縮小成「某蛋白質具有什麼性質」。下列哪種說法最準確？","correct":"BIO-B01-Ch1.1.1-B064:B","options":[{"id":"BIO-B01-Ch1.1.1-B064:A","text":"只要研究蛋白質就等於研究所有群集互動","explanation":"不正確。單蛋白質不等同群集各物種互動。"},{"id":"BIO-B01-Ch1.1.1-B064:B","text":"它採取還原策略，但未必涵蓋葉片全部功能","explanation":"正確。由葉片到組件可更易研究，但仍有整體層級缺項。"},{"id":"BIO-B01-Ch1.1.1-B064:C","text":"它已直接研究整個生物圈","explanation":"不正確。尺度縮至分子，不是全球。"},{"id":"BIO-B01-Ch1.1.1-B064:D","text":"它完全排除了任何分子層級資訊","explanation":"不正確。蛋白質本身就是分子層級資訊。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：研究問題從較大結構縮到特定組件，可回答較窄且清楚的問題。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B065","topicId":"BIO-1.1.1-RED","stem":"甲方法只量測各零件個別性能；乙方法研究連接後的整體行為。若甲缺少整體輸出，能否斷言甲研究錯誤？","correct":"BIO-B01-Ch1.1.1-B065:C","options":[{"id":"BIO-B01-Ch1.1.1-B065:A","text":"能；湧現代表零件不值得研究","explanation":"不正確。組件性質仍是整體理解的基礎。"},{"id":"BIO-B01-Ch1.1.1-B065:B","text":"不能；因甲一定已完整測出所有互動","explanation":"不正確。甲明說個別性能，未必有連接互動資訊。"},{"id":"BIO-B01-Ch1.1.1-B065:C","text":"不能；甲可能正確回答組件問題，但不能單獨回答全部整體問題","explanation":"正確。方法的有效性需看其要回答的問題與證據。"},{"id":"BIO-B01-Ch1.1.1-B065:D","text":"能；所有非整體觀察必為錯誤","explanation":"不正確。個別部分可以被正確測量。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：欠缺某類資訊不等於已有資料為錯；應補研究而非否定全部。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B066","topicId":"BIO-1.1.1-RED","stem":"某課堂活動要求「把一個複雜細胞列成可分別研究的較小成分」。這主要訓練什麼思路？","correct":"BIO-B01-Ch1.1.1-B066:D","options":[{"id":"BIO-B01-Ch1.1.1-B066:A","text":"只分析完整細胞的全部互動","explanation":"不正確。題面先拆為部分，未直接分析全部互動。"},{"id":"BIO-B01-Ch1.1.1-B066:B","text":"把個體分成不同生態族群","explanation":"不正確。細胞成分不是生態族群。"},{"id":"BIO-B01-Ch1.1.1-B066:C","text":"依完整個體間的關係研究群集","explanation":"不正確。群集研究對象是各物種族群，非細胞內部分。"},{"id":"BIO-B01-Ch1.1.1-B066:D","text":"還原論的拆分問題策略","explanation":"正確。將複雜系統化為較易研究部分，符合還原策略。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：研究可拆分不等於組件能獨立生存，兩個問題不可混淆。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B067","topicId":"BIO-1.1.1-RED","stem":"若還原研究已提供零件種類、結構與作用，要更完整理解湧現功能，下一步最需要哪類資訊？","correct":"BIO-B01-Ch1.1.1-B067:A","options":[{"id":"BIO-B01-Ch1.1.1-B067:A","text":"零件在系統中如何排列、連接及影響彼此","explanation":"正確。互動關係補足組件資料沒有的整體組織資訊。"},{"id":"BIO-B01-Ch1.1.1-B067:B","text":"同一零件在完全隔離下更多次的名稱核對","explanation":"不正確。名稱再核對沒有補出在系統內的關係。"},{"id":"BIO-B01-Ch1.1.1-B067:C","text":"只列每個組件所占的空間尺寸","explanation":"不正確。尺寸可能有用，但單獨尺寸不等於排列及協作。"},{"id":"BIO-B01-Ch1.1.1-B067:D","text":"只將零件依平均質量排序","explanation":"不正確。質量排序仍是組件資訊，不直接描述互動。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：完整理解要從部分性能接到組織關係及整體結果。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B068","topicId":"BIO-1.1.1-RED","stem":"研究單一DNA分子結構有助理解遺傳的化學基礎，卻不代表已回答全部細胞活動。這兩句話的關係是？","correct":"BIO-B01-Ch1.1.1-B068:B","options":[{"id":"BIO-B01-Ch1.1.1-B068:A","text":"相容，因DNA不是任何生物系統的組件","explanation":"不正確。DNA是生物系統成分，此理由不正確。"},{"id":"BIO-B01-Ch1.1.1-B068:B","text":"相容，分子研究有價值但解釋範圍有限","explanation":"正確。研究價值與涵蓋全部問題是不同要求。"},{"id":"BIO-B01-Ch1.1.1-B068:C","text":"互相矛盾，有價值就必須解釋所有活動","explanation":"不正確。有效回答部分不代表包辦全部。"},{"id":"BIO-B01-Ch1.1.1-B068:D","text":"互相矛盾，不能完整解釋就完全無用","explanation":"不正確。有範圍限制的研究仍可提供有效資訊。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：把「有效的部分解釋」與「完整全體解釋」分開，即可理解兩句相容。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B069","topicId":"BIO-1.1.1-RED","stem":"某團隊要測量葉綠體內一種分子的自身性質，暫時不研究其他分子。以下評語最恰當？","correct":"BIO-B01-Ch1.1.1-B069:C","options":[{"id":"BIO-B01-Ch1.1.1-B069:A","text":"因未研究全部互動，數據必須全部丟棄","explanation":"不正確。資訊不完整不等於測量無效。"},{"id":"BIO-B01-Ch1.1.1-B069:B","text":"只要測到一個分子就能保證葉綠體功能正常","explanation":"不正確。一個分子正常不能保證完整胞器功能。"},{"id":"BIO-B01-Ch1.1.1-B069:C","text":"可作為還原研究，結論應限定於已測組件及條件","explanation":"正確。明確範圍的部分研究可有用，須守結論邊界。"},{"id":"BIO-B01-Ch1.1.1-B069:D","text":"不論結果如何都必須標成系統生物學","explanation":"不正確。未分析互動，不因研究對象生物性而必屬系統觀。"}],"concept":"還原論將複雜系統分解為較小且容易研究的部分，能釐清分子或構造的性質及作用。例如研究分離出的DNA結構，有助理解遺傳的化學基礎。然而單獨組件通常缺少整體的部分性質，還需研究組件在原系統內的互動；有用不等於足以回答所有問題。\n本題判斷：合適的方法對應合適的問題；範圍限制應寫在結論而非偽稱全解。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4–5 頁（PDF 53–54 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B070","topicId":"BIO-1.1.1-SYS","stem":"甲建立細胞內成分清單；乙測量這些成分隨時間相互影響的關係。何者比較直接符合系統生物學的核心？","correct":"BIO-B01-Ch1.1.1-B070:D","options":[{"id":"BIO-B01-Ch1.1.1-B070:A","text":"甲，只因列出的名稱較多","explanation":"不正確。數量多不能取代關係分析。"},{"id":"BIO-B01-Ch1.1.1-B070:B","text":"兩者都不能，因細胞太小","explanation":"不正確。單細胞也可以是一個系統。"},{"id":"BIO-B01-Ch1.1.1-B070:C","text":"甲，因系統生物學必須排除時間變化","explanation":"不正確。時間變化可協助理解整體行為，不必排除。"},{"id":"BIO-B01-Ch1.1.1-B070:D","text":"乙，因它分析互動與動態行為","explanation":"正確。互動及動態是系統研究的重要特徵。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：比較兩份資料的內容而非數量或尺度，乙提供關係及時間資訊。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B071","topicId":"BIO-1.1.1-SYS","stem":"一個模型將細胞成分A、B、C列為節點，箭頭明訂表示「一個成分改變會影響另一成分」。這些箭頭最主要補充什麼？","correct":"BIO-B01-Ch1.1.1-B071:A","options":[{"id":"BIO-B01-Ch1.1.1-B071:A","text":"組件之間的作用關係","explanation":"正確。定義已指明影響方向，提供互動資訊。"},{"id":"BIO-B01-Ch1.1.1-B071:B","text":"只表示成分體積由小到大","explanation":"不正確。題給箭頭定義不是尺寸排序。"},{"id":"BIO-B01-Ch1.1.1-B071:C","text":"只表示A、B、C被發現的先後","explanation":"不正確。發現順序不是這些箭頭所指的因果作用。"},{"id":"BIO-B01-Ch1.1.1-B071:D","text":"只表示每個成分的化學名稱","explanation":"不正確。名稱屬節點標籤，不是關係箭頭資訊。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：依題給箭頭圖例閱讀，便能分辨關係資訊與單純節點名單。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B072","topicId":"BIO-1.1.1-SYS","stem":"甲研究一隻青蛙各部分如何協作，乙研究沙漠各生物與環境如何互相影響。哪個評價正確？","correct":"BIO-B01-Ch1.1.1-B072:B","options":[{"id":"BIO-B01-Ch1.1.1-B072:A","text":"兩者都不能，因系統只限純化分子","explanation":"不正確。系統不限純化組件，核心反而是互動。"},{"id":"BIO-B01-Ch1.1.1-B072:B","text":"兩者都可採系統觀，研究尺度不同但都重視互動","explanation":"正確。個體及生態系都可分析組成互動。"},{"id":"BIO-B01-Ch1.1.1-B072:C","text":"只有乙可以，因系統必須很大","explanation":"不正確。系統研究不限定最大尺度。"},{"id":"BIO-B01-Ch1.1.1-B072:D","text":"只有甲可以，因環境不能納入系統","explanation":"不正確。生態系可把環境及生物互動納入。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：以問題是否分析關係判斷，不用大小當唯一門檻。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B073","topicId":"BIO-1.1.1-SYS","stem":"某細胞模型準確列出成分種類，卻假設各成分永遠互不影響。若要解釋整體動態，這項假設可能有何限制？","correct":"BIO-B01-Ch1.1.1-B073:C","options":[{"id":"BIO-B01-Ch1.1.1-B073:A","text":"模型越少互動就必定越符合生物","explanation":"不正確。簡化要有依據，不能保證越少越真實。"},{"id":"BIO-B01-Ch1.1.1-B073:B","text":"列出成分後便不可能再改良模型","explanation":"不正確。可以加入關係並以資料檢查改良。"},{"id":"BIO-B01-Ch1.1.1-B073:C","text":"忽略真實互動可能漏掉整體行為的來源","explanation":"正確。系統行為可來自互動，忽略關係可能造成缺漏。"},{"id":"BIO-B01-Ch1.1.1-B073:D","text":"只要列齊名稱就保證動態完全正確","explanation":"不正確。名單不能保證時間行為正確。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：模型已有部分資訊，但其獨立假設需查證是否忽略關鍵關係。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B074","topicId":"BIO-1.1.1-SYS","stem":"為了解同一細胞系統在不同時點的整體行為，哪組資料最有幫助？","correct":"BIO-B01-Ch1.1.1-B074:D","options":[{"id":"BIO-B01-Ch1.1.1-B074:A","text":"只保留第一天的一份名稱清單","explanation":"不正確。單時點清單不足回答多時點變化。"},{"id":"BIO-B01-Ch1.1.1-B074:B","text":"只保留各成分體積，不記錄時間","explanation":"不正確。靜態體積資料缺少互動及時間對應。"},{"id":"BIO-B01-Ch1.1.1-B074:C","text":"只把所有時點合併成一份無時間標記的總清單","explanation":"不正確。混合時間會丟失先後與動態關係。"},{"id":"BIO-B01-Ch1.1.1-B074:D","text":"各時點成分狀態、互動及整體反應的對應","explanation":"正確。時間資料與關係配對可分析動態行為。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：題目要解釋隨時間的變化，因此需同時記錄成分關係及整體反應。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B075","topicId":"BIO-1.1.1-SYS","stem":"系統模型顯示整體行為需要A與B的互動；後續分離A研究其性質。這一步與系統生物學是否衝突？","correct":"BIO-B01-Ch1.1.1-B075:A","options":[{"id":"BIO-B01-Ch1.1.1-B075:A","text":"不衝突；組件性質研究可補充互動模型","explanation":"正確。還原研究可提供更準確的組件資料。"},{"id":"BIO-B01-Ch1.1.1-B075:B","text":"衝突；系統研究禁止任何分離實驗","explanation":"不正確。兩種策略互補，不是禁止關係。"},{"id":"BIO-B01-Ch1.1.1-B075:C","text":"衝突；整體有功能表示A沒有任何作用","explanation":"不正確。A的作用可能是互動基礎，不能否定。"},{"id":"BIO-B01-Ch1.1.1-B075:D","text":"不衝突；因模型已不需要任何驗證","explanation":"不正確。相容的理由是互補，並非免除驗證。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：模型提出互動需求後，可用組件研究補足作用方式，再回頭核對整體。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B076","topicId":"BIO-1.1.1-SYS","stem":"研究團隊說「我們用了電腦，所以一定是系統生物學」。下列哪項補充最能支持其分類？","correct":"BIO-B01-Ch1.1.1-B076:B","options":[{"id":"BIO-B01-Ch1.1.1-B076:A","text":"電腦只統計有多少種成分名稱","explanation":"不正確。成分數量不能代替組織互動研究。"},{"id":"BIO-B01-Ch1.1.1-B076:B","text":"模型實際分析生物組件互動及整體動態","explanation":"正確。分析關係及整體動態才是內容層面的證據。"},{"id":"BIO-B01-Ch1.1.1-B076:C","text":"電腦把所有成分依名稱排序","explanation":"不正確。名稱排序不等於生物互動分析。"},{"id":"BIO-B01-Ch1.1.1-B076:D","text":"電腦只顯示一張單成分的靜態影像","explanation":"不正確。單組件影像不自動包含系統關係。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：工具只是手段，必須查看研究是否真正處理組件間的作用。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B077","topicId":"BIO-1.1.1-SYS","stem":"系統生物學要補足單獨研究零件的不足，最主要補足哪個問題？","correct":"BIO-B01-Ch1.1.1-B077:C","options":[{"id":"BIO-B01-Ch1.1.1-B077:A","text":"只反覆測量同一隔離零件的質量","explanation":"不正確。單件質量再精準仍未直接解釋協作。"},{"id":"BIO-B01-Ch1.1.1-B077:B","text":"只把每個成分逐一抽離而不研究組合","explanation":"不正確。只分離仍未檢查組合後的整體行為。"},{"id":"BIO-B01-Ch1.1.1-B077:C","text":"各部分如何共同形成整體行為","explanation":"正確。系統研究將各部分關係連到整體結果。"},{"id":"BIO-B01-Ch1.1.1-B077:D","text":"只核對各成分個別叫什麼名稱","explanation":"不正確。名稱是組件資料，未補互動關係。"}],"concept":"系統生物學分析組成部分之間的互動與動態變化，用來理解整體行為。系統可以是一個細胞、個體或生態系；研究尺度大並不是唯一判準。還原研究提供組件資訊，系統研究連接這些資訊；兩者互補。只有零件清單或多筆數據，尚不能取代互動關係的分析。\n本題判斷：不足指資訊範圍尚未完整，不表示所有零件資料錯誤。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第8頁／正式第10張（17_imagegen_page_10.png）；正文第9頁／正式第11張（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B078","topicId":"BIO-1.1.1-SF","stem":"兩片形狀不同的模型葉以相同光線照射：甲平展，乙折疊造成自我遮蔽；其餘條件相同。若問哪項最值得檢查，何者最合理？","correct":"BIO-B01-Ch1.1.1-B078:D","options":[{"id":"BIO-B01-Ch1.1.1-B078:A","text":"是否因葉名不同而自動成為不同層級","explanation":"不正確。命名不改變葉的器官層級。"},{"id":"BIO-B01-Ch1.1.1-B078:B","text":"折疊是否必然讓所有分子消失","explanation":"不正確。折疊不是分子消失的證據。"},{"id":"BIO-B01-Ch1.1.1-B078:C","text":"甲是否無需任何其他條件即可永遠光合作用","explanation":"不正確。受光有利不等於所有條件永遠滿足。"},{"id":"BIO-B01-Ch1.1.1-B078:D","text":"形狀差異是否改變有效受光面積","explanation":"正確。形狀及遮蔽能影響受光面積，是直接相關的功能線索。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：題面控制光線並給遮蔽差別，應連結形狀到有效受光，而非推定全部反應必變多少。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B079","topicId":"BIO-1.1.1-SF","stem":"研究者說「葉片寬扁有利受光，因此每一片寬扁葉在任何環境都具有相同光合作用速率」。主要推論問題是？","correct":"BIO-B01-Ch1.1.1-B079:A","options":[{"id":"BIO-B01-Ch1.1.1-B079:A","text":"把有利條件誇大為不受其他因素影響的充分保證","explanation":"正確。形狀有利不等於所有環境及系統條件均相同。"},{"id":"BIO-B01-Ch1.1.1-B079:B","text":"葉片寬扁與受光面積從來沒有關係","explanation":"不正確。寬扁確能提供受光方面的優勢。"},{"id":"BIO-B01-Ch1.1.1-B079:C","text":"植物器官不可能有構造功能關係","explanation":"不正確。植物同樣適用構造功能原則。"},{"id":"BIO-B01-Ch1.1.1-B079:D","text":"只要是葉片就不含任何細胞","explanation":"不正確。葉片由組織與細胞構成。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：前半為合理關聯，後半把「有利」擴為「任何環境相同」，超出已知。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B080","topicId":"BIO-1.1.1-SF","stem":"蜂鳥翅膀的肩部構造與旋轉能力、長細喙與伸入花中取蜜，應如何分別連結？","correct":"BIO-B01-Ch1.1.1-B080:B","options":[{"id":"BIO-B01-Ch1.1.1-B080:A","text":"只要翅膀能旋轉就可取代喙伸入花部","explanation":"不正確。飛行構造不能代替喙的取食接觸功能。"},{"id":"BIO-B01-Ch1.1.1-B080:B","text":"翅膀旋轉配合拍動支持懸停；長細喙有助伸入花部","explanation":"正確。兩種構造各有對應作用，能共同支持懸停取蜜。"},{"id":"BIO-B01-Ch1.1.1-B080:C","text":"翅膀旋轉主要使喙伸長；喙長主要讓翅膀旋轉","explanation":"不正確。題面給的對應是翅膀與飛行、喙與伸入花部，不是互相決定長度或旋轉。"},{"id":"BIO-B01-Ch1.1.1-B080:D","text":"只要喙長就不再需要翅膀的懸停功能","explanation":"不正確。長喙可協助接觸花部，但不代替翅膀支持懸停。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：分別找構造特徵對應的工作，再理解兩種構造可共同服務取食。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B081","topicId":"BIO-1.1.1-SF","stem":"某構造外形適合某功能，但尚未觀察其實際運作。最恰當的結論用語為何？","correct":"BIO-B01-Ch1.1.1-B081:C","options":[{"id":"BIO-B01-Ch1.1.1-B081:A","text":"有相似形狀就必為同一物種","explanation":"不正確。形狀相似不直接決定物種身分。"},{"id":"BIO-B01-Ch1.1.1-B081:B","text":"沒有運作資料就證明構造與功能毫無關係","explanation":"不正確。資料不足不等於已證明無關。"},{"id":"BIO-B01-Ch1.1.1-B081:C","text":"此構造提供功能線索，仍應核對作用及條件","explanation":"正確。構造可以提示功能，但線索不等於完整證明。"},{"id":"BIO-B01-Ch1.1.1-B081:D","text":"單看外形就能證明所有功能細節","explanation":"不正確。外形不能獨自證明全部因果細節。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：先保留可支持的推測，再要求實際功能對應，避免過度肯定或否定。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B082","topicId":"BIO-1.1.1-SF","stem":"葉片受光、葉肉細胞內葉綠體協作以及吸光分子各自有適當位置。這段描述最合理呈現什麼？","correct":"BIO-B01-Ch1.1.1-B082:D","options":[{"id":"BIO-B01-Ch1.1.1-B082:A","text":"只有器官層級有構造，分子沒有","explanation":"不正確。分子等較低層級也有結構。"},{"id":"BIO-B01-Ch1.1.1-B082:B","text":"只有單一分子能決定整株所有活動","explanation":"不正確。完整功能需要多部分協作，不能全歸一分子。"},{"id":"BIO-B01-Ch1.1.1-B082:C","text":"各層級必須互不影響才有功能","explanation":"不正確。各層級的作用可以互相支持。"},{"id":"BIO-B01-Ch1.1.1-B082:D","text":"不同層級的構造共同支持器官功能","explanation":"正確。由器官到細胞、胞器及分子可連結功能。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：把葉片形狀與內部組織化功能相連，可以建立跨層級的解釋。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B083","topicId":"BIO-1.1.1-SF","stem":"兩個模型由相同零件構成，但位置排列不同；甲能有效協作，乙不能。除了湧現外，此結果也支持哪個一般原則？","correct":"BIO-B01-Ch1.1.1-B083:A","options":[{"id":"BIO-B01-Ch1.1.1-B083:A","text":"構造中的位置與排列會影響功能","explanation":"正確。位置及排列是構造的一部分，可支持或限制功能。"},{"id":"BIO-B01-Ch1.1.1-B083:B","text":"只有分子種類重要，位置從不影響","explanation":"不正確。結果顯示相同零件仍可因排列有異。"},{"id":"BIO-B01-Ch1.1.1-B083:C","text":"形狀及排列只適用於名稱分類","explanation":"不正確。構造不只用於命名，也參與功能解釋。"},{"id":"BIO-B01-Ch1.1.1-B083:D","text":"功能一定與任何構造無關","explanation":"不正確。題述構造差異與功能差異有關。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：相同材料排除只靠成分清單的解釋，凸顯關係及配置。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B084","topicId":"BIO-1.1.1-SF","stem":"學生把葉片受光功能只記成「葉很綠」，漏掉葉片寬扁形狀。若要補足器官構造與受光的關聯，應補哪句？","correct":"BIO-B01-Ch1.1.1-B084:B","options":[{"id":"BIO-B01-Ch1.1.1-B084:A","text":"葉片越寬就必然成為另一物種","explanation":"不正確。葉寬不是物種轉變的充分條件。"},{"id":"BIO-B01-Ch1.1.1-B084:B","text":"寬而扁的形狀有助提供受光面積","explanation":"正確。形狀到受光面積形成清楚的功能鏈。"},{"id":"BIO-B01-Ch1.1.1-B084:C","text":"綠色保證沒有任何遮蔽","explanation":"不正確。顏色不能保證不受遮蔽。"},{"id":"BIO-B01-Ch1.1.1-B084:D","text":"器官形狀與受光完全無關","explanation":"不正確。形狀可能影響受光，不能完全否定。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：題目指定器官層級的形狀，因此應補面積關聯，而非只留色素資訊。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B085","topicId":"BIO-1.1.1-SF","stem":"某筆記寫「構造與功能相關＝只要知道功能，就能唯一畫出所有生物的外形」。最適當的修正為何？","correct":"BIO-B01-Ch1.1.1-B085:C","options":[{"id":"BIO-B01-Ch1.1.1-B085:A","text":"相關表示構造永遠不限制功能","explanation":"不正確。構造可支持或限制功能。"},{"id":"BIO-B01-Ch1.1.1-B085:B","text":"原句錯誤，因功能只能由名稱決定","explanation":"不正確。名稱只是標記，不能代替組成與作用。"},{"id":"BIO-B01-Ch1.1.1-B085:C","text":"相關提供線索，不代表同功能只有一種可能構造","explanation":"正確。多種配置可能支持類似工作，需對具體構造逐一核對。"},{"id":"BIO-B01-Ch1.1.1-B085:D","text":"原句正確，同功能必定外形完全相同","explanation":"不正確。同功能不保證所有細節或形狀相同。"}],"concept":"構造與功能在各生物層級相關：形狀、位置、組成及排列方式，會支持或限制特定功能。葉片寬扁有助受光；蜂鳥翅膀在肩部的旋轉配合拍動，有助懸停取食。解題要連結「哪個構造特徵」與「如何支持功能」，不能由單一外觀推定所有功能或無條件保證成效。\n本題判斷：一般關聯不等於一對一的唯一映射，不能由功能單獨推回全部外觀。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁／正式第12張（19_imagegen_page_12.png）；正文第11頁／正式第13張（20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B086","topicId":"BIO-1.1.1-CELL","stem":"甲為能自行完成基本生命活動的單細胞生物；乙是從多細胞生物分離、只執行部分工作的胞器。何者判斷正確？","correct":"BIO-B01-Ch1.1.1-B086:D","options":[{"id":"BIO-B01-Ch1.1.1-B086:A","text":"甲是組織；乙是族群","explanation":"不正確。甲不是細胞群，乙非同種個體集合。"},{"id":"BIO-B01-Ch1.1.1-B086:B","text":"甲只有一個細胞所以不算生物","explanation":"不正確。單細胞也能構成完整生命。"},{"id":"BIO-B01-Ch1.1.1-B086:C","text":"乙有部分功能所以必然也是完整個體","explanation":"不正確。部分功能不足以認定完整個體。"},{"id":"BIO-B01-Ch1.1.1-B086:D","text":"甲是一個細胞也是個體；乙不是完整生命單位","explanation":"正確。甲符合單細胞個體，乙只有部分工作能力。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：以完整基本生命活動及組織層級區分，不能只問有無任何功能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B087","topicId":"BIO-1.1.1-CELL","stem":"某種分化細胞仍在代謝並支持身體功能，但不再分裂。下列說法何者正確？","correct":"BIO-B01-Ch1.1.1-B087:A","options":[{"id":"BIO-B01-Ch1.1.1-B087:A","text":"不能僅因不分裂就否定它是細胞或生命活動的基本單位","explanation":"正確。細胞分工不要求每種分化細胞持續分裂。"},{"id":"BIO-B01-Ch1.1.1-B087:B","text":"凡不分裂者必為單一分子","explanation":"不正確。分裂狀態不決定分子或細胞層級。"},{"id":"BIO-B01-Ch1.1.1-B087:C","text":"凡是細胞都必須隨時能獨立繁殖","explanation":"不正確。不是所有分化細胞都可持續分裂或獨立繁殖。"},{"id":"BIO-B01-Ch1.1.1-B087:D","text":"它必定能獨立長成另一個完整人","explanation":"不正確。題面未提供個體再生能力，不能推論。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：題面證實其仍執行細胞功能；不分裂不會自動取消細胞身分。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B088","topicId":"BIO-1.1.1-CELL","stem":"多細胞生物的某些細胞負責一種工作，另一些細胞提供不同支持。這與「細胞是基本單位」如何相容？","correct":"BIO-B01-Ch1.1.1-B088:B","options":[{"id":"BIO-B01-Ch1.1.1-B088:A","text":"分工使每個細胞都變成一個群集","explanation":"不正確。細胞不是多物種族群集合。"},{"id":"BIO-B01-Ch1.1.1-B088:B","text":"不同基本單位可分工合作，共同形成個體功能","explanation":"正確。基本單位不排除專門化及相互依賴。"},{"id":"BIO-B01-Ch1.1.1-B088:C","text":"每個基本單位必須完全不依賴其他細胞","explanation":"不正確。多細胞生物細胞常相互支持。"},{"id":"BIO-B01-Ch1.1.1-B088:D","text":"只要有分工就表示細胞不再有生命活動","explanation":"不正確。分工仍建立在細胞的活動上。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：基本單位描述生命結構與活動的基礎，並不要求每細胞包辦全部身體功能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B089","topicId":"BIO-1.1.1-CELL","stem":"研究發現某胞器可執行特定工作，但要在細胞其他部分支持下才能長期運作。這最符合哪項理解？","correct":"BIO-B01-Ch1.1.1-B089:C","options":[{"id":"BIO-B01-Ch1.1.1-B089:A","text":"細胞不需要整合任何部分","explanation":"不正確。細胞的基本活動涉及各部分整合。"},{"id":"BIO-B01-Ch1.1.1-B089:B","text":"所有分子都能取代完整細胞","explanation":"不正確。單分子無法包辦所有基本生命活動。"},{"id":"BIO-B01-Ch1.1.1-B089:C","text":"胞器是細胞的功能組件，而非獨立完整生命單位","explanation":"正確。依賴完整細胞支援符合胞器的組件角色。"},{"id":"BIO-B01-Ch1.1.1-B089:D","text":"胞器只要有工作就必然是生物個體","explanation":"不正確。有功能不是完整生命的充分條件。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：題面分開部分功能和長期整合支援，兩者支持胞器的層級定位。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B090","topicId":"BIO-1.1.1-CELL","stem":"從一個單細胞生物中分離出DNA後，DNA仍可被檢測。這能否證明DNA本身就是該完整生物？","correct":"BIO-B01-Ch1.1.1-B090:D","options":[{"id":"BIO-B01-Ch1.1.1-B090:A","text":"能；只要含DNA就能獨立完成全部生命活動","explanation":"不正確。有DNA不是完整生命的充分條件。"},{"id":"BIO-B01-Ch1.1.1-B090:B","text":"能；分離會讓DNA自動變成細胞","explanation":"不正確。位置分離不自動建立完整細胞結構。"},{"id":"BIO-B01-Ch1.1.1-B090:C","text":"不能；因DNA不是生物體的任何組成部分","explanation":"不正確。DNA確是生物的組成，只是不等於整個生物。"},{"id":"BIO-B01-Ch1.1.1-B090:D","text":"不能；含遺傳物質不等於具完整細胞的生命活動","explanation":"正確。DNA是重要分子，但不是整個細胞及全部活動。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：檢測證明分子存在，沒有證明生命系統完整性。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B091","topicId":"BIO-1.1.1-CELL","stem":"「一個細胞」和「一個個體」有時可以指同一對象。哪項條件最支持這種情況？","correct":"BIO-B01-Ch1.1.1-B091:A","options":[{"id":"BIO-B01-Ch1.1.1-B091:A","text":"對象是一個能完成自身生命活動的單細胞生物","explanation":"正確。單細胞生物的細胞就是整個個體。"},{"id":"BIO-B01-Ch1.1.1-B091:B","text":"對象是一個被分離的細胞核","explanation":"不正確。核是胞器，不是完整單細胞生物。"},{"id":"BIO-B01-Ch1.1.1-B091:C","text":"對象是某人的單一指甲碎片","explanation":"不正確。碎片不等於獨立完整生物。"},{"id":"BIO-B01-Ch1.1.1-B091:D","text":"對象是同區域所有同種植物","explanation":"不正確。該集合是族群，而非單個細胞個體。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：單細胞生物提供細胞與個體尺度重合的明確案例。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B092","topicId":"BIO-1.1.1-CELL","stem":"某生物只有細胞層級，未形成組織與器官。若它能完成維持生命所需活動，應如何看待？","correct":"BIO-B01-Ch1.1.1-B092:B","options":[{"id":"BIO-B01-Ch1.1.1-B092:A","text":"一定是一個由多物種組成的群集","explanation":"不正確。未提供多物種集合，而是單一生物。"},{"id":"BIO-B01-Ch1.1.1-B092:B","text":"可為單細胞生物，不必先有器官才算生命","explanation":"正確。單細胞生物可不經多細胞組織器官層級。"},{"id":"BIO-B01-Ch1.1.1-B092:C","text":"必須否定其生命身分，因所有生物都有器官","explanation":"不正確。並非所有生物都具組織器官。"},{"id":"BIO-B01-Ch1.1.1-B092:D","text":"應稱為一種非生物胞器","explanation":"不正確。完整細胞生命活動不同於胞器特定工作。"}],"concept":"細胞是能進行維持生命所需基本活動的最低組織層級。單細胞生物由一個細胞完成整體生命活動；多細胞生物的分化細胞則分工合作。胞器可執行特定工作，但不是獨立完整生命單位。細胞是基本單位，也不代表每種分化細胞都能獨立生存或持續分裂。\n本題判斷：不能把多細胞生物的組成階梯當所有生命必備清單。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5–6 頁（PDF 54–55 頁）｜本節筆記 正文第2頁／正式第4張（11_imagegen_page_04.png）；正文第12頁／正式第14張（21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B093","topicId":"BIO-1.1.1-TYPE","stem":"甲細胞具膜包圍的細胞核及其他膜狀胞器；乙有DNA但無膜包圍的核及這些胞器。最合理分類為何？","correct":"BIO-B01-Ch1.1.1-B093:C","options":[{"id":"BIO-B01-Ch1.1.1-B093:A","text":"甲乙都因有DNA而是真核","explanation":"不正確。原核也有DNA，不能用DNA存在判真核。"},{"id":"BIO-B01-Ch1.1.1-B093:B","text":"甲乙都因是單細胞而是原核","explanation":"不正確。單細胞形態未必原核，且題面未限制個體細胞數。"},{"id":"BIO-B01-Ch1.1.1-B093:C","text":"甲真核、乙原核","explanation":"正確。核膜與膜狀胞器構造符合兩類細胞的典型差異。"},{"id":"BIO-B01-Ch1.1.1-B093:D","text":"甲原核、乙真核","explanation":"不正確。兩者構造特徵被倒置。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：逐一核對膜包圍的核及膜狀胞器，不用DNA有無代替。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B094","topicId":"BIO-1.1.1-TYPE","stem":"顯微觀察證實某細胞有膜包圍的細胞核。另一學生因它只有一個細胞構成個體而判原核。何者評估正確？","correct":"BIO-B01-Ch1.1.1-B094:D","options":[{"id":"BIO-B01-Ch1.1.1-B094:A","text":"單細胞必定原核，核構造證據可忽略","explanation":"不正確。生活方式不能推翻明確核構造。"},{"id":"BIO-B01-Ch1.1.1-B094:B","text":"只要是個體就不可能屬細胞層級","explanation":"不正確。單細胞生物兩種尺度可重合。"},{"id":"BIO-B01-Ch1.1.1-B094:C","text":"細胞核會讓這個對象變成器官","explanation":"不正確。核是胞器，不使整個細胞成為器官。"},{"id":"BIO-B01-Ch1.1.1-B094:D","text":"應採核構造證據判為真核；單細胞不等於原核","explanation":"正確。真核亦可有單細胞生物；有膜包圍核是關鍵證據。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：分類依典型內部構造，細胞數量本身不足以區分原核真核。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B095","topicId":"BIO-1.1.1-TYPE","stem":"甲細胞DNA位於無核膜包圍的核區。下列哪句詮釋最精確？","correct":"BIO-B01-Ch1.1.1-B095:A","options":[{"id":"BIO-B01-Ch1.1.1-B095:A","text":"甲有遺傳物質，但沒有真核型細胞核","explanation":"正確。核區是原核DNA所在區域，與膜包圍核不同。"},{"id":"BIO-B01-Ch1.1.1-B095:B","text":"甲沒有DNA，因沒有核膜","explanation":"不正確。題面明說有DNA。"},{"id":"BIO-B01-Ch1.1.1-B095:C","text":"核區一定是有核膜的另一名稱","explanation":"不正確。核區的關鍵是無核膜，不能當同義。"},{"id":"BIO-B01-Ch1.1.1-B095:D","text":"有DNA就足以證明甲有葉綠體","explanation":"不正確。DNA存在不證明葉綠體存在。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區
