true},{"id":"BIO-B01-Ch1.1.3-B052","topicId":"BIO-1.1.3-FLOW","stem":"封閉物質交換的透明容器持續接受光並向外散熱。即使成分可以在內部反覆使用，哪個判斷仍正確？","correct":"BIO-B01-Ch1.1.3-B052:C","options":[{"id":"BIO-B01-Ch1.1.3-B052:A","text":"因密閉，任何能量都沒有進出","explanation":"題面明列光入與熱出，不能以密閉否定。"},{"id":"BIO-B01-Ch1.1.3-B052:B","text":"光與熱進出表示物質一定全數消失","explanation":"光熱交換不意味原子被消滅，不能混淆。"},{"id":"BIO-B01-Ch1.1.3-B052:C","text":"物質交換與能量交換是不同邊界條件","explanation":"正確區分兩類交換，兩組條件可以同時成立。"},{"id":"BIO-B01-Ch1.1.3-B052:D","text":"只要接受光，便完全不需要物質原料","explanation":"原料仍需在內部存在並再利用，能源不能替代。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n「物質不交換」不等於「能量不交換」。透明容器可有光能進入，熱也可離開；這些資料不違反題設密閉物質的條件。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B053","topicId":"BIO-1.1.3-FLOW","stem":"某系統開始有 24 單位可用化學能，每日固定淨減少 6 單位；無新輸入且每日需求相同。此假設下可支持幾天完整需求？","correct":"BIO-B01-Ch1.1.3-B053:D","options":[{"id":"BIO-B01-Ch1.1.3-B053:A","text":"2天","explanation":"2天只用12單位，尚有12可繼續支持。"},{"id":"BIO-B01-Ch1.1.3-B053:B","text":"3天","explanation":"3天用18單位，尚有6可支持一天。"},{"id":"BIO-B01-Ch1.1.3-B053:C","text":"6天","explanation":"6天需36單位，超過初始24且沒有補充。"},{"id":"BIO-B01-Ch1.1.3-B053:D","text":"4天","explanation":"4天需求恰為24單位，符合限定模型。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n模型只作存量與每日淨需求比較：24÷6＝4天。物質若能回收也不會改變題設沒有新能量輸入的條件，不能外推出永續供能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B054","topicId":"BIO-1.1.3-FLOW","stem":"某學生認為食物網具有多條分支，便不能再說能量通常單向流過生態系。最恰當的修正是？","correct":"BIO-B01-Ch1.1.3-B054:A","options":[{"id":"BIO-B01-Ch1.1.3-B054:A","text":"分支描述多條傳遞路徑，仍可有共同的能量輸入與散熱流出","explanation":"同時保留食物網分支和整體能量流入流出的意義。"},{"id":"BIO-B01-Ch1.1.3-B054:B","text":"只要有兩條食物路徑，就能完整回收能量","explanation":"路徑增加不能讓散熱完整回收，兩者沒有此因果。"},{"id":"BIO-B01-Ch1.1.3-B054:C","text":"單向表示只能有一種消費者","explanation":"多種消費者可共享或分流食物，不違反單向。"},{"id":"BIO-B01-Ch1.1.3-B054:D","text":"有分解者便不再有任何能量出口","explanation":"分解者自身也會散熱，不能取消能量出口。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n單向流動不是幾何上只畫一條直線，而是能量逐步轉換後散熱，沒有完整回到可用食物能量的閉合循環。多條路徑不會改變這個整體限制。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B055","topicId":"BIO-1.1.3-FLOW","stem":"在無新能源輸入的模型中，動物改吃尚未分解的落葉有機物而暫時繼續活動。這是否證明能量已完整循環？","correct":"BIO-B01-Ch1.1.3-B055:B","options":[{"id":"BIO-B01-Ch1.1.3-B055:A","text":"是，凡重新吃到有機物都叫完整能量循環","explanation":"再利用材料中剩餘能量不同於把已散熱完整還原。"},{"id":"BIO-B01-Ch1.1.3-B055:B","text":"否，動物只是利用仍存於材料中的化學能","explanation":"題設正是用剩餘化學能支持，不能作為完整循環證據。"},{"id":"BIO-B01-Ch1.1.3-B055:C","text":"是，只要物質沒有離開，能量就是原樣","explanation":"物質所在位置不決定其中能量形式和可用性原樣保留。"},{"id":"BIO-B01-Ch1.1.3-B055:D","text":"否，因為落葉不可能仍含化學能","explanation":"落葉可保有化學能，因此不能用否認庫存作反駁。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n殘留有機物是尚未完全利用的庫存，不是已散熱再生。改用存量只能延長支持時間，不能證明沒有能量流失的閉合循環。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B056","topicId":"BIO-1.1.3-FLOW","stem":"能量模型中一份食物初有 100 單位化學能。第一階段散熱30，第二階段再散熱20，剩餘都留在有機物中且無其他去向。餘量為何？","correct":"BIO-B01-Ch1.1.3-B056:C","options":[{"id":"BIO-B01-Ch1.1.3-B056:A","text":"20單位","explanation":"20只是第二階段的熱量，不是剩餘量。"},{"id":"BIO-B01-Ch1.1.3-B056:B","text":"30單位","explanation":"30是第一階段散熱量，仍須核算兩段後存量。"},{"id":"BIO-B01-Ch1.1.3-B056:C","text":"50單位","explanation":"兩次共散熱50，100減50仍有50留在有機物。"},{"id":"BIO-B01-Ch1.1.3-B056:D","text":"150單位","explanation":"把熱輸出加回存量會重複計算，不能得150。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n每次散熱都是從原有能量中的一部分流出，因此剩餘＝100−30−20＝50單位。數值是給定模型，並非固定營養階層傳遞效率。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B057","topicId":"BIO-1.1.3-FLOW","stem":"甲說「環境中仍能測到生物散出的熱」，乙說「這表示同一生態系可把全部熱直接再製成食物」。何者最準確？","correct":"BIO-B01-Ch1.1.3-B057:D","options":[{"id":"BIO-B01-Ch1.1.3-B057:A","text":"甲乙都由能量守恆必然成立","explanation":"守恆處理總量，不能單獨保證完全再利用。"},{"id":"BIO-B01-Ch1.1.3-B057:B","text":"甲錯，熱一散出就不存在","explanation":"熱可傳到環境並被測量，不因離體就不存在。"},{"id":"BIO-B01-Ch1.1.3-B057:C","text":"乙對，熱與糖具有完全相同的可用性","explanation":"熱與食物化學能不是可無條件互換的同等來源。"},{"id":"BIO-B01-Ch1.1.3-B057:D","text":"甲可成立，但乙把能量仍存在誤當成可完全回收利用","explanation":"分清存在和生物完整回收能力，正確限制推論。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n能量未被消滅不表示其形式始終同等可用。散熱可留在環境中被量到，卻不能由此直接推出完整回收成食物化學能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B058","topicId":"BIO-1.1.3-FLOW","stem":"一段觀察中，生態系接受 70 單位能量，期末儲存比期初多10單位，除此只有熱輸出。此模型的熱輸出應是多少？","correct":"BIO-B01-Ch1.1.3-B058:A","options":[{"id":"BIO-B01-Ch1.1.3-B058:A","text":"60單位","explanation":"70輸入中有10留存，剩60以熱離開。"},{"id":"BIO-B01-Ch1.1.3-B058:B","text":"70單位","explanation":"70全散熱會無法留下題設10單位增量。"},{"id":"BIO-B01-Ch1.1.3-B058:C","text":"80單位","explanation":"80把留存增加錯加成輸出，去向大於輸入。"},{"id":"BIO-B01-Ch1.1.3-B058:D","text":"10單位","explanation":"10是儲存增加，不是熱輸出。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n輸入＝存量增加＋輸出，因此熱＝70−10＝60單位。要用存量「增加量」而不是誤當期末全部存量，題面已給出這個邊界。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B059","topicId":"BIO-1.1.3-FLOW","stem":"若某模型的能量來源只有光，研究者欲描述取消光照後的影響，哪一句最符合本節且不超出已知？","correct":"BIO-B01-Ch1.1.3-B059:B","options":[{"id":"BIO-B01-Ch1.1.3-B059:A","text":"所有原子立刻停止循環並消失","explanation":"關燈不使原子消失，物質也可能暫時繼續轉移。"},{"id":"BIO-B01-Ch1.1.3-B059:B","text":"新的光能輸入停止，既有化學能可被使用至受限","explanation":"保留確定的輸入中斷及庫存可能延續，推論合宜。"},{"id":"BIO-B01-Ch1.1.3-B059:C","text":"有分解者就保證不受任何影響","explanation":"分解者利用既有化學能，不提供無限新能量。"},{"id":"BIO-B01-Ch1.1.3-B059:D","text":"每個個體的死亡時間可由關燈時刻直接算出","explanation":"沒有存量與需求資料，不能確定每個個體的時間。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n可用庫存和消耗速率沒有給出，所以不能算個體停止或死亡時間；但新光能入口停止與未來供能受限是題設可支持的方向。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B060","topicId":"BIO-1.1.3-FLOW","stem":"某人用「分解者存在」來反駁生態系需要持續供能。下列哪組資訊最能回應？","correct":"BIO-B01-Ch1.1.3-B060:C","options":[{"id":"BIO-B01-Ch1.1.3-B060:A","text":"分解者使所有能量變成新原子，所以無需供能","explanation":"把能量與原子混同，且回收不等於憑空產生。"},{"id":"BIO-B01-Ch1.1.3-B060:B","text":"分解者只在完全沒有物質時作用","explanation":"沒有有機材料就缺少本題典型分解的基質。"},{"id":"BIO-B01-Ch1.1.3-B060:C","text":"分解者回收化學成分，但自身也用能並散熱","explanation":"分解者同時參與循環與能量流出，正好回應該誤解。"},{"id":"BIO-B01-Ch1.1.3-B060:D","text":"分解者不屬生命，所以可不遵守能量轉換","explanation":"分解者是生物，有細胞活動和能量需求。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n回收成分可支持物質再利用，而分解者進行工作仍消耗可用化學能並散熱。指出這兩面，才能說明它不能消除系統的供能需求。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B061","topicId":"BIO-1.1.3-MATTER","stem":"某碳原子先出現在環境原料，後進入植物分子，再進入動物組織。若要確認它曾完成「返回環境後再被植物利用」的路徑，還需要哪項觀察？","correct":"BIO-B01-Ch1.1.3-B061:D","options":[{"id":"BIO-B01-Ch1.1.3-B061:A","text":"該原子曾位於綠色葉片","explanation":"葉片是已有的植物階段，沒有補上返回與再吸收。"},{"id":"BIO-B01-Ch1.1.3-B061:B","text":"該原子所在動物有散熱","explanation":"散熱屬能量，不足以定位碳原子回收路徑。"},{"id":"BIO-B01-Ch1.1.3-B061:C","text":"該原子曾被計入食物質量","explanation":"食物質量不能證明特定原子已返回並再吸收。"},{"id":"BIO-B01-Ch1.1.3-B061:D","text":"該原子回到環境後又被植物吸收","explanation":"直接補足環境返回與再利用兩個必要環節。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n前三站只證明單段傳遞。題目明定要檢查返回及再利用，證據必須補齊這兩站；不必假設同一分子始終保持原樣。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B062","topicId":"BIO-1.1.3-MATTER","stem":"學生說「落葉看不見了，表示其中所有原子都消失」。以下哪項證據最能直接反駁？","correct":"BIO-B01-Ch1.1.3-B062:A","options":[{"id":"BIO-B01-Ch1.1.3-B062:A","text":"能在分解後的土壤、水或空氣找到原落葉的部分成分","explanation":"找到原成分的其他去向，直接否定全部原子消失。"},{"id":"BIO-B01-Ch1.1.3-B062:B","text":"原落葉的顏色曾經是綠色","explanation":"原顏色不能追蹤分解後的物質位置。"},{"id":"BIO-B01-Ch1.1.3-B062:C","text":"曾經有陽光照到落葉","explanation":"照光是能源條件，不直接提供原子後續去向證據。"},{"id":"BIO-B01-Ch1.1.3-B062:D","text":"落葉附近的動物可以移動","explanation":"動物能否移動與落葉成分是否仍存在無直接關聯。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n外形消失只表示原組織不再完整存在。若成分仍可在其他位置被辨認，就支持物質轉移或轉換，而非原子全部消失。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B063","topicId":"BIO-1.1.3-MATTER","stem":"模型中環境原有 40 份可吸收成分，植物吸收12份，分解作用返還7份，沒有其他進出。期末環境中有多少份？","correct":"BIO-B01-Ch1.1.3-B063:B","options":[{"id":"BIO-B01-Ch1.1.3-B063:A","text":"21份","explanation":"同時扣12與7，把返還誤算為流出。"},{"id":"BIO-B01-Ch1.1.3-B063:B","text":"35份","explanation":"依環境的流出和流入方向計算，得到35。"},{"id":"BIO-B01-Ch1.1.3-B063:C","text":"45份","explanation":"把吸收與返還的方向顛倒，誤為40＋12−7。"},{"id":"BIO-B01-Ch1.1.3-B063:D","text":"59份","explanation":"把兩者全加上，沒有扣除植物移出的12份。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n以環境為帳本：期末＝期初−被植物吸收＋分解返還＝40−12＋7＝35份。離開環境進植物是扣除，返回環境則是增加。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B064","topicId":"BIO-1.1.3-MATTER","stem":"某原子從植物有機物經分解後，成為環境中另一種分子的成分，再被新植物吸收。這與物質循環的關係是？","correct":"BIO-B01-Ch1.1.3-B064:C","options":[{"id":"BIO-B01-Ch1.1.3-B064:A","text":"不相容，因循環要求原分子完全不變","explanation":"原分子可以分解和重組，循環不要求不變。"},{"id":"BIO-B01-Ch1.1.3-B064:B","text":"不相容，因原子只可使用一次","explanation":"原子可重新被利用，不是使用一次即消失。"},{"id":"BIO-B01-Ch1.1.3-B064:C","text":"相容，循環可伴隨分子改變與成分重組","explanation":"與題設每一步相符，且保留原子和分子的差別。"},{"id":"BIO-B01-Ch1.1.3-B064:D","text":"只能證明能量完整回收，不能說明物質","explanation":"原子路徑是物質證據，不是熱全部回收的證據。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n原子的重新組合是物質轉換；再次進入植物是再利用。兩者共同說明物質循環，並不要求舊分子的所有鍵結與結構保持原樣。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B065","topicId":"BIO-1.1.3-MATTER","stem":"一個小流域有落葉分解與植物再吸收，同時雨水會帶走部分成分。可以如何描述它的物質路徑？","correct":"BIO-B01-Ch1.1.3-B065:D","options":[{"id":"BIO-B01-Ch1.1.3-B065:A","text":"有物質被帶走就完全不能有任何循環","explanation":"部分外流不否定其他部分在內部再利用。"},{"id":"BIO-B01-Ch1.1.3-B065:B","text":"只要有循環，流域就必然沒有物質輸出","explanation":"循環不等於零輸出，題目已明示雨水外流。"},{"id":"BIO-B01-Ch1.1.3-B065:C","text":"所有輸出成分都是被消滅的原子","explanation":"成分被帶走是位置改變，不是原子消滅。"},{"id":"BIO-B01-Ch1.1.3-B065:D","text":"局部循環與物質輸出可以同時存在","explanation":"兩條路徑不矛盾，符合題面全部條件。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n物質循環描述再利用的路徑，不保證某個人為選定邊界永遠封閉。題面同時給回收和外流，應同時保留兩項事實。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B066","topicId":"BIO-1.1.3-MATTER","stem":"甲瓶封閉所有物質交換且完整測量所有內含成分；乙瓶可排出氣體，卻只量固體。若兩瓶固體質量都減少，哪個判斷較合理？","correct":"BIO-B01-Ch1.1.3-B066:B","options":[{"id":"BIO-B01-Ch1.1.3-B066:A","text":"兩瓶都可只由固體減少證明全部物質消失","explanation":"固體減少可能伴隨其他物質增加或輸出，不能說全部消失。"},{"id":"BIO-B01-Ch1.1.3-B066:B","text":"乙需計入排出的氣體，固體減少不能當作全部物質減少","explanation":"乙有明確氣體出口，若漏計就無法用固體代表全系統。"},{"id":"BIO-B01-Ch1.1.3-B066:C","text":"甲必有原子變成光而離開","explanation":"題面沒有原子變光證據，封閉物質也不允許自行假設流出。"},{"id":"BIO-B01-Ch1.1.3-B066:D","text":"乙的氣體不屬物質，所以無需計入","explanation":"氣體同樣由物質組成，需要納入物質帳。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n題目比較的是測量邊界。固體只是物質的一種存在形式，其他成分或氣體可能增加或輸出；完整物質帳須包含所有形式與進出。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B067","topicId":"BIO-1.1.3-MATTER","stem":"某循環模型的路徑是：環境成分被植物吸收、植物被動物吃、動物排出有機物、微生物分解、成分回到環境。哪一步使資源重新可供植物取得？","correct":"BIO-B01-Ch1.1.3-B067:A","options":[{"id":"BIO-B01-Ch1.1.3-B067:A","text":"分解後成分返回適合吸收的環境來源","explanation":"符合微生物分解後的返還功能，連接下一次吸收。"},{"id":"BIO-B01-Ch1.1.3-B067:B","text":"動物將全部能量改成原子","explanation":"能量不是形成原子的來源，不能如此閉合物質帳。"},{"id":"BIO-B01-Ch1.1.3-B067:C","text":"所有植物直接吞食完整動物","explanation":"題面植物吸收環境成分，並非直接吞食完整動物。"},{"id":"BIO-B01-Ch1.1.3-B067:D","text":"環境中的熱被完整恢復成原植物","explanation":"熱回收不是物質重新可吸收的機制。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n題設循環的閉合依賴原料返回環境並處於可被利用的狀態。能量散熱有另一條路徑，不能用它替代物質返回。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B068","topicId":"BIO-1.1.3-MATTER","stem":"同一成分由落葉回到土壤後，被另一株植物吸收。有人說「不是原來那株植物，所以不叫再利用」。哪個回應最恰當？","correct":"BIO-B01-Ch1.1.3-B068:C","options":[{"id":"BIO-B01-Ch1.1.3-B068:A","text":"必須是同一個體才算化學物質循環","explanation":"把循環錯誤限於同一個體，排除環境中的跨個體再利用。"},{"id":"BIO-B01-Ch1.1.3-B068:B","text":"必須是同一片葉子才算循環","explanation":"落葉分解後不需回到同一片葉子，條件過窄。"},{"id":"BIO-B01-Ch1.1.3-B068:C","text":"重點是化學成分重新進入生物利用，不限原個體","explanation":"抓住成分再利用的必要關係，而非不必要的個體身分。"},{"id":"BIO-B01-Ch1.1.3-B068:D","text":"換了植物就表示新增原子從無到有","explanation":"更換取得者只是轉移，不會使原子憑空新增。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n物質循環是跨生物與環境的成分路徑，不以回到原來個體為定義。不同個體甚至不同生物利用同一成分，仍可屬再利用。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B069","topicId":"BIO-1.1.3-MATTER","stem":"某物質帳記錄：期初總存量100份，外部輸入20份，外部輸出15份；內部植物吸收30份、分解返還30份。期末系統總存量多少？","correct":"BIO-B01-Ch1.1.3-B069:D","options":[{"id":"BIO-B01-Ch1.1.3-B069:A","text":"45份","explanation":"把內部轉移誤當大量外部損失，未按系統邊界計帳。"},{"id":"BIO-B01-Ch1.1.3-B069:B","text":"100份","explanation":"忽略外界淨輸入5份，不能維持100。"},{"id":"BIO-B01-Ch1.1.3-B069:C","text":"165份","explanation":"把內部轉移都當新增，再和輸入相加會重複計數。"},{"id":"BIO-B01-Ch1.1.3-B069:D","text":"105份","explanation":"期初加外部淨流入5份，內部循環不另改總量。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n對整個系統而言，內部吸收和返還不跨系統邊界，不改變總量。只算外界：100＋20−15＝105份；內部兩筆可用來看分配，不能再加減當外部量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B070","topicId":"BIO-1.1.3-MATTER","stem":"只觀察到「某成分由植物傳到動物」，能否斷言本次觀察已完整證明它完成物質循環？","correct":"BIO-B01-Ch1.1.3-B070:B","options":[{"id":"BIO-B01-Ch1.1.3-B070:A","text":"能，只要換過一個生物就算完整循環","explanation":"單次來源到取得者的傳遞仍未證明回收閉合。"},{"id":"BIO-B01-Ch1.1.3-B070:B","text":"不能，仍缺回到環境及再次被利用等後續證據","explanation":"精確指出觀察尚缺的環境返回與再利用階段。"},{"id":"BIO-B01-Ch1.1.3-B070:C","text":"不能，因動物體內不可能有植物來源成分","explanation":"取食可以讓植物成分進入動物，此反駁違反題設。"},{"id":"BIO-B01-Ch1.1.3-B070:D","text":"能，而且同時證明全部能量都已回收","explanation":"物質一段轉移既未證完整循環，也不能證能量完整回收。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n物質轉移是循環的一段，但完整的觀察結論應符合實際證據覆蓋。需要循環後續路徑才能說這個被追蹤成分已完成再利用。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B071","topicId":"BIO-1.1.3-DECOMPOSER","stem":"某土壤模型中，甲有活躍分解者，乙的分解者受到抑制且無替代；初始落葉量與其他條件相同。若乙落葉累積較多，最合適的解釋為何？","correct":"BIO-B01-Ch1.1.3-B071:A","options":[{"id":"BIO-B01-Ch1.1.3-B071:A","text":"甲的分解者較能將落葉物質轉回環境","explanation":"符合兩組唯一所述功能差異與落葉累積的方向。"},{"id":"BIO-B01-Ch1.1.3-B071:B","text":"乙已將全部能量完整循環","explanation":"落葉累積不能證明能量完整循環，兩者不同。"},{"id":"BIO-B01-Ch1.1.3-B071:C","text":"甲的落葉原子被消滅所以量少","explanation":"分解將成分返回環境，不讓原子無中生有消失。"},{"id":"BIO-B01-Ch1.1.3-B071:D","text":"乙沒有分解者就必定沒有任何物質","explanation":"乙仍有落葉和其他物質，缺分解者不等於物質歸零。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n題設控制起始條件並排除替代功能；分解受抑可使材料留存較久。較少可見落葉應解釋為成分去向改變，不是原子被消滅。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B072","topicId":"BIO-1.1.3-DECOMPOSER","stem":"某真菌分解落葉後產生新菌體，同時測到向周圍散熱。哪一說明可同時容納兩個觀察？","correct":"BIO-B01-Ch1.1.3-B072:D","options":[{"id":"BIO-B01-Ch1.1.3-B072:A","text":"真菌把全部原子轉成熱，再從光中取得新原子","explanation":"原子不在此過程全部變熱，新原子也不是由光供給。"},{"id":"BIO-B01-Ch1.1.3-B072:B","text":"菌體增加表示不曾使用能量","explanation":"生長和合成需要能量，菌體增加不等於零用能。"},{"id":"BIO-B01-Ch1.1.3-B072:C","text":"散熱表示沒有任何成分能成為菌體","explanation":"部分散熱與部分物質留存可同時存在，不矛盾。"},{"id":"BIO-B01-Ch1.1.3-B072:D","text":"真菌利用有機物的物質及化學能，部分用於自身組成與工作並散熱","explanation":"同時解釋菌體的物質來源與能量利用及熱輸出。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n分解者不是只把所有材料原樣排回環境；它也需生長和維持自身，因此可將部分物質納入菌體，並用化學能做功。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B073","topicId":"BIO-1.1.3-DECOMPOSER","stem":"把「分解者回收能量」改成精確句子時，何者最合適？","correct":"BIO-B01-Ch1.1.3-B073:B","options":[{"id":"BIO-B01-Ch1.1.3-B073:A","text":"分解者只回收體積，不涉及化學成分","explanation":"分解會改變物質形式並釋回成分，不只是體積變小。"},{"id":"BIO-B01-Ch1.1.3-B073:B","text":"分解者釋回物質，並利用有機物中的剩餘化學能、散熱","explanation":"保留物質回收、殘餘化學能利用與熱輸出三個必要面向。"},{"id":"BIO-B01-Ch1.1.3-B073:C","text":"分解者把所有熱完整轉成最初的光","explanation":"散熱不能被它完整轉回最初光能，這是錯誤循環。"},{"id":"BIO-B01-Ch1.1.3-B073:D","text":"分解者能把所有分子永遠保持原樣","explanation":"分解本來就可能改變分子，不要求永久原樣。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n錯誤語句混淆「仍在材料中的能量」和「已散出的能量」。分解者可以利用前者，但其物質回收功能不代表後者能完整再生。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B074","topicId":"BIO-1.1.3-DECOMPOSER","stem":"一份死亡植物材料在題設中仍含 16 單位化學能。分解者使用其中10單位，剩餘仍在未分解材料中；沒有其他能量進出。剩餘量與意義何者正確？","correct":"BIO-B01-Ch1.1.3-B074:C","options":[{"id":"BIO-B01-Ch1.1.3-B074:A","text":"26單位，因分解創造新能量","explanation":"把使用量加回原量會重複計算，不是新創造能量。"},{"id":"BIO-B01-Ch1.1.3-B074:B","text":"10單位，因剩餘等於已用量","explanation":"已使用10與未使用6是不同數量，不能互換。"},{"id":"BIO-B01-Ch1.1.3-B074:C","text":"6單位，表示材料仍保有未被使用的化學能","explanation":"扣除使用量後剩6，尚未使用不等於回收了散熱。"},{"id":"BIO-B01-Ch1.1.3-B074:D","text":"0單位，因死亡就不能含能量","explanation":"題目明定死亡材料仍含16，死亡不使化學能必然為零。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n剩餘化學能＝16−10＝6單位。死亡不代表已存在有機物的能量立刻全散失；使用部分與剩餘部分應分開。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B075","topicId":"BIO-1.1.3-DECOMPOSER","stem":"在一個模型中，分解者將遺體成分釋回環境，但植物未能再吸收該成分。下列哪個說法最精確？","correct":"BIO-B01-Ch1.1.3-B075:A","options":[{"id":"BIO-B01-Ch1.1.3-B075:A","text":"已觀察到返回環境，尚未觀察到完整再利用","explanation":"符合兩個階段的實際觀察，沒有抹去已做的分解回收。"},{"id":"BIO-B01-Ch1.1.3-B075:B","text":"分解者完全沒有參與物質轉移","explanation":"題面已明列成分釋回環境，這就是物質轉移。"},{"id":"BIO-B01-Ch1.1.3-B075:C","text":"只要回到環境就必定代表被同株植物全部吸收","explanation":"再次吸收並非必定全部或同株，且題面明說尚未吸收。"},{"id":"BIO-B01-Ch1.1.3-B075:D","text":"植物沒吸收，表示分解者回收的是熱而非物質","explanation":"是否再吸收不改變釋回對象是物質的事實。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n返回環境和再次被吸收是相鄰但不同的步驟。前一項已發生，後一項未發生，應分別紀錄而不把可能再利用寫成已完成。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B076","topicId":"BIO-1.1.3-DECOMPOSER","stem":"某模型將 25 份遺體物質分為分解者菌體5份、回到環境12份與未分解的其餘部分，無其他進出。未分解多少份？","correct":"BIO-B01-Ch1.1.3-B076:D","options":[{"id":"BIO-B01-Ch1.1.3-B076:A","text":"13份","explanation":"只扣環境12份，遺漏菌體5份，會多估未分解量。"},{"id":"BIO-B01-Ch1.1.3-B076:B","text":"17份","explanation":"17是菌體與返還兩部分的合計，不是餘量。"},{"id":"BIO-B01-Ch1.1.3-B076:C","text":"20份","explanation":"只扣菌體5份，漏掉環境已收到12份。"},{"id":"BIO-B01-Ch1.1.3-B076:D","text":"8份","explanation":"扣除已分配的17份，未分解材料仍有8份。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n原材料的物質有不同去向：25−5−12＝8份尚未分解。分解者自身菌體是物質的一個暫時去向，不能只算回到環境而漏掉它。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B077","topicId":"BIO-1.1.3-DECOMPOSER","stem":"一份資料寫「細菌分解有機廢物使成分返回水中」，另一份寫「某些細菌能光合製造有機物」。兩份資料的關係為何？","correct":"BIO-B01-Ch1.1.3-B077:B","options":[{"id":"BIO-B01-Ch1.1.3-B077:A","text":"必然矛盾，所有細菌只能是一種營養角色","explanation":"細菌可具多種營養方式，不應強制唯一角色。"},{"id":"BIO-B01-Ch1.1.3-B077:B","text":"可以相容，同一大類生物可含不同功能的成員","explanation":"區分生物類群與實際功能，兩項可以同時成立。"},{"id":"BIO-B01-Ch1.1.3-B077:C","text":"必然矛盾，分解者不可能是生物","explanation":"分解者是生物，有細胞及能量需求，不能否定其生命身分。"},{"id":"BIO-B01-Ch1.1.3-B077:D","text":"只有把回水成分改成光能才相容","explanation":"物質回水和光合都是可成立過程，不必錯改追蹤類別。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n細菌是類群名稱而不是固定營養功能。第一份限定執行分解的細菌，第二份限定有光合能力的細菌；不同成員的資料不必互相排斥。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B078","topicId":"BIO-1.1.3-DECOMPOSER","stem":"某實驗欲判斷分解是否讓落葉中的成分重返環境，最直接相關的量測為何？","correct":"BIO-B01-Ch1.1.3-B078:C","options":[{"id":"BIO-B01-Ch1.1.3-B078:A","text":"只量分解過程的熱輸出","explanation":"熱量屬能量帳，不能直接定位落葉成分的物質去向。"},{"id":"BIO-B01-Ch1.1.3-B078:B","text":"只量照到落葉的光強度","explanation":"光強度是能源條件，不能直接證明原料已返回。"},{"id":"BIO-B01-Ch1.1.3-B078:C","text":"追蹤落葉成分是否進入周圍土壤、水或空氣","explanation":"量到原成分的環境去向才直接對應問題。"},{"id":"BIO-B01-Ch1.1.3-B078:D","text":"只測分解者菌體增加多少","explanation":"菌體增加可表示利用材料，但未追蹤成分是否返回環境。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n題目欲驗證的是物質去向，所以量測必須連接原材料與環境中的成分。光照、熱輸出或菌體增加的量測可有其他用途，但不能單獨回答此假設的核心。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B079","topicId":"BIO-1.1.3-DECOMPOSER","stem":"分解者活動減少後，某可被植物吸收的成分仍有其他外部來源持續補入。能否直接斷定植物當下必完全缺乏該成分？","correct":"BIO-B01-Ch1.1.3-B079:D","options":[{"id":"BIO-B01-Ch1.1.3-B079:A","text":"能，因分解者是任何情況下唯一物質來源","explanation":"忽略明確給出的替代物質來源，推論過度。"},{"id":"BIO-B01-Ch1.1.3-B079:B","text":"能，外部成分不能被植物利用","explanation":"題面已說該成分可被植物吸收，不能任意否定。"},{"id":"BIO-B01-Ch1.1.3-B079:C","text":"不能，因分解者減少必使光照增強","explanation":"沒有分解減少使光增強的此種必要關係。"},{"id":"BIO-B01-Ch1.1.3-B079:D","text":"不能，還要計入既有存量與其他輸入","explanation":"完整考慮物質帳來源，才可判斷當下是否缺乏。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n分解返還是一條供應途徑；題面明列還有外部補給，不能把一條途徑減少推成總供應必為零。需看原有存量與各種輸入輸出。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B080","topicId":"BIO-1.1.3-DECOMPOSER","stem":"分解落葉時，環境得到部分可用原料與熱。哪一解讀最正確？","correct":"BIO-B01-Ch1.1.3-B080:A","options":[{"id":"BIO-B01-Ch1.1.3-B080:A","text":"原料可能再被吸收；熱流出不表示全部可恢復為食物能量","explanation":"區分原料回收和熱的可用性，符合兩種資源命運。"},{"id":"BIO-B01-Ch1.1.3-B080:B","text":"兩者都是同一種礦物質","explanation":"熱不是礦物質，有不同追蹤單位與意義。"},{"id":"BIO-B01-Ch1.1.3-B080:C","text":"既然都到環境，兩者的循環方式完全相同","explanation":"共同位置不表示形式與再利用方式相同。"},{"id":"BIO-B01-Ch1.1.3-B080:D","text":"兩者都必定永久不能被任何生物接觸","explanation":"部分原料正可被植物吸收，不能全稱永久不接觸。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n同樣到達環境的兩種輸出性質不同。原料屬於物質，可循吸收路徑；熱屬能量輸出，不能由共同目的地推成共同再利用能力。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B081","topicId":"BIO-1.1.3-CONTRAST","stem":"甲用原子標記追蹤葉片成分回到土壤再進新植物，乙量到生物活動時有熱離開。兩項結果應如何整合？","correct":"BIO-B01-Ch1.1.3-B081:B","options":[{"id":"BIO-B01-Ch1.1.3-B081:A","text":"兩者都證明能量完整循環","explanation":"甲追蹤原子、乙追蹤熱，都未支持全部能量回收。"},{"id":"BIO-B01-Ch1.1.3-B081:B","text":"甲支持物質再利用，乙支持能量向環境傳出","explanation":"各自依量測對象作結論，兩者相容且未過度推論。"},{"id":"BIO-B01-Ch1.1.3-B081:C","text":"甲證明原子變成熱，乙證明熱變回原子","explanation":"兩份資料沒有原子和熱互變的證據，不能合成此結論。"},{"id":"BIO-B01-Ch1.1.3-B081:D","text":"乙使甲的觀察不可能成立","explanation":"物質再利用可以伴隨能量散熱，乙不會推翻甲。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n兩種量測針對不同對象。原子位置變化可支持物質循環，熱量離開可支持能量流動；二者可以在同一生態系同時發生，不是互斥現象。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B082","topicId":"BIO-1.1.3-CONTRAST","stem":"某人把「植物吸收土壤礦物質」與「植物吸收光」都記成相同的能量輸入。最需要修正哪個區分？","correct":"BIO-B01-Ch1.1.3-B082:D","options":[{"id":"BIO-B01-Ch1.1.3-B082:A","text":"所有吸收都只能是物質","explanation":"吸收光是能源輸入，不能把所有吸收都當物質。"},{"id":"BIO-B01-Ch1.1.3-B082:B","text":"植物不能同時接收不同類型資源","explanation":"植物可以同時有能源與物質輸入，兩者不矛盾。"},{"id":"BIO-B01-Ch1.1.3-B082:C","text":"光能是物質原料，礦物質才是光源","explanation":"兩個角色被顛倒，礦物質不是本題的光源。"},{"id":"BIO-B01-Ch1.1.3-B082:D","text":"礦物成分供應物質，吸收光提供能量","explanation":"按實際對象區分能源與原料，修正分類錯誤。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n動詞相同不代表對象相同。吸收哪一種資源才是分類依據：光主要表能源，礦物成分表原料，兩者都重要但不能合帳。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B083","topicId":"BIO-1.1.3-CONTRAST","stem":"在同一模型中，追蹤到10份成分全部仍在容器內，卻有8能量單位的熱穿過容器壁離開。何者成立？","correct":"BIO-B01-Ch1.1.3-B083:A","options":[{"id":"BIO-B01-Ch1.1.3-B083:A","text":"物質留存與能量輸出可同時發生","explanation":"分別看物質與熱的邊界條件，兩個現象可並存。"},{"id":"BIO-B01-Ch1.1.3-B083:B","text":"10份物質必須減去8單位熱才得餘量","explanation":"物質份數與熱量維度不同，不能相減。"},{"id":"BIO-B01-Ch1.1.3-B083:C","text":"物質留存證明能量沒有離開","explanation":"題目已量到熱輸出，不能用物質留存否認。"},{"id":"BIO-B01-Ch1.1.3-B083:D","text":"熱離開證明所有原子都已離開","explanation":"熱穿壁不表示原子隨之全離開，兩者不同。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n份數和能量單位是不同量，不可相減。容器可阻擋物質交換而允許熱傳遞，所以兩個測量沒有矛盾。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B084","topicId":"BIO-1.1.3-CONTRAST","stem":"某題列四句：甲「能量通常單向流過生態系」、乙「物質可在生物與環境間再利用」、丙「分解者完全回收已散熱」、丁「生產者從無到有創造能量」。哪組正確？","correct":"BIO-B01-Ch1.1.3-B084:C","options":[{"id":"BIO-B01-Ch1.1.3-B084:A","text":"甲、丙","explanation":"甲正確，但丙誤稱完整回收散熱。"},{"id":"BIO-B01-Ch1.1.3-B084:B","text":"乙、丁","explanation":"乙正確，但丁誤稱生產者創造能量。"},{"id":"BIO-B01-Ch1.1.3-B084:C","text":"甲、乙","explanation":"甲乙分別正確描述能量與物質路徑，是唯一全對組合。"},{"id":"BIO-B01-Ch1.1.3-B084:D","text":"丙、丁","explanation":"丙丁都違反本節的能量轉換與散熱原則。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n逐句先分對象：甲描述能源進出，乙描述化學成分回收，皆符合本節。丙將原料回收誤當熱全回收，丁則混淆能量轉換與創造。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B085","topicId":"BIO-1.1.3-CONTRAST","stem":"食物中某些原子可經分解再次進入植物，先前因使用該食物而散出的熱也存在於環境。可以推出哪個結論？","correct":"BIO-B01-Ch1.1.3-B085:D","options":[{"id":"BIO-B01-Ch1.1.3-B085:A","text":"原子再利用使所有熱自動恢復成光","explanation":"原子重組不會自動把所有熱轉回光。"},{"id":"BIO-B01-Ch1.1.3-B085:B","text":"熱存在就證明同一份食物可無限次全能量使用","explanation":"能量存在不等於可無限完整做功或還原成食物。"},{"id":"BIO-B01-Ch1.1.3-B085:C","text":"原子必定保持原食物的完整分子形狀","explanation":"化學成分可經反應進入不同分子，不必保持原形。"},{"id":"BIO-B01-Ch1.1.3-B085:D","text":"原子回收與熱存在是不同事實，不能合推能量完整循環","explanation":"正確限制由物質與能量不同證據可作的結論。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n兩項事實各自成立，但需要額外機制才能聲稱完整恢復能量；本節說明通常不能直接完整回收散熱，故不可由共存推出循環。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B086","topicId":"BIO-1.1.3-CONTRAST","stem":"一張筆記將「二氧化碳、水、礦物質」列為能量形式，又把「光、化學能、熱」列為原料。應如何改正？","correct":"BIO-B01-Ch1.1.3-B086:B","options":[{"id":"BIO-B01-Ch1.1.3-B086:A","text":"只將水移到另一欄，其餘保持","explanation":"二氧化碳與礦物質也屬物質，不能只修水。"},{"id":"BIO-B01-Ch1.1.3-B086:B","text":"前一組是物質；後一組是能源或能量形式","explanation":"整體糾正兩欄的類別，分別列供料與供能。"},{"id":"BIO-B01-Ch1.1.3-B086:C","text":"只將熱改寫成分解者即可","explanation":"分解者是生物角色，不能拿來替代熱的能量類別。"},{"id":"BIO-B01-Ch1.1.3-B086:D","text":"兩組交換後仍都稱原料","explanation":"後組不是原料，不能把兩個不同類別都稱原料。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n分類應用對象性質而非是否與生命有關。化學物質有組成原子，可當原料；能量相關項目描述供能、儲存和流出，不直接供應身體原子。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B087","topicId":"BIO-1.1.3-CONTRAST","stem":"哪個情境最能同時顯示「物質再利用」與「能量沒有完整回收」？","correct":"BIO-B01-Ch1.1.3-B087:A","options":[{"id":"BIO-B01-Ch1.1.3-B087:A","text":"落葉成分經分解被新植物吸收，同時分解者向環境散熱","explanation":"同時給出再吸收與散熱，正好對應兩種路徑。"},{"id":"BIO-B01-Ch1.1.3-B087:B","text":"葉片只換了顏色，沒有其他量測","explanation":"顏色改變不足以證明成分回收或能量出口。"},{"id":"BIO-B01-Ch1.1.3-B087:C","text":"鳥只飛到另一棵樹，沒有記錄食物或熱","explanation":"移動可需能，但沒有回收與熱數據，未同時說明兩面。"},{"id":"BIO-B01-Ch1.1.3-B087:D","text":"只量到容器的體積不變","explanation":"體積淨變不反映具體成分與能量去向，證據不足。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n完整的對照要有兩種對象的證據。成分再次吸收對應物質，分解活動的熱輸出對應能量去向，兩條數據才構成有效比較。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B088","topicId":"BIO-1.1.3-CONTRAST","stem":"模型甲只記錄化學成分從土壤到植物再回土壤；模型乙只記錄能量從光到食物再散熱。把兩個模型比較時，何者正確？","correct":"BIO-B01-Ch1.1.3-B088:C","options":[{"id":"BIO-B01-Ch1.1.3-B088:A","text":"甲模型代表熱被完整恢復","explanation":"甲追蹤成分而非熱，不能解釋完整熱回收。"},{"id":"BIO-B01-Ch1.1.3-B088:B","text":"乙模型的食物只有能量沒有物質","explanation":"食物仍是物質，能量模型只是選擇強調其中化學能。"},{"id":"BIO-B01-Ch1.1.3-B088:C","text":"甲可描述成分的循環，乙可描述能量形式與流向","explanation":"對兩模型分別確定追蹤對象，比較準確。"},{"id":"BIO-B01-Ch1.1.3-B088:D","text":"兩模型的箭頭必須全部閉合才科學","explanation":"能量通常流出，不應強制畫成閉合圈。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n模型按目的省略資訊。甲選用物質角度，乙選用能量角度；食物本身仍同時帶有兩種資源，不因模型省略而不存在。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B089","topicId":"BIO-1.1.3-CONTRAST","stem":"生態系某期間物質總存量維持不變，但持續接受光並向外散熱。哪個敘述沒有超出觀察？","correct":"BIO-B01-Ch1.1.3-B089:D","options":[{"id":"BIO-B01-Ch1.1.3-B089:A","text":"沒有任何物質在系統內移動","explanation":"物質可在內部反覆轉移而總量不變，不能否定內部路徑。"},{"id":"BIO-B01-Ch1.1.3-B089:B","text":"生物完全不做功","explanation":"細胞工作可在物質淨量不變下持續。"},{"id":"BIO-B01-Ch1.1.3-B089:C","text":"光和熱的量必定都等於零","explanation":"題面已有光入與熱出，不能說皆零。"},{"id":"BIO-B01-Ch1.1.3-B089:D","text":"物質的淨存量不變，不排除內部循環或能量交換","explanation":"不把淨量不變擴大為無活動，符合資訊界線。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n淨存量不變只說明總量結果，不代表內部沒有轉換與移動。能量交換已在題面明示，兩種帳本應分別描述。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B090","topicId":"BIO-1.1.3-CONTRAST","stem":"若要辨認一個未知箭頭代表物質還是能量，最有用的補充標籤是哪項？","correct":"BIO-B01-Ch1.1.3-B090:B","options":[{"id":"BIO-B01-Ch1.1.3-B090:A","text":"箭頭是否穿過生物體的邊界","explanation":"物質與能量都可跨越生物體邊界，不能只靠是否穿越區分。"},{"id":"BIO-B01-Ch1.1.3-B090:B","text":"被追蹤的是化學成分、光能、化學能或熱","explanation":"追蹤對象直接決定其屬於物質或能量，是關鍵資訊。"},{"id":"BIO-B01-Ch1.1.3-B090:C","text":"箭頭是否朝向植物","explanation":"植物可接收光能及物質，單靠朝向植物無法區分。"},{"id":"BIO-B01-Ch1.1.3-B090:D","text":"箭頭是否畫成閉合圈","explanation":"圖可能畫錯，不能只憑閉合形狀推定對象，應先確認追蹤內容。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n同一生物可同時接收物質和能量，僅看箭頭方向、是否穿越邊界或是否閉合，都不如直接標明追蹤對象可靠。先知道資源性質，再判讀箭頭是否正確。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B091","topicId":"BIO-1.1.3-INTEGRATION","stem":"透明密閉容器內有光合藻類、吃藻動物及分解者，原料可循環；容器持續受光並散熱。對其維持方式，何者最恰當？","correct":"BIO-B01-Ch1.1.3-B091:C","options":[{"id":"BIO-B01-Ch1.1.3-B091:A","text":"三類角色完整，所以光是多餘的","explanation":"角色齊全不能取代必要能源，光提供輸入。"},{"id":"BIO-B01-Ch1.1.3-B091:B","text":"原料與能量都完全不進出，才能存活","explanation":"題面有光入熱出，這與封閉物質並不矛盾。"},{"id":"BIO-B01-Ch1.1.3-B091:C","text":"物質可在內部回收，外來光能仍支持能量需求","explanation":"同時保留物質內循環和能量交換，符合模型。"},{"id":"BIO-B01-Ch1.1.3-B091:D","text":"分解者只回收能量，藻類只回收熱","explanation":"角色和回收對象錯置，分解者釋回物質並散熱。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n題面分別指定物質邊界與能量交換。藻類引入光能，其他生物利用有機物，分解支持部分原料回收；這解釋系統結構，不保證它永遠穩定。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B092","topicId":"BIO-1.1.3-INTEGRATION","stem":"同一模型有30份可用原料、12能量單位；每次形成新結構需5份原料及3能量單位，無補充。哪項敘述正確？","correct":"BIO-B01-Ch1.1.3-B092:A","options":[{"id":"BIO-B01-Ch1.1.3-B092:A","text":"能源最多供4次；原料可供6次，所以最多形成4次","explanation":"兩類資源取較低上限，計算與條件都相符。"},{"id":"BIO-B01-Ch1.1.3-B092:B","text":"原料與能量相加為42，可形成42次","explanation":"不同單位資源不能相加當次數，也沒除每次需求。"},{"id":"BIO-B01-Ch1.1.3-B092:C","text":"原料可供6次，因此一定形成6次","explanation":"6次需18能量單位，超出只有12的存量。"},{"id":"BIO-B01-Ch1.1.3-B092:D","text":"兩者都可供10次，所以形成10次","explanation":"10次需50份原料和30能量單位，兩者均不夠。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n先分別核算：原料30÷5＝6次，能源12÷3＝4次。完成結構要兩者皆足夠，所以上限4次；剩餘原料不能補能源缺口。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B093","topicId":"BIO-1.1.3-INTEGRATION","stem":"某模型有20份原料及30能量單位，每次形成新結構需4份原料和3能量單位，無其他消耗。只增加能源而不增加原料，最多完成的次數能否超過5次？","correct":"BIO-B01-Ch1.1.3-B093:D","options":[{"id":"BIO-B01-Ch1.1.3-B093:A","text":"能，因能量可以變成所缺的全部原料","explanation":"本模型原料必須實際取得，能源不能代替所缺物質。"},{"id":"BIO-B01-Ch1.1.3-B093:B","text":"能，只要有分解者名稱就可無限形成","explanation":"題目未提供返還途徑，僅增加角色名稱不產生資源。"},{"id":"BIO-B01-Ch1.1.3-B093:C","text":"不能，因生物完全不能使用新增能源","explanation":"能源可支持其他工作，不能說完全不能使用。"},{"id":"BIO-B01-Ch1.1.3-B093:D","text":"不能，原料仍只足以形成5次","explanation":"原料上限不變，正確抓到題設的限制條件。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n原料上限20÷4＝5次，原能源可供30÷3＝10次，已不是先受限項。只增能源不改變原料上限，因此最多仍5次；這不代表新增能源永遠沒有其他用途。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B094","topicId":"BIO-1.1.3-INTEGRATION","stem":"一個小生態系的植物減少新有機物製造；動物與分解者仍可利用現有材料。若其他條件未明，最穩妥的推論是？","correct":"BIO-B01-Ch1.1.3-B094:B","options":[{"id":"BIO-B01-Ch1.1.3-B094:A","text":"動物與分解者的所有活動必立刻歸零","explanation":"已有材料明確仍可利用，不能斷言立刻全停。"},{"id":"BIO-B01-Ch1.1.3-B094:B","text":"新食物補充可能受限，但影響時間還與存量及使用速度有關","explanation":"兼顧新補充與既有存量，保留資料不足的時間限制。"},{"id":"BIO-B01-Ch1.1.3-B094:C","text":"分解者可不靠任何材料產生無限食物","explanation":"分解者本身需有機材料及能量，不能無限創造。"},{"id":"BIO-B01-Ch1.1.3-B094:D","text":"植物減少表示所有原子已消失","explanation":"原子可仍在其他物質或環境中，植物減少不等於消失。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n應分開流量與存量。新製造量降低影響補充，現有有機物可支持一段使用；題面沒有存量和速度數字，不應虛構立即停止或特定時間。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B095","topicId":"BIO-1.1.3-INTEGRATION","stem":"一份報告同時給出「有機物分解後部分成分被植物再吸收」與「活動中測得熱向外輸出」。下列結論哪項可由兩類證據共同支持？","correct":"BIO-B01-Ch1.1.3-B095:C","options":[{"id":"BIO-B01-Ch1.1.3-B095:A","text":"系統完全不需要外來能量","explanation":"已有熱輸出不支持永遠無需供能，不能據此下結論。"},{"id":"BIO-B01-Ch1.1.3-B095:B","text":"物質與能量必以同一比例循環","explanation":"題面無比例資料，且能量不是同式循環。"},{"id":"BIO-B01-Ch1.1.3-B095:C","text":"物質可回收利用，能量則有流出的去向","explanation":"準確連接每項量測與可支持的結論。"},{"id":"BIO-B01-Ch1.1.3-B095:D","text":"分解者只做供料工作而不使用化學能","explanation":"分解者也會利用化學能並散熱，不能只看供料。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n兩類證據各自支持不同路徑：再吸收給物質回收，熱輸出給能量流出。數據沒有給完整比例或外來輸入，不能自行添上零輸入或固定效率。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B096","topicId":"BIO-1.1.3-INTEGRATION","stem":"兩個封閉物質的培養模型都含相同原料與三類角色。甲有持續光照，乙無光且沒有其他能源；乙最初仍有可用有機物。何者最符合已知？","correct":"BIO-B01-Ch1.1.3-B096:A","options":[{"id":"BIO-B01-Ch1.1.3-B096:A","text":"甲有新光能輸入；乙可能暫用庫存但不能因此推成永續供能","explanation":"同時保留兩組能源條件差異和乙已有儲存事實。"},{"id":"BIO-B01-Ch1.1.3-B096:B","text":"甲不需要原料；乙才需要原料","explanation":"兩組都需要物質，光照不取消甲的原料需求。"},{"id":"BIO-B01-Ch1.1.3-B096:C","text":"乙的原料循環會自行產生與甲相同的光能","explanation":"物質循環不會自行恢復同量光能，不能替代能源。"},{"id":"BIO-B01-Ch1.1.3-B096:D","text":"乙在遮光瞬間所有分子都會消失","explanation":"分子不會因遮光瞬間全消失，題面還給出既有有機物。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n相同物質初始條件不能保證能源持續供應相同。甲有已知光入口；乙的庫存可維持部分活動，但沒有輸入就不能據此保證無限維持。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B097","topicId":"BIO-1.1.3-INTEGRATION","stem":"某模型一日有50能量單位輸入、5單位增加在化學能存量，其餘全散熱；同日有10份物質輸入、4份物質輸出。應記錄哪組結果？","correct":"BIO-B01-Ch1.1.3-B097:D","options":[{"id":"BIO-B01-Ch1.1.3-B097:A","text":"熱45單位；物質淨增14份","explanation":"熱量正確，但物質應輸入減輸出，不是兩者相加14。"},{"id":"BIO-B01-Ch1.1.3-B097:B","text":"熱55單位；物質淨增6份","explanation":"物質淨增正確，熱應扣留存5而不是加上。"},{"id":"BIO-B01-Ch1.1.3-B097:C","text":"熱5單位；物質淨增4份","explanation":"5是能量留存，4是物質輸出，皆非所求。"},{"id":"BIO-B01-Ch1.1.3-B097:D","text":"熱45單位；物質淨增6份","explanation":"兩本帳分別扣除題設去向，45與6皆正確。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n兩本帳獨立計算：熱＝50−5＝45能量單位；物質淨增＝10−4＝6份。能量單位不能和物質份數相加，也不能把總輸入與留存分項重複算。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B098","topicId":"BIO-1.1.3-INTEGRATION","stem":"題目只提供「池塘有藻類、動物與真菌」。若要據此畫出確切的資源傳遞圖，尚需什麼資訊？","correct":"BIO-B01-Ch1.1.3-B098:B","options":[{"id":"BIO-B01-Ch1.1.3-B098:A","text":"各生物的數量、體型及分布位置","explanation":"數量、體型及位置未給出實際營養功能與取食關係。"},{"id":"BIO-B01-Ch1.1.3-B098:B","text":"取能方式、取食與分解對象，以及箭頭定義","explanation":"功能、對象和方向是確定資源關係所需的題目資料。"},{"id":"BIO-B01-Ch1.1.3-B098:C","text":"池塘的水量、溫度及光照強度","explanation":"這些環境條件不能單獨決定誰取食誰或分解何種材料。"},{"id":"BIO-B01-Ch1.1.3-B098:D","text":"各生物的顏色、外形及繁殖次數","explanation":"外觀及繁殖次數不能替代實際取食、分解與資源流向資訊。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n大類名稱不足以確定每一條具體關係。要自足地畫圖，應給實際營養功能、取食和分解關係，另說明箭頭表示資源方向，避免靠原圖或印象補線。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B099","topicId":"BIO-1.1.3-INTEGRATION","stem":"某人只測得容器內生物總質量一天沒有改變，就宣稱「這一天沒有任何能量或物質轉換」。最有力的反駁是？","correct":"BIO-B01-Ch1.1.3-B099:C","options":[{"id":"BIO-B01-Ch1.1.3-B099:A","text":"總質量相同即代表光線沒有照入","explanation":"物質質量不說明有無光能輸入，兩者不同。"},{"id":"BIO-B01-Ch1.1.3-B099:B","text":"總質量不變時，所有分子都永久固定","explanation":"分子可改變與重組而總質量不變，不能推永遠固定。"},{"id":"BIO-B01-Ch1.1.3-B099:C","text":"淨質量不變仍可能同時發生合成、分解、物質轉移與散熱","explanation":"列出與淨質量不變相容的活動，足以反駁無任何轉換。"},{"id":"BIO-B01-Ch1.1.3-B099:D","text":"只要質量不變，所有細胞必停止工作","explanation":"細胞活動可以在淨量不變的系統發生，不能據此判停止。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n總質量是一項淨結果，無法單獨量出內部的交換速率或能量流入流出。相反方向的物質變化可相抵，細胞仍可做功和散熱，所以其斷言過度。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B100","topicId":"BIO-1.1.3-INTEGRATION","stem":"在限定的光合生態系模型中，哪組說明完整且相互一致？","correct":"BIO-B01-Ch1.1.3-B100:A","options":[{"id":"BIO-B01-Ch1.1.3-B100:A","text":"光合生物把光能轉成有機物化學能；取食可傳遞物質與化學能；分解返還成分且各類生物均會用能散熱","explanation":"三個角色與物質、能量路徑互相吻合，沒有無中生有或完整熱回收。"},{"id":"BIO-B01-Ch1.1.3-B100:B","text":"生產者創造能量；動物只拿能量不拿物質；分解者只清除體積","explanation":"生產者只轉能，食物也供物質，分解還參與物質回收，三處皆錯。"},{"id":"BIO-B01-Ch1.1.3-B100:C","text":"原料循環即表示所有能量完全回收；外來光永久不需要","explanation":"把物質回收推成能量全回收，忽略持續散熱與光輸入。"},{"id":"BIO-B01-Ch1.1.3-B100:D","text":"物質被利用即消失；食物中的化學能則永遠維持原樣","explanation":"物質成分可轉移再用，能量會轉換散熱，兩者命運被倒置。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n逐步檢查三個角色與兩種對象：光合連接外來能源與有機物，取食連接資源供給，分解連接物質回環境；全程都有生物自身的用能與散熱。這才是兼顧供能、供料的完整模型。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true}]},{"depth":"精讀","target":150,"questions let storage=null;try{storage=localStorage;}catch(e){}
let engine,schoolData;const engines=new Map();
try{schoolData=JSON.parse($('quiz-data').textContent);if(schoolData.schema!=='bio-quiz-schools/v1'||schoolData.baselineSchool!=='CMU')throw new Error('學校題庫格式不正確。');for(const school of schoolData.schools)engines.set(school.code,new QuizEngine(school.data,storage));if(engines.size!==3||!['CMU','TCU','ISU'].every(s=>engines.has(s)))throw new Error('學校資料不完整。');engine=engines.get('CMU');}catch(e){$('fatal-message').hidden=false;$('fatal-message').textContent=e.message;return;}
let selecting=true,panelMode=null,lastTrigger=null,drawing=false,resultTarget=0,resultFrame=0,resultTimer=0;
const panel=$('nav-panel'),dialog=$('nav-dialog'),motion=matchMedia('(prefers-reduced-motion:reduce)');
$('drawer-slot').append(panel);
const say=t=>{$('announcement').textContent=t;};
function attempt(fn){try{fn();}catch(e){$('runtime-message').hidden=false;$('runtime-message').textContent=e.message;say(e.message);}messages();}
function messages(){const text=engine.messages.join(' ');$('storage-message').textContent=text;$('storage-message').hidden=!text;}
function node(){return engine.node(engine.selected.id);}
function schoolName(){return schoolData.schools.find(s=>s.code===engine.school).name;}
function countLabel(n,bank){
 if(engine.school==='CMU')return bank.questions.length+'／'+bank.target+' 題';
 if(['WAITING_SOURCE','PENDING_COMPARISON'].includes(n.comparison.status))return '待比對';
 return bank.questions.length+' 題';
}
function changeSchool(code){
 const previous=engine.selected;engine=engines.get(code);
 if(!engine.restoreSelection())engine.select(previous&&engine.nodes.has(previous.id)?previous.id:engine.data.nodes[0].id,0);
 engine.write('bio-quiz:selected-school',code);$('school-select').value=code;
 selecting=true;stopResultMotion();closeCatalog();$('runtime-message').hidden=true;
 buildTree();render();say('已切換至'+schoolName()+'，作答紀錄分校保存。');
}
function textElement(tag,text,className){const e=document.createElement(tag);e.textContent=text;if(className)e.className=className;return e;}
function buildTree(){
 const tree=$('catalog-tree');tree.replaceChildren();const groups=new Map();
 for(const n of engine.data.nodes){let parent=tree,path='';for(const label of n.hierarchy){path+='\u001f'+label;if(!groups.has(path)){const d=document.createElement('details');d.append(textElement('summary',label));parent.append(d);groups.set(path,d);}parent=groups.get(path);}
  const button=textElement('button',n.title,'leaf');button.dataset.node=n.id;button.setAttribute('aria-pressed','false');button.append(textElement('small','路線深度：'+n.routeDepth));button.addEventListener('click',()=>attempt(()=>{engine.select(n.id,0);selecting=true;stopResultMotion();render();closeCatalog(false);$('selection-title').focus();say('已選擇'+n.title+'。');}));parent.append(button);
 }
}
function reflectPanel(){
 document.querySelectorAll('[data-panel]').forEach(b=>b.setAttribute('aria-expanded',String(panelMode===b.dataset.panel)));
 document.querySelectorAll('[data-drawer-mode]').forEach(b=>b.setAttribute('aria-pressed',String(panelMode===b.dataset.drawerMode)));
 $('catalog-view').hidden=panelMode!=='catalog';$('depth-view').hidden=panelMode!=='depth';$('panel-title').textContent=panelMode==='depth'?'測驗深度':'章節目錄';
}
function closeCatalog(restore=false){if(dialog.open)dialog.close();panelMode=null;panel.hidden=true;document.body.style.overflow='';reflectPanel();if(restore&&lastTrigger)lastTrigger.focus();}
function showPanel(mode,locate=false){
 panelMode=mode;lastTrigger=document.querySelector('[data-panel="'+mode+'"]');panel.hidden=false;reflectPanel();renderDepth();
 if(!dialog.open){dialog.showModal();document.body.style.overflow='hidden';}
 if(locate&&engine.selected){const leaf=[...document.querySelectorAll('.leaf')].find(b=>b.dataset.node===engine.selected.id);if(leaf){let ancestor=leaf.parentElement;while(ancestor){if(ancestor.tagName==='DETAILS')ancestor.open=true;ancestor=ancestor.parentElement;}leaf.focus({preventScroll:true});leaf.scrollIntoView({block:'nearest'});}}
}
function renderDepth(){
 const n=node(),d=engine.selected.d;$('depth-context').textContent=n.title+'｜路線深度：'+n.routeDepth;
 $('depth-choices').replaceChildren(...n.banks.map((bank,index)=>{
  const row=document.createElement('div');row.className='depth-choice';const button=textElement('button',bank.depth+' '+countLabel(n,bank),'ghost');button.dataset.depth=String(index);button.setAttribute('aria-pressed',String(index===d));
  button.addEventListener('click',()=>attempt(()=>{engine.select(n.id,index);selecting=true;stopResultMotion();render();closeCatalog();$('selection-title').focus();}));row.append(button);
  const reason=engine.reason(n.id,index);if(reason)row.append(textElement('p',reason,'small'));return row;
 }));
}
function renderSelection(){
 const n=node(),d=engine.selected.d,s=engine.current(),available=engine.available(n.id,d);$('selection-title').textContent=n.title;$('selection-context').textContent=schoolName()+'｜路線深度：'+n.routeDepth+'｜本次測驗深度：'+DEPTHS[d];
 $('selection-counts').textContent=n.banks.map(b=>b.depth+' '+countLabel(n,b)).join(' · ');
 $('resume-set').hidden=!s||!available;$('start-set').disabled=!available;$('start-set').textContent=s?'重新抽10題':'開始十題練習';
 $('selection-state').textContent=available?(s?'已有本組紀錄：'+engine.statistics(s).answered+'／10 題已答。':'從這個學校、章節與深度抽出十道不重複題目。'):engine.reason(n.id,d);
 $('selection-blocked-depth').textContent=engine.school==='CMU'?n.banks.filter((b,i)=>i>n.reviewedLevel).map(b=>b.depth+' '+countLabel(n,b)+'：超過已審深度，尚不可出題').join('；'):(available?(n.banks[d].questions.length<20?'本深度補充題少於20題；再練習時優先選未在前組出現的題，部分題目可能再次出現。':'只練習相對中國醫新增的考點。'):'');
}
function render(){
 const n=node(),s=engine.current();$('route-label').textContent='路線深度：'+n.routeDepth;
 document.querySelectorAll('.leaf').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.node===n.id)));renderDepth();renderSelection();
 $('selection-card').hidden=!selecting;$('quiz-card').hidden=selecting||!s;$('results-card').hidden=true;document.body.classList.remove('result-view');
 if(selecting||!s){messages();return;}
 const q=engine.question(s),chosen=s.answers[s.at],stats=engine.statistics(s),options=s.optionOrders[s.at].map(id=>q.options.find(o=>o.id===id));
 $('quiz-title').textContent=n.title;document.querySelector('#quiz-card .chapter').textContent=n.hierarchy.slice(-2).join(' / ');
 $('quiz-depth').textContent=schoolName()+' · '+DEPTHS[s.depth]+(s.redo?' · 本組重答':'');$('position').textContent='第 '+(s.at+1)+' / 10 題';$('answered').textContent='已答 '+stats.answered+' / 10';
 $('score').hidden=!stats.complete;$('score').textContent='答對 '+stats.correct+' / 10';$('question-no').textContent='第 '+String(s.at+1).padStart(2,'0')+' 題';$('question-title').textContent=q.stem;$('question-body').hidden=true;
 $('progress-fill').style.transform='scaleX('+(stats.answered/10)+')';document.querySelector('.progress').setAttribute('aria-valuenow',String(stats.answered));
 $('options').replaceChildren(...options.map((o,index)=>{
  const button=document.createElement('button');button.className='option';button.dataset.choice=o.id;button.disabled=chosen!==null;
  const letter=textElement('span','ABCD'[index],'letter'),copy=textElement('span',o.text,'option-copy');button.append(letter,copy);
  if(chosen!==null&&(o.id===chosen||o.id===q.correct)){const correct=o.id===q.correct;button.classList.add(correct?'correct':'incorrect');copy.append(textElement('span',correct?(chosen===q.correct?'你的選擇 · 正解':'正解'):'你的選擇 · 答錯','result-label'));}
  button.addEventListener('click',()=>attempt(()=>{if(engine.current().questions[engine.current().at]!==q.id)return;const change=engine.answer(o.id);if(!change.changed)return;render();if(engine.statistics().complete)showResults(true);else{$('answer-heading').focus({preventScroll:true});say(o.id===q.correct?'答對，四選項解析已展開。':'答錯，正解與四選項解析已展開。');}}));return button;
 }));
 $('answer-panel').hidden=chosen===null;$('explanations').replaceChildren();$('answer-source').textContent='';$('answer-example').textContent='';$('concept-section').hidden=chosen===null||!q.concept;$('concept-explanation').textContent=chosen!==null?(q.concept||''):'';
 if(chosen!==null){const correctIndex=options.findIndex(o=>o.id===q.correct);$('answer-heading').textContent=(chosen===q.correct?'答對':'答錯')+' · 正解 '+ 'ABCD'[correctIndex];
  $('explanations').replaceChildren(...options.map((o,i)=>{const li=document.createElement('li');li.append(textElement('b','ABCD'[i]),textElement('span',(o.id===q.correct?'正確':'錯誤')+'｜「'+o.text+'」'+o.explanation));return li;}));$('answer-source').textContent='來源：'+q.source;$('answer-example').textContent=q.example||'';$('answer-example').hidden=!q.example;
 }
 $('previous').disabled=s.at===0;$('next').disabled=s.at===9;$('view-results').hidden=!stats.complete;messages();
}
function focusQuestion(){$('question-title').focus({preventScroll:true});$('question-title').scrollIntoView({block:'nearest'});}
function draw(){if(drawing)return;drawing=true;try{engine.start();selecting=false;stopResultMotion();render();closeCatalog();focusQuestion();say('已抽出新的十題。');}finally{setTimeout(()=>{drawing=false;},350);}}
function stopResultMotion(){cancelAnimationFrame(resultFrame);clearTimeout(resultTimer);resultFrame=0;$('results-card').classList.remove('is-celebrating');$('result-percent').textContent=String(resultTarget);$('results-card').getAnimations({subtree:true}).forEach(a=>a.cancel());}
function animateResult(){stopResultMotion();if(motion.matches||document.hidden)return;$('results-card').classList.add('is-celebrating');const start=performance.now();function tick(now){const p=Math.min(1,(now-start)/720);$('result-percent').textContent=String(Math.round(resultTarget*(1-Math.pow(1-p,3))));if(p<1)resultFrame=requestAnimationFrame(tick);}$('result-percent').textContent='0';resultFrame=requestAnimationFrame(tick);resultTimer=setTimeout(()=>$('results-card').classList.remove('is-celebrating'),1750);}
function reviewQuestion(index){attempt(()=>{engine.move(index);selecting=false;stopResultMotion();render();focusQuestion();});}
function resultIcon(correct){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',correct?'m5 12 4 4L19 6':'m6 6 12 12M18 6 6 18');svg.append(p);return svg;}
function showResults(celebrate=false){
 const s=engine.current(),stats=s&&engine.statistics(s);if(!stats||!stats.complete)return;closeCatalog();selecting=false;resultTarget=stats.percent;$('selection-card').hidden=true;$('quiz-card').hidden=true;$('results-card').hidden=false;document.body.classList.add('result-view');
 $('result-context').textContent=schoolName()+' · '+node().title+' · '+DEPTHS[s.depth]+(s.redo?' · 本組重答':'');$('result-percent-accessible').textContent='本組答對率 '+stats.percent+'%。';$('result-correct').textContent=String(stats.correct);$('result-wrong').textContent=String(stats.wrong);
 $('result-message').textContent=stats.correct===10?'十題全數答對。可以回看解析，或選擇下一組練習。':stats.correct===0?'十題已完成。從解析開始，逐題釐清。':'本組答對 '+stats.correct+' 題，還有 '+stats.wrong+' 題可回看解析。';
 $('review-wrong').disabled=stats.wrong===0;$('review-wrong').textContent=stats.wrong?'回看 '+stats.wrong+' 題待複習':'本組沒有待複習題';
 $('result-map').replaceChildren(...s.answers.map((a,i)=>{const correct=a===engine.question(s,i).correct,button=document.createElement('button');button.className='result-key'+(correct?'':' wrong');button.dataset.question=String(i+1);button.setAttribute('aria-label','第 '+(i+1)+' 題，'+(correct?'答對':'待複習')+'，回看解析');button.append(textElement('span',String(i+1).padStart(2,'0')),resultIcon(correct));button.addEventListener('click',()=>reviewQuestion(i));return button;}));
 $('complete').hidden=false;const next=s.depth+1,legal=engine.available(s.node,next);$('upgrade').disabled=!legal;$('upgrade').textContent=next<=2?DEPTHS[next]+' · 新的10題':'已達最高深度';$('upgrade-reason').textContent=next<=2?engine.reason(s.node,next):'';
 $('new-set').disabled=!engine.available(s.node,s.depth);$('new-set-reason').textContent=engine.reason(s.node,s.depth);
 if(engine.school!=='CMU'&&node().banks[s.depth].questions.length<20)$('new-set-reason').textContent+=' 本深度補充題少於20題，再練習時部分題目可能再次出現。';
 if(celebrate)animateResult();else stopResultMotion();$('results-title').focus({preventScroll:true});$('results-card').scrollIntoView({block:'start'});say('十題已完成。答對 '+stats.correct+' 題，待複習 '+stats.wrong+' 題。');messages();
}
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>panelMode===b.dataset.panel?closeCatalog(true):showPanel(b.dataset.panel,b.dataset.panel==='catalog')));
document.querySelectorAll('[data-drawer-mode]').forEach(b=>b.addEventListener('click',()=>showPanel(b.dataset.drawerMode)));
$('panel-close').addEventListener('click',()=>closeCatalog(true));$('back-to-quiz').addEventListener('click',()=>closeCatalog(true));
dialog.addEventListener('cancel',e=>{e.preventDefault();closeCatalog(true);});dialog.addEventListener('close',()=>{panelMode=null;panel.hidden=true;document.body.style.overflow='';reflectPanel();});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeCatalog(true);}});
$('start-set').addEventListener('click',()=>attempt(draw));$('resume-set').addEventListener('click',()=>attempt(()=>{selecting=false;render();closeCatalog();if(engine.statistics().complete)showResults(false);else focusQuestion();}));
$('previous').addEventListener('click',()=>reviewQuestion(Math.max(0,engine.current().at-1)));$('next').addEventListener('click',()=>reviewQuestion(Math.min(9,engine.current().at+1)));
function reset(){attempt(()=>{engine.reset();selecting=false;stopResultMotion();render();focusQuestion();say('本組十題答案與統計已清空，原題、題序及選項順序均保留。');});}
$('reset').addEventListener('click',reset);$('result-reset').addEventListener('click',reset);$('view-results').addEventListener('click',()=>showResults());
$('review-all').addEventListener('click',()=>reviewQuestion(0));$('review-wrong').addEventListener('click',()=>{const s=engine.current(),i=s.answers.findIndex((a,j)=>a!==engine.question(s,j).correct);if(i>=0)reviewQuestion(i);});
$('new-set').addEventListener('click',()=>attempt(draw));$('upgrade').addEventListener('click',()=>attempt(()=>{if(drawing)return;drawing=true;try{engine.upgrade();selecting=false;stopResultMotion();render();focusQuestion();}finally{setTimeout(()=>{drawing=false;},350);}}));
$('finish').addEventListener('click',()=>{selecting=true;stopResultMotion();render();showPanel('catalog',true);});
motion.addEventListener('change',stopResultMotion);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopResultMotion();});
$('school-select').addEventListener('change',e=>attempt(()=>changeSchool(e.target.value)));
const savedSchool=engine.read('bio-quiz:selected-school');changeSchool(engines.has(savedSchool)?savedSchool:'CMU');
})();
</script></body></html>
