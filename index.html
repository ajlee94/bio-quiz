B01-Ch1.1.1-B029:A","options":[{"id":"BIO-B01-Ch1.1.1-B029:A","text":"合併生物群集與非生物環境資料","explanation":"生態系涵蓋生物及與其互動的非生物環境。"},{"id":"BIO-B01-Ch1.1.1-B029:B","text":"只保留甲中的同一物種","explanation":"只留同種會縮為族群。"},{"id":"BIO-B01-Ch1.1.1-B029:C","text":"刪掉所有微生物","explanation":"微生物亦為生態系成分。"},{"id":"BIO-B01-Ch1.1.1-B029:D","text":"只看乙而排除生物","explanation":"只有非生物環境不構成完整生態系描述。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B030","topicId":"","stem":"一份全球研究包含海洋、陸地與其他生命所在環境。若使用「生物圈」，是否應把海洋生命排除？","correct":"BIO-B01-Ch1.1.1-B030:C","options":[{"id":"BIO-B01-Ch1.1.1-B030:A","text":"應排除，生物圈只指森林","explanation":"生物圈不限森林。"},{"id":"BIO-B01-Ch1.1.1-B030:B","text":"應排除，水域只有非生物成分","explanation":"水域亦有生物，不能全當非生物。"},{"id":"BIO-B01-Ch1.1.1-B030:C","text":"不應排除，生物圈包含地球所有生命與其環境","explanation":"生物圈包含海洋與陸地等生命所在區域。"},{"id":"BIO-B01-Ch1.1.1-B030:D","text":"只保留一個物種即可代表完整定義","explanation":"單一物種不足涵蓋全球生命與環境。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第4頁（正式第6張，13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B031","topicId":"","stem":"甲樣本保有葉綠體分子的適當組織，乙僅把同類分子混合；乙未完成完整光合作用。哪個說明最符合本節？","correct":"BIO-B01-Ch1.1.1-B031:B","options":[{"id":"BIO-B01-Ch1.1.1-B031:A","text":"乙缺少的必定只是分子名稱","explanation":"命名不決定功能。"},{"id":"BIO-B01-Ch1.1.1-B031:B","text":"分子組織與協調是完整功能的重要條件","explanation":"成分存在還需適當組織互動，才形成完整系統功能。"},{"id":"BIO-B01-Ch1.1.1-B031:C","text":"任何分子在乙中都完全沒有性質","explanation":"單個分子仍可具有吸光等特定性質。"},{"id":"BIO-B01-Ch1.1.1-B031:D","text":"此結果證明光合作用不涉及分子","explanation":"光合作用正需要多分子協調。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B032","topicId":"","stem":"兩套系統含相同種類的零件，連接方式不同，整體功能也不同。此觀察最直接提醒什麼？","correct":"BIO-B01-Ch1.1.1-B032:D","options":[{"id":"BIO-B01-Ch1.1.1-B032:A","text":"功能只由零件數決定","explanation":"題幹顯示連接方式也重要。"},{"id":"BIO-B01-Ch1.1.1-B032:B","text":"組成種類相同必定功能相同","explanation":"相同種類但功能不同已反駁此說。"},{"id":"BIO-B01-Ch1.1.1-B032:C","text":"所有零件都沒有可研究的性質","explanation":"零件仍可研究，問題是整體關係。"},{"id":"BIO-B01-Ch1.1.1-B032:D","text":"只列成分不足，還要看排列與互動","explanation":"成分清單未涵蓋連接與互動。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B033","topicId":"","stem":"葉綠素被分離後仍可吸光，但不能獨自完成完整光合作用。合理結論為何？","correct":"BIO-B01-Ch1.1.1-B033:A","options":[{"id":"BIO-B01-Ch1.1.1-B033:A","text":"保有局部性質不代表保有完整系統功能","explanation":"單分子特性與多成分協調流程是不同層次。"},{"id":"BIO-B01-Ch1.1.1-B033:B","text":"吸光必定等於完整光合作用","explanation":"完整過程不只有吸光。"},{"id":"BIO-B01-Ch1.1.1-B033:C","text":"葉綠素在完整葉綠體中沒有作用","explanation":"葉綠素在完整系統中也有吸光作用。"},{"id":"BIO-B01-Ch1.1.1-B033:D","text":"只需把葉綠素改名就會恢復完整功能","explanation":"改名不會恢復缺少的組織互動。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B034","topicId":"","stem":"把腳踏車拆散後，所有部件都還在，卻失去可踩踏騎行的整體功能。哪個推論適當？","correct":"BIO-B01-Ch1.1.1-B034:C","options":[{"id":"BIO-B01-Ch1.1.1-B034:A","text":"各零件必定已全部消失","explanation":"題幹明示部件仍在。"},{"id":"BIO-B01-Ch1.1.1-B034:B","text":"只要零件重量不變就不可能失去功能","explanation":"重量不是判斷連接是否完整的充分條件。"},{"id":"BIO-B01-Ch1.1.1-B034:C","text":"破壞組織與連接可使整體功能消失","explanation":"功能依賴正確組裝及零件配合。"},{"id":"BIO-B01-Ch1.1.1-B034:D","text":"組裝是讓零件變成生命","explanation":"腳踏車始終是非生命系統。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第7頁（正式第9張，16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B035","topicId":"","stem":"要回應「找到最重要的一個分子，就能靠它獨立完成整體功能」，哪句話最合理？","correct":"BIO-B01-Ch1.1.1-B035:B","options":[{"id":"BIO-B01-Ch1.1.1-B035:A","text":"所有分子都同樣沒有作用","explanation":"分子各有性質與功能。"},{"id":"BIO-B01-Ch1.1.1-B035:B","text":"重要組件仍需與其他組件組織並協調","explanation":"重要性不表示能獨自取代整體協作。"},{"id":"BIO-B01-Ch1.1.1-B035:C","text":"只要分子很大就等於完整系統","explanation":"大小不能取代組成與互動。"},{"id":"BIO-B01-Ch1.1.1-B035:D","text":"不必分析任何組件","explanation":"分析組件仍是有用的研究。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B036","topicId":"","stem":"某學生說：「湧現性質只會出現在生命系統中，不會出現在非生命系統。」哪個反例最符合本節？","correct":"BIO-B01-Ch1.1.1-B036:D","options":[{"id":"BIO-B01-Ch1.1.1-B036:A","text":"完整細胞具有生命活動","explanation":"生物的例子不能反駁生命專有。"},{"id":"BIO-B01-Ch1.1.1-B036:B","text":"葉綠體可協調光合作用","explanation":"葉綠體例子仍在生命系統中。"},{"id":"BIO-B01-Ch1.1.1-B036:C","text":"細胞由分子構成","explanation":"成分描述未直接提供非生命反例。"},{"id":"BIO-B01-Ch1.1.1-B036:D","text":"正確組裝的腳踏車具有零件單獨沒有的騎行功能","explanation":"非生命腳踏車也可呈現組合後功能，足以反駁。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第7頁（正式第9張，16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B037","topicId":"","stem":"系統拆解後，各部分的性質都能研究，但完整功能不見了。哪項敘述能同時容納這兩件事？","correct":"BIO-B01-Ch1.1.1-B037:A","options":[{"id":"BIO-B01-Ch1.1.1-B037:A","text":"成分有自身性質，整體功能另依賴其組織互動","explanation":"承認部分性質及更高層級新功能，可解釋兩種觀察。"},{"id":"BIO-B01-Ch1.1.1-B037:B","text":"只要整體功能消失，成分就不可能有性質","explanation":"完整功能與單件性質不同，不能相互否定。"},{"id":"BIO-B01-Ch1.1.1-B037:C","text":"所有整體功能都已藏在任何一個零件裡","explanation":"個別組件通常不具相同完整功能。"},{"id":"BIO-B01-Ch1.1.1-B037:D","text":"研究者不該區分層級","explanation":"區分層級有助辨識兩者。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B038","topicId":"","stem":"在解釋葉綠體運作時，只寫「分子很多」仍缺少哪項關鍵資訊？","correct":"BIO-B01-Ch1.1.1-B038:C","options":[{"id":"BIO-B01-Ch1.1.1-B038:A","text":"每個分子是否使用相同中文名稱","explanation":"中文名不是功能機制。"},{"id":"BIO-B01-Ch1.1.1-B038:B","text":"所有分子是否都沒有作用","explanation":"分子有各自作用。"},{"id":"BIO-B01-Ch1.1.1-B038:C","text":"分子如何被安排並互相配合","explanation":"數量以外還需要組織與互動資訊。"},{"id":"BIO-B01-Ch1.1.1-B038:D","text":"葉綠體是否已變成一個族群","explanation":"葉綠體是胞器，不會因分子多變成族群。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B039","topicId":"","stem":"下列哪組對照最適合教學上說明湧現性質？","correct":"BIO-B01-Ch1.1.1-B039:B","options":[{"id":"BIO-B01-Ch1.1.1-B039:A","text":"同一腳踏車換兩種標籤","explanation":"只改標籤沒有比較功能形成。"},{"id":"BIO-B01-Ch1.1.1-B039:B","text":"散開部件與正確組裝後可騎行的腳踏車","explanation":"比較組織前後的整體功能，能凸顯湧現。"},{"id":"BIO-B01-Ch1.1.1-B039:C","text":"同一個零件用兩種顏色筆寫名稱","explanation":"書寫顏色不改系統功能。"},{"id":"BIO-B01-Ch1.1.1-B039:D","text":"把零件清單依字母順序重排","explanation":"清單排序不同於物理組裝與互動。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第7頁（正式第9張，16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B040","topicId":"","stem":"「湧現性質無法用科學理解，因為每個零件單獨都沒有它。」哪個回答最佳？","correct":"BIO-B01-Ch1.1.1-B040:D","options":[{"id":"BIO-B01-Ch1.1.1-B040:A","text":"同意，因此不需研究生物","explanation":"缺少單件功能不代表無法研究整體。"},{"id":"BIO-B01-Ch1.1.1-B040:B","text":"只要研究名稱就可以理解","explanation":"名稱不足以描述互動。"},{"id":"BIO-B01-Ch1.1.1-B040:C","text":"同意，這證明沒有組成成分","explanation":"整體仍由成分組成。"},{"id":"BIO-B01-Ch1.1.1-B040:D","text":"可以研究零件的排列及互動來理解整體新性質","explanation":"研究關係與組織方式是合理科學方向。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B041","topicId":"","stem":"假設所有需要的分子仍在，但葉綠體中原有位置與相互配合遭破壞。哪項預測符合本節原則？","correct":"BIO-B01-Ch1.1.1-B041:A","options":[{"id":"BIO-B01-Ch1.1.1-B041:A","text":"完整光合作用可能受影響，不能只憑成分仍在判定正常","explanation":"完整功能依賴成分組織互動，破壞後可能受損。"},{"id":"BIO-B01-Ch1.1.1-B041:B","text":"完整功能必定完全正常","explanation":"成分存在不是功能正常的充分證據。"},{"id":"BIO-B01-Ch1.1.1-B041:C","text":"葉綠體會自動變成生物圈","explanation":"組織破壞不造成生態層級轉換。"},{"id":"BIO-B01-Ch1.1.1-B041:D","text":"任何分子都必須失去全部化學性質","explanation":"破壞整體配合不等於所有分子性質消失。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B042","topicId":"","stem":"兩份成分清單完全相同，能否直接宣稱兩個系統的完整功能也相同？","correct":"BIO-B01-Ch1.1.1-B042:C","options":[{"id":"BIO-B01-Ch1.1.1-B042:A","text":"可以，清單已含全部互動資訊","explanation":"成分清單不必然包含互動資料。"},{"id":"BIO-B01-Ch1.1.1-B042:B","text":"可以，空間排列永遠無關","explanation":"空間組織可影響功能。"},{"id":"BIO-B01-Ch1.1.1-B042:C","text":"不能，清單未必交代排列和互動","explanation":"相同成分仍可有不同組織，需再核對。"},{"id":"BIO-B01-Ch1.1.1-B042:D","text":"不能，因為成分完全不影響功能","explanation":"成分仍重要，只是單獨不足。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B043","topicId":"","stem":"學生測到試管中的葉綠素能吸光，就判定試管已具完整光合作用。主要推論問題是什麼？","correct":"BIO-B01-Ch1.1.1-B043:B","options":[{"id":"BIO-B01-Ch1.1.1-B043:A","text":"把胞器當成器官系統","explanation":"題幹未談器官系統。"},{"id":"BIO-B01-Ch1.1.1-B043:B","text":"把其中一項分子性質當成整體完整功能","explanation":"吸光證據不能單獨證明完整協調過程。"},{"id":"BIO-B01-Ch1.1.1-B043:C","text":"把不同物種當作同一族群","explanation":"題幹未談物種集合。"},{"id":"BIO-B01-Ch1.1.1-B043:D","text":"把所有組織當成相同顏色","explanation":"題幹沒有組織顏色資料。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B044","topicId":"","stem":"把完整腳踏車與一箱齊全部件相比，為何「零件齊全」仍不足以代表能騎行？","correct":"BIO-B01-Ch1.1.1-B044:D","options":[{"id":"BIO-B01-Ch1.1.1-B044:A","text":"因為只有活細胞可以移動","explanation":"非生命物體也可在外力下移動。"},{"id":"BIO-B01-Ch1.1.1-B044:B","text":"因為每個零件都必須完全相同","explanation":"不同部件分工，不需完全相同。"},{"id":"BIO-B01-Ch1.1.1-B044:C","text":"因為零件名稱需要更長","explanation":"名稱長短與騎行無關。"},{"id":"BIO-B01-Ch1.1.1-B044:D","text":"因為騎行還需正確連接並在踩踏等作用下協調運作","explanation":"完整成分、正確組裝及運作條件須區分。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第7頁（正式第9張，16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B045","topicId":"","stem":"研究結論寫道：「葉綠素有重要性，所以其他分子與組織位置都可忽略。」何者是適當修正？","correct":"BIO-B01-Ch1.1.1-B045:A","options":[{"id":"BIO-B01-Ch1.1.1-B045:A","text":"重要成分與系統組織皆須考慮","explanation":"組件性質與組織互動共同影響系統功能。"},{"id":"BIO-B01-Ch1.1.1-B045:B","text":"重要性代表可獨立完成全部功能","explanation":"重要不等於足以獨自完成整體。"},{"id":"BIO-B01-Ch1.1.1-B045:C","text":"只保留位置資料，成分種類永遠不重要","explanation":"成分種類仍有功能意義。"},{"id":"BIO-B01-Ch1.1.1-B045:D","text":"取消對光合作用的所有研究","explanation":"已有研究價值，無須取消。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B046","topicId":"","stem":"若一個非生命裝置在正確組裝後出現新功能，對「湧現性質為生命專有」的說法有何影響？","correct":"BIO-B01-Ch1.1.1-B046:C","options":[{"id":"BIO-B01-Ch1.1.1-B046:A","text":"直接證明裝置具有細胞","explanation":"新功能不等於具細胞。"},{"id":"BIO-B01-Ch1.1.1-B046:B","text":"證明生物沒有湧現性質","explanation":"非生命有此性質不排除生物也有。"},{"id":"BIO-B01-Ch1.1.1-B046:C","text":"提供反例，顯示湧現不一定生命專有","explanation":"一個符合條件的非生命例子即可反駁專有主張。"},{"id":"BIO-B01-Ch1.1.1-B046:D","text":"只要裝置很小，就不算證據","explanation":"大小不是此反例有效與否的條件。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第7頁（正式第9張，16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B047","topicId":"","stem":"把分離組件與完整系統相比，何者最符合湧現性質的預期？","correct":"BIO-B01-Ch1.1.1-B047:B","options":[{"id":"BIO-B01-Ch1.1.1-B047:A","text":"分離組件一定擁有所有整體性質","explanation":"單件不必具所有上層性質。"},{"id":"BIO-B01-Ch1.1.1-B047:B","text":"完整系統可有單獨組件未具的新性質","explanation":"排列互動可產生上層新性質。"},{"id":"BIO-B01-Ch1.1.1-B047:C","text":"完整系統一定不含原有組件","explanation":"系統由組件構成，不是取消組件。"},{"id":"BIO-B01-Ch1.1.1-B047:D","text":"整體性質只取決於觀察者用詞","explanation":"用詞不能產生物理或生物功能。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B048","topicId":"","stem":"將葉綠體內分子清單補上空間配置與協作關係，主要補足何種資訊？","correct":"BIO-B01-Ch1.1.1-B048:D","options":[{"id":"BIO-B01-Ch1.1.1-B048:A","text":"把生物直接分成物種","explanation":"這不是物種分類。"},{"id":"BIO-B01-Ch1.1.1-B048:B","text":"證明成分資料毫無價值","explanation":"成分清單與新資訊互補。"},{"id":"BIO-B01-Ch1.1.1-B048:C","text":"把單一分子改成一個族群","explanation":"研究資訊增加不使分子變族群。"},{"id":"BIO-B01-Ch1.1.1-B048:D","text":"由成分存在進一步理解整體功能的形成","explanation":"配置與協作說明成分如何組織成有功能系統。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第6頁（正式第8張，15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B049","topicId":"","stem":"甲只把腳踏車部件名單換順序，乙實際把散開部件正確組合。哪個改動更直接可能形成騎行功能？","correct":"BIO-B01-Ch1.1.1-B049:A","options":[{"id":"BIO-B01-Ch1.1.1-B049:A","text":"乙，因為改變實際組織及連接","explanation":"實際組裝才能使部件協調成完整裝置。"},{"id":"BIO-B01-Ch1.1.1-B049:B","text":"甲，因為文字排序就是物理組裝","explanation":"文字清單排序不改實物連接。"},{"id":"BIO-B01-Ch1.1.1-B049:C","text":"兩者都必定使物體成為生命","explanation":"騎行功能不代表生命。"},{"id":"BIO-B01-Ch1.1.1-B049:D","text":"兩者都只是物種分類","explanation":"沒有進行物種分類。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）; 正文第7頁（正式第9張，16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B050","topicId":"","stem":"若整體新功能可由成分互動解釋，是否仍可稱為湧現性質？","correct":"BIO-B01-Ch1.1.1-B050:C","options":[{"id":"BIO-B01-Ch1.1.1-B050:A","text":"不能，湧現必須神秘且無因","explanation":"湧現並不要求神秘或無因。"},{"id":"BIO-B01-Ch1.1.1-B050:B","text":"不能，只有無法研究才算","explanation":"可研究是本節的重要觀點。"},{"id":"BIO-B01-Ch1.1.1-B050:C","text":"可以，可解釋不會取消它是組織後新性質的事實","explanation":"定義重在組織互動後的新性質，不在是否已解釋。"},{"id":"BIO-B01-Ch1.1.1-B050:D","text":"可以，但必須說成任何單件原本已有該功能","explanation":"若單件原本就有相同整體功能，便未凸顯新性質。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第5頁（正式第7張，14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B051","topicId":"","stem":"甲組研究分離蛋白質的性質；乙組研究許多蛋白質相互影響形成的整體行為。兩組最合理的分工描述是什麼？","correct":"BIO-B01-Ch1.1.1-B051:B","options":[{"id":"BIO-B01-Ch1.1.1-B051:A","text":"甲只研究生物圈，乙只研究原子","explanation":"題幹並非這兩個尺度。"},{"id":"BIO-B01-Ch1.1.1-B051:B","text":"甲提供部分資訊，乙補互動資訊，可相互配合","explanation":"部分性質與整體互動提供互補理解。"},{"id":"BIO-B01-Ch1.1.1-B051:C","text":"甲毫無價值，乙應忽略所有成分","explanation":"系統分析也需要成分資料。"},{"id":"BIO-B01-Ch1.1.1-B051:D","text":"甲乙只能選一組進行","explanation":"不同取向不必互相排斥。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B052","topicId":"","stem":"一個細胞的成分名錄已整理完成，但團隊仍不能解釋其整體動態。最合適的後續工作是哪項？","correct":"BIO-B01-Ch1.1.1-B052:D","options":[{"id":"BIO-B01-Ch1.1.1-B052:A","text":"只把名錄再按字數排序","explanation":"排序不增加生物互動資訊。"},{"id":"BIO-B01-Ch1.1.1-B052:B","text":"假設每個分子獨立運作","explanation":"獨立假設會漏掉系統關係。"},{"id":"BIO-B01-Ch1.1.1-B052:C","text":"宣稱細胞沒有可理解的性質","explanation":"未解釋不代表不可理解。"},{"id":"BIO-B01-Ch1.1.1-B052:D","text":"研究成分間的連結及隨時間變化","explanation":"成分互動及動態可補足清單限制。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B053","topicId":"","stem":"有人從DNA分子結構獲得遺傳化學基礎的線索。這能支持哪個結論？","correct":"BIO-B01-Ch1.1.1-B053:A","options":[{"id":"BIO-B01-Ch1.1.1-B053:A","text":"拆到分子層級的研究可幫助理解生命現象","explanation":"局部結構研究能提供有價值的線索。"},{"id":"BIO-B01-Ch1.1.1-B053:B","text":"只靠一個分子即可回答所有生命問題","explanation":"例子顯示價值，不保證解答全部問題。"},{"id":"BIO-B01-Ch1.1.1-B053:C","text":"生物學不必研究任何分子","explanation":"與題幹成果相反。"},{"id":"BIO-B01-Ch1.1.1-B053:D","text":"DNA結構研究等於調查整個生物圈","explanation":"分子尺度與全球調查不同。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B054","topicId":"","stem":"兩份研究摘要分別是「列出細胞組件名稱」與「建立組件互動模型，分析整體變化」。何者較直接表現系統生物學？","correct":"BIO-B01-Ch1.1.1-B054:C","options":[{"id":"BIO-B01-Ch1.1.1-B054:A","text":"前者，因為名稱清單已等於全部動態","explanation":"清單尚缺動態關係。"},{"id":"BIO-B01-Ch1.1.1-B054:B","text":"兩者都排斥研究細胞","explanation":"兩者均在研究細胞。"},{"id":"BIO-B01-Ch1.1.1-B054:C","text":"後者，因為重點在互動網絡及整體行為","explanation":"互動模型與整體變化符合系統取向。"},{"id":"BIO-B01-Ch1.1.1-B054:D","text":"兩者都只屬物種命名","explanation":"細胞組件分析不是物種命名。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B055","topicId":"","stem":"研究者先測量各組件的性質，再把結果放入整合互動模型。此安排與兩種取向的關係為何？","correct":"BIO-B01-Ch1.1.1-B055:B","options":[{"id":"BIO-B01-Ch1.1.1-B055:A","text":"證明還原論不能與系統研究並用","explanation":"先測部分再整合正是並用。"},{"id":"BIO-B01-Ch1.1.1-B055:B","text":"把還原論所得的部分資訊用於系統理解","explanation":"部分資訊可成為分析整體互動的基礎。"},{"id":"BIO-B01-Ch1.1.1-B055:C","text":"證明各組件完全沒有功能","explanation":"測量部分性質不等於否定功能。"},{"id":"BIO-B01-Ch1.1.1-B055:D","text":"保證不需要再看任何結果","explanation":"模型仍需與觀察結果對照。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B056","topicId":"","stem":"「一個細胞太小，不能成為系統生物學對象。」哪個回答最妥當？","correct":"BIO-B01-Ch1.1.1-B056:D","options":[{"id":"BIO-B01-Ch1.1.1-B056:A","text":"同意，系統至少要一個國家那麼大","explanation":"系統研究無此地理大小限制。"},{"id":"BIO-B01-Ch1.1.1-B056:B","text":"同意，細胞只有一個成分","explanation":"細胞由多種成分構成。"},{"id":"BIO-B01-Ch1.1.1-B056:C","text":"同意，系統研究只允許器官以上","explanation":"系統生物學可研究細胞層級。"},{"id":"BIO-B01-Ch1.1.1-B056:D","text":"不同意，細胞有成分與互動，可視為系統","explanation":"大小不是排除細胞的理由。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B057","topicId":"","stem":"某團隊研究生物體內許多成分互動如何形成每日的睡醒週期。判斷其研究取向時應抓哪個重點？","correct":"BIO-B01-Ch1.1.1-B057:A","options":[{"id":"BIO-B01-Ch1.1.1-B057:A","text":"多成分互動與整體動態","explanation":"互動形成週期，是系統生物學的典型問題。"},{"id":"BIO-B01-Ch1.1.1-B057:B","text":"只看題目是否有數字24","explanation":"數字本身不能決定研究取向。"},{"id":"BIO-B01-Ch1.1.1-B057:C","text":"只看研究者是否用顯微鏡","explanation":"使用何種儀器不是唯一判準。"},{"id":"BIO-B01-Ch1.1.1-B057:D","text":"只看成分名稱是否很長","explanation":"名稱長度與研究取向無關。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B058","topicId":"","stem":"知道一個組件的性質後，研究者仍想知道它在細胞中如何影響其他成分。這代表什麼？","correct":"BIO-B01-Ch1.1.1-B058:C","options":[{"id":"BIO-B01-Ch1.1.1-B058:A","text":"原有單件研究必須全部作廢","explanation":"已知性質仍可使用。"},{"id":"BIO-B01-Ch1.1.1-B058:B","text":"系統生物學只研究名稱","explanation":"互動比名稱清單更進一步。"},{"id":"BIO-B01-Ch1.1.1-B058:C","text":"研究從部分性質延伸到互動，兩者可互補","explanation":"延伸到關係與整體是互補取向。"},{"id":"BIO-B01-Ch1.1.1-B058:D","text":"研究不再屬生物學","explanation":"仍是在研究生命系統。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B059","topicId":"","stem":"若只使用每個零件的獨立資料，卻漏掉所有連結，最可能欠缺哪一面向？","correct":"BIO-B01-Ch1.1.1-B059:B","options":[{"id":"BIO-B01-Ch1.1.1-B059:A","text":"零件是否有名字","explanation":"題幹已有零件資料，重點是缺關係。"},{"id":"BIO-B01-Ch1.1.1-B059:B","text":"整合網絡與整體行為的解釋","explanation":"省略連結會漏掉相互影響及動態。"},{"id":"BIO-B01-Ch1.1.1-B059:C","text":"所有局部資料都不存在","explanation":"局部資料仍在，不能說不存在。"},{"id":"BIO-B01-Ch1.1.1-B059:D","text":"生命是否可以分層研究","explanation":"仍可分層研究，問題是互動資訊不足。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B060","topicId":"","stem":"「系統生物學既然重要，就不再需要研究單一成分。」哪項評語正確？","correct":"BIO-B01-Ch1.1.1-B060:D","options":[{"id":"BIO-B01-Ch1.1.1-B060:A","text":"正確，所有單一成分都沒有性質","explanation":"單一成分有可研究的性質。"},{"id":"BIO-B01-Ch1.1.1-B060:B","text":"正確，整體不由成分組成","explanation":"整體由成分及其關係構成。"},{"id":"BIO-B01-Ch1.1.1-B060:C","text":"正確，模型不需要任何組件資訊","explanation":"模型通常需要成分和互動資訊。"},{"id":"BIO-B01-Ch1.1.1-B060:D","text":"不正確，系統取向補足還原研究，兩者並非互斥","explanation":"部分研究和整體研究可以互補。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B061","topicId":"","stem":"甲只分析細胞膜的一個組成分子，乙分析細胞膜各成分如何共同作用。何者較合理？","correct":"BIO-B01-Ch1.1.1-B061:A","options":[{"id":"BIO-B01-Ch1.1.1-B061:A","text":"甲偏還原取向，乙偏互動整合取向","explanation":"甲聚焦單件，乙聚焦多成分關係。"},{"id":"BIO-B01-Ch1.1.1-B061:B","text":"甲乙都必定是生物圈研究","explanation":"兩者研究細胞膜，非全球尺度。"},{"id":"BIO-B01-Ch1.1.1-B061:C","text":"只有甲可以算生物學","explanation":"研究互動同樣屬生物學。"},{"id":"BIO-B01-Ch1.1.1-B061:D","text":"乙的研究表示不必知道任何成分","explanation":"分析互動仍須了解成分。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B062","topicId":"","stem":"一項單分子研究無法解釋全部細胞行為。哪個評估避免過度推論？","correct":"BIO-B01-Ch1.1.1-B062:C","options":[{"id":"BIO-B01-Ch1.1.1-B062:A","text":"因此所有單分子研究無用","explanation":"不能由有侷限推成完全無價值。"},{"id":"BIO-B01-Ch1.1.1-B062:B","text":"因此不存在細胞層級","explanation":"方法侷限不否定細胞層級。"},{"id":"BIO-B01-Ch1.1.1-B062:C","text":"研究有局部價值，仍須補組織與互動資訊","explanation":"保留成果並補足整體關係較合理。"},{"id":"BIO-B01-Ch1.1.1-B062:D","text":"因此所有細胞行為都已完全解釋","explanation":"題幹明示仍未完全解釋。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B063","topicId":"","stem":"研究葉細胞、青蛙與沙漠生態系時，哪一點可共同形成系統研究的出發點？","correct":"BIO-B01-Ch1.1.1-B063:B","options":[{"id":"BIO-B01-Ch1.1.1-B063:A","text":"三者都一定是單細胞","explanation":"青蛙及生態系不是單細胞。"},{"id":"BIO-B01-Ch1.1.1-B063:B","text":"三者都有可界定的組成部分及其互動","explanation":"不同尺度皆可分析部分間的關係。"},{"id":"BIO-B01-Ch1.1.1-B063:C","text":"三者都只有同一種分子","explanation":"各系統都有多種成分。"},{"id":"BIO-B01-Ch1.1.1-B063:D","text":"三者都必須排除動態變化","explanation":"系統研究重視動態。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B064","topicId":"","stem":"若把細胞模型中的成分資料保留，卻刪去所有互相影響的關係，對系統分析最直接的限制為何？","correct":"BIO-B01-Ch1.1.1-B064:D","options":[{"id":"BIO-B01-Ch1.1.1-B064:A","text":"模型會因此自動更完整","explanation":"少了關係並不更完整。"},{"id":"BIO-B01-Ch1.1.1-B064:B","text":"成分名稱會全數失效","explanation":"刪除關係不會使名稱自動失效。"},{"id":"BIO-B01-Ch1.1.1-B064:C","text":"細胞必須改稱為器官","explanation":"模型設定不改生物層級。"},{"id":"BIO-B01-Ch1.1.1-B064:D","text":"難以表現組件協調造成的整體變化","explanation":"沒有互動關係難表現整合動態。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B065","topicId":"","stem":"文字模型記作「甲影響乙，乙又影響甲」，並觀察兩者隨時間變化。何者最符合其重點？","correct":"BIO-B01-Ch1.1.1-B065:A","options":[{"id":"BIO-B01-Ch1.1.1-B065:A","text":"研究相互影響及動態，符合系統取向","explanation":"題幹明確描述雙向影響及時間變化。"},{"id":"BIO-B01-Ch1.1.1-B065:B","text":"只列兩個名稱，完全沒有關係","explanation":"題幹已有關係，非單純清單。"},{"id":"BIO-B01-Ch1.1.1-B065:C","text":"把甲乙當成同一物種的定義","explanation":"這不是物種定義。"},{"id":"BIO-B01-Ch1.1.1-B065:D","text":"必定已證明所有生命機制","explanation":"簡化模型不代表解釋所有生命。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B066","topicId":"","stem":"「拆小了解各部分」及「合看各部分的互動」各有用途。要為兩者寫一句共同結論，何者適當？","correct":"BIO-B01-Ch1.1.1-B066:C","options":[{"id":"BIO-B01-Ch1.1.1-B066:A","text":"兩者互斥，不能共享資料","explanation":"兩者可共享資料並互補。"},{"id":"BIO-B01-Ch1.1.1-B066:B","text":"兩者皆不處理生物功能","explanation":"兩者皆有助理解生物功能。"},{"id":"BIO-B01-Ch1.1.1-B066:C","text":"從不同角度共同增進對系統的理解","explanation":"部分與整體互動各提供必要線索。"},{"id":"BIO-B01-Ch1.1.1-B066:D","text":"兩者可使所有組織層級消失","explanation":"研究不會抹除實際層級。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B067","topicId":"","stem":"分析分離的DNA結構可提供生命現象的線索，卻不保證解釋整個生物體。這正顯示還原論的哪一面向？","correct":"BIO-B01-Ch1.1.1-B067:B","options":[{"id":"BIO-B01-Ch1.1.1-B067:A","text":"只有侷限，完全沒有價值","explanation":"題幹已有提供線索的價值。"},{"id":"BIO-B01-Ch1.1.1-B067:B","text":"有用，但對整體的理解仍有侷限","explanation":"同時承認部分研究的貢獻與限制。"},{"id":"BIO-B01-Ch1.1.1-B067:C","text":"已完整取代所有其他方法","explanation":"不能由一項線索推所有問題已解。"},{"id":"BIO-B01-Ch1.1.1-B067:D","text":"只能研究土壤與水","explanation":"DNA結構屬分子研究。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4 頁（PDF 53 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B068","topicId":"","stem":"同一團隊有「組件名錄」與「組件互動隨時間變化」兩份資料。若要討論整體動態，哪種用法合理？","correct":"BIO-B01-Ch1.1.1-B068:D","options":[{"id":"BIO-B01-Ch1.1.1-B068:A","text":"只看名錄並忽略所有互動","explanation":"忽略互動會漏掉動態來源。"},{"id":"BIO-B01-Ch1.1.1-B068:B","text":"只以名稱長短推論功能","explanation":"名稱長短不是功能依據。"},{"id":"BIO-B01-Ch1.1.1-B068:C","text":"刪掉兩份資料直接下結論","explanation":"下結論仍需資料。"},{"id":"BIO-B01-Ch1.1.1-B068:D","text":"結合成分身分與互動變化資料","explanation":"身分加互動資料可支援整體分析。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B069","topicId":"","stem":"把一個蟻群視為系統時，研究焦點應如何超越單純列出成員？","correct":"BIO-B01-Ch1.1.1-B069:A","options":[{"id":"BIO-B01-Ch1.1.1-B069:A","text":"分析成員間如何相互影響形成整體行為","explanation":"系統重點是互動和整體行為。"},{"id":"BIO-B01-Ch1.1.1-B069:B","text":"只替每隻螞蟻換編號","explanation":"編號只增加識別，未說明互動。"},{"id":"BIO-B01-Ch1.1.1-B069:C","text":"只決定「蟻」字的筆畫","explanation":"文字筆畫不是生物學關係。"},{"id":"BIO-B01-Ch1.1.1-B069:D","text":"假定成員之間永遠沒有關係","explanation":"無視互動會失去系統觀點。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5 頁（PDF 54 頁）｜本節筆記 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B070","topicId":"","stem":"某提案把所有已知組件資料保留，再加入關係與動態分析。這是否背離還原研究？","correct":"BIO-B01-Ch1.1.1-B070:C","options":[{"id":"BIO-B01-Ch1.1.1-B070:A","text":"是，因為加入關係就必須刪除部分資料","explanation":"兩種資訊可並存。"},{"id":"BIO-B01-Ch1.1.1-B070:B","text":"是，所有部分資料都會變錯","explanation":"新關係資料不自動否定部分資料。"},{"id":"BIO-B01-Ch1.1.1-B070:C","text":"否，可在部分研究基礎上補充系統觀點","explanation":"系統觀補足還原取向，不是排斥。"},{"id":"BIO-B01-Ch1.1.1-B070:D","text":"否，但必須假設所有零件互不影響","explanation":"假設無互動違背新加入的關係分析。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 4-6 頁（PDF 53-55 頁）｜本節筆記 正文第8頁（正式第10張，17_imagegen_page_10.png）; 正文第9頁（正式第11張，18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B071","topicId":"","stem":"把葉片寬扁的外形與接收光線的作用放在一起解釋，最合理的推論是哪個？","correct":"BIO-B01-Ch1.1.1-B071:B","options":[{"id":"BIO-B01-Ch1.1.1-B071:A","text":"葉片只要寬扁就不需要細胞內的協作","explanation":"器官外形不會取消細胞內分子協調的必要。"},{"id":"BIO-B01-Ch1.1.1-B071:B","text":"寬扁形狀可增加受光面積，但不是完整光合作用的唯一條件","explanation":"形狀支持受光，但完整功能尚需細胞與分子協調。"},{"id":"BIO-B01-Ch1.1.1-B071:C","text":"葉的形狀與任何功能皆無關","explanation":"此例恰好展示形狀與功能有關。"},{"id":"BIO-B01-Ch1.1.1-B071:D","text":"受光面積等於單一物種的個體數","explanation":"面積與族群個體數不是同一概念。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B072","topicId":"","stem":"在其他條件相同的葉片模型中，甲攤平、乙捲起而減少面向光的面積。依構造功能關係，哪個推論較合理？","correct":"BIO-B01-Ch1.1.1-B072:D","options":[{"id":"BIO-B01-Ch1.1.1-B072:A","text":"乙必定吸收更多光，因為面積更小","explanation":"較小迎光面積不能據此推吸光較多。"},{"id":"BIO-B01-Ch1.1.1-B072:B","text":"兩者的構造差異絕不可能有影響","explanation":"構造差異可影響功能。"},{"id":"BIO-B01-Ch1.1.1-B072:C","text":"甲必定不含任何細胞","explanation":"葉片形狀不否定細胞組成。"},{"id":"BIO-B01-Ch1.1.1-B072:D","text":"甲較大的受光面積可有利於光線捕捉","explanation":"在題定條件下，面積較大有利受光。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B073","topicId":"","stem":"蜂鳥肩關節允許翅膀大幅旋轉，若此活動能力受限，下列哪個預測與本節原則相符？","correct":"BIO-B01-Ch1.1.1-B073:A","options":[{"id":"BIO-B01-Ch1.1.1-B073:A","text":"懸停表現可能受影響","explanation":"支援懸停的構造活動受限，相關功能可能受影響。"},{"id":"BIO-B01-Ch1.1.1-B073:B","text":"原核細胞會因此出現細胞核","explanation":"翅膀機能不造成細胞類型轉變。"},{"id":"BIO-B01-Ch1.1.1-B073:C","text":"蜂鳥一定變成植物","explanation":"構造功能變化不代表物種變植物。"},{"id":"BIO-B01-Ch1.1.1-B073:D","text":"所有生物組織層級都失去意義","explanation":"一項構造改變不否定層級概念。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B074","topicId":"","stem":"只知道某構造名稱，還不能說明它如何工作。最適合補哪類資訊？","correct":"BIO-B01-Ch1.1.1-B074:C","options":[{"id":"BIO-B01-Ch1.1.1-B074:A","text":"名稱在字典中的順序","explanation":"字典順序不說明功能。"},{"id":"BIO-B01-Ch1.1.1-B074:B","text":"標籤的裝飾色","explanation":"裝飾色不說明生物構造。"},{"id":"BIO-B01-Ch1.1.1-B074:C","text":"構造的形狀、位置與組成如何支持功能","explanation":"實際結構特徵能提供功能機制線索。"},{"id":"BIO-B01-Ch1.1.1-B074:D","text":"報告標題的字數","explanation":"標題字數不是生物學證據。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B075","topicId":"","stem":"甲研究葉片外形如何受光，乙研究葉綠體內分子排列如何支持功能。哪項比較正確？","correct":"BIO-B01-Ch1.1.1-B075:B","options":[{"id":"BIO-B01-Ch1.1.1-B075:A","text":"只有甲能談構造功能","explanation":"分子與胞器層級也可談構造功能。"},{"id":"BIO-B01-Ch1.1.1-B075:B","text":"兩者都能談構造功能，但所看層級不同","explanation":"構造功能可跨器官及更微觀層級。"},{"id":"BIO-B01-Ch1.1.1-B075:C","text":"只有乙屬於生物學","explanation":"甲研究植物構造也屬生物學。"},{"id":"BIO-B01-Ch1.1.1-B075:D","text":"兩者必須使用完全相同的尺度","explanation":"同一原則可用於不同尺度。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B076","topicId":"","stem":"學生說「葉寬扁」已是完整功能解釋。下列何者最能補上結構到功能的連結？","correct":"BIO-B01-Ch1.1.1-B076:D","options":[{"id":"BIO-B01-Ch1.1.1-B076:A","text":"寬扁表示葉片一定只含一個細胞","explanation":"葉片包含多種組織及細胞。"},{"id":"BIO-B01-Ch1.1.1-B076:B","text":"寬扁只是一個名字，不能有功能意義","explanation":"葉形可有功能意義。"},{"id":"BIO-B01-Ch1.1.1-B076:C","text":"葉的大小可以取代所有細胞內反應","explanation":"外形不能取代細胞與分子運作。"},{"id":"BIO-B01-Ch1.1.1-B076:D","text":"寬扁能增加受光面積，支持光線捕捉","explanation":"連結了形狀特徵與受光作用。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B077","topicId":"","stem":"若要以蜂鳥為例說明「構造如何支援功能」，哪項描述最完整且符合本節？","correct":"BIO-B01-Ch1.1.1-B077:A","options":[{"id":"BIO-B01-Ch1.1.1-B077:A","text":"肩關節允許翅膀旋轉，配合拍動而有利懸停","explanation":"實際活動方式連到懸停功能，符合例子。"},{"id":"BIO-B01-Ch1.1.1-B077:B","text":"蜂鳥有名字，所以能懸停","explanation":"名稱不造成動作能力。"},{"id":"BIO-B01-Ch1.1.1-B077:C","text":"蜂鳥翅膀越少活動就一定越能懸停","explanation":"題幹例子需旋轉及拍動，不支持此逆向說法。"},{"id":"BIO-B01-Ch1.1.1-B077:D","text":"懸停只由翅膀的文字標籤造成","explanation":"標籤不取代構造與運作。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B078","topicId":"","stem":"比較兩個構造時，若只記下它們的外觀名稱，哪項工作最能進一步理解功能？","correct":"BIO-B01-Ch1.1.1-B078:C","options":[{"id":"BIO-B01-Ch1.1.1-B078:A","text":"依名稱筆畫排序","explanation":"排序文字不解釋運作。"},{"id":"BIO-B01-Ch1.1.1-B078:B","text":"把所有形狀差異視為無關","explanation":"形狀差異可有功能影響。"},{"id":"BIO-B01-Ch1.1.1-B078:C","text":"分析形狀、位置與排列會如何影響運作","explanation":"直接把構造特徵連到工作方式。"},{"id":"BIO-B01-Ch1.1.1-B078:D","text":"假設所有構造都能做完全相同的事","explanation":"不同結構可支援不同功能，不能一概相同。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B079","topicId":"","stem":"某人認為只有肉眼看得到的器官才適合討論構造功能。哪個修正最恰當？","correct":"BIO-B01-Ch1.1.1-B079:B","options":[{"id":"BIO-B01-Ch1.1.1-B079:A","text":"正確，細胞內構造全無意義","explanation":"微觀構造也可支援功能。"},{"id":"BIO-B01-Ch1.1.1-B079:B","text":"分子和胞器的排列也可與功能相關","explanation":"構造功能關係可跨尺度。"},{"id":"BIO-B01-Ch1.1.1-B079:C","text":"正確，分子沒有任何性質","explanation":"分子具有特定性質。"},{"id":"BIO-B01-Ch1.1.1-B079:D","text":"只要構造很小，就與功能完全無關","explanation":"大小不是是否相關的決定條件。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B080","topicId":"","stem":"某株植物的葉片受光面積減少，學生宣稱「因此它必定不是植物」。哪項修正較合理？","correct":"BIO-B01-Ch1.1.1-B080:D","options":[{"id":"BIO-B01-Ch1.1.1-B080:A","text":"同意，受光面積決定是否有細胞","explanation":"面積與細胞有無不是等價判準。"},{"id":"BIO-B01-Ch1.1.1-B080:B","text":"同意，任何外形改變都使物種消失","explanation":"外形變化不直接推物種消失。"},{"id":"BIO-B01-Ch1.1.1-B080:C","text":"只要改變標籤就能判定功能正常","explanation":"標籤不驗證功能。"},{"id":"BIO-B01-Ch1.1.1-B080:D","text":"受光效率可能受影響，但不能因此推成非植物","explanation":"只作題目條件支持的構造功能推論，不跨推分類。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B081","topicId":"","stem":"葉肉細胞含葉綠體，葉片外形又利於受光。哪句話最能整合兩個觀察？","correct":"BIO-B01-Ch1.1.1-B081:A","options":[{"id":"BIO-B01-Ch1.1.1-B081:A","text":"器官外形及細胞內構造可共同支持相關功能","explanation":"不同層級的構造可一同支援光合作用。"},{"id":"BIO-B01-Ch1.1.1-B081:B","text":"只有葉的名稱有作用","explanation":"名稱不能取代實際功能。"},{"id":"BIO-B01-Ch1.1.1-B081:C","text":"胞器存在就表示葉片不是器官","explanation":"器官包含細胞與胞器，不因此失去器官身分。"},{"id":"BIO-B01-Ch1.1.1-B081:D","text":"各層級構造必定互不相關","explanation":"跨層級存在關聯。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B082","topicId":"","stem":"要判讀「某構造被改變後，相關功能也受到影響」的例子，哪個態度最適當？","correct":"BIO-B01-Ch1.1.1-B082:C","options":[{"id":"BIO-B01-Ch1.1.1-B082:A","text":"一律認為功能改變與構造無關","explanation":"構造變化可能影響功能，應追查。"},{"id":"BIO-B01-Ch1.1.1-B082:B","text":"一律把它當作物種命名問題","explanation":"結構功能問題不等於命名。"},{"id":"BIO-B01-Ch1.1.1-B082:C","text":"追查改變的形狀、位置或排列如何支援該功能","explanation":"追查實際連結符合本節原則。"},{"id":"BIO-B01-Ch1.1.1-B082:D","text":"假設每個細胞都已變成分子","explanation":"功能改變不表示層級轉成分子。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第10頁（正式第12張，19_imagegen_page_12.png）; 正文第11頁（正式第13張，20_imagegen_page_13.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B083","topicId":"","stem":"葉綠體可進行光合作用相關工作，細胞可執行基本生命活動。為何前者不是最小完整生命單位？","correct":"BIO-B01-Ch1.1.1-B083:B","options":[{"id":"BIO-B01-Ch1.1.1-B083:A","text":"只要能吸光就已具全部生命活動","explanation":"吸光或光合作用不等於全部生命活動。"},{"id":"BIO-B01-Ch1.1.1-B083:B","text":"具有部分功能不代表能單獨執行全部基本生命活動","explanation":"胞器負責部分任務，完整基本單位仍是細胞。"},{"id":"BIO-B01-Ch1.1.1-B083:C","text":"因為所有胞器都沒有任何作用","explanation":"胞器有特定功能。"},{"id":"BIO-B01-Ch1.1.1-B083:D","text":"因為細胞一定只含一個分子","explanation":"細胞由許多成分組成。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B084","topicId":"","stem":"某多細胞生物的不同細胞分別執行不同工作。這會推翻「細胞是生命基本單位」嗎？","correct":"BIO-B01-Ch1.1.1-B084:D","options":[{"id":"BIO-B01-Ch1.1.1-B084:A","text":"會，因為細胞必須各自完成整個個體全部工作","explanation":"多細胞個體可依專門細胞分工，不需每類包辦全部。"},{"id":"BIO-B01-Ch1.1.1-B084:B","text":"會，因為合作後就不再是細胞","explanation":"合作不取消細胞身分。"},{"id":"BIO-B01-Ch1.1.1-B084:C","text":"會，因為特化細胞沒有功能","explanation":"特化意味特定功能，並非無功能。"},{"id":"BIO-B01-Ch1.1.1-B084:D","text":"不會，個體活動仍以細胞活動及分工合作為基礎","explanation":"分工合作與細胞基本單位觀念相容。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第3頁（正式第5張，12_imagegen_page_05.png）; 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B085","topicId":"","stem":"一個單細胞生物沒有組織或器官，仍能維持生命。這能支持哪項結論？","correct":"BIO-B01-Ch1.1.1-B085:A","options":[{"id":"BIO-B01-Ch1.1.1-B085:A","text":"基本生命活動不以先形成多細胞器官為必要","explanation":"細胞本身可成為單細胞生物的基本完整單位。"},{"id":"BIO-B01-Ch1.1.1-B085:B","text":"所有分子都等同單細胞生物","explanation":"分子不是細胞，不能等同。"},{"id":"BIO-B01-Ch1.1.1-B085:C","text":"沒有器官的生物必定沒有細胞","explanation":"題幹已是單細胞，與無細胞矛盾。"},{"id":"BIO-B01-Ch1.1.1-B085:D","text":"細胞只有在形成葉片後才有功能","explanation":"單細胞生物不需葉片才能活動。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B086","topicId":"","stem":"一個活的分化細胞仍進行基本代謝，但沒有持續分裂。哪句話符合本節提醒？","correct":"BIO-B01-Ch1.1.1-B086:C","options":[{"id":"BIO-B01-Ch1.1.1-B086:A","text":"它因未分裂就一定不是細胞","explanation":"分裂狀態不取消細胞身分。"},{"id":"BIO-B01-Ch1.1.1-B086:B","text":"所有活細胞都必須隨時分裂","explanation":"本節明確限定只有部分細胞可進行分裂。"},{"id":"BIO-B01-Ch1.1.1-B086:C","text":"部分細胞不持續分裂，仍可有基本生命活動","explanation":"基本生命活動不等於每個細胞都持續分裂。"},{"id":"BIO-B01-Ch1.1.1-B086:D","text":"只要沒有分裂，就必定變成胞器","explanation":"不分裂不使細胞變胞器。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B087","topicId":"","stem":"甲只是一個分離胞器，乙是一個能維持基本生命活動的單細胞生物。哪項比較正確？","correct":"BIO-B01-Ch1.1.1-B087:B","options":[{"id":"BIO-B01-Ch1.1.1-B087:A","text":"甲比乙更能代表完整生命單位","explanation":"甲只具部分功能，不能因此代表完整生命。"},{"id":"BIO-B01-Ch1.1.1-B087:B","text":"乙符合細胞基本單位，甲僅為部分功能構造","explanation":"乙為完整單細胞，甲為細胞的功能構造。"},{"id":"BIO-B01-Ch1.1.1-B087:C","text":"甲乙必定都由器官系統構成","explanation":"胞器和單細胞都不由器官系統構成。"},{"id":"BIO-B01-Ch1.1.1-B087:D","text":"乙必須先長成多細胞才可能有生命","explanation":"單細胞即可維持生命活動。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B088","topicId":"","stem":"學生認為「多細胞生物的每一類細胞，都要能單獨完成整個個體的一切工作」。應如何修正？","correct":"BIO-B01-Ch1.1.1-B088:D","options":[{"id":"BIO-B01-Ch1.1.1-B088:A","text":"保留，這是分工的定義","explanation":"分工意味不同細胞有不同工作。"},{"id":"BIO-B01-Ch1.1.1-B088:B","text":"改成每個胞器都能包辦一切","explanation":"胞器只做部分任務。"},{"id":"BIO-B01-Ch1.1.1-B088:C","text":"改成個體活動與細胞完全無關","explanation":"個體活動以細胞活動為基礎。"},{"id":"BIO-B01-Ch1.1.1-B088:D","text":"不同細胞可專門化，透過合作支持個體功能","explanation":"專門化與合作符合多細胞組織。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第3頁（正式第5張，12_imagegen_page_05.png）; 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B089","topicId":"","stem":"「細胞是最小完整生命功能單位」中的「最小」，主要相對於何者而言？","correct":"BIO-B01-Ch1.1.1-B089:A","options":[{"id":"BIO-B01-Ch1.1.1-B089:A","text":"分子或胞器雖有部分功能，仍不是完整基本生命單位","explanation":"比較的是組織層級與生命活動完整性。"},{"id":"BIO-B01-Ch1.1.1-B089:B","text":"任何細胞都必須小到肉眼永遠看不到","explanation":"本節的最小是層級概念，不是這個絕對視覺條件。"},{"id":"BIO-B01-Ch1.1.1-B089:C","text":"所有細胞一定具有完全相同尺寸","explanation":"細胞大小可有差異，定義不要求同尺寸。"},{"id":"BIO-B01-Ch1.1.1-B089:D","text":"細胞內不能有任何更小構造","explanation":"細胞內可有分子與胞器等構造。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B090","topicId":"","stem":"某物件能執行一項生物功能，就足以判為完整細胞嗎？","correct":"BIO-B01-Ch1.1.1-B090:C","options":[{"id":"BIO-B01-Ch1.1.1-B090:A","text":"足以，任何功能都代表全部生命活動","explanation":"單項功能不等於生命活動完整性。"},{"id":"BIO-B01-Ch1.1.1-B090:B","text":"足以，胞器就是細胞的另一名稱","explanation":"胞器是細胞內構造，非同義詞。"},{"id":"BIO-B01-Ch1.1.1-B090:C","text":"不足，還須區分部分功能與完整基本生命活動","explanation":"胞器也可有功能，故不能僅憑一項工作判細胞。"},{"id":"BIO-B01-Ch1.1.1-B090:D","text":"不足，因為細胞本來沒有功能","explanation":"細胞能進行基本生命活動。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第2頁（正式第4張，11_imagegen_page_04.png）; 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B091","topicId":"","stem":"一個單細胞生物與一個多細胞個體雖然細胞數不同，何者是兩者共享的基礎？","correct":"BIO-B01-Ch1.1.1-B091:B","options":[{"id":"BIO-B01-Ch1.1.1-B091:A","text":"都必須有葉片","explanation":"動物與單細胞生物不必有葉片。"},{"id":"BIO-B01-Ch1.1.1-B091:B","text":"生命活動以細胞活動為基礎","explanation":"細胞為所有生物的基本結構與功能單位。"},{"id":"BIO-B01-Ch1.1.1-B091:C","text":"都必須有相同器官系統","explanation":"單細胞生物沒有器官系統。"},{"id":"BIO-B01-Ch1.1.1-B091:D","text":"每個細胞都必須不斷分裂","explanation":"並非每個細胞都持續分裂。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B092","topicId":"","stem":"有人以「胞器能做特定工作」反駁細胞基本單位的觀念。哪個回應最有力？","correct":"BIO-B01-Ch1.1.1-B092:D","options":[{"id":"BIO-B01-Ch1.1.1-B092:A","text":"有任何局部功能就代表完整生命","explanation":"局部不等於完整。"},{"id":"BIO-B01-Ch1.1.1-B092:B","text":"細胞只能做一種工作","explanation":"細胞可進行多種基本生命活動。"},{"id":"BIO-B01-Ch1.1.1-B092:C","text":"胞器不能執行任何生物作用","explanation":"胞器確有特定作用。"},{"id":"BIO-B01-Ch1.1.1-B092:D","text":"局部工作與完整基本生命活動屬不同層次，兩者並不矛盾","explanation":"承認胞器功能仍可維持細胞為基本單位。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 5-6 頁（PDF 54-55 頁）｜本節筆記 正文第12頁（正式第14張，21_imagegen_page_14.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B093","topicId":"","stem":"一份原核細胞模式圖顯示DNA所在區域，但沒有膜包圍的細胞核。應如何解讀？","correct":"BIO-B01-Ch1.1.1-B093:A","options":[{"id":"BIO-B01-Ch1.1.1-B093:A","text":"具有DNA與缺少細胞核可以同時成立","explanation":"原核的DNA不被核膜包圍，兩者不矛盾。"},{"id":"BIO-B01-Ch1.1.1-B093:B","text":"既然有DNA就必定是真核","explanation":"DNA並非真核專有。"},{"id":"BIO-B01-Ch1.1.1-B093:C","text":"沒有細胞核就必定沒有DNA","explanation":"缺核不等於缺遺傳物質。"},{"id":"BIO-B01-Ch1.1.1-B093:D","text":"DNA必定是一個完整器官","explanation":"DNA屬分子層級，並非器官。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B094","topicId":"","stem":"比較典型原核與真核細胞時，為何「是否有DNA」不適合作為唯一區分依據？","correct":"BIO-B01-Ch1.1.1-B094:C","options":[{"id":"BIO-B01-Ch1.1.1-B094:A","text":"兩者都必定沒有DNA","explanation":"兩類細胞都有DNA。"},{"id":"BIO-B01-Ch1.1.1-B094:B","text":"DNA只存在於植物葉片","explanation":"DNA不限於葉片。"},{"id":"BIO-B01-Ch1.1.1-B094:C","text":"兩者都有DNA，應關注有無膜包圍細胞核等構造","explanation":"共同特徵不能作唯一分界，核的有無較關鍵。"},{"id":"BIO-B01-Ch1.1.1-B094:D","text":"有DNA就代表是一個生態系","explanation":"DNA有無不決定生態系層級。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B095","topicId":"","stem":"某學生看到典型原核細胞沒有細胞核，推論它不能有基本生命活動。哪個訂正最合理？","correct":"BIO-B01-Ch1.1.1-B095:B","options":[{"id":"BIO-B01-Ch1.1.1-B095:A","text":"正確，沒有細胞核的一律不是生物","explanation":"細菌及古菌是沒有核的生物。"},{"id":"BIO-B01-Ch1.1.1-B095:B","text":"不正確，原核也是細胞；缺核不代表缺DNA或生命活動","explanation":"原核具有細胞結構及DNA，可維持生命活動。"},{"id":"BIO-B01-Ch1.1.1-B095:C","text":"正確，只有細胞核才是完整生命單位","explanation":"基本單位是細胞，不是細胞核。"},{"id":"BIO-B01-Ch1.1.1-B095:D","text":"不正確，但應把原核叫作葉綠體","explanation":"原核細胞不是葉綠體胞器。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B096","topicId":"","stem":"「真核有細胞核，所以原核一定沒有遺傳物質」的錯誤何在？","correct":"BIO-B01-Ch1.1.1-B096:D","options":[{"id":"BIO-B01-Ch1.1.1-B096:A","text":"把分子誤當群集","explanation":"原句不是層級分子群集問題。"},{"id":"BIO-B01-Ch1.1.1-B096:B","text":"把植物誤當器官","explanation":"原句沒有討論植物。"},{"id":"BIO-B01-Ch1.1.1-B096:C","text":"把生物圈誤當族群","explanation":"原句沒有全球或族群尺度。"},{"id":"BIO-B01-Ch1.1.1-B096:D","text":"把「缺少細胞核」誤推成「缺少DNA」","explanation":"原核仍有DNA，核的有無與DNA的有無應分開。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B097","topicId":"","stem":"典型細菌細胞與典型動物細胞都有DNA。下列哪項比較仍符合本節？","correct":"BIO-B01-Ch1.1.1-B097:A","options":[{"id":"BIO-B01-Ch1.1.1-B097:A","text":"動物細胞為真核，細菌細胞為原核；差別不在DNA是否存在","explanation":"兩類皆有DNA，但核及膜狀胞器構造不同。"},{"id":"BIO-B01-Ch1.1.1-B097:B","text":"兩者有DNA，所以兩者一定都為原核","explanation":"DNA非原核專有。"},{"id":"BIO-B01-Ch1.1.1-B097:C","text":"兩者有DNA，所以兩者一定都為真核","explanation":"DNA非真核專有。"},{"id":"BIO-B01-Ch1.1.1-B097:D","text":"細菌細胞必定具有膜包圍細胞核","explanation":"典型細菌屬原核，沒有膜包圍核。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B098","topicId":"","stem":"某說明把古菌寫成「沒有DNA的細胞」。依本節應改成哪句？","correct":"BIO-B01-Ch1.1.1-B098:C","options":[{"id":"BIO-B01-Ch1.1.1-B098:A","text":"古菌必定具有與動物相同的細胞核","explanation":"古菌是原核，不具有膜包圍核。"},{"id":"BIO-B01-Ch1.1.1-B098:B","text":"古菌其實是植物器官","explanation":"古菌是微生物，非植物器官。"},{"id":"BIO-B01-Ch1.1.1-B098:C","text":"古菌屬原核，具有DNA而沒有膜包圍的細胞核","explanation":"同時保留原核分類及DNA存在兩項重點。"},{"id":"BIO-B01-Ch1.1.1-B098:D","text":"古菌只由一個葉綠體構成","explanation":"古菌不是葉綠體組成的器官。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B099","topicId":"","stem":"在一張典型細胞比較表中，甲有膜包圍的細胞核及膜狀胞器；乙有DNA，但缺少這些膜包圍構造。依本節分類何者正確？","correct":"BIO-B01-Ch1.1.1-B099:B","options":[{"id":"BIO-B01-Ch1.1.1-B099:A","text":"甲原核、乙真核","explanation":"兩種類型被顛倒。"},{"id":"BIO-B01-Ch1.1.1-B099:B","text":"甲真核、乙原核","explanation":"典型真核有核與膜狀胞器，原核缺少它們但有DNA。"},{"id":"BIO-B01-Ch1.1.1-B099:C","text":"甲族群、乙群集","explanation":"兩者都是細胞類型，不是生態集合。"},{"id":"BIO-B01-Ch1.1.1-B099:D","text":"甲乙都必定沒有DNA","explanation":"題幹已指出乙有DNA，甲核也含DNA。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B100","topicId":"","stem":"原核模式圖以「核區／擬核」標出DNA所在位置，何者最妥當？","correct":"BIO-B01-Ch1.1.1-B100:D","options":[{"id":"BIO-B01-Ch1.1.1-B100:A","text":"核區一定就是膜包圍的細胞核","explanation":"核區與真核細胞核不能等同。"},{"id":"BIO-B01-Ch1.1.1-B100:B","text":"有這個標籤就代表沒有任何DNA","explanation":"此標籤恰在表示DNA區域。"},{"id":"BIO-B01-Ch1.1.1-B100:C","text":"核區表示整個細胞已變成一個器官","explanation":"細胞內區域名稱不改變層級。"},{"id":"BIO-B01-Ch1.1.1-B100:D","text":"標出DNA所在區域，不表示具有膜包圍的細胞核","explanation":"DNA區域可以沒有核膜包圍，符合原核構造。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁（正式第15張，22_imagegen_page_15.png）","shuffle":true}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"bio-chapter-01-concept-1-1-child-02-theme-life-s-processes-involve-the-expression-and- 承，未描述RNA功能。"},{"id":"BIO-B01-Ch1.1.2-S003:C","text":"資訊傳遞","explanation":"母細胞到子細胞的資訊延續屬傳遞。"},{"id":"BIO-B01-Ch1.1.2-S003:D","text":"序列分析軟體","explanation":"此敘述沒有運算分析。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S004","topicId":"","stem":"以下哪個動詞最符合「DNA 序列保有遺傳訊息」？","correct":"BIO-B01-Ch1.1.2-S004:D","options":[{"id":"BIO-B01-Ch1.1.2-S004:A","text":"折射","explanation":"折射不是DNA保存訊息的名稱。"},{"id":"BIO-B01-Ch1.1.2-S004:B","text":"依mRNA資訊合成胺基酸鏈","explanation":"依mRNA合成胺基酸鏈屬轉譯。"},{"id":"BIO-B01-Ch1.1.2-S004:C","text":"染色","explanation":"染色是觀察方法，不是訊息保存本身。"},{"id":"BIO-B01-Ch1.1.2-S004:D","text":"儲存","explanation":"訊息維持在序列中即資訊儲存。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S005","topicId":"","stem":"理解遺傳資訊時，哪一種說法最合適？","correct":"BIO-B01-Ch1.1.2-S005:A","options":[{"id":"BIO-B01-Ch1.1.2-S005:A","text":"DNA 重要，但生命結果也受表現與環境等因素影響","explanation":"DNA提供資訊，表現及其他因素也參與結果形成。"},{"id":"BIO-B01-Ch1.1.2-S005:B","text":"有DNA便不必製造細胞產物","explanation":"資訊必須被細胞使用才能產生相應產物。"},{"id":"BIO-B01-Ch1.1.2-S005:C","text":"所有性狀只由DNA單獨決定","explanation":"這把複雜生命現象過度簡化。"},{"id":"BIO-B01-Ch1.1.2-S005:D","text":"DNA資訊與細胞功能毫無關聯","explanation":"基因資訊能透過產物影響細胞功能。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S006","topicId":"","stem":"在染色體上的DNA中，一段提供細胞製造產物資訊的序列，稱為什麼？","correct":"BIO-B01-Ch1.1.2-S006:D","options":[{"id":"BIO-B01-Ch1.1.2-S006:A","text":"蛋白體","explanation":"蛋白體是蛋白質集合。"},{"id":"BIO-B01-Ch1.1.2-S006:B","text":"整套基因體","explanation":"一段功能序列不等於整套DNA資訊。"},{"id":"BIO-B01-Ch1.1.2-S006:C","text":"單一胺基酸","explanation":"胺基酸是蛋白質的組成單位。"},{"id":"BIO-B01-Ch1.1.2-S006:D","text":"基因","explanation":"基因是DNA上具有產物資訊的一段。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S007","topicId":"","stem":"下列哪個關係符合本節介紹？","correct":"BIO-B01-Ch1.1.2-S007:A","options":[{"id":"BIO-B01-Ch1.1.2-S007:A","text":"染色體含DNA，DNA上可有許多基因","explanation":"這正確區分細胞結構、分子與功能序列。"},{"id":"BIO-B01-Ch1.1.2-S007:B","text":"基因由許多完整染色體組成","explanation":"層級關係顛倒，基因是DNA片段。"},{"id":"BIO-B01-Ch1.1.2-S007:C","text":"DNA是蛋白質的另一個名稱","explanation":"DNA是核酸，不是蛋白質。"},{"id":"BIO-B01-Ch1.1.2-S007:D","text":"一個核苷酸就是整個基因體","explanation":"單一基本單位不等於整套遺傳資訊。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S008","topicId":"","stem":"在一般真核細胞的未複製染色體中，長的雙股DNA分子有幾個？","correct":"BIO-B01-Ch1.1.2-S008:B","options":[{"id":"BIO-B01-Ch1.1.2-S008:A","text":"兩個，因為有兩股","explanation":"同一DNA的兩股不是兩個DNA分子。"},{"id":"BIO-B01-Ch1.1.2-S008:B","text":"一個","explanation":"本節的未複製染色體含一個長雙股DNA分子。"},{"id":"BIO-B01-Ch1.1.2-S008:C","text":"零個，只有蛋白質","explanation":"染色體含DNA。"},{"id":"BIO-B01-Ch1.1.2-S008:D","text":"每個基因各自是一整個DNA分子","explanation":"一個長DNA分子上可含多個基因。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S009","topicId":"","stem":"本節把DNA定位為哪一類分子？","correct":"BIO-B01-Ch1.1.2-S009:C","options":[{"id":"BIO-B01-Ch1.1.2-S009:A","text":"完整細胞","explanation":"DNA是分子，不是整個細胞。"},{"id":"BIO-B01-Ch1.1.2-S009:B","text":"蛋白質集合","explanation":"蛋白質集合屬蛋白體。"},{"id":"BIO-B01-Ch1.1.2-S009:C","text":"儲存遺傳資訊的核酸","explanation":"DNA即去氧核糖核酸，其序列攜帶資訊。"},{"id":"BIO-B01-Ch1.1.2-S009:D","text":"已形成的性狀","explanation":"DNA提供性狀形成所需資訊，不是性狀成品。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S010","topicId":"","stem":"「基因」「DNA」「染色體」三個名稱應如何使用？","correct":"BIO-B01-Ch1.1.2-S010:D","options":[{"id":"BIO-B01-Ch1.1.2-S010:A","text":"都代表同一個單一核苷酸","explanation":"三者都不是單一核苷酸的同義詞。"},{"id":"BIO-B01-Ch1.1.2-S010:B","text":"可以在任何句子中互換","explanation":"它們的層級與意義不同，不能任意互換。"},{"id":"BIO-B01-Ch1.1.2-S010:C","text":"只有基因存在，DNA並不存在","explanation":"基因在DNA序列中，不可否定DNA存在。"},{"id":"BIO-B01-Ch1.1.2-S010:D","text":"分別指功能序列、資訊分子與含DNA的結構","explanation":"這種區分能表達本節的包含關係。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S011","topicId":"","stem":"在人類生殖的基本框架中，父母透過什麼把DNA資訊交給下一代？","correct":"BIO-B01-Ch1.1.2-S011:C","options":[{"id":"BIO-B01-Ch1.1.2-S011:A","text":"全部體細胞混合","explanation":"不是把父母全部體細胞混合。"},{"id":"BIO-B01-Ch1.1.2-S011:B","text":"現成的身體性狀","explanation":"遺傳傳遞的是資訊，性狀需經發育形成。"},{"id":"BIO-B01-Ch1.1.2-S011:C","text":"精子與卵等配子","explanation":"配子攜帶DNA，受精時把雙親資訊帶入受精卵。"},{"id":"BIO-B01-Ch1.1.2-S011:D","text":"已折疊的所有蛋白質","explanation":"全部蛋白質不是本節所指的遺傳資訊傳遞單位。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S012","topicId":"","stem":"在一般體細胞分裂前，哪件事有助於子細胞取得DNA拷貝？","correct":"BIO-B01-Ch1.1.2-S012:D","options":[{"id":"BIO-B01-Ch1.1.2-S012:A","text":"DNA改為蛋白質","explanation":"DNA資訊可用來合成蛋白質，但DNA不因此變成蛋白質。"},{"id":"BIO-B01-Ch1.1.2-S012:B","text":"所有基因消失","explanation":"基因消失無法維持資訊傳承。"},{"id":"BIO-B01-Ch1.1.2-S012:C","text":"DNA停止含有資訊","explanation":"資訊必須保留才能交給子細胞。"},{"id":"BIO-B01-Ch1.1.2-S012:D","text":"DNA先被複製","explanation":"先複製再分配可讓子細胞取得遺傳資訊。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S013","topicId":"","stem":"受精卵中的DNA資訊來源，何者符合本節的人類例子？","correct":"BIO-B01-Ch1.1.2-S013:A","options":[{"id":"BIO-B01-Ch1.1.2-S013:A","text":"來自精子與卵，包含父方與母方的資訊","explanation":"兩種配子各攜帶一套DNA資訊。"},{"id":"BIO-B01-Ch1.1.2-S013:B","text":"只來自父方的一個體細胞","explanation":"父方透過精子傳遞，且母方也貢獻資訊。"},{"id":"BIO-B01-Ch1.1.2-S013:C","text":"只來自母方所有成熟蛋白質","explanation":"遺傳資訊由DNA攜帶，不是由全部成熟蛋白質替代。"},{"id":"BIO-B01-Ch1.1.2-S013:D","text":"完全由受精卵憑空產生","explanation":"受精卵繼承來自雙親的資訊。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S014","topicId":"","stem":"「子代繼承遺傳資訊」與「直接繼承成品性狀」有何差別？","correct":"BIO-B01-Ch1.1.2-S014:B","options":[{"id":"BIO-B01-Ch1.1.2-S014:A","text":"兩者都指搬移完整器官","explanation":"遺傳不是把成熟器官搬入子代。"},{"id":"BIO-B01-Ch1.1.2-S014:B","text":"前者強調子代使用資訊發育形成性狀","explanation":"基因資訊經表現與發育影響性狀形成。"},{"id":"BIO-B01-Ch1.1.2-S014:C","text":"前者表示子代沒有DNA","explanation":"子代所繼承的正是DNA資訊。"},{"id":"BIO-B01-Ch1.1.2-S014:D","text":"後者是DNA複製的正式定義","explanation":"DNA複製是資訊拷貝，不是搬移成品性狀。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S015","topicId":"","stem":"遺傳資訊除了由親代交給子代，也可在哪個情境中延續？","correct":"BIO-B01-Ch1.1.2-S015:C","options":[{"id":"BIO-B01-Ch1.1.2-S015:A","text":"蛋白質失去形狀時","explanation":"失去形狀不是DNA傳遞的定義。"},{"id":"BIO-B01-Ch1.1.2-S015:B","text":"字母被任意染色時","explanation":"染色不等於遺傳資訊延續。"},{"id":"BIO-B01-Ch1.1.2-S015:C","text":"母細胞分裂並將DNA拷貝交給子細胞時","explanation":"體細胞分裂中的DNA複製與分配支援傳遞。"},{"id":"BIO-B01-Ch1.1.2-S015:D","text":"不含資訊的物件被搬動時","explanation":"缺乏遺傳資訊的搬動不符合本題。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S016","topicId":"","stem":"DNA的A、T、C、G在本節中最常被用來代表什麼？","correct":"BIO-B01-Ch1.1.2-S016:B","options":[{"id":"BIO-B01-Ch1.1.2-S016:A","text":"四種成熟性狀","explanation":"這些字母標示分子基本單位，不是性狀名稱。"},{"id":"BIO-B01-Ch1.1.2-S016:B","text":"四種DNA核苷酸的符號","explanation":"A、T、C、G代表DNA的四種核苷酸。"},{"id":"BIO-B01-Ch1.1.2-S016:C","text":"四個完整染色體","explanation":"單一符號不等於整條染色體。"},{"id":"BIO-B01-Ch1.1.2-S016:D","text":"四種蛋白體","explanation":"蛋白體是蛋白質集合，與這些符號不同。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S017","topicId":"","stem":"DNA資訊的差異最直接與下列哪項有關？","correct":"BIO-B01-Ch1.1.2-S017:C","options":[{"id":"BIO-B01-Ch1.1.2-S017:A","text":"顯微鏡底座的顏色","explanation":"工具外觀不能決定序列資訊。"},{"id":"BIO-B01-Ch1.1.2-S017:B","text":"紙上的畫幅大小","explanation":"示意圖尺寸不是資訊內容。"},{"id":"BIO-B01-Ch1.1.2-S017:C","text":"核苷酸的排列順序","explanation":"特定序列承載基因資訊。"},{"id":"BIO-B01-Ch1.1.2-S017:D","text":"DNA名稱使用的字體","explanation":"字體不改變DNA實際序列。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / C 的定義。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S024","topicId":"","stem":"本節的蛋白質合成簡圖中，mRNA主要扮演什麼角色？","correct":"BIO-B01-Ch1.1.2-S024:B","options":[{"id":"BIO-B01-Ch1.1.2-S024:A","text":"直接取代所有DNA","explanation":"mRNA是中介，不取代所有DNA。"},{"id":"BIO-B01-Ch1.1.2-S024:B","text":"傳遞被轉錄出的資訊，供胺基酸鏈合成","explanation":"細胞依mRNA序列資訊進行轉譯。"},{"id":"BIO-B01-Ch1.1.2-S024:C","text":"把成熟性狀搬給子代","explanation":"性狀需發育形成，不是mRNA搬移成品。"},{"id":"BIO-B01-Ch1.1.2-S024:D","text":"一整套染色體的名稱","explanation":"mRNA是RNA分子，不是全套染色體。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S025","topicId":"","stem":"「DNA→mRNA」箭頭在本節應怎麼讀？","correct":"BIO-B01-Ch1.1.2-S025:C","options":[{"id":"BIO-B01-Ch1.1.2-S025:A","text":"DNA分子整個變成蛋白質","explanation":"箭頭指資訊傳遞到RNA的合成，不是DNA變蛋白質。"},{"id":"BIO-B01-Ch1.1.2-S025:B","text":"原DNA必定被完全消耗","explanation":"轉錄不表示原DNA必定消失。"},{"id":"BIO-B01-Ch1.1.2-S025:C","text":"以DNA資訊為依據合成mRNA","explanation":"DNA作為模板，資訊被轉錄成mRNA。"},{"id":"BIO-B01-Ch1.1.2-S025:D","text":"所有基因都直接形成成品性狀","explanation":"這個箭頭沒有表示全部性狀成品。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S026","topicId":"","stem":"胺基酸鏈形成特定形狀與功能的蛋白質，與哪個過程有關？","correct":"BIO-B01-Ch1.1.2-S026:B","options":[{"id":"BIO-B01-Ch1.1.2-S026:A","text":"把基因改成染色體","explanation":"基因與染色體是不同層級，不是此過程。"},{"id":"BIO-B01-Ch1.1.2-S026:B","text":"蛋白質折疊","explanation":"胺基酸鏈折疊有助形成蛋白質的特定形狀。"},{"id":"BIO-B01-Ch1.1.2-S026:C","text":"把蛋白質稱為DNA","explanation":"名稱更換不產生正確結構。"},{"id":"BIO-B01-Ch1.1.2-S026:D","text":"配子攜帶整個器官","explanation":"本題未涉及配子或器官傳遞。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S027","topicId":"","stem":"水晶體細胞中的晶狀體蛋白（crystallin）在本節作為哪項例子？","correct":"BIO-B01-Ch1.1.2-S027:C","options":[{"id":"BIO-B01-Ch1.1.2-S027:A","text":"蛋白質變成DNA","explanation":"crystallin由資訊指導合成，不是回變成DNA。"},{"id":"BIO-B01-Ch1.1.2-S027:B","text":"所有RNA都要轉譯的證明","explanation":"這個蛋白質例子不涵蓋所有RNA。"},{"id":"BIO-B01-Ch1.1.2-S027:C","text":"基因資訊可透過蛋白質影響細胞功能","explanation":"crystallin可幫助水晶體維持透明與折射光線。"},{"id":"BIO-B01-Ch1.1.2-S027:D","text":"每個基因都是一個完整器官","explanation":"基因只是DNA片段，不能等同完整器官。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S028","topicId":"","stem":"有些基因產生的RNA本身就能發揮作用。這表示什麼？","correct":"BIO-B01-Ch1.1.2-S028:D","options":[{"id":"BIO-B01-Ch1.1.2-S028:A","text":"RNA一定是無功能的廢物","explanation":"來源明示某些RNA有功能。"},{"id":"BIO-B01-Ch1.1.2-S028:B","text":"所有基因都只編碼蛋白質","explanation":"功能性RNA否定了這個全稱說法。"},{"id":"BIO-B01-Ch1.1.2-S028:C","text":"這些RNA必須先變成DNA才算產物","explanation":"RNA可以直接作為功能產物，不需先變DNA。"},{"id":"BIO-B01-Ch1.1.2-S028:D","text":"基因表現的功能產物不只蛋白質","explanation":"基因可產生功能性RNA，也可編碼蛋白質。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S029","topicId":"","stem":"哪項是本節提到的功能性RNA作用？","correct":"BIO-B01-Ch1.1.2-S029:A","options":[{"id":"BIO-B01-Ch1.1.2-S029:A","text":"參與蛋白質製造的細胞機器，或調控某些基因功能","explanation":"這是本節指出的兩類RNA功能。"},{"id":"BIO-B01-Ch1.1.2-S029:B","text":"充當親代全部成熟器官","explanation":"RNA是分子，不能等同器官全集。"},{"id":"BIO-B01-Ch1.1.2-S029:C","text":"必定將所有DNA拆除","explanation":"本節沒有說RNA必須消除全部DNA。"},{"id":"BIO-B01-Ch1.1.2-S029:D","text":"只作無資訊的顏色標籤","explanation":"功能性RNA不只是顏色標籤。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S030","topicId":"","stem":"蛋白質與細胞功能的關係，哪項最合適？","correct":"BIO-B01-Ch1.1.2-S030:B","options":[{"id":"BIO-B01-Ch1.1.2-S030:A","text":"蛋白質完全不參與細胞活動","explanation":"蛋白質是許多細胞功能的重要執行者。"},{"id":"BIO-B01-Ch1.1.2-S030:B","text":"許多蛋白質參與細胞構造、維持與活動","explanation":"本節用多種蛋白質功能建立資訊到功能的關係。"},{"id":"BIO-B01-Ch1.1.2-S030:C","text":"只有DNA具有功能，其他分子都不重要","explanation":"這忽略RNA與蛋白質等產物的角色。"},{"id":"BIO-B01-Ch1.1.2-S030:D","text":"蛋白質就是所有遺傳資訊的總和","explanation":"整套遺傳資訊指基因體，不是蛋白質。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S031","topicId":"","stem":"本節所說的「遺傳密碼」主要是指什麼？","correct":"BIO-B01-Ch1.1.2-S031:D","options":[{"id":"BIO-B01-Ch1.1.2-S031:A","text":"某個體全部DNA的實際序列","explanation":"特定序列內容和解讀規則需區分。"},{"id":"BIO-B01-Ch1.1.2-S031:B","text":"染色體照片的編號","explanation":"照片編號不是生物的解讀規則。"},{"id":"BIO-B01-Ch1.1.2-S031:C","text":"每種生物的顏色名稱","explanation":"外觀顏色不是遺傳密碼的定義。"},{"id":"BIO-B01-Ch1.1.2-S031:D","text":"核苷酸資訊如何被解讀的規則","explanation":"遺傳密碼是核苷酸序列被解讀的規則。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S032","topicId":"","stem":"不同生命形式使用遺傳密碼的情形，哪項符合本節？","c },{"id":"BIO-B01-Ch1.1.2-S046:C","text":"完全不含DNA的資料","explanation":"基因體學研究與DNA資訊相關的資料。"},{"id":"BIO-B01-Ch1.1.2-S046:D","text":"親代全部成熟器官的直接搬移","explanation":"生殖不是成熟器官搬移，也不是基因體學定義。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S047","topicId":"","stem":"研究蛋白質集合及其性質的領域稱為什麼？","correct":"BIO-B01-Ch1.1.2-S047:B","options":[{"id":"BIO-B01-Ch1.1.2-S047:A","text":"僅指DNA複製","explanation":"複製是DNA拷貝產生，不是研究蛋白質集合。"},{"id":"BIO-B01-Ch1.1.2-S047:B","text":"蛋白體學","explanation":"蛋白體學的對象是蛋白質集合及其性質。"},{"id":"BIO-B01-Ch1.1.2-S047:C","text":"遺傳密碼本身","explanation":"遺傳密碼是解讀規則，不是研究領域名稱。"},{"id":"BIO-B01-Ch1.1.2-S047:D","text":"配子融合","explanation":"配子融合屬生殖，不是蛋白集合研究。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S048","topicId":"","stem":"某細胞、組織或生物體表現出的一整套蛋白質，稱為什麼？","correct":"BIO-B01-Ch1.1.2-S048:C","options":[{"id":"BIO-B01-Ch1.1.2-S048:A","text":"單一核苷酸","explanation":"蛋白質集合不是DNA基本單位。"},{"id":"BIO-B01-Ch1.1.2-S048:B","text":"基因體","explanation":"基因體是整套DNA資訊。"},{"id":"BIO-B01-Ch1.1.2-S048:C","text":"蛋白體","explanation":"蛋白體是指定生物層級表現出的蛋白質集合。"},{"id":"BIO-B01-Ch1.1.2-S048:D","text":"一條mRNA","explanation":"單一mRNA不是蛋白質全集。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S049","topicId":"","stem":"生物資訊學在本節主要指什麼？","correct":"BIO-B01-Ch1.1.2-S049:D","options":[{"id":"BIO-B01-Ch1.1.2-S049:A","text":"把DNA直接做成器官","explanation":"生物資訊學是資料處理與分析，不是分子變器官。"},{"id":"BIO-B01-Ch1.1.2-S049:B","text":"只挑選資料庫外觀顏色","explanation":"外觀設計不是其核心定義。"},{"id":"BIO-B01-Ch1.1.2-S049:C","text":"完全不用資料的猜測","explanation":"此領域需要實際生物資料。"},{"id":"BIO-B01-Ch1.1.2-S049:D","text":"運用計算工具儲存、整理與分析生物資料","explanation":"本節明示計算工具的儲存、整理與分析作用。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S050","topicId":"","stem":"高通量技術的特色為何？","correct":"BIO-B01-Ch1.1.2-S050:A","options":[{"id":"BIO-B01-Ch1.1.2-S050:A","text":"能快速分析大量生物樣本","explanation":"大量且快速的樣本分析可產生大量資料。"},{"id":"BIO-B01-Ch1.1.2-S050:B","text":"保證每個樣本必定完全相同","explanation":"處理能力不代表樣本內容相同。"},{"id":"BIO-B01-Ch1.1.2-S050:C","text":"不會產生任何資料","explanation":"高通量技術常產生大量資料。"},{"id":"BIO-B01-Ch1.1.2-S050:D","text":"只要資料多就不用分析","explanation":"資料量增加更需要適切整理與分析。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1.1.2-B001","topicId":"","stem":"某細胞保有一個基因，但觀察期間沒有讀出該基因的資訊。只根據這項描述，可確定什麼？","correct":"BIO-B01-Ch1.1.2-B001:B","options":[{"id":"BIO-B01-Ch1.1.2-B001:A","text":"該基因已完成表現","explanation":"存在基因不表示當時有產物形成。"},{"id":"BIO-B01-Ch1.1.2-B001:B","text":"該基因資訊存在，不等於當下已被表現","explanation":"儲存與資訊使用須分開判斷。"},{"id":"BIO-B01-Ch1.1.2-B001:C","text":"該細胞必定沒有DNA","explanation":"題幹明示細胞保有基因。"},{"id":"BIO-B01-Ch1.1.2-B001:D","text":"該基因必定已傳給子代","explanation":"沒有生殖或分裂資料，無法認定已傳遞。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B002","topicId":"","stem":"紀錄甲是DNA拷貝被分配到新細胞；紀錄乙是細胞依基因資訊製造RNA。兩者分別最直接屬於什麼？","correct":"BIO-B01-Ch1.1.2-B002:C","options":[{"id":"BIO-B01-Ch1.1.2-B002:A","text":"甲表現、乙傳遞","explanation":"這把分配DNA與產生RNA的意義顛倒。"},{"id":"BIO-B01-Ch1.1.2-B002:B","text":"甲與乙都是DNA消失","explanation":"兩件事都不要求原DNA消失。"},{"id":"BIO-B01-Ch1.1.2-B002:C","text":"甲傳遞、乙表現","explanation":"甲延續資訊；乙使用資訊形成產物。"},{"id":"BIO-B01-Ch1.1.2-B002:D","text":"甲與乙都是成品性狀搬移","explanation":"遺傳資訊及細胞產物不能等同性狀搬移。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B003","topicId":"","stem":"同學用「書中保存指令、讀取指令製作物品、把指令副本交給另一人」作比喻。三步依序對應什麼？","correct":"BIO-B01-Ch1.1.2-B003:D","options":[{"id":"BIO-B01-Ch1.1.2-B003:A","text":"表現、傳遞、儲存","explanation":"保存指令的第一步屬儲存。"},{"id":"BIO-B01-Ch1.1.2-B003:B","text":"傳遞、儲存、表現","explanation":"傳出副本是在第三步。"},{"id":"BIO-B01-Ch1.1.2-B003:C","text":"儲存、傳遞、表現","explanation":"製作物品代表使用資訊，應對應表現。"},{"id":"BIO-B01-Ch1.1.2-B003:D","text":"儲存、表現、傳遞","explanation":"保存、使用、交出副本分別對應這三種功能。"}],"concept":"","example":"同一本食譜可保存做法，也可被讀取或複印。","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B004","topicId":"","stem":"實驗記錄顯示某DNA片段仍在細胞中，但對應功能產物減少。哪個解釋符合本節框架？","correct":"BIO-B01-Ch1.1.2-B004:A","options":[{"id":"BIO-B01-Ch1.1.2-B004:A","text":"資訊仍可保存，產物量的改變可能涉及資訊使用過程","explanation":"資訊的存在與表現結果是不同層面。"},{"id":"BIO-B01-Ch1.1.2-B004:B","text":"產物減少證明DNA必定全部消失","explanation":"題幹指出DNA仍在，不能宣稱全數消失。"},{"id":"BIO-B01-Ch1.1.2-B004:C","text":"DNA與產物必定是同一種分子","explanation":"DNA是核酸，產物可為RNA或蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B004:D","text":"只要DNA存在，產物量就永遠不變","explanation":"表現結果不由有無DNA這一項條件完全決定。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B005","topicId":"","stem":"某個新形成的體細胞得到DNA拷貝，之後利用其中基因製造蛋白質。先後發生的資訊功能為何？","correct":"BIO-B01-Ch1.1.2-B005:B","options":[{"id":"BIO-B01-Ch1.1.2-B005:A","text":"先蛋白體學，後遺傳密碼改變","explanation":"題幹未涉及研究領域或密碼規則改變。"},{"id":"BIO-B01-Ch1.1.2-B005:B","text":"先傳遞，後表現","explanation":"先取得DNA資訊，再使用資訊形成產物。"},{"id":"BIO-B01-Ch1.1.2-B005:C","text":"先表現，後儲存且失去DNA","explanation":"取得DNA拷貝在前，且不意味失去DNA。"},{"id":"BIO-B01-Ch1.1.2-B005:D","text":"先性狀搬移，後基因消失","explanation":"遺傳不是搬入成品性狀，也不需基因消失。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B006","topicId":"","stem":"模型把DNA稱為「可保存也可使用的指令」。哪一項觀察最直接代表使用指令？","correct":"BIO-B01-Ch1.1.2-B006:C","options":[{"id":"BIO-B01-Ch1.1.2-B006:A","text":"顯示DNA仍存在的照片","explanation":"DNA存在較直接涉及資訊保存。"},{"id":"BIO-B01-Ch1.1.2-B006:B","text":"記錄DNA拷貝進入子細胞","explanation":"把拷貝交到子細胞是傳遞。"},{"id":"BIO-B01-Ch1.1.2-B006:C","text":"細胞依某基因資訊產生功能性RNA","explanation":"形成受基因資訊指導的產物屬表現。"},{"id":"BIO-B01-Ch1.1.2-B006:D","text":"測得DNA分子長度","explanation":"長度測量未直接顯示資訊被使用。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B007","topicId":"","stem":"甲只比較DNA序列是否保留；乙追蹤基因資訊是否產生產物。兩者關注的問題應如何分別命名？","correct":"BIO-B01-Ch1.1.2-B007:D","options":[{"id":"BIO-B01-Ch1.1.2-B007:A","text":"甲與乙都是配子融合","explanation":"兩者都未描述配子融合。"},{"id":"BIO-B01-Ch1.1.2-B007:B","text":"甲表現，乙儲存","explanation":"甲看保存，乙看產物，順序相反。"},{"id":"BIO-B01-Ch1.1.2-B007:C","text":"甲轉譯，乙染色","explanation":"序列保留不是轉譯；形成產物不是染色。"},{"id":"BIO-B01-Ch1.1.2-B007:D","text":"甲資訊保存，乙資訊表現","explanation":"題幹以序列保留和產物形成區分兩個層面。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B008","topicId":"","stem":"兩群細胞有相近的遺傳資訊，卻在不同條件下出現不同功能。哪個結論最合理？","correct":"BIO-B01-Ch1.1.2-B008:A","options":[{"id":"BIO-B01-Ch1.1.2-B008:A","text":"還需考慮基因表現與環境等因素","explanation":"資訊相近不排除表現與條件造成差異。"},{"id":"BIO-B01-Ch1.1.2-B008:B","text":"DNA資訊必然完全相反","explanation":"題幹不支持完全相反的序列。"},{"id":"BIO-B01-Ch1.1.2-B008:C","text":"任何細胞功能都與DNA無關","explanation":"DNA仍可提供功能所需資訊。"},{"id":"BIO-B01-Ch1.1.2-B008:D","text":"相近DNA必然造成所有功能完全相同","explanation":"這忽略資訊如何被使用及所處條件。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B009","topicId":"","stem":"一位學生說：「DNA能儲存資訊，因此不需要RNA或蛋白質，細胞就可完成所有功能。」其主要推理錯誤是什麼？","correct":"BIO-B01-Ch1.1.2-B009:B","options":[{"id":"BIO-B01-Ch1.1.2-B009:A","text":"把蛋白質當成研究工具","explanation":"重點是儲存與執行功能的混淆。"},{"id":"BIO-B01-Ch1.1.2-B009:B","text":"把資訊保存誤當成已執行所有功能","explanation":"保存指令不能取代資訊被讀出及產物的功能。"},{"id":"BIO-B01-Ch1.1.2-B009:C","text":"把親代誤當成子代","explanation":"題幹沒有世代身分的比較。"},{"id":"BIO-B01-Ch1.1.2-B009:D","text":"把基因體資料量估得太低","explanation":"沒有數量估計，不能歸因於資料量。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-8 頁（PDF 55-57 頁）｜本節筆記 Ch1.1.2 正式PNG第3、14、15張（正文第1、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B010","topicId":"","stem":"某報告用DNA拷貝在世代間延續的資料，直接宣稱已證明每個基因都在表現。應如何評估？","correct":"BIO-B01-Ch1.1.2-B010:C","options":[{"id":"BIO-B01-Ch1.1.2-B010:A","text":"合理，遺傳傳遞等於所有基因表現","explanation":"傳遞與表現的判準不同。"}, 1-Ch1.1.2-B013","topicId":"","stem":"研究者只截取某染色體DNA上具有產物資訊的一段來分析。若為這個截取部分命名，哪項最精確？","correct":"BIO-B01-Ch1.1.2-B013:C","options":[{"id":"BIO-B01-Ch1.1.2-B013:A","text":"整個個體的蛋白體","explanation":"分析對象是DNA，不是蛋白質集合。"},{"id":"BIO-B01-Ch1.1.2-B013:B","text":"整套基因體","explanation":"只取部分DNA，不能稱為整套。"},{"id":"BIO-B01-Ch1.1.2-B013:C","text":"一個基因區段","explanation":"具產物資訊的DNA片段符合基因概念。"},{"id":"BIO-B01-Ch1.1.2-B013:D","text":"所有染色體的集合","explanation":"一段DNA不等於全套染色體。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B014","topicId":"","stem":"在未複製真核染色體的示意圖中，DNA畫成兩股。有人把它註記為「兩個DNA分子」。應如何修正？","correct":"BIO-B01-Ch1.1.2-B014:D","options":[{"id":"BIO-B01-Ch1.1.2-B014:A","text":"改成兩個基因體","explanation":"雙股不代表兩套基因體。"},{"id":"BIO-B01-Ch1.1.2-B014:B","text":"改成兩條完整染色體","explanation":"同一DNA的兩股不各自成為完整染色體。"},{"id":"BIO-B01-Ch1.1.2-B014:C","text":"刪去所有DNA標籤","explanation":"圖示確實代表DNA，不必刪掉名稱。"},{"id":"BIO-B01-Ch1.1.2-B014:D","text":"改成一個由兩股構成的DNA分子","explanation":"雙股是同一DNA分子的結構特徵。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B015","topicId":"","stem":"某DNA分子上有許多基因。若把其中一個基因當成整條染色體，會混淆什麼？","correct":"BIO-B01-Ch1.1.2-B015:A","options":[{"id":"BIO-B01-Ch1.1.2-B015:A","text":"功能序列片段與承載DNA的較大結構","explanation":"基因是DNA片段，染色體是更大的DNA承載結構。"},{"id":"BIO-B01-Ch1.1.2-B015:B","text":"核苷酸的字母寫法與顏色","explanation":"錯誤不在字母或配色。"},{"id":"BIO-B01-Ch1.1.2-B015:C","text":"精子與卵的融合時間","explanation":"題幹未比較配子的時序。"},{"id":"BIO-B01-Ch1.1.2-B015:D","text":"蛋白體學與高通量技術的速度","explanation":"題幹未涉及研究方法速度。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve
