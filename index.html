.b-variant{--ground:#f3f5f7}

<script id="quiz-data" type="application/json">{"schema":"bio-quiz-schools/v1","baselineSchool":"CMU","schools":[{"code":"CMU","name":"中國醫藥大學","data":{"schema":"bio-quiz-public/v2","school":"CMU","nodes":[{"id":"bio-chapter-01-chapter-introduction","title":"Ch1 章介紹：第1章 演化、生物學的主題與科學探究","version":"B01-v2-20260911:0a7f10ec9fb0bceadcb4","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["Campbell Biology 12e｜第一輪","Ch1 演化、生物學主題與科學探究"],"comparison":{"status":"BASELINE","reason":"中國醫為主要題庫及唯一比對基準。"},"banks":[{"depth":"掃過","target":50,"questions":[{"id":"BIO-B01-Ch1-S001","topicId":"CH1-INTRO-T01","stem":"研究者追蹤食物中的能量如何由草進入草食動物，最直接採用哪個生物學主題？","correct":"BIO-B01-Ch1-S001:A","options":[{"id":"BIO-B01-Ch1-S001:A","text":"能量與物質","explanation":"正確。研究焦點是能量來源與轉移。"},{"id":"BIO-B01-Ch1-S001:B","text":"資訊","explanation":"錯誤。資訊重在遺傳訊息或訊號的使用。"},{"id":"BIO-B01-Ch1-S001:C","text":"組織層級","explanation":"錯誤。組織層級重在部件與整體的尺度。"},{"id":"BIO-B01-Ch1-S001:D","text":"演化","explanation":"錯誤。演化須關注可遺傳特徵的世代變化。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：題目追蹤能量去向，依研究焦點判為能量與物質。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S002","topicId":"CH1-INTRO-T01","stem":"同一個小鼠毛色現象可以研究DNA、捕食風險及數代後可遺傳毛色的比例。這顯示五大主題之間有何關係？","correct":"BIO-B01-Ch1-S002:B","options":[{"id":"BIO-B01-Ch1-S002:A","text":"每一主題都回答完全相同的問題","explanation":"錯誤。各主題的焦點不同，不能視為同義詞。"},{"id":"BIO-B01-Ch1-S002:B","text":"可從不同角度共同解釋一個現象","explanation":"正確。三項研究分別處理資訊、互動與演化，可互補。"},{"id":"BIO-B01-Ch1-S002:C","text":"必須先排除其他主題才能研究","explanation":"錯誤。同一現象可同時具有多個研究角度。"},{"id":"BIO-B01-Ch1-S002:D","text":"各主題只適用固定物種","explanation":"錯誤。主題跨物種使用，並非物種分類。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：DNA連到資訊，捕食連到交互作用，跨代比例連到演化，三者可以並行。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S003","topicId":"CH1-INTRO-T01","stem":"若研究問題是「不同細胞怎樣合作形成一個器官的功能」，最直接屬於哪個主題？","correct":"BIO-B01-Ch1-S003:C","options":[{"id":"BIO-B01-Ch1-S003:A","text":"能量與物質","explanation":"錯誤。未追蹤能量轉換或物質去向。"},{"id":"BIO-B01-Ch1-S003:B","text":"遺傳資訊","explanation":"錯誤。未以DNA或訊號內容為主要對象。"},{"id":"BIO-B01-Ch1-S003:C","text":"組織層級","explanation":"正確。重點是細胞到器官的部件組織與整體功能。"},{"id":"BIO-B01-Ch1-S003:D","text":"演化","explanation":"錯誤。沒有比較族群跨世代的遺傳變化。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：細胞如何組成器官是跨組織尺度的問題，屬組織層級。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S004","topicId":"CH1-INTRO-T01","stem":"「植物被鼠吃、鼠被猛禽捕食」若用來分析系統成員如何彼此影響，最直接對應哪個主題？","correct":"BIO-B01-Ch1-S004:D","options":[{"id":"BIO-B01-Ch1-S004:A","text":"資訊","explanation":"錯誤。題目沒有追蹤遺傳訊息的使用。"},{"id":"BIO-B01-Ch1-S004:B","text":"演化","explanation":"錯誤。捕食關係本身未交代跨世代遺傳變化。"},{"id":"BIO-B01-Ch1-S004:C","text":"組織層級","explanation":"錯誤。成員關係不等於細胞到器官的組成。"},{"id":"BIO-B01-Ch1-S004:D","text":"交互作用","explanation":"正確。兩段取食關係直接描述成員相互影響。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：此處問成員之間的關係，雖涉及能量移動，最直接焦點仍是交互作用。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S005","topicId":"CH1-INTRO-T01","stem":"學生把「能量與物質」拆成兩項，卻漏掉「資訊」。若要列出完整五大主題，應如何修正？","correct":"BIO-B01-Ch1-S005:A","options":[{"id":"BIO-B01-Ch1-S005:A","text":"合列能量與物質，補回資訊","explanation":"正確。五主題中能量與物質合列，資訊獨立。"},{"id":"BIO-B01-Ch1-S005:B","text":"保留拆項，刪除組織層級","explanation":"錯誤。組織層級是必要主題，不能刪去。"},{"id":"BIO-B01-Ch1-S005:C","text":"只列演化，其餘刪除","explanation":"錯誤。演化雖為核心，其他四主題仍有用。"},{"id":"BIO-B01-Ch1-S005:D","text":"把資訊當作演化的同義詞","explanation":"錯誤。資訊與演化焦點不同，不能互換。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：完整五項為組織層級、資訊、能量與物質、交互作用、演化。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S006","topicId":"CH1-INTRO-T02","stem":"一片葉由表皮等多種組織構成，並共同執行特定功能。這片葉最適合歸於哪個層級？","correct":"BIO-B01-Ch1-S006:B","options":[{"id":"BIO-B01-Ch1-S006:A","text":"胞器","explanation":"錯誤。胞器是細胞內的功能性構造。"},{"id":"BIO-B01-Ch1-S006:B","text":"器官","explanation":"正確。多種組織組成並共同執行功能，符合器官。"},{"id":"BIO-B01-Ch1-S006:C","text":"細胞","explanation":"錯誤。細胞是組成組織的單位，尺度較小。"},{"id":"BIO-B01-Ch1-S006:D","text":"族群","explanation":"錯誤。族群指同地同種的個體集合。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：依「多種組織組成」辨認器官；胞器位於細胞內，兩者的組成尺度不同。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S007","topicId":"CH1-INTRO-T02","stem":"某湖同一時間生活的同種魚，作為一個集合研究，最直接是哪個層級？","correct":"BIO-B01-Ch1-S007:C","options":[{"id":"BIO-B01-Ch1-S007:A","text":"群集","explanation":"錯誤。群集包含多物種族群，不只一種魚。"},{"id":"BIO-B01-Ch1-S007:B","text":"生態系","explanation":"錯誤。生態系還包含非生物環境及交互作用。"},{"id":"BIO-B01-Ch1-S007:C","text":"族群","explanation":"正確。同地同種個體的集合是族群。"},{"id":"BIO-B01-Ch1-S007:D","text":"器官系統","explanation":"錯誤。器官系統是個體內的器官協作。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：題目限定同湖同種魚，集合邊界符合族群。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S008","topicId":"CH1-INTRO-T02","stem":"若調查包含池塘中的各種生物，以及水、光和土壤對它們的影響，研究對象最完整地屬於哪個層級？","correct":"BIO-B01-Ch1-S008:D","options":[{"id":"BIO-B01-Ch1-S008:A","text":"族群","explanation":"錯誤。族群只涵蓋同地同種個體。"},{"id":"BIO-B01-Ch1-S008:B","text":"單一個體","explanation":"錯誤。題目同時包含多物種與環境。"},{"id":"BIO-B01-Ch1-S008:C","text":"組織","explanation":"錯誤。組織是細胞合作構成的較小尺度。"},{"id":"BIO-B01-Ch1-S008:D","text":"生態系","explanation":"正確。生物群集加上相關非生物環境構成生態系。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：加入水、光與土壤的影響，已超過僅列生物的群集範圍。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S009","topicId":"CH1-INTRO-T02","stem":"關於組織層級序列，下列哪項敘述適用於單細胞生物？","correct":"BIO-B01-Ch1-S009:A","options":[{"id":"BIO-B01-Ch1-S009:A","text":"細胞本身可以就是一個個體","explanation":"正確。單一細胞可以完成個體的生命活動。"},{"id":"BIO-B01-Ch1-S009:B","text":"每個個體都必須先形成組織","explanation":"錯誤。組織不是單細胞生物存在的必要條件。"},{"id":"BIO-B01-Ch1-S009:C","text":"每個細胞都包含多種器官","explanation":"錯誤。器官由組織構成，不是細胞內構造。"},{"id":"BIO-B01-Ch1-S009:D","text":"缺少器官就不屬於生物","explanation":"錯誤。是否有器官不能作為所有生命的門檻。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：層級是觀察尺度，不能強迫單細胞生物具有動物式中間層級。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S010","topicId":"CH1-INTRO-T02","stem":"只考慮多細胞動物的四個層級，哪個順序由小到大正確？","correct":"BIO-B01-Ch1-S010:B","options":[{"id":"BIO-B01-Ch1-S010:A","text":"個體→器官→組織→細胞","explanation":"錯誤。這是由大到小，與題目方向相反。"},{"id":"BIO-B01-Ch1-S010:B","text":"細胞→組織→器官→個體","explanation":"正確。細胞組成組織，多種組織組成器官，器官屬於個體。"},{"id":"BIO-B01-Ch1-S010:C","text":"組織→細胞→器官→個體","explanation":"錯誤。組織由細胞組成，前兩者顛倒。"},{"id":"BIO-B01-Ch1-S010:D","text":"細胞→器官→組織→個體","explanation":"錯誤。器官由多種組織構成，中間兩者顛倒。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：沿部件到整體判讀四個指定尺度；題目只比較這四項，不聲稱列出所有中間尺度。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S011","topicId":"CH1-INTRO-T03","stem":"已知某細胞功能需要多種部件以特定方式合作，單獨任一部件都不能完成。這最能說明什麼？","correct":"BIO-B01-Ch1-S011:C","options":[{"id":"BIO-B01-Ch1-S011:A","text":"能量循環","explanation":"錯誤。功能合作不能推出能量循環。"},{"id":"BIO-B01-Ch1-S011:B","text":"遺傳資訊與功能無關","explanation":"錯誤。部件合作並不否定遺傳資訊的作用。"},{"id":"BIO-B01-Ch1-S011:C","text":"湧現性質","explanation":"正確。整體因部件組織與互動具有新功能。"},{"id":"BIO-B01-Ch1-S011:D","text":"個體主動演化","explanation":"錯誤。未涉及族群跨代變化，也不是個體主動變化。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：整體具有孤立部件沒有的功能，符合湧現性質的判準。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S012","topicId":"CH1-INTRO-T03","stem":"兩組細胞部件種類與數量相同，但連接方式不同，功能也不同。最合理的解釋為何？","correct":"BIO-B01-Ch1-S012:D","options":[{"id":"BIO-B01-Ch1-S012:A","text":"只要成分相同功能就應完全相同","explanation":"錯誤。題目已呈現相同成分而功能不同。"},{"id":"BIO-B01-Ch1-S012:B","text":"整體功能只由部件數量決定","explanation":"錯誤。數量相同仍有差異，不能只看數量。"},{"id":"BIO-B01-Ch1-S012:C","text":"部件完全不參與整體功能","explanation":"錯誤。部件仍必要，差異來自其組織方式。"},{"id":"BIO-B01-Ch1-S012:D","text":"排列與互動方式會影響整體功能","explanation":"正確。在成分固定時，組織方式仍能改變功能。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：比較中被改變的是部件關係，故不能只以成分清單預測功能。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S013","topicId":"CH1-INTRO-T03","stem":"將一個生物系統拆成零件研究後，若要理解其湧現性質，還須補充哪方面資料？","correct":"BIO-B01-Ch1-S013:A","options":[{"id":"BIO-B01-Ch1-S013:A","text":"零件在完整系統中的排列與互動","explanation":"正確。湧現性質需看部件在整體中的關係。"},{"id":"BIO-B01-Ch1-S013:B","text":"只再列一次零件名稱","explanation":"錯誤。名稱清單不包含彼此如何協作。"},{"id":"BIO-B01-Ch1-S013:C","text":"只統計零件總重量","explanation":"錯誤。重量不等於功能所需的組織資訊。"},{"id":"BIO-B01-Ch1-S013:D","text":"只確認研究者是否喜歡該模型","explanation":"錯誤。偏好不能取代部件互動證據。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：由部件資料走向整體解釋，需要補上排列、連接與合作關係。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S014","topicId":"CH1-INTRO-T03","stem":"「湧現性質」中的新性質，主要指哪一種新？","correct":"BIO-B01-Ch1-S014:B","options":[{"id":"BIO-B01-Ch1-S014:A","text":"物體重量增加必然得到的性質","explanation":"錯誤。單純增加重量不足以保證新功能。"},{"id":"BIO-B01-Ch1-S014:B","text":"在特定組織與互動下出現的整體性質","explanation":"正確。這裡的新是相對於孤立部件的整體功能。"},{"id":"BIO-B01-Ch1-S014:C","text":"研究者第一次聽過的名詞","explanation":"錯誤。知識是否新奇不是科學定義。"},{"id":"BIO-B01-Ch1-S014:D","text":"任何剛生成的單一分子","explanation":"錯誤。新生成分子不必然代表高層級湧現。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：湧現的判準是部件與整體的性質差異，不是時間上剛出現。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S015","topicId":"CH1-INTRO-T03","stem":"研究者同時量測細胞部件的性質，並觀察它們在完整細胞中如何協作。此作法有何意義？","correct":"BIO-B01-Ch1-S015:C","options":[{"id":"BIO-B01-Ch1-S015:A","text":"證明整體不需要部件","explanation":"錯誤。整體功能仍依賴部件的組織。"},{"id":"BIO-B01-Ch1-S015:B","text":"把所有細胞直接當成生態系","explanation":"錯誤。細胞與生態系皆可視為系統，但不是同一層級。"},{"id":"BIO-B01-Ch1-S015:C","text":"讓部件研究與整體互動研究互補","explanation":"正確。兩種尺度提供不同但可相連的資訊。"},{"id":"BIO-B01-Ch1-S015:D","text":"證明研究部件沒有價值","explanation":"錯誤。量測部件正是有價值的基礎。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：理解材料與理解合作方式可以並行，不必二選一。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S016","topicId":"CH1-INTRO-T04","stem":"比較同種小鼠DNA中的毛色相關變異與毛色表現，最直接是在研究哪個連結？","correct":"BIO-B01-Ch1-S016:D","options":[{"id":"BIO-B01-Ch1-S016:A","text":"熱散失與環境溫度","explanation":"錯誤。此研究焦點不是能量散出。"},{"id":"BIO-B01-Ch1-S016:B","text":"群集與生物圈","explanation":"錯誤。沒有比較生態尺度的集合。"},{"id":"BIO-B01-Ch1-S016:C","text":"個體意願與定向變異","explanation":"錯誤。毛色相關變異不是依意願產生。"},{"id":"BIO-B01-Ch1-S016:D","text":"遺傳資訊與性狀","explanation":"正確。DNA資訊與毛色表現直接相連。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：題目把DNA變異和毛色對照，屬資訊影響性狀的入口。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S017","topicId":"CH1-INTRO-T04","stem":"若某段DNA與毛色差異有關，能直接推出哪項結論？","correct":"BIO-B01-Ch1-S017:A","options":[{"id":"BIO-B01-Ch1-S017:A","text":"這段遺傳資訊可能影響毛色","explanation":"正確。局部遺傳資訊與特定性狀可有關聯。"},{"id":"BIO-B01-Ch1-S017:B","text":"小鼠全部DNA都只控制毛色","explanation":"錯誤。一段DNA的功能不能推廣到全部DNA。"},{"id":"BIO-B01-Ch1-S017:C","text":"環境完全不影響毛色的生存價值","explanation":"錯誤。背景與捕食關係仍影響毛色是否有利。"},{"id":"BIO-B01-Ch1-S017:D","text":"所有小鼠必須具有相同毛色","explanation":"錯誤。DNA存在變異可伴隨性狀差異。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：把結論限制在相關DNA與毛色的連結，不延伸成全部DNA功能。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S018","topicId":"CH1-INTRO-T04","stem":"小鼠具有淡色毛，但它是否容易被發現還取決於沙土顏色。這提醒我們什麼？","correct":"BIO-B01-Ch1-S018:B","options":[{"id":"BIO-B01-Ch1-S018:A","text":"淡色毛在每種背景都同樣有利","explanation":"錯誤。是否有利取決於與背景的匹配。"},{"id":"BIO-B01-Ch1-S018:B","text":"基因影響性狀，環境影響該性狀的效果","explanation":"正確。毛色來源與毛色在環境中的效果是不同問題。"},{"id":"BIO-B01-Ch1-S018:C","text":"既然有基因作用，環境就不重要","explanation":"錯誤。背景會改變隱蔽程度，不能排除環境。"},{"id":"BIO-B01-Ch1-S018:D","text":"只要環境有作用，DNA就沒有資訊","explanation":"錯誤。環境作用不會取消遺傳資訊。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：資訊與交互作用能同時解釋毛色及其效果。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S019","topicId":"CH1-INTRO-T04","stem":"「與毛色相關的基因變異影響黑色素產生」最適當的解讀為何？","correct":"BIO-B01-Ch1-S019:C","options":[{"id":"BIO-B01-Ch1-S019:A","text":"所有基因都會變成毛髮","explanation":"錯誤。基因的資訊作用不表示基因物質直接變成毛髮。"},{"id":"BIO-B01-Ch1-S019:B","text":"毛色只由捕食者願望決定","explanation":"錯誤。捕食者可形成選擇壓力，不能以願望指定毛色。"},{"id":"BIO-B01-Ch1-S019:C","text":"DNA中的差異可能連到外表性狀差異","explanation":"正確。遺傳資訊可影響產物並表現在性狀上。"},{"id":"BIO-B01-Ch1-S019:D","text":"黑色素就是DNA的另一個名稱","explanation":"錯誤。黑色素與DNA是不同物質。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：遺傳資訊、色素產生與毛色是可相連的層次，不能把它們視為同一物質。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S020","topicId":"CH1-INTRO-T04","stem":"已知同種小鼠有可遺傳的深、淺毛色差異。下列哪個問題最直接聚焦資訊主題？","correct":"BIO-B01-Ch1-S020:D","options":[{"id":"BIO-B01-Ch1-S020:A","text":"小鼠取食多少植物？","explanation":"錯誤。取食量主要涉及能量物質與互動。"},{"id":"BIO-B01-Ch1-S020:B","text":"哪種背景使小鼠較難被發現？","explanation":"錯誤。背景和可見度最直接涉及環境互動。"},{"id":"BIO-B01-Ch1-S020:C","text":"小鼠在群集裡遇到哪些捕食者？","explanation":"錯誤。捕食者關係最直接屬交互作用。"},{"id":"BIO-B01-Ch1-S020:D","text":"哪些DNA差異與毛色差異相關？","explanation":"正確。DNA差異與性狀關聯是遺傳資訊問題。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：雖然四個問題都能研究小鼠，只有DNA差異問題直接追蹤資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S021","topicId":"CH1-INTRO-T05","stem":"在以植物光合作用為主要能量入口的草地中，哪條能量傳遞方向正確？","correct":"BIO-B01-Ch1-S021:A","options":[{"id":"BIO-B01-Ch1-S021:A","text":"陽光→植物→食草動物","explanation":"正確。植物接收光能，食草動物經取食取得化學能。"},{"id":"BIO-B01-Ch1-S021:B","text":"食草動物→陽光→植物","explanation":"錯誤。動物不是此系統陽光的來源。"},{"id":"BIO-B01-Ch1-S021:C","text":"土壤礦物質→陽光→植物","explanation":"錯誤。礦物質是物質來源，不能代替光能入口。"},{"id":"BIO-B01-Ch1-S021:D","text":"植物散出的熱→陽光→食草動物","explanation":"錯誤。散熱不會形成回到太陽再輸入的食物能量循環。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：沿本題指定的光合入口與取食方向追蹤能量。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S022","topicId":"CH1-INTRO-T05","stem":"生物利用食物化學能做功時，通常還會發生哪個現象？","correct":"BIO-B01-Ch1-S022:B","options":[{"id":"BIO-B01-Ch1-S022:A","text":"只有最末端捕食者才產生熱","explanation":"錯誤。生產者及其他消費者也會散熱。"},{"id":"BIO-B01-Ch1-S022:B","text":"部分能量以熱散入環境","explanation":"正確。做功過程伴隨能量向環境以熱傳遞。"},{"id":"BIO-B01-Ch1-S022:C","text":"所有能量都變成可回收養分","explanation":"錯誤。養分是物質，不能與能量混稱。"},{"id":"BIO-B01-Ch1-S022:D","text":"能量完全消失而不轉換","explanation":"錯誤。能量會轉換，不能說憑空消失。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：熱散失發生在多個能量利用階段，不只在食物關係末端。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S023","topicId":"CH1-INTRO-T05","stem":"能量在生態系常以「流動」描述，主要原因為何？","correct":"BIO-B01-Ch1-S023:C","options":[{"id":"BIO-B01-Ch1-S023:A","text":"分解者將熱全部還原成陽光","explanation":"錯誤。分解者不能把散熱恢復成陽光。"},{"id":"BIO-B01-Ch1-S023:B","text":"物質只可單向通過不能再用","explanation":"錯誤。物質可循環，此項混淆兩者。"},{"id":"BIO-B01-Ch1-S023:C","text":"能量輸入後轉換並以熱散出","explanation":"正確。生態系需要外來能量補充散出的能量。"},{"id":"BIO-B01-Ch1-S023:D","text":"能量在每輪都完整回到生產者","explanation":"錯誤。能量不會像養分完整回收循環。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：區別能量流動與物質循環，要看能量最後散出而需要持續輸入。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S024","topicId":"CH1-INTRO-T05","stem":"植物、草食動物與捕食者都在利用能量維持生命。能量示意圖的熱散失箭頭應如何配置？","correct":"BIO-B01-Ch1-S024:D","options":[{"id":"BIO-B01-Ch1-S024:A","text":"只在捕食者旁標示","explanation":"錯誤。生產者和草食動物同樣散熱。"},{"id":"BIO-B01-Ch1-S024:B","text":"只在草食動物旁標示","explanation":"錯誤。植物與捕食者不能被排除。"},{"id":"BIO-B01-Ch1-S024:C","text":"三者均不應標示","explanation":"錯誤。不標熱會掩蓋能量散出的基本特性。"},{"id":"BIO-B01-Ch1-S024:D","text":"在三者的能量利用處都標示","explanation":"正確。各階層利用能量都可能散出熱。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：每個生物階層都有能量轉換，不能把熱散失集中到末端。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S025","topicId":"CH1-INTRO-T05","stem":"下列哪項最能避免把能量與物質混為一談？","correct":"BIO-B01-Ch1-S025:A","options":[{"id":"BIO-B01-Ch1-S025:A","text":"能量可轉為熱，碳原子可在生物與環境間再利用","explanation":"正確。分別追蹤能量形式及物質原子，概念清楚。"},{"id":"BIO-B01-Ch1-S025:B","text":"熱就是回到土壤的碳原子","explanation":"錯誤。熱是能量傳遞，碳原子是物質。"},{"id":"BIO-B01-Ch1-S025:C","text":"碳循環必須讓能量完整循環","explanation":"錯誤。原子再利用不表示可用能量也回復。"},{"id":"BIO-B01-Ch1-S025:D","text":"植物只需有碳就不再需要能量","explanation":"錯誤。建造與維持生命仍需能量來源。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：碳原子的去向與能量的轉換是兩條可同時追蹤但不能混同的線。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S026","topicId":"CH1-INTRO-T06","stem":"植物落葉被分解後，部分物質回到土壤並被植物再利用。這主要說明什麼？","correct":"BIO-B01-Ch1-S026:B","options":[{"id":"BIO-B01-Ch1-S026:A","text":"同一分子永遠不變","explanation":"錯誤。分解可改變物質的化學形式。"},{"id":"BIO-B01-Ch1-S026:B","text":"物質循環","explanation":"正確。物質經生物與環境交換後再次利用。"},{"id":"BIO-B01-Ch1-S026:C","text":"個體演化","explanation":"錯誤。沒有族群遺傳組成的世代比較。"},{"id":"BIO-B01-Ch1-S026:D","text":"能量無限再生","explanation":"錯誤。物質回收不等於能量無限再生。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：落葉到環境再到植物，符合物質回收路徑。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S027","topicId":"CH1-INTRO-T06","stem":"在物質循環中，分解者最重要的基本角色是哪一項？","correct":"BIO-B01-Ch1-S027:C","options":[{"id":"BIO-B01-Ch1-S027:A","text":"只分解消費者而不處理落葉","explanation":"錯誤。生產者殘體也能成為分解來源。"},{"id":"BIO-B01-Ch1-S027:B","text":"使元素離開宇宙而消失","explanation":"錯誤。元素經轉換與轉移，不是憑空消失。"},{"id":"BIO-B01-Ch1-S027:C","text":"分解遺體及廢物，促進物質回到環境","explanation":"正確。分解作用有助於養分再利用。"},{"id":"BIO-B01-Ch1-S027:D","text":"將所有散熱變回陽光","explanation":"錯誤。分解者也利用能量並散熱。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：分解者連接生物殘體與可再利用的環境物質。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S028","topicId":"CH1-INTRO-T06","stem":"說某碳原子參與循環，是否要求它一直存在於同一種分子？","correct":"BIO-B01-Ch1-S028:D","options":[{"id":"BIO-B01-Ch1-S028:A","text":"要求，否則就不算物質循環","explanation":"錯誤。化學形式改變仍可發生物質循環。"},{"id":"BIO-B01-Ch1-S028:B","text":"要求，且只能留在同一生物","explanation":"錯誤。循環通常涉及生物與環境交換。"},{"id":"BIO-B01-Ch1-S028:C","text":"不要求，因為碳可直接變成陽光","explanation":"錯誤。碳原子不會因循環直接成為陽光。"},{"id":"BIO-B01-Ch1-S028:D","text":"不要求，原子可在不同分子間轉換","explanation":"正確。循環追蹤的是物質，可經不同化學形式。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：物質循環可保留原子而改變其所在分子，並非分子形式不變。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S029","topicId":"CH1-INTRO-T06","stem":"哪組材料都可能成為分解者處理的有機物來源？","correct":"BIO-B01-Ch1-S029:A","options":[{"id":"BIO-B01-Ch1-S029:A","text":"植物落葉與動物排出物","explanation":"正確。生產者殘體及消費者廢物均可提供有機物。"},{"id":"BIO-B01-Ch1-S029:B","text":"陽光與散出的熱","explanation":"錯誤。光和熱不是有機物。"},{"id":"BIO-B01-Ch1-S029:C","text":"純粹的時間與空間","explanation":"錯誤。時間與空間不是可分解的材料。"},{"id":"BIO-B01-Ch1-S029:D","text":"只有活體捕食者而沒有植物來源","explanation":"錯誤。分解來源不限動物，植物殘體也可。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：應辨認實際物質材料，並保留生產者及消費者兩條來源。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S030","topicId":"CH1-INTRO-T06","stem":"「非生物環境→植物→動物→分解者→非生物環境」可作為哪一項的簡化示意？","correct":"BIO-B01-Ch1-S030:B","options":[{"id":"BIO-B01-Ch1-S030:A","text":"植物與動物之間沒有物質交換","explanation":"錯誤。植物被動物取食正會轉移物質。"},{"id":"BIO-B01-Ch1-S030:B","text":"部分物質的循環途徑","explanation":"正確。這是一條合法的物質交換路徑。"},{"id":"BIO-B01-Ch1-S030:C","text":"所有能量的永久回收","explanation":"錯誤。能量沿途轉換並以熱散出。"},{"id":"BIO-B01-Ch1-S030:D","text":"每個原子都必經的唯一途徑","explanation":"錯誤。尚有植物直接到分解者等其他途徑。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：此路徑展示循環，但不代表物質只能依這一條路移動。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S031","topicId":"CH1-INTRO-T07","stem":"研究海灘小鼠是否容易被捕食時，哪項屬於非生物環境因子？","correct":"BIO-B01-Ch1-S031:C","options":[{"id":"BIO-B01-Ch1-S031:A","text":"被小鼠取食的植物","explanation":"錯誤。植物是生物成員。"},{"id":"BIO-B01-Ch1-S031:B","text":"同地其他小鼠","explanation":"錯誤。其他小鼠仍是生物成員。"},{"id":"BIO-B01-Ch1-S031:C","text":"沙地背景顏色","explanation":"正確。沙地顏色屬物理環境。"},{"id":"BIO-B01-Ch1-S031:D","text":"捕食小鼠的猛禽","explanation":"錯誤。猛禽是生物成員。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：將背景顏色與生物成員分開，才能描述環境與生物的互動。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-S032","topicId":"CH1-INTRO-T07","stem":"下列哪句已描述系統中的交互作用，而非僅列出成員？","correct":"BIO-B01-Ch1-S032:D","options":[{"id":"BIO-B01-Ch1-S032:A","text":"草地裡有植物、小鼠和猛禽","explanation":"錯誤。只有存在清單，尚未說明相互影響。"},{"id":"BIO-B01-Ch1-S032:B","text":"樣本清單寫有三種生物","explanation":"錯誤。物種清單本身不包含互動。"},{"id":"BIO-B01-Ch1-S032:C","text":"研究區被命名為甲區","explanation":"錯誤。命名地點不表示成員互動。"},{"id":"BIO-B01-Ch1-S032:D","text":"小鼠吃植物，植物因此受到取食影響","explanation":"正確。取食動作及對植物的影響明示成員關係。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：交互作用需要關係或影響，單列名詞不足。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-S033","topicId":"CH1-INTRO-T07","stem":"把小鼠與其食物、捕食者及沙地背景一起研究，主要能補足哪項資訊？","correct":"BIO-B01-Ch1-S033:A","options":[{"id":"BIO-B01-Ch1-S033:A","text":"個體與周圍系統的關係","explanation":"正確。題目把個體放回生物與非生物環境。"},{"id":"BIO-B01-Ch1-S033:B","text":"小鼠所有DNA的精確序列","explanation":"錯誤。系統關係資料不等於DNA定序。"},{"id":"BIO-B01-Ch1-S033:C","text":"每種器官內所有分子數","explanation":"錯誤。未提供器官分子計數。"},{"id":"BIO-B01-Ch1-S033:D","text":"所有族群的未來必然毛色","explanation":"錯誤。觀察關係不能保證所有未來結果。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：系統視角補足關係脈絡，不自動提供其他尺度的精確資料。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-S034","topicId":"CH1-INTRO-T07","stem":"毛色相近的小鼠放在不同顏色背景時，被發現機會不同。最直接說明哪項觀念？","correct":"BIO-B01-Ch1-S034:B","options":[{"id":"BIO-B01-Ch1-S034:A","text":"背景會立即依需要改寫全部DNA","explanation":"錯誤。背景作用不表示依需要直接改寫DNA。"},{"id":"BIO-B01-Ch1-S034:B","text":"性狀效果與環境脈絡有關","explanation":"正確。相同性狀可因背景改變而產生不同效果。"},{"id":"BIO-B01-Ch1-S034:C","text":"毛色在任何環境效果相同","explanation":"錯誤。題目明示被發現機會不同。"},{"id":"BIO-B01-Ch1-S034:D","text":"只要背景不同就已形成新物種","explanation":"錯誤。可見度差異不等於物種形成。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：此處可以談環境互動，尚不必推論跨代演化或新物種。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-S035","topicId":"CH1-INTRO-T07","stem":"研究者只記錄猛禽捕食小鼠的當日行為，未追蹤後代。最直接有證據支持哪項？","correct":"BIO-B01-Ch1-S035:C","options":[{"id":"BIO-B01-Ch1-S035:A","text":"所有毛色差異均可遺傳","explanation":"錯誤。行為觀察不直接證明毛色可遺傳。"},{"id":"BIO-B01-Ch1-S035:B","text":"下一代必定沒有深色小鼠","explanation":"錯誤。未有後代資料不能斷言下一代組成。"},{"id":"BIO-B01-Ch1-S035:C","text":"存在捕食交互作用","explanation":"正確。當日捕食觀察直接呈現兩者關係。"},{"id":"BIO-B01-Ch1-S035:D","text":"小鼠族群已完成演化","explanation":"錯誤。未有可遺傳特徵的跨代資料。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：把已觀察的捕食關係與尚未驗證的世代結論分開。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-S036","topicId":"CH1-INTRO-T08","stem":"下列哪項最符合生物學中演化的基本尺度？","correct":"BIO-B01-Ch1-S036:D","options":[{"id":"BIO-B01-Ch1-S036:A","text":"一隻鼠吃飽後體重增加","explanation":"錯誤。個體成長不是族群演化的證據。"},{"id":"BIO-B01-Ch1-S036:B","text":"一隻鼠毛上沾了白粉","explanation":"錯誤。外表沾染不是可遺傳組成變化。"},{"id":"BIO-B01-Ch1-S036:C","text":"同一株植物白天與夜晚狀態不同","explanation":"錯誤。短期狀態差異不等同跨世代遺傳變化。"},{"id":"BIO-B01-Ch1-S036:D","text":"族群可遺傳特徵在世代間改變","explanation":"正確。同時具備族群、遺傳性及世代變化。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：演化判讀要同時滿足對象、可遺傳性與世代尺度。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S037","topicId":"CH1-INTRO-T08","stem":"演化如何同時解釋生命的共同性與差異性？","correct":"BIO-B01-Ch1-S037:A","options":[{"id":"BIO-B01-Ch1-S037:A","text":"祖先的繼承可留下共同性，後續累積改變可形成差異","explanation":"正確。繼承與改變可以在同一歷史中並存。"},{"id":"BIO-B01-Ch1-S037:B","text":"有共同祖先就不可能有差異","explanation":"錯誤。後代可在不同時間與環境中累積變化。"},{"id":"BIO-B01-Ch1-S037:C","text":"有差異就表示完全沒有共同祖先","explanation":"錯誤。差異不會直接否定共同來源。"},{"id":"BIO-B01-Ch1-S037:D","text":"所有共同性都只能由相同食物造成","explanation":"錯誤。共同性有遺傳歷史等來源，不能只歸因食物。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：共同祖先與後續分化不是互斥的解釋。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S038","topicId":"CH1-INTRO-T08","stem":"一隻深色小鼠搬到白沙地後，當天仍為深色。這是否違反族群演化的概念？","correct":"BIO-B01-Ch1-S038:B","options":[{"id":"BIO-B01-Ch1-S038:A","text":"不違反，因為演化只研究能量","explanation":"錯誤。演化的焦點是跨代遺傳改變。"},{"id":"BIO-B01-Ch1-S038:B","text":"不違反，演化不要求個體當天主動變色","explanation":"正確。族群演化關注世代間遺傳特徵比例。"},{"id":"BIO-B01-Ch1-S038:C","text":"違反，演化必須在當天完成","explanation":"錯誤。沒有當天完成的要求。"},{"id":"BIO-B01-Ch1-S038:D","text":"違反，演化等同染色","explanation":"錯誤。染色是外表處理，不是演化定義。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：個體未即時變色與族群可能長期改變可同時成立。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S039","topicId":"CH1-INTRO-T08","stem":"若要判斷某性狀比例的改變是否屬於演化，最應補查哪項資訊？","correct":"BIO-B01-Ch1-S039:C","options":[{"id":"BIO-B01-Ch1-S039:A","text":"性狀名稱是否含英文","explanation":"錯誤。命名語言與演化無關。"},{"id":"BIO-B01-Ch1-S039:B","text":"個體是否都朝同一方向移動","explanation":"錯誤。即時移動方向不等於遺傳組成變化。"},{"id":"BIO-B01-Ch1-S039:C","text":"性狀是否可遺傳，以及是否跨世代改變","explanation":"正確。遺傳性及世代變化是核心判準。"},{"id":"BIO-B01-Ch1-S039:D","text":"觀察者是否覺得顏色漂亮","explanation":"錯誤。美感不是演化判定依據。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：先確認比例代表可遺傳差異，且比較尺度為世代。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S040","topicId":"CH1-INTRO-T08","stem":"兩個小鼠族群具有共同祖先，後來在不同環境中累積毛色差異。哪項判斷合理？","correct":"BIO-B01-Ch1-S040:D","options":[{"id":"BIO-B01-Ch1-S040:A","text":"毛色不同必定推翻共同祖先","explanation":"錯誤。性狀差異可由後續演化產生。"},{"id":"BIO-B01-Ch1-S040:B","text":"共同祖先要求全部後代毛色永遠相同","explanation":"錯誤。後代性狀不必永遠保持完全一致。"},{"id":"BIO-B01-Ch1-S040:C","text":"毛色差異必定來自每隻鼠的主動要求","explanation":"錯誤。個體需要不是定向改變的機制。"},{"id":"BIO-B01-Ch1-S040:D","text":"共同祖先與毛色多樣性可以並存","explanation":"正確。繼承共同基礎後仍可累積差異。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：題設的共同來源與後續差異，分別呼應統一性與多樣性。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S041","topicId":"CH1-INTRO-T09","stem":"某毛色差異若要經自然選擇影響後代族群，哪項條件最關鍵？","correct":"BIO-B01-Ch1-S041:A","options":[{"id":"BIO-B01-Ch1-S041:A","text":"差異可遺傳，且影響生存或繁殖成功","explanation":"正確。遺傳性與差異繁殖貢獻連接到世代變化。"},{"id":"BIO-B01-Ch1-S041:B","text":"差異必須讓所有個體同時變色","explanation":"錯誤。天擇篩選差異，不要求所有個體同時改變。"},{"id":"BIO-B01-Ch1-S041:C","text":"差異只需被研究者喜歡","explanation":"錯誤。人類喜好不是本題自然選擇條件。"},{"id":"BIO-B01-Ch1-S041:D","text":"差異必須完全不影響留下後代的機會","explanation":"錯誤。若完全不影響繁殖貢獻，不能以此建立天擇鏈。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：確認可遺傳性後，還需差異生存或繁殖成功。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S042","topicId":"CH1-INTRO-T09","stem":"白沙背景下淡色毛較能隱蔽，這是否表示淡色毛在所有環境都較有利？","correct":"BIO-B01-Ch1-S042:B","options":[{"id":"BIO-B01-Ch1-S042:A","text":"不是，因為毛色永遠不影響生存","explanation":"錯誤。題設已明示毛色能影響隱蔽效果。"},{"id":"BIO-B01-Ch1-S042:B","text":"不是，有利程度取決於當地環境","explanation":"正確。換成深色背景時相對可見度可改變。"},{"id":"BIO-B01-Ch1-S042:C","text":"是，淡色本身代表進步","explanation":"錯誤。演化優勢不是顏色的固定等級。"},{"id":"BIO-B01-Ch1-S042:D","text":"是，所有捕食者都偏好深色","explanation":"錯誤。不能從一種背景推到全部捕食情境。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：有利是性狀與環境的關係，並非性狀的普遍稱號。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S043","topicId":"CH1-INTRO-T09","stem":"哪項敘述最符合自然選擇，而非個體因需要改變？","correct":"BIO-B01-Ch1-S043:C","options":[{"id":"BIO-B01-Ch1-S043:A","text":"捕食者告訴每隻鼠應有的毛色","explanation":"錯誤。捕食造成篩選，不是指令傳達。"},{"id":"BIO-B01-Ch1-S043:B","text":"環境保證所有後代都取得最佳性狀","explanation":"錯誤。天擇不保證每個後代都達到最佳。"},{"id":"BIO-B01-Ch1-S043:C","text":"原有可遺傳差異造成留下後代的機會不同","explanation":"正確。天擇作用於原有差異並影響繁殖貢獻。"},{"id":"BIO-B01-Ch1-S043:D","text":"每隻鼠想到白沙就把遺傳資訊改白","explanation":"錯誤。願望不能被當作定向遺傳變化機制。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：自然選擇的關鍵是差異保留，不是按需求直接創造。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S044","topicId":"CH1-INTRO-T09","stem":"淡色鼠在某地活得較久，但尚無後代資料。要說明長期天擇效應，最重要還需知道什麼？","correct":"BIO-B01-Ch1-S044:D","options":[{"id":"BIO-B01-Ch1-S044:A","text":"小鼠是否知道自己較長壽","explanation":"錯誤。天擇不需要個體有自覺。"},{"id":"BIO-B01-Ch1-S044:B","text":"觀察者是否希望淡色鼠增加","explanation":"錯誤。期望不取代繁殖資料。"},{"id":"BIO-B01-Ch1-S044:C","text":"所有深色鼠是否當天變淡","explanation":"錯誤。個體即時變色不是必要步驟。"},{"id":"BIO-B01-Ch1-S044:D","text":"存活差異是否增加其留下後代的貢獻","explanation":"正確。跨代改變須連接到繁殖貢獻。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：存活優勢需能影響後代貢獻，才完成天擇的跨代因果鏈。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S045","topicId":"CH1-INTRO-T09","stem":"天擇後某性狀在族群中變常見，最恰當的因果說明是哪項？","correct":"BIO-B01-Ch1-S045:A","options":[{"id":"BIO-B01-Ch1-S045:A","text":"帶有該可遺傳性狀的個體相對留下較多後代","explanation":"正確。差異繁殖成功可改變族群性狀比例。"},{"id":"BIO-B01-Ch1-S045:B","text":"性狀因有利就必定在每次遺傳時100%傳下去","explanation":"錯誤。天擇不是自動提高單次遺傳傳遞率。"},{"id":"BIO-B01-Ch1-S045:C","text":"所有個體的每個基因都向同一方向改變","explanation":"錯誤。天擇不要求全部基因定向改變。"},{"id":"BIO-B01-Ch1-S045:D","text":"環境先消除所有遺傳差異才開始作用","explanation":"錯誤。存在可遺傳差異才有可被篩選的基礎。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：把族群比例變化連到不同個體的後代貢獻，而非遺傳率魔法改變。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S046","topicId":"CH1-INTRO-T10","stem":"下列哪一項是可檢驗的生物學假說？","correct":"BIO-B01-Ch1-S046:B","options":[{"id":"BIO-B01-Ch1-S046:A","text":"任何測量都不能對我的說法提出質疑","explanation":"錯誤。拒絕可反駁的觀察不符合可檢驗性。"},{"id":"BIO-B01-Ch1-S046:B","text":"在指定溫度範圍內，溫度升高會改變某植物每日生長量","explanation":"正確。可比較指定條件下的生長量來評估。"},{"id":"BIO-B01-Ch1-S046:C","text":"某植物由永遠無法觀察的力量保護，任何結果都相容","explanation":"錯誤。若任何結果都相容，便缺乏檢驗方式。"},{"id":"BIO-B01-Ch1-S046:D","text":"植物最美的顏色只有我能決定","explanation":"錯誤。個人美感不是此類自然因果假說。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：能指出觀察量和條件，才可把解釋交給資料評估。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S047","topicId":"CH1-INTRO-T10","stem":"假說與預測最恰當的區別是什麼？","correct":"BIO-B01-Ch1-S047:C","options":[{"id":"BIO-B01-Ch1-S047:A","text":"兩者都只能在實驗結束後出現","explanation":"錯誤。可先提出假說與預測再蒐集資料。"},{"id":"BIO-B01-Ch1-S047:B","text":"預測不需要和假說有邏輯關係","explanation":"錯誤。預測應由假說與前提推得。"},{"id":"BIO-B01-Ch1-S047:C","text":"假說提出可能解釋，預測指出條件成立時應看到的結果","explanation":"正確。解釋與條件性結果各有角色。"},{"id":"BIO-B01-Ch1-S047:D","text":"假說是實測數字，預測是已證明定律","explanation":"錯誤。實測數字是資料，預測也不是定律。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：先說為什麼，再說若如此會看到什麼，即可區分兩者。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S048","topicId":"CH1-INTRO-T10","stem":"一次觀察結果符合假說預測，最合理的表述為何？","correct":"BIO-B01-Ch1-S048:D","options":[{"id":"BIO-B01-Ch1-S048:A","text":"假說已永遠被證明且不用再查","explanation":"錯誤。有限測試不能保證永遠正確。"},{"id":"BIO-B01-Ch1-S048:B","text":"其他解釋全部被自動排除","explanation":"錯誤。其他原因可能也產生相同結果。"},{"id":"BIO-B01-Ch1-S048:C","text":"以後任何相反資料都應刪除","explanation":"錯誤。應評估相反資料並修正想法。"},{"id":"BIO-B01-Ch1-S048:D","text":"本次資料支持假說，仍可接受後續檢驗","explanation":"正確。符合預測增加支持，但仍有解釋界限。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：支持不是永久證明，也不代表已檢驗所有替代解釋。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S049","topicId":"CH1-INTRO-T10","stem":"新資料與原假說預測不一致時，哪項作法符合科學探究？","correct":"BIO-B01-Ch1-S049:A","options":[{"id":"BIO-B01-Ch1-S049:A","text":"檢查資料與條件，必要時修正假說再測試","explanation":"正確。探究需讓可靠證據能影響原解釋。"},{"id":"BIO-B01-Ch1-S049:B","text":"只留下與原想法一致的資料","explanation":"錯誤。挑選資料會破壞檢驗。"},{"id":"BIO-B01-Ch1-S049:C","text":"以研究者名氣取代檢驗","explanation":"錯誤。名氣不是觀察或實驗證據。"},{"id":"BIO-B01-Ch1-S049:D","text":"宣告任何不一致都不可能存在","explanation":"錯誤。拒絕不一致會使假說失去可檢驗性。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：先核對測量及前提，再按結果調整解釋，而非先保護答案。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S050","topicId":"CH1-INTRO-T10","stem":"研究者說「若某種物質是生長所需，移除它後生長量應下降」。句中後半段屬於什麼？","correct":"BIO-B01-Ch1-S050:B","options":[{"id":"BIO-B01-Ch1-S050:A","text":"與條件無關的命名","explanation":"錯誤。預期下降與物質所需的前提有關。"},{"id":"BIO-B01-Ch1-S050:B","text":"由假說推得的預測","explanation":"正確。後半段描述條件成立時預期的結果。"},{"id":"BIO-B01-Ch1-S050:C","text":"已經取得的觀察資料","explanation":"錯誤。尚未量測，不是已觀察資料。"},{"id":"BIO-B01-Ch1-S050:D","text":"永遠無法檢驗的宣告","explanation":"錯誤。可比較移除前後的生長量。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：「若原因成立，應看到下降」是條件性預測，實測之後才得到資料。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1-B001","topicId":"CH1-INTRO-T01","stem":"甲研究小鼠毛色相關DNA；乙記錄猛禽如何捕食不同毛色小鼠；丙追蹤可遺傳毛色比例的跨代變化。甲、乙、丙最直接對應的主題依序為何？","correct":"BIO-B01-Ch1-B001:A","options":[{"id":"BIO-B01-Ch1-B001:A","text":"資訊、交互作用、演化","explanation":"正確。依追蹤對象，依序是DNA、捕食關係及跨代變化。"},{"id":"BIO-B01-Ch1-B001:B","text":"演化、資訊、組織層級","explanation":"錯誤。甲不是世代比較，乙也不是資訊內容研究。"},{"id":"BIO-B01-Ch1-B001:C","text":"組織層級、能量與物質、資訊","explanation":"錯誤。DNA關聯不是細胞組成器官，丙明示跨代變化。"},{"id":"BIO-B01-Ch1-B001:D","text":"能量與物質、演化、交互作用","explanation":"錯誤。甲未測能量，乙也未追蹤世代。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：將三個研究各自的觀察量辨認後，才對應主題；不能因都研究小鼠就合成同一主題。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B002","topicId":"CH1-INTRO-T01","stem":"小鼠食入種子後，研究甲追蹤其中碳的去向，研究乙追蹤食物化學能的傳遞。對這兩個研究的分類何者正確？","correct":"BIO-B01-Ch1-B002:B","options":[{"id":"BIO-B01-Ch1-B002:A","text":"兩者都是組織層級，因為都有小鼠","explanation":"錯誤。研究物種相同不代表研究尺度相同。"},{"id":"BIO-B01-Ch1-B002:B","text":"均可歸能量與物質，但追蹤對象不同","explanation":"正確。碳是物質，食物化學能是能量，屬同一統一主題的兩面。"},{"id":"BIO-B01-Ch1-B002:C","text":"只有甲屬能量與物質，乙屬資訊","explanation":"錯誤。乙追蹤能量，不是DNA或訊號內容。"},{"id":"BIO-B01-Ch1-B002:D","text":"只有乙屬能量與物質，甲屬演化","explanation":"錯誤。碳的當次去向未涉及跨代遺傳變化。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：兩者可以同列能量與物質，但不可把碳原子的循環等同能量循環。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B003","topicId":"CH1-INTRO-T01","stem":"同一研究同時記錄「葉片由哪些組織構成」及「植物如何與土壤水分互相影響」。最合適的兩個主要分析角度為何？","correct":"BIO-B01-Ch1-B003:C","options":[{"id":"BIO-B01-Ch1-B003:A","text":"只有組織層級","explanation":"錯誤。只看組成不足以回答土壤關係。"},{"id":"BIO-B01-Ch1-B003:B","text":"只有演化","explanation":"錯誤。兩項都沒有世代尺度資料。"},{"id":"BIO-B01-Ch1-B003:C","text":"組織層級與交互作用","explanation":"正確。第一項是部件組成，第二項是生物與環境的關係。"},{"id":"BIO-B01-Ch1-B003:D","text":"演化與資訊","explanation":"錯誤。沒有DNA或跨代遺傳變化的比較。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：將組成問題和關係問題分開，可看到同一植物需要兩種互補角度。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B004","topicId":"CH1-INTRO-T01","stem":"學生說：「DNA影響毛色，所以用資訊主題就能完全回答毛色在何種背景較安全。」哪項修正最恰當？","correct":"BIO-B01-Ch1-B004:D","options":[{"id":"BIO-B01-Ch1-B004:A","text":"改用資訊主題即可排除環境","explanation":"錯誤。背景作用不是遺傳資訊可自動排除的。"},{"id":"BIO-B01-Ch1-B004:B","text":"毛色若有遺傳性便不會影響捕食","explanation":"錯誤。遺傳性與影響捕食可以並存。"},{"id":"BIO-B01-Ch1-B004:C","text":"只要有DNA資料就能確定未來所有族群比例","explanation":"錯誤。未來比例還受生存、繁殖與環境等條件影響。"},{"id":"BIO-B01-Ch1-B004:D","text":"還需分析毛色與背景、捕食者的交互作用","explanation":"正確。資訊可解釋性狀來源，但環境關係影響其效果。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：性狀如何產生與性狀是否有利是不同問題，需把資訊與互動相連。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B005","topicId":"CH1-INTRO-T01","stem":"某報告分別討論細胞合作、DNA與性狀、食物能量傳遞、捕食關係。若欲涵蓋五大主題，尚缺哪類問題？","correct":"BIO-B01-Ch1-B005:A","options":[{"id":"BIO-B01-Ch1-B005:A","text":"族群可遺傳特徵如何跨世代改變","explanation":"正確。已有前四主題，缺演化尺度。"},{"id":"BIO-B01-Ch1-B005:B","text":"同一細胞有哪些部件","explanation":"錯誤。部件問題仍屬已列的組織層級。"},{"id":"BIO-B01-Ch1-B005:C","text":"食物碳原子如何回到環境","explanation":"錯誤。碳循環仍在已列的能量與物質範圍。"},{"id":"BIO-B01-Ch1-B005:D","text":"猛禽與小鼠何時相遇","explanation":"錯誤。相遇與捕食仍屬交互作用。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：先對四段逐項映射，再辨認尚未出現的跨世代遺傳問題。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B006","topicId":"CH1-INTRO-T01","stem":"甲問「一段DNA差異如何連到毛色」；乙問「這種毛色為何在白沙較不易被發現」。若兩者結論都成立，哪項判斷最恰當？","correct":"BIO-B01-Ch1-B006:B","options":[{"id":"BIO-B01-Ch1-B006:A","text":"甲成立即可保證所有環境都有相同優勢","explanation":"錯誤。遺傳來源不保證任何環境的效果相同。"},{"id":"BIO-B01-Ch1-B006:B","text":"兩者解釋不同環節，可共同理解毛色現象","explanation":"正確。甲處理資訊與性狀，乙處理性狀與環境。"},{"id":"BIO-B01-Ch1-B006:C","text":"兩者必互相矛盾，只能保留一項","explanation":"錯誤。作用於不同環節的解釋可以相容。"},{"id":"BIO-B01-Ch1-B006:D","text":"乙成立即可證明DNA完全無關","explanation":"錯誤。環境效果不排除遺傳來源。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：沿「資訊→性狀→環境效果」串接即可看到相容性，本題不要求分子機制。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B007","topicId":"CH1-INTRO-T01","stem":"甲量測植物能量輸入，乙比較相同部件以不同方式排列後的功能。哪項可避免把兩題硬塞進同一主題？","correct":"BIO-B01-Ch1-B007:C","options":[{"id":"BIO-B01-Ch1-B007:A","text":"因都是生物而歸為演化","explanation":"錯誤。不是所有生物問題都直接以演化為觀察焦點。"},{"id":"BIO-B01-Ch1-B007:B","text":"因都能量測而認為主題沒有區別","explanation":"錯誤。可量測不會抹去研究問題的差異。"},{"id":"BIO-B01-Ch1-B007:C","text":"依各自問題分為能量與物質、組織層級","explanation":"正確。研究焦點分別是能量來源與部件組織。"},{"id":"BIO-B01-Ch1-B007:D","text":"因都用儀器而歸為資訊","explanation":"錯誤。使用儀器是研究方式，不等於資訊主題的內容。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：分類依被研究的關係，不依是否使用儀器或是否可量測。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B008","topicId":"CH1-INTRO-T01","stem":"研究「猛禽捕食小鼠」時，甲關注小鼠死亡風險，乙關注食物化學能轉移。哪項說法正確？","correct":"BIO-B01-Ch1-B008:D","options":[{"id":"BIO-B01-Ch1-B008:A","text":"只要是捕食，便禁止能量分析","explanation":"錯誤。取食是能量傳遞途徑之一。"},{"id":"BIO-B01-Ch1-B008:B","text":"只有能量分析是生物學，風險不是","explanation":"錯誤。死亡風險可用於生物互動研究。"},{"id":"BIO-B01-Ch1-B008:C","text":"兩者必然直接證明族群演化","explanation":"錯誤。兩者尚未提供可遺傳差異與跨代資料。"},{"id":"BIO-B01-Ch1-B008:D","text":"同一事件可分別突出交互作用與能量物質","explanation":"正確。捕食事件同時具有關係及能量轉移面向。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：以研究者追蹤的量區分角度，不把「最直接主題」誤解成唯一可能主題。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B009","topicId":"CH1-INTRO-T01","stem":"某人將五主題當成「互斥分類盒」，主張每個生命現象只能放一盒。海灘小鼠毛色的哪項分析最能修正他？","correct":"BIO-B01-Ch1-B009:A","options":[{"id":"BIO-B01-Ch1-B009:A","text":"可同時連結DNA差異、環境隱蔽效果與可遺傳性狀的跨代變化","explanation":"正確。三環節分別呼應資訊、互動與演化。"},{"id":"BIO-B01-Ch1-B009:B","text":"只記小鼠的中文名稱","explanation":"錯誤。命名不足以展示多角度整合。"},{"id":"BIO-B01-Ch1-B009:C","text":"只依動物大小排序","explanation":"錯誤。大小排序不呈現本例的多主題關係。"},{"id":"BIO-B01-Ch1-B009:D","text":"把全部結果改叫演化而不區分問題","explanation":"錯誤。改名會失去各環節的具體解釋。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：五主題是連接知識的角度；同一性狀可同時有來源、效果與歷史。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4、11張；正文1、2、3、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B010","topicId":"CH1-INTRO-T01","stem":"一個模型顯示細胞部件合作，另一個模型顯示群集與水、光互相影響。哪項比較正確？","correct":"BIO-B01-Ch1-B010:B","options":[{"id":"BIO-B01-Ch1-B010:A","text":"只有細胞有組織，生態系無成員關係","explanation":"錯誤。生態系也包含生物與環境的組織關係。"},{"id":"BIO-B01-Ch1-B010:B","text":"兩者都可用系統視角，但組織尺度不同","explanation":"正確。系統可在不同尺度研究部件與關係。"},{"id":"BIO-B01-Ch1-B010:C","text":"兩者有互動，因此必為同一層級","explanation":"錯誤。同有互動不等於對象尺度相同。"},{"id":"BIO-B01-Ch1-B010:D","text":"只有生態系能稱系統，細胞不能","explanation":"錯誤。細胞內部也有部件與互動。"}],"concept":"生物學用組織層級、資訊、能量與物質、交互作用、演化五個主題整理生命現象。組織層級問部件如何組成整體；資訊問遺傳資訊或訊號如何影響功能；能量與物質問能量來源及物質去向；交互作用問成員與環境如何互相影響；演化問族群的可遺傳特徵如何跨世代改變。這些是互補的研究角度，同一事件可以涉及多個主題；選最直接主題時，要看題目刻意追蹤的對象與尺度。\n\n本題判斷：系統是一種分析方式，細胞與生態系仍保留不同尺度身分。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B011","topicId":"CH1-INTRO-T02","stem":"甲集合是同一片草地的一種小鼠；乙集合是該草地所有生物；丙再加入土壤、水與光。依序最適合稱為何？","correct":"BIO-B01-Ch1-B011:C","options":[{"id":"BIO-B01-Ch1-B011:A","text":"個體、生態系、器官系統","explanation":"錯誤。甲是多個個體，丙不是個體內器官。"},{"id":"BIO-B01-Ch1-B011:B","text":"族群、生態系、細胞","explanation":"錯誤。乙未含非生物環境，丙更非細胞。"},{"id":"BIO-B01-Ch1-B011:C","text":"族群、群集、生態系","explanation":"正確。同種集合、多物種集合、生物加環境依序升到三個尺度。"},{"id":"BIO-B01-Ch1-B011:D","text":"群集、族群、生物圈","explanation":"錯誤。前兩者顛倒，局部草地也不是整個生物圈。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：以集合包含什麼作判準：同種→多種→多種及環境。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B012","topicId":"CH1-INTRO-T02","stem":"一名學生將「葉內的一群合作細胞」與「整片由多種組織構成的葉」都標成器官。應如何更正？","correct":"BIO-B01-Ch1-B012:D","options":[{"id":"BIO-B01-Ch1-B012:A","text":"前者為族群，後者為群集","explanation":"錯誤。族群群集比較完整個體，不是葉內細胞。"},{"id":"BIO-B01-Ch1-B012:B","text":"前者為胞器，後者為分子","explanation":"錯誤。胞器與分子都是更小尺度。"},{"id":"BIO-B01-Ch1-B012:C","text":"兩者都應為器官系統","explanation":"錯誤。器官系統由多器官協作，與兩者皆不同。"},{"id":"BIO-B01-Ch1-B012:D","text":"前者為組織，後者為器官","explanation":"正確。合作細胞群對應組織，多種組織構成器官。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：相同功能合作不代表同一尺度，要看組成單位是細胞或組織。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B013","topicId":"CH1-INTRO-T02","stem":"某生物只有一個細胞，能自行維持生命活動；另一生物由多種組織、器官構成。哪項比較合理？","correct":"BIO-B01-Ch1-B013:A","options":[{"id":"BIO-B01-Ch1-B013:A","text":"兩者都可為個體，內部層級不必相同","explanation":"正確。個體不以具有組織器官為通用條件。"},{"id":"BIO-B01-Ch1-B013:B","text":"第一者只能是胞器，不能是個體","explanation":"錯誤。一個完整單細胞生物可同時是細胞及個體。"},{"id":"BIO-B01-Ch1-B013:C","text":"第二者的器官必定比其整體更高階","explanation":"錯誤。器官是個體部件，不在其上。"},{"id":"BIO-B01-Ch1-B013:D","text":"兩者都必須具備器官系統才算生物","explanation":"錯誤。單細胞生物可缺少器官系統。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：層級序列是尺度框架，不能把多細胞動物模式套到所有生命。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B014","topicId":"CH1-INTRO-T02","stem":"把「細胞內的功能構造」「由多種組織構成的部分」「同地同種個體集合」分別配對，何者正確？","correct":"BIO-B01-Ch1-B014:B","options":[{"id":"BIO-B01-Ch1-B014:A","text":"細胞、器官系統、生態系","explanation":"錯誤。胞器不等於細胞，同種集合也未含環境。"},{"id":"BIO-B01-Ch1-B014:B","text":"胞器、器官、族群","explanation":"正確。依所在位置、組成材料及集合範圍即可辨認。"},{"id":"BIO-B01-Ch1-B014:C","text":"器官、胞器、群集","explanation":"錯誤。胞器與器官尺度顛倒，同種集合不是多種群集。"},{"id":"BIO-B01-Ch1-B014:D","text":"分子、族群、組織","explanation":"錯誤。組織與族群不能互換組成單位。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：三個定義各用一個限制條件定位，避免只憑「功能」「集合」等泛詞判斷。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B015","topicId":"CH1-INTRO-T02","stem":"圖說只寫「分子→細胞→個體→生態系」，用來呈現幾個觀察尺度。哪項補充最能避免誤讀？","correct":"BIO-B01-Ch1-B015:C","options":[{"id":"BIO-B01-Ch1-B015:A","text":"分子可直接等同器官","explanation":"錯誤。分子與器官差異甚大。"},{"id":"BIO-B01-Ch1-B015:B","text":"所有生物都必須依此順序發育成生態系","explanation":"錯誤。尺度序列不是個體發育流程。"},{"id":"BIO-B01-Ch1-B015:C","text":"這是簡化選取尺度，不表示中間層級不存在或每種生物都齊備","explanation":"正確。區分觀察尺度、完整序列及物種差異。"},{"id":"BIO-B01-Ch1-B015:D","text":"這已完整列出所有常用層級","explanation":"錯誤。題目省略胞器、組織等常用尺度。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：簡圖可合法省略層級，但需明示它不是完整清單或生命必經成長順序。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B016","topicId":"CH1-INTRO-T02","stem":"某研究起初只記錄同地所有魚類，之後加入水草、微生物和水中光照。哪項描述最合理？","correct":"BIO-B01-Ch1-B016:D","options":[{"id":"BIO-B01-Ch1-B016:A","text":"前者必是單一族群，因為都叫魚","explanation":"錯誤。族群要求同種，不能以通稱魚類取代。"},{"id":"BIO-B01-Ch1-B016:B","text":"加入光照後仍只能稱組織","explanation":"錯誤。組織是細胞尺度，不是湖區集合。"},{"id":"BIO-B01-Ch1-B016:C","text":"後者只有生物，沒有非生物成分","explanation":"錯誤。光照就是非生物因子。"},{"id":"BIO-B01-Ch1-B016:D","text":"後者可作生態系研究，前者未必是單一族群","explanation":"正確。「魚類」可含多物種，光照屬非生物環境。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：先檢查是否同種，再檢查是否納入非生物環境；兩個邊界各自重要。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B017","topicId":"CH1-INTRO-T02","stem":"下列哪組配對正確區分「組成關係」與「生態集合」？","correct":"BIO-B01-Ch1-B017:A","options":[{"id":"BIO-B01-Ch1-B017:A","text":"組織由細胞合作形成；族群由同地同種個體構成","explanation":"正確。兩類集合的組成單位不同。"},{"id":"BIO-B01-Ch1-B017:B","text":"組織由多個族群形成；族群由胞器形成","explanation":"錯誤。組織及族群的組成單位都配錯。"},{"id":"BIO-B01-Ch1-B017:C","text":"器官由同地各種生物形成；群集由分子形成","explanation":"錯誤。器官是個體內結構，群集含多物種個體。"},{"id":"BIO-B01-Ch1-B017:D","text":"細胞由多個生態系構成；個體由生物圈構成","explanation":"錯誤。尺度方向完全倒置。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：組織與族群都可稱集合，但前者單位是細胞，後者單位是個體。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B018","topicId":"CH1-INTRO-T02","stem":"某人因細菌沒有膜包圍胞器，判定它不符合生命層級而不是生物。哪項回應最好？","correct":"BIO-B01-Ch1-B018:B","options":[{"id":"BIO-B01-Ch1-B018:A","text":"每個生物都必須含有多個細胞","explanation":"錯誤。單細胞生命本來就存在。"},{"id":"BIO-B01-Ch1-B018:B","text":"層級框架容許差異，原核細胞可缺膜包圍胞器","explanation":"正確。原核生物的細胞組成不必套用真核模式。"},{"id":"BIO-B01-Ch1-B018:C","text":"所有細菌其實都有與動物相同的器官","explanation":"錯誤。細菌沒有動物式器官。"},{"id":"BIO-B01-Ch1-B018:D","text":"沒有膜包圍胞器等於沒有任何組織性","explanation":"錯誤。缺特定構造不等於沒有分子組織與細胞功能。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：不能由缺少真核式胞器推出非生命，這是把觀察尺度誤當統一部件規格。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B019","topicId":"CH1-INTRO-T02","stem":"研究者由完整動物逐步聚焦到器官、組織、細胞與分子。這個順序表示什麼？","correct":"BIO-B01-Ch1-B019:C","options":[{"id":"BIO-B01-Ch1-B019:A","text":"族群在每一代縮成一個細胞","explanation":"錯誤。題目未涉及族群或世代。"},{"id":"BIO-B01-Ch1-B019:B","text":"器官尺度比完整個體更大","explanation":"錯誤。器官是完整個體的部件。"},{"id":"BIO-B01-Ch1-B019:C","text":"觀察尺度由較高層級逐步縮小","explanation":"正確。這是由整體到組成單位的研究方向。"},{"id":"BIO-B01-Ch1-B019:D","text":"個體依此順序生長成分子","explanation":"錯誤。研究順序不是發育流程。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：區分研究縮放方向與生物實際成長方向；前者可以由大到小。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B020","topicId":"CH1-INTRO-T02","stem":"把單一小鼠、同地同種小鼠、同地多物種生物排列後，再加入環境土壤與水。何者符合尺度變化？","correct":"BIO-B01-Ch1-B020:D","options":[{"id":"BIO-B01-Ch1-B020:A","text":"細胞→器官→族群→分子","explanation":"錯誤。單一小鼠不是細胞，土壤水也不是單一分子。"},{"id":"BIO-B01-Ch1-B020:B","text":"個體→群集→族群→生物圈","explanation":"錯誤。同種與多種集合顛倒，局部環境不是全生物圈。"},{"id":"BIO-B01-Ch1-B020:C","text":"器官→個體→生態系→組織","explanation":"錯誤。起點不是器官，終點更非組織。"},{"id":"BIO-B01-Ch1-B020:D","text":"個體→族群→群集→生態系","explanation":"正確。每一步都依題目增加組成範圍。"}],"concept":"常用的生物組織尺度由小至大為分子、胞器、細胞、組織、器官、器官系統、個體、族群、群集、生態系、生物圈。組織是共同執行功能的細胞群，器官由多種組織合作；同地同種個體形成族群，多物種族群合成群集，群集加上相互作用的非生物環境構成生態系。這是研究尺度，並非所有生物都具有全部中間層級；單細胞生物可由一個細胞構成個體，原核生物沒有膜包圍胞器。\n\n本題判斷：用實際集合邊界對應名詞，比死背大小順序更能避免誤判。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–6 頁（PDF 51；53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B021","topicId":"CH1-INTRO-T03","stem":"兩組材料包含相同種類和數量的部件，甲保留原有連接，乙打散連接；只有甲可完成某整體功能。資料最直接支持什麼？","correct":"BIO-B01-Ch1-B021:A","options":[{"id":"BIO-B01-Ch1-B021:A","text":"部件間組織關係對功能有影響","explanation":"正確。題設已控制成分數量，差異在連接方式。"},{"id":"BIO-B01-Ch1-B021:B","text":"乙一定缺少某種部件","explanation":"錯誤。已知部件種類數量相同，不能反向猜缺件。"},{"id":"BIO-B01-Ch1-B021:C","text":"甲必定含有較多物質","explanation":"錯誤。數量與材料相同，不支持多物質解釋。"},{"id":"BIO-B01-Ch1-B021:D","text":"成分清單足以保證功能","explanation":"錯誤。相同清單卻不同功能，恰好反對此結論。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：先排除已被題設固定的成分因素，再把功能差異連到組織關係。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B022","topicId":"CH1-INTRO-T03","stem":"某系統拆開後功能消失，重新正確組裝後恢復。下列哪項結論最審慎？","correct":"BIO-B01-Ch1-B022:B","options":[{"id":"BIO-B01-Ch1-B022:A","text":"拆開使所有物質都永久消失","explanation":"錯誤。能重新組裝表示部件未全部消失。"},{"id":"BIO-B01-Ch1-B022:B","text":"結果符合功能依賴特定排列與互動","explanation":"正確。拆解與重組對功能的影響支持組織重要性。"},{"id":"BIO-B01-Ch1-B022:C","text":"任何排列都一定能恢復功能","explanation":"錯誤。題目只測正確組裝，不能推所有排列。"},{"id":"BIO-B01-Ch1-B022:D","text":"每個孤立零件必具有完整系統功能","explanation":"錯誤。孤立零件未展現完整功能。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：功能隨組織關係破壞及恢復，符合湧現性質；結論限於已測方式。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B023","topicId":"CH1-INTRO-T03","stem":"學生認為「只要取得所有細胞分子並混在一起，就必然得到原細胞完整功能」。哪項反駁最切中核心？","correct":"BIO-B01-Ch1-B023:C","options":[{"id":"BIO-B01-Ch1-B023:A","text":"只有細胞大小決定一切功能","explanation":"錯誤。大小不足以代替內部關係。"},{"id":"BIO-B01-Ch1-B023:B","text":"細胞功能只由研究者命名決定","explanation":"錯誤。功能是可研究現象，不是名稱決定。"},{"id":"BIO-B01-Ch1-B023:C","text":"分子齊全仍須具備適當排列與互動","explanation":"正確。部件清單完整不是充分條件，還要組織關係。"},{"id":"BIO-B01-Ch1-B023:D","text":"任何分子都和細胞功能無關","explanation":"錯誤。分子仍是必要組成，不能完全否定。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：「所有材料都有」與「材料正確組織」是兩個不同條件，不能省略後者。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B024","topicId":"CH1-INTRO-T03","stem":"甲研究單個部件可做什麼，乙研究多個部件相連後可做什麼。若目標是解釋整體功能，哪個策略較完整？","correct":"BIO-B01-Ch1-B024:D","options":[{"id":"BIO-B01-Ch1-B024:A","text":"只用甲，並假設連接方式無關","explanation":"錯誤。連接方式可能產生湧現功能。"},{"id":"BIO-B01-Ch1-B024:B","text":"只用乙，並否認部件性質有作用","explanation":"錯誤。互動效果也依賴部件本身性質。"},{"id":"BIO-B01-Ch1-B024:C","text":"只比較兩位研究者的職稱","explanation":"錯誤。職稱不能補足科學資料。"},{"id":"BIO-B01-Ch1-B024:D","text":"合用甲與乙的結果","explanation":"正確。部件能力與互動方式共同限制整體結果。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：整體解釋需要知道部件的能力，也需要知道它們如何協作。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B025","topicId":"CH1-INTRO-T03","stem":"已知甲、乙的部件清單完全相同，目前只測得甲有某功能。能否直接推定乙也有？","correct":"BIO-B01-Ch1-B025:A","options":[{"id":"BIO-B01-Ch1-B025:A","text":"不能，還要知道排列與互動是否滿足功能條件","explanation":"正確。清單無法顯示全部組織關係。"},{"id":"BIO-B01-Ch1-B025:B","text":"可以，部件相同已排除全部差異","explanation":"錯誤。相同成分仍可能有不同連接。"},{"id":"BIO-B01-Ch1-B025:C","text":"不能，因為相同部件永遠不能有相同功能","explanation":"錯誤。相同部件也可能正確組成相同功能，並非永不可能。"},{"id":"BIO-B01-Ch1-B025:D","text":"可以，只要乙的名稱與甲相同","explanation":"錯誤。名稱一致不能代替組織資料。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：目前只能說乙具備同樣材料，功能仍需檢查組織及運作。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B026","topicId":"CH1-INTRO-T03","stem":"一個整體功能在孤立部件中找不到，是否表示它與部件無關？","correct":"BIO-B01-Ch1-B026:B","options":[{"id":"BIO-B01-Ch1-B026:A","text":"不是，因為每個部件一定已有全部功能","explanation":"錯誤。孤立部件沒有完整功能是湧現的常見情形。"},{"id":"BIO-B01-Ch1-B026:B","text":"不是，功能可能由部件互動產生","explanation":"正確。湧現功能依賴部件但不必存在於每個部件。"},{"id":"BIO-B01-Ch1-B026:C","text":"是，必須由完全無關的外物產生","explanation":"錯誤。題目不支持引入無關來源。"},{"id":"BIO-B01-Ch1-B026:D","text":"是，部件的排列一定不重要","explanation":"錯誤。排列正是可能的重要條件。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：「不在孤立部件出現」不等於「不依賴部件」，要補上互動層次。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B027","topicId":"CH1-INTRO-T03","stem":"某模型只改變部件排列，部件數量不變，測得功能改變。若要摘要這個結果，哪句最合適？","correct":"BIO-B01-Ch1-B027:C","options":[{"id":"BIO-B01-Ch1-B027:A","text":"功能與排列完全無關","explanation":"錯誤。與觀察結果相反。"},{"id":"BIO-B01-Ch1-B027:B","text":"只有更換物種才能改變功能","explanation":"錯誤。同一模型已因排列變動而改變功能。"},{"id":"BIO-B01-Ch1-B027:C","text":"功能不只受部件數量影響，也受組織方式影響","explanation":"正確。數量固定而功能變，顯示排列因素的作用。"},{"id":"BIO-B01-Ch1-B027:D","text":"部件數量變多造成所有差異","explanation":"錯誤。題設明示數量未變。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：找出實際改變的條件是排列，不能用未改變的數量作原因。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B028","topicId":"CH1-INTRO-T03","stem":"研究完整細胞互動時，科學家仍持續測定各部件性質。這是否矛盾？","correct":"BIO-B01-Ch1-B028:D","options":[{"id":"BIO-B01-Ch1-B028:A","text":"矛盾，研究整體就不能研究部件","explanation":"錯誤。兩種研究方式可互補。"},{"id":"BIO-B01-Ch1-B028:B","text":"不矛盾，因為整體其實完全沒有新性質","explanation":"錯誤。可互補不代表湧現性質不存在。"},{"id":"BIO-B01-Ch1-B028:C","text":"矛盾，兩種尺度必須使用不同物種","explanation":"錯誤。同一系統可跨尺度研究。"},{"id":"BIO-B01-Ch1-B028:D","text":"不矛盾，部件資訊可幫助解釋互動","explanation":"正確。互動研究可以以部件性質為基礎。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：分析尺度可不同，但資料能共同回答同一系統如何運作。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B029","topicId":"CH1-INTRO-T03","stem":"某器官的功能依賴多種組織協調。一種組織仍正常，但器官整體失去功能。哪項推論最合理？","correct":"BIO-B01-Ch1-B029:A","options":[{"id":"BIO-B01-Ch1-B029:A","text":"單一部件正常不保證整體協作正常","explanation":"正確。其他部件或協調關係仍可能有問題。"},{"id":"BIO-B01-Ch1-B029:B","text":"只要一種組織正常器官就必然正常","explanation":"錯誤。整體功能需多種組織與互動。"},{"id":"BIO-B01-Ch1-B029:C","text":"所有組織一定都已消失","explanation":"錯誤。題目沒有證明其他組織消失。"},{"id":"BIO-B01-Ch1-B029:D","text":"器官功能只看總重量即可","explanation":"錯誤。重量不能代表協調功能。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：由一個部件正常不能推整體正常，還需檢查其餘部件及彼此關係。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B030","topicId":"CH1-INTRO-T03","stem":"「部件A單獨無功能F，部件B單獨無F，A與B正確合作時有F。」若只根據這些條件，哪項成立？","correct":"BIO-B01-Ch1-B030:B","options":[{"id":"BIO-B01-Ch1-B030:A","text":"A與B隨意接觸必定都有F","explanation":"錯誤。題設要求正確合作，不能改成隨意接觸。"},{"id":"BIO-B01-Ch1-B030:B","text":"F可視為這個組合的湧現性質","explanation":"正確。F在特定合作後出現而孤立部件沒有。"},{"id":"BIO-B01-Ch1-B030:C","text":"F必定存在於A單獨時","explanation":"錯誤。與題設A單獨無F相反。"},{"id":"BIO-B01-Ch1-B030:D","text":"F證明B沒有任何作用","explanation":"錯誤。不能由整體功能反推B無作用。"}],"concept":"湧現性質是部件以特定方式排列與互動後，在整體層級出現的性質；孤立部件未必具有該功能。研究部件能回答它由什麼構成，研究部件間關係則能解釋整體如何運作。成分清單相同不保證排列、連接或動態互動相同，也不保證功能相同。這並不否定部件的重要性；拆解研究與整體互動研究可以互補。判讀時須同時區分部件是否齊全，以及部件是否依需要組織起來。\n\n本題判斷：保留「正確合作」條件，才能把F判為組合後出現的性質。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；4–5 頁（PDF 51；53–54 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B031","topicId":"CH1-INTRO-T04","stem":"在相同飼養環境中，研究者發現某DNA變異與毛色差異相關。根據這項描述，哪個結論最適切？","correct":"BIO-B01-Ch1-B031:C","options":[{"id":"BIO-B01-Ch1-B031:A","text":"已證明毛色在任何背景的生存效果相同","explanation":"錯誤。未比較各背景下的生存效果。"},{"id":"BIO-B01-Ch1-B031:B","text":"已證明小鼠為避敵而主動指定該DNA變異","explanation":"錯誤。關聯資料不支持目的性變異。"},{"id":"BIO-B01-Ch1-B031:C","text":"可研究遺傳資訊與毛色的關聯，但不能宣稱環境在所有情境皆無作用","explanation":"正確。相同環境比較可聚焦DNA關聯，外推仍有限。"},{"id":"BIO-B01-Ch1-B031:D","text":"已證明全部DNA只控制毛色","explanation":"錯誤。一段變異不能代表全部DNA功能。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：把研究所得限制在資訊與性狀的關聯，勿擴大為環境無作用或變異由意願造成。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B032","topicId":"CH1-INTRO-T04","stem":"甲問DNA為何與淡毛有關，乙問淡毛在白沙為何較難被發現。哪項能正確區分兩者？","correct":"BIO-B01-Ch1-B032:D","options":[{"id":"BIO-B01-Ch1-B032:A","text":"甲偏物質循環，乙偏DNA序列","explanation":"錯誤。甲未追蹤物質循環，乙未追蹤DNA序列。"},{"id":"BIO-B01-Ch1-B032:B","text":"兩者都只能用細胞數量回答","explanation":"錯誤。細胞數量不足以回答兩個指定關係。"},{"id":"BIO-B01-Ch1-B032:C","text":"兩者都是個體當天的演化","explanation":"錯誤。未涉及族群跨代遺傳改變。"},{"id":"BIO-B01-Ch1-B032:D","text":"甲偏資訊來源，乙偏性狀與環境的關係","explanation":"正確。兩個問題分別關注性狀形成與環境效果。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：同一毛色可以有不同層次的原因與效果，不需強迫單一主題包辦。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B033","topicId":"CH1-INTRO-T04","stem":"題設甲、乙小鼠的毛色相關DNA不同，黑色素產生也不同。要把觀察寫成資訊主題的結論，何者最合適？","correct":"BIO-B01-Ch1-B033:A","options":[{"id":"BIO-B01-Ch1-B033:A","text":"DNA資訊差異可能透過色素產生連到毛色差異","explanation":"正確。題設建立DNA、產物及性狀的連結。"},{"id":"BIO-B01-Ch1-B033:B","text":"DNA就是黑色素，所以兩者名稱可互換","explanation":"錯誤。DNA與色素是不同物質，不能互稱。"},{"id":"BIO-B01-Ch1-B033:C","text":"色素產生不同就表示DNA沒有作用","explanation":"錯誤。產物差異正可能與資訊差異相連。"},{"id":"BIO-B01-Ch1-B033:D","text":"全部生命特徵都可只由此一變異完整解釋","explanation":"錯誤。不能把一個性狀關聯推廣為所有特徵。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：沿題設資訊差異到產物差異的方向判斷，避免把資訊分子與色素混為一物。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B034","topicId":"CH1-INTRO-T04","stem":"相同淡色毛在白沙較隱蔽，在深色土壤較顯眼；毛色本身可遺傳。這表示哪兩件事可同時成立？","correct":"BIO-B01-Ch1-B034:B","options":[{"id":"BIO-B01-Ch1-B034:A","text":"毛色可遺傳；每個後代都必定完全相同","explanation":"錯誤。可遺傳不代表所有後代無差異。"},{"id":"BIO-B01-Ch1-B034:B","text":"遺傳資訊影響毛色；環境改變毛色的隱蔽效果","explanation":"正確。性狀來源與環境作用是不同環節。"},{"id":"BIO-B01-Ch1-B034:C","text":"毛色可遺傳；環境不能影響其效果","explanation":"錯誤。題設明示背景使效果改變。"},{"id":"BIO-B01-Ch1-B034:D","text":"環境影響可見度；毛色就一定不可遺傳","explanation":"錯誤。環境效果不否定遺傳性。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：不必在基因與環境間二選一：兩者在不同環節皆可作用。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B035","topicId":"CH1-INTRO-T04","stem":"學生看見「毛色相關基因」便寫成「每個基因都直接決定毛色」。主要推論錯誤為何？","correct":"BIO-B01-Ch1-B035:C","options":[{"id":"BIO-B01-Ch1-B035:A","text":"把族群數量誤作個體數量","explanation":"錯誤。未涉及族群計數。"},{"id":"BIO-B01-Ch1-B035:B","text":"把捕食風險誤作日照時數","explanation":"錯誤。未涉及風險與日照比較。"},{"id":"BIO-B01-Ch1-B035:C","text":"把特定相關基因擴大為全部基因","explanation":"正確。原敘述只指定與毛色相關的部分資訊。"},{"id":"BIO-B01-Ch1-B035:D","text":"把能量流動誤作物質循環","explanation":"錯誤。此題未討論能量與物質。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：判讀量詞：存在相關基因，不等於每個基因都負責同一性狀。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B036","topicId":"CH1-INTRO-T04","stem":"已知兩個群體有不同毛色，但沒有DNA或遺傳資料。若想進一步建立資訊與性狀連結，哪項研究最直接？","correct":"BIO-B01-Ch1-B036:D","options":[{"id":"BIO-B01-Ch1-B036:A","text":"只比較兩地沙土重量","explanation":"錯誤。沙土重量不是DNA資訊資料。"},{"id":"BIO-B01-Ch1-B036:B","text":"只列出捕食者總數","explanation":"錯誤。捕食者數量主要涉及互動與選擇脈絡。"},{"id":"BIO-B01-Ch1-B036:C","text":"只將毛色命名為甲色與乙色","explanation":"錯誤。命名不會產生遺傳關聯證據。"},{"id":"BIO-B01-Ch1-B036:D","text":"比較與毛色相關的DNA差異及性狀","explanation":"正確。直接取得遺傳資訊與性狀對照。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：不同外觀不是完整資訊證據，應補上與遺傳資訊的可檢查連結。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B037","topicId":"CH1-INTRO-T04","stem":"一隻鼠的深色毛被白粉暫時覆蓋，洗掉後恢復；題設沒有DNA改變。哪項說明正確？","correct":"BIO-B01-Ch1-B037:A","options":[{"id":"BIO-B01-Ch1-B037:A","text":"暫時外觀改變不表示遺傳資訊已變成淡毛資訊","explanation":"正確。外表處理與遺傳資訊改變是不同事項。"},{"id":"BIO-B01-Ch1-B037:B","text":"只要看起來白，所有DNA就已永久改變","explanation":"錯誤。題設未有DNA改變，不能由外觀直接推出。"},{"id":"BIO-B01-Ch1-B037:C","text":"白粉必定使後代毛色相同","explanation":"錯誤。後代遺傳效果未被提供。"},{"id":"BIO-B01-Ch1-B037:D","text":"洗掉白粉等於逆轉整個族群演化","explanation":"錯誤。只涉及單隻鼠的處理，非族群跨代變化。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：依題設區分表面覆蓋與遺傳性毛色，不把所有表型變化都當DNA改變。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B038","topicId":"CH1-INTRO-T04","stem":"毛色相關DNA可影響毛色，但研究者還測量背景對被發現率的作用。為何這不是重複研究？","correct":"BIO-B01-Ch1-B038:B","options":[{"id":"BIO-B01-Ch1-B038:A","text":"前者已能預知一切捕食結果","explanation":"錯誤。DNA資訊不是所有捕食條件的完整替代。"},{"id":"BIO-B01-Ch1-B038:B","text":"前者處理性狀資訊，後者處理性狀在環境中的效果","explanation":"正確。研究的因果環節不同，可互相補足。"},{"id":"BIO-B01-Ch1-B038:C","text":"兩者都只在測DNA含量","explanation":"錯誤。背景研究測的是可見度等效果。"},{"id":"BIO-B01-Ch1-B038:D","text":"後者可讓前者的資料自動失效","explanation":"錯誤。環境結果不會自動否定遺傳資訊。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：知道性狀從何而來，不等於知道它在每個環境中的作用。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B039","topicId":"CH1-INTRO-T04","stem":"某報告只有「DNA差異與毛色相關」，卻在結論加上「毛色由單一基因以特定比例遺傳」。哪項評估合理？","correct":"BIO-B01-Ch1-B039:C","options":[{"id":"BIO-B01-Ch1-B039:A","text":"有DNA便不可能有多種相關基因","explanation":"錯誤。DNA存在不限定相關基因數。"},{"id":"BIO-B01-Ch1-B039:B","text":"只要提到毛色便應忽略資訊資料","explanation":"錯誤。毛色本來就可研究遺傳資訊。"},{"id":"BIO-B01-Ch1-B039:C","text":"後半段需要額外證據，不能由前半段直接推得","explanation":"正確。關聯不提供基因數量與具體遺傳規則。"},{"id":"BIO-B01-Ch1-B039:D","text":"只要相關就可推出任何遺傳比例","explanation":"錯誤。比例需要明確遺傳前提或資料。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：本節可做資訊與性狀的連結，不能無條件添加未給的單基因或比例模型。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B040","topicId":"CH1-INTRO-T04","stem":"下列哪句最適合放在「遺傳資訊與環境共同理解毛色」的結論中？","correct":"BIO-B01-Ch1-B040:D","options":[{"id":"BIO-B01-Ch1-B040:A","text":"毛色有遺傳成分就不需研究環境","explanation":"錯誤。遺傳成分不會排除環境效果。"},{"id":"BIO-B01-Ch1-B040:B","text":"環境有作用就表示DNA沒有資訊","explanation":"錯誤。兩者可同時作用。"},{"id":"BIO-B01-Ch1-B040:C","text":"只看背景便能確定全部基因功能","explanation":"錯誤。背景資料不能代替基因功能研究。"},{"id":"BIO-B01-Ch1-B040:D","text":"毛色相關資訊可影響毛色，背景與捕食關係影響它是否有利","explanation":"正確。保留資訊與環境各自的作用範圍。"}],"concept":"遺傳資訊儲存在DNA中，與毛色相關的基因變異能影響黑色素產生及毛色。因此從DNA差異連到性狀，是資訊主題的基本問題。然而性狀在環境中是否有利，還取決於環境背景及與其他生物的交互作用。不能把某段與毛色相關的DNA擴大成全部DNA只負責毛色，也不能把基因影響性狀誤說為環境完全沒有作用。本節只處理資訊與性狀的連結，不要求基因表現的分子步驟。\n\n本題判斷：將性狀來源和選擇脈絡相連，同時避免基因或環境單方決定一切的說法。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B041","topicId":"CH1-INTRO-T05","stem":"某食物能量示意有植物→鼠→鷹，僅在鷹旁標出熱散失。若題目要表示各生物利用能量的過程，應如何修正？","correct":"BIO-B01-Ch1-B041:A","options":[{"id":"BIO-B01-Ch1-B041:A","text":"植物與鼠也應標示熱散失","explanation":"正確。植物及鼠同樣利用能量做功並散熱。"},{"id":"BIO-B01-Ch1-B041:B","text":"移除鷹的熱散失即可","explanation":"錯誤。鷹也有散熱，應補其餘而非刪去。"},{"id":"BIO-B01-Ch1-B041:C","text":"把熱全部畫回植物當作可回收養分","explanation":"錯誤。熱不是可按養分途徑回收的物質。"},{"id":"BIO-B01-Ch1-B041:D","text":"將植物改稱分解者即可","explanation":"錯誤。名稱改變不能修正能量表示。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：依各階層都有能量轉換檢查圖示，不能只讓末端承擔全部熱散失。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B042","topicId":"CH1-INTRO-T05","stem":"在一個簡化能量收支模型中，輸入100單位化學能，其中60單位以熱散出，其餘全部保留於新形成物質的化學能。保留量是多少？","correct":"BIO-B01-Ch1-B042:B","options":[{"id":"BIO-B01-Ch1-B042:A","text":"160單位","explanation":"錯誤。把輸入與散出相加造成重複計算。"},{"id":"BIO-B01-Ch1-B042:B","text":"40單位","explanation":"正確。依收支100−60＝40。"},{"id":"BIO-B01-Ch1-B042:C","text":"60單位","explanation":"錯誤。60是已散出的部分。"},{"id":"BIO-B01-Ch1-B042:D","text":"100單位","explanation":"錯誤。忽略了題設散熱。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：先以輸入等於熱散出加保留量，得100−60＝40單位；這是題設收支，不是通用營養階層比例。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B043","topicId":"CH1-INTRO-T05","stem":"某簡化模型輸入120能量單位，其中90單位最後以熱散出、30單位仍儲存在物質中。哪項描述符合能量觀念？","correct":"BIO-B01-Ch1-B043:C","options":[{"id":"BIO-B01-Ch1-B043:A","text":"30單位保留代表其他90單位被毀滅","explanation":"錯誤。散熱是轉移，不是能量毀滅。"},{"id":"BIO-B01-Ch1-B043:B","text":"120單位全部可永久回到生產者","explanation":"錯誤。有熱散出，不能宣稱完整回收為可用能。"},{"id":"BIO-B01-Ch1-B043:C","text":"能量轉換與分配，並未憑空消失","explanation":"正確。90＋30＝120，收支一致。"},{"id":"BIO-B01-Ch1-B043:D","text":"90單位熱代表90個碳原子消失","explanation":"錯誤。能量單位不能當成原子數。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：收支90＋30等於120；能量守恆與可用能量散出可以同時成立。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B044","topicId":"CH1-INTRO-T05","stem":"植物把光能轉為食物化學能，動物吃植物取得化學能。哪項結論沒有超出這些資料？","correct":"BIO-B01-Ch1-B044:D","options":[{"id":"BIO-B01-Ch1-B044:A","text":"動物把食物的全部物質變成陽光","explanation":"錯誤。未有物質全部變陽光的機制。"},{"id":"BIO-B01-Ch1-B044:B","text":"能量與碳原子是同一種東西","explanation":"錯誤。能量不是碳原子的同義詞。"},{"id":"BIO-B01-Ch1-B044
