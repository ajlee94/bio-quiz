"BIO-B01-Ch1.1.2-B018:D","text":"保留染色體含DNA，將DNA更正為核酸","explanation":"DNA的分子類別應更正，包含關係可保留。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B019","topicId":"","stem":"展示牌寫「染色體DNA上有基因X與基因Y」。下列哪個推論有依據？","correct":"BIO-B01-Ch1.1.2-B019:A","options":[{"id":"BIO-B01-Ch1.1.2-B019:A","text":"同一DNA可以攜帶多段產物相關資訊","explanation":"多個基因可位於同一條長DNA上。"},{"id":"BIO-B01-Ch1.1.2-B019:B","text":"基因X必定是整套基因體","explanation":"一個基因不等於整套DNA。"},{"id":"BIO-B01-Ch1.1.2-B019:C","text":"基因Y必定是完整染色體","explanation":"功能片段不等於整條染色體。"},{"id":"BIO-B01-Ch1.1.2-B019:D","text":"X與Y必定屬不同細胞","explanation":"題幹未提供不同細胞的證據。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B020","topicId":"","stem":"若把染色體比喻為承載長篇文字的結構，DNA比喻為文字串，則基因最適合比喻為什麼？","correct":"BIO-B01-Ch1.1.2-B020:B","options":[{"id":"BIO-B01-Ch1.1.2-B020:A","text":"所有讀者的集合","explanation":"讀者集合不能代表DNA上的片段。"},{"id":"BIO-B01-Ch1.1.2-B020:B","text":"文字串中一段具有產物指令的內容","explanation":"基因的角色是DNA中的功能資訊片段。"},{"id":"BIO-B01-Ch1.1.2-B020:C","text":"把文字染色的顏料","explanation":"染料只是觀察工具的類比。"},{"id":"BIO-B01-Ch1.1.2-B020:D","text":"讀者已製成的所有物品","explanation":"成品較接近表現結果，不是基因本身。"}],"concept":"","example":"書中的一段製作指令可以被讀出使用。","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6-7 頁（PDF 55-56 頁）｜本節筆記 Ch1.1.2 正式PNG第4、14張（正文第2、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B021","topicId":"","stem":"一個人類胚胎由單一受精卵逐漸增加細胞。依本節框架，新細胞如何保有遺傳資訊？","correct":"BIO-B01-Ch1.1.2-B021:D","options":[{"id":"BIO-B01-Ch1.1.2-B021:A","text":"每次都從環境重新取得父母完整DNA","explanation":"資訊可由原有細胞複製傳承，並非每次向環境重取。"},{"id":"BIO-B01-Ch1.1.2-B021:B","text":"每個新細胞只繼承成品性狀","explanation":"性狀是發育結果，不是DNA拷貝的替代物。"},{"id":"BIO-B01-Ch1.1.2-B021:C","text":"把既有蛋白質倒轉成全部DNA","explanation":"這不是本節介紹的資訊傳遞路徑。"},{"id":"BIO-B01-Ch1.1.2-B021:D","text":"藉分裂前DNA複製及分裂時的分配取得拷貝","explanation":"DNA複製與分配解釋了細胞增加時的資訊延續。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B022","topicId":"","stem":"圖卡甲標「精子的一套DNA」，圖卡乙標「卵的一套DNA」。在人類正常受精的簡化模型中，合併後應標為什麼？","correct":"BIO-B01-Ch1.1.2-B022:A","options":[{"id":"BIO-B01-Ch1.1.2-B022:A","text":"受精卵包含父方與母方DNA","explanation":"兩種配子的資訊共同進入受精卵。"},{"id":"BIO-B01-Ch1.1.2-B022:B","text":"只剩父方DNA，母方資訊不參與","explanation":"母方DNA也是受精卵資訊來源。"},{"id":"BIO-B01-Ch1.1.2-B022:C","text":"父母兩個完整體細胞","explanation":"精子與卵是配子，不是雙親完整體細胞的集合。"},{"id":"BIO-B01-Ch1.1.2-B022:D","text":"一套不含任何DNA的蛋白體","explanation":"受精卵包含DNA，不能改稱無DNA的蛋白體。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B023","topicId":"","stem":"研究記錄指出新生體細胞取得DNA拷貝。這項記錄最直接支持什麼？","correct":"BIO-B01-Ch1.1.2-B023:B","options":[{"id":"BIO-B01-Ch1.1.2-B023:A","text":"每個基因的表現量都已相同","explanation":"取得拷貝不等於全部表現量相同。"},{"id":"BIO-B01-Ch1.1.2-B023:B","text":"資訊能在細胞分裂過程中延續","explanation":"子細胞取得DNA符合資訊傳遞。"},{"id":"BIO-B01-Ch1.1.2-B023:C","text":"所有子細胞立刻形成同樣成熟性狀","explanation":"功能與性狀還涉及表現與發育。"},{"id":"BIO-B01-Ch1.1.2-B023:D","text":"RNA必定完全不存在","explanation":"DNA存在不能推論RNA不存在。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B024","topicId":"","stem":"同學把人類受精畫成「父親完整體細胞＋母親完整體細胞」。依本節，應改成哪一項？","correct":"BIO-B01-Ch1.1.2-B024:C","options":[{"id":"BIO-B01-Ch1.1.2-B024:A","text":"兩條蛋白質直接融合成DNA","explanation":"蛋白質不是本節受精的DNA來源。"},{"id":"BIO-B01-Ch1.1.2-B024:B","text":"雙親已形成的所有性狀相加","explanation":"性狀成品相加誤解遺傳。"},{"id":"BIO-B01-Ch1.1.2-B024:C","text":"父方精子與母方卵所攜的DNA資訊結合","explanation":"親代透過各自配子提供DNA資訊。"},{"id":"BIO-B01-Ch1.1.2-B024:D","text":"兩個完整成體合併成一個胚胎","explanation":"生殖不是兩個完整成體的合併。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B025","topicId":"","stem":"某受精卵得到來自雙親的DNA，經後續發育形成特徵。下列哪個解釋最準確？","correct":"BIO-B01-Ch1.1.2-B025:D","options":[{"id":"BIO-B01-Ch1.1.2-B025:A","text":"特徵在受精時作為貼紙整份搬入","explanation":"性狀需經發育產生。"},{"id":"BIO-B01-Ch1.1.2-B025:B","text":"DNA在遺傳後便與發育無關","explanation":"DNA資訊可引導產物及發育。"},{"id":"BIO-B01-Ch1.1.2-B025:C","text":"只靠父母現有蛋白質便可取代所有DNA","explanation":"蛋白質不能取代所繼承的DNA資訊。"},{"id":"BIO-B01-Ch1.1.2-B025:D","text":"遺傳提供資訊，資訊的表現參與特徵形成","explanation":"把資訊的傳遞與其使用連接起來符合本節。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B026","topicId":"","stem":"教學模擬中的一般體細胞若沒有先複製DNA，就把原DNA分開給兩個子細胞，會少掉本節哪個必要設計？","correct":"BIO-B01-Ch1.1.2-B026:A","options":[{"id":"BIO-B01-Ch1.1.2-B026:A","text":"先準備遺傳資訊拷貝，供子細胞取得","explanation":"本節以分裂前複製解釋資訊如何延續。"},{"id":"BIO-B01-Ch1.1.2-B026:B","text":"先把DNA轉換為成熟性狀","explanation":"DNA不是直接轉成成品性狀。"},{"id":"BIO-B01-Ch1.1.2-B026:C","text":"先讓每個基因變成整條染色體","explanation":"基因不會因分裂而變成完整染色體。"},{"id":"BIO-B01-Ch1.1.2-B026:D","text":"先移除所有核苷酸序列","explanation":"移除序列會失去資訊，而非支援傳承。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B027","topicId":"","stem":"比較「配子將DNA交給受精卵」與「體細胞把DNA拷貝交給子細胞」，兩者共有哪項重點？","correct":"BIO-B01-Ch1.1.2-B027:B","options":[{"id":"BIO-B01-Ch1.1.2-B027:A","text":"都把所有基因轉成蛋白質","explanation":"傳遞不等於所有基因表現。"},{"id":"BIO-B01-Ch1.1.2-B027:B","text":"都涉及DNA資訊進入後續細胞","explanation":"兩條途徑都維持遺傳資訊延續。"},{"id":"BIO-B01-Ch1.1.2-B027:C","text":"都表示沒有基因表現","explanation":"傳遞事件不能否定後續或同時的表現。"},{"id":"BIO-B01-Ch1.1.2-B027:D","text":"都要求生物改用另一套遺傳密碼","explanation":"資訊傳遞不需改換密碼解讀規則。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B028","topicId":"","stem":"某實驗只追蹤母細胞DNA拷貝如何到達子細胞。若標題要符合實際觀察，應選哪個？","correct":"BIO-B01-Ch1.1.2-B028:C","options":[{"id":"BIO-B01-Ch1.1.2-B028:A","text":"每個基因的轉譯速度","explanation":"未測量轉譯。"},{"id":"BIO-B01-Ch1.1.2-B028:B","text":"所有RNA的調控機制","explanation":"未研究RNA機制。"},{"id":"BIO-B01-Ch1.1.2-B028:C","text":"細胞分裂中的遺傳資訊傳遞","explanation":"追蹤DNA的細胞間分配正是傳遞。"},{"id":"BIO-B01-Ch1.1.2-B028:D","text":"子代性狀已不需發育的證明","explanation":"取得DNA不等於不需發育。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B029","topicId":"","stem":"學生把「細胞分裂前DNA會複製」解讀為「DNA分子直接變成另一種細胞」。哪個說明能修正此誤解？","correct":"BIO-B01-Ch1.1.2-B029:D","options":[{"id":"BIO-B01-Ch1.1.2-B029:A","text":"DNA複製是將蛋白質改名","explanation":"DNA拷貝與蛋白質命名不同。"},{"id":"BIO-B01-Ch1.1.2-B029:B","text":"DNA複製只是在染色","explanation":"染色是觀察方法，不是複製。"},{"id":"BIO-B01-Ch1.1.2-B029:C","text":"DNA複製是把成品性狀撕成兩半","explanation":"性狀不是被分配的DNA資訊副本。"},{"id":"BIO-B01-Ch1.1.2-B029:D","text":"複製產生DNA拷貝，細胞分裂後子細胞可取得這些資訊","explanation":"DNA分子和整個細胞應分開，拷貝支援後續細胞傳承。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B030","topicId":"","stem":"有人看見受精卵同時具有父母來源的DNA，便說「兩位親代的全部體細胞DNA都搬進去了」。哪個判斷合理？","correct":"BIO-B01-Ch1.1.2-B030:A","options":[{"id":"BIO-B01-Ch1.1.2-B030:A","text":"過度推論；本節只支持雙親透過配子各提供一套資訊","explanation":"雙親來源不等於雙親所有體細胞被合併。"},{"id":"BIO-B01-Ch1.1.2-B030:B","text":"完全正確；配子就是親代全部體細胞","explanation":"配子與全部體細胞不同。"},{"id":"BIO-B01-Ch1.1.2-B030:C","text":"完全正確；一個基因就是一位親代","explanation":"基因是DNA片段，不是完整親代。"},{"id":"BIO-B01-Ch1.1.2-B030:D","text":"錯誤；受精卵完全不會繼承DNA","explanation":"受精卵確實繼承DNA。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第5、15張（正文第3、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B031","topicId":"","stem":"以下序列皆記錄DNA的一股，方向一致。兩段DNA以同一方向記錄為ATCG與TAGC，長度相同。哪個判斷最合理？","correct":"BIO-B01-Ch1.1.2-B031:C","options":[{"id":"BIO-B01-Ch1.1.2-B031:A","text":"長度相同所以序列必定相同","explanation":"長度不能取代順序比較。"},{"id":"BIO-B01-Ch1.1.2-B031:B","text":"只要都含四種字母，資訊就必定相同","explanation":"相同字母組成仍可有不同排列。"},{"id":"BIO-B01-Ch1.1.2-B031:C","text":"排列不同，因此不能把兩段序列視為相同","explanation":"兩段的核苷酸順序不同。"},{"id":"BIO-B01-Ch1.1.2-B031:D","text":"兩段必定屬於不同遺傳密碼系統","explanation":"序列不同不等於解讀規則不同。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B032","topicId":"","stem":"以下序列皆記錄DNA的一股，方向一致。資料表只列一段DNA含A、T、C、G各一個，沒有記錄順序。能否唯一還原其序列？","correct":"BIO-B01-Ch1.1.2-B032:D","options":[{"id":"BIO-B01-Ch1.1.2-B032:A","text":"能，必定是ATCG","explanation":"ATCG只是可能排列之一。"},{"id":"BIO-B01-Ch1.1.2-B032:B","text":"能，必定是GCAT","explanation":"GCAT也不是唯一可能。"},{"id":"BIO-B01-Ch1.1.2-B032:C","text":"能，任意排列都等同同一序列","explanation":"不同排列不能都稱相同序列。"},{"id":"BIO-B01-Ch1.1.2-B032:D","text":"不能，字母數量不能唯一決定排列","explanation":"除字母組成外，還需順序資訊。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B033","topicId":"","stem":"同一段DNA在課本被畫成藍色，在講義被畫成紫色，但記錄的核苷酸順序相同。可如何判斷？","correct":"BIO-B01-Ch1.1.2-B033:A","options":[{"id":"BIO-B01-Ch1.1.2-B033:A","text":"繪圖配色不同本身不證明DNA資訊改變","explanation":"序列未變，示意配色不是資訊差異的證據。"},{"id":"BIO-B01-Ch1.1.2-B033:B","text":"圖色改變就必定改換所有基因","explanation":"沒有序列改變資料，不能推所有基因改變。"},{"id":"BIO-B01-Ch1.1.2-B033:C","text":"紫色DNA必定不含核苷酸","explanation":"DNA仍由核苷酸構成。"},{"id":"BIO-B01-Ch1.1.2-B033:D","text":"藍色與紫色必定代表兩種遺傳密碼","explanation":"顏色不是遺傳密碼的解讀規則。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B034","topicId":"","stem":"兩張圖都畫雙股螺旋，但沒有提供核苷酸順序。只靠外形相似，可以認定資訊完全相同嗎？","correct":"BIO-B01-Ch1.1.2-B034:B","options":[{"id":"BIO-B01-Ch1.1.2-B034:A","text":"可以，雙股DNA只有一種序列","explanation":"雙股DNA可以具有不同序列。"},{"id":"BIO-B01-Ch1.1.2-B034:B","text":"不可以，仍需核對核苷酸排列內容","explanation":"共同外形不足以證明序列資訊相同。"},{"id":"BIO-B01-Ch1.1.2-B034:C","text":"可以，外形決定全部基因內容","explanation":"外形不能代替字母順序。"},{"id":"BIO-B01-Ch1.1.2-B034:D","text":"不可以，因為雙股螺旋不可能儲存資訊","explanation":"DNA能保存資訊，理由是序列未核對。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B035","topicId":"","stem":"以下序列皆記錄DNA的一股，方向一致。把同一DNA片段的記錄從ATGC改成AGTC，兩次都各有A、T、G、C一個。哪個資訊被改動？","correct":"BIO-B01-Ch1.1.2-B035:C","options":[{"id":"BIO-B01-Ch1.1.2-B035:A","text":"只有核苷酸種類，順序保持","explanation":"四種字母種類沒有改變，順序有改變。"},{"id":"BIO-B01-Ch1.1.2-B035:B","text":"只有染色體的數目","explanation":"這份記錄不涉及染色體計數。"},{"id":"BIO-B01-Ch1.1.2-B035:C","text":"核苷酸順序，而非這四種字母的數量","explanation":"第二與第三位置互換，字母數仍各一個。"},{"id":"BIO-B01-Ch1.1.2-B035:D","text":"必定是所有蛋白質的摺疊結果","explanation":"不能僅憑這項記錄推全部蛋白質結果。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B036","topicId":"","stem":"以下序列皆記錄DNA的一股，方向一致。比較同方向記錄的八個位置：甲AATCGGTA，乙AATCAGTA。只有哪一個位置不同？","correct":"BIO-B01-Ch1.1.2-B036:D","options":[{"id":"BIO-B01-Ch1.1.2-B036:A","text":"第2個","explanation":"第2個兩者都是A。"},{"id":"BIO-B01-Ch1.1.2-B036:B","text":"第4個","explanation":"第4個兩者都是C。"},{"id":"BIO-B01-Ch1.1.2-B036:C","text":"第8個","explanation":"第8個兩者都是A。"},{"id":"BIO-B01-Ch1.1.2-B036:D","text":"第5個","explanation":"第5個甲為G，乙為A，其餘七個位置相同。"}],"concept":"","example":"逐位對齊比較，不以字母總量代替位置。","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B037","topicId":"","stem":"助教想保存一段DNA的資訊，卻只拍下不標字母的雙螺旋圖。哪項補充最必要？","correct":"BIO-B01-Ch1.1.2-B037:A","options":[{"id":"BIO-B01-Ch1.1.2-B037:A","text":"記下該片段核苷酸的實際先後順序","explanation":"要表達特定資訊，需記錄特定序列。"},{"id":"BIO-B01-Ch1.1.2-B037:B","text":"把螺旋描得更粗但仍不記序列","explanation":"線條粗細無法補上序列內容。"},{"id":"BIO-B01-Ch1.1.2-B037:C","text":"只加上漂亮背景","explanation":"背景不提供DNA的排列內容。"},{"id":"BIO-B01-Ch1.1.2-B037:D","text":"只寫出DNA共三個英文字母","explanation":"DNA名稱不等於其核苷酸序列。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B038","topicId":"","stem":"以下序列皆記錄DNA的一股，方向一致。某張DNA表只記A有2個、T有2個，便宣稱序列必為AATT。哪個反例最直接指出資料不足？","correct":"BIO-B01-Ch1.1.2-B038:B","options":[{"id":"BIO-B01-Ch1.1.2-B038:A","text":"含有G的AGTT","explanation":"AGTT不符合原先的字母計數。"},{"id":"BIO-B01-Ch1.1.2-B038:B","text":"同樣符合數量的ATAT","explanation":"ATAT同樣有2個A及2個T，卻是不同排列。"},{"id":"BIO-B01-Ch1.1.2-B038:C","text":"完全不含A的TTTT","explanation":"TTTT的組成不符合資料。"},{"id":"BIO-B01-Ch1.1.2-B038:D","text":"只含一個字母的A","explanation":"單一A不符合總數。"}],"concept":"","example":"相同字母數量可有不同排列，因此數量表不是完整序列。","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B039","topicId":"","stem":"學生說：「A、T、C、G只有四種，所以所有生物只能有四種DNA資訊。」哪一點可直接修正？","correct":"BIO-B01-Ch1.1.2-B039:C","options":[{"id":"BIO-B01-Ch1.1.2-B039:A","text":"把每個核苷酸改稱一個細胞","explanation":"更名不能解釋資訊多樣性。"},{"id":"BIO-B01-Ch1.1.2-B039:B","text":"認定DNA只靠顏色區分資訊","explanation":"圖色不是序列資訊。"},{"id":"BIO-B01-Ch1.1.2-B039:C","text":"多個核苷酸可排成多種序列，資訊不只由字母種類數決定","explanation":"四種基本單位可用不同排列承載大量資訊。"},{"id":"BIO-B01-Ch1.1.2-B039:D","text":"否認DNA具有任何順序","explanation":"DNA確實具有核苷酸順序。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B040","topicId":"","stem":"以下序列皆記錄DNA的一股，方向一致。比較ATAT與TATA兩段記錄時，研究者應如何區分「組成」與「序列」？","correct":"BIO-B01-Ch1.1.2-B040:D","options":[{"id":"BIO-B01-Ch1.1.2-B040:A","text":"組成與序列都完全不同","explanation":"兩者皆為2A與2T，組成相同。"},{"id":"BIO-B01-Ch1.1.2-B040:B","text":"兩者都只由蛋白質組成","explanation":"題幹是DNA核苷酸記錄。"},{"id":"BIO-B01-Ch1.1.2-B040:C","text":"只要A與T數量相同，序列就無法不同","explanation":"數量相同不能推出順序相同。"},{"id":"BIO-B01-Ch1.1.2-B040:D","text":"兩者字母數量相同，但排列順序不同","explanation":"兩者同組成而不同序列，須分開判斷。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7 頁（PDF 56 頁）｜本節筆記 Ch1.1.2 正式PNG第6張（正文第4頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B041","topicId":"","stem":"某流程圖的甲步驟為依DNA資訊合成mRNA，乙步驟為依mRNA資訊合成胺基酸鏈。甲、乙的標籤應為何？","correct":"BIO-B01-Ch1.1.2-B041:D","options":[{"id":"BIO-B01-Ch1.1.2-B041:A","text":"甲轉譯，乙轉錄","explanation":"兩過程被顛倒。"},{"id":"BIO-B01-Ch1.1.2-B041:B","text":"甲與乙都叫DNA複製","explanation":"題幹產物分別為RNA和胺基酸鏈，不是DNA拷貝。"},{"id":"BIO-B01-Ch1.1.2-B041:C","text":"甲折疊，乙配子融合","explanation":"題幹沒有描述折疊或配子融合。"},{"id":"BIO-B01-Ch1.1.2-B041:D","text":"甲轉錄，乙轉譯","explanation":"甲形成RNA，乙形成胺基酸鏈，正確對應兩名稱。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B042","topicId":"","stem":"學生看到「DNA→mRNA→蛋白質」，便說原DNA最後都變成蛋白質。哪個說明正確？","correct":"BIO-B01-Ch1.1.2-B042:A","options":[{"id":"BIO-B01-Ch1.1.2-B042:A","text":"箭頭表示資訊被使用來合成產物，不是DNA分子一路變成蛋白質","explanation":"DNA供應模板資訊，細胞另行合成RNA及蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B042:B","text":"箭頭證明DNA與蛋白質是同一種分子","explanation":"核酸與蛋白質的分子身分不同。"},{"id":"BIO-B01-Ch1.1.2-B042:C","text":"mRNA必定先變成一條染色體","explanation":"mRNA不是先變成染色體再合成蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B042:D","text":"DNA在任何表現過程中都不提供資訊","explanation":"DNA資訊正是本例的起點。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B043","topicId":"","stem":"細胞已依某基因資訊製成mRNA，但尚未開始依它合成胺基酸鏈。依題意，哪個階段已完成而哪個尚未開始？","correct":"BIO-B01-Ch1.1.2-B043:B","options":[{"id":"BIO-B01-Ch1.1.2-B043:A","text":"轉譯已完成，轉錄未開始","explanation":"RNA形成在前，不能顛倒。"},{"id":"BIO-B01-Ch1.1.2-B043:B","text":"轉錄已完成，轉譯未開始","explanation":"mRNA形成表示已轉錄；合成胺基酸鏈才是轉譯。"},{"id":"BIO-B01-Ch1.1.2-B043:C","text":"蛋白質折疊已完成，轉錄未開始","explanation":"還沒產生胺基酸鏈，不能稱該蛋白質已折疊完成。"},{"id":"BIO-B01-Ch1.1.2-B043:D","text":"DNA已完全變成蛋白質","explanation":"DNA沒有因轉錄而直接變成蛋白質。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B044","topicId":"","stem":"一個蛋白質編碼基因仍保留在DNA上，細胞正以其mRNA資訊合成胺基酸鏈。哪項判斷正確？","correct":"BIO-B01-Ch1.1.2-B044:C","options":[{"id":"BIO-B01-Ch1.1.2-B044:A","text":"DNA既然還在，就不可能有基因表現","explanation":"DNA保留與基因表現並不矛盾。"},{"id":"BIO-B01-Ch1.1.2-B044:B","text":"合成胺基酸鏈必定是DNA複製","explanation":"DNA複製產生DNA拷貝，不是胺基酸鏈。"},{"id":"BIO-B01-Ch1.1.2-B044:C","text":"基因表現可進行，而原DNA不必變成蛋白質","explanation":"資訊可被使用，DNA本體仍可保留。"},{"id":"BIO-B01-Ch1.1.2-B044:D","text":"這代表配子正在融合","explanation":"沒有配子融合的描述。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B045","topicId":"","stem":"在簡化系統中，某蛋白質只能依指定mRNA合成，且沒有其他可用mRNA。若該mRNA完全缺失，可預期什麼？","correct":"BIO-B01-Ch1.1.2-B045:D","options":[{"id":"BIO-B01-Ch1.1.2-B045:A","text":"DNA會直接補位變成該蛋白質","explanation":"本節流程不允許DNA直接變成蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B045:B","text":"核苷酸會自動改名為胺基酸","explanation":"核苷酸與胺基酸是不同單位，不能改名替代。"},{"id":"BIO-B01-Ch1.1.2-B045:C","text":"所有DNA都因此失去遺傳能力","explanation":"單一mRNA缺失不能推所有DNA無法遺傳。"},{"id":"BIO-B01-Ch1.1.2-B045:D","text":"該系統缺少此蛋白質合成所需的資訊中介","explanation":"在題設沒有其他mRNA的前提下，指定資訊中介缺失。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B046","topicId":"","stem":"某研究只發現新mRNA產生，未檢查胺基酸鏈。哪個結論有直接證據？","correct":"BIO-B01-Ch1.1.2-B046:A","options":[{"id":"BIO-B01-Ch1.1.2-B046:A","text":"發生了RNA合成，尚不能僅據此宣稱對應蛋白質已形成","explanation":"轉錄與轉譯需區分，RNA存在不是蛋白質完成的直接證據。"},{"id":"BIO-B01-Ch1.1.2-B046:B","text":"所有蛋白質皆已完成折疊","explanation":"未觀察蛋白質，不能聲稱全數完成。"},{"id":"BIO-B01-Ch1.1.2-B046:C","text":"DNA已變成成熟蛋白質","explanation":"分子不沿箭頭直接互變。"},{"id":"BIO-B01-Ch1.1.2-B046:D","text":"該細胞完全沒有基因表現","explanation":"形成基因相關RNA本身已是表現過程的一部分。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B047","topicId":"","stem":"教具把DNA模板卡保留在原位，依其內容另做mRNA卡，再按mRNA內容排出胺基酸鏈。這種安排保留了哪項重要觀念？","correct":"BIO-B01-Ch1.1.2-B047:B","options":[{"id":"BIO-B01-Ch1.1.2-B047:A","text":"模板卡必須消失才能轉錄","explanation":"轉錄不要求原DNA消失。"},{"id":"BIO-B01-Ch1.1.2-B047:B","text":"資訊可被讀出使用，原DNA不需變成產物","explanation":"教具用另造產物表達模板與產物的區別。"},{"id":"BIO-B01-Ch1.1.2-B047:C","text":"mRNA等於全部DNA","explanation":"單一mRNA不等於整套DNA。"},{"id":"BIO-B01-Ch1.1.2-B047:D","text":"每次轉譯都需要另一個受精卵","explanation":"蛋白質合成不需每次重新受精。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B048","topicId":"","stem":"有人把流程標成「DNA→mRNA為轉譯；mRNA資訊→胺基酸鏈為轉錄」。應如何更正？","correct":"BIO-B01-Ch1.1.2-B048:C","options":[{"id":"BIO-B01-Ch1.1.2-B048:A","text":"只刪掉mRNA","explanation":"mRNA是此例重要中介，不應刪除。"},{"id":"BIO-B01-Ch1.1.2-B048:B","text":"保留兩個名稱，改說DNA是胺基酸","explanation":"DNA不是胺基酸。"},{"id":"BIO-B01-Ch1.1.2-B048:C","text":"將兩個過程名稱對調","explanation":"DNA到RNA是轉錄，依mRNA造鏈是轉譯。"},{"id":"BIO-B01-Ch1.1.2-B048:D","text":"把兩個過程都改成染色","explanation":"染色是觀察方法，不代表這兩個合成流程。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B049","topicId":"","stem":"某細胞無法再合成新的指定mRNA，但仍有可用的既有mRNA。只依本節框架，能否斷言相關蛋白質合成立刻全部停止？","correct":"BIO-B01-Ch1.1.2-B049:D","options":[{"id":"BIO-B01-Ch1.1.2-B049:A","text":"能，因為舊mRNA絕不含資訊","explanation":"既有mRNA仍攜帶序列資訊。"},{"id":"BIO-B01-Ch1.1.2-B049:B","text":"能，DNA會立刻消失","explanation":"新的mRNA合成受限不等於DNA消失。"},{"id":"BIO-B01-Ch1.1.2-B049:C","text":"能，任何mRNA只能是遺傳成品性狀","explanation":"mRNA是資訊中介，不是成品性狀。"},{"id":"BIO-B01-Ch1.1.2-B049:D","text":"不能單憑這項資料斷言，既有mRNA仍可能供資訊使用","explanation":"題幹保留可用mRNA，不能直接推立刻全停。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B050","topicId":"","stem":"觀察者追蹤到DNA資訊先出現在mRNA，後續被用來形成胺基酸鏈。以下標題何者符合這條主線？","correct":"BIO-B01-Ch1.1.2-B050:A","options":[{"id":"BIO-B01-Ch1.1.2-B050:A","text":"蛋白質編碼基因的表現流程","explanation":"這描述以mRNA為中介的蛋白質編碼基因表現。"},{"id":"BIO-B01-Ch1.1.2-B050:B","text":"親代全部性狀直接搬移","explanation":"題幹是細胞內資訊使用，不是性狀搬移。"},{"id":"BIO-B01-Ch1.1.2-B050:C","text":"DNA分子變成蛋白質的證明","explanation":"觀察到資訊流不等於原分子互變。"},{"id":"BIO-B01-Ch1.1.2-B050:D","text":"只有DNA拷貝分配而沒有產物形成","explanation":"已描述RNA及胺基酸鏈形成，不能說無產物。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第7、15張（正文第5、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B051","topicId":"","stem":"基因甲的產物是參與細胞機器運作的RNA，未被轉譯成蛋白質。對甲最合理的判斷是什麼？","correct":"BIO-B01-Ch1.1.2-B051:C","options":[{"id":"BIO-B01-Ch1.1.2-B051:A","text":"甲從未表現，因為沒有蛋白質","explanation":"功能性RNA也可作為基因表現產物。"},{"id":"BIO-B01-Ch1.1.2-B051:B","text":"甲一定不是DNA上的基因","explanation":"DNA上的基因可以指定RNA產物。"},{"id":"BIO-B01-Ch1.1.2-B051:C","text":"甲可藉產生功能性RNA完成基因表現","explanation":"RNA本身發揮作用即符合本節的表現概念。"},{"id":"BIO-B01-Ch1.1.2-B051:D","text":"甲必定是整個蛋白體","explanation":"單一基因或RNA不等於全部蛋白質集合。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B052","topicId":"","stem":"兩個基因分別產生功能性RNA與蛋白質。哪項比較正確？","correct":"BIO-B01-Ch1.1.2-B052:D","options":[{"id":"BIO-B01-Ch1.1.2-B052:A","text":"只有產生蛋白質者才有表現","explanation":"RNA產物也可構成表現。"},{"id":"BIO-B01-Ch1.1.2-B052:B","text":"兩者的產物必定是同一種分子","explanation":"RNA與蛋白質屬不同分子種類。"},{"id":"BIO-B01-Ch1.1.2-B052:C","text":"兩者都必須把DNA本體消耗掉","explanation":"資訊被讀出不等於DNA必定消失。"},{"id":"BIO-B01-Ch1.1.2-B052:D","text":"兩者都可屬基因表現，但功能產物類型不同","explanation":"兩者均使用基因資訊形成產物。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B053","topicId":"","stem":"某細胞已有胺基酸鏈，但鏈未形成適合的立體形狀。若要理解其功能是否正常，應注意哪項？","correct":"BIO-B01-Ch1.1.2-B053:A","options":[{"id":"BIO-B01-Ch1.1.2-B053:A","text":"蛋白質形狀與功能相關，不能只看鏈已存在","explanation":"折疊與形狀是從產物到功能的重要環節。"},{"id":"BIO-B01-Ch1.1.2-B053:B","text":"只要有胺基酸鏈，所有功能必定完全正常","explanation":"鏈存在不能保證正確形狀或功能。"},{"id":"BIO-B01-Ch1.1.2-B053:C","text":"蛋白質功能只由染色體圖色決定","explanation":"示意圖顏色不決定蛋白質功能。"},{"id":"BIO-B01-Ch1.1.2-B053:D","text":"這條鏈必定就是DNA","explanation":"胺基酸鏈是蛋白質相關結構，不是DNA。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B054","topicId":"","stem":"報告指出水晶體細胞依基因資訊合成crystallin，蛋白質排列有助光線聚焦。它最直接連結哪兩個層面？","correct":"BIO-B01-Ch1.1.2-B054:B","options":[{"id":"BIO-B01-Ch1.1.2-B054:A","text":"遺傳密碼的種類與染料顏色","explanation":"本例不是在比較密碼種類或染料。"},{"id":"BIO-B01-Ch1.1.2-B054:B","text":"基因表現產物與細胞／組織功能","explanation":"蛋白質產物可參與透明及折射的功能。"},{"id":"BIO-B01-Ch1.1.2-B054:C","text":"DNA複製叉與減數分裂細節","explanation":"題幹未提供這些分子或分裂機制。"},{"id":"BIO-B01-Ch1.1.2-B054:D","text":"基因就是完整水晶體","explanation":"基因提供產物資訊，不能等同器官。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B055","topicId":"","stem":"「沒有觀察到某基因的蛋白質產物，因此它一定沒有表現。」要反駁這個全稱判斷，哪項最有力？","correct":"BIO-B01-Ch1.1.2-B055:C","options":[{"id":"BIO-B01-Ch1.1.2-B055:A","text":"所有基因都不在DNA上","explanation":"基因是DNA序列，不能否定其來源。"},{"id":"BIO-B01-Ch1.1.2-B055:B","text":"所有RNA都沒有作用","explanation":"功能性RNA明確具有作用。"},{"id":"BIO-B01-Ch1.1.2-B055:C","text":"該基因可能以功能性RNA作為產物","explanation":"若產物是有功能RNA，沒有蛋白質也可有表現。"},{"id":"BIO-B01-Ch1.1.2-B055:D","text":"任何基因都不會產生蛋白質","explanation":"許多基因確實編碼蛋白質，不能走向另一個全稱錯誤。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B056","topicId":"","stem":"一個RNA分子被確認參與蛋白質製造機器，且自身不作為mRNA被轉譯。依本節應如何理解？","correct":"BIO-B01-Ch1.1.2-B056:D","options":[{"id":"BIO-B01-Ch1.1.2-B056:A","text":"沒有被轉譯，所以必定無功能","explanation":"題幹已確認RNA參與機器運作。"},{"id":"BIO-B01-Ch1.1.2-B056:B","text":"它其實是一整套DNA","explanation":"RNA分子不是整套DNA。"},{"id":"BIO-B01-Ch1.1.2-B056:C","text":"它只有變成蛋白質後才有任何作用","explanation":"某些RNA本身就是機器成分。"},{"id":"BIO-B01-Ch1.1.2-B056:D","text":"RNA可直接執行功能，不一定都是蛋白質的資訊中介","explanation":"本節明確區分mRNA中介與其他功能性RNA。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B057","topicId":"","stem":"設某蛋白質胺基酸鏈已合成，其折疊受到干擾。只依本節可提出哪個合理預期？","correct":"BIO-B01-Ch1.1.2-B057:A","options":[{"id":"BIO-B01-Ch1.1.2-B057:A","text":"特定形狀可能改變，相關功能可能受影響","explanation":"形狀與功能相關，宜用可能而非必定全毀。"},{"id":"BIO-B01-Ch1.1.2-B057:B","text":"DNA必定已全部消失","explanation":"折疊變化不能直接推DNA消失。"},{"id":"BIO-B01-Ch1.1.2-B057:C","text":"該鏈立刻等於整套基因體","explanation":"胺基酸鏈與整套DNA不同。"},{"id":"BIO-B01-Ch1.1.2-B057:D","text":"所有其他蛋白質必定同時消失","explanation":"單一鏈的問題不推出全部蛋白質消失。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B058","topicId":"","stem":"甲主張RNA只供蛋白質合成讀取資訊，乙提出某RNA能調控蛋白質編碼基因。兩人的說法如何評估？","correct":"BIO-B01-Ch1.1.2-B058:B","options":[{"id":"BIO-B01-Ch1.1.2-B058:A","text":"甲完全正確，RNA不可能調控","explanation":"甲使用「只」排除了已知功能性RNA。"},{"id":"BIO-B01-Ch1.1.2-B058:B","text":"乙指出RNA作用不只mRNA的資訊中介角色","explanation":"某些RNA確可參與調控，超出mRNA中介角色。"},{"id":"BIO-B01-Ch1.1.2-B058:C","text":"乙表示所有基因都不需要DNA","explanation":"RNA功能不否定DNA基因資訊。"},{"id":"BIO-B01-Ch1.1.2-B058:D","text":"兩人都證明RNA就是蛋白質","explanation":"RNA與蛋白質仍是不同分子。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B059","topicId":"","stem":"教學總表將全部基因只連到「蛋白質」一個終點。若要符合本節，應補上哪項？","correct":"BIO-B01-Ch1.1.2-B059:C","options":[{"id":"BIO-B01-Ch1.1.2-B059:A","text":"DNA直接變成所有成熟性狀","explanation":"遺傳資訊不直接變成成品性狀。"},{"id":"BIO-B01-Ch1.1.2-B059:B","text":"把所有蛋白質刪除","explanation":"蛋白質仍是許多基因的重要產物，不能刪除。"},{"id":"BIO-B01-Ch1.1.2-B059:C","text":"可產生本身有功能的RNA這一支","explanation":"功能性RNA是不可遺漏的另一類產物。"},{"id":"BIO-B01-Ch1.1.2-B059:D","text":"基因先變成一個完整親代","explanation":"基因片段不會變成完整親代。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B060","topicId":"","stem":"某課堂觀察把基因資訊、mRNA、crystallin及水晶體功能列為四項。以下哪個整合最合適？","correct":"BIO-B01-Ch1.1.2-B060:D","options":[{"id":"BIO-B01-Ch1.1.2-B060:A","text":"水晶體功能先製造DNA，再把DNA變成crystallin","explanation":"這把資訊到產物的關係倒置。"},{"id":"BIO-B01-Ch1.1.2-B060:B","text":"mRNA和crystallin只是同一分子的兩個名稱","explanation":"mRNA是核酸，crystallin是蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B060:C","text":"crystallin的存在證明所有基因都編碼蛋白質","explanation":"單一蛋白質例子不能推所有基因的產物類型。"},{"id":"BIO-B01-Ch1.1.2-B060:D","text":"細胞讀出基因資訊，經mRNA中介合成crystallin，蛋白質可參與功能","explanation":"資訊、產物與功能的關係與本節例子一致。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第8、9、15張（正文第6、7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B061","topicId":"","stem":"甲與乙的某同源基因序列不同，研究者卻發現其核苷酸資訊解讀規則大致相同。兩項結果是否矛盾？","correct":"BIO-B01-Ch1.1.2-B061:A","options":[{"id":"BIO-B01-Ch1.1.2-B061:A","text":"不矛盾，內容不同仍可使用相同解讀規則","explanation":"序列是內容，遺傳密碼是讀取規則，兩層可分開。"},{"id":"BIO-B01-Ch1.1.2-B061:B","text":"矛盾，相同規則必定使所有序列相同","explanation":"相同規則不限制內容相同。"},{"id":"BIO-B01-Ch1.1.2-B061:C","text":"矛盾，只要序列不同就沒有基因表現","explanation":"序列不同不等於失去表現能力。"},{"id":"BIO-B01-Ch1.1.2-B061:D","text":"不矛盾，因為DNA完全不含資訊","explanation":"DNA的序列確實攜帶資訊。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B062","topicId":"","stem":"學生把「各種生物基本上共用遺傳密碼」改寫為「各種生物有完全相同的整套DNA」。問題在哪裡？","correct":"BIO-B01-Ch1.1.2-B062:B","options":[{"id":"BIO-B01-Ch1.1.2-B062:A","text":"把蛋白體當成配子","explanation":"題幹沒有蛋白體或配子比較。"},{"id":"BIO-B01-Ch1.1.2-B062:B","text":"把解讀規則的共同性誤當成序列內容完全相同","explanation":"遺傳密碼相通不代表基因體序列全同。"},{"id":"BIO-B01-Ch1.1.2-B062:C","text":"把基因表現當成DNA複製速度","explanation":"錯誤涉及規則和內容，不是複製速度。"},{"id":"BIO-B01-Ch1.1.2-B062:D","text":"把全部DNA說成由蛋白質組成","explanation":"該句沒有主張DNA的分子組成為蛋白質。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B063","topicId":"","stem":"若比喻不同生物的DNA序列為不同文章，遺傳密碼較適合比喻成什麼？","correct":"BIO-B01-Ch1.1.2-B063:C","options":[{"id":"BIO-B01-Ch1.1.2-B063:A","text":"文章用紙的重量","explanation":"紙重不代表解讀資訊的方式。"},{"id":"BIO-B01-Ch1.1.2-B063:B","text":"讀者的人數","explanation":"讀者人數不是密碼規則。"},{"id":"BIO-B01-Ch1.1.2-B063:C","text":"共同的文字解讀規則","explanation":"不同內容可用共同規則讀取，符合本節區分。"},{"id":"BIO-B01-Ch1.1.2-B063:D","text":"每篇文章必須有相同內容","explanation":"相同規則並不強迫文章內容相同。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B064","topicId":"","stem":"某比較表將不同物種的DNA序列列在左欄，將序列解讀方式列在右欄。要表示本節主旨，哪種安排正確？","correct":"BIO-B01-Ch1.1.2-B064:D","options":[{"id":"BIO-B01-Ch1.1.2-B064:A","text":"左欄一律完全相同，右欄必定完全無關","explanation":"本節正是區分序列差異與密碼共同性。"},{"id":"BIO-B01-Ch1.1.2-B064:B","text":"左右兩欄都只寫染色體顏色","explanation":"顏色不能代替DNA序列與解讀規則。"},{"id":"BIO-B01-Ch1.1.2-B064:C","text":"左欄與右欄都不涉及遺傳資訊","explanation":"兩欄皆與遺傳資訊相關。"},{"id":"BIO-B01-Ch1.1.2-B064:D","text":"左欄可不同，右欄基本上相通","explanation":"序列內容可多樣，而解讀規則大致共用。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B065","topicId":"","stem":"兩種生物外形差異很大，能否只由外形不同推論其遺傳密碼必定完全不同？","correct":"BIO-B01-Ch1.1.2-B065:A","options":[{"id":"BIO-B01-Ch1.1.2-B065:A","text":"不能，外形差異不否定解讀規則大致共用","explanation":"生物差異與序列和表現等有關，不必換成完全不同密碼。"},{"id":"BIO-B01-Ch1.1.2-B065:B","text":"能，外形每變一次都必須更換密碼表","explanation":"沒有這種外形與密碼必然一對一關係。"},{"id":"BIO-B01-Ch1.1.2-B065:C","text":"能，外形不同表示其中一種沒有DNA","explanation":"外形不同不代表沒有DNA。"},{"id":"BIO-B01-Ch1.1.2-B065:D","text":"不能，因為所有生物的DNA序列必定相同","explanation":"正確理由是內容和規則可分開，不是全部序列相同。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B066","topicId":"","stem":"報告發現多種生命使用大致相同的資訊解讀規則。哪個結論與證據強度最相稱？","correct":"BIO-B01-Ch1.1.2-B066:B","options":[{"id":"BIO-B01-Ch1.1.2-B066:A","text":"已證明每個物種所有基因完全相同","explanation":"共用規則不是完整基因序列比對結果。"},{"id":"BIO-B01-Ch1.1.2-B066:B","text":"提供所有生命彼此相關的證據","explanation":"密碼普遍性支持生命的相關性。"},{"id":"BIO-B01-Ch1.1.2-B066:C","text":"已證明所有蛋白質功能完全相同","explanation":"產物功能也與實際序列等因素相關。"},{"id":"BIO-B01-Ch1.1.2-B066:D","text":"已證明每個生物只有一條染色體","explanation":"解讀規則不能決定染色體條數。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B067","topicId":"","stem":"某DNA序列紀錄改動了一個位置，但沒有任何解讀規則改變的證據。哪種描述最審慎？","correct":"BIO-B01-Ch1.1.2-B067:C","options":[{"id":"BIO-B01-Ch1.1.2-B067:A","text":"整個生命界都改換遺傳密碼","explanation":"局部序列資料不能推出生命界規則全改。"},{"id":"BIO-B01-Ch1.1.2-B067:B","text":"所有生物的DNA必定同步改變","explanation":"沒有其他生物同步變化的資料。"},{"id":"BIO-B01-Ch1.1.2-B067:C","text":"目前觀察到序列內容改變，不能直接稱為密碼規則改變","explanation":"先分清實際字母內容與解讀方式。"},{"id":"BIO-B01-Ch1.1.2-B067:D","text":"原DNA必定不再是核酸","explanation":"序列變化不等於分子種類不再是DNA。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B068","topicId":"","stem":"教材寫「基本上相同的遺傳密碼」，編輯想改成更精確的中文說明。應選哪項？","correct":"BIO-B01-Ch1.1.2-B068:D","options":[{"id":"BIO-B01-Ch1.1.2-B068:A","text":"所有生命的全部DNA完全相同","explanation":"這把規則誤換成內容全同。"},{"id":"BIO-B01-Ch1.1.2-B068:B","text":"每一物種只能讀取自己特有的一套完全不同規則","explanation":"這否定本節的普遍共同性。"},{"id":"BIO-B01-Ch1.1.2-B068:C","text":"只要共用規則，生物就沒有差異","explanation":"共同解讀規則與生命多樣性可以並存。"},{"id":"BIO-B01-Ch1.1.2-B068:D","text":"生命的資訊解讀具有普遍共同性，序列內容仍可不同","explanation":"這保留本節的基本共同性及序列差異兩個重點。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B069","topicId":"","stem":"兩位同學分別說「不同物種的序列可不同」和「不同生命的遺傳密碼大致共用」。最佳整合是什麼？","correct":"BIO-B01-Ch1.1.2-B069:A","options":[{"id":"BIO-B01-Ch1.1.2-B069:A","text":"兩句可以同時成立，因為說的是內容與規則兩層","explanation":"序列多樣與共用解讀方式並不衝突。"},{"id":"BIO-B01-Ch1.1.2-B069:B","text":"只能第一句成立，第二句必錯","explanation":"本節明確支持密碼基本共用。"},{"id":"BIO-B01-Ch1.1.2-B069:C","text":"只能第二句成立，所以序列不能不同","explanation":"密碼共用不排除序列不同。"},{"id":"BIO-B01-Ch1.1.2-B069:D","text":"兩句都表示DNA不提供資訊","explanation":"兩句都與DNA資訊有關，沒有否定其作用。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B070","topicId":"","stem":"教學活動要求分別填入「實際的A/T/C/G排列」和「排列如何被解讀」。下列哪個配對正確？","correct":"BIO-B01-Ch1.1.2-B070:B","options":[{"id":"BIO-B01-Ch1.1.2-B070:A","text":"前者是蛋白體，後者是配子","explanation":"兩個描述都不是這些名詞。"},{"id":"BIO-B01-Ch1.1.2-B070:B","text":"前者是DNA序列，後者是遺傳密碼","explanation":"DNA序列指內容，遺傳密碼指解讀規則。"},{"id":"BIO-B01-Ch1.1.2-B070:C","text":"前者是遺傳密碼，後者是染色體照片","explanation":"實際排列不能只稱規則，照片也不是解讀方式。"},{"id":"BIO-B01-Ch1.1.2-B070:D","text":"兩者都只能叫完整基因體","explanation":"整套基因體與解讀規則不等同。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B071","topicId":"","stem":"研究者以甲物種的基因X對照乙物種一段身分不明的DNA，見到少量字母相同便宣告兩者親緣最近。主要問題是什麼？","correct":"BIO-B01-Ch1.1.2-B071:D","options":[{"id":"BIO-B01-Ch1.1.2-B071:A","text":"沒有把字母全部改成蛋白質","explanation":"不需要改成蛋白質才能比較DNA。"},{"id":"BIO-B01-Ch1.1.2-B071:B","text":"只要看到相同字母就不應記錄","explanation":"相同字母可以記錄，但須有適切解讀。"},{"id":"BIO-B01-Ch1.1.2-B071:C","text":"DNA本來不能用於任何關係研究","explanation":"合適序列比較能提供親緣線索。"},{"id":"BIO-B01-Ch1.1.2-B071:D","text":"未確認可比較的同源區段，且結論超過資料所能支持","explanation":"比較對象及結論強度都需要控制。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B072","topicId":"","stem":"已確認三物種同源基因的同向對應單股區段：甲AATGCC、乙AATGCT、丙AACACT。與甲相比，哪組差異位置數正確？","correct":"BIO-B01-Ch1.1.2-B072:A","options":[{"id":"BIO-B01-Ch1.1.2-B072:A","text":"乙1個、丙3個","explanation":"乙僅第6位不同；丙第3、4、6位不同。"},{"id":"BIO-B01-Ch1.1.2-B072:B","text":"乙3個、丙1個","explanation":"把兩組差異數倒置了。"},{"id":"BIO-B01-Ch1.1.2-B072:C","text":"乙0個、丙6個","explanation":"甲乙第6位不同，甲丙也非每位都異。"},{"id":"BIO-B01-Ch1.1.2-B072:D","text":"乙6個、丙0個","explanation":"甲乙非全異，甲丙也不是相同。"}],"concept":"","example":"差異位置少表示此對應區段較相似，不能只據此直接定論完整親緣樹。","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B073","topicId":"","stem":"同源基因的100個已對齊位置中，甲乙有8處不同，甲丙有20處不同。只談這個區段，哪個結論正確？","correct":"BIO-B01-Ch1.1.2-B073:B","options":[{"id":"BIO-B01-Ch1.1.2-B073:A","text":"甲丙比甲乙更相似","explanation":"甲乙的差異8小於20，較相似。"},{"id":"BIO-B01-Ch1.1.2-B073:B","text":"甲乙的序列較相似，可作為關係推論的一項線索","explanation":"等長對齊區段中差異較少者較相似；關係結論仍有限。"},{"id":"BIO-B01-Ch1.1.2-B073:C","text":"甲乙所有基因都完全相同","explanation":"局部相似不能推出全基因一致。"},{"id":"BIO-B01-Ch1.1.2-B073:D","text":"這些數字證明甲乙就是同一個個體","explanation":"區段相似度不是個體身分的充分證據。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B074","topicId":"","stem":"甲乙在某同源基因短區段完全相同。報告寫「所以兩物種所有蛋白質功能都相同」。應如何修正？","correct":"BIO-B01-Ch1.1.2-B074:C","options":[{"id":"BIO-B01-Ch1.1.2-B074:A","text":"改說兩者都沒有基因","explanation":"有同源基因資料不能說沒有基因。"},{"id":"BIO-B01-Ch1.1.2-B074:B","text":"保留原結論，短區段足以代表全部","explanation":"短區段不能代表所有基因及功能。"},{"id":"BIO-B01-Ch1.1.2-B074:C","text":"只說該區段相同，可提供功能與關係研究的線索","explanation":"結論應限定在已比較區段，並保留推論界線。"},{"id":"BIO-B01-Ch1.1.2-B074:D","text":"改說凡相同序列都沒有功能","explanation":"序列相同不等於無功能。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B075","topicId":"","stem":"科學家欲比較三物種中某類蛋白質的序列以探索功能。哪項步驟最符合本節前提？","correct":"BIO-B01-Ch1.1.2-B075:D","options":[{"id":"BIO-B01-Ch1.1.2-B075:A","text":"先任意挑三種毫無對應的分子","explanation":"任意分子不建立合適對應關係。"},{"id":"BIO-B01-Ch1.1.2-B075:B","text":"只比較三份檔案大小","explanation":"檔案大小不能取代生物序列。"},{"id":"BIO-B01-Ch1.1.2-B075:C","text":"把圖色相同當作序列相同","explanation":"配色不是核苷酸或胺基酸順序。"},{"id":"BIO-B01-Ch1.1.2-B075:D","text":"確認比較的是相應的同一類蛋白質序列","explanation":"同一類蛋白質的相應序列才是合適比較對象。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B076","topicId":"","stem":"同一個同源基因區段的比較顯示甲乙差異較少，另一個區段卻不呈現相同趨勢。哪項處理較合理？","correct":"BIO-B01-Ch1.1.2-B076:A","options":[{"id":"BIO-B01-Ch1.1.2-B076:A","text":"保留兩項結果，增加適切證據再評估關係","explanation":"序列提供線索，需要合適證據綜合解讀。"},{"id":"BIO-B01-Ch1.1.2-B076:B","text":"刪掉第二區段，直接把第一結果當最終定論","explanation":"選擇性刪除不符結果會誇大結論。"},{"id":"BIO-B01-Ch1.1.2-B076:C","text":"宣布DNA比較完全沒有任何用途","explanation":"結果不同不表示所有序列比較都無用。"},{"id":"BIO-B01-Ch1.1.2-B076:D","text":"只要第一區段較像，就認定所有基因都相同","explanation":"單一區段無法代表全部基因。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B077","topicId":"","stem":"比較同向的同源基因單股片段，甲為ACGTAC，乙為ACGTTC。哪個敘述最精確？","correct":"BIO-B01-Ch1.1.2-B077:B","options":[{"id":"BIO-B01-Ch1.1.2-B077:A","text":"兩序列全部相同","explanation":"第5位A與T不同。"},{"id":"BIO-B01-Ch1.1.2-B077:B","text":"只有第5位不同，其餘五位相同","explanation":"逐位比對只有第5位不同。"},{"id":"BIO-B01-Ch1.1.2-B077:C","text":"差異在第1位與第6位","explanation":"第1位都是A，第6位都是C。"},{"id":"BIO-B01-Ch1.1.2-B077:D","text":"兩序列相似足以直接證明同一物種","explanation":"短片段相似不充分判定物種同一性。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B078","topicId":"","stem":"某研究已確認比對同源基因，結果指出序列相近。下一句應如何寫才不過度推論？","correct":"BIO-B01-Ch1.1.2-B078:C","options":[{"id":"BIO-B01-Ch1.1.2-B078:A","text":"這已證明全部性狀完全相同","explanation":"序列相近不保證全部性狀相同。"},{"id":"BIO-B01-Ch1.1.2-B078:B","text":"任意其他DNA片段都可不查就視為相同","explanation":"其他片段仍需實際核對。"},{"id":"BIO-B01-Ch1.1.2-B078:C","text":"此結果可作為物種關係與蛋白質功能研究的線索","explanation":"保留「線索」符合本節證據定位。"},{"id":"BIO-B01-Ch1.1.2-B078:D","text":"從此不需要任何其他證據","explanation":"有限比較不取消其他證據的需要。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B079","topicId":"","stem":"兩組同源DNA區段都長10個對應位置。第一組不同2處，第二組不同5處。哪個基本計算正確？","correct":"BIO-B01-Ch1.1.2-B079:D","options":[{"id":"BIO-B01-Ch1.1.2-B079:A","text":"第一組相同2處，第二組相同5處","explanation":"第一組相同應為10減2等於8。"},{"id":"BIO-B01-Ch1.1.2-B079:B","text":"第一組相同5處，第二組相同2處","explanation":"相同數不能用差異數直接對調。"},{"id":"BIO-B01-Ch1.1.2-B079:C","text":"第一組相同10處，第二組相同10處","explanation":"題幹兩組均有差異，不可能全部相同。"},{"id":"BIO-B01-Ch1.1.2-B079:D","text":"第一組相同8處，第二組相同5處","explanation":"由總位置減去差異位置，分別得8與5。"}],"concept":"","example":"先區分「相同數」與「差異數」，再談序列相似度。","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B080","topicId":"","stem":"某資料庫有已確認的同源基因區段，也有身分不明的短DNA片段。研究物種關係時，哪種做法最合適？","correct":"BIO-B01-Ch1.1.2-B080:A","options":[{"id":"BIO-B01-Ch1.1.2-B080:A","text":"優先使用可確認對應的同源序列，並限制結論範圍","explanation":"比較前提與結論強度都符合本節。"},{"id":"BIO-B01-Ch1.1.2-B080:B","text":"兩類資料完全不需區分","explanation":"來源和對應身分會影響比較意義。"},{"id":"BIO-B01-Ch1.1.2-B080:C","text":"只要片段都含A，便足以判定最近親緣","explanation":"單一共同字母不足以直接推親緣。"},{"id":"BIO-B01-Ch1.1.2-B080:D","text":"只以DNA記錄的字體大小排序親緣","explanation":"排版不是生物學關係證據。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 Ch1.1.2 正式PNG第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B081","topicId":"","stem":"研究只定出某物種三個基因的序列，就宣布已取得該物種完整基因體。哪項評估正確？","correct":"BIO-B01-Ch1.1.2-B081:C","options":[{"id":"BIO-B01-Ch1.1.2-B081:A","text":"正確，三個基因必定等於全套DNA","explanation":"題幹沒有證據證明這三個基因涵蓋該物種全部DNA序列。"},{"id":"BIO-B01-Ch1.1.2-B081:B","text":"正確，非基因DNA不屬基因體","explanation":"基因體也包含其他DNA序列。"},{"id":"BIO-B01-Ch1.1.2-B081:C","text":"證據不足，部分基因不能代表整套DNA資訊","explanation":"完整基因體的要求遠超過選定幾個基因。"},{"id":"BIO-B01-Ch1.1.2-B081:D","text":"錯誤，因為任何基因都不在DNA中","explanation":"基因確實是DNA中的資訊片段。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B082","topicId":"","stem":"某DNA資料庫宣稱保存完整基因體，卻主動刪除全部非基因區域。依本節應如何評估？","correct":"BIO-B01-Ch1.1.2-B082:D","options":[{"id":"BIO-B01-Ch1.1.2-B082:A","text":"刪除後反而更完整","explanation":"刪去原屬整套DNA的部分不是更完整。"},{"id":"BIO-B01-Ch1.1.2-B082:B","text":"基因體本來只指蛋白質集合","explanation":"蛋白質集合稱蛋白體。"},{"id":"BIO-B01-Ch1.1.2-B082:C","text":"只要留下一個基因即可稱完整","explanation":"單一基因不能代表完整基因體。"},{"id":"BIO-B01-Ch1.1.2-B082:D","text":"資料不再涵蓋整套DNA，不能把非基因區域排除後仍稱完整","explanation":"基因體不只包括基因，也含其他DNA序列。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B083","topicId":"","stem":"甲檔案保存某一基因的DNA序列，乙檔案保存一個生物整套DNA資訊。兩檔案的範圍應如何分別稱呼？","correct":"BIO-B01-Ch1.1.2-B083:A","options":[{"id":"BIO-B01-Ch1.1.2-B083:A","text":"甲為基因，乙為基因體","explanation":"前者是功能片段，後者是全套遺傳資訊。"},{"id":"BIO-B01-Ch1.1.2-B083:B","text":"甲為基因體，乙為單一核苷酸","explanation":"兩個範圍被顛倒且乙不是單一單位。"},{"id":"BIO-B01-Ch1.1.2-B083:C","text":"甲與乙都是蛋白體","explanation":"兩者都是DNA資訊，不是蛋白質集合。"},{"id":"BIO-B01-Ch1.1.2-B083:D","text":"甲為完整細胞，乙為mRNA","explanation":"檔案中的DNA序列不是完整細胞或mRNA。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B084","topicId":"","stem":"只計題設的兩套尚未複製核DNA，每套約30億鹼基對，不計其他DNA。合計約多少鹼基對？","correct":"BIO-B01-Ch1.1.2-B084:B","options":[{"id":"BIO-B01-Ch1.1.2-B084:A","text":"15億","explanation":"15億是30億的一半，不是兩套總數。"},{"id":"BIO-B01-Ch1.1.2-B084:B","text":"60億","explanation":"兩套乘每套30億，合計約60億鹼基對。"},{"id":"BIO-B01-Ch1.1.2-B084:C","text":"30億","explanation":"30億只是一套的量。"},{"id":"BIO-B01-Ch1.1.2-B084:D","text":"120億","explanation":"120億多乘了一次2，題幹已用鹼基對為單位。"}],"concept":"","example":"計算以「鹼基對」為單位，不把雙股又重複加倍。","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B085","topicId":"","stem":"假設一份資料完整記錄一套核DNA共30億鹼基對。把同一份資料複印兩份並排在桌上，能否說原本每套有60億鹼基對？","correct":"BIO-B01-Ch1.1.2-B085:C","options":[{"id":"BIO-B01-Ch1.1.2-B085:A","text":"能，複印紙張會增加原本每套DNA長度","explanation":"複印資料不改變原有一套的長度。"},{"id":"BIO-B01-Ch1.1.2-B085:B","text":"能，兩份資料就是兩個全新物種","explanation":"複本不是新物種。"},{"id":"BIO-B01-Ch1.1.2-B085:C","text":"不能，複本數變多不改變每套原有30億鹼基對的定義","explanation":"需區分每套資料量與資料複本總數。"},{"id":"BIO-B01-Ch1.1.2-B085:D","text":"不能，因為DNA不能被記錄","explanation":"DNA序列可以記錄，問題是單位與範圍混淆。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B086","topicId":"","stem":"報告以「整套生命說明書」形容基因體，又把其中一小段製作指令稱為基因。哪項詮釋正確？","correct":"BIO-B01-Ch1.1.2-B086:D","options":[{"id":"BIO-B01-Ch1.1.2-B086:A","text":"基因與基因體範圍必定完全相同","explanation":"部分與整體的範圍不同。"},{"id":"BIO-B01-Ch1.1.2-B086:B","text":"整套DNA只能有一段指令","explanation":"整套DNA可含多個基因及其他序列。"},{"id":"BIO-B01-Ch1.1.2-B086:C","text":"基因體只包括讀者的成品","explanation":"基因體是DNA資訊，不是產物清單。"},{"id":"BIO-B01-Ch1.1.2-B086:D","text":"基因是整套DNA資訊中的功能片段，不能取代全部基因體","explanation":"這保留了基因與基因體的層級差別。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B087","topicId":"","stem":"某段DNA被辨識為基因之外的調控區域。依本節，是否仍可列入該生物的基因體資料？","correct":"BIO-B01-Ch1.1.2-B087:A","options":[{"id":"BIO-B01-Ch1.1.2-B087:A","text":"可以，基因體包含基因外的DNA序列","explanation":"本節明示基因體也包含非基因DNA。"},{"id":"BIO-B01-Ch1.1.2-B087:B","text":"不可以，凡不直接編碼蛋白質都必須刪除","explanation":"不直接編碼蛋白質不代表不屬整套DNA。"},{"id":"BIO-B01-Ch1.1.2-B087:C","text":"不可以，基因體只能是一個基因","explanation":"單一基因不等於基因體。"},{"id":"BIO-B01-Ch1.1.2-B087:D","text":"可以，但要先把它改稱蛋白質","explanation":"它仍是DNA，不需改稱其他分子。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B088","topicId":"","stem":"在一個只為理解資料量而設的模型中，一套DNA有12億鹼基對，某細胞具兩套且尚未複製。只計這兩套，總數為何？","correct":"BIO-B01-Ch1.1.2-B088:B","options":[{"id":"BIO-B01-Ch1.1.2-B088:A","text":"12億鹼基對","explanation":"12億只算一套。"},{"id":"BIO-B01-Ch1.1.2-B088:B","text":"24億鹼基對","explanation":"2乘12億等於24億鹼基對。"},{"id":"BIO-B01-Ch1.1.2-B088:C","text":"6億鹼基對","explanation":"兩套相加，不是除以2。"},{"id":"BIO-B01-Ch1.1.2-B088:D","text":"48億鹼基對","explanation":"48億又多乘2，題幹沒有再複製。"}],"concept":"","example":"這是明示條件的模型數值，不是人類實際數據。","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B089","topicId":"","stem":"兩張資料卡，一張標「DNA全部序列」，另一張標「細胞表現出的全部蛋白質」。哪個命名才不混淆？","correct":"BIO-B01-Ch1.1.2-B089:C","options":[{"id":"BIO-B01-Ch1.1.2-B089:A","text":"兩張都叫單一基因","explanation":"全集資料不是單一基因。"},{"id":"BIO-B01-Ch1.1.2-B089:B","text":"DNA卡叫蛋白體，蛋白質卡叫基因體","explanation":"兩種集合的名稱顛倒。"},{"id":"BIO-B01-Ch1.1.2-B089:C","text":"DNA卡可對應基因體，蛋白質卡對應蛋白體","explanation":"DNA資訊全集與蛋白質集合分別是基因體與蛋白體。"},{"id":"BIO-B01-Ch1.1.2-B089:D","text":"兩張都只是mRNA","explanation":"mRNA只是一類RNA，不是這兩種全集。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B090","topicId":"","stem":"學生把「一套人類染色體約30億鹼基對」寫成「每個基因約30億鹼基對」。最主要要修正哪件事？","correct":"BIO-B01-Ch1.1.2-B090:D","options":[{"id":"BIO-B01-Ch1.1.2-B090:A","text":"把鹼基對改稱成熟細胞","explanation":"計數單位是DNA鹼基對，不是細胞。"},{"id":"BIO-B01-Ch1.1.2-B090:B","text":"把所有DNA改稱蛋白質","explanation":"DNA是核酸，不能更名為蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B090:C","text":"把30億改成每個物種都完全相同","explanation":"不同物種不必有同樣資料量。"},{"id":"BIO-B01-Ch1.1.2-B090:D","text":"把統計範圍從單一基因改回整套染色體DNA","explanation":"數值描述的是整套的大致量，不能分配給每個基因。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8-9 頁（PDF 57-58 頁）｜本節筆記 Ch1.1.2 正式PNG第12張（正文第10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B091","topicId":"","stem":"甲團隊比較完整DNA序列，乙團隊整理細胞表現的蛋白質集合。兩者主要對應哪些領域？","correct":"BIO-B01-Ch1.1.2-B091:B","options":[{"id":"BIO-B01-Ch1.1.2-B091:A","text":"甲蛋白體學，乙基因體學","explanation":"DNA與蛋白質集合的領域被顛倒。"},{"id":"BIO-B01-Ch1.1.2-B091:B","text":"甲基因體學，乙蛋白體學","explanation":"甲研究基因體DNA，乙研究蛋白體集合。"},{"id":"BIO-B01-Ch1.1.2-B091:C","text":"甲配子融合，乙DNA染色","explanation":"研究範圍不是配子融合或染色。"},{"id":"BIO-B01-Ch1.1.2-B091:D","text":"甲與乙都只能研究單一核苷酸","explanation":"兩者皆採集合尺度，並非只能看單一單位。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B092","topicId":"","stem":"實驗平台快速產生大量DNA資料，但資料尚未儲存、整理或比較。下一步最適合補強什麼？","correct":"BIO-B01-Ch1.1.2-B092:C","options":[{"id":"BIO-B01-Ch1.1.2-B092:A","text":"改以圖色直接決定基因功能","explanation":"配色不能取代序列與功能分析。"},{"id":"BIO-B01-Ch1.1.2-B092:B","text":"停止使用任何資料","explanation":"已得資料仍可進行有價值的處理。"},{"id":"BIO-B01-Ch1.1.2-B092:C","text":"以生物資訊學工具處理並分析資料","explanation":"大量資料需要運算工具儲存、組織及分析。"},{"id":"BIO-B01-Ch1.1.2-B092:D","text":"宣稱資料越多就不需要解讀","explanation":"數量增加不免除解讀需求。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B093","topicId":"","stem":"某研究同時需要生物問題設計、大量樣本處理及計算分析。依本節，什麼團隊安排較合適？","correct":"BIO-B01-Ch1.1.2-B093:D","options":[{"id":"BIO-B01-Ch1.1.2-B093:A","text":"只要會更換報告字體即可","explanation":"排版能力不能取代所需研究專長。"},{"id":"BIO-B01-Ch1.1.2-B093:B","text":"禁止資訊與數學專家參與","explanation":"本節強調跨領域專家合作。"},{"id":"BIO-B01-Ch1.1.2-B093:C","text":"把所有工作都當成蛋白質折疊","explanation":"樣本與資料分析不都叫蛋白質折疊。"},{"id":"BIO-B01-Ch1.1.2-B093:D","text":"結合生物、資訊、數學等不同專長","explanation":"不同專長能共同處理現代大規模生物資料問題。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B094","topicId":"","stem":"研究者分析某組織表現出的整套蛋白質及其性質，卻將這項研究命名為「完整DNA序列分析」。主要應如何更正？","correct":"BIO-B01-Ch1.1.2-B094:A","options":[{"id":"BIO-B01-Ch1.1.2-B094:A","text":"研究對象是蛋白質集合，應對應蛋白體學","explanation":"領域名稱應跟隨實際分子對象。"},{"id":"BIO-B01-Ch1.1.2-B094:B","text":"將全部蛋白質改稱DNA即可","explanation":"蛋白質與DNA不會因改名而同一。"},{"id":"BIO-B01-Ch1.1.2-B094:C","text":"將整套蛋白質稱為一個基因","explanation":"集合不能等同單一DNA功能片段。"},{"id":"BIO-B01-Ch1.1.2-B094:D","text":"否認蛋白質具有可研究的性質","explanation":"蛋白質性質正是蛋白體學的研究內容。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B095","topicId":"","stem":"一份大規模DNA研究含許多基因，也分析基因之外的DNA序列。是否仍可屬基因體學？","correct":"BIO-B01-Ch1.1.2-B095:B","options":[{"id":"BIO-B01-Ch1.1.2-B095:A","text":"不可以，基因體學完全排除非基因DNA","explanation":"本節定義包括整套基因或其他DNA序列。"},{"id":"BIO-B01-Ch1.1.2-B095:B","text":"可以，基因體學也研究其他DNA序列","explanation":"研究非基因區域不會自動超出基因體學。"},{"id":"BIO-B01-Ch1.1.2-B095:C","text":"不可以，只有蛋白質集合才叫基因體學","explanation":"蛋白質集合對應蛋白體學。"},{"id":"BIO-B01-Ch1.1.2-B095:D","text":"可以，但必須把DNA先改成mRNA","explanation":"研究DNA不需先把對象改成RNA。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B096","topicId":"","stem":"在同樣的一小時內，平台甲可分析10個樣本，平台乙可分析1,000個樣本並產生大量資料。若只評估本節的「高通量」特性，何者較符合？","correct":"BIO-B01-Ch1.1.2-B096:C","options":[{"id":"BIO-B01-Ch1.1.2-B096:A","text":"兩者資料越少才越高通量","explanation":"高通量重點是快速大量處理，不是資料少。"},{"id":"BIO-B01-Ch1.1.2-B096:B","text":"只要沒有資料就算高通量","explanation":"不產生資料不符合題述目的。"},{"id":"BIO-B01-Ch1.1.2-B096:C","text":"乙較符合快速處理大量樣本的特徵","explanation":"題設乙具大量且快速處理的能力。"},{"id":"BIO-B01-Ch1.1.2-B096:D","text":"只看平台的機殼顏色便能決定","explanation":"機殼顏色不是處理量指標。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B097","topicId":"","stem":"甲工作建立生物資料庫，乙工作整理基因記錄，丙工作用運算比較序列。哪項判斷正確？","correct":"BIO-B01-Ch1.1.2-B097:D","options":[{"id":"BIO-B01-Ch1.1.2-B097:A","text":"只有丙可涉及生物資訊學，儲存整理都不能","explanation":"本節定義同時包含儲存、整理及分析。"},{"id":"BIO-B01-Ch1.1.2-B097:B","text":"甲乙丙都只是蛋白質合成","explanation":"這些是資料工作，不是直接合成蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B097:C","text":"只有甲涉及基因表現，其餘都是配子融合","explanation":"資料處理不等於細胞內表現或受精。"},{"id":"BIO-B01-Ch1.1.2-B097:D","text":"甲乙丙都可屬生物資訊學的工作","explanation":"三種工作分別對應本節明列的三項功能。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B098","topicId":"","stem":"兩組細胞的DNA資料相近，但實際表現出的蛋白質集合不同。若要直接研究這項蛋白質差異，最合適的是什麼？","correct":"BIO-B01-Ch1.1.2-B098:A","options":[{"id":"BIO-B01-Ch1.1.2-B098:A","text":"比較兩組蛋白體及其性質","explanation":"差異標的是表現的蛋白質集合，適合蛋白體學。"},{"id":"BIO-B01-Ch1.1.2-B098:B","text":"只重畫DNA示意圖的顏色","explanation":"配色不能直接反映蛋白質集合差異。"},{"id":"BIO-B01-Ch1.1.2-B098:C","text":"把兩組蛋白質都稱為同一個基因","explanation":"多種蛋白質不是一個DNA基因。"},{"id":"BIO-B01-Ch1.1.2-B098:D","text":"直接認定兩組完全沒有遺傳資訊","explanation":"蛋白質集合不同不表示沒有DNA資訊。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B099","topicId":"","stem":"某研究已具高通量樣本資料與電腦分析工具，仍邀請不同專長的科學家共同解讀結果。哪個理由符合本節？","correct":"BIO-B01-Ch1.1.2-B099:B","options":[{"id":"BIO-B01-Ch1.1.2-B099:A","text":"資料夠多就只能由一種專長判讀","explanation":"大規模研究可受益於多種專長。"},{"id":"BIO-B01-Ch1.1.2-B099:B","text":"跨領域合作有助理解RNA與蛋白質活動如何協調","explanation":"本節以跨領域團隊連結大量資料與生物系統問題。"},{"id":"BIO-B01-Ch1.1.2-B099:C","text":"團隊人數可以直接代替全部資料","explanation":"人數不是生物證據本身。"},{"id":"BIO-B01-Ch1.1.2-B099:D","text":"電腦一出數字，就能忽略生物問題","explanation":"數據仍需放回生物學問題解讀。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B100","topicId":"","stem":"一個計畫依序完成大量樣本分析、資料儲存整理、運算比對與生物功能解讀。哪個總結最合適？","correct":"BIO-B01-Ch1.1.2-B100:C","options":[{"id":"BIO-B01-Ch1.1.2-B100:A","text":"資料量大表示各種序列必定相同","explanation":"資料量不決定序列是否相同。"},{"id":"BIO-B01-Ch1.1.2-B100:B","text":"只要高通量便不需後續運算","explanation":"大量資料仍須處理與分析。"},{"id":"BIO-B01-Ch1.1.2-B100:C","text":"高通量、生物資訊學與跨領域研究可共同支援大規模生物研究","explanation":"三項發展相互配合，才能把大量資料用於生物問題。"},{"id":"BIO-B01-Ch1.1.2-B100:D","text":"上述所有步驟都只叫DNA轉譯","explanation":"轉譯是依mRNA資訊合成胺基酸鏈，不是整項研究流程。"}],"concept":"","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 9 頁（PDF 58 頁）｜本節筆記 Ch1.1.2 正式PNG第13、15張（正文第11、13頁）","shuffle":true}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"bio-chapter-01-concept-1-1-child-03-theme-life-requires-the-transfer-and-transformation-of-energy-and-matter","title":"Ch1.1.3 主題：生命需要能量與物質的轉移與轉換","version":"B01-v1:360794f6d1281fc1acb4","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["Campbell Biology 12e｜第一輪","Ch1 演化、生物學主題與科學探究","Ch1.1 生命的統整主題"],"comparison":{"status":"BASELINE","reason":"中國醫為主要題庫及唯一比對基準。"},"banks":[{"depth":"掃過","target":50,"questions":[{"id":"BIO-B01-Ch1.1.3-S001","topicId":"","stem":"若要概括生命活動的能量需求，下列哪句最合適？","correct":"BIO-B01-Ch1.1.3-S001:B","options":[{"id":"BIO-B01-Ch1.1.3-S001:A","text":"只有奔跑需要能量","explanation":"生長及細胞工作也需要能量，範圍不能限於奔跑。"},{"id":"BIO-B01-Ch1.1.3-S001:B","text":"做功的生命活動需要能量","explanation":"移動、生長與細胞活動都是需要能量的工作。"},{"id":"BIO-B01-Ch1.1.3-S001:C","text":"植物完全不需要能量","explanation":"植物生長與細胞活動同樣需要能量。"},{"id":"BIO-B01-Ch1.1.3-S001:D","text":"靜止的細胞一定不耗能","explanation":"外觀靜止不代表內部工作停止。"}],"concept":"","example":"幼苗沒有走動，仍須供應生長所需能量。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）; 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S002","topicId":"","stem":"新形成的身體結構，需要哪一項作為組成原料？","correct":"BIO-B01-Ch1.1.3-S002:C","options":[{"id":"BIO-B01-Ch1.1.3-S002:A","text":"只有光線","explanation":"光是能量輸入，不能取代構成身體的物質。"},{"id":"BIO-B01-Ch1.1.3-S002:B","text":"只有散出的熱","explanation":"散熱不是構成身體的原料。"},{"id":"BIO-B01-Ch1.1.3-S002:C","text":"物質","explanation":"身體的分子與組織需要物質組成。"},{"id":"BIO-B01-Ch1.1.3-S002:D","text":"完全不需要原料","explanation":"形成身體結構必須有物質來源。"}],"concept":"","example":"食物除了提供能量，也可提供身體原料。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S003","topicId":"","stem":"下列哪項可直接作為「細胞也會做功」的例子？","correct":"BIO-B01-Ch1.1.3-S003:D","options":[{"id":"BIO-B01-Ch1.1.3-S003:A","text":"空氣中的光線通過","explanation":"光通過空氣不是細胞工作。"},{"id":"BIO-B01-Ch1.1.3-S003:B","text":"土壤中的石塊排列","explanation":"石塊排列不是細胞活動。"},{"id":"BIO-B01-Ch1.1.3-S003:C","text":"死亡枯枝靜置","explanation":"枯枝靜置本身不代表活細胞做功。"},{"id":"BIO-B01-Ch1.1.3-S003:D","text":"活細胞進行分裂","explanation":"細胞分裂是教材列出的耗能工作。"}],"concept":"","example":"細胞分裂不是不用能量的複製過程。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S004","topicId":"","stem":"一株幼苗逐漸長大，此過程與能量的關係為何？","correct":"BIO-B01-Ch1.1.3-S004:A","options":[{"id":"BIO-B01-Ch1.1.3-S004:A","text":"生長需要能量供應","explanation":"生長屬生命活動，需要能量。"},{"id":"BIO-B01-Ch1.1.3-S004:B","text":"只有開始走動才需能量","explanation":"植物不必走動也要維持生長。"},{"id":"BIO-B01-Ch1.1.3-S004:C","text":"生長能憑空創造能量","explanation":"生長利用能量，不能從無生有。"},{"id":"BIO-B01-Ch1.1.3-S004:D","text":"能量對植物生長沒有作用","explanation":"植物的生長與細胞工作都需要能量。"}],"concept":"","example":"根與莖的生長都屬生命活動。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S005","topicId":"","stem":"下列哪項也是需要能量的生命活動？","correct":"BIO-B01-Ch1.1.3-S005:B","options":[{"id":"BIO-B01-Ch1.1.3-S005:A","text":"水杯在桌上不動","explanation":"非生命物件靜置不是本題的生命活動。"},{"id":"BIO-B01-Ch1.1.3-S005:B","text":"生物產生新個體","explanation":"繁殖是需要能量的生命活動。"},{"id":"BIO-B01-Ch1.1.3-S005:C","text":"無生命石塊靜置","explanation":"石塊靜置不是生物產生新個體等生命工作。"},{"id":"BIO-B01-Ch1.1.3-S005:D","text":"一束光經過玻璃","explanation":"這是光的傳播，不是生物繁殖或細胞工作。"}],"concept":"","example":"繁殖不只是外在移動，仍有能量需求。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S006","topicId":"","stem":"「沒看見動物移動，就表示牠沒有任何能量需求。」哪個理由最能否定此句？","correct":"BIO-B01-Ch1.1.3-S006:C","options":[{"id":"BIO-B01-Ch1.1.3-S006:A","text":"能量只有運動時才存在","explanation":"能量需求並不局限運動。"},{"id":"BIO-B01-Ch1.1.3-S006:B","text":"物質都會變成陽光","explanation":"物質不是如此轉成能量。"},{"id":"BIO-B01-Ch1.1.3-S006:C","text":"體內仍可進行細胞工作","explanation":"外在靜止時，細胞仍可能做功。"},{"id":"BIO-B01-Ch1.1.3-S006:D","text":"所有熱都能立即變成食物","explanation":"生態系不會把散熱完整回收成食物。"}],"concept":"","example":"休息時體內仍有分子合成等工作。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）; 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S007","topicId":"","stem":"綠葉進行光合作用時，本節強調哪種能量轉換？","correct":"BIO-B01-Ch1.1.3-S007:A","options":[{"id":"BIO-B01-Ch1.1.3-S007:A","text":"光能轉成糖等分子中的化學能","explanation":"光合作用將吸收的光能轉為化學能。"},{"id":"BIO-B01-Ch1.1.3-S007:B","text":"糖的物質直接消失","explanation":"光合作用涉及形成食物分子，不是物質消失。"},{"id":"BIO-B01-Ch1.1.3-S007:C","text":"散熱完整轉回太陽光","explanation":"這不是光合作用的能量來源與轉換。"},{"id":"BIO-B01-Ch1.1.3-S007:D","text":"沒有輸入就生成能量","explanation":"能量不能憑空製造。"}],"concept":"","example":"葉片可將吸收的光能轉存於食物分子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S008","topicId":"","stem":"許多生態系的主要能量輸入來自何處？","correct":"BIO-B01-Ch1.1.3-S008:D","options":[{"id":"BIO-B01-Ch1.1.3-S008:A","text":"已散失的全部熱","explanation":"散熱通常不能被生態系完整回收。"},{"id":"BIO-B01-Ch1.1.3-S008:B","text":"土壤礦物質本身的光線","explanation":"礦物質是物質來源，不會提供題述太陽光。"},{"id":"BIO-B01-Ch1.1.3-S008:C","text":"消費者憑空製造的能量","explanation":"消費者不創造能量。"},{"id":"BIO-B01-Ch1.1.3-S008:D","text":"太陽","explanation":"許多生態系以太陽光作為主要能量輸入。"}],"concept":"","example":"常見草地生態系由光合作用引入太陽能。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S009","topicId":"","stem":"稱植物為生產者時，哪種說法最精確？","correct":"BIO-B01-Ch1.1.3-S009:B","options":[{"id":"BIO-B01-Ch1.1.3-S009:A","text":"植物會從無到有造出能量","explanation":"生產者轉換能量，不是創造能量。"},{"id":"BIO-B01-Ch1.1.3-S009:B","text":"植物可把光能轉成有機分子中的化學能","explanation":"這是本節光合生產者的角色。"},{"id":"BIO-B01-Ch1.1.3-S009:C","text":"植物只負責回收熱","explanation":"植物光合作用利用光能，並非回收散熱。"},{"id":"BIO-B01-Ch1.1.3-S009:D","text":"植物把所有物質變成能量後消失","explanation":"有機物仍含物質，不會全部消失。"}],"concept":"","example":"「生產」食物不等於「創造」能量。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第12張／正文第10頁（19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S010","topicId":"","stem":"光合作用所得的糖，其與本節能量概念的關係為何？","correct":"BIO-B01-Ch1.1.3-S010:C","options":[{"id":"BIO-B01-Ch1.1.3-S010:A","text":"糖是光線本身","explanation":"糖是物質分子，並非光線。"},{"id":"BIO-B01-Ch1.1.3-S010:B","text":"糖只能代表熱","explanation":"糖等食物分子具有化學能。"},{"id":"BIO-B01-Ch1.1.3-S010:C","text":"糖等食物分子含化學能","explanation":"食物中的化學能可供生物利用。"},{"id":"BIO-B01-Ch1.1.3-S010:D","text":"糖不能傳遞能量","explanation":"取食糖等食物可取得化學能。"}],"concept":"","example":"動物食用植物，可取得植物食物分子中的化學能。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S011","topicId":"","stem":"本節哪類生物可將光能引入食物分子？","correct":"BIO-B01-Ch1.1.3-S011:A","options":[{"id":"BIO-B01-Ch1.1.3-S011:A","text":"植物與其他光合生物","explanation":"光合生物可轉換光能為化學能。"},{"id":"BIO-B01-Ch1.1.3-S011:B","text":"所有正在吃葉片的動物","explanation":"取食者取得食物化學能，並非藉取食完成光合作用。"},{"id":"BIO-B01-Ch1.1.3-S011:C","text":"只有分解遺體的真菌","explanation":"分解遺體不等同吸收光能製糖。"},{"id":"BIO-B01-Ch1.1.3-S011:D","text":"只要不動的生物皆可","explanation":"靜止不能證明具有光合作用。"}],"concept":"","example":"藻類也是本節光合生物的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S012","topicId":"","stem":"「光能→化學能」最適合配在哪個事件旁？","correct":"BIO-B01-Ch1.1.3-S012:D","options":[{"id":"BIO-B01-Ch1.1.3-S012:A","text":"動物的熱散到空氣","explanation":"這是散熱，並非光能轉成化學能。"},{"id":"BIO-B01-Ch1.1.3-S012:B","text":"遺體中的養分回到土壤","explanation":"這強調物質循環。"},{"id":"BIO-B01-Ch1.1.3-S012:C","text":"兔子直接吞下陽光","explanation":"消費者攝取食物，不是吞陽光。"},{"id":"BIO-B01-Ch1.1.3-S012:D","text":"葉片利用光合作用形成食物","explanation":"此事件具有題述的能量形式轉換。"}],"concept":"","example":"箭頭應描述能量形式，不是把光當作肥料。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S013","topicId":"","stem":"關於生產者與能量，哪一句需要改正？","correct":"BIO-B01-Ch1.1.3-S013:B","options":[{"id":"BIO-B01-Ch1.1.3-S013:A","text":"光合植物吸收光能","explanation":"符合本節能量入口。"},{"id":"BIO-B01-Ch1.1.3-S013:B","text":"生產者創造本來不存在的能量","explanation":"生產者只能轉換能量，這句須改正。"},{"id":"BIO-B01-Ch1.1.3-S013:C","text":"食物分子可含化學能","explanation":"符合糖等食物的能量形式。"},{"id":"BIO-B01-Ch1.1.3-S013:D","text":"許多生態系得到太陽能輸入","explanation":"本節指出主要能量常來自太陽。"}],"concept":"","example":"可改成「生產者將光能轉換為化學能」。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第12張／正文第10頁（19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S014","topicId":"","stem":"描述太陽與生態系關係時，哪種措辭符合本節範圍？","correct":"BIO-B01-Ch1.1.3-S014:C","options":[{"id":"BIO-B01-Ch1.1.3-S014:A","text":"每個生態系必定只有太陽一種能量來源","explanation":"「每個、只有」比教材的許多生態系更絕對。"},{"id":"BIO-B01-Ch1.1.3-S014:B","text":"太陽只提供物質、不提供能量","explanation":"陽光提供能量輸入。"},{"id":"BIO-B01-Ch1.1.3-S014:C","text":"許多生態系的主要能量來自太陽","explanation":"保留許多及主要，符合教材表述。"},{"id":"BIO-B01-Ch1.1.3-S014:D","text":"太陽能由分解者從土壤製造","explanation":"分解者不製造太陽能。"}],"concept":"","example":"答題時保留「許多」與「主要」的限定。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S015","topicId":"","stem":"毛毛蟲吃葉子時，取得的能量主要以何種形式存在於食物中？","correct":"BIO-B01-Ch1.1.3-S015:D","options":[{"id":"BIO-B01-Ch1.1.3-S015:A","text":"光線","explanation":"攝入的是含化學能的有機物。"},{"id":"BIO-B01-Ch1.1.3-S015:B","text":"從無生成的能量","explanation":"取食是取得既有能量，非創造。"},{"id":"BIO-B01-Ch1.1.3-S015:C","text":"完整回收的環境熱","explanation":"食物來源不是直接完整回收散熱。"},{"id":"BIO-B01-Ch1.1.3-S015:D","text":"化學能","explanation":"葉片的食物分子含化學能。"}],"concept":"","example":"吃葉片不是直接吃到太陽光。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S016","topicId":"","stem":"消費者攝取食物，通常會同時取得什麼？","correct":"BIO-B01-Ch1.1.3-S016:A","options":[{"id":"BIO-B01-Ch1.1.3-S016:A","text":"能量與物質","explanation":"有機食物既含化學能，也提供物質。"},{"id":"BIO-B01-Ch1.1.3-S016:B","text":"只有能量、完全沒有物質","explanation":"食物分子本身也是物質。"},{"id":"BIO-B01-Ch1.1.3-S016:C","text":"只有物質、完全沒有能量","explanation":"有機食物含可利用的化學能。"},{"id":"BIO-B01-Ch1.1.3-S016:D","text":"只有陽光與空氣","explanation":"這不是取食有機物的內容。"}],"concept":"","example":"葉片可提供昆蟲活動能量與生長原料。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S017","topicId":"","stem":"鳥吃昆蟲，昆蟲吃植物；就鳥這次取食而言，直接的化學能來源是何者？","correct":"BIO-B01-Ch1.1.3-S017:B","options":[{"id":"BIO-B01-Ch1.1.3-S017:A","text":"太陽本身","explanation":"太陽可為上游來源，但鳥直接吃的是昆蟲。"},{"id":"BIO-B01-Ch1.1.3-S017:B","text":"昆蟲的有機物","explanation":"鳥由被吃昆蟲中的食物分子取得化學能。"},{"id":"BIO-B01-Ch1.1.3-S017:C","text":"土壤散出的熱","explanation":"鳥並非由取食土壤熱取得能量。"},{"id":"BIO-B01-Ch1.1.3-S017:D","text":"鳥憑空產生的糖","explanation":"題意是由取食獲能，不是從無造糖。"}],"concept":"","example":"直接來源和最初上游來源要分清楚。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S018","topicId":"","stem":"下列何者符合本節消費者的基本判斷？","correct":"BIO-B01-Ch1.1.3-S018:C","options":[{"id":"BIO-B01-Ch1.1.3-S018:A","text":"一定能把光能轉成糖","explanation":"這是光合生產者的功能，不是消費者定義。"},{"id":"BIO-B01-Ch1.1.3-S018:B","text":"只吸收空氣就一定是消費者","explanation":"只描述吸收空氣不足以判定。"},{"id":"BIO-B01-Ch1.1.3-S018:C","text":"以其他生物或其遺體為食","explanation":"符合教材對消費者的取食描述。"},{"id":"BIO-B01-Ch1.1.3-S018:D","text":"必須創造新能量","explanation":"生物不能憑空創造能量。"}],"concept":"","example":"吃植物和吃動物都可獲得食物中的化學能。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S019","topicId":"","stem":"以食物傳遞能量的方向畫箭頭，哪個簡圖符合「昆蟲吃葉、鳥吃昆蟲」？","correct":"BIO-B01-Ch1.1.3-S019:D","options":[{"id":"BIO-B01-Ch1.1.3-S019:A","text":"鳥→昆蟲→植物","explanation":"這與食物化學能傳遞方向相反。"},{"id":"BIO-B01-Ch1.1.3-S019:B","text":"昆蟲→植物→鳥","explanation":"昆蟲不是本例中植物的食物來源。"},{"id":"BIO-B01-Ch1.1.3-S019:C","text":"植物→鳥→昆蟲","explanation":"本例未說鳥吃植物、昆蟲吃鳥。"},{"id":"BIO-B01-Ch1.1.3-S019:D","text":"植物→昆蟲→鳥","explanation":"箭頭由被吃者指向取食者。"}],"concept":"","example":"題目先指定箭頭表示能量傳遞，才能判讀方向。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S020","topicId":"","stem":"兔子啃食青草，哪句最準確？","correct":"BIO-B01-Ch1.1.3-S020:A","options":[{"id":"BIO-B01-Ch1.1.3-S020:A","text":"兔子從草的有機物取得化學能","explanation":"青草含有可被取食者利用的化學能。"},{"id":"BIO-B01-Ch1.1.3-S020:B","text":"兔子把太陽吞進體內","explanation":"取食草不是吞下太陽。"},{"id":"BIO-B01-Ch1.1.3-S020:C","text":"兔子完全未取得物質","explanation":"草的分子也屬物質。"},{"id":"BIO-B01-Ch1.1.3-S020:D","text":"青草不含任何化學能","explanation":"有機食物含化學能。"}],"concept":"","example":"草食者取食仍是攝取有機物。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S021","topicId":"","stem":"生產者與消費者之間經取食轉移的主要能量載體是什麼？","correct":"BIO-B01-Ch1.1.3-S021:B","options":[{"id":"BIO-B01-Ch1.1.3-S021:A","text":"完整回收的熱","explanation":"散熱不能作為此食物傳遞的主要載體。"},{"id":"BIO-B01-Ch1.1.3-S021:B","text":"含有化學能的食物分子","explanation":"食物中的有機分子將化學能傳遞給取食者。"},{"id":"BIO-B01-Ch1.1.3-S021:C","text":"憑空生出的光","explanation":"沒有從無生光的過程。"},{"id":"BIO-B01-Ch1.1.3-S021:D","text":"沒有物質的空白","explanation":"取食涉及真實的食物物質。"}],"concept":"","example":"能量隨食物的有機物傳遞。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S022","topicId":"","stem":"生物用化學能做功時，部分能量會以什麼形式散到周圍？","correct":"BIO-B01-Ch1.1.3-S022:C","options":[{"id":"BIO-B01-Ch1.1.3-S022:A","text":"土壤礦物質","explanation":"礦物質是物質，不是此處散失的能量形式。"},{"id":"BIO-B01-Ch1.1.3-S022:B","text":"新的太陽","explanation":"生物不會產生太陽。"},{"id":"BIO-B01-Ch1.1.3-S022:C","text":"熱","explanation":"做功與能量轉換會伴隨熱散失。"},{"id":"BIO-B01-Ch1.1.3-S022:D","text":"不變的光合作用糖","explanation":"糖是化學能載體，不是題述散到環境的熱。"}],"concept":"","example":"肌肉活動時也伴隨熱散失。","source":"Campbell ,"text":"所有能量只能留在植物體內","explanation":"消費者與分解者也會取得並利用能量。"}],"concept":"","example":"流動不代表能量從未改變形式。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S026","topicId":"","stem":"關於散到環境的熱，下列哪句符合本節？","correct":"BIO-B01-Ch1.1.3-S026:A","options":[{"id":"BIO-B01-Ch1.1.3-S026:A","text":"通常不會被同一生態系直接完整回收成化學能","explanation":"這是需要持續能量輸入的重要原因。"},{"id":"BIO-B01-Ch1.1.3-S026:B","text":"一定全部回到原來糖分子中","explanation":"熱不會依此方式完整回收。"},{"id":"BIO-B01-Ch1.1.3-S026:C","text":"完全不屬於能量","explanation":"熱是能量轉移的形式。"},{"id":"BIO-B01-Ch1.1.3-S026:D","text":"可由分解者全部變回太陽光","explanation":"分解者不具有這種完整回收功能。"}],"concept":"","example":"熱仍與能量有關，散失不等於憑空消滅。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S027","topicId":"","stem":"哪一組生態角色都會利用化學能並散熱？","correct":"BIO-B01-Ch1.1.3-S027:D","options":[{"id":"BIO-B01-Ch1.1.3-S027:A","text":"只有消費者","explanation":"生產者與分解者也有耗能工作。"},{"id":"BIO-B01-Ch1.1.3-S027:B","text":"只有分解者","explanation":"並非只有分解者散熱。"},{"id":"BIO-B01-Ch1.1.3-S027:C","text":"只有生產者","explanation":"消費者與分解者也散熱。"},{"id":"BIO-B01-Ch1.1.3-S027:D","text":"生產者、消費者與分解者","explanation":"三類生物都需要能量來維持活動。"}],"concept":"","example":"植物也會用能量，不能只畫動物散熱。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S028","topicId":"","stem":"肌肉收縮時部分化學能以熱散出，最直接屬於哪個觀念？","correct":"BIO-B01-Ch1.1.3-S028:B","options":[{"id":"BIO-B01-Ch1.1.3-S028:A","text":"物質從無生成","explanation":"沒有物質從無生成的證據。"},{"id":"BIO-B01-Ch1.1.3-S028:B","text":"能量轉換與散熱","explanation":"化學能的利用伴隨做功與散熱。"},{"id":"BIO-B01-Ch1.1.3-S028:C","text":"植物重新吸收礦物質","explanation":"此情境未描述植物吸收。"},{"id":"BIO-B01-Ch1.1.3-S028:D","text":"遺體中原子循環","explanation":"題意聚焦能量而非原子的去向。"}],"concept":"","example":"題目提到熱散失，應先追蹤能量路徑。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S029","topicId":"","stem":"植物從土壤及空氣取得的化學物質，可能如何被利用？","correct":"BIO-B01-Ch1.1.3-S029:C","options":[{"id":"BIO-B01-Ch1.1.3-S029:A","text":"全部變成光而消失","explanation":"化學物質不會如此全部消失。"},{"id":"BIO-B01-Ch1.1.3-S029:B","text":"只能停在植物外表","explanation":"可被納入植物身體。"},{"id":"BIO-B01-Ch1.1.3-S029:C","text":"成為植物身體的一部分","explanation":"這是物質由環境進入生物的途徑。"},{"id":"BIO-B01-Ch1.1.3-S029:D","text":"永遠不能進入動物","explanation":"動物取食植物可取得其中物質。"}],"concept":"","example":"環境中的物質可經植物進入食物關係。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S030","topicId":"","stem":"落葉被分解後，其中部分化學物質回到土壤；這最能表現什麼？","correct":"BIO-B01-Ch1.1.3-S030:D","options":[{"id":"BIO-B01-Ch1.1.3-S030:A","text":"能量被創造","explanation":"分解不創造能量。"},{"id":"BIO-B01-Ch1.1.3-S030:B","text":"熱變成完整陽光","explanation":"沒有此種完整回收。"},{"id":"BIO-B01-Ch1.1.3-S030:C","text":"物質永久消失","explanation":"物質是轉移與轉換，非消失。"},{"id":"BIO-B01-Ch1.1.3-S030:D","text":"化學物質循環","explanation":"物質返回環境後可再被吸收。"}],"concept":"","example":"落葉中的成分可回到生物可利用的環境庫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S031","topicId":"","stem":"物質循環涉及哪兩類場所之間的轉移？","correct":"BIO-B01-Ch1.1.3-S031:A","options":[{"id":"BIO-B01-Ch1.1.3-S031:A","text":"生物體與非生物環
