式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B091","topicId":"","stem":"草吸光形成有機物、兔子吃草、落葉由真菌分解。哪組角色與功能配對全對？","correct":"BIO-B01-Ch1.1.3-B091:D","options":[{"id":"BIO-B01-Ch1.1.3-B091:A","text":"草創能；兔子吞光；真菌回熱","explanation":"三項均誤述。"},{"id":"BIO-B01-Ch1.1.3-B091:B","text":"草只取食；兔子光合作用；真菌不耗能","explanation":"三角色功能顛倒。"},{"id":"BIO-B01-Ch1.1.3-B091:C","text":"草不需物質；兔子不需能量；真菌消滅物質","explanation":"均違反本節。"},{"id":"BIO-B01-Ch1.1.3-B091:D","text":"草轉換光能；兔子由食物取能與物質；真菌分解並回收物質","explanation":"三者均對應題述行為。"}],"concept":"","example":"角色可由具體活動判讀，無需複雜食物網。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第6張／正文第4頁（13_imagegen_page_06.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B092","topicId":"","stem":"把「熱散到外界」和「養分回到土壤」都叫作同一種回收，問題在哪？","correct":"BIO-B01-Ch1.1.3-B092:B","options":[{"id":"BIO-B01-Ch1.1.3-B092:A","text":"兩者都是同一份物質","explanation":"熱與化學成分不同。"},{"id":"BIO-B01-Ch1.1.3-B092:B","text":"前者是能量流出，後者可屬物質返回環境","explanation":"去向看似都在環境，追蹤對象和後續功能不同。"},{"id":"BIO-B01-Ch1.1.3-B092:C","text":"前者完全沒有能量，後者完全沒有物質","explanation":"與定義相反。"},{"id":"BIO-B01-Ch1.1.3-B092:D","text":"只要到環境就必定永不再利用","explanation":"化學成分仍可能再被吸收。"}],"concept":"","example":"相同終點名稱不代表相同循環性。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B093","topicId":"","stem":"概念表兩列寫「光合作用：光能→化學能」和「分解：遺體成分→環境成分」。哪項比較正確？","correct":"BIO-B01-Ch1.1.3-B093:C","options":[{"id":"BIO-B01-Ch1.1.3-B093:A","text":"兩列均直接證明能量100%循環","explanation":"第二列追蹤物質，第一列也沒有證明循環。"},{"id":"BIO-B01-Ch1.1.3-B093:B","text":"兩列都只是原子不變地原地停留","explanation":"兩列皆涉及過程與轉移。"},{"id":"BIO-B01-Ch1.1.3-B093:C","text":"第一列強調能量轉換，第二列強調物質回收","explanation":"各自抓住所列箭頭的追蹤對象。"},{"id":"BIO-B01-Ch1.1.3-B093:D","text":"第一列說創造能量，第二列說物質消滅","explanation":"都不符合箭頭含義。"}],"concept":"","example":"同一事件可有多面向，題目箭頭決定此處重點。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B094","topicId":"","stem":"假設一個光合生態系的化學成分可反覆回收，是否因此保證不用再接受能量？","correct":"BIO-B01-Ch1.1.3-B094:A","options":[{"id":"BIO-B01-Ch1.1.3-B094:A","text":"不能，生物活動仍需能量且有散熱","explanation":"物質回收不足以取消能量輸入。"},{"id":"BIO-B01-Ch1.1.3-B094:B","text":"能，所有物質回收都等於完整能量回收","explanation":"混淆兩種循環特徵。"},{"id":"BIO-B01-Ch1.1.3-B094:C","text":"能，光合植物不需要做功","explanation":"植物也有生命工作。"},{"id":"BIO-B01-Ch1.1.3-B094:D","text":"不能，因為化學成分絕對不會回收","explanation":"前提已給可回收，本節也支持。"}],"concept":"","example":"題目的物質前提不能被偷換成能量前提。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）; 正式第7張／正文第5頁（14_imagegen_page_07.png）; 正式第9張／正文第7頁（16_imagegen_page_09.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B095","topicId":"","stem":"一條落葉途徑包含「有機物被分解、化學成分回土壤、分解者向外散熱」。哪個總結最合理？","correct":"BIO-B01-Ch1.1.3-B095:D","options":[{"id":"BIO-B01-Ch1.1.3-B095:A","text":"三者都只能算物質消失","explanation":"分解使物質轉換與回到環境，不表示物質消失。"},{"id":"BIO-B01-Ch1.1.3-B095:B","text":"三者都證明所有熱已完整返回","explanation":"散熱不是返回可用食物的證據。"},{"id":"BIO-B01-Ch1.1.3-B095:C","text":"有分解就代表沒有能量流","explanation":"分解者仍利用化學能。"},{"id":"BIO-B01-Ch1.1.3-B095:D","text":"同一途徑可同時涉及物質回收與能量流出","explanation":"成分回土壤與散熱可以並存。"}],"concept":"","example":"把同一事件分成物質帳和能量帳有助理解。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）; 正式第10張／正文第8頁（17_imagegen_page_10.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B096","topicId":"","stem":"下列哪組對照能避免把「光照」和「施加礦物質」當成完全相同？","correct":"BIO-B01-Ch1.1.3-B096:B","options":[{"id":"BIO-B01-Ch1.1.3-B096:A","text":"兩者都只是光能，無需區分","explanation":"礦物質不是光能。"},{"id":"BIO-B01-Ch1.1.3-B096:B","text":"光照涉及能量輸入，礦物質供應涉及物質原料","explanation":"區分基本對象，未主張單一因素足夠支持全部生長。"},{"id":"BIO-B01-Ch1.1.3-B096:C","text":"兩者都可讓生物永不散熱","explanation":"沒有此效果。"},{"id":"BIO-B01-Ch1.1.3-B096:D","text":"礦物質一定能取代全部光能","explanation":"物質不能如此取代光合作用的能量來源。"}],"concept":"","example":"能量和物質都需要，但不能任意互相替換。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）; 正式第9張／正文第7頁（16_imagegen_page_09.png）; 正式第11張／正文第9頁（18_imagegen_page_11.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B097","topicId":"","stem":"檢查一段摘要：「生產者創造能量；分解者回收能量；能量和物質都完整循環。」最適當的修正版為何？","correct":"BIO-B01-Ch1.1.3-B097:C","options":[{"id":"BIO-B01-Ch1.1.3-B097:A","text":"只改生產者名稱，其他保留","explanation":"另外兩項仍有能量回收與循環錯誤。"},{"id":"BIO-B01-Ch1.1.3-B097:B","text":"只把物質改成太陽，其他保留","explanation":"沒有修復任何基本觀念。"},{"id":"BIO-B01-Ch1.1.3-B097:C","text":"生產者轉換能量；分解者回收物質並利用化學能；能量通常單向流動","explanation":"逐一修正三個混淆。"},{"id":"BIO-B01-Ch1.1.3-B097:D","text":"生產者不做功；分解者不散熱；物質全消失","explanation":"新增更多錯誤。"}],"concept":"","example":"逐項檢查動詞和對象，避免只修其中一個詞。","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第11張／正文第9頁（18_imagegen_page_11.png）; 正式第12張／正文第10頁（19_imagegen_page_12.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B098","topicId":"","stem":"若以同一條「植物被動物吃」箭頭分別作能量與物質說明，哪組註解都合理？","correct":"BIO-B01-Ch1.1.3-B098:A","options":[{"id":"BIO-B01-Ch1.1.3-B098:A","text":"化學能隨食物傳遞；植物成分也進入動物","explanation":"兩種追蹤在這個取食步驟可以並行。"},{"id":"BIO-B01-Ch1.1.3-B098:B","text":"能量不轉移；只有陽光原樣移動","explanation":"食物含轉換後的化學能。"},{"id class QuizEngine{

document.querySelectorAll('[data-drawer-mode]').forEach(b=>b.addEventListener('click',()=>showPanel(b.dataset.drawerMode)));
$('panel-close').addEventListener('click',()=>closeCatalog(true));$('back-to-quiz').addEventListener('click',()=>closeCatalog(true));
dialog.addEventListener('cancel',e=>{e.preventDefault();closeCatalog(true);});dialog.addEventListener('close',()=>{panelMode=null;panel.hidden=true;document.body.style.overflow='';reflectPanel();});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeCatalog(true);}});
$('start-set').addEventListener('click',()=>attempt(draw));$('resume-set').addEventListener('click',()=>attempt(()=>{selecting=false;render();closeCatalog();if(engine.statistics().complete)showResults(false);else focusQuestion();}));
$('previous').addEventListener('click',()=>reviewQuestion(Math.max(0,engine.current().at-1)));$('next').addEventListener('click',()=>reviewQuestion(Math.min(9,engine.current().at+1)));
function reset(){attempt(()=>{engine.reset();selecting=false;stopResultMotion();render();focusQuestion();say('本組十題答案與統計已清空，原題、題序及選項順序均保留。');});}
$('reset').addEventListener('click',reset);$('result-reset').addEventListener('click',reset);$('view-results').addEventListener('click',()=>showResults());
$('review-all').addEventListener('click',()=>reviewQuestion(0));$('review-wrong').addEventListener('click',()=>{const s=engine.current(),i=s.answers.findIndex((a,j)=>a!==engine.question(s,j).correct);if(i>=0)reviewQuestion(i);});
$('new-set').addEventListener('click',()=>attempt(draw));$('upgrade').addEventListener('click',()=>attempt(()=>{if(drawing)return;drawing=true;try{engine.upgrade();selecting=false;stopResultMotion();render();focusQuestion();}finally{setTimeout(()=>{drawing=false;},350);}}));
$('finish').addEventListener('click',()=>{selecting=true;stopResultMotion();render();showPanel('catalog',true);});
motion.addEventListener('change',stopResultMotion);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopResultMotion();});
$('school-select').addEventListener('change',e=>attempt(()=>changeSchool(e.target.value)));
const savedSchool=engine.read('bio-quiz:selected-school');changeSchool(engines.has(savedSchool)?savedSchool:'CMU');
})();
</script></body></html>
