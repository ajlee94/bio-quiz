.b-variant{--ground:#f3f5f7}

 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S007","topicId":"","stem":"五大主題中的「交互作用」強調哪一點？","correct":"BIO-B01-Ch1-S007:C","options":[{"id":"BIO-B01-Ch1-S007:A","text":"生物只與同種個體接觸","explanation":"錯誤：互動可跨物種並涉及環境。"},{"id":"BIO-B01-Ch1-S007:B","text":"生命不受周圍環境影響","explanation":"錯誤：環境是互動的重要部分。"},{"id":"BIO-B01-Ch1-S007:C","text":"生命與其他生物及環境彼此影響","explanation":"正確：這是交互作用的核心觀點。"},{"id":"BIO-B01-Ch1-S007:D","text":"所有生物的毛色都一致","explanation":"錯誤：毛色一致不是交互作用定義。"}],"concept":"","example":"小鼠取食植物，也可能被捕食者捕食。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S008","topicId":"","stem":"哪組詞語完整保留章介紹的五大主題？","correct":"BIO-B01-Ch1-S008:D","options":[{"id":"BIO-B01-Ch1-S008:A","text":"組織、資訊、價格、速度、演化","explanation":"錯誤：價格與速度不是此五主題。"},{"id":"BIO-B01-Ch1-S008:B","text":"組織、繁殖、地名、器材、能量","explanation":"錯誤：地名與器材不在此分類中。"},{"id":"BIO-B01-Ch1-S008:C","text":"生命、科學家、考試、物質、頁碼","explanation":"錯誤：清單缺多個正式主題。"},{"id":"BIO-B01-Ch1-S008:D","text":"組織層級、資訊、能量與物質、交互作用、演化","explanation":"正確：五項與章介紹的架構一致。"}],"concept":"","example":"五主題可用來整理小鼠的同一生命現象。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S009","topicId":"","stem":"小鼠毛色與 DNA 中的遺傳訊息有關，最直接屬於哪個主題？","correct":"BIO-B01-Ch1-S009:A","options":[{"id":"BIO-B01-Ch1-S009:A","text":"資訊","explanation":"正確：DNA 承載的遺傳訊息屬資訊。"},{"id":"BIO-B01-Ch1-S009:B","text":"熱散失","explanation":"錯誤：熱散失屬能量流動。"},{"id":"BIO-B01-Ch1-S009:C","text":"物質回收","explanation":"錯誤：回收描述物質循環。"},{"id":"BIO-B01-Ch1-S009:D","text":"不可檢驗的直覺","explanation":"錯誤：DNA 與毛色不是不可檢驗直覺。"}],"concept":"","example":"毛色相關的基因變異可影響性狀。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S010","topicId":"","stem":"章介紹將 DNA 與毛色相連，最合理的理解是哪項？","correct":"BIO-B01-Ch1-S010:B","options":[{"id":"BIO-B01-Ch1-S010:A","text":"DNA 是從太陽流入小鼠的熱","explanation":"錯誤：DNA 不是流入的熱。"},{"id":"BIO-B01-Ch1-S010:B","text":"遺傳資訊能影響小鼠的性狀","explanation":"正確：資訊可參與性狀形成。"},{"id":"BIO-B01-Ch1-S010:C","text":"每一段 DNA 都只控制毛色","explanation":"錯誤：不能把所有 DNA 都說成毛色基因。"},{"id":"BIO-B01-Ch1-S010:D","text":"背景顏色完全取代遺傳資訊","explanation":"錯誤：環境不使遺傳資訊失去角色。"}],"concept":"","example":"同種小鼠仍可能具有毛色差異。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S011","topicId":"","stem":"討論毛色時，哪句話避免把 DNA 的作用說得過度絕對？","correct":"BIO-B01-Ch1-S011:C","options":[{"id":"BIO-B01-Ch1-S011:A","text":"DNA 可取代食物的一切作用","explanation":"錯誤：生命仍需能量與物質。"},{"id":"BIO-B01-Ch1-S011:B","text":"所有環境因素都沒有意義","explanation":"錯誤：環境影響隱蔽等效果。"},{"id":"BIO-B01-Ch1-S011:C","text":"遺傳資訊重要，環境也會影響性狀是否有利","explanation":"正確：資訊與環境提供不同層面的影響。"},{"id":"BIO-B01-Ch1-S011:D","text":"一隻鼠的 DNA 就是整個生態系","explanation":"錯誤：分子與生態系尺度不同。"}],"concept":"","example":"淡毛在白沙上的隱蔽優勢與背景相關。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S012","topicId":"","stem":"若題目重點是「細胞如何使用儲存的遺傳訊息」，應優先想到哪項？","correct":"BIO-B01-Ch1-S012:D","options":[{"id":"BIO-B01-Ch1-S012:A","text":"能量永久循環","explanation":"錯誤：能量不在生態系永久循環。"},{"id":"BIO-B01-Ch1-S012:B","text":"天敵的數目本身","explanation":"錯誤：天敵數目不是此題焦點。"},{"id":"BIO-B01-Ch1-S012:C","text":"生態系等於單一個體","explanation":"錯誤：生態系範圍大於個體。"},{"id":"BIO-B01-Ch1-S012:D","text":"資訊主題","explanation":"正確：儲存與使用訊息是資訊主題。"}],"concept":"","example":"資訊可參與生命的結構與功能。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S013","topicId":"","stem":"下列哪一句符合資訊與性狀的基本關係？","correct":"BIO-B01-Ch1-S013:A","options":[{"id":"BIO-B01-Ch1-S013:A","text":"毛色相關基因變異可影響小鼠毛色","explanation":"正確：本節以毛色說明遺傳資訊與性狀。"},{"id":"BIO-B01-Ch1-S013:B","text":"生物只需要 DNA，不需要物質","explanation":"錯誤：資訊不能取代生命所需資源。"},{"id":"BIO-B01-Ch1-S013:C","text":"DNA 的唯一功能是讓鼠躲藏","explanation":"錯誤：這把 DNA 的作用限縮得太窄。"},{"id":"BIO-B01-Ch1-S013:D","text":"所有小鼠 DNA 必須完全相同","explanation":"錯誤：族群可存在可遺傳變異。"}],"concept":"","example":"毛色較深或較淺可對應不同可遺傳變異。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-S014","topicId":"","stem":"在小鼠的常用結構層級中，何者通常位於細胞與器官之間？","correct":"BIO-B01-Ch1-S014:B","options":[{"id":"BIO-B01-Ch1-S014:A","text":"生物圈","explanation":"錯誤：生物圈是更大的生態尺度。"},{"id":"BIO-B01-Ch1-S014:B","text":"組織","explanation":"正確：細胞組成組織，組織參與形成器官。"},{"id":"BIO-B01-Ch1-S014:C","text":"族群","explanation":"錯誤：族群在個體以上。"},{"id":"BIO-B01-Ch1-S014:D","text":"分子","explanation":"錯誤：分子在細胞以下。"}],"concept":"","example":"心臟是器官，內含不同組織。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S015","topicId":"","stem":"哪項最能說明湧現性質的來源？","correct":"BIO-B01-Ch1-S015:C","options":[{"id":"BIO-B01-Ch1-S015:A","text":"只增加零件名稱","explanation":"錯誤：命名不會產生功能。"},{"id":"BIO-B01-Ch1-S015:B","text":"忽略所有零件","explanation":"錯誤：湧現仍與部件有關。"},{"id":"BIO-B01-Ch1-S015:C","text":"部件以特定方式排列並互動","explanation":"正確：排列與互動能帶來新性質。"},{"id":"BIO-B01-Ch1-S015:D","text":"每個零件原本就有整體全部功能","explanation":"錯誤：整體性質不必存在於單一零件。"}],"concept":"","example":"單一分子不等於完整細胞。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S016","topicId":"","stem":"關於單一分子與完整細胞，哪項正確？","correct":"BIO-B01-Ch1-S016:D","options":[{"id":"BIO-B01-Ch1-S016:A","text":"兩者具有完全相同的全部功能","explanation":"錯誤：不同層級不等同。"},{"id":"BIO-B01-Ch1-S016:B","text":"只要取出一個分子就保留細胞全部活動","explanation":"錯誤：單一分子不能代表完整細胞活動。"},{"id":"BIO-B01-Ch1-S016:C","text":"細胞不含分子","explanation":"錯誤：細胞由分子等部件構成。"},{"id":"BIO-B01-Ch1-S016:D","text":"細胞功能也依賴許多部件的組織與互動","explanation":"正確：組織與互動是理解整體功能的要素。"}],"concept":"","example":"理解細胞需看部件及彼此關係。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S017","topicId":"","stem":"何者最接近生態系的範圍？","correct":"BIO-B01-Ch1-S017:A","options":[{"id":"BIO-B01-Ch1-S017:A","text":"某地生物群集及其非生物環境","explanation":"正確：生態系包括生物及非生物環境。"},{"id":"BIO-B01-Ch1-S017:B","text":"只有某一隻小鼠","explanation":"錯誤：單一個體只是其中一部分。"},{"id":"BIO-B01-Ch1-S017:C","text":"只有一個 DNA 分子","explanation":"錯誤：分子尺度遠小於生態系。"},{"id":"BIO-B01-Ch1-S017:D","text":"只有某隻鼠的心臟","explanation":"錯誤：心臟屬器官。"}],"concept":"","example":"草地生物、水與土壤可一起納入生態系。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S018","topicId":"","stem":"讀到生命層級圖時，應避免哪種誤解？","correct":"BIO-B01-Ch1-S018:B","options":[{"id":"BIO-B01-Ch1-S018:A","text":"研究可跨多個尺度","explanation":"錯誤：跨尺度研究是正確理解。"},{"id":"BIO-B01-Ch1-S018:B","text":"每一種生物都一定有器官系統","explanation":"正確：這是應避免的絕對化；單細胞生物未必有器官系統。"},{"id":"BIO-B01-Ch1-S018:C","text":"部件互動可能產生新性質","explanation":"錯誤：互動產生新性質符合湧現。"},{"id":"BIO-B01-Ch1-S018:D","text":"個體與生態系尺度不同","explanation":"錯誤：這正確區分兩種尺度。"}],"concept":"","example":"單細胞生物可作為個體，無需具備人體式器官系統。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S019","topicId":"","stem":"在常用層級順序中，胞器位於哪兩者之間？","correct":"BIO-B01-Ch1-S019:C","options":[{"id":"BIO-B01-Ch1-S019:A","text":"族群與群集","explanation":"錯誤：此處屬生態尺度。"},{"id":"BIO-B01-Ch1-S019:B","text":"器官與器官系統","explanation":"錯誤：胞器是細胞內部尺度。"},{"id":"BIO-B01-Ch1-S019:C","text":"分子與細胞","explanation":"正確：常用順序是分子、胞器、細胞。"},{"id":"BIO-B01-Ch1-S019:D","text":"生態系與生物圈","explanation":"錯誤：此處是更高層級。"}],"concept":"","example":"這是觀察尺度，不表示所有細胞都有膜包圍胞器。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S020","topicId":"","stem":"原核生物的例子提醒我們哪項？","correct":"BIO-B01-Ch1-S020:D","options":[{"id":"BIO-B01-Ch1-S020:A","text":"所有生物都有心臟","explanation":"錯誤：心臟並非所有生物都有。"},{"id":"BIO-B01-Ch1-S020:B","text":"生物不能由細胞構成","explanation":"錯誤：原核生物本身由細胞構成。"},{"id":"BIO-B01-Ch1-S020:C","text":"層級圖只能用於動物","explanation":"錯誤：層級概念也可用於其他生物。"},{"id":"BIO-B01-Ch1-S020:D","text":"不能假定每種生物都有膜包圍胞器","explanation":"正確：原核細胞沒有膜包圍胞器。"}],"concept":"","example":"看層級圖時要保留生物類型的條件。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S021","topicId":"","stem":"在小鼠常用層級中，哪個順序由低到高排列正確？","correct":"BIO-B01-Ch1-S021:A","options":[{"id":"BIO-B01-Ch1-S021:A","text":"細胞→組織→器官","explanation":"正確：細胞組成組織，組織組成器官。"},{"id":"BIO-B01-Ch1-S021:B","text":"器官→組織→細胞","explanation":"錯誤：此方向由高到低。"},{"id":"BIO-B01-Ch1-S021:C","text":"族群→個體→器官","explanation":"錯誤：此方向往較低尺度。"},{"id":"BIO-B01-Ch1-S021:D","text":"生物圈→生態系→群集","explanation":"錯誤：此方向也是由高到低。"}],"concept":"","example":"肌肉細胞可共同形成肌肉組織。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S022","topicId":"","stem":"「整體不只是零件相加」主要提醒哪項？","correct":"BIO-B01-Ch1-S022:B","options":[{"id":"BIO-B01-Ch1-S022:A","text":"零件完全沒有研究價值","explanation":"錯誤：部件仍值得研究。"},{"id":"BIO-B01-Ch1-S022:B","text":"排列與互動可能影響整體功能","explanation":"正確：部件間關係也是整體性質的來源。"},{"id":"BIO-B01-Ch1-S022:C","text":"所有層級功能完全相同","explanation":"錯誤：層級間可出現新性質。"},{"id":"BIO-B01-Ch1-S022:D","text":"只有生態系才有部件","explanation":"錯誤：細胞等層級也有部件。"}],"concept":"","example":"拆散後的部件不必保有原系統功能。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S023","topicId":"","stem":"由一隻小鼠改看該地同種小鼠的集合，觀察焦點移向哪個尺度？","correct":"BIO-B01-Ch1-S023:C","options":[{"id":"BIO-B01-Ch1-S023:A","text":"分子","explanation":"錯誤：分子是個體內的低尺度。"},{"id":"BIO-B01-Ch1-S023:B","text":"胞器","explanation":"錯誤：胞器不是多隻鼠的集合。"},{"id":"BIO-B01-Ch1-S023:C","text":"族群","explanation":"正確：同地同種個體的集合屬族群尺度。"},{"id":"BIO-B01-Ch1-S023:D","text":"器官","explanation":"錯誤：器官仍屬個體內部。"}],"concept":"","example":"同一片草地的同種小鼠可構成一個族群。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-S024","topicId":"","stem":"描述一般生態系時，能量與物質的基本差別是哪項？","correct":"BIO-B01-Ch1-S024:D","options":[{"id":"BIO-B01-Ch1-S024:A","text":"兩者都永久循環","explanation":"錯誤：能量不像物質那樣循環。"},{"id":"BIO-B01-Ch1-S024:B","text":"兩者都只存在生物體內","explanation":"錯誤：兩者均涉及環境。"},{"id":"BIO-B01-Ch1-S024:C","text":"物質單向消失而能量回收","explanation":"錯誤：把兩者的基本描述顛倒了。"},{"id":"BIO-B01-Ch1-S024:D","text":"能量流動，物質可循環","explanation":"正確：這是本節強調的區別。"}],"concept":"","example":"太陽能經植物流向小鼠，物質可回到環境。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S025","topicId":"","stem":"以陽光為能量起點的草地中，何者是合理的能量傳遞方向？","correct":"BIO-B01-Ch1-S025:A","options":[{"id":"BIO-B01-Ch1-S025:A","text":"太陽→植物→取食植物的小鼠","explanation":"正確：光合生產者取得太陽能，再透過食物傳遞。"},{"id":"BIO-B01-Ch1-S025:B","text":"小鼠→太陽→植物","explanation":"錯誤：小鼠不是太陽能的來源。"},{"id":"BIO-B01-Ch1-S025:C","text":"土壤中的熱→太陽→小鼠","explanation":"錯誤：環境散熱不會循環成此食物能量路線。"},{"id":"BIO-B01-Ch1-S025:D","text":"捕食者→太陽→植物","explanation":"錯誤：捕食者不把能量送回太陽。"}],"concept":"","example":"本題只描述陽光起始的食物能量路線。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S026","topicId":"","stem":"生物利用食物能量做功時，一部分能量通常以何種形式散到周圍？","correct":"BIO-B01-Ch1-S026:B","options":[{"id":"BIO-B01-Ch1-S026:A","text":"新的遺傳資訊","explanation":"錯誤：能量不因此變成遺傳訊息。"},{"id":"BIO-B01-Ch1-S026:B","text":"熱","explanation":"正確：能量轉換常伴隨熱散失。"},{"id":"BIO-B01-Ch1-S026:C","text":"另一顆太陽","explanation":"錯誤：不會產生太陽。"},{"id":"BIO-B01-Ch1-S026:D","text":"消失的物質","explanation":"錯誤：熱散失不是物質消失。"}],"concept":"","example":"植物、小鼠及捕食者都可有熱散失。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S027","topicId":"","stem":"哪項較適合用「循環」描述？","correct":"BIO-B01-Ch1-S027:C","options":[{"id":"BIO-B01-Ch1-S027:A","text":"進入草地的同一份可用能量永久回返","explanation":"錯誤：可用能量不永久循環。"},{"id":"BIO-B01-Ch1-S027:B","text":"捕食者把熱送回太陽","explanation":"錯誤：這不是食物能量的方向。"},{"id":"BIO-B01-Ch1-S027:C","text":"碳在生物與環境間交換並再利用","explanation":"正確：碳屬可參與物質循環的物質。"},{"id":"BIO-B01-Ch1-S027:D","text":"小鼠一生中主動改變遺傳性狀","explanation":"錯誤：這不是物質循環，也不是正確演化敘述。"}],"concept":"","example":"植物體內的物質可經分解返回環境。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S028","topicId":"","stem":"在簡單物質循環中，分解者的重要角色是哪項？","correct":"BIO-B01-Ch1-S028:D","options":[{"id":"BIO-B01-Ch1-S028:A","text":"製造新的太陽光","explanation":"錯誤：分解者不製造陽光。"},{"id":"BIO-B01-Ch1-S028:B","text":"使所有物質永遠離開系統","explanation":"錯誤：回收物質有助循環。"},{"id":"BIO-B01-Ch1-S028:C","text":"直接把鼠變成植物","explanation":"錯誤：不是把個體直接變成另一生物。"},{"id":"BIO-B01-Ch1-S028:D","text":"將遺體或排出物中的物質回收到環境","explanation":"正確：分解者讓物質可再次被利用。"}],"concept":"","example":"落葉的物質可經分解返回土壤。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S029","topicId":"","stem":"畫出草地能量流動時，熱散失箭頭應如何理解？","correct":"BIO-B01-Ch1-S029:A","options":[{"id":"BIO-B01-Ch1-S029:A","text":"生產者與各消費層級皆可能有","explanation":"正確：各層級的能量使用與轉換均可散熱。"},{"id":"BIO-B01-Ch1-S029:B","text":"只有最終捕食者才有","explanation":"錯誤：不是到食物鏈末端才散熱。"},{"id":"BIO-B01-Ch1-S029:C","text":"只要有分解者就完全沒有","explanation":"錯誤：分解者不取消散熱。"},{"id":"BIO-B01-Ch1-S029:D","text":"熱散失代表能量被物質創造","explanation":"錯誤：散熱是能量轉換，不是創造能量。"}],"concept":"","example":"植物進行生命活動時也會散熱。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S030","topicId":"","stem":"何者可列入物質循環中的非生物環境部分？","correct":"BIO-B01-Ch1-S030:B","options":[{"id":"BIO-B01-Ch1-S030:A","text":"一隻捕食者","explanation":"錯誤：捕食者是生物。"},{"id":"BIO-B01-Ch1-S030:B","text":"土壤與水體","explanation":"正確：土壤與水體是非生物環境要素。"},{"id":"BIO-B01-Ch1-S030:C","text":"小鼠的心臟","explanation":"錯誤：心臟是生物體器官。"},{"id":"BIO-B01-Ch1-S030:D","text":"一片活葉的細胞","explanation":"錯誤：活葉細胞屬生物部分。"}],"concept":"","example":"大氣中的物質也可與生物交換。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S031","topicId":"","stem":"對多數生態系的主要能量輸入，哪個說法適當？","correct":"BIO-B01-Ch1-S031:C","options":[{"id":"BIO-B01-Ch1-S031:A","text":"只由捕食者輸入","explanation":"錯誤：捕食者從食物取得能量。"},{"id":"BIO-B01-Ch1-S031:B","text":"完全不需要輸入","explanation":"錯誤：生命活動需能量供應。"},{"id":"BIO-B01-Ch1-S031:C","text":"主要來自太陽","explanation":"正確：多數生態系以太陽為主要能量起點。"},{"id":"BIO-B01-Ch1-S031:D","text":"只由土壤回收的熱輸入","explanation":"錯誤：熱不是如此被回收利用。"}],"concept":"","example":"陽光經植物進入食物關係。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S032","topicId":"","stem":"某小鼠吃植物，植物中的物質進入鼠體。這最直接顯示哪項？","correct":"BIO-B01-Ch1-S032:D","options":[{"id":"BIO-B01-Ch1-S032:A","text":"物質一被取食就消滅","explanation":"錯誤：物質不是因取食而消滅。"},{"id":"BIO-B01-Ch1-S032:B","text":"只有能量可跨生物傳遞","explanation":"錯誤：物質也能轉移。"},{"id":"BIO-B01-Ch1-S032:C","text":"小鼠不需要物質","explanation":"錯誤：小鼠也需要物質維持生命。"},{"id":"BIO-B01-Ch1-S032:D","text":"物質可透過取食在生物間轉移","explanation":"正確：食物同時提供物質與能量。"}],"concept":"","example":"植物中的碳可成為鼠體物質的一部分。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S033","topicId":"","stem":"哪組角色關係符合草地的物質回收示意？","correct":"BIO-B01-Ch1-S033:A","options":[{"id":"BIO-B01-Ch1-S033:A","text":"落葉→分解者→非生物環境","explanation":"正確：分解落葉後物質可回到環境。"},{"id":"BIO-B01-Ch1-S033:B","text":"非生物環境→捕食者→太陽","explanation":"錯誤：不是物質回收的合理路徑。"},{"id":"BIO-B01-Ch1-S033:C","text":"太陽→分解者→新太陽","explanation":"錯誤：分解者不生產太陽。"},{"id":"BIO-B01-Ch1-S033:D","text":"小鼠→遺傳資訊→土壤中的熱","explanation":"錯誤：混淆資訊、物質與能量。"}],"concept":"","example":"回到環境的物質可再次被植物取得。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-S034","topicId":"","stem":"老鷹捕食小鼠，最直接呈現哪種生物學關係？","correct":"BIO-B01-Ch1-S034:B","options":[{"id":"BIO-B01-Ch1-S034:A","text":"DNA 複製的詳細步驟","explanation":"錯誤：題幹未涉及DNA複製。"},{"id":"BIO-B01-Ch1-S034:B","text":"生物間的交互作用","explanation":"正確：捕食是生物彼此影響的例子。"},{"id":"BIO-B01-Ch1-S034:C","text":"所有能量永久循環","explanation":"錯誤：捕食不表示能量循環。"},{"id":"BIO-B01-Ch1-S034:D","text":"個體變成另一物種","explanation":"錯誤：被捕食不是物種轉變。"}],"concept":"","example":"植物被鼠吃也是交互作用。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-S035","topicId":"","stem":"比較小鼠毛色的隱蔽效果時，何者最需要一起考慮？","correct":"BIO-B01-Ch1-S035:C","options":[{"id":"BIO-B01-Ch1-S035:A","text":"筆記頁數","explanation":"錯誤：頁數不決定隱蔽。"},{"id":"BIO-B01-Ch1-S035:B","text":"小鼠名稱的字數","explanation":"錯誤：名稱長短無關。"},{"id":"BIO-B01-Ch1-S035:C","text":"棲地背景","explanation":"正確：毛色是否接近背景影響被發現風險。"},{"id":"BIO-B01-Ch1-S035:D","text":"研究者使用的字型","explanation":"錯誤：字型不是棲地條件。"}],"concept":"","example":"淡色毛在白沙背景可能較不顯眼。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-S036","topicId":"","stem":"同一深色毛在深土與白沙上可能有不同隱蔽效果，說明什麼？","correct":"BIO-B01-Ch1-S036:D","options":[{"id":"BIO-B01-Ch1-S036:A","text":"毛色的效果完全不受環境影響","explanation":"錯誤：背景正是影響因素。"},{"id":"BIO-B01-Ch1-S036:B","text":"深色毛一定在各處最有利","explanation":"錯誤：優勢不是普遍固定。"},{"id":"BIO-B01-Ch1-S036:C","text":"淡色毛一定在各處最有利","explanation":"錯誤：淡色也不是處處有利。"},{"id":"BIO-B01-Ch1-S036:D","text":"性狀效果與環境情境相關","explanation":"正確：性狀與背景要合併判斷。"}],"concept":"","example":"深土中的深色鼠可能比淡色鼠不顯眼。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-S037","topicId":"","stem":"把植物、小鼠與捕食者放在同一系統討論，主要避免哪種看法？","correct":"BIO-B01-Ch1-S037:A","options":[{"id":"BIO-B01-Ch1-S037:A","text":"把每種生物視為完全孤立","explanation":"正確：系統觀點避免忽略彼此影響。"},{"id":"B 後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S044","topicId":"","stem":"下列何者是章介紹要排除的演化迷思？","correct":"BIO-B01-Ch1-S044:D","options":[{"id":"BIO-B01-Ch1-S044:A","text":"可遺傳差異可能影響留下後代的機會","explanation":"錯誤：這是符合天擇的合理敘述。"},{"id":"BIO-B01-Ch1-S044:B","text":"族群特徵比例可能跨世代改變","explanation":"錯誤：這是演化的基本描述。"},{"id":"BIO-B01-Ch1-S044:C","text":"性狀是否有利與環境有關","explanation":"錯誤：環境情境確實重要。"},{"id":"BIO-B01-Ch1-S044:D","text":"個體為了需要而主動演化","explanation":"正確：這把族群世代變化誤寫成個體意志。"}],"concept":"","example":"演化不是小鼠說想變色就變色。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S045","topicId":"","stem":"若有利的可遺傳毛色在多代後比例上升，適當的描述是哪項？","correct":"BIO-B01-Ch1-S045:A","options":[{"id":"BIO-B01-Ch1-S045:A","text":"族群組成發生跨世代改變","explanation":"正確：比例變化描述的是族群。"},{"id":"BIO-B01-Ch1-S045:B","text":"每隻原有小鼠都自行變色","explanation":"錯誤：族群比例變不要求每個體改色。"},{"id":"BIO-B01-Ch1-S045:C","text":"熱變成了毛色基因","explanation":"錯誤：混淆能量與資訊。"},{"id":"BIO-B01-Ch1-S045:D","text":"整個生態系變成單一個體","explanation":"錯誤：混淆組織尺度。"}],"concept":"","example":"後代來源不同，可使族群中的性狀比例不同。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-S046","topicId":"","stem":"科學假說至少應具有哪種性質？","correct":"BIO-B01-Ch1-S046:B","options":[{"id":"BIO-B01-Ch1-S046:A","text":"任何結果都不能檢驗它","explanation":"錯誤：不可檢驗不符合科學假說門檻。"},{"id":"BIO-B01-Ch1-S046:B","text":"能由觀察或實驗檢驗","explanation":"正確：可檢驗性是重要要求。"},{"id":"BIO-B01-Ch1-S046:C","text":"只要作者相信就成立","explanation":"錯誤：信念不是證據。"},{"id":"BIO-B01-Ch1-S046:D","text":"一旦寫下永不能更改","explanation":"錯誤：新證據可促成修正。"}],"concept":"","example":"假說需能連到可觀察的預測。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S047","topicId":"","stem":"科學探究中的預測主要做什麼？","correct":"BIO-B01-Ch1-S047:C","options":[{"id":"BIO-B01-Ch1-S047:A","text":"取代所有資料","explanation":"錯誤：預測仍要由資料檢驗。"},{"id":"BIO-B01-Ch1-S047:B","text":"永久保證假說正確","explanation":"錯誤：預測不是永久證明。"},{"id":"BIO-B01-Ch1-S047:C","text":"把假說轉成可期待並檢查的結果","explanation":"正確：預測讓假說可與結果對照。"},{"id":"BIO-B01-Ch1-S047:D","text":"禁止後續觀察","explanation":"錯誤：觀察是檢驗的一環。"}],"concept":"","example":"若假說成立，應看到什麼結果？","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S048","topicId":"","stem":"資料符合某個假說的預測時，最審慎的說法是哪項？","correct":"BIO-B01-Ch1-S048:D","options":[{"id":"BIO-B01-Ch1-S048:A","text":"從此任何新證據都無效","explanation":"錯誤：仍須面對新證據。"},{"id":"BIO-B01-Ch1-S048:B","text":"假說已永遠被證明","explanation":"錯誤：支持不等於永久證明。"},{"id":"BIO-B01-Ch1-S048:C","text":"假說不需要再接受檢驗","explanation":"錯誤：仍可繼續檢驗。"},{"id":"BIO-B01-Ch1-S048:D","text":"目前資料支持假說","explanation":"正確：這保留科學知識可修正的性質。"}],"concept":"","example":"另一批資料可能要求調整原本解釋。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S049","topicId":"","stem":"一個說法聲稱「任何觀察結果都不可能與我衝突」，它最缺少什麼？","correct":"BIO-B01-Ch1-S049:A","options":[{"id":"BIO-B01-Ch1-S049:A","text":"可檢驗性","explanation":"正確：若任何結果都不能檢查主張，缺少科學檢驗意義。"},{"id":"BIO-B01-Ch1-S049:B","text":"作者的自信","explanation":"錯誤：自信不能補上可檢驗性。"},{"id":"BIO-B01-Ch1-S049:C","text":"語句的長度","explanation":"錯誤：長度不是門檻。"},{"id":"BIO-B01-Ch1-S049:D","text":"排版裝飾","explanation":"錯誤：裝飾不改變可檢驗性。"}],"concept":"","example":"可用證據評估的解釋才適合進入科學假說檢驗。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-S050","topicId":"","stem":"新資料與原假說預測不一致時，符合科學探究的做法是哪項？","correct":"BIO-B01-Ch1-S050:B","options":[{"id":"BIO-B01-Ch1-S050:A","text":"刪掉不合意資料","explanation":"錯誤：不能為保留假說任意刪資料。"},{"id":"BIO-B01-Ch1-S050:B","text":"檢視證據並考慮修正原解釋","explanation":"正確：資料可促使修正或放棄原解釋。"},{"id":"BIO-B01-Ch1-S050:C","text":"宣布觀察永遠不重要","explanation":"錯誤：觀察是科學證據。"},{"id":"BIO-B01-Ch1-S050:D","text":"只重複原先的信念","explanation":"錯誤：信念不能取代證據。"}],"concept":"","example":"原想法可能需要修改後再受檢驗。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1-B001","topicId":"","stem":"某組細胞單獨存在時無法完成一項功能，按原有排列互動後才出現該功能。最合理的解釋為何？","correct":"BIO-B01-Ch1-B001:B","options":[{"id":"BIO-B01-Ch1-B001:A","text":"功能必定只由細胞數目決定","explanation":"錯誤：題幹指出排列互動才帶來功能。"},{"id":"BIO-B01-Ch1-B001:B","text":"排列與互動產生整體的新性質","explanation":"正確：這符合湧現性質。"},{"id":"BIO-B01-Ch1-B001:C","text":"每個細胞本來就有整體全部功能","explanation":"錯誤：題幹明示單獨細胞無該功能。"},{"id":"BIO-B01-Ch1-B001:D","text":"功能與部件之間的關係無關","explanation":"錯誤：題幹證據正支持關係的重要性。"}],"concept":"","example":"同樣部件未必在任意排列下具有相同功能。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B002","topicId":"","stem":"研究者保留系統內所有部件，卻改變部件之間的連接方式，結果整體功能不同。這最支持哪項？","correct":"BIO-B01-Ch1-B002:C","options":[{"id":"BIO-B01-Ch1-B002:A","text":"只列部件清單就必定足夠","explanation":"錯誤：相同清單出現不同功能，清單不足。"},{"id":"BIO-B01-Ch1-B002:B","text":"部件一樣就不可能有差異","explanation":"錯誤：題幹已觀察到差異。"},{"id":"BIO-B01-Ch1-B002:C","text":"理解整體時也需研究部件間關係","explanation":"正確：連接方式影響功能，符合組織與互動觀點。"},{"id":"BIO-B01-Ch1-B002:D","text":"部件本身完全不值得研究","explanation":"錯誤：研究關係不等於否定部件。"}],"concept":"","example":"系統功能可能取決於如何組成。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B003","topicId":"","stem":"甲只研究小鼠的一種分子；乙研究其器官中的細胞如何協作。何種評價最恰當？","correct":"BIO-B01-Ch1-B003:D","options":[{"id":"BIO-B01-Ch1-B003:A","text":"甲已必然完整解釋乙的所有問題","explanation":"錯誤：分子研究不必然涵蓋全部互動。"},{"id":"BIO-B01-Ch1-B003:B","text":"乙不能研究生物","explanation":"錯誤：細胞協作也是生物學研究。"},{"id":"BIO-B01-Ch1-B003:C","text":"甲與乙必定在相同層級","explanation":"錯誤：兩者焦點的尺度不同。"},{"id":"BIO-B01-Ch1-B003:D","text":"兩者尺度不同，可提供互補理解","explanation":"正確：部件與組織關係可互補。"}],"concept":"","example":"了解零件及零件如何協作都能幫助理解整體。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B004","topicId":"","stem":"有人說「一個 DNA 分子已是完整小鼠，因為其中有資訊」。應如何修正？","correct":"BIO-B01-Ch1-B004:A","options":[{"id":"BIO-B01-Ch1-B004:A","text":"資訊所在的分子不等於由多層級構成的個體","explanation":"正確：資訊與個體的層級不能混為一談。"},{"id":"BIO-B01-Ch1-B004:B","text":"只要資訊夠多，分子就一定是個體","explanation":"錯誤：資訊量不直接消除層級差異。"},{"id":"BIO-B01-Ch1-B004:C","text":"小鼠完全不含分子","explanation":"錯誤：小鼠由分子等部件構成。"},{"id":"BIO-B01-Ch1-B004:D","text":"組織層級只是一種名稱，沒有差別","explanation":"錯誤：不同層級有不同組織與功能。"}],"concept":"","example":"一張部件說明書不等於運作中的整個系統。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B005","topicId":"","stem":"野外紀錄只列出草地中的生物，未列光、水或土壤。若目標是描述完整生態系，還應補哪項？","correct":"BIO-B01-Ch1-B005:B","options":[{"id":"BIO-B01-Ch1-B005:A","text":"所有生物的名字字數","explanation":"錯誤：字數不補足生態系範圍。"},{"id":"BIO-B01-Ch1-B005:B","text":"生物互動的非生物環境","explanation":"正確：生態系還包含非生物環境。"},{"id":"BIO-B01-Ch1-B005:C","text":"把每隻生物縮成一個分子","explanation":"錯誤：改尺度不補環境資訊。"},{"id":"BIO-B01-Ch1-B005:D","text":"刪去生物資料只留光線","explanation":"錯誤：完整生態系仍須生物部分。"}],"concept":"","example":"生物群集加上周圍非生物要素才符合此尺度。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B006","topicId":"","stem":"一份報告把單隻小鼠稱為「包含整片草地及其水土的生態系」。主要錯誤是什麼？","correct":"BIO-B01-Ch1-B006:C","options":[{"id":"BIO-B01-Ch1-B006:A","text":"忽略小鼠會取食","explanation":"錯誤：取食不是此命名錯誤的核心。"},{"id":"BIO-B01-Ch1-B006:B","text":"沒有使用英文名詞","explanation":"錯誤：語言形式不決定尺度。"},{"id":"BIO-B01-Ch1-B006:C","text":"把個體尺度與生態系尺度混同","explanation":"正確：個體只是生態系中的一部分。"},{"id":"BIO-B01-Ch1-B006:D","text":"未提所有毛色基因","explanation":"錯誤：基因清單也無法修正尺度混淆。"}],"concept":"","example":"某地的鼠、植物、捕食者和水土可納入更大系統。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B007","topicId":"","stem":"有人見到層級圖列有器官，便斷言所有單細胞生物都必須具有器官。哪項回應合理？","correct":"BIO-B01-Ch1-B007:D","options":[{"id":"BIO-B01-Ch1-B007:A","text":"圖有列出就適用於每種生物","explanation":"錯誤：未保留生物類型條件。"},{"id":"BIO-B01-Ch1-B007:B","text":"所有單細胞生物其實都不是生命","explanation":"錯誤：單細胞生物仍是生命。"},{"id":"BIO-B01-Ch1-B007:C","text":"器官一詞等於任何分子","explanation":"錯誤：器官與分子不同尺度。"},{"id":"BIO-B01-Ch1-B007:D","text":"層級圖是觀察架構，不代表每種生物具備全部中間層級","explanation":"正確：單細胞生物無需具備全部器官層級。"}],"concept":"","example":"原核生物也提醒我們不能要求每種細胞都有膜包圍胞器。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B008","topicId":"","stem":"若比較一個小鼠細胞與完整小鼠，下列推論哪項最合理？","correct":"BIO-B01-Ch1-B008:A","options":[{"id":"BIO-B01-Ch1-B008:A","text":"完整個體還涉及多個細胞及組織間的協作","explanation":"正確：較高層級需考慮多部件的組織。"},{"id":"BIO-B01-Ch1-B008:B","text":"兩者全部功能與尺度完全一致","explanation":"錯誤：單細胞不能等同整隻多細胞動物。"},{"id":"BIO-B01-Ch1-B008:C","text":"小鼠細胞不含任何分子","explanation":"錯誤：細胞包含分子。"},{"id":"BIO-B01-Ch1-B008:D","text":"個體只是名稱改變，組成不變","explanation":"錯誤：細胞與個體不只是不同名稱。"}],"concept":"","example":"研究細胞不等於已涵蓋完整動物的所有活動。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B009","topicId":"","stem":"依「細胞→組織→器官→器官系統→個體」理解小鼠，若只跳過組織互動直接斷言已完整理解器官，哪項保留最重要？","correct":"BIO-B01-Ch1-B009:B","options":[{"id":"BIO-B01-Ch1-B009:A","text":"分子永遠不重要","explanation":"錯誤：分子仍有研究價值。"},{"id":"BIO-B01-Ch1-B009:B","text":"還需確認細胞及組織如何共同形成器官功能","explanation":"正確：組織與互動不能由名稱清單自動推出。"},{"id":"BIO-B01-Ch1-B009:C","text":"個體一定等同器官","explanation":"錯誤：器官只是個體的一部分。"},{"id":"BIO-B01-Ch1-B009:D","text":"器官系統應放在細胞之前","explanation":"錯誤：這顛倒小鼠的結構尺度。"}],"concept":"","example":"層級順序正確仍不等於知道層級間如何運作。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B010","topicId":"","stem":"某研究先描述一隻鼠，再描述同地同種鼠的集合，最後將植物、捕食者與水土一起納入。這串觀察有何特點？","correct":"BIO-B01-Ch1-B010:C","options":[{"id":"BIO-B01-Ch1-B010:A","text":"始終只在分子尺度","explanation":"錯誤：題幹未以分子為焦點。"},{"id":"BIO-B01-Ch1-B010:B","text":"越看越接近單一胞器","explanation":"錯誤：觀察尺度是擴大。"},{"id":"BIO-B01-Ch1-B010:C","text":"由個體擴展到族群及生態系尺度","explanation":"正確：三步分別指向更廣的組織範圍。"},{"id":"BIO-B01-Ch1-B010:D","text":"證明所有層級互不相干","explanation":"錯誤：尺度可連結而非完全無關。"}],"concept":"","example":"改變研究範圍時要重新辨認層級。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B011","topicId":"","stem":"一套細胞系統被拆散後不能維持原功能。能否因此斷言部件不重要？","correct":"BIO-B01-Ch1-B011:D","options":[{"id":"BIO-B01-Ch1-B011:A","text":"可以，因為只有整體值得研究","explanation":"錯誤：整體觀點不否定部件。"},{"id":"BIO-B01-Ch1-B011:B","text":"可以，分子從不影響生命","explanation":"錯誤：分子參與生命系統。"},{"id":"BIO-B01-Ch1-B011:C","text":"可以，拆散後就不再有部件","explanation":"錯誤：部件仍存在，關係已改變。"},{"id":"BIO-B01-Ch1-B011:D","text":"不可以，部件與原本的排列互動都可能重要","explanation":"正確：功能喪失可提示組織關係的重要性。"}],"concept":"","example":"少了關鍵互動，保留零件也未必保留功能。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B012","topicId":"","stem":"教學圖把分子、胞器、細胞、組織列成由低到高的尺度。哪個補充最能防止過度推論？","correct":"BIO-B01-Ch1-B012:A","options":[{"id":"BIO-B01-Ch1-B012:A","text":"這些是常用尺度，並非每種生物都具備全部層級","explanation":"正確：保留不同生物組織差異。"},{"id":"BIO-B01-Ch1-B012:B","text":"每種細胞一定都有所有胞器","explanation":"錯誤：原核細胞無膜包圍胞器。"},{"id":"BIO-B01-Ch1-B012:C","text":"沒有組織的生物一定無法生存","explanation":"錯誤：單細胞生物不必具有組織。"},{"id":"BIO-B01-Ch1-B012:D","text":"凡是分子都已經是器官","explanation":"錯誤：分子與器官不等同。"}],"concept":"","example":"尺度圖需配合生物類型閱讀。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B013","topicId":"","stem":"若要在研究草地生命時納入生態系中的非生物部分，哪份補充紀錄最適切？","correct":"BIO-B01-Ch1-B013:B","options":[{"id":"BIO-B01-Ch1-B013:A","text":"只追加更多小鼠名字","explanation":"錯誤：仍只有生物。"},{"id":"BIO-B01-Ch1-B013:B","text":"加入水體、土壤及光的情況","explanation":"正確：補上與生命互動的非生物環境要素。"},{"id":"BIO-B01-Ch1-B013:C","text":"只改為列出植物的種類","explanation":"錯誤：植物仍是生物部分。"},{"id":"BIO-B01-Ch1-B013:D","text":"只增加捕食者的照片","explanation":"錯誤：捕食者亦是生物部分。"}],"concept":"","example":"只列生物並未完整呈現生態系範圍。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B014","topicId":"","stem":"兩個模型包含相同種類與數量的部件，排列方式不同。依湧現觀點，最審慎的預期是哪項？","correct":"BIO-B01-Ch1-B014:C","options":[{"id":"BIO-B01-Ch1-B014:A","text":"功能必定毫無差異","explanation":"錯誤：相同零件不保證相同功能。"},{"id":"BIO-B01-Ch1-B014:B","text":"可以完全不檢查互動","explanation":"錯誤：互動是重要研究對象。"},{"id":"BIO-B01-Ch1-B014:C","text":"整體功能可能不同，需考慮排列與互動","explanation":"正確：湧現觀點允許組成關係改變功能。"},{"id":"BIO-B01-Ch1-B014:D","text":"不同排列必使所有功能相同","explanation":"錯誤：沒有此保證。"}],"concept":"","example":"相同零件清單不是完整系統描述。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B015","topicId":"","stem":"學生畫出「器官→組織→細胞」並標示由低到高。對小鼠結構層級，哪項修改正確？","correct":"BIO-B01-Ch1-B015:D","options":[{"id":"BIO-B01-Ch1-B015:A","text":"改成「族群→個體→器官」且仍標由低到高","explanation":"錯誤：這仍是由高到低。"},{"id":"BIO-B01-Ch1-B015:B","text":"只把細胞改稱生物圈","explanation":"錯誤：替換名稱會加劇尺度錯誤。"},{"id":"BIO-B01-Ch1-B015:C","text":"維持原圖，因為三者沒有尺度差異","explanation":"錯誤：三者確有尺度差異。"},{"id":"BIO-B01-Ch1-B015:D","text":"把順序改成「細胞→組織→器官」","explanation":"正確：這才符合由低到高的組成關係。"}],"concept":"","example":"器官包含組織，組織由細胞構成。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B016","topicId":"","stem":"某人因原核細胞沒有膜包圍胞器，便說它不能用任何組織層級研究。這推論哪裡不妥？","correct":"BIO-B01-Ch1-B016:A","options":[{"id":"BIO-B01-Ch1-B016:A","text":"缺少某中間層級不等於沒有分子、細胞或個體等尺度","explanation":"正確：架構可依實際生物選擇合適尺度。"},{"id":"BIO-B01-Ch1-B016:B","text":"只要沒有胞器就沒有分子","explanation":"錯誤：原核細胞仍由分子構成。"},{"id":"BIO-B01-Ch1-B016:C","text":"原核細胞必定具有所有動物器官","explanation":"錯誤：原核生物不具動物器官。"},{"id":"BIO-B01-Ch1-B016:D","text":"組織層級只能用在人體","explanation":"錯誤：層級研究不限人體。"}],"concept":"","example":"常用尺度不要求每種生物逐格具備。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B017","topicId":"","stem":"研究者知道系統每種分子的名稱，但還不能解釋整體如何運作。依章介紹，下一個合理方向是什麼？","correct":"BIO-B01-Ch1-B017:B","options":[{"id":"BIO-B01-Ch1-B017:A","text":"宣布生物不可研究","explanation":"錯誤：知識缺口不代表不可研究。"},{"id":"BIO-B01-Ch1-B017:B","text":"研究這些部件如何排列並彼此影響","explanation":"正確：組織與互動可能解釋新性質。"},{"id":"BIO-B01-Ch1-B017:C","text":"假定每一分子都有整體所有功能","explanation":"錯誤：單一部件未必具有整體功能。"},{"id":"BIO-B01-Ch1-B017:D","text":"只重寫名稱，不增加其他資訊","explanation":"錯誤：重寫名稱不能補關係資訊。"}],"concept":"","example":"部件清單可作起點，但不是全部答案。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B018","topicId":"","stem":"把整隻小鼠拆解到器官、細胞與分子，是在改變什麼？","correct":"BIO-B01-Ch1-B018:C","options":[{"id":"BIO-B01-Ch1-B018:A","text":"物種的名稱","explanation":"錯誤：拆解觀察不等於另定物種。"},{"id":"BIO-B01-Ch1-B018:B","text":"太陽能的來源","explanation":"錯誤：這不改變能量起點。"},{"id":"BIO-B01-Ch1-B018:C","text":"觀察生命的組織尺度","explanation":"正確：由個體轉向較低的結構層級。"},{"id":"BIO-B01-Ch1-B018:D","text":"小鼠族群的世代數","explanation":"錯誤：不是跨世代追蹤。"}],"concept":"","example":"向內看部件與向外看生態系是不同尺度方向。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B019","topicId":"","stem":"已知一個系統的新功能依賴細胞間互動，哪種結論最符合題目？","correct":"BIO-B01-Ch1-B019:D","options":[{"id":"BIO-B01-Ch1-B019:A","text":"只要有一個細胞就必定有新功能","explanation":"錯誤：題幹明示依賴細胞間互動。"},{"id":"BIO-B01-Ch1-B019:B","text":"每個單獨分子也必然有此功能","explanation":"錯誤：不能把整體功能外推到分子。"},{"id":"BIO-B01-Ch1-B019:C","text":"細胞位置與關係都不重要","explanation":"錯誤：與題意相反。"},{"id":"BIO-B01-Ch1-B019:D","text":"理解功能時須納入細胞間關係","explanation":"正確：需要處理互動造成的新性質。"}],"concept":"","example":"群體部件的協作可能使整體不同於單一部件。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B020","topicId":"","stem":"同地的鼠、植物與捕食者連同水土構成研究系統。若只保留其中一隻鼠，對系統範圍的說法何者正確？","correct":"BIO-B01-Ch1-B020:A","options":[{"id":"BIO-B01-Ch1-B020:A","text":"已縮小到個體，不能宣稱仍完整包含原生態系","explanation":"正確：研究對象縮小，原系統要素並未全部保留。"},{"id":"BIO-B01-Ch1-B020:B","text":"仍保留原系統的全部生物與非生物部分","explanation":"錯誤：其他生物與環境已被排除。"},{"id":"BIO-B01-Ch1-B020:C","text":"只缺一個名稱，範圍完全沒變","explanation":"錯誤：範圍確實改變。"},{"id":"BIO-B01-Ch1-B020:D","text":"已擴大成生物圈","explanation":"錯誤：不是擴大到全球尺度。"}],"concept":"","example":"部分對象不能代替原完整研究系統。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、4–6 頁（PDF 51、53–55 頁）｜本節筆記 正式第4、5張；正文3、4/10","shuffle":true},{"id":"BIO-B01-Ch1-B021","topicId":"","stem":"毛色基因變異會影響小鼠毛色，但淡毛在不同背景上的隱蔽效果不同。哪項整合最適當？","correct":"BIO-B01-Ch1-B021:B","options":[{"id":"BIO-B01-Ch1-B021:A","text":"只研究背景就能否定基因作用","explanation":"錯誤：背景影響不否定遺傳資訊。"},{"id":"BIO-B01-Ch1-B021:B","text":"資訊影響性狀，環境影響其隱蔽效果","explanation":"正確：兩種因素回答不同面向。"},{"id":"BIO-B01-Ch1-B021:C","text":"基因存在便表示環境完全無效","explanation":"錯誤：遺傳作用與環境影響可並存。"},{"id":"BIO-B01-Ch1-B021:D","text":"隱蔽效果不同證明 DNA 不存在","explanation":"錯誤：效果差異不能推出DNA不存在。"}],"concept":"","example":"毛色形成與毛色在當地是否有利需分開問。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B022","topicId":"","stem":"一段毛色說明從「相關基因影響毛色」跳到「所有 DNA 都只為毛色而存在」。問題在哪裡？","correct":"BIO-B01-Ch1-B022:C","options":[{"id":"BIO-B01-Ch1-B022:A","text":"前句完全否定資訊主題","explanation":"錯誤：前句正是在說資訊與性狀。"},{"id":"BIO-B01-Ch1-B022:B","text":"後句只是相同內容的精確重述","explanation":"錯誤：後句增加全部與唯一的無據限制。"},{"id":"BIO-B01-Ch1-B022:C","text":"把特定關聯過度擴大成全部 DNA 的唯一功能","explanation":"正確：關聯只涉及毛色相關資訊。"},{"id":"BIO-B01-Ch1-B022:D","text":"只要提 DNA 就不能考慮環境","explanation":"錯誤：環境仍可影響生命現象。"}],"concept":"","example":"部分基因與毛色相關，不代表其他遺傳資訊無作用。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B023","topicId":"","stem":"若一份圖把「DNA 中的遺傳資訊」連到「毛色」，這支箭頭最合理代表什麼？","correct":"BIO-B01-Ch1-B023:D","options":[{"id":"BIO-B01-Ch1-B023:A","text":"DNA 就是從植物來的熱","explanation":"錯誤：資訊箭頭不是熱傳遞。"},{"id":"BIO-B01-Ch1-B023:B","text":"小鼠只要有 DNA 就不用取食","explanation":"錯誤：資訊不能代替食物資源。"},{"id":"BIO-B01-Ch1-B023:C","text":"毛色一定與所有外在條件無關","explanation":"錯誤：箭頭不允許排除所有環境影響。"},{"id":"BIO-B01-Ch1-B023:D","text":"遺傳資訊可參與性狀形成","explanation":"正確：圖示表示資訊與性狀的關聯。"}],"concept":"","example":"箭頭應按其標示的作用來讀，不能任意擴張。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B024","topicId":"","stem":"兩群同種小鼠毛色深淺不同。依章介紹，哪個研究角度適合資訊主題？","correct":"BIO-B01-Ch1-B024:A","options":[{"id":"BIO-B01-Ch1-B024:A","text":"探討毛色相關的可遺傳基因差異","explanation":"正確：遺傳資訊與毛色的關係在本節已教。"},{"id":"BIO-B01-Ch1-B024:B","text":"只比較兩群名字的長短","explanation":"錯誤：名稱長度無法解釋毛色。"},{"id":"BIO-B01-Ch1-B024:C","text":"先假定所有 DNA 完全相同","explanation":"錯誤：此假定排除題目要研究的可能差異。"},{"id":"BIO-B01-Ch1-B024:D","text":"把色差直接當成能量循環","explanation":"錯誤：色差不是能量循環。"}],"concept":"","example":"遺傳資訊差異可能與性狀差異相關。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B025","topicId":"","stem":"有人以「小鼠毛色有遺傳基礎」為理由，主張不必研究捕食者與背景。應如何評價？","correct":"BIO-B01-Ch1-B025:B","options":[{"id":"BIO-B01-Ch1-B025:A","text":"合理，資訊可取代所有主題","explanation":"錯誤：單一主題不能取消其他相關面向。"},{"id":"BIO-B01-Ch1-B025:B","text":"不合理，資訊與交互作用是互補的研究角度","explanation":"正確：基因影響毛色，背景與捕食影響其效果。"},{"id":"BIO-B01-Ch1-B025:C","text":"合理，環境只影響沒有 DNA 的物體","explanation":"錯誤：有DNA的生命也受環境影響。"},{"id":"BIO-B01-Ch1-B025:D","text":"不合理，因為生物沒有遺傳資訊","explanation":"錯誤：生物確有遺傳資訊。"}],"concept":"","example":"章首例子同時呈現多個主題。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B026","topicId":"","stem":"一張圖把太陽、植物、小鼠與捕食者連成能量路線，又畫一支箭頭把捕食者散出的熱接回太陽。哪項修正合理？","correct":"BIO-B01-Ch1-B026:B","options":[{"id":"BIO-B01-Ch1-B026:A","text":"保留回路，因為能量與物質都循環","explanation":"錯誤：能量不像物質循環。"},{"id":"BIO-B01-Ch1-B026:B","text":"移除熱回太陽的循環解讀，保留能量流動與散熱","explanation":"正確：熱散失不能畫成此食物能量的再生回路。"},{"id":"BIO-B01-Ch1-B026:C","text":"只刪去植物，讓小鼠直接取得陽光食物","explanation":"錯誤：題示食物關係仍需要植物。"},{"id":"BIO-B01-Ch1-B026:D","text":"把太陽改標為分解者即可","explanation":"錯誤：換名不能修正錯誤方向。"}],"concept":"","example":"能量進入系統後流動，並逐步以熱散失。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B027","topicId":"","stem":"有人以落葉可被分解回收為理由，推論食物能量也能永久回到植物供使用。缺少哪個區別？","correct":"BIO-B01-Ch1-B027:C","options":[{"id":"BIO-B01-Ch1-B027:A","text":"植物與小鼠名字不同","explanation":"錯誤：名字不解釋流程差異。"},{"id":"BIO-B01-Ch1-B027:B","text":"分解者完全不涉及物質","explanation":"錯誤：分解者正參與物質回收。"},{"id":"BIO-B01-Ch1-B027:C","text":"物質回收與能量散失是不同過程","explanation":"正確：物質能再利用不代表能量永久循環。"},{"id":"BIO-B01-Ch1-B027:D","text":"植物的外形較固定","explanation":"錯誤：外形不是推論問題。"}],"concept":"","example":"養分再被植物吸收，不等於散熱被當成原食物能量回收。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B028","topicId":"","stem":"某圖在植物、小鼠、捕食者旁都畫熱散失，學生想刪去前兩者。依本節應如何回應？","correct":"BIO-B01-Ch1-B028:D","options":[{"id":"BIO-B01-Ch1-B028:A","text":"應刪，只有捕食才產生散熱","explanation":"錯誤：散熱不只發生在末端捕食。"},{"id":"BIO-B01-Ch1-B028:B","text":"應刪，植物不使用能量","explanation":"錯誤：植物也有生命活動。"},{"id":"BIO-B01-Ch1-B028:C","text":"應刪，小鼠散熱會阻止取食","explanation":"錯誤：散熱不代表不能取食。"},{"id":"BIO-B01-Ch1-B028:D","text":"不應刪，各層級使用與轉換能量都可散熱","explanation":"正確：前兩支箭頭符合能量轉換的描述。"}],"concept":"","example":"即使是生產者，也要使用能量維持生命。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B029","topicId":"","stem":"在草地中，植物取得環境物質，小鼠吃植物，遺體由分解者處理。哪項能補上物質循環的回程？","correct":"BIO-B01-Ch1-B029:A","options":[{"id":"BIO-B01-Ch1-B029:A","text":"分解後物質返回非生物環境，再可能被植物利用","explanation":"正確：返回環境與再利用形成循環。"},{"id":"BIO-B01-Ch1-B029:B","text":"分解者把所有物質變成太陽光","explanation":"錯誤：分解不把物質全部變成陽光。"},{"id":"BIO-B01-Ch1-B029:C","text":"物質到小鼠後永久消失","explanation":"錯誤：物質能繼續轉移。"},{"id":"BIO-B01-Ch1-B029:D","text":"把物質回程改成小鼠的意願","explanation":"錯誤：意願不是物質流程。"}],"concept":"","example":"分解者連結死亡有機物與環境回收。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B030","topicId":"","stem":"一份說明稱「生產者只提供能量，不提供任何物質」。以鼠吃植物的例子判斷，何者正確？","correct":"BIO-B01-Ch1-B030:B","options":[{"id":"BIO-B01-Ch1-B030:A","text":"合理，取食只轉移熱","explanation":"錯誤：食物傳遞並非只轉移熱。"},{"id":"BIO-B01-Ch1-B030:B","text":"不合理，食物中的物質也會進入消費者","explanation":"正確：取食同時涉及能量與物質。"},{"id":"BIO-B01-Ch1-B030:C","text":"合理，物質不能跨生物轉移","explanation":"錯誤：物質可以透過食物轉移。"},{"id":"BIO-B01-Ch1-B030:D","text":"不合理，因為植物完全不提供能量","explanation":"錯誤：植物也是食物能量的來源。"}],"concept":"","example":"植物中的化學物質可成為鼠體的材料。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B031","topicId":"","stem":"甲說物質循環涉及生物與環境；乙說能量沿食物關係流動並散熱。哪項評價適當？","correct":"BIO-B01-Ch1-B031:C","options":[{"id":"BIO-B01-Ch1-B031:A","text":"只有甲正確，能量完全不散失","explanation":"錯誤：乙所述散熱亦正確。"},{"id":"BIO-B01-Ch1-B031:B","text":"只有乙正確，物質不能回環境","explanation":"錯誤：甲的物質循環也正確。"},{"id":"BIO-B01-Ch1-B031:C","text":"兩者都符合本節，且談的是不同面向","explanation":"正確：兩句分別描述物質與能量。"},{"id":"BIO-B01-Ch1-B031:D","text":"兩者都錯，應將主詞互換","explanation":"錯誤：互換反而造成混淆。"}],"concept":"","example":"看到循環或流動，先辨認主詞。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B032","topicId":"","stem":"某學生把大氣、水體與土壤中的物質排除在循環圖外，只保留動物。這樣會漏掉什麼？","correct":"BIO-B01-Ch1-B032:D","options":[{"id":"BIO-B01-Ch1-B032:A","text":"只漏掉筆記的裝飾","explanation":"錯誤：環境不是裝飾。"},{"id":"BIO-B01-Ch1-B032:B","text":"只漏掉物種英文名稱","explanation":"錯誤：不是語言缺漏。"},{"id":"BIO-B01-Ch1-B032:C","text":"不會漏掉任何科學內容","explanation":"錯誤：缺少循環的重要環節。"},{"id":"BIO-B01-Ch1-B032:D","text":"物質與非生物環境交換的部分","explanation":"正確：物質可在生物與環境間往返。"}],"concept":"","example":"物質循環不能只看單一動物體內。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B033","topicId":"","stem":"把「落葉→分解者」從循環圖刪去，只留下「動物遺體→分解者」，最直接造成哪種不完整？","correct":"BIO-B01-Ch1-B033:A","options":[{"id":"BIO-B01-Ch1-B033:A","text":"漏掉生產者物質也可進入分解途徑","explanation":"正確：分解物質不僅來自動物。"},{"id":"BIO-B01-Ch1-B033:B","text":"誤把太陽畫得太小","explanation":"錯誤：問題不在圖示尺寸。"},{"id":"BIO-B01-Ch1-B033:C","text":"使所有消費者變成生產者","explanation":"錯誤：刪箭頭不改生物角色。"},{"id":"BIO-B01-Ch1-B033:D","text":"證明植物不會成為物質來源","explanation":"錯誤：資料缺漏不能證明植物不供物質。"}],"concept":"","example":"落葉和植物遺體也能由分解者處理。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B034","topicId":"","stem":"一條能量路線寫成「植物→小鼠→捕食者」。若題目限定此草地主要依賴陽光，還應補哪個起點？","correct":"BIO-B01-Ch1-B034:B","options":[{"id":"BIO-B01-Ch1-B034:A","text":"捕食者散出的熱回到植物","explanation":"錯誤：這是錯誤的能量回路。"},{"id":"BIO-B01-Ch1-B034:B","text":"太陽能進入植物","explanation":"正確：補上光合生產者的主要能量來源。"},{"id":"BIO-B01-Ch1-B034:C","text":"小鼠自行創造能量","explanation":"錯誤：小鼠不自行創造能量。"},{"id":"BIO-B01-Ch1-B034:D","text":"物質循環取代所有能量輸入","explanation":"錯誤：物質再利用不取消能量需求。"}],"concept":"","example":"能量路線有外來輸入，也有熱散失。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B035","topicId":"","stem":"若一個系統有物質回收，能否只憑這點斷定它不需要能量供應？","correct":"BIO-B01-Ch1-B035:C","options":[{"id":"BIO-B01-Ch1-B035:A","text":"可以，回收等同創造所有能量","explanation":"錯誤：回收不創造能量。"},{"id":"BIO-B01-Ch1-B035:B","text":"可以，物質循環會阻止所有熱散失","explanation":"錯誤：回收不取消散熱。"},{"id":"BIO-B01-Ch1-B035:C","text":"不可以，物質回收與能量供應須分開判斷","explanation":"正確：兩者是不同需求與路徑。"},{"id":"BIO-B01-Ch1-B035:D","text":"不可以，因為物質不能被回收","explanation":"錯誤：物質可以回收，問題在推論。"}],"concept":"","example":"一個物質可再次利用，生命活動仍要能量。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B036","topicId":"","stem":"在題示食物路線中，小鼠從植物取得食物。哪個解讀同時保留能量與物質兩面向？","correct":"BIO-B01-Ch1-B036:D","options":[{"id":"BIO-B01-Ch1-B036:A","text":"只得到物質，沒有能量","explanation":"錯誤：食物也供能。"},{"id":"BIO-B01-Ch1-B036:B","text":"只得到能量，沒有材料","explanation":"錯誤：食物也供物質。"},{"id":"BIO-B01-Ch1-B036:C","text":"直接從植物得到太陽本身","explanation":"錯誤：太陽不是被搬入鼠體。"},{"id":"BIO-B01-Ch1-B036:D","text":"取得化學能，也取得可供生命使用的物質","explanation":"正確：食物包含能量與物質兩面向。"}],"concept":"","example":"食物可支持活動，也提供構成身體的材料。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B037","topicId":"","stem":"某人說「只要有熱散失，物質就一定不可能循環」。如何判斷？","correct":"BIO-B01-Ch1-B037:A","options":[{"id":"BIO-B01-Ch1-B037:A","text":"不成立，能量散熱不排除物質回收","explanation":"正確：能量流動與物質循環可以同時發生。"},{"id":"BIO-B01-Ch1-B037:B","text":"成立，能量與物質必須有完全相同路線","explanation":"錯誤：兩者路徑不必相同。"},{"id":"BIO-B01-Ch1-B037:C","text":"成立，熱會使所有物質消滅","explanation":"錯誤：散熱不等於物質全部消滅。"},{"id":"BIO-B01-Ch1-B037:D","text":"不成立，因為生命完全不散熱","explanation":"錯誤：生命活動可散熱。"}],"concept":"","example":"同一草地可同時有散熱和養分回收。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B038","topicId":"","stem":"若要在一張圖中避免把能量與物質混淆，哪組標示較適當？","correct":"BIO-B01-Ch1-B038:B","options":[{"id":"BIO-B01-Ch1-B038:A","text":"兩者都標永久循環","explanation":"錯誤：能量不永久循環。"},{"id":"BIO-B01-Ch1-B038:B","text":"能量標輸入與散熱，物質標交換與回收","explanation":"正確：不同標示保留兩種流程的差別。"},{"id":"BIO-B01-Ch1-B038:C","text":"能量標分解成土壤，物質標完全消失","explanation":"錯誤：混淆形式與去向。"},{"id":"BIO-B01-Ch1-B038:D","text":"只留同一個循環箭頭且不註明主詞","explanation":"錯誤：不標主詞易誤讀兩者。"}],"concept":"","example":"同一食物關係中，箭頭可能追蹤不同對象。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B039","topicId":"","stem":"某圖將植物產生的落葉連向分解者，再連向土壤。這組箭頭最適合追蹤什麼？","correct":"BIO-B01-Ch1-B039:C","options":[{"id":"BIO-B01-Ch1-B039:A","text":"小鼠主動改色的意願","explanation":"錯誤：不涉及個體意願。"},{"id":"BIO-B01-Ch1-B039:B","text":"家族中的基因傳遞機率","explanation":"錯誤：不涉及遺傳傳遞。"},{"id":"BIO-B01-Ch1-B039:C","text":"物質由生物部分回到環境的路徑","explanation":"正確：落葉物質經分解回環境。"},{"id":"BIO-B01-Ch1-B039:D","text":"能量回到太陽形成閉環","explanation":"錯誤：此路徑不是能量閉環。"}],"concept":"","example":"解讀箭頭前需辨認圖在追蹤哪一種量。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B040","topicId":"","stem":"一個說明把「熱散失」寫成「只有捕食者死亡後才開始」。應如何修正？","correct":"BIO-B01-Ch1-B040:D","options":[{"id":"BIO-B01-Ch1-B040:A","text":"熱只在物質循環停止後出現","explanation":"錯誤：散熱不以停止物質循環為前提。"},{"id":"BIO-B01-Ch1-B040:B","text":"植物沒有任何能量轉換","explanation":"錯誤：植物會進行能量轉換。"},{"id":"BIO-B01-Ch1-B040:C","text":"小鼠只有繁殖時才涉及能量","explanation":"錯誤：小鼠除繁殖外也需要能量。"},{"id":"BIO-B01-Ch1-B040:D","text":"生命活動中的能量使用與轉換就可伴隨散熱","explanation":"正確：散熱不限死亡後或單一活動。"}],"concept":"","example":"生產者及消費者維持生命都涉及能量。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B041","topicId":"","stem":"環境中的物質可進植物，再由植物進入鼠體。若有些物質日後回環境並再被利用，該資料支持哪句？","correct":"BIO-B01-Ch1-B041:A","options":[{"id":"BIO-B01-Ch1-B041:A","text":"物質能在生物與環境間循環","explanation":"正確：資料直接描寫往返與再利用。"},{"id":"BIO-B01-Ch1-B041:B","text":"能量一定以相同方式永久循環","explanation":"錯誤：不能把物質資料外推為能量永循環。"},{"id":"BIO-B01-Ch1-B041:C","text":"所有物質到鼠體就固定不動","explanation":"錯誤：與題幹回環境相反。"},{"id":"BIO-B01-Ch1-B041:D","text":"植物與環境沒有交換","explanation":"錯誤：與題幹進入植物相反。"}],"concept":"","example":"同一物質的去向與能量的去向要分別追蹤。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B042","topicId":"","stem":"研究者想檢查草地示意圖是否完整表現能量流動，哪項值得核對？","correct":"BIO-B01-Ch1-B042:B","options":[{"id":"BIO-B01-Ch1-B042:A","text":"圖中是否每個生物都畫成相同顏色","explanation":"錯誤：顏色一致不是能流條件。"},{"id":"BIO-B01-Ch1-B042:B","text":"是否有能量進入及各層級熱散失的方向","explanation":"正確：輸入、傳遞與散熱是重要關係。"},{"id":"BIO-B01-Ch1-B042:C","text":"是否把所有箭頭都接成閉環","explanation":"錯誤：閉環可能誤導能量循環。"},{"id":"BIO-B01-Ch1-B042:D","text":"是否把分解者標成太陽","explanation":"錯誤：分解者與太陽角色不同。"}],"concept":"","example":"圖示方向應對應它宣稱呈現的流程。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B043","topicId":"","stem":"兩位學生分別說「鼠吃植物會轉移物質」及「鼠吃植物涉及能量取得」。兩句可否同時成立？","correct":"BIO-B01-Ch1-B043:C","options":[{"id":"BIO-B01-Ch1-B043:A","text":"不可，能量與物質互斥","explanation":"錯誤：兩面向不互斥。"},{"id":"BIO-B01-Ch1-B043:B","text":"不可，取食完全不含物質","explanation":"錯誤：食物包含物質。"},{"id":"BIO-B01-Ch1-B043:C","text":"可以，同一取食行為具有兩個面向","explanation":"正確：能量與材料都可經食物轉移。"},{"id":"BIO-B01-Ch1-B043:D","text":"可以，但必須假設小鼠不散熱","explanation":"錯誤：成立不需取消散熱。"}],"concept":"","example":"同一事件可以按不同追蹤對象解釋。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B044","topicId":"","stem":"若某教材句子寫「物質可循環，因此能量與物質在系統中完全等同」，主要問題為何？","correct":"BIO-B01-Ch1-B044:D","options":[{"id":"BIO-B01-Ch1-B044:A","text":"沒有列出所有植物名稱","explanation":"錯誤：名稱清單不是核心缺口。"},{"id":"BIO-B01-Ch1-B044:B","text":"使用了循環這個詞","explanation":"錯誤：物質可循環本身正確。"},{"id":"BIO-B01-Ch1-B044:C","text":"把小鼠視為消費者","explanation":"錯誤：鼠取食植物屬消費者合理。"},{"id":"BIO-B01-Ch1-B044:D","text":"由共同參與生命活動誤推兩者流向完全相同","explanation":"正確：兩者的流動與回收特性不同。"}],"concept":"","example":"物質回收與能量散熱不能互相代稱。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B045","topicId":"","stem":"植物、小鼠和分解者的物質交流都被畫出，但全部熱散失箭頭被省略。若圖自稱同時完整呈現能量流，應補什麼？","correct":"BIO-B01-Ch1-B045:A","options":[{"id":"BIO-B01-Ch1-B045:A","text":"能量轉換時散至周圍的熱","explanation":"正確：能量流還應交代散熱去向。"},{"id":"BIO-B01-Ch1-B045:B","text":"每種物質轉回原本太陽的箭頭","explanation":"錯誤：物質不循環回太陽成此食物路線。"},{"id":"BIO-B01-Ch1-B045:C","text":"小鼠想要新性狀的箭頭","explanation":"錯誤：意願不屬能量流。"},{"id":"BIO-B01-Ch1-B045:D","text":"只補更多物種名字","explanation":"錯誤：名字不能替代流向。"}],"concept":"","example":"不同種類箭頭各自承擔不同資訊。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第6張；正文5/10","shuffle":true},{"id":"BIO-B01-Ch1-B046","topicId":"","stem":"一隻深色鼠從深土背景移到白沙背景，毛色暫未改變。只考慮背景匹配，其被發現風險可能如何？","correct":"BIO-B01-Ch1-B046:B","options":[{"id":"BIO-B01-Ch1-B046:A","text":"一定降為零","explanation":"錯誤：不能保證零風險。"},{"id":"BIO-B01-Ch1-B046:B","text":"因與背景反差增大而提高","explanation":"正確：背景改變可使原毛色更顯眼。"},{"id":"BIO-B01-Ch1-B046:C","text":"因毛色未變而必定完全不變","explanation":"錯誤：風險也取決於背景。"},{"id":"BIO-B01-Ch1-B046:D","text":"立即使族群全部變淡","explanation":"錯誤：個體移動不是整群即時遺傳變化。"}],"concept":"","example":"同一性狀在不同環境可有不同效果。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B047","topicId":"","stem":"兩隻鼠毛色不同，一隻在白沙、一隻在深土都很隱蔽。哪個結論較合理？","correct":"BIO-B01-Ch1-B047:C","options":[{"id":"BIO-B01-Ch1-B047:A","text":"只有淡色毛能隱蔽","explanation":"錯誤：深色在深土也可隱蔽。"},{"id":"BIO-B01-Ch1-B047:B","text":"只有深色毛能隱蔽","explanation":"錯誤：淡色在白沙也可隱蔽。"},{"id":"BIO-B01-Ch1-B047:C","text":"毛色與各自背景匹配都可能降低被發現風險","explanation":"正確：兩種情境都符合背景匹配。"},{"id":"BIO-B01-Ch1-B047:D","text":"背景完全不影響隱蔽","explanation":"錯誤：背景正是關鍵條件。"}],"concept":"","example":"適合環境不是只認某一固定顏色。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B048","topicId":"","stem":"有人只看小鼠本身，便說「不需研究牠吃什麼或被誰吃」。依系統觀點應如何回應？","correct":"BIO-B01-Ch1-B048:D","options":[{"id":"BIO-B01-Ch1-B048:A","text":"合理，生物皆完全獨立","explanation":"錯誤：生物不完全孤立。"},{"id":"BIO-B01-Ch1-B048:B","text":"合理，取食不影響生命活動","explanation":"錯誤：取食涉及資源取得。"},{"id":"BIO-B01-Ch1-B048:C","text":"不合理，因為小鼠沒有個體層級","explanation":"錯誤：小鼠仍是個體，問題在忽略關係。"},{"id":"BIO-B01-Ch1-B048:D","text":"不合理，取食與捕食關係都是系統中的重要互動","explanation":"正確：完整理解可需要生物間關係。"}],"concept":"","example":"研究個體時仍可考慮它與周圍的連結。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B049","topicId":"","stem":"同一段敘述既寫小鼠吃植物，也寫白沙影響毛色的隱蔽效果。應如何分類這兩種關係？","correct":"BIO-B01-Ch1-B049:A","options":[{"id":"BIO-B01-Ch1-B049:A","text":"前者是生物間，後者涉及非生物環境；都可放入交互作用","explanation":"正確：交互作用涵蓋兩種關係。"},{"id":"BIO-B01-Ch1-B049:B","text":"只有前者算交互作用，環境永不算","explanation":"錯誤：環境也在互動範圍中。"},{"id":"BIO-B01-Ch1-B049:C","text":"只有後者算交互作用，取食永不算","explanation":"錯誤：取食是生物間互動。"},{"id":"BIO-B01-Ch1-B049:D","text":"兩者都只代表個體主動演化","explanation":"錯誤：兩者不等於主動演化。"}],"concept":"","example":"互動不只限定於同一物種或全是生物的配對。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B050","topicId":"","stem":"一段說明將「深色鼠在深土較隱蔽」改成「深色鼠在所有環境都較隱蔽」。這樣改寫有何問題？","correct":"BIO-B01-Ch1-B050:B","options":[{"id":"BIO-B01-Ch1-B050:A","text":"沒有改用英文","explanation":"錯誤：問題不在語言。"},{"id":"BIO-B01-Ch1-B050:B","text":"刪掉了決定效果的環境條件","explanation":"正確：深土條件不能擴大成所有環境。"},{"id":"BIO-B01-Ch1-B050:C","text":"只要主題相同，改寫就一定等價","explanation":"錯誤：條件被擴張使意思不同。"},{"id":"BIO-B01-Ch1-B050:D","text":"應再加上永遠不被捕食才正確","explanation":"錯誤：隱蔽不等於永遠零風險。"}],"concept":"","example":"有利性狀要在具體環境中判斷。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、9 頁（PDF 51、58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B051","topicId":"","stem":"某族群原有深、淡兩種可遺傳毛色，深色鼠在深土上較不易被捕食且留下較多後代。跨多代後合理的可能結果是哪項？","correct":"BIO-B01-Ch1-B051:B","options":[{"id":"BIO-B01-Ch1-B051:A","text":"每隻淡色成鼠都依意願變深","explanation":"錯誤：族群變化不要求個體主動變色。"},{"id":"BIO-B01-Ch1-B051:B","text":"深色相關性狀在族群中的比例提高","explanation":"正確：有利可遺傳差異可因繁殖成功而增多。"},{"id":"BIO-B01-Ch1-B051:C","text":"所有變異立即消失","explanation":"錯誤：天擇不保證立即消除所有變異。"},{"id":"BIO-B01-Ch1-B051:D","text":"深土直接把每段 DNA 變成相同序列","explanation":"錯誤：環境不是按需求重寫所有DNA。"}],"concept":"","example":"比較的是後代族群的比例，不是原鼠是否全變色。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B052","topicId":"","stem":"一隻鼠因沾上白粉而短暫較不顯眼，且此白粉效果不遺傳。僅憑這件事能否證明族群演化？","correct":"BIO-B01-Ch1-B052:C","options":[{"id":"BIO-B01-Ch1-B052:A","text":"能，任何外觀改變都是演化","explanation":"錯誤：個體外觀改變不一定可遺傳。"},{"id":"BIO-B01-Ch1-B052:B","text":"能，只要較不顯眼就代表遺傳改變","explanation":"錯誤：有利效果不等於遺傳基礎。"},{"id":"BIO-B01-Ch1-B052:C","text":"不能，尚未呈現族群可遺傳特徵的世代改變","explanation":"正確：資料缺少跨世代族群的遺傳變化。"},{"id":"BIO-B01-Ch1-B052:D","text":"不能，因為環境永不影響捕食風險","explanation":"錯誤：背景仍可影響捕食。"}],"concept":"","example":"非遺傳的短時變化與族群演化需區分。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B053","topicId":"","stem":"一種可遺傳毛色在此環境不影響生存，也不影響留下後代的數量。只依本節天擇條件，能否保證它因天擇增加？","correct":"BIO-B01-Ch1-B053:D","options":[{"id":"BIO-B01-Ch1-B053:A","text":"能，可遺傳就必定增加","explanation":"錯誤：可遺傳只是條件之一。"},{"id":"BIO-B01-Ch1-B053:B","text":"能，所有變異都同時變有利","explanation":"錯誤：變異不必都具有相同優勢。"},{"id":"BIO-B01-Ch1-B053:C","text":"能，只要有捕食者就必定增加","explanation":"錯誤：存在捕食者不保證該性狀有優勢。"},{"id":"BIO-B01-Ch1-B053:D","text":"不能，題目沒有提供與該差異相關的成功差別","explanation":"正確：天擇解釋須有差異生存或繁殖成功。"}],"concept":"","example":"本題只判斷是否具備天擇依據，不推論其他演化機制。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B054","topicId":"","stem":"甲說自然選擇會使較適合環境的個體較可能留下後代；乙說自然選擇讓個體因願望選擇自己的基因。何者合理？","correct":"BIO-B01-Ch1-B054:A","options":[{"id":"BIO-B01-Ch1-B054:A","text":"甲合理，乙把天擇誤作個體意志","explanation":"正確：差異繁殖成功與意志改基因不同。"},{"id":"BIO-B01-Ch1-B054:B","text":"乙合理，甲不涉及演化","explanation":"錯誤：甲符合天擇基本方向。"},{"id":"BIO-B01-Ch1-B054:C","text":"兩者都合理且等價","explanation":"錯誤：乙的因果方向不成立。"},{"id":"BIO-B01-Ch1-B054:D","text":"兩者都錯，天擇不涉及後代","explanation":"錯誤：留下後代正是重要條件。"}],"concept":"","example":"有利的可遺傳差異可影響誰留下較多後代。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B055","topicId":"","stem":"深色毛在深土有利，但環境改為白沙。只考慮隱蔽與捕食，哪種判斷較審慎？","correct":"BIO-B01-Ch1-B055:B","options":[{"id":"BIO-B01-Ch1-B055:A","text":"深色的優勢必然永久不變","explanation":"錯誤：有利性取決於環境。"},{"id":"BIO-B01-Ch1-B055:B","text":"性狀的有利程度可能隨背景改變","explanation":"正確：背景改變可能改變顯眼程度與選擇效果。"},{"id":"BIO-B01-Ch1-B055:C","text":"所有鼠當天必定變淡","explanation":"錯誤：環境改變不等於個體即時遺傳改變。"},{"id":"BIO-B01-Ch1-B055:D","text":"所有天擇立刻永久停止","explanation":"錯誤：沒有永久停止的依據。"}],"concept":"","example":"毛色需要連同當地條件一起判斷。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B056","topicId":"","stem":"一份報告記錄可遺傳淡毛在第一代占20/50、後來一代占30/50。只就比例而言，哪項正確？","correct":"BIO-B01-Ch1-B056:C","options":[{"id":"BIO-B01-Ch1-B056:A","text":"比例由40%降到30%","explanation":"錯誤：30/50等於60%，不是30%。"},{"id":"BIO-B01-Ch1-B056:B","text":"比例保持完全不變","explanation":"錯誤：20/50和30/50不相等。"},{"id":"BIO-B01-Ch1-B056:C","text":"比例由40%升到60%，增加20個百分點","explanation":"正確：20÷50=40%，30÷50=60%，相差20個百分點。"},{"id":"BIO-B01-Ch1-B056:D","text":"每隻第一代小鼠都變淡了","explanation":"錯誤：比例資料不代表原個體全部改色。"}],"concept":"","example":"此題只算已知可遺傳性狀比例，不單憑數字判定改變機制。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B057","topicId":"","stem":"若後代族群中的深色毛比例增加，但原先的每隻成鼠都維持原毛色，兩件事是否矛盾？","correct":"BIO-B01-Ch1-B057:D","options":[{"id":"BIO-B01-Ch1-B057:A","text":"矛盾，演化必須讓每隻成鼠變色","explanation":"錯誤：演化不要求原成鼠逐隻改色。"},{"id":"BIO-B01-Ch1-B057:B","text":"矛盾，毛色比例不能跨世代改變","explanation":"錯誤：比例可跨世代改變。"},{"id":"BIO-B01-Ch1-B057:C","text":"矛盾，只有個體變色才有天擇","explanation":"錯誤：天擇關乎可遺傳差異與成功差異。"},{"id":"BIO-B01-Ch1-B057:D","text":"不矛盾，族群比例可因不同個體留下後代而改變","explanation":"正確：個體毛色不變與族群組成改變可並存。"}],"concept":"","example":"族群統計與個體生命史是不同層面的資料。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B058","topicId":"","stem":"若要檢查「有利可遺傳毛色因天擇而增多」的說明，哪個因素不能只用個體壽命長短代替？","correct":"BIO-B01-Ch1-B058:A","options":[{"id":"BIO-B01-Ch1-B058:A","text":"是否留下後代及其相對繁殖成功","explanation":"正確：演化的世代效應涉及後代貢獻，不僅存活時間。"},{"id":"BIO-B01-Ch1-B058:B","text":"筆記是否用紅色墨水","explanation":"錯誤：墨色不構成天擇條件。"},{"id":"BIO-B01-Ch1-B058:C","text":"研究圖的邊框大小","explanation":"錯誤：邊框不決定生物結果。"},{"id":"BIO-B01-Ch1-B058:D","text":"小鼠名字有幾個字","explanation":"錯誤：名字長度與繁殖成功無關。"}],"concept":"","example":"活得較久但沒有較多後代，不足保證性狀跨代增多。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B059","topicId":"","stem":"一隻淡色鼠雖較難被發現，卻沒有留下任何後代。僅此個案能否保證淡色在後代族群增加？","correct":"BIO-B01-Ch1-B059:B","options":[{"id":"BIO-B01-Ch1-B059:A","text":"能，隱蔽會自動改變所有後代","explanation":"錯誤：隱蔽不直接改寫後代群體。"},{"id":"BIO-B01-Ch1-B059:B","text":"不能，單一存活優勢不保證跨代後代貢獻","explanation":"正確：還要看可遺傳性與相對繁殖結果。"},{"id":"BIO-B01-Ch1-B059:C","text":"能，只要毛色好看就足夠","explanation":"錯誤：審美不是天擇依據。"},{"id":"BIO-B01-Ch1-B059:D","text":"不能，因為毛色從不可能遺傳","explanation":"錯誤：本節已有可遺傳毛色例子。"}],"concept":"","example":"天擇的族群效應不能只由一隻鼠是否被看見判定。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B060","topicId":"","stem":"觀察到同種小鼠在不同棲地具有不同毛色，何種解釋最符合本節的天擇入口？","correct":"BIO-B01-Ch1-B060:C","options":[{"id":"BIO-B01-Ch1-B060:A","text":"不同背景讓鼠依意願選顏色","explanation":"錯誤：不是個體意志製造性狀。"},{"id":"BIO-B01-Ch1-B060:B","text":"每個棲地必定只有一種且永不變的毛色","explanation":"錯誤：沒有全群單色永不變的保證。"},{"id":"BIO-B01-Ch1-B060:C","text":"可遺傳毛色在不同背景下具有不同生存或繁殖效果","explanation":"正確：環境影響變異的相對有利性。"},{"id":"BIO-B01-Ch1-B060:D","text":"小鼠毛色差異代表沒有遺傳資訊","explanation":"錯誤：毛色差異可以有遺傳基礎。"}],"concept":"","example":"深土與白沙可使不同毛色較有隱蔽優勢。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B061","topicId":"","stem":"有人把「有利性狀個體較可能留下較多後代」縮成「有利性狀每次必定傳給所有後代」。哪項判斷正確？","correct":"BIO-B01-Ch1-B061:D","options":[{"id":"BIO-B01-Ch1-B061:A","text":"兩句完全等價","explanation":"錯誤：後一句多了每次、所有、必定。"},{"id":"BIO-B01-Ch1-B061:B","text":"第二句只是較簡短且更精確","explanation":"錯誤：簡短不代表科學等價。"},{"id":"BIO-B01-Ch1-B061:C","text":"第二句是自然選擇的定義","explanation":"錯誤：天擇並非性狀每次必傳所有後代。"},{"id":"BIO-B01-Ch1-B061:D","text":"第二句混淆差異繁殖成功與性狀必然傳遞","explanation":"正確：後代貢獻與個別遺傳傳遞不能混同。"}],"concept":"","example":"本節以較多後代說明族群比例可能改變。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B062","topicId":"","stem":"兩群生物共享許多基本機制，卻有不同外觀。這是否必然否定共同祖先的解釋？","correct":"BIO-B01-Ch1-B062:A","options":[{"id":"BIO-B01-Ch1-B062:A","text":"否，共同性與後續累積差異可以並存","explanation":"正確：演化同時解釋統一性與多樣性。"},{"id":"BIO-B01-Ch1-B062:B","text":"是，共同祖先要求今日外形完全一樣","explanation":"錯誤：共有祖先不要求後代完全不變。"},{"id":"BIO-B01-Ch1-B062:C","text":"是，任何差異都表示沒有共同性","explanation":"錯誤：差異不排除共同特徵。"},{"id":"BIO-B01-Ch1-B062:D","text":"否，因為所有生物只生活在同一環境","explanation":"錯誤：不同生物可處於不同環境。"}],"concept":"","example":"共享基本架構並不代表全部細節相同。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B063","topicId":"","stem":"某性狀在一個環境提高後代貢獻，在另一環境卻未顯示優勢。應如何表達它的有利性？","correct":"BIO-B01-Ch1-B063:B","options":[{"id":"BIO-B01-Ch1-B063:A","text":"它必定在宇宙所有環境都有利","explanation":"錯誤：局部結果不可外推所有環境。"},{"id":"BIO-B01-Ch1-B063:B","text":"有利性應連結具體環境與繁殖結果","explanation":"正確：有利性是情境相關的比較。"},{"id":"BIO-B01-Ch1-B063:C","text":"只要可遺傳便永遠有利","explanation":"錯誤：可遺傳不保證環境優勢。"},{"id":"BIO-B01-Ch1-B063:D","text":"沒有處處有利就不可能參與天擇","explanation":"錯誤：天擇本就依環境而異。"}],"concept":"","example":"毛色與背景匹配的例子說明此原則。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B064","topicId":"","stem":"研究者只拍到一隻鼠的毛色，便宣布已證明此族群跨世代演化。最直接欠缺哪類資料？","correct":"BIO-B01-Ch1-B064:C","options":[{"id":"BIO-B01-Ch1-B064:A","text":"鼠的名字與照片尺寸","explanation":"錯誤：名字與尺寸不補世代證據。"},{"id":"BIO-B01-Ch1-B064:B","text":"研究者喜歡哪種顏色","explanation":"錯誤：喜好不是族群資料。"},{"id":"BIO-B01-Ch1-B064:C","text":"不同世代族群可遺傳特徵的比較","explanation":"正確：單隻個體的當下影像不足以呈現跨代遺傳變化。"},{"id":"BIO-B01-Ch1-B064:D","text":"更鮮豔的照片邊框","explanation":"錯誤：邊框不提供科學比較。"}],"concept":"","example":"演化判斷需要合適的層級與時間尺度。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B065","topicId":"","stem":"一個小鼠族群原有可遺傳毛色差異。若特定背景使一色個體較常留下後代，天擇作用的直接對象與結果應如何區分？","correct":"BIO-B01-Ch1-B065:D","options":[{"id":"BIO-B01-Ch1-B065:A","text":"作用於個體意志；結果是立刻改寫所有基因","explanation":"錯誤：意志不是天擇的因果來源。"},{"id":"BIO-B01-Ch1-B065:B","text":"作用於太陽；結果是物質循環","explanation":"錯誤：這與題示遺傳和繁殖條件無關。"},{"id":"BIO-B01-Ch1-B065:C","text":"作用於整本教材；結果是章數增加","explanation":"錯誤：教材不是被研究的生物層級。"},{"id":"BIO-B01-Ch1-B065:D","text":"個體差異受到選擇；族群性狀比例可跨代改變","explanation":"正確：個體受到選擇，族群呈現世代變化。"}],"concept":"","example":"要區分誰留下後代，與整群比例如何變化。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B066","topicId":"","stem":"某鼠遇到天敵後立刻躲進草叢。單憑這次行為，哪句最審慎？","correct":"BIO-B01-Ch1-B066:A","options":[{"id":"BIO-B01-Ch1-B066:A","text":"這是個體當下行為，不能直接當作族群遺傳演化證據","explanation":"正確：短時行為不等同跨代遺傳組成改變。"},{"id":"BIO-B01-Ch1-B066:B","text":"已證明全族群毛色基因改變","explanation":"錯誤：沒有全族群遺傳資料。"},{"id":"BIO-B01-Ch1-B066:C","text":"已證明所有後代都更淺色","explanation":"錯誤：沒有後代毛色資料。"},{"id":"BIO-B01-Ch1-B066:D","text":"演化一定在這幾秒內完成","explanation":"錯誤：題目不是世代尺度。"}],"concept":"","example":"個體反應與族群演化應分開判斷。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B067","topicId":"","stem":"在同一背景下，兩種毛色的鼠都有可遺傳差異，但後代貢獻完全相同。哪句較合理？","correct":"BIO-B01-Ch1-B067:B","options":[{"id":"BIO-B01-Ch1-B067:A","text":"只要兩色不同就能保證其中一色因天擇增加","explanation":"錯誤：缺乏差異繁殖成功。"},{"id":"BIO-B01-Ch1-B067:B","text":"目前條件不支持其中一色具有此項天擇優勢","explanation":"正確：不能僅由變異推出特定天擇方向。"},{"id":"BIO-B01-Ch1-B067:C","text":"後代相同表示 DNA 不存在","explanation":"錯誤：繁殖結果不否定資訊。"},{"id":"BIO-B01-Ch1-B067:D","text":"所有演化都因此永久不可能","explanation":"錯誤：只評本題條件，不可擴張所有演化。"}],"concept":"","example":"不把天擇的一組條件宣稱成一切演化的唯一機制。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B068","topicId":"","stem":"若甲族群在深土、乙族群在白沙，各自較隱蔽的可遺傳毛色留下較多後代，哪個長期結果可能出現？","correct":"BIO-B01-Ch1-B068:C","options":[{"id":"BIO-B01-Ch1-B068:A","text":"兩群必定每代保持完全同色","explanation":"錯誤：環境不同可形成不同有利方向。"},{"id":"BIO-B01-Ch1-B068:B","text":"兩群所有個體都靠意願變色","explanation":"錯誤：不是個體意志的結果。"},{"id":"BIO-B01-Ch1-B068:C","text":"兩群毛色比例可能因不同環境而累積差異","explanation":"正確：天擇可在不同環境形成不同族群組成。"},{"id":"BIO-B01-Ch1-B068:D","text":"遺傳資訊不再影響兩群性狀","explanation":"錯誤：可遺傳性仍是條件。"}],"concept":"","example":"族群差異可以與當地環境及繁殖效果相連。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B069","topicId":"","stem":"一個深色毛比例變高的報告沒有提供毛色是否可遺傳，也沒有繁殖資料。能直接斷言完整驗證天擇因果嗎？","correct":"BIO-B01-Ch1-B069:D","options":[{"id":"BIO-B01-Ch1-B069:A","text":"能，任何顏色比例都只能由天擇造成","explanation":"錯誤：不能用比例排除所有其他可能。"},{"id":"BIO-B01-Ch1-B069:B","text":"能，只要有比例就是因果","explanation":"錯誤：描述比例不等於證明機制。"},{"id":"BIO-B01-Ch1-B069:C","text":"能，其他資料毫無用途","explanation":"錯誤：關鍵條件資料有用途。"},{"id":"BIO-B01-Ch1-B069:D","text":"不能，仍需核對可遺傳性與成功差異等條件","explanation":"正確：本節天擇解釋需相關前提與證據。"}],"concept":"","example":"結果描述與形成該結果的因果解釋需區分。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B070","topicId":"","stem":"已知毛色可遺傳且影響繁殖成功。若經多代後毛色比例改變，為何不宜寫成「每個體在一生中演化」？","correct":"BIO-B01-Ch1-B070:A","options":[{"id":"BIO-B01-Ch1-B070:A","text":"資料描述的是族群跨代組成，不能改寫成個體一生的變化","explanation":"正確：主詞與時間尺度不能偷換。"},{"id":"BIO-B01-Ch1-B070:B","text":"只要使用個體一詞就完全不能談天擇","explanation":"錯誤：天擇可談個體差異。"},{"id":"BIO-B01-Ch1-B070:C","text":"因為毛色從不影響生存","explanation":"錯誤：毛色可影響隱蔽與生存。"},{"id":"BIO-B01-Ch1-B070:D","text":"因為跨代資料與演化永遠無關","explanation":"錯誤：跨代遺傳組成正是演化尺度。"}],"concept":"","example":"個體被選擇與族群演化可同時正確。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B071","topicId":"","stem":"兩份文字分別說「族群保留共同祖先的特徵」與「族群隨時間累積差異」。哪項整理較合理？","correct":"BIO-B01-Ch1-B071:B","options":[{"id":"BIO-B01-Ch1-B071:A","text":"兩句相互排斥，必須刪一個","explanation":"錯誤：兩面向可以並存。"},{"id":"BIO-B01-Ch1-B071:B","text":"前者連結統一性，後者連結多樣性","explanation":"正確：演化可同時解釋共同與不同。"},{"id":"BIO-B01-Ch1-B071:C","text":"前者證明所有生物外形相同","explanation":"錯誤：共享特徵不等於外形全同。"},{"id":"BIO-B01-Ch1-B071:D","text":"後者證明生命沒有任何共同機制","explanation":"錯誤：累積差異不排除共同機制。"}],"concept":"","example":"共同來源與後續改變是互補的理解。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B072","topicId":"","stem":"某可遺傳性狀的比例由10/40變成20/40。下列對此比例變化的計算與解讀何者正確？","correct":"BIO-B01-Ch1-B072:C","options":[{"id":"BIO-B01-Ch1-B072:A","text":"由10%到20%，提高10個百分點","explanation":"錯誤：分母是40，不能直接把分子當百分比。"},{"id":"BIO-B01-Ch1-B072:B","text":"由25%到50%，提高25倍","explanation":"錯誤：提高25個百分點不是提高25倍。"},{"id":"BIO-B01-Ch1-B072:C","text":"由25%到50%，提高25個百分點","explanation":"正確：10÷40=25%，20÷40=50%，差為25個百分點。"},{"id":"BIO-B01-Ch1-B072:D","text":"每一個原有個體都必然改變性狀","explanation":"錯誤：族群比例不能推出每個體都變化。"}],"concept":"","example":"比例計算描述結果，本身不獨立證明天擇機制。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B073","topicId":"","stem":"學生說「環境需要淡毛，所以一定先製造淡毛基因，再讓每隻鼠使用」。應如何修正？","correct":"BIO-B01-Ch1-B073:D","options":[{"id":"BIO-B01-Ch1-B073:A","text":"只把淡毛改成深毛，因果就正確","explanation":"錯誤：換顏色不修正目的式因果。"},{"id":"BIO-B01-Ch1-B073:B","text":"只改成環境想要，意思就合理","explanation":"錯誤：把環境擬人化仍不合理。"},{"id":"BIO-B01-Ch1-B073:C","text":"把所有基因改成所有細胞即可","explanation":"錯誤：換層級名詞不能補正天擇。"},{"id":"BIO-B01-Ch1-B073:D","text":"先考慮既有可遺傳變異，再看環境下的差異成功","explanation":"正確：天擇不是按需求製造指定變異。"}],"concept":"","example":"環境影響哪些變異較有利，而非生物憑需要主動選基因。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B074","topicId":"","stem":"在毛色天擇的時間線上，哪項連接最符合因果順序？","correct":"BIO-B01-Ch1-B074:A","options":[{"id":"BIO-B01-Ch1-B074:A","text":"可遺傳差異→不同生存或繁殖成功→跨代性狀比例改變","explanation":"正確：保留變異、成功差異與族群結果。"},{"id":"BIO-B01-Ch1-B074:B","text":"個體願望→所有 DNA 立即相同→所有後代同色","explanation":"錯誤：意願不支配遺傳改寫。"},{"id":"BIO-B01-Ch1-B074:C","text":"散熱→毛色基因被創造→物質永久消失","explanation":"錯誤：混淆能量、資訊與物質。"},{"id":"BIO-B01-Ch1-B074:D","text":"所有鼠先變色→才有可能存在任何差異","explanation":"錯誤：天擇的變異不是都變色後才出現。"}],"concept":"","example":"此時間線只說明本節的天擇情境。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B075","topicId":"","stem":"有人把一種毛色在白沙的相對優勢寫成「此顏色保證永不被捕食」。怎樣改寫較準確？","correct":"BIO-B01-Ch1-B075:B","options":[{"id":"BIO-B01-Ch1-B075:A","text":"保留保證，因為適應必定完美","explanation":"錯誤：有利不等於完美或零風險。"},{"id":"BIO-B01-Ch1-B075:B","text":"在此背景下較不易被發現，可能提高生存與繁殖機會","explanation":"正確：較低風險是情境中的相對可能性。"},{"id":"BIO-B01-Ch1-B075:C","text":"把永不改成每次必定，意思更精確","explanation":"錯誤：仍是沒有依據的絕對保證。"},{"id":"BIO-B01-Ch1-B075:D","text":"只要毛色可遺傳就不再需要食物","explanation":"錯誤：可遺傳性不取消生命資源需求。"}],"concept":"","example":"天擇解釋應保留相對有利與可能的條件。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2、11、14–15 頁（PDF 51、60、63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B076","topicId":"","stem":"某假說認為在指定條件下，鼠會較常造訪有食物的位置。若要檢驗此想法，哪項做法合適？","correct":"BIO-B01-Ch1-B076:C","options":[{"id":"BIO-B01-Ch1-B076:A","text":"不論造訪情況如何都宣告假說正確","explanation":"錯誤：這使主張免於檢驗。"},{"id":"BIO-B01-Ch1-B076:B","text":"宣布鼠的行為永遠不能觀察","explanation":"錯誤：題幹描述可記錄的行為。"},{"id":"BIO-B01-Ch1-B076:C","text":"比較所記錄的造訪結果是否符合較常造訪的預期","explanation":"正確：預測需能與觀察結果對照。"},{"id":"BIO-B01-Ch1-B076:D","text":"只重複研究者相信此說法","explanation":"錯誤：信念不是資料。"}],"concept":"","example":"這是假設情境，並非預先宣稱小鼠一定如此行動。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B077","topicId":"","stem":"一位研究者說「我相信這個解釋，所以不需說明會觀察到什麼」。依章介紹，主要缺口在哪？","correct":"BIO-B01-Ch1-B077:D","options":[{"id":"BIO-B01-Ch1-B077:A","text":"沒有替解釋取英文名字","explanation":"錯誤：語言不是可檢驗性門檻。"},{"id":"BIO-B01-Ch1-B077:B","text":"沒有把信念寫得更長","explanation":"錯誤：篇幅不能替代預測。"},{"id":"BIO-B01-Ch1-B077:C","text":"沒有增加個人支持者人數","explanation":"錯誤：支持人數不能替代資料。"},{"id":"BIO-B01-Ch1-B077:D","text":"沒有提出可由資料評估的預測","explanation":"正確：科學假說應連到可觀察或可實驗的檢查。"}],"concept":"","example":"解釋需要能與自然現象的資料相對照。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B078","topicId":"","stem":"一組資料符合假說，另一組可信新資料卻不符合。哪個處理方向最符合科學探究？","correct":"BIO-B01-Ch1-B078:A","options":[{"id":"BIO-B01-Ch1-B078:A","text":"重新檢視資料及假說，必要時修正解釋","explanation":"正確：新證據可改變對解釋的評估。"},{"id":"BIO-B01-Ch1-B078:B","text":"因先有支持就永遠拒絕新資料","explanation":"錯誤：先前支持不是永久保證。"},{"id":"BIO-B01-Ch1-B078:C","text":"只保留符合的資料並刪去其他資料","explanation":"錯誤：不能按結果喜好刪除資料。"},{"id":"BIO-B01-Ch1-B078:D","text":"改稱假說不受任何觀察檢驗","explanation":"錯誤：取消檢驗性不是科學修正。"}],"concept":"","example":"支持是假說目前的證據狀態，仍可更新。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B079","topicId":"","stem":"某說法對任何可能結果都給出同一句回答：「這恰好證明我正確。」此說法最需要改善哪項？","correct":"BIO-B01-Ch1-B079:B","options":[{"id":"BIO-B01-Ch1-B079:A","text":"讓文字看起來更確定","explanation":"錯誤：確定語氣不能補檢驗性。"},{"id":"BIO-B01-Ch1-B079:B","text":"說明哪些觀察結果能實際檢查該解釋","explanation":"正確：需讓解釋能接受證據評估。"},{"id":"BIO-B01-Ch1-B079:C","text":"把所有預測都刪去","explanation":"錯誤：刪預測使問題更嚴重。"},{"id":"BIO-B01-Ch1-B079:D","text":"讓結果不必記錄","explanation":"錯誤：資料紀錄有助科學檢驗。"}],"concept":"","example":"不能讓任何結果都自動算支持。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B080","topicId":"","stem":"在一份探究紀錄中，「若解釋成立，預期會看見某種結果」應歸在哪一部分？","correct":"BIO-B01-Ch1-B080:C","options":[{"id":"BIO-B01-Ch1-B080:A","text":"已完成的觀察資料","explanation":"錯誤：尚未觀察的期待不是已收資料。"},{"id":"BIO-B01-Ch1-B080:B","text":"永遠成立的最後真理","explanation":"錯誤：預期不是永真證明。"},{"id":"BIO-B01-Ch1-B080:C","text":"由假說導出的預測","explanation":"正確：這是可拿來與結果對照的預測。"},{"id":"BIO-B01-Ch1-B080:D","text":"不需要檢查的個人信念","explanation":"錯誤：科學預測仍需檢查。"}],"concept":"","example":"預測與實際結果要分開記錄。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B081","topicId":"","stem":"某學生把「觀察支持假說」改寫為「觀察永遠證明假說不會錯」。哪項評價正確？","correct":"BIO-B01-Ch1-B081:D","options":[{"id":"BIO-B01-Ch1-B081:A","text":"改寫完全等價","explanation":"錯誤：支持與永真不同。"},{"id":"BIO-B01-Ch1-B081:B","text":"改寫只改善語氣，科學意思未變","explanation":"錯誤：新增永久性改變科學意思。"},{"id":"BIO-B01-Ch1-B081:C","text":"假說一經支持就不能再檢驗","explanation":"錯誤：仍可接受後續檢驗。"},{"id":"BIO-B01-Ch1-B081:D","text":"改寫增加了原資料無法保證的永久性","explanation":"正確：有限證據不保證所有未來情境。"}],"concept":"","example":"用目前資料支持比永遠證明更符合科學表述。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B082","topicId":"","stem":"一個假說尚未被當次觀察支持。研究者下一步提出修正版，再產生新預測。這是否符合本節探究觀點？","correct":"BIO-B01-Ch1-B082:A","options":[{"id":"BIO-B01-Ch1-B082:A","text":"符合，探究可依新資料修正並再檢驗","explanation":"正確：修正與下一輪檢驗構成持續探究。"},{"id":"BIO-B01-Ch1-B082:B","text":"不符合，假說寫下就不能修改","explanation":"錯誤：假說可被修正。"},{"id":"BIO-B01-Ch1-B082:C","text":"不符合，只能保留第一次說法","explanation":"錯誤：沒有只能用第一次說法的限制。"},{"id":"BIO-B01-Ch1-B082:D","text":"符合，但修正版從此不需證據","explanation":"錯誤：修正版也需要檢驗。"}],"concept":"","example":"新問題或修正後假說可啟動下一次探究。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B083","topicId":"","stem":"若要區分假說與預測，哪組對應較恰當？","correct":"BIO-B01-Ch1-B083:B","options":[{"id":"BIO-B01-Ch1-B083:A","text":"假說是已記錄數字；預測是永遠真理","explanation":"錯誤：混淆解釋、資料與永真主張。"},{"id":"BIO-B01-Ch1-B083:B","text":"假說是可檢驗解釋；預測是該解釋導出的預期結果","explanation":"正確：二者的角色不同但相連。"},{"id":"BIO-B01-Ch1-B083:C","text":"假說是作者偏好；預測不能觀察","explanation":"錯誤：科學假說及預測需要可檢驗。"},{"id":"BIO-B01-Ch1-B083:D","text":"假說不必檢驗；預測取代全部資料","explanation":"錯誤：預測不能代替資料。"}],"concept":"","example":"先問為何，再推若如此應看到什麼。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B084","topicId":"","stem":"研究者先提出可檢驗解釋，再記錄觀察與預期是否相符。這比只說「我覺得」多了哪個核心要素？","correct":"BIO-B01-Ch1-B084:C","options":[{"id":"BIO-B01-Ch1-B084:A","text":"更多字體種類","explanation":"錯誤：字體不是科學要素。"},{"id":"BIO-B01-Ch1-B084:B","text":"更高的個人自信","explanation":"錯誤：自信不等於證據。"},{"id":"BIO-B01-Ch1-B084:C","text":"可用證據評估解釋的過程","explanation":"正確：可檢驗的預期與實際資料相連。"},{"id":"BIO-B01-Ch1-B084:D","text":"對原想法永不修改的承諾","explanation":"錯誤：可修正性是科學探究的一部分。"}],"concept":"","example":"研究者的想法應面對可查證的觀察。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B085","topicId":"","stem":"某假說預期現象甲，實際卻出現相反的現象乙。只就本次資料而言，何種說法較合理？","correct":"BIO-B01-Ch1-B085:D","options":[{"id":"BIO-B01-Ch1-B085:A","text":"既然已有假說，乙必須被忽略","explanation":"錯誤：不能只為保留假說忽略資料。"},{"id":"BIO-B01-Ch1-B085:B","text":"觀察只要出現就是永久證明假說","explanation":"錯誤：有資料不代表支持任何假說。"},{"id":"BIO-B01-Ch1-B085:C","text":"把甲與乙都一律叫做支持","explanation":"錯誤：結果相反需如實區分。"},{"id":"BIO-B01-Ch1-B085:D","text":"資料與原預測不符，應檢視原解釋及相關條件","explanation":"正確：不符預期的資料可促使檢討與修正。"}],"concept":"","example":"資料可支持、要求修正或使人放棄原假說。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B086","topicId":"","stem":"學生說「目前有支持，所以不用再設想任何後續觀察」。下列回應何者恰當？","correct":"BIO-B01-Ch1-B086:A","options":[{"id":"BIO-B01-Ch1-B086:A","text":"目前支持仍容許更多檢驗與新證據","explanation":"正確：支持不終止知識更新。"},{"id":"BIO-B01-Ch1-B086:B","text":"只要支持一次，就已完成永久證明","explanation":"錯誤：一次支持不等於永真。"},{"id":"BIO-B01-Ch1-B086:C","text":"新的觀察只會破壞科學","explanation":"錯誤：新觀察能改善解釋。"},{"id":"BIO-B01-Ch1-B086:D","text":"科學應以保持原結論為最高目的","explanation":"錯誤：應依證據評估與修正。"}],"concept":"","example":"同一假說可在更多條件下接受檢查。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B087","topicId":"","stem":"若一段敘述想成為科學假說，最適切的改善是哪項？","correct":"BIO-B01-Ch1-B087:B","options":[{"id":"BIO-B01-Ch1-B087:A","text":"讓它無論結果如何都永遠成立","explanation":"錯誤：免於結果評估會削弱檢驗性。"},{"id":"BIO-B01-Ch1-B087:B","text":"指出能由觀察或實驗檢查的預期結果","explanation":"正確：這將解釋連到可檢驗預測。"},{"id":"BIO-B01-Ch1-B087:C","text":"刪掉所有和自然現象的關聯","explanation":"錯誤：科學探究研究自然現象。"},{"id":"BIO-B01-Ch1-B087:D","text":"要求大家只按作者權威接受","explanation":"錯誤：權威不能替代證據。"}],"concept":"","example":"一個可檢查的預期讓想法能與資料相遇。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B088","topicId":"","stem":"兩個人對同一生命現象各提出解釋。哪項最適合讓討論進入科學探究？","correct":"BIO-B01-Ch1-B088:C","options":[{"id":"BIO-B01-Ch1-B088:A","text":"比較誰的語氣更強","explanation":"錯誤：語氣不保證正確。"},{"id":"BIO-B01-Ch1-B088:B","text":"先禁止任何人修改想法","explanation":"錯誤：證據可能要求修正。"},{"id":"BIO-B01-Ch1-B088:C","text":"分別提出可檢驗預測，再與資料對照","explanation":"正確：預測與資料可評估解釋。"},{"id":"BIO-B01-Ch1-B088:D","text":"只決定誰先發言就採用誰的解釋","explanation":"錯誤：先後順序不是證據。"}],"concept":"","example":"兩種想法都須面對與自身預測有關的資料。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B089","topicId":"","stem":"「問題→假說→預測→資料→修正」的簡化流程，最合理的理解是哪項？","correct":"BIO-B01-Ch1-B089:D","options":[{"id":"BIO-B01-C
