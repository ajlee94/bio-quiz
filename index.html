ransfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S018","topicId":"BIO-1.1.3-CONSUMER","stem":"食物關係為「葉片被毛蟲吃，毛蟲再被鳥吃」。若箭頭表示食物資源流向，應如何排列？","correct":"BIO-B01-Ch1.1.3-S018:D","options":[{"id":"BIO-B01-Ch1.1.3-S018:A","text":"鳥→毛蟲→葉片","explanation":"這是沿捕食者回找食物，與題定資源流向相反。"},{"id":"BIO-B01-Ch1.1.3-S018:B","text":"毛蟲→葉片→鳥","explanation":"第一段反向，且題面未說鳥直接吃葉片。"},{"id":"BIO-B01-Ch1.1.3-S018:C","text":"葉片→鳥→毛蟲","explanation":"題設鳥吃毛蟲，未給葉片直接傳給鳥的路徑。"},{"id":"BIO-B01-Ch1.1.3-S018:D","text":"葉片→毛蟲→鳥","explanation":"葉片資源進入毛蟲，再由毛蟲進入鳥，兩段皆符合。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n判斷每一段箭頭時，先找誰被吃，再找誰取得食物。資源流向和捕食者撲向獵物的動作方向不同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S019","topicId":"BIO-1.1.3-CONSUMER","stem":"有一種動物以另一動物死亡後留下的有機物為食。就本節廣義消費者定義而言，哪項判斷最合適？","correct":"BIO-B01-Ch1.1.3-S019:B","options":[{"id":"BIO-B01-Ch1.1.3-S019:A","text":"沒有捕食活體，所以不取用食物能量","explanation":"消費有機物不必以捕食活體為條件。"},{"id":"BIO-B01-Ch1.1.3-S019:B","text":"仍可由其他生物的遺留物取得化學能","explanation":"遺留有機物仍可供化學能，符合本題廣義定義。"},{"id":"BIO-B01-Ch1.1.3-S019:C","text":"因吃遺體，便能完全回收已散失的熱","explanation":"取得殘餘化學能不等於把先前散失的熱收回。"},{"id":"BIO-B01-Ch1.1.3-S019:D","text":"因食物已死亡，所以只提供礦物質","explanation":"死亡生物仍可留下有機物，並不只剩礦物質。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n廣義消費者包含利用其他生物或其遺留有機物的情形。死亡不代表有機物中剩餘的化學能和物質都不存在。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S020","topicId":"BIO-1.1.3-CONSUMER","stem":"一隻鳥同時吃果實與昆蟲。若只判斷它取得食物能量的方式，下列何者正確？","correct":"BIO-B01-Ch1.1.3-S020:C","options":[{"id":"BIO-B01-Ch1.1.3-S020:A","text":"吃果實時是生產者，吃昆蟲時才是消費者","explanation":"取食果實仍是消費，生產者不是按被吃食物分類。"},{"id":"BIO-B01-Ch1.1.3-S020:B","text":"只要食物源自植物，就表示直接取得光能","explanation":"源自植物的食物攜帶化學能，與直接吸光不同。"},{"id":"BIO-B01-Ch1.1.3-S020:C","text":"兩種食物都可提供化學能，鳥均在取食","explanation":"果實與昆蟲都含有機物，均能供鳥取得化學能。"},{"id":"BIO-B01-Ch1.1.3-S020:D","text":"果實供應物質，昆蟲才可能供應能量","explanation":"果實也含化學能，昆蟲也含物質，不能割裂兩種資源。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n吃植物或動物都屬攝取外來有機物；食性不同不會使鳥在吃果實時突然具備光合製造食物的能力。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S021","topicId":"BIO-1.1.3-HEAT","stem":"生物利用食物中的化學能進行活動時，部分能量最常以何種形式傳到周圍？","correct":"BIO-B01-Ch1.1.3-S021:D","options":[{"id":"BIO-B01-Ch1.1.3-S021:A","text":"新產生的光合原料","explanation":"原料是物質，不能當作散失能量的形式。"},{"id":"BIO-B01-Ch1.1.3-S021:B","text":"被消滅而不再存在的能量","explanation":"散熱是轉換和傳遞，並不是能量被消滅。"},{"id":"BIO-B01-Ch1.1.3-S021:C","text":"完整可再利用的食物","explanation":"做功不會把已使用的能量完整還原成食物。"},{"id":"BIO-B01-Ch1.1.3-S021:D","text":"熱","explanation":"部分化學能轉為熱並傳入周圍，是常見結果。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n把能量散失描述為熱傳到環境，是在說能量離開生物或生態系的路徑；不是說能量本身消失。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S022","topicId":"BIO-1.1.3-HEAT","stem":"下列關於生物在正常生命活動中利用化學能並散熱的敘述，何者正確？","correct":"BIO-B01-Ch1.1.3-S022:A","options":[{"id":"BIO-B01-Ch1.1.3-S022:A","text":"植物、草食動物、分解落葉的真菌都可能如此","explanation":"三者都進行細胞活動並利用化學能，皆可散熱。"},{"id":"BIO-B01-Ch1.1.3-S022:B","text":"只有草食動物與肉食動物會如此","explanation":"把能量使用只限動物，漏掉植物及分解者。"},{"id":"BIO-B01-Ch1.1.3-S022:C","text":"只有植物與藻類會如此","explanation":"植物和藻類可散熱，但動物與分解者也能。"},{"id":"BIO-B01-Ch1.1.3-S022:D","text":"只有能主動移動的個體會如此","explanation":"不移動的植物與真菌也可能利用化學能散熱。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n散熱與細胞利用化學能有關，不是動物或可移動個體專有的過程。光合生物與分解者也有細胞工作。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S023","topicId":"BIO-1.1.3-HEAT","stem":"對「能量以熱散失到環境」的理解，何者正確？","correct":"BIO-B01-Ch1.1.3-S023:C","options":[{"id":"BIO-B01-Ch1.1.3-S023:A","text":"環境所得到的熱已不算能量","explanation":"熱仍是能量傳遞形式，不能把它排除。"},{"id":"BIO-B01-Ch1.1.3-S023:B","text":"所有食物能量都必先成為肌肉工作","explanation":"散熱可伴隨各種細胞活動，不必先經肌肉工作。"},{"id":"BIO-B01-Ch1.1.3-S023:C","text":"能量換了形式及位置，並非憑空消失","explanation":"正確區分可用化學能的減少與能量被轉移。"},{"id":"BIO-B01-Ch1.1.3-S023:D","text":"生物可以把這些熱毫無損失地反覆當食物","explanation":"同一生態系一般不能完整把散熱回收為食物化學能。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n系統內可用化學能減少與總能量不被憑空消滅並不矛盾；把周圍環境也計入，就能看見能量的去向。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S024","topicId":"BIO-1.1.3-HEAT","stem":"某動物正在活動，身體同時向周圍散熱。哪種概念圖最適合表示這段能量利用？","correct":"BIO-B01-Ch1.1.3-S024:B","options":[{"id":"BIO-B01-Ch1.1.3-S024:A","text":"食物化學能先完全變成物質，再做功","explanation":"把能量先變物質不是本節的能量利用路徑。"},{"id":"BIO-B01-Ch1.1.3-S024:B","text":"化學能分別連到做功與熱散失","explanation":"分支可同時表現化學能支持工作及部分散熱。"},{"id":"BIO-B01-Ch1.1.3-S024:C","text":"熱先完全回收為食物，再開始活動","explanation":"題面沒有完整回收熱的過程，且不符通常能量流向。"},{"id":"BIO-B01-Ch1.1.3-S024:D","text":"只有停止活動後才畫出熱的箭頭","explanation":"忽略活動中已觀察到的散熱，時間順序不符。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n題面特別指出工作與散熱同時發生，分支表示法可避免誤認「工作全部完成後才有熱」。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S025","topicId":"BIO-1.1.3-HEAT","stem":"把「所有食物化學能都轉為生物的有用工作」當作一般原則，最主要漏掉了什麼？","correct":"BIO-B01-Ch1.1.3-S025:D","options":[{"id":"BIO-B01-Ch1.1.3-S025:A","text":"植物可吸收環境原料","explanation":"這是物質來源問題，並未直接指出能量帳漏項。"},{"id":"BIO-B01-Ch1.1.3-S025:B","text":"食物有不同顏色","explanation":"顏色不是能量是否全轉為有用工作的判準。"},{"id":"BIO-B01-Ch1.1.3-S025:C","text":"消費者可能吃兩種食物","explanation":"食物種類不同仍會散熱，不能取代漏失去向。"},{"id":"BIO-B01-Ch1.1.3-S025:D","text":"能量利用過程中的熱散失","explanation":"散熱使有用工作不等於投入的全部化學能。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n有用工作只是能量轉換去向之一。即使不計較其他儲存或輸出，部分能量散熱已足以否定全部變成有用工作的主張。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S026","topicId":"BIO-1.1.3-FLOW","stem":"以陽光為主要能量入口的生態系，典型能量路徑何者正確？","correct":"BIO-B01-Ch1.1.3-S026:A","options":[{"id":"BIO-B01-Ch1.1.3-S026:A","text":"光能→食物化學能→生物利用及散熱","explanation":"光合作用引入能量，生物使用化學能並散熱，方向相符。"},{"id":"BIO-B01-Ch1.1.3-S026:B","text":"熱→土壤養分→光能→食物","explanation":"養分是物質，且沒有把環境熱重新變陽光的此種途徑。"},{"id":"BIO-B01-Ch1.1.3-S026:C","text":"食物→陽光→動物→土壤原子","explanation":"將有機物到陽光的方向倒置，也把原子混入能量形式。"},{"id":"BIO-B01-Ch1.1.3-S026:D","text":"光能→熱→完全回收為原來的光能","explanation":"熱不能在生態系中完整回收成原來輸入的光能。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n本題要追蹤能量形式及用途，而非把土壤成分等物質當作能量的一站。散熱表示能量逐步流出。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S027","topicId":"BIO-1.1.3-FLOW","stem":"即使一個生態系能反覆利用某些原料，為何長期維持生命活動仍需能量輸入？","correct":"BIO-B01-Ch1.1.3-S027:C","options":[{"id":"BIO-B01-Ch1.1.3-S027:A","text":"原料循環每次會把原子消滅","explanation":"原料循環是轉移與重組，不是消滅原子。"},{"id":"BIO-B01-Ch1.1.3-S027:B","text":"所有生物都不能儲存化學能","explanation":"生物可儲存化學能，問題在儲存有限且使用會散熱。"},{"id":"BIO-B01-Ch1.1.3-S027:C","text":"能量利用時逐步散熱，不能完整循環回收","explanation":"持續散熱使系統需持續供能，物質再利用不能補上。"},{"id":"BIO-B01-Ch1.1.3-S027:D","text":"每次取食都會從無到有創造能量","explanation":"取食是傳遞已有化學能，並非創造能量。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n物質循環可減少重新取得部分原料的需要，但不能取代能量來源。儲存能量能延緩影響，仍不是無限供能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S028","topicId":"BIO-1.1.3-FLOW","stem":"能量「單向流動」的基本意義，何者最接近？","correct":"BIO-B01-Ch1.1.3-S028:B","options":[{"id":"BIO-B01-Ch1.1.3-S028:A","text":"生態系中只允許存在一種食物鏈","explanation":"多條取食路徑仍可符合能量總體單向流過的特徵。"},{"id":"BIO-B01-Ch1.1.3-S028:B","text":"能量經轉換和傳遞後逐步以熱離開","explanation":"由輸入、轉換、利用到散熱，沒有完整回收循環。"},{"id":"BIO-B01-Ch1.1.3-S028:C","text":"所有物質都必須永久離開生態系","explanation":"物質可循環，這句把能量路徑誤套為物質命運。"},{"id":"BIO-B01-Ch1.1.3-S028:D","text":"每個生物只能把能量傳給一隻動物","explanation":"可傳給多個取食者，單向不等於只能一對一傳遞。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n單向是相對於完整能量循環而言；它不限制食物網有多少分支，也不是要求一個來源只供一個生物。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S029","topicId":"BIO-1.1.3-FLOW","stem":"某食物鏈圖把「熱」再用箭頭直接連回「植物製造食物」，並標註全部回收。最需要修正的是什麼？","correct":"BIO-B01-Ch1.1.3-S029:D","options":[{"id":"BIO-B01-Ch1.1.3-S029:A","text":"植物前面不能有任何外來能源","explanation":"植物可以吸收外來光能，需修的是散熱回收箭頭。"},{"id":"BIO-B01-Ch1.1.3-S029:B","text":"植物與動物之間不能傳遞化學能","explanation":"取食可傳遞有機物化學能，這條關係本來合理。"},{"id":"BIO-B01-Ch1.1.3-S029:C","text":"熱應改名為礦物質便可全部回收","explanation":"熱與礦物質不同，改名稱會把能量與物質混淆。"},{"id":"BIO-B01-Ch1.1.3-S029:D","text":"不能把已散熱畫成完整回復食物化學能","explanation":"應把能量散熱流出和物質回收分成不同路徑。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n光合植物需要外來光能；分解回收的原料並不表示散到環境的能量能全部再利用。圖中錯的是完整閉合能量循環。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S030","topicId":"BIO-1.1.3-FLOW","stem":"在白天形成的植物有機物，夜晚仍可能供消費者使用。這表示什麼？","correct":"BIO-B01-Ch1.1.3-S030:A","options":[{"id":"BIO-B01-Ch1.1.3-S030:A","text":"光能可先轉成化學能，再於之後傳遞","explanation":"有機物可先儲存並於之後被取食，時間不必同步。"},{"id":"BIO-B01-Ch1.1.3-S030:B","text":"夜晚的動物必定直接吸收當時的陽光","explanation":"夜間食物提供化學能，不要求當下有陽光。"},{"id":"BIO-B01-Ch1.1.3-S030:C","text":"能量流動必須等每個生物同時受光才發生","explanation":"光合作用與後續取食可以先後發生，不需同時照光。"},{"id":"BIO-B01-Ch1.1.3-S030:D","text":"夜晚消費的是已散到環境的全部熱","explanation":"消費者利用有機物中的能量，並非完整回收環境熱。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n儲存在有機物中的化學能使能量輸入時間與取食使用時間可以不同；夜晚取食不會改變其化學能形式。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S031","topicId":"BIO-1.1.3-MATTER","stem":"植物從土壤吸收的某些化學成分，可能在葉片被動物吃下後進入動物體內。這主要描述什麼？","correct":"BIO-B01-Ch1.1.3-S031:B","options":[{"id":"BIO-B01-Ch1.1.3-S031:A","text":"光能在植物體內產生","explanation":"所追蹤的是化學成分而非光，且光能非由植物憑空產生。"},{"id":"BIO-B01-Ch1.1.3-S031:B","text":"物質由環境經植物傳給動物","explanation":"化學成分可隨吸收和取食轉移到不同生物。"},{"id":"BIO-B01-Ch1.1.3-S031:C","text":"熱能完整返回植物","explanation":"題面沒有熱回收，也不支持能量完整循環。"},{"id":"BIO-B01-Ch1.1.3-S031:D","text":"動物將原子轉成光線","explanation":"原子轉成光不是本題所述物質利用方式。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n題目追蹤的是化學成分的位置：土壤、植物、動物。因此這一段屬物質轉移；若再經分解返回環境並被吸收，才補成循環路徑。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S032","topicId":"BIO-1.1.3-MATTER","stem":"「物質可以循環」是否表示一個糖分子在各生物間永遠保持原樣？","correct":"BIO-B01-Ch1.1.3-S032:C","options":[{"id":"BIO-B01-Ch1.1.3-S032:A","text":"是，任何分子都不能改變","explanation":"循環容許化學反應，並不禁止分子改變。"},{"id":"BIO-B01-Ch1.1.3-S032:B","text":"是，植物與動物只能搬運完整糖","explanation":"生物能分解和重新合成分子，不只是搬運。"},{"id":"BIO-B01-Ch1.1.3-S032:C","text":"否，循環的化學成分可重組為不同分子","explanation":"同一成分可進入不同分子，仍屬物質轉換與再利用。"},{"id":"BIO-B01-Ch1.1.3-S032:D","text":"否，因為原子進入動物後都消失","explanation":"進入動物不使原子憑空消失，會有不同去向。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n物質循環的追蹤尺度可以是原子或化學成分，不必是永遠不變的完整分子。分子分解、合成與物質再利用可以同時成立。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S033","topicId":"BIO-1.1.3-MATTER","stem":"若要為「土壤物質→植物→動物→遺體」這段路徑補上返回環境的重要環節，最適合加入何者？","correct":"BIO-B01-Ch1.1.3-S033:A","options":[{"id":"BIO-B01-Ch1.1.3-S033:A","text":"分解者分解遺體並釋回化學成分","explanation":"分解使遺體中的化學成分返回環境，補上回收路徑。"},{"id":"BIO-B01-Ch1.1.3-S033:B","text":"遺體完全變成能量而不留物質","explanation":"遺體分解不表示物質全部轉成能量而消失。"},{"id":"BIO-B01-Ch1.1.3-S033:C","text":"動物散出的熱直接變成土壤礦物質","explanation":"熱不是礦物質原子來源，兩者不能交換名稱。"},{"id":"BIO-B01-Ch1.1.3-S033:D","text":"陽光把所有遺體原封不動送進根部","explanation":"植物吸收的是適合的環境原料，不是所有完整遺體。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n不完整的路徑只顯示物質進入生物及遺體。加入分解及返回環境，才能說明原料如何再次有機會被植物利用。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S034","topicId":"BIO-1.1.3-MATTER","stem":"下列哪一組最適合列為植物可以從非生物環境取得的物質來源？","correct":"BIO-B01-Ch1.1.3-S034:D","options":[{"id":"BIO-B01-Ch1.1.3-S034:A","text":"光、熱、做功","explanation":"光、熱及做功不構成一組物質原料。"},{"id":"BIO-B01-Ch1.1.3-S034:B","text":"肌肉收縮、光合作用、繁殖","explanation":"這些都是活動或過程，不是吸收的化學物質清單。"},{"id":"BIO-B01-Ch1.1.3-S034:C","text":"光能、化學能、熱能","explanation":"列的是能量形式，不是環境原料。"},{"id":"BIO-B01-Ch1.1.3-S034:D","text":"空氣中的二氧化碳與環境中的水、礦物質","explanation":"這些化學物質能提供植物所需的部分原料。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n區分物質與過程：二氧化碳、水和礦物質有原子組成；光和熱是能量相關項目，做功與光合作用則是過程。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S035","topicId":"BIO-1.1.3-MATTER","stem":"落葉分解後，其中某成分再次被另一株植物吸收。最直接支持哪個結論？","correct":"BIO-B01-Ch1.1.3-S035:B","options":[{"id":"BIO-B01-Ch1.1.3-S035:A","text":"兩株植物交換了全部能量","explanation":"追蹤成分不等於追蹤全部能量，不能如此擴大。"},{"id":"BIO-B01-Ch1.1.3-S035:B","text":"化學物質能回到環境後再被生物利用","explanation":"相同成分經環境再次進入植物，是物質循環證據。"},{"id":"BIO-B01-Ch1.1.3-S035:C","text":"所有落葉分子全程保持不變","explanation":"分解可能改變分子，題目只說成分再被吸收。"},{"id":"BIO-B01-Ch1.1.3-S035:D","text":"物質只能由植物流向土壤，不能返回","explanation":"第二株吸收正是環境到植物的返回方向。"}],"concept":"物質循環是原子或化學成分在環境、生物體、廢物與遺體間轉移和重新利用。植物吸收環境中的物質，動物取食後取得其中一部分；分解作用又使物質返回環境，供植物吸收。循環不表示同一分子始終不變，也不表示每個局部生態系的所有物質都不會輸出。\n\n題面提供離開第一株植物、回到環境、再被第二株吸收三個環節，足以支持再利用，但不保證全部物質或全部能量都回收。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S036","topicId":"BIO-1.1.3-DECOMPOSER","stem":"枯枝上的真菌分解有機物，部分化學成分回到土壤。真菌在此扮演的角色為何？","correct":"BIO-B01-Ch1.1.3-S036:C","options":[{"id":"BIO-B01-Ch1.1.3-S036:A","text":"主要把熱變回陽光的生產者","explanation":"真菌分解枯枝，不是把散熱轉回光。"},{"id":"BIO-B01-Ch1.1.3-S036:B","text":"只搬動枯枝而不利用能量的生物","explanation":"分解者有自身生命活動，不能說完全不利用能量。"},{"id":"BIO-B01-Ch1.1.3-S036:C","text":"參與物質回收的分解者","explanation":"分解有機物並將成分釋回環境，符合分解者功能。"},{"id":"BIO-B01-Ch1.1.3-S036:D","text":"只向土壤提供能量而不提供物質的生物","explanation":"題目明確有物質回土壤，不能說只有能量輸出。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n角色來自真菌正在執行的分解功能。枯枝中的物質返回土壤，而真菌本身也可利用有機物的化學能維持生活。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S037","topicId":"BIO-1.1.3-DECOMPOSER","stem":"分解者從落葉取得化學能時，對能量的作用應如何描述？","correct":"BIO-B01-Ch1.1.3-S037:A","options":[{"id":"BIO-B01-Ch1.1.3-S037:A","text":"利用尚存在有機物中的化學能，並會散熱","explanation":"分解者取得有機物能量並進行細胞工作，伴隨散熱。"},{"id":"BIO-B01-Ch1.1.3-S037:B","text":"把先前已散失的熱全部變回食物","explanation":"落葉中的化學能不是先前散熱全部回收的產物。"},{"id":"BIO-B01-Ch1.1.3-S037:C","text":"不參與能量流動，只參與物質循環","explanation":"分解者使用化學能，因此也參與能量流動。"},{"id":"BIO-B01-Ch1.1.3-S037:D","text":"讓生態系的能量總量無中生有增加","explanation":"能量來自既有有機物，而非從無到有增加。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n「尚存化學能」和「已散失熱」是兩種不同狀態。利用落葉可取用前者，並不能證明後者已被全部收回。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S038","topicId":"BIO-1.1.3-DECOMPOSER","stem":"某環境中原本負責分解落葉的生物大幅減少，且沒有其他生物代替。何者是最直接的可能影響？","correct":"BIO-B01-Ch1.1.3-S038:D","options":[{"id":"BIO-B01-Ch1.1.3-S038:A","text":"照到地面的陽光立刻停止","explanation":"分解者減少不會直接停止外來陽光。"},{"id":"BIO-B01-Ch1.1.3-S038:B","text":"植物立刻不再含任何原子","explanation":"既有植物仍含物質，不會因回收變慢而立即失去所有原子。"},{"id":"BIO-B01-Ch1.1.3-S038:C","text":"已散熱全部改為留在落葉中","explanation":"已散熱不會因分解者減少而自動返回落葉。"},{"id":"BIO-B01-Ch1.1.3-S038:D","text":"落葉中的部分化學成分返回環境的速度降低","explanation":"缺少分解作用可使物質留在落葉中較久，回收變慢。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n題面排除替代分解者，才能把變化連到原有分解途徑；直接結果是回收受阻，不能擴大為立刻停止所有生命或日照。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S039","topicId":"BIO-1.1.3-DECOMPOSER","stem":"分解者可處理的典型材料，哪一組最符合本節？","correct":"BIO-B01-Ch1.1.3-S039:B","options":[{"id":"BIO-B01-Ch1.1.3-S039:A","text":"只有仍在生長的活葉","explanation":"分解者的典型材料包括落葉與遺體，不僅活葉。"},{"id":"BIO-B01-Ch1.1.3-S039:B","text":"廢物、落葉與死亡生物的有機物","explanation":"三類都是本節分解者可利用並釋回成分的材料。"},{"id":"BIO-B01-Ch1.1.3-S039:C","text":"只有太陽光與環境熱","explanation":"光和熱不是分解者所分解的有機物。"},{"id":"BIO-B01-Ch1.1.3-S039:D","text":"只有植物已吸收的全部礦物質","explanation":"生物體內礦物質不是此處唯一材料，且不全是分解作用對象。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n典型分解途徑利用廢物與死亡材料中的有機物。這些材料可以來自植物、動物或它們的排出物，不局限單一類群。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S040","topicId":"BIO-1.1.3-DECOMPOSER","stem":"對某些細菌與真菌作為分解者的共同描述，何者正確？","correct":"BIO-B01-Ch1.1.3-S040:C","options":[{"id":"BIO-B01-Ch1.1.3-S040:A","text":"都能使已散熱完整循環","explanation":"分解者也散熱，不能讓能量完整循環。"},{"id":"BIO-B01-Ch1.1.3-S040:B","text":"都只會清除體積，不改變物質形式","explanation":"分解可改變分子，並非只將體積搬開。"},{"id":"BIO-B01-Ch1.1.3-S040:C","text":"都可分解有機材料，使成分回到環境","explanation":"分解有機物並釋回化學成分是共同功能。"},{"id":"BIO-B01-Ch1.1.3-S040:D","text":"都不需要能量來維持生命","explanation":"它們有細胞工作，也需要利用能量。"}],"concept":"分解者例如某些細菌與真菌，分解廢物、落葉與死亡生物，讓其中的化學成分回到土壤、水或空氣，之後可能再被植物吸收。同時分解者也取得有機物中的化學能、做功並散熱。因此它們參與物質循環和能量流動，回收物質不等於回收已散失的能量。\n\n共同點是功能，並不表示所有細菌、所有真菌都執行同一方式。此題已限定具分解功能者，考的是分解與物質回收。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S041","topicId":"BIO-1.1.3-CONTRAST","stem":"下列配對何者正確？","correct":"BIO-B01-Ch1.1.3-S041:A","options":[{"id":"BIO-B01-Ch1.1.3-S041:A","text":"能量通常單向流動；化學物質可循環","explanation":"能量逐步散熱，物質可重返環境再被利用，配對正確。"},{"id":"BIO-B01-Ch1.1.3-S041:B","text":"能量可完整循環；化學物質必消失","explanation":"把兩者命運顛倒，化學物質並非必然消失。"},{"id":"BIO-B01-Ch1.1.3-S041:C","text":"能量與物質都只會從無到有增加","explanation":"生物轉換既有能量和原料，不從無到有增加兩者。"},{"id":"BIO-B01-Ch1.1.3-S041:D","text":"能量只進入植物；物質只進入動物","explanation":"植物與動物都需要能量及物質，不可各限一類。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n比較時應分別追蹤能源形式與化學成分，不把其中一項的路徑直接套用到另一項。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S042","topicId":"BIO-1.1.3-CONTRAST","stem":"甲記錄「光進入、熱離開」，乙記錄「環境成分進入生物、之後回到環境」。甲、乙依序主要追蹤什麼？","correct":"BIO-B01-Ch1.1.3-S042:D","options":[{"id":"BIO-B01-Ch1.1.3-S042:A","text":"兩者都只追蹤物質","explanation":"甲的光與熱是能量，不能把兩者都歸物質。"},{"id":"BIO-B01-Ch1.1.3-S042:B","text":"兩者都只追蹤能量","explanation":"乙的環境成分回收是物質，不能全歸能量。"},{"id":"BIO-B01-Ch1.1.3-S042:C","text":"甲追蹤物質，乙追蹤能量","explanation":"甲乙分類顛倒，應先辨認光、熱和化學成分。"},{"id":"BIO-B01-Ch1.1.3-S042:D","text":"甲追蹤能量，乙追蹤物質","explanation":"甲是能量路徑，乙是物質往返，與題面相符。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n光與熱是能量的入口和出口；環境成分與生物組成的轉移描述物質。由追蹤對象可直接區分兩類紀錄。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S043","topicId":"BIO-1.1.3-CONTRAST","stem":"同學以「食物被吃下」為理由，認為物質與能量在生態系中的最終路徑一定相同。主要問題是什麼？","correct":"BIO-B01-Ch1.1.3-S043:B","options":[{"id":"BIO-B01-Ch1.1.3-S043:A","text":"食物不可能同時帶有物質與能量","explanation":"食物確實同時提供兩者，不能以此否定取食。"},{"id":"BIO-B01-Ch1.1.3-S043:B","text":"共同被傳遞不代表之後都能完整循環","explanation":"相同的一段傳遞不保證最終去向相同，是推論的關鍵。"},{"id":"BIO-B01-Ch1.1.3-S043:C","text":"食物中的所有物質都屬於光","explanation":"食物物質具有原子組成，不能等同光。"},{"id":"BIO-B01-Ch1.1.3-S043:D","text":"只有分解者才會吃到有機物","explanation":"消費者也攝取有機物，不僅分解者如此。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n取食是兩者共享的一段路徑，並非全部命運。後續物質可回收，化學能則在使用時逐步散熱。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S044","topicId":"BIO-1.1.3-CONTRAST","stem":"哪一項觀察最直接屬於物質再利用，而非能量形式轉換？","correct":"BIO-B01-Ch1.1.3-S044:C","options":[{"id":"BIO-B01-Ch1.1.3-S044:A","text":"葉片吸收光能後儲存化學能","explanation":"這是光能到化學能的轉換，重點是能量形式。"},{"id":"BIO-B01-Ch1.1.3-S044:B","text":"昆蟲活動時向空氣散熱","explanation":"散熱是能量傳出，不是成分被重新吸收。"},{"id":"BIO-B01-Ch1.1.3-S044:C","text":"遺體中的某些成分回環境後再被根吸收","explanation":"所追蹤化學成分重返生物，是物質再利用。"},{"id":"BIO-B01-Ch1.1.3-S044:D","text":"化學能支持肌肉收縮","explanation":"化學能支持工作屬能量使用，不直接表示原料回收。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n物質再利用要有成分回到環境後再次被吸收的路徑；另三項分別著重光能、熱及工作的能量轉換。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S045","topicId":"BIO-1.1.3-CONTRAST","stem":"若比較碳原子與食物中的化學能，何者是合理的基本敘述？","correct":"BIO-B01-Ch1.1.3-S045:A","options":[{"id":"BIO-B01-Ch1.1.3-S045:A","text":"碳原子可進入不同分子再利用，化學能使用時逐步散熱","explanation":"正確區分原子重組回收與能量散熱的不同路徑。"},{"id":"BIO-B01-Ch1.1.3-S045:B","text":"碳原子一被使用就變成熱，能量原封不動留下","explanation":"原子不會因一般生命活動而全變熱，化學能也會被轉換。"},{"id":"BIO-B01-Ch1.1.3-S045:C","text":"兩者都能被同一生態系無限完整回收","explanation":"完整無限回收能量不符合本節散熱原則。"},{"id":"BIO-B01-Ch1.1.3-S045:D","text":"碳原子不屬物質，化學能才有原子","explanation":"碳原子屬物質，能量本身不是由原子構成的原料。"}],"concept":"判斷路徑時先問追蹤對象：光能、化學能與熱屬於能量形式；碳原子、水與礦物成分屬於物質。能量在使用過程中逐步散熱，通常單向通過生態系；物質成分則能在環境與生物間重新利用。同一份食物同時攜帶物質與化學能，不能因同路傳遞就認為兩者最後命運相同。\n\n原子是物質的組成單位，化學能描述分子系統可供轉換利用的能量，兩者不是同一個計數對象。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第7張／正文第5頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁；正式第12張／正文第10頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S046","topicId":"BIO-1.1.3-INTEGRATION","stem":"草被昆蟲吃，昆蟲遺體再被微生物分解。要同時記錄能量與物質，最適當的方式為何？","correct":"BIO-B01-Ch1.1.3-S046:D","options":[{"id":"BIO-B01-Ch1.1.3-S046:A","text":"只記食物質量即可得知全部能量去向","explanation":"質量無法單獨表達能量形式、用途及散熱。"},{"id":"BIO-B01-Ch1.1.3-S046:B","text":"只記熱量即可知道每種原子的去向","explanation":"熱量不包含各元素在何處、是否被再吸收的資訊。"},{"id":"BIO-B01-Ch1.1.3-S046:C","text":"假設兩者都沿同一閉合圈流動","explanation":"能量不是完整閉合循環，不能兩者都這樣設定。"},{"id":"BIO-B01-Ch1.1.3-S046:D","text":"分別追蹤化學能和化學成分，再記散熱與回收","explanation":"分開追蹤能避免混淆食物共載兩種資源的情況。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n同一流程可以用兩本不同的帳追蹤：能量帳記轉換與散熱，物質帳記成分轉移與再吸收。單一質量或熱量無法替代兩者。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S047","topicId":"BIO-1.1.3-INTEGRATION","stem":"某植物有充足光照，卻缺乏形成新組織所需的某種礦物成分。下列何者最合理？","correct":"BIO-B01-Ch1.1.3-S047:B","options":[{"id":"BIO-B01-Ch1.1.3-S047:A","text":"光越強，便可從無到有補出該成分","explanation":"光是能源，不會從無到有提供缺乏的元素原子。"},{"id":"BIO-B01-Ch1.1.3-S047:B","text":"有能量輸入不保證物質原料足夠","explanation":"供能與供料是兩項需求，一項足夠不能保證另一項。"},{"id":"BIO-B01-Ch1.1.3-S047:C","text":"缺原料表示植物完全不再散熱","explanation":"原料不足不等於所有細胞工作和散熱都停止。"},{"id":"BIO-B01-Ch1.1.3-S047:D","text":"光照與物質來源是同一條件","explanation":"光照供能，礦物成分供料，兩者不是同一條件。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n題面把能源充足與原料不足分開設定。物質需要從既有原料取得，不能用更多光照直接創造缺乏的元素。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S048","topicId":"BIO-1.1.3-INTEGRATION","stem":"落葉分解能讓養分回到土壤，為何這件事不能取代光合植物的光能需求？","correct":"BIO-B01-Ch1.1.3-S048:C","options":[{"id":"BIO-B01-Ch1.1.3-S048:A","text":"植物不能吸收任何回收成分","explanation":"植物可利用回收成分，這正是物質循環的一部分。"},{"id":"BIO-B01-Ch1.1.3-S048:B","text":"落葉分解不涉及任何能量","explanation":"分解者會利用化學能及散熱，不能說沒有能量。"},{"id":"BIO-B01-Ch1.1.3-S048:C","text":"回收原料不等於提供光合作用所需的光能","explanation":"正確區分供料與供能，因此原料回收不能代替光。"},{"id":"BIO-B01-Ch1.1.3-S048:D","text":"原料回到土壤後都不再屬於物質","explanation":"回到土壤的成分仍屬物質，不因位置改變而改類別。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n分解回收的是化學成分；光合作用仍需能源支持。分解者本身使用有機物的化學能也不等於替植物供應足夠光能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S049","topicId":"BIO-1.1.3-INTEGRATION","stem":"下列哪項最能同時保留生產者、消費者與分解者的基本關係？","correct":"BIO-B01-Ch1.1.3-S049:A","options":[{"id":"BIO-B01-Ch1.1.3-S049:A","text":"光合生產者製造有機物；消費者取食；分解者釋回部分成分","explanation":"依次描述光合、取食、分解回收，符合本節角色。"},{"id":"BIO-B01-Ch1.1.3-S049:B","text":"生產者只供物質；消費者從陽光取能；分解者只供熱","explanation":"生產者也提供化學能，消費者主要由食物取能。"},{"id":"BIO-B01-Ch1.1.3-S049:C","text":"生產者創造能量；消費者消滅能量；分解者再創造能量","explanation":"能量不由三類生物交替創造與消滅，只被轉換和傳遞。"},{"id":"BIO-B01-Ch1.1.3-S049:D","text":"三者各只需要能量、物質、熱其中一項","explanation":"所有生物都需要能量及物質，不能按角色各分一種需求。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n三類功能連成食物與物質路徑，但每類生物本身都同時需要物質和能量，且會使用化學能進行工作。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S050","topicId":"BIO-1.1.3-INTEGRATION","stem":"有人把具有植物、動物和分解者的密閉容器稱為「永不需供能的完整循環」。僅因三類生物都存在，就能接受這個說法嗎？","correct":"BIO-B01-Ch1.1.3-S050:D","options":[{"id":"BIO-B01-Ch1.1.3-S050:A","text":"能，只要物種齊全就不再散熱","explanation":"物種齊全不能免除細胞活動伴隨的散熱。"},{"id":"BIO-B01-Ch1.1.3-S050:B","text":"能，分解者會供應全部失去的光","explanation":"分解者不會把散熱全部變成光供回植物。"},{"id":"BIO-B01-Ch1.1.3-S050:C","text":"不能，因為任何物質都無法再利用","explanation":"某些物質能再利用，因此反駁理由不能全盤否定循環。"},{"id":"BIO-B01-Ch1.1.3-S050:D","text":"不能，物質可回收仍不表示能量能完整循環","explanation":"指出能量與物質的不同限制，才能合理反駁無需供能。"}],"concept":"生命系統需要能量供應工作，也需要物質作身體原料。光合生產者轉換光能並利用環境原料製造有機物，消費者取食以取得化學能與物質，分解者再把部分物質送回環境。能量則在各類生物活動時逐步散熱；補充原料、維持物質循環與持續供能是不同條件，不能互相替代。\n\n密閉通常是描述物質交換邊界，不代表沒有光熱交換。是否長期維持還要檢查能量來源；有三種功能角色不等於能量帳閉合。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1.1.3-B001","topicId":"BIO-1.1.3-WORK","stem":"兩株幼苗接受相同光照與水分。甲取得形成新組織所需的全部物質，乙缺其中一種必要原料。若只根據這些條件，何者推論最合理？","correct":"BIO-B01-Ch1.1.3-B001:B","options":[{"id":"BIO-B01-Ch1.1.3-B001:A","text":"乙只要有光就一定能以能量代替原料","explanation":"能量不能供應缺乏的原子，能源不取代原料。"},{"id":"BIO-B01-Ch1.1.3-B001:B","text":"甲可能具備較完整的生長條件，但不能據此保證生長量","explanation":"甲少了題設原料缺口，但其他條件未完全說明，結論適度。"},{"id":"BIO-B01-Ch1.1.3-B001:C","text":"兩株的細胞工作都不需要能量","explanation":"兩株生長和維持均包含需要能量的工作。"},{"id":"BIO-B01-Ch1.1.3-B001:D","text":"乙缺原料代表其體內立即沒有化學能","explanation":"缺原料與已有化學能是不同問題，不能推論能量立即歸零。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n題面支持甲在原料條件上較完整；光照、水分相同只控制部分因素，不能保證任何環境下的精確生長量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B002","topicId":"BIO-1.1.3-WORK","stem":"某細胞在觀察期間沒有分裂，但體積增加並合成新分子。下列何者最適合解讀其生長？","correct":"BIO-B01-Ch1.1.3-B002:C","options":[{"id":"BIO-B01-Ch1.1.3-B002:A","text":"沒有分裂，所以不可能有生長","explanation":"把生長窄化為分裂，忽略細胞變大與合成。"},{"id":"BIO-B01-Ch1.1.3-B002:B","text":"只有細胞數增加才需要能量","explanation":"單一細胞的合成與維持也需要能量。"},{"id":"BIO-B01-Ch1.1.3-B002:C","text":"細胞變大與合成也是生長相關工作","explanation":"符合本題觀察，生長的工作不限於細胞增數。"},{"id":"BIO-B01-Ch1.1.3-B002:D","text":"體積增加表示物質被轉成沒有原子的能量","explanation":"新分子形成仍需要原料，不能用物質消失解釋。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n生長可以表現在細胞數、體積與組成的改變，不必每次都伴隨細胞分裂。本題已給出變大與新分子合成，不能用未分裂否定它們。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B003","topicId":"BIO-1.1.3-WORK","stem":"某受傷組織維持原本體積，但舊分子持續被新的分子替換。哪項說法最有根據？","correct":"BIO-B01-Ch1.1.3-B003:A","options":[{"id":"BIO-B01-Ch1.1.3-B003:A","text":"體積不變不能排除物質更新與能量需求","explanation":"更新可在淨體積不變下進行，仍需供料供能。"},{"id":"BIO-B01-Ch1.1.3-B003:B","text":"既然體積不變，原料必定從未進出","explanation":"體積是淨結果，不能排除原料進出及轉換。"},{"id":"BIO-B01-Ch1.1.3-B003:C","text":"體積不變證明沒有任何合成工作","explanation":"題面已明說新分子替換，與沒有合成相矛盾。"},{"id":"BIO-B01-Ch1.1.3-B003:D","text":"只有體積變大後才可能出現熱散失","explanation":"維持與修補時也可能散熱，不以先增大為條件。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n這裡要分開淨變化與內部活動。等量的合成、分解或替換可使外觀體積大致相同，但實際的細胞工作仍持續。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B004","topicId":"BIO-1.1.3-WORK","stem":"教室模型設定：一個細胞工作模組每完成一次合成需消耗 2 能量單位；可用存量為 14 單位，原料足夠，期間沒有補充能量，其他能量消耗忽略。最多可完成幾次？","correct":"BIO-B01-Ch1.1.3-B004:D","options":[{"id":"BIO-B01-Ch1.1.3-B004:A","text":"5次","explanation":"5次只用10單位，仍有4單位可支持2次，未達最多。"},{"id":"BIO-B01-Ch1.1.3-B004:B","text":"6次","explanation":"6次用12單位，剩2單位仍可再完成一次。"},{"id":"BIO-B01-Ch1.1.3-B004:C","text":"8次","explanation":"8次需16單位，超過沒有補充的14單位存量。"},{"id":"BIO-B01-Ch1.1.3-B004:D","text":"7次","explanation":"7次剛好使用14單位，符合模型的整數次數上限。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n本題的能量單位和每次成本是模型設定，不是生物通用常數。次數上限＝可用存量÷每次需求＝14÷2＝7；不能靠材料足夠就超過供能上限。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B005","topicId":"BIO-1.1.3-WORK","stem":"在原料量與其他條件相同的模型中，甲進行細胞合成的供能途徑可用，乙的同一路徑被中斷。題目未提供其他替代能源。何者最穩妥？","correct":"BIO-B01-Ch1.1.3-B005:B","options":[{"id":"BIO-B01-Ch1.1.3-B005:A","text":"乙仍一定同速合成，因兩者原料相同","explanation":"原料相同不足以確定能量供應，因此不能保證同速。"},{"id":"BIO-B01-Ch1.1.3-B005:B","text":"乙的合成可能受限，原料相同不保證供能相同","explanation":"供能與原料是分開條件，乙缺供能途徑可能受限。"},{"id":"BIO-B01-Ch1.1.3-B005:C","text":"甲所有能量一定都變成新物質","explanation":"能量支持合成但不全變物質，還可能有散熱。"},{"id":"BIO-B01-Ch1.1.3-B005:D","text":"乙的細胞外形必定立刻完全消失","explanation":"題面沒有時間尺度或崩解資料，不能推論立即完全消失。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n控制原料只控制供料面。需能工作的供能若受阻，不能以材料相同推論工作速度必然相同；也不把可能受限擴大為立即全面消失。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B006","topicId":"BIO-1.1.3-WORK","stem":"某個體停止走動後仍合成蛋白質、修補組織。若要評估「停止走動是否等於停止所有做功」，下列判斷何者正確？","correct":"BIO-B01-Ch1.1.3-B006:C","options":[{"id":"BIO-B01-Ch1.1.3-B006:A","text":"兩者等同，因肉眼看不到位移","explanation":"肉眼位移只是部分表現，不代表細胞工作全停止。"},{"id":"BIO-B01-Ch1.1.3-B006:B","text":"無法判斷，因所有細胞活動都必須能被肉眼看到","explanation":"題面已提供內部活動證據，不需肉眼直接看細胞。"},{"id":"BIO-B01-Ch1.1.3-B006:C","text":"兩者不等同，合成與修補已是反例","explanation":"仍在合成和修補足以否定停止所有工作的全稱句。"},{"id":"BIO-B01-Ch1.1.3-B006:D","text":"只有植物的修補才算做功","explanation":"動物與植物的合成修補都屬生命工作，不能限於植物。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n要否定「所有做功都停止」，只需有一種仍持續的需能細胞工作。題設兩種活動已提供反例，不必另知精確能耗數字。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B007","topicId":"BIO-1.1.3-WORK","stem":"一個合成模型每組新結構需 3 份原料和 2 份能量。現有 15 份原料與 8 份能量，無補充且無其他消耗，最多完成幾組？","correct":"BIO-B01-Ch1.1.3-B007:B","options":[{"id":"BIO-B01-Ch1.1.3-B007:A","text":"3組","explanation":"3組尚剩6份原料和2份能量，還可完成一組。"},{"id":"BIO-B01-Ch1.1.3-B007:B","text":"4組","explanation":"原料上限5組、能源上限4組，共同可完成4組。"},{"id":"BIO-B01-Ch1.1.3-B007:C","text":"5組","explanation":"5組需要10份能量，超過8份，即使原料足夠也不行。"},{"id":"BIO-B01-Ch1.1.3-B007:D","text":"7組","explanation":"把兩種資源錯誤相加不能算組數，7組兩者均不足。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n分別算兩項資源上限：原料可供15÷3＝5組；能量可供8÷2＝4組。兩者都必須滿足，因此取較小的4組，剩餘3份原料不能代替缺的能量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B008","topicId":"BIO-1.1.3-WORK","stem":"兩個大小相同的細胞中，甲正在合成新分子，乙的細胞活動未被測量。只由大小相同，能否斷定兩者能量需求相同？","correct":"BIO-B01-Ch1.1.3-B008:D","options":[{"id":"BIO-B01-Ch1.1.3-B008:A","text":"能，細胞大小唯一決定所有能量需求","explanation":"大小不能替代活動種類與程度，不能保證需求相同。"},{"id":"BIO-B01-Ch1.1.3-B008:B","text":"能，分子合成不會使用能量","explanation":"合成需要能量，所以不能把甲的已知活動排除。"},{"id":"BIO-B01-Ch1.1.3-B008:C","text":"不能，因乙一定完全不需能量","explanation":"未測量不等於無需求，乙不能被斷定為零。"},{"id":"BIO-B01-Ch1.1.3-B008:D","text":"不能，仍須知道兩者進行哪些工作","explanation":"掌握工作狀態才有比較依據，符合題面資訊限制。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n外形相同無法交代活動種類與速率。甲確有合成工作；乙沒有資料，應保留未知，而不是把未知當成不活動。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B009","topicId":"BIO-1.1.3-WORK","stem":"某模型可用能量為 20 單位，其中 8 單位用於維持已存在的細胞工作；每次新合成另需 3 單位。原料足夠，無能量補充且其他能量消耗忽略，還能完成幾次新合成？","correct":"BIO-B01-Ch1.1.3-B009:A","options":[{"id":"BIO-B01-Ch1.1.3-B009:A","text":"4次","explanation":"先扣維持8單位，再用12÷3，結果為4次。"},{"id":"BIO-B01-Ch1.1.3-B009:B","text":"6次","explanation":"6次需18單位，連同維持共26單位，超過20。"},{"id":"BIO-B01-Ch1.1.3-B009:C","text":"9次","explanation":"9次需27單位，還沒計維持就已超過總存量。"},{"id":"BIO-B01-Ch1.1.3-B009:D","text":"12次","explanation":"12是剩餘能量單位，不是合成次數，還須除每次3單位。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n先扣除維持需求，20−8＝12單位，才是可供新合成的部分；12÷3＝4次。不能把維持細胞的工作當成不需要計入的項目。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B010","topicId":"BIO-1.1.3-WORK","stem":"教學展示中，甲組只獲原料，乙組只獲能源，丙組兩者皆有；題設新結構必須同時利用這兩類資源且沒有預存。哪組具備完成新結構的必要資源？","correct":"BIO-B01-Ch1.1.3-B010:C","options":[{"id":"BIO-B01-Ch1.1.3-B010:A","text":"只有甲","explanation":"甲缺能源，原料不能自行替代所需能量。"},{"id":"BIO-B01-Ch1.1.3-B010:B","text":"甲與乙","explanation":"甲與乙各缺一類必要資源，不能各自完成。"},{"id":"BIO-B01-Ch1.1.3-B010:C","text":"只有丙","explanation":"丙同時具備兩種必要資源，符合題設條件。"},{"id":"BIO-B01-Ch1.1.3-B010:D","text":"三組都有","explanation":"甲、乙各有明確缺口，因此不能判三組皆可。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n這是兩個必要條件的交集：供料和供能皆成立才有完成的可能。丙具備必要資源不等於保證所有其他條件也適合。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B011","topicId":"BIO-1.1.3-LIGHT","stem":"光合植物製造糖時，糖中碳原子的來源與糖所攜帶能量的主要來源，應如何分別辨認？","correct":"BIO-B01-Ch1.1.3-B011:B","options":[{"id":"BIO-B01-Ch1.1.3-B011:A","text":"兩者都是光，因為植物有受光","explanation":"光提供能量而非碳原料，不能給兩者相同來源。"},{"id":"BIO-B01-Ch1.1.3-B011:B","text":"碳來自環境原料；能量主要來自吸收的光","explanation":"將原料與光能分別定位，符合本題的兩條來源線。"},{"id":"BIO-B01-Ch1.1.3-B011:C","text":"碳來自熱；能量來自碳原子被消滅","explanation":"熱不是碳原子來源，原子也不被消滅來供此化學能。"},{"id":"BIO-B01-Ch1.1.3-B011:D","text":"兩者都只來自土壤礦物質","explanation":"礦物質供部分原料，不能取代光能或主要碳來源二氧化碳。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n要分開物質追蹤與能量追蹤：二氧化碳可提供碳原子，光提供能量。分子被製造是原料重組與能量轉換的結果，不是光本身成為碳原子。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B012","topicId":"BIO-1.1.3-LIGHT","stem":"兩瓶相同藻類的原料、溫度與其他條件相同；甲持續照光，乙遮光。只討論觀察期間「新輸入的光能轉成化學能」這件事，何者最合理？","correct":"BIO-B01-Ch1.1.3-B012:D","options":[{"id":"BIO-B01-Ch1.1.3-B012:A","text":"乙仍一定與甲等量引入光能","explanation":"遮光已阻止該光源輸入，不能宣稱新光能等量。"},{"id":"BIO-B01-Ch1.1.3-B012:B","text":"甲沒有原料需求，乙才需要原料","explanation":"照光與否都不免除製造有機物的原料需求。"},{"id":"BIO-B01-Ch1.1.3-B012:C","text":"乙若有存糖，表示當時也在引入新光能","explanation":"舊存糖只能證明有存量，不能證明當時吸收新光。"},{"id":"BIO-B01-Ch1.1.3-B012:D","text":"遮光會直接限制乙由光合途徑引入新能量","explanation":"新光能來源受遮蔽，正是此限定過程的直接限制。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n題目限定新光能輸入，不問總存糖量或是否立刻死亡。乙可仍有過去累積的化學能，但存量不能當作觀察期間的新光能輸入。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B013","topicId":"BIO-1.1.3-LIGHT","stem":"模型記錄某葉片收到 200 能量單位的光，其中 12 單位成為新有機物的化學能。題目只問這一項轉存量占入射光的百分比，答案為何？","correct":"BIO-B01-Ch1.1.3-B013:A","options":[{"id":"BIO-B01-Ch1.1.3-B013:A","text":"6%","explanation":"12除以200為0.06，換成百分比就是6%。"},{"id":"BIO-B01-Ch1.1.3-B013:B","text":"12%","explanation":"把12單位直接當12%，忽略分母200。"},{"id":"BIO-B01-Ch1.1.3-B013:C","text":"60%","explanation":"小數點錯置；60%代表120單位，與題設12不符。"},{"id":"BIO-B01-Ch1.1.3-B013:D","text":"188%","explanation":"188是能量差額，不能當作轉存百分比。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n所求比例＝12÷200×100%＝6%。數字是題設模型資料，不是所有植物的固定效率；未轉存的188單位還需其他資料才能分辨反射、穿透或散熱等去向。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B014","topicId":"BIO-1.1.3-LIGHT","stem":"某同學觀察光合植物在光照下製造有機物，便推論「只要照光，完全沒有水與其他原料也能形成新身體」。哪個理由最能否定這推論？","correct":"BIO-B01-Ch1.1.3-B014:C","options":[{"id":"BIO-B01-Ch1.1.3-B014:A","text":"新身體只需要熱而不需要光","explanation":"把光換成熱仍無法解決物質原料缺乏。"},{"id":"BIO-B01-Ch1.1.3-B014:B","text":"光能只能給消費者使用","explanation":"光合生產者可吸光，不限消費者，且消費者主要取食。"},{"id":"BIO-B01-Ch1.1.3-B014:C","text":"能量來源存在，不表示構成分子的原料也存在","explanation":"指出能源與原料不同，直接揭露題目的必要條件缺口。"},{"id":"BIO-B01-Ch1.1.3-B014:D","text":"植物製造有機物只代表它沒有用能","explanation":"植物既製造有機物也利用能量，並非不做功。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n光合作用涉及能源與原料的配合。原子要由水、二氧化碳等物質提供，不能由光照單獨補出全部身體材料。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B015","topicId":"BIO-1.1.3-LIGHT","stem":"同一批植物有機物在白天製造，之後夜間由動物取食。若追溯其中原先由陽光引入的能量，正確順序為何？","correct":"BIO-B01-Ch1.1.3-B015:B","options":[{"id":"BIO-B01-Ch1.1.3-B015:A","text":"食物化學能→光能→動物取食","explanation":"本題的化學能源自先前光能，這一段被倒置。"},{"id":"BIO-B01-Ch1.1.3-B015:B","text":"光能→植物有機物的化學能→動物取得化學能","explanation":"白天轉存、夜間傳遞，符合題設時間與能量形式。"},{"id":"BIO-B01-Ch1.1.3-B015:C","text":"動物取食→植物放出陽光→光合","explanation":"動物取食發生在有機物製造之後，不是其光源。"},{"id":"BIO-B01-Ch1.1.3-B015:D","text":"土壤礦物質→光能→動物直接吸光","explanation":"礦物質不是光源，動物也不是以取食直接吸光。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n先按時間定位光能被植物轉存，再依取食關係定位傳遞。黑暗只說明取食當時沒有光照，不會抹去有機物先前儲存的化學能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B016","topicId":"BIO-1.1.3-LIGHT","stem":"某模型中甲接收 100 單位光能，轉存 5 單位化學能；乙接收 80 單位，轉存 8 單位。只比較轉存量占各自輸入的比率，何者正確？","correct":"BIO-B01-Ch1.1.3-B016:A","options":[{"id":"BIO-B01-Ch1.1.3-B016:A","text":"甲5%，乙10%，乙較高","explanation":"兩組各用自己的輸入計算，乙的轉存比例較高。"},{"id":"BIO-B01-Ch1.1.3-B016:B","text":"甲5%，乙8%，乙較高","explanation":"乙分母是80，8÷80為10%，不是8%。"},{"id":"BIO-B01-Ch1.1.3-B016:C","text":"甲20%，乙10%，甲較高","explanation":"甲的計算把關係倒置或移錯小數點，實為5%。"},{"id":"BIO-B01-Ch1.1.3-B016:D","text":"甲100%，乙80%，甲較高","explanation":"把輸入數字當效率，沒有使用轉存量，比例錯誤。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n各組都要用自己的分母：甲5÷100＝5%；乙8÷80＝10%。比較的是比例，不能把乙的8單位直接寫為8%。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B017","topicId":"BIO-1.1.3-LIGHT","stem":"一個光合系統的紀錄寫「新有機物中的能量增加」，但未記錄照到系統的光能。可否據此斷定系統創造了能量？","correct":"BIO-B01-Ch1.1.3-B017:D","options":[{"id":"BIO-B01-Ch1.1.3-B017:A","text":"可以，凡存量增加都是能量創造","explanation":"增加可能來自外部能量轉入，不能直接稱創造。"},{"id":"BIO-B01-Ch1.1.3-B017:B","text":"可以，生物不遵守能量轉換的原則","explanation":"生物所做的是能量轉換，不是例外創造能量。"},{"id":"BIO-B01-Ch1.1.3-B017:C","text":"不可以，但可斷定有機物完全沒有能量","explanation":"紀錄說增加不支持完全沒有能量，反駁不可走向另一錯誤。"},{"id":"BIO-B01-Ch1.1.3-B017:D","text":"不可以，還須把外來能源輸入列入能量帳","explanation":"光能輸入是可能來源，漏記輸入不能證明無中生有。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n只量到系統內的增加而漏掉輸入，會把轉移誤判成創造。應檢查光等能源以及其他存量變化，再解釋化學能增加的來源。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B018","topicId":"BIO-1.1.3-LIGHT","stem":"對照紀錄顯示：有光且原料充足時，光合藻類能形成新有機物；完全遮光時，新光能輸入停止。哪一結論恰當？","correct":"BIO-B01-Ch1.1.3-B018:C","options":[{"id":"BIO-B01-Ch1.1.3-B018:A","text":"藻類的所有原有有機物會在遮光瞬間消失","explanation":"沒有量到舊有機物瞬間消失，不能如此推論。"},{"id":"BIO-B01-Ch1.1.3-B018:B","text":"任何非光合生物也一定能完成相同轉換","explanation":"此觀察限光合藻類，不能外推到任何非光合生物。"},{"id":"BIO-B01-Ch1.1.3-B018:C","text":"光是該光合轉能途徑的必要輸入，舊存量則需另外量測","explanation":"精確保留光合輸入與既有存量的區別。"},{"id":"BIO-B01-Ch1.1.3-B018:D","text":"光與原料是同一種物質","explanation":"光是能源，原料是物質，不能混為同類。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n本題資料可支持特定途徑受光條件影響，但沒有給出存量消耗的速度。輸入停止和庫存立即歸零不是同一件事。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B019","topicId":"BIO-1.1.3-LIGHT","stem":"某植物模型的新糖可提供 15 能量單位，已知來自吸收的 60 單位光能，且無其他能源。哪一句數量解讀正確？","correct":"BIO-B01-Ch1.1.3-B019:B","options":[{"id":"BIO-B01-Ch1.1.3-B019:A","text":"植物額外創造了15單位能量","explanation":"糖中的15單位來自已知光輸入，不是額外創造。"},{"id":"BIO-B01-Ch1.1.3-B019:B","text":"吸收能量中有25%轉存為這批糖的化學能","explanation":"用轉存量15除以輸入60，得25%。"},{"id":"BIO-B01-Ch1.1.3-B019:C","text":"其餘45單位都必定形成同量礦物質","explanation":"能量差額不是礦物質產量，其餘去向沒有全給出。"},{"id":"BIO-B01-Ch1.1.3-B019:D","text":"植物總能量變成75單位且不需考慮輸出","explanation":"把60和其內含去向15相加造成重複計數。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n新糖的轉存比例是15÷60＝25%。轉存是60單位輸入的一部分，不能把輸入和其中一個去向相加，否則會重複計算。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B020","topicId":"BIO-1.1.3-LIGHT","stem":"在一個以光合植物為唯一新食物來源的模型中，營養物質持續回收，但不再給任何光或其他能源。若系統仍有過去儲存的有機物，何者合理？","correct":"BIO-B01-Ch1.1.3-B020:C","options":[{"id":"BIO-B01-Ch1.1.3-B020:A","text":"物質回收可讓光能自行恢復","explanation":"回收成分不能創造光能，兩者不同。"},{"id":"BIO-B01-Ch1.1.3-B020:B","text":"生產者存在就保證無限期不需供能","explanation":"光合生產者仍需能源，僅存在不保證供能無限。"},{"id":"BIO-B01-Ch1.1.3-B020:C","text":"不能再引入新的光能，但既有化學能可暫時支持活動","explanation":"同時承認輸入中斷與既有存量，符合題設兩項條件。"},{"id":"BIO-B01-Ch1.1.3-B020:D","text":"所有生命活動必在關燈當下立即停止","explanation":"題目明列已有有機物，沒有依據說所有活動立即停止。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n由題目可確定新的光合能源停止，不能確定既有化學能能維持多久。原料回收和庫存使用都不能創造無限能量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B021","topicId":"BIO-1.1.3-PRODUCER","stem":"甲生物能吸光並利用無機原料製造有機物；乙只能攝取甲的有機物；丙分解甲、乙的遺留有機物。題設哪個角色最直接把光能引入食物資源？","correct":"BIO-B01-Ch1.1.3-B021:D","options":[{"id":"BIO-B01-Ch1.1.3-B021:A","text":"只有乙","explanation":"乙靠攝取既有有機物，並非題設光能入口。"},{"id":"BIO-B01-Ch1.1.3-B021:B","text":"只有丙","explanation":"丙使用遺留有機物，不是把光能首次引入的角色。"},{"id":"BIO-B01-Ch1.1.3-B021:C","text":"乙與丙","explanation":"兩者都利用甲等生物已有的化學能，沒有光合入口功能。"},{"id":"BIO-B01-Ch1.1.3-B021:D","text":"甲","explanation":"甲吸光並製造有機物，最直接連接外來光能與食物。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n分類要按題面給出的功能，不按生物數目或位置。甲直接轉換光能，乙和丙則利用既有有機物，三者仍各自需要供料供能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B022","topicId":"BIO-1.1.3-PRODUCER","stem":"某光合植物製造的糖一部分供自己生長，一部分被昆蟲取得。何者最能說明「生產者」並不等於「不需能量的供應者」？","correct":"BIO-B01-Ch1.1.3-B022:A","options":[{"id":"BIO-B01-Ch1.1.3-B022:A","text":"植物也以自己有機物中的化學能進行細胞工作","explanation":"植物生長和細胞工作也需要能量，直接支持題目要點。"},{"id":"BIO-B01-Ch1.1.3-B022:B","text":"昆蟲吃植物，所以植物全部能量都屬昆蟲","explanation":"部分被取得不等於全部屬昆蟲，植物也會使用和儲存。"},{"id":"BIO-B01-Ch1.1.3-B022:C","text":"只要有昆蟲吃糖，植物就不可能散熱","explanation":"昆蟲取食不會取消植物能量利用的散熱過程。"},{"id":"BIO-B01-Ch1.1.3-B022:D","text":"生產者只能傳遞物質而不能利用化學能","explanation":"植物能利用化學能，並非只傳物質的被動供應者。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n生產有機物與利用有機物可同時存在。植物在提供食物資源前後，都要維持自己的生命活動；不能只記輸出而漏掉其自身使用。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B023","topicId":"BIO-1.1.3-PRODUCER","stem":"假設一種藻類會游動，同時可利用光和無機原料合成有機物。有人因它會游動就判它不能是生產者，錯在哪裡？","correct":"BIO-B01-Ch1.1.3-B023:C","options":[{"id":"BIO-B01-Ch1.1.3-B023:A","text":"誤以為水中有光","explanation":"水中可有光，且題目已給出吸光能力，不是推論錯處。"},{"id":"BIO-B01-Ch1.1.3-B023:B","text":"忽略動作速度必須完全相同","explanation":"速度與是否具光合營養功能無直接分類關係。"},{"id":"BIO-B01-Ch1.1.3-B023:C","text":"將是否移動誤當作取得食物的功能分類標準","explanation":"題面已證明光合功能，不能只因會動就排除生產者。"},{"id":"BIO-B01-Ch1.1.3-B023:D","text":"未把游動視為能量無中生有的證據","explanation":"游動需要能量，並非創造能量的證據。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n移動描述行為，生產者描述營養功能。能游動可增加工作需求，但不會自動否定題設的光合製造有機物能力。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B024","topicId":"BIO-1.1.3-PRODUCER","stem":"在限定只有光合生產者能製造新食物的模型中，生產者全被移除，已有的有機物尚未用盡。最合理的短期判斷是？","correct":"BIO-B01-Ch1.1.3-B024:B","options":[{"id":"BIO-B01-Ch1.1.3-B024:A","text":"所有消費者必在同一瞬間失去體內全部物質","explanation":"外部角色改變不會讓個體原子瞬間消失。"},{"id":"BIO-B01-Ch1.1.3-B024:B","text":"由光能形成新食物的入口受阻，但舊食物仍可被利用","explanation":"同時符合新食物來源受阻與庫存尚存兩個條件。"},{"id":"BIO-B01-Ch1.1.3-B024:C","text":"只要有分解者便能把全部散熱變回新食物","explanation":"分解者能回收物質，但不能完整回收散熱供能。"},{"id":"BIO-B01-Ch1.1.3-B024:D","text":"消費者會立即全部變成光合生產者","explanation":"題面未給光合能力轉換，不能自行假設消費者立即改角色。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n移除特定功能會限制新資源補充，卻不使原有食物瞬間消失。題設沒有替代生產者，因此不能憑想像補上新的轉能入口。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B025","topicId":"BIO-1.1.3-PRODUCER","stem":"甲植物有葉且能光合；乙真菌分解枯葉；丙動物吃果實。三者皆不能離開培養容器。若判斷誰是本題生產者，應採何者？","correct":"BIO-B01-Ch1.1.3-B025:D","options":[{"id":"BIO-B01-Ch1.1.3-B025:A","text":"因都不能離開，所以三者都是","explanation":"活動範圍受限與是否能光合製造食物無關。"},{"id":"BIO-B01-Ch1.1.3-B025:B","text":"因都需要有機物，所以三者都不是","explanation":"生產者也使用有機物，不應因需求而取消其製造功能。"},{"id":"BIO-B01-Ch1.1.3-B025:C","text":"因乙能回收成分，所以只有乙是","explanation":"乙回收物質是分解功能，不等於題設光合生產。"},{"id":"BIO-B01-Ch1.1.3-B025:D","text":"依光合製造有機物的功能，甲是","explanation":"依甲的實際光合功能分類，避開位置與移動干擾。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n能否離開容器是題外條件，不能取代營養功能。甲能直接把光能轉入新有機物，乙和丙利用既有有機材料。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B026","topicId":"BIO-1.1.3-PRODUCER","stem":"某光合生產者在一段時間製造含 30 能量單位的新有機物，其中 12 單位供自己活動及伴隨的散熱，10 單位隨食物被動物取得，其餘仍儲存；無其他去向。儲存多少單位？","correct":"BIO-B01-Ch1.1.3-B026:A","options":[{"id":"BIO-B01-Ch1.1.3-B026:A","text":"8","explanation":"扣除自己使用與外傳兩部分，剩8單位儲存。"},{"id":"BIO-B01-Ch1.1.3-B026:B","text":"12","explanation":"12是自身活動用能，不是剩餘儲存。"},{"id":"BIO-B01-Ch1.1.3-B026:C","text":"20","explanation":"20是只扣外傳10單位、漏扣自身使用12單位的結果，真正儲存為8單位。"},{"id":"BIO-B01-Ch1.1.3-B026:D","text":"52","explanation":"把總量與其中去向相加會重複計算。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n按題設互不重疊的去向分帳：儲存＝30−12−10＝8單位。這是特定期間模型；自己活動用能也應計入，不能把生產者全部產物當作消費者所得。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B027","topicId":"BIO-1.1.3-PRODUCER","stem":"「生產者製造有機物，因此不需要從環境取得化學成分」這句話應如何修正？","correct":"BIO-B01-Ch1.1.3-B027:B","options":[{"id":"BIO-B01-Ch1.1.3-B027:A","text":"生產者只需要環境熱，不需要原子","explanation":"熱是能量，不能代替形成物質的原子。"},{"id":"BIO-B01-Ch1.1.3-B027:B","text":"有機物合成仍要由環境原料提供組成成分","explanation":"原料提供成分、光提供能量，才能理解光合製造有機物。"},{"id":"BIO-B01-Ch1.1.3-B027:C","text":"只要生產者不移動就無須任何原料","explanation":"是否移動不決定合成物質的原料需求。"},{"id":"BIO-B01-Ch1.1.3-B027:D","text":"生產者只能從動物遺體直接取得完整身體","explanation":"植物可吸收環境原料，無須由動物遺體直接取得完整身體。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n有機物的「製造」是已有原料的組合轉換。植物能合成有機物不代表能自創碳、水和礦物成分等物質來源。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B028","topicId":"BIO-1.1.3-PRODUCER","stem":"課堂把「生產者供應食物」畫成「光→植物有機物→動物」。如果要避免誤解植物只是轉交能量、自己完全不用，應加上哪條說明？","correct":"BIO-B01-Ch1.1.3-B028:C","options":[{"id":"BIO-B01-Ch1.1.3-B028:A","text":"植物中的能量總量可自行無限增加","explanation":"應補能量去向，不是加入創造能量的錯誤。"},{"id":"BIO-B01-Ch1.1.3-B028:B","text":"所有原料皆來自光而非環境","explanation":"原料是物質，不能以光作所有原料來源。"},{"id":"BIO-B01-Ch1.1.3-B028:C","text":"植物本身也利用化學能做功並散熱","explanation":"可同時表現生產者自身用能和向外傳遞。"},{"id":"BIO-B01-Ch1.1.3-B028:D","text":"植物必須等被吃掉後才會有細胞活動","explanation":"植物存活時已有細胞工作，不必等到被吃。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n簡化箭頭選擇性強調傳遞，可能漏掉生產者自身使用。補上分支到細胞工作及熱，能完善原圖而不改動合法食物方向。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B029","topicId":"BIO-1.1.3-PRODUCER","stem":"一個池塘有能光合的藻類、攝食藻類的動物及分解遺留物的細菌。若量到細菌利用化學能時向環境散熱，可否因此改判細菌是光合生產者？","correct":"BIO-B01-Ch1.1.3-B029:D","options":[{"id":"BIO-B01-Ch1.1.3-B029:A","text":"可以，所有散熱者都會光合","explanation":"散熱並非光合者專有，不能據此推出光合。"},{"id":"BIO-B01-Ch1.1.3-B029:B","text":"可以，分解者存在就代表能創造光","explanation":"分解者不會創造光供能，這與觀察無關。"},{"id":"BIO-B01-Ch1.1.3-B029:C","text":"不可以，因細菌不可能有任何營養作用","explanation":"細菌可有營養功能，題面已給出分解作用。"},{"id":"BIO-B01-Ch1.1.3-B029:D","text":"不可以，散熱證明能量轉換，不能單獨證明光合製造食物","explanation":"題設散熱支持化學能利用與轉換，但不足以支持光合生產者身分。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n不同角色都可利用化學能並散熱。因此散熱不是光合能力的特有證據，應仍依題設分解有機物的方式分類。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B030","topicId":"BIO-1.1.3-PRODUCER","stem":"甲生物以光及無機原料製造有機物，乙生物吃甲但也能移動。要證明甲與乙角色不同，最有判別力的資訊是？","correct":"BIO-B01-Ch1.1.3-B030:A","options":[{"id":"BIO-B01-Ch1.1.3-B030:A","text":"兩者取得有機物及其能量的方式","explanation":"題定光合製造與取食正是兩類功能的差異。"},{"id":"BIO-B01-Ch1.1.3-B030:B","text":"兩者是否處於同一容器","explanation":"同一容器可以同時有不同角色，不能作判別。"},{"id":"BIO-B01-Ch1.1.3-B030:C","text":"兩者的名稱長短","explanation":"名稱是標籤，無法代表營養功能。"},{"id":"BIO-B01-Ch1.1.3-B030:D","text":"兩者是否都由細胞構成","explanation":"兩類生物皆可由細胞構成，這是共同點而非角色差異。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n與角色直接相關的變項是是否利用光與原料合成有機物，或攝取既有有機物。共同條件不能有效區別生產者與消費者。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B031","topicId":"BIO-1.1.3-CONSUMER","stem":"野兔吃植物，狐狸吃野兔。假設只追蹤由植物食物傳出的化學能，對狐狸最恰當的描述是？","correct":"BIO-B01-Ch1.1.3-B031:C","options":[{"id":"BIO-B01-Ch1.1.3-B031:A","text":"狐狸未吃植物，故能量不可能源自植物","explanation":"多段食物關係仍可傳遞化學能，不需直接吃植物。"},{"id":"BIO-B01-Ch1.1.3-B031:B","text":"狐狸直接吸收植物曾接收的光線","explanation":"狐狸取食的是有機物，並非直接吸收那段光線。"},{"id":"BIO-B01-Ch1.1.3-B031:C","text":"狐狸透過野兔的有機物間接取得原先由植物引入的能量","explanation":"依植物到野兔再到狐狸的題設方向可逐段追溯。"},{"id":"BIO-B01-Ch1.1.3-B031:D","text":"狐狸只取得野兔的物質，不取得化學能","explanation":"野兔有機物同時包含物質和化學能，不能只保留其一。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n能量可經一個以上消費者傳遞。近端來源是野兔食物的化學能，更早可追溯至植物光合；間接來源不等於直接吸光。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B032","topicId":"BIO-1.1.3-CONSUMER","stem":"某昆蟲攝食的葉片有機物，一部分成為昆蟲身體，一部分在能量利用後相關成分回到環境。哪個記錄方式最完整？","correct":"BIO-B01-Ch1.1.3-B032:B","options":[{"id":"BIO-B01-Ch1.1.3-B032:A","text":"只記昆蟲增加的體重，視為全部食物去向","explanation":"增重只反映部分留存，未包含離開或被使用的部分。"},{"id":"BIO-B01-Ch1.1.3-B032:B","text":"記錄物質進出與身體留存，另記化學能的利用和散熱","explanation":"分別追蹤兩類資源才能同時處理身體組成和用能。"},{"id":"BIO-B01-Ch1.1.3-B032:C","text":"把所有攝入物質都列為已變成熱","explanation":"物質成分不因用能就全變成熱，這混淆兩本帳。"},{"id":"BIO-B01-Ch1.1.3-B032:D","text":"把所有食物能量都列為永久儲存在昆蟲體內","explanation":"活動會使用能量並散熱，不能假定全數永久儲存。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n攝入量不等於淨增長；有留存，也有轉換後輸出。物質和能量要分別核算，體重一項不能完整代表食物使用。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B033","topicId":"BIO-1.1.3-CONSUMER","stem":"某幼蟲一天攝入 18 份物質，其中 5 份排出、4 份以其他已量測物質形式離開，無其他物質進出。其體內物質淨增加多少份？","correct":"BIO-B01-Ch1.1.3-B033:A","options":[{"id":"BIO-B01-Ch1.1.3-B033:A","text":"9份","explanation":"扣除兩種已知物質輸出後，淨留存9份。"},{"id":"BIO-B01-Ch1.1.3-B033:B","text":"13份","explanation":"只扣排出5份，漏掉其他4份物質輸出。"},{"id":"BIO-B01-Ch1.1.3-B033:C","text":"18份","explanation":"把攝入量當成淨增加，忽略所有輸出。"},{"id":"BIO-B01-Ch1.1.3-B033:D","text":"27份","explanation":"把輸入和輸出相加，與計算淨增加方向相反。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n物質淨增加＝輸入−全部物質輸出＝18−5−4＝9份。此模型是在算物質份數，不是從食物能量扣除散熱；不能混用兩種單位。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B034","topicId":"BIO-1.1.3-CONSUMER","stem":"某池塘的圖用箭頭表示「食物及其中資源從來源到取得者」，已知小型甲蟲吃水草，魚吃甲蟲。哪種畫法符合定義？","correct":"BIO-B01-Ch1.1.3-B034:D","options":[{"id":"BIO-B01-Ch1.1.3-B034:A","text":"魚→甲蟲→水草","explanation":"箭頭逆向，表示由取得者回指食物來源。"},{"id":"BIO-B01-Ch1.1.3-B034:B","text":"甲蟲→魚→水草","explanation":"甲蟲到魚正確，但魚到水草無題設支持。"},{"id":"BIO-B01-Ch1.1.3-B034:C","text":"水草→魚→甲蟲","explanation":"水草到魚未由題設給出，魚到甲蟲則反向。"},{"id":"BIO-B01-Ch1.1.3-B034:D","text":"水草→甲蟲→魚","explanation":"被吃的水草先傳給甲蟲，再傳給吃甲蟲的魚。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n圖的箭頭意義已在題面明定，所以要依資源流向作答，而不是依捕食行為的動作方向。兩段都必須與已知取食關係吻合。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B035","topicId":"BIO-1.1.3-CONSUMER","stem":"同樣是動物取得食物，甲直接吃果實，乙吃以果實為食的昆蟲。若忽略其他食物來源，何者正確？","correct":"BIO-B01-Ch1.1.3-B035:B","options":[{"id":"BIO-B01-Ch1.1.3-B035:A","text":"甲取得光能，乙才取得化學能","explanation":"果實也提供化學能，不是直接光能。"},{"id":"BIO-B01-Ch1.1.3-B035:B","text":"甲、乙取得的都是有機物化學能，但傳遞段數不同","explanation":"兩者皆由食物取能，近端來源與傳遞段數不同。"},{"id":"BIO-B01-Ch1.1.3-B035:C","text":"乙隔了一層，食物便不再含物質","explanation":"昆蟲仍含原子和分子，隔一段不使物質消失。"},{"id":"BIO-B01-Ch1.1.3-B035:D","text":"兩者一定取得完全相同總量的能量","explanation":"食物量、能量含量與去向未給出，不能斷言數量相同。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n兩者當下都吃有機物，所以能量形式相同；但甲直接取得植物食物，乙多經昆蟲。題面沒有份量與轉換資料，不能由形式相同推出總量相同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B036","topicId":"BIO-1.1.3-CONSUMER","stem":"動物吃下含 40 能量單位的有機物。模型設定 10 單位仍在排出的有機物中，8 單位儲存在體內，其餘用於本期間活動及散熱。後一項合計多少？","correct":"BIO-B01-Ch1.1.3-B036:A","options":[{"id":"BIO-B01-Ch1.1.3-B036:A","text":"22單位","explanation":"扣除排出和儲存兩項後，活動及散熱共22單位。"},{"id":"BIO-B01-Ch1.1.3-B036:B","text":"30單位","explanation":"30是只扣排出10，漏扣儲存8。"},{"id":"BIO-B01-Ch1.1.3-B036:C","text":"32單位","explanation":"32只扣儲存8，漏扣排出有機物中的10。"},{"id":"BIO-B01-Ch1.1.3-B036:D","text":"58單位","explanation":"將總量與其中部分相加，重複計數且超過40。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n用於活動及散熱＝40−10−8＝22單位。排出有機物中的能量仍可能在別處被利用，與已經散失的熱不能合為同一類。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B037","topicId":"BIO-1.1.3-CONSUMER","stem":"一隻吃葉動物在夜間取食；葉片曾於白天進行光合作用。以下哪個結論不依賴當時有陽光照射動物？","correct":"BIO-B01-Ch1.1.3-B037:C","options":[{"id":"BIO-B01-Ch1.1.3-B037:A","text":"動物將夜空的光全部轉存為食物","explanation":"題面是取食葉片，沒有動物把夜光轉存的功能。"},{"id":"BIO-B01-Ch1.1.3-B037:B","text":"沒有當時的光，葉片絕無化學能","explanation":"葉片可以保有白天形成的有機物化學能。"},{"id":"BIO-B01-Ch1.1.3-B037:C","text":"動物可由白天已形成的葉片有機物取得化學能","explanation":"既有食物可在夜間提供化學能，不需動物當時照光。"},{"id":"BIO-B01-Ch1.1.3-B037:D","text":"夜間取食證明食物能量不可能源自太陽","explanation":"太陽能可先轉存再延後利用，不能以夜間排除來源。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n能量可先被光合生物儲存在有機物中，再延後被取食。時間不同不改變能量的更早來源，也不使消費者變成光合者。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B038","topicId":"BIO-1.1.3-CONSUMER","stem":"某消費者把攝入食物的部分成分合成自己的組織。這可支持哪一結論？","correct":"BIO-B01-Ch1.1.3-B038:D","options":[{"id":"BIO-B01-Ch1.1.3-B038:A","text":"消費者只取得能量，組織原子來自能量","explanation":"身體原子由物質原料供給，不能只靠能量。"},{"id":"BIO-B01-Ch1.1.3-B038:B","text":"每個食物分子必定原封不動成為同一種組織","explanation":"使用成分不要求完整分子原封不動，會有轉換。"},{"id":"BIO-B01-Ch1.1.3-B038:C","text":"食物成分一旦被攝取就不再可能返回環境","explanation":"成分仍可經排出、死亡或分解回到環境。"},{"id":"BIO-B01-Ch1.1.3-B038:D","text":"食物同時可提供身體原料，且可能經分解與重組後使用","explanation":"保留部分、重組和供料的意義，符合題目觀察。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n進入身體的物質可以先分解成可利用成分，再參與合成。題設只支持部分成分成為組織，不能推成全部分子保持不變。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B039","topicId":"BIO-1.1.3-CONSUMER","stem":"研究者只知道某動物攝入 10 克食物，尚未量測食物所含化學能及體內去向。哪一項必須保留為未知？","correct":"BIO-B01-Ch1.1.3-B039:C","options":[{"id":"BIO-B01-Ch1.1.3-B039:A","text":"動物攝入的是物質","explanation":"題目直接給出10克食物，已知確有物質輸入。"},{"id":"BIO-B01-Ch1.1.3-B039:B","text":"食物具有分子組成","explanation":"食物是物質並具分子組成，不是此處缺失的數量資訊。"},{"id":"BIO-B01-Ch1.1.3-B039:C","text":"其中有多少能量被用於活動並散熱","explanation":"缺能量含量和去向，不能計算工作及散熱總量。"},{"id":"BIO-B01-Ch1.1.3-B039:D","text":"動物的取食可使食物成分進入體內","explanation":"這是取食的基本物質傳遞，與未知的能量數值不同。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n克是質量單位，不是能量單位。即使食物提供化學能，光憑10克也不知道每克含多少可用能量，更不能確定其中分配到工作與散熱的量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B040","topicId":"BIO-1.1.3-CONSUMER","stem":"甲說「消費者吃到的是食物」，乙說「食物中的能量可追溯到植物吸收的光」。在本題限定的光合食物來源下，兩句關係為何？","correct":"BIO-B01-Ch1.1.3-B040:B","options":[{"id":"BIO-B01-Ch1.1.3-B040:A","text":"互相矛盾，因為一份食物只能有一種來源描述","explanation":"不同步驟的來源描述可相容，並無必要矛盾。"},{"id":"BIO-B01-Ch1.1.3-B040:B","text":"可同時成立，分別談當下取得形式和更早能源來源","explanation":"兩句依次對應取食及光合引入，能共同解釋傳遞。"},{"id":"BIO-B01-Ch1.1.3-B040:C","text":"甲必錯，消費者實際吃到光束","explanation":"消費者吃到的是物質，食物中的化學能不是光束。"},{"id":"BIO-B01-Ch1.1.3-B040:D","text":"乙必錯，能量不能經植物傳給動物","explanation":"能量可以藉有機物傳遞，這是本節食物關係的核心。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n應區分近端食物與早期能源。消費者當下攝入有機物，其中化學能可能先由植物轉換光能而來，兩種說法描述不同步驟。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B041","topicId":"BIO-1.1.3-HEAT","stem":"一個模型把 50 能量單位的化學能分為本期間對外做功 18 單位與熱輸出 32 單位，沒有儲存或其他輸出。何者正確？","correct":"BIO-B01-Ch1.1.3-B041:C","options":[{"id":"BIO-B01-Ch1.1.3-B041:A","text":"有用工作是50單位","explanation":"忽略32單位已列為熱，不能全部算有用工作。"},{"id":"BIO-B01-Ch1.1.3-B041:B","text":"只剩18單位能量仍存在","explanation":"熱輸出的32仍是能量，不是只剩18存在。"},{"id":"BIO-B01-Ch1.1.3-B041:C","text":"化學能的兩個去向合計等於原來50單位","explanation":"兩項合計50，符合題設封閉的數量分配。"},{"id":"BIO-B01-Ch1.1.3-B041:D","text":"散出的32單位不屬能量","explanation":"熱是能量去向之一，不能為平帳而排除。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n核對能量帳：18＋32＝50。有用工作只是18，而32以熱輸出；把環境計入，熱並未消失，因此不需要假設能量被消滅。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B042","topicId":"BIO-1.1.3-HEAT","stem":"對「生物活動時產生熱」的兩種解釋，甲認為能量被消滅，乙認為部分化學能轉換並傳到環境。哪個判斷較合理？","correct":"BIO-B01-Ch1.1.3-B042:A","options":[{"id":"BIO-B01-Ch1.1.3-B042:A","text":"乙；需把生物及周圍環境一起考慮能量去向","explanation":"乙保留能量形式與位置變化，符合散熱的意義。"},{"id":"BIO-B01-Ch1.1.3-B042:B","text":"甲；熱一離開生物就不算能量","explanation":"熱到環境仍是能量，不能以離體判為消滅。"},{"id":"BIO-B01-Ch1.1.3-B042:C","text":"兩者都對，因兩句完全相同","explanation":"消滅與轉移不同，兩種解釋不能同時當成同義。"},{"id":"BIO-B01-Ch1.1.3-B042:D","text":"兩者都錯，正常生命不會散熱","explanation":"生物利用化學能時常伴隨散熱，不能全盤否定。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n系統邊界決定「離開」誰。熱離開生物體會進入周圍，這是能量轉移，不能把局部可用化學能減少寫成總能量被消滅。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B043","topicId":"BIO-1.1.3-HEAT","stem":"觀察到生長中的植物與分解枯葉的真菌都向周圍散熱。只根據本節，下列哪項解釋最恰當？","correct":"BIO-B01-Ch1.1.3-B043:D","options":[{"id":"BIO-B01-Ch1.1.3-B043:A","text":"植物散熱表示它失去生產者身分","explanation":"生產者也需要用能並散熱，兩者並不衝突。"},{"id":"BIO-B01-Ch1.1.3-B043:B","text":"真菌散熱表示它能直接光合","explanation":"真菌散熱不能證明光合，只說明能量有轉換。"},{"id":"BIO-B01-Ch1.1.3-B043:C","text":"兩者散熱證明所有能量都完整循環","explanation":"散熱反而說明有能量流出，不支持完整循環。"},{"id":"BIO-B01-Ch1.1.3-B043:D","text":"不同營養角色都會利用化學能進行細胞工作","explanation":"兩者皆有細胞活動，解釋共同現象且不過度推論。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n散熱屬共同的用能過程，光合、取食與分解是不同資源取得功能；共同散熱不會抹去角色差異。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B044","topicId":"BIO-1.1.3-HEAT","stem":"某裝置量得活動中的生物向外做功 6 單位、散熱 14 單位，體內能量存量減少 20 單位，無輸入及其他去向。這些數字如何解讀？","correct":"BIO-B01-Ch1.1.3-B044:B","options":[{"id":"BIO-B01-Ch1.1.3-B044:A","text":"散熱14單位是額外創造的能量","explanation":"14可由原存量轉出，不需要無中生有。"},{"id":"BIO-B01-Ch1.1.3-B044:B","text":"20單位存量的去向可由6單位工作與14單位熱說明","explanation":"6＋14＝20，去向完整且未重複計數。"},{"id":"BIO-B01-Ch1.1.3-B044:C","text":"生物總共消耗40單位，因須把各數相加","explanation":"將總量20再加分項20會把同一份能量算兩次。"},{"id":"BIO-B01-Ch1.1.3-B044:D","text":"做功6單位後，熱才可能開始發生","explanation":"總量資料不能給先後順序，也不支持熱只在工作後出現。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n存量減少20是總變化，6與14是它的分項，不能三者相加。數字只給期間總量，沒有說明工作與熱的先後；兩者可同時發生。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B045","topicId":"BIO-1.1.3-HEAT","stem":"生物處理有機物時，一部分能量支持工作，另一部分同時散熱。若圖中只畫「化學能→全部有用工作」，最恰當的修正是？","correct":"BIO-B01-Ch1.1.3-B045:A","options":[{"id":"BIO-B01-Ch1.1.3-B045:A","text":"補上化學能轉向熱的分支，並避免全部用於工作的說法","explanation":"修正漏項和全稱敘述，符合已知同時散熱。"},{"id":"BIO-B01-Ch1.1.3-B045:B","text":"把熱改畫成能量被消滅的終點","explanation":"熱仍是能量，不是被消滅後的非能量。"},{"id":"BIO-B01-Ch1.1.3-B045:C","text":"改成只有動物才會產熱","explanation":"植物與分解者也可散熱，不應增加錯誤角色限制。"},{"id":"BIO-B01-Ch1.1.3-B045:D","text":"先把所有原料刪除，因能量可替代物質","explanation":"能量圖的漏項不影響物質必須存在，不能刪原料。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n題目已給出兩個同時存在的去向；分支可以直接保留兩者。熱流出與有用工作合計屬能量分配，不能漏掉其中一項。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B046","topicId":"BIO-1.1.3-HEAT","stem":"一個假設模型投入 80 能量單位，對外做功 20 單位，其餘全以熱輸出；沒有儲存。熱輸出占投入多少百分比？","correct":"BIO-B01-Ch1.1.3-B046:D","options":[{"id":"BIO-B01-Ch1.1.3-B046:A","text":"20%","explanation":"20是工作量值，不是熱的百分比。"},{"id":"BIO-B01-Ch1.1.3-B046:B","text":"25%","explanation":"25%是20÷80的工作比例，不是熱比例。"},{"id":"BIO-B01-Ch1.1.3-B046:C","text":"60%","explanation":"60是熱單位數，直接加百分號忽略了分母80。"},{"id":"BIO-B01-Ch1.1.3-B046:D","text":"75%","explanation":"熱60占80的四分之三，即75%。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n先求熱：80−20＝60單位；再以投入80為分母，60÷80＝75%。60是能量量值，75%才是題目所問的比例。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B047","topicId":"BIO-1.1.3-HEAT","stem":"一位學生說「只要把熱留在容器內，生物就能把它全部再做成食物，所以不需其他能源」。這項結論的缺口是什麼？","correct":"BIO-B01-Ch1.1.3-B047:B","options":[{"id":"BIO-B01-Ch1.1.3-B047:A","text":"容器內不可能出現熱","explanation":"容器可有熱，問題不在熱能否存在。"},{"id":"BIO-B01-Ch1.1.3-B047:B","text":"熱保留不等於可被完整回收為生物可用的化學能","explanation":"辨明空間留存與可用形式，正好指出推論缺口。"},{"id":"BIO-B01-Ch1.1.3-B047:C","text":"所有物質一遇熱就立即消失","explanation":"一般散熱不會把物質全部消滅，這不是正確理由。"},{"id":"BIO-B01-Ch1.1.3-B047:D","text":"只要加更多分解者就必能證明此結論","explanation":"分解者也利用化學能並散熱，數量增加不能保證完整回收。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n保留能量在某邊界內與能夠反覆有效利用它，是不同條件。生物通常不能把散出的熱直接完整重建為食物化學能；空間留存不能單獨證明循環。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B048","topicId":"BIO-1.1.3-HEAT","stem":"甲模型消耗 30 單位化學能，做功 10、散熱20；乙消耗同量，做功12、散熱18，均無其他去向。哪項比較成立？","correct":"BIO-B01-Ch1.1.3-B048:C","options":[{"id":"BIO-B01-Ch1.1.3-B048:A","text":"乙做功較多，所以創造了2單位能量","explanation":"乙的工作增加由熱份額減少對應，總量仍30。"},{"id":"BIO-B01-Ch1.1.3-B048:B","text":"甲與乙做功總量相同","explanation":"工作分別10與12，並非相同。"},{"id":"BIO-B01-Ch1.1.3-B048:C","text":"兩者能量帳都平衡，工作和熱的分配不同","explanation":"兩帳均加總30，差別是去向分配而不是總能量創造。"},{"id":"BIO-B01-Ch1.1.3-B048:D","text":"乙散熱較少，代表乙完全沒有能量流出","explanation":"乙仍散熱18單位，不能把較少說成沒有。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n甲10＋20＝30，乙12＋18＝30，兩者總投入與去向都相等。乙將更多分配給工作，但仍有18單位熱，不能稱能量創造或零散熱。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B049","topicId":"BIO-1.1.3-HEAT","stem":"某紀錄只量到動物散熱 9 能量單位，未量到工作、存量或輸入。能否據此斷定這段期間只使用了9單位化學能？","correct":"BIO-B01-Ch1.1.3-B049:A","options":[{"id":"BIO-B01-Ch1.1.3-B049:A","text":"不能，9只是一種已量測去向，其他項目尚缺","explanation":"散熱9不包含其他未知去向，因此不足以確定總用能。"},{"id":"BIO-B01-Ch1.1.3-B049:B","text":"能，熱量總是等於所有細胞工作量","explanation":"熱與工作不同，沒有總是相等的此種關係。"},{"id":"BIO-B01-Ch1.1.3-B049:C","text":"能，因生物不可能儲存能量","explanation":"生物可儲存有機物化學能，不能用錯誤前提反推。"},{"id":"BIO-B01-Ch1.1.3-B049:D","text":"不能，因為熱不是能量","explanation":"熱確是能量，不能以否認熱作為拒絕推論的理由。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n單一輸出項不是完整能量帳。若還有工作、儲存或其他能源來源，總使用量可能不同；合理界線是保留未知而非補猜數字。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B050","topicId":"BIO-1.1.3-HEAT","stem":"生產者、消費者與分解者每組都觀察到熱輸出。若有人以此主張三者取得食物的方式完全相同，最好的回應是？","correct":"BIO-B01-Ch1.1.3-B050:D","options":[{"id":"BIO-B01-Ch1.1.3-B050:A","text":"接受，散熱即表示三者都吃動物","explanation":"散熱不能證明吃動物，植物和分解者有其他來源。"},{"id":"BIO-B01-Ch1.1.3-B050:B","text":"接受，所有發熱者都做光合作用","explanation":"光合作用不是所有產熱生物的共同功能。"},{"id":"BIO-B01-Ch1.1.3-B050:C","text":"拒絕，因分解者的熱不是能量","explanation":"分解者輸出的熱仍屬能量，這不是正確反駁。"},{"id":"BIO-B01-Ch1.1.3-B050:D","text":"拒絕，共同用能現象不決定各自取得有機物的方式","explanation":"區分用能結果與營養取得方式，推論範圍正確。"}],"concept":"生物利用食物中的化學能進行工作時，部分能量同時以熱傳到環境。散熱不是能量被消滅，而是能量形式與所在位置改變；生產者、消費者和分解者都有這種轉換。不能把所有化學能都算成有用的工作，也不能假定熱只在活動完全結束後才出現。\n\n同一結果可能由不同角色的細胞活動呈現。散熱是用能結果，資源如何取得則需分別看光合、取食或分解，不可從共同點推出所有功能相同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第7張／正文第5頁；正式第8張／正文第6頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-B051","topicId":"BIO-1.1.3-FLOW","stem":"某模型只保留「環境原料→植物→動物→分解者→環境原料」的閉合圈，卻用它代表全部能量路徑。最需要補上的資訊為何？","correct":"BIO-B01-Ch1.1.3-B051:B","options":[{"id":"BIO-B01-Ch1.1.3-B051:A","text":"所有原料如何變成光","explanation":"原料不是能源變光的此種轉換鏈，不能如此補圖。"},{"id":"BIO-B01-Ch1.1.3-B051:B","text":"外來能源輸入與各類生物的熱輸出","explanation":"補上輸入與散熱才呈現能量通常不閉合循環的特徵。"},{"id":"BIO-B01-Ch1.1.3-B051:C","text":"所有消費者必定同時吃分解者","explanation":"並非題設或能量完整性的必要條件，不能強加取食關係。"},{"id":"BIO-B01-Ch1.1.3-B051:D","text":"每個原子在循環中被消滅的時間","explanation":"物質循環不需要原子被消滅，這反而違背其意義。"}],"concept":"能量通常以光進入生態系，轉成有機物中的化學能，再供生物使用，最後逐步以熱離開。生物間可以傳遞尚存的化學能，但不能把已散失的熱直接完整回收成同等可用的食物能量。因此能量流動不是像原料一樣的閉合循環，系統長期運作仍需要能量輸入。\n\n原圖的閉合圈適合描述部分物質成分。完整能量圖還需入口與出口：常見光能引入，以及各類生物用能後散熱，不能只沿原料的圈複製。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁；正式第11張／正文第9頁","shuffle":
