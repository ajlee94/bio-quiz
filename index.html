1.1-S036:B","options":[{"id":"BIO-B01-Ch1.1-S036:A","text":"單隻動物一分鐘內增加散熱","explanation":"短期散熱直接屬個體調節。"},{"id":"BIO-B01-Ch1.1-S036:B","text":"族群中有利的可遺傳特徵經多代變常見","explanation":"此項具族群、遺傳性、有利性及多代關係。"},{"id":"BIO-B01-Ch1.1-S036:C","text":"一株幼苗本週變高","explanation":"同株變高是生長，不是跨代族群改變。"},{"id":"BIO-B01-Ch1.1-S036:D","text":"一片葉受碰觸後閉合","explanation":"一次閉合是刺激反應。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：演化適應需要把焦點放在族群跨世代的遺傳特徵累積。其他選項各為個體調節、成長或短期反應。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S037","topicId":"BIO-C1.1I-ADAPT","stem":"具有保護色的可遺傳特徵在某環境中有助留下後代，經多代變得常見。最直接的解釋為何？","correct":"BIO-B01-Ch1.1-S037:C","options":[{"id":"BIO-B01-Ch1.1-S037:A","text":"個體想要某性狀就立刻得到","explanation":"需要或意願不是特徵立刻形成的科學機制。"},{"id":"BIO-B01-Ch1.1-S037:B","text":"所有個體同時主動變色","explanation":"題面描述世代比例變化，非所有個體同時變色。"},{"id":"BIO-B01-Ch1.1-S037:C","text":"不同可遺傳特徵的繁殖成功有差異","explanation":"此項說出遺傳差異與繁殖成功的關聯。"},{"id":"BIO-B01-Ch1.1-S037:D","text":"每個個體都必定長得完全相同","explanation":"有利特徵增加不表示所有個體立即完全相同。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：題設的差異具有遺傳性，且與留下後代的結果相連。天擇可使有利特徵在族群增加，不需假設個體意志創造性狀。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S038","topicId":"BIO-C1.1I-ADAPT","stem":"關於演化適應，下列何者正確？","correct":"BIO-B01-Ch1.1-S038:D","options":[{"id":"BIO-B01-Ch1.1-S038:A","text":"任何當天的個體調整都算演化","explanation":"當天的個體調整可能是調節或反應。"},{"id":"BIO-B01-Ch1.1-S038:B","text":"只要需要某性狀，該性狀就一定出現","explanation":"需要本身不保證對應遺傳性狀產生。"},{"id":"BIO-B01-Ch1.1-S038:C","text":"不必關心性狀是否可遺傳","explanation":"無法遺傳的改變不能直接依此傳給後代累積。"},{"id":"BIO-B01-Ch1.1-S038:D","text":"須注意族群、可遺傳差異及世代累積","explanation":"此項列出判讀演化適應的核心尺度與條件。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：適應的演化解釋依賴可遺傳差異在多代繁殖中累積，不是把個體的即時變化改名為演化。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S039","topicId":"BIO-C1.1I-ADAPT","stem":"下列何者最明確屬個體當下的調整，而非本次已證明的演化適應？","correct":"BIO-B01-Ch1.1-S039:A","options":[{"id":"BIO-B01-Ch1.1-S039:A","text":"一隻動物在熱環境中增加散熱","explanation":"此項只提供當下散熱，是個體調整。"},{"id":"BIO-B01-Ch1.1-S039:B","text":"有利遺傳特徵的族群比例多代上升","explanation":"多代的遺傳特徵比例變化屬於演化尺度。"},{"id":"BIO-B01-Ch1.1-S039:C","text":"有某遺傳特徵的個體留下較多後代","explanation":"遺傳特徵與繁殖成功的關係是天擇的關鍵。"},{"id":"BIO-B01-Ch1.1-S039:D","text":"多代後族群可遺傳外觀與環境更相符","explanation":"多代族群可遺傳外觀改變符合適應的觀察尺度。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：第一項直接描述個體短期控制，沒有跨代遺傳變化。其餘均是題設中可連到演化適應的世代或繁殖成功線索。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S040","topicId":"BIO-C1.1I-ADAPT","stem":"在演化適應的敘述中，為何特別標明「可遺傳」？","correct":"BIO-B01-Ch1.1-S040:B","options":[{"id":"BIO-B01-Ch1.1-S040:A","text":"表示性狀一定由個體意志創造","explanation":"遺傳性不涉及個體意願直接創造性狀。"},{"id":"BIO-B01-Ch1.1-S040:B","text":"表示性狀差異能經繁殖傳到後代","explanation":"傳至後代使跨代累積成為可能。"},{"id":"BIO-B01-Ch1.1-S040:C","text":"表示性狀永遠適合所有環境","explanation":"特徵是否有利取決於環境條件。"},{"id":"BIO-B01-Ch1.1-S040:D","text":"表示個體不再需要能量","explanation":"遺傳性與是否需要能量沒有這種關係。"}],"concept":"演化適應著重族群跨世代的改變。若個體間有可遺傳差異，其中某些特徵在特定環境有利於留下後代，相關特徵便可能在後續世代增加。天擇不是因為個體需要某性狀而讓它立刻產生，也不是每種改變都更有利。觀察時要核對遺傳性、繁殖成功及世代尺度；單一個體的短期變色、散熱或長大不足以證明演化適應。\n\n本題判讀：差異若能傳給後代，才有跨世代累積的基礎。可遺傳不等於必有利、永不變化或免除生命活動所需能量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S041","topicId":"BIO-C1.1I-THEMES","stem":"使用五個統整主題整理生物學內容，最主要的用意為何？","correct":"BIO-B01-Ch1.1-S041:B","options":[{"id":"BIO-B01-Ch1.1-S041:A","text":"把所有章節分成互不相干的五群","explanation":"統整的目的在連結，並非使章節彼此隔絕。"},{"id":"BIO-B01-Ch1.1-S041:B","text":"提供跨章反覆使用的思考框架","explanation":"此項說明跨章組織與理解的功能。"},{"id":"BIO-B01-Ch1.1-S041:C","text":"規定每個現象只能對應一項","explanation":"同一現象可涉及多個主題，無此排他規則。"},{"id":"BIO-B01-Ch1.1-S041:D","text":"讓生命性質不再需要觀察證據","explanation":"框架仍需搭配生命活動的證據。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：統整主題幫助連結龐大的生命知識，並不將現象切成互斥類別，也不取代具體觀察。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S042","topicId":"BIO-C1.1I-THEMES","stem":"一段文字的重點是「基因攜帶的訊息影響生命活動」。若選最直接的統整主題，應選哪個？","correct":"BIO-B01-Ch1.1-S042:C","options":[{"id":"BIO-B01-Ch1.1-S042:A","text":"組織的大小尺度","explanation":"本句未著重結構尺度，不能只因是生物就選組織。"},{"id":"BIO-B01-Ch1.1-S042:B","text":"能量與物質的流入流出","explanation":"訊息與物質能量的收支是不同焦點。"},{"id":"BIO-B01-Ch1.1-S042:C","text":"資訊","explanation":"基因所載訊息的作用符合資訊主題。"},{"id":"BIO-B01-Ch1.1-S042:D","text":"演化的世代改變","explanation":"題目沒有提供跨世代的族群變化。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：關鍵是遺傳訊息如何影響活動，因此直接對應資訊。構造、能量及演化可能另有關聯，但不是這句指定的主軸。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S043","topicId":"BIO-C1.1I-THEMES","stem":"研究生物與周圍環境如何彼此影響，最直接對應哪個統整主題？","correct":"BIO-B01-Ch1.1-S043:D","options":[{"id":"BIO-B01-Ch1.1-S043:A","text":"資訊","explanation":"題目未以基因訊息為主要內容。"},{"id":"BIO-B01-Ch1.1-S043:B","text":"演化","explanation":"題面未給族群跨世代變化，不能以演化為最直接焦點。"},{"id":"BIO-B01-Ch1.1-S043:C","text":"組織","explanation":"組織著重結構及層次；此題指定彼此影響，應聚焦交互作用。"},{"id":"BIO-B01-Ch1.1-S043:D","text":"交互作用","explanation":"此項直接對應系統部分間及生物與環境的互動。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：生物和環境的相互影響是交互作用主題的直接入口。這不排除同時涉及能量、物質或其他主題，但題目焦點明確。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S044","topicId":"BIO-C1.1I-THEMES","stem":"五個統整主題中，哪項提供理解生命跨世代變化的核心視角？","correct":"BIO-B01-Ch1.1-S044:A","options":[{"id":"BIO-B01-Ch1.1-S044:A","text":"演化","explanation":"演化提供理解生命跨世代變化的核心視角。"},{"id":"BIO-B01-Ch1.1-S044:B","text":"資訊","explanation":"資訊著重遺傳訊息及其作用，不等同題目指定的跨世代視角。"},{"id":"BIO-B01-Ch1.1-S044:C","text":"交互作用","explanation":"交互作用強調部分間的影響，題目未以這種關係為主。"},{"id":"BIO-B01-Ch1.1-S044:D","text":"組織","explanation":"組織強調構造與尺度，與本題的跨世代變化不同。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：演化是貫穿生命研究的核心主題，關注跨世代的變化。資訊、交互作用與組織也能協助理解生命，但各自焦點分別為遺傳訊息、部分間影響及構造層次。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S045","topicId":"BIO-C1.1I-THEMES","stem":"哪一組完整列出五個統整主題？","correct":"BIO-B01-Ch1.1-S045:B","options":[{"id":"BIO-B01-Ch1.1-S045:A","text":"秩序、繁殖、生長、調節、反應","explanation":"此組為部分生命性質，且非五個統整主題的完整名稱。"},{"id":"BIO-B01-Ch1.1-S045:B","text":"組織、資訊、能量與物質、交互作用、演化","explanation":"此組與五主題一致，也保留能量與物質作同一主題。"},{"id":"BIO-B01-Ch1.1-S045:C","text":"體積、重量、顏色、形狀、速度","explanation":"此組是測量或外觀屬性，不是生物學統整框架。"},{"id":"BIO-B01-Ch1.1-S045:D","text":"細胞、葉片、根、莖、花","explanation":"此組混合細胞與植物構造，非統整主題。"}],"concept":"五個統整主題是組織、資訊、能量與物質、交互作用、演化。組織看構造及尺度；資訊看遺傳訊息的作用；能量與物質看取得、轉移和轉換；交互作用看部分間及生物與環境的影響；演化提供生命跨世代變化的核心視角。它們是可重複使用的思考框架，同一現象可涉及不只一項，並非互斥的章節分類。\n\n本題判讀：五主題是組織、資訊、能量與物質、交互作用、演化。生命性質清單與主題清單用途相關，但名稱和層次不同，不能互相替換。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S046","topicId":"BIO-C1.1I-INTEGRATE","stem":"一株幼苗依遺傳資訊形成新構造，同時利用能量。最合適的理解是什麼？","correct":"BIO-B01-Ch1.1-S046:C","options":[{"id":"BIO-B01-Ch1.1-S046:A","text":"一項現象只能屬單一生命性質","explanation":"生命性質與主題可重疊，不是互斥分類。"},{"id":"BIO-B01-Ch1.1-S046:B","text":"有發育就不可能有能量處理","explanation":"發育仍需能量支持，兩者不衝突。"},{"id":"BIO-B01-Ch1.1-S046:C","text":"生長發育、資訊作用及能量利用可以相互連結","explanation":"此項完整保留題設三個焦點的關聯。"},{"id":"BIO-B01-Ch1.1-S046:D","text":"有資訊就一定沒有物質需求","explanation":"資訊作用不能取消材料需求。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：幼苗形成構造是發育，遺傳訊息參與控制屬資訊，能量支持過程則屬能量處理。它們在同一生命活動中並存。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S047","topicId":"BIO-C1.1I-INTEGRATE","stem":"判讀一段生命現象時，先分辨「一個個體當下」或「族群許多世代」主要有何幫助？","correct":"BIO-B01-Ch1.1-S047:D","options":[{"id":"BIO-B01-Ch1.1-S047:A","text":"可完全不用讀其他條件","explanation":"尺度是必要線索之一，不會取代其他題面資料。"},{"id":"BIO-B01-Ch1.1-S047:B","text":"可把所有短期事件都當繁殖","explanation":"短期事件可能多種性質，不一律為繁殖。"},{"id":"BIO-B01-Ch1.1-S047:C","text":"可直接證明所有生物有意識","explanation":"時間尺度不直接提供意識證據。"},{"id":"BIO-B01-Ch1.1-S047:D","text":"可避免把調節、反應或發育誤當演化適應","explanation":"此項說明區分尺度能減少的核心混淆。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：觀察對象及時間尺度是重要的起點。個體當下的控制、反應或成熟與族群跨代遺傳改變不同，但仍須搭配其他條件作完整判斷。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S048","topicId":"BIO-C1.1I-INTEGRATE","stem":"某動物感受熱環境而增加散熱，結果體溫維持範圍。哪兩項生命性質可同時適用？","correct":"BIO-B01-Ch1.1-S048:A","options":[{"id":"BIO-B01-Ch1.1-S048:A","text":"回應環境與調節","explanation":"題設同時提供刺激反應及內部穩定的證據。"},{"id":"BIO-B01-Ch1.1-S048:B","text":"繁殖與形成後代","explanation":"散熱未形成後代，不能當繁殖。"},{"id":"BIO-B01-Ch1.1-S048:C","text":"秩序與單純材料堆積","explanation":"過程不是只描述靜態排列，材料堆積也非所問性質。"},{"id":"BIO-B01-Ch1.1-S048:D","text":"演化適應與個體主動變種","explanation":"個體短期散熱不是主動變種或多代適應。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：外界熱條件與反應相連，且反應有助體溫穩定，因此同時涉及環境反應與調節；兩種分類從不同焦點描述同件事。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S049","topicId":"BIO-C1.1I-INTEGRATE","stem":"「產生新同類後代」與「原幼體形成新器官」最直接應如何區分？","correct":"BIO-B01-Ch1.1-S049:B","options":[{"id":"BIO-B01-Ch1.1-S049:A","text":"前者調節；後者演化","explanation":"新後代不是內部調節，個體器官形成不是演化。"},{"id":"BIO-B01-Ch1.1-S049:B","text":"前者繁殖；後者發育","explanation":"此配對按個體身分與構造層次區分。"},{"id":"BIO-B01-Ch1.1-S049:C","text":"兩者皆為個體的意識活動","explanation":"題目沒有意識證據，生命過程不必由意識控制。"},{"id":"BIO-B01-Ch1.1-S049:D","text":"兩者皆只表示能量消失","explanation":"兩者皆不表示能量被消滅。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：兩者都可能出現新構造，但判斷單位不同：前者是新個體，後者是原個體內的發育。不能只看到「新」就把兩者當相同過程。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S050","topicId":"BIO-C1.1I-INTEGRATE","stem":"生命特徵與統整主題的題目中，哪個作答習慣最合理？","correct":"BIO-B01-Ch1.1-S050:C","options":[{"id":"BIO-B01-Ch1.1-S050:A","text":"只要看到動作就認定有意識","explanation":"動作與意識不是等價證據。"},{"id":"BIO-B01-Ch1.1-S050:B","text":"只要看到生物變大就選繁殖","explanation":"原個體變大是生長，不必形成後代。"},{"id":"BIO-B01-Ch1.1-S050:C","text":"依題幹的對象、時間與提問焦點判斷","explanation":"此法能把生命性質與題設條件相連。"},{"id":"BIO-B01-Ch1.1-S050:D","text":"只要提及DNA就忽略其他條件","explanation":"DNA可能是背景，仍須看實際提問。"}],"concept":"生命性質常在同一事件共同出現：幼苗發育需要能量，也受遺傳資訊影響；動物散熱既回應環境，也可調節體溫。解題可依序找出觀察對象、時間尺度與問題指定的焦點，再判斷最直接的性質。個體長大、產生後代、穩定內部條件及族群跨代改變各有不同判準；不能只見到「改變」就一律歸入演化。\n\n本題判讀：生命現象常同時涉及多項觀念。閱讀對象、時間和指定焦點，才能選最直接的答案，避免以單一關鍵字替代推理。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1.1-B001","topicId":"BIO-C1.1I-LIFE","stem":"教室展示會避開障礙的電動車與固定在土中的活幼苗。電動車依感測器程式轉向，幼苗持續代謝並長葉。哪項比較最合理？","correct":"BIO-B01-Ch1.1-B001:C","options":[{"id":"BIO-B01-Ch1.1-B001:A","text":"電動車有反應，所以必比幼苗更接近生命","explanation":"非生命機器也可對輸入反應，不能據此判更有生命。"},{"id":"BIO-B01-Ch1.1-B001:B","text":"幼苗不轉向，所以欠缺任何生命活動","explanation":"題設已給出代謝和長葉，都是幼苗生命活動。"},{"id":"BIO-B01-Ch1.1-B001:C","text":"反應或位移各自都不足以取代整體生命判斷","explanation":"此項分清相似現象與充分判準，推論最恰當。"},{"id":"BIO-B01-Ch1.1-B001:D","text":"只要兩者均需要能量，就必同為生物","explanation":"機器也耗能，耗能並非生物專有特徵。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：車的程式反應與幼苗的生命活動可有表面相似性。能量需求、反應或位移均不能單獨作充分條件，須看其是否構成整合的生命系統。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B002","topicId":"BIO-C1.1I-LIFE","stem":"某學生把「會長大」訂為生命的唯一判準。另一學生指出鹽晶體可因鹽析出而增大。這個例子最直接指出什麼問題？","correct":"BIO-B01-Ch1.1-B002:D","options":[{"id":"BIO-B01-Ch1.1-B002:A","text":"生物從來不會長大","explanation":"反例不否認生物生長，只否定單項足以判生命。"},{"id":"BIO-B01-Ch1.1-B002:B","text":"任何有規則構造的物體都沒有生命","explanation":"非生命與生命都可能有秩序，不能反向一概排除。"},{"id":"BIO-B01-Ch1.1-B002:C","text":"晶體增大等同個體發育成熟","explanation":"晶體材料堆積不能直接等同生物的分化與成熟。"},{"id":"BIO-B01-Ch1.1-B002:D","text":"外觀尺寸增加不等於整套生命的生長發育","explanation":"此項保留生物生長的意義，同時指出單一尺寸判準的不足。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：晶體因材料附加而增大，不足以證明其具有遺傳資訊控制的發育、代謝與調節。反例針對的是「唯一判準」，不是否定生長是生命性質。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B003","topicId":"BIO-C1.1I-LIFE","stem":"老師要求評估一個未知系統是否具有生命活動。哪項追加觀察最能補強原先只有「外形整齊」的資料？","correct":"BIO-B01-Ch1.1-B003:A","options":[{"id":"BIO-B01-Ch1.1-B003:A","text":"觀察能量利用、內部調節及生命延續等多類活動","explanation":"多種生命活動提供不同面向的證據，符合整體判斷。"},{"id":"BIO-B01-Ch1.1-B003:B","text":"量它的外觀是否比原來更漂亮","explanation":"漂亮是主觀外觀評價，不補足生命活動資料。"},{"id":"BIO-B01-Ch1.1-B003:C","text":"比較它與石頭哪個比較大","explanation":"尺寸比較仍是外觀資訊，不能取代生命過程。"},{"id":"BIO-B01-Ch1.1-B003:D","text":"檢查它能否被風吹動","explanation":"被風吹動是被動位移，非生命物同樣可有。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：補充彼此相關的不同生命性質，可改善只看外觀秩序的證據不足。任何單項結果仍須放回整個系統理解，不以累計外觀特徵數目判定。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B004","topicId":"BIO-C1.1I-LIFE","stem":"甲說：「所有活著的個體每一刻都必須同時繁殖、生長並移動。」乙說：「生命性質要依個體狀態與時間尺度理解。」哪個評述正確？","correct":"BIO-B01-Ch1.1-B004:B","options":[{"id":"BIO-B01-Ch1.1-B004:A","text":"甲正確，靜止一分鐘就不再是生命","explanation":"靜止不代表代謝與其他活動停止。"},{"id":"BIO-B01-Ch1.1-B004:B","text":"乙正確，性質清單不是每刻必須同時完成的工作表","explanation":"乙把個體與時間差異納入，符合性質的正確使用方式。"},{"id":"BIO-B01-Ch1.1-B004:C","text":"兩人都錯，只有繁殖可判生命","explanation":"只剩單一繁殖判準會錯排不孕個體。"},{"id":"BIO-B01-Ch1.1-B004:D","text":"兩人都對，因為每項生命性質都互不相干","explanation":"各生命性質常相互連結，且甲的同時要求不成立。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：個體可能暫不生長、不繁殖或保持靜止，但仍維持代謝與調節；族群演化更需多代觀察。生命性質不能錯解為每個個體即時全數展示。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B005","topicId":"BIO-C1.1I-LIFE","stem":"在生命性質清單中，「族群經多代累積有利的可遺傳特徵」與「個體此刻散熱」不能要求用同一次短暫觀察完整證明，主要原因為何？","correct":"BIO-B01-Ch1.1-B005:C","options":[{"id":"BIO-B01-Ch1.1-B005:A","text":"兩者都不是生命現象","explanation":"演化適應與調節均列在生命性質中。"},{"id":"BIO-B01-Ch1.1-B005:B","text":"任何生命性質都無法觀察","explanation":"生命活動可觀察，限制在證據與問題尺度要吻合。"},{"id":"BIO-B01-Ch1.1-B005:C","text":"兩者涉及不同對象與時間尺度","explanation":"族群多代與個體當下不同，正是資料需求不同的原因。"},{"id":"BIO-B01-Ch1.1-B005:D","text":"散熱必須經過許多世代才會發生","explanation":"個體散熱可在短期發生；其演化起源是另一問題。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：前者是族群跨世代的演化適應，後者是個體當下的調節。選擇觀察方法前需先界定性質所指對象及時間，不能把所有證據壓成同一尺度。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B006","topicId":"BIO-C1.1I-LIFE","stem":"已知甲是活植物、乙是機械手臂，兩者都會依外界刺激改變動作。若只以「能反應」判生命，會產生哪項錯誤？","correct":"BIO-B01-Ch1.1-B006:D","options":[{"id":"BIO-B01-Ch1.1-B006:A","text":"把活植物排除，因為它一定不能反應","explanation":"題設明說植物會反應，排除植物與資料不符。"},{"id":"BIO-B01-Ch1.1-B006:B","text":"必然得到完整且正確的生命分類","explanation":"判準也涵蓋機械手臂，因此不能保證正確。"},{"id":"BIO-B01-Ch1.1-B006:C","text":"把所有會動物體都判成有繁殖能力","explanation":"能反應不推出繁殖，此項又加入另一個無據推論。"},{"id":"BIO-B01-Ch1.1-B006:D","text":"可能把機械反應誤當成充分的生命證據","explanation":"機器可表現反應，顯示此判準有把非生命納入的風險。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：反應是生命的常見性質，但人工系統也能模擬刺激與反應。題目要分清某項性質與生命的充分判準；觀察反應不等於完成分類。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B007","topicId":"BIO-C1.1I-LIFE","stem":"某同學主張「不能簡單定義生命，所以生物學不能科學研究生命」。哪項回應最合理？","correct":"BIO-B01-Ch1.1-B007:A","options":[{"id":"BIO-B01-Ch1.1-B007:A","text":"仍可研究可觀察的生命性質及彼此關係","explanation":"具體生命過程可觀察與研究，無須等候一句涵蓋全部情況的定義。"},{"id":"BIO-B01-Ch1.1-B007:B","text":"只有先背出一句完美定義才可觀察生命","explanation":"科學觀察與概念修正可相互促進，不以完美定義為前提。"},{"id":"BIO-B01-Ch1.1-B007:C","text":"應把所有會移動的物體都列成生物","explanation":"以移動取代定義會錯納機器等非生命物。"},{"id":"BIO-B01-Ch1.1-B007:D","text":"研究生命只能依外貌直覺，不能依活動證據","explanation":"活動證據比單一外貌直覺更能支持判斷。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：定義的困難不取消可觀察現象。生物學可研究能量處理、調節、發育等過程，並以整體證據建立對生命的理解。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B008","topicId":"BIO-C1.1I-LIFE","stem":"兩隻同種成年動物外形相似，一隻可生育、一隻不孕；兩者均能進食與調節內部條件。哪項結論有資料支持？","correct":"BIO-B01-Ch1.1-B008:B","options":[{"id":"BIO-B01-Ch1.1-B008:A","text":"不孕者必已失去全部生命性質","explanation":"不孕不取消代謝與調節，且與題設明載活動矛盾。"},{"id":"BIO-B01-Ch1.1-B008:B","text":"兩者均可有生命，個體生育能力不等同生命資格","explanation":"此項保留繁殖的生命意義及個體例外。"},{"id":"BIO-B01-Ch1.1-B008:C","text":"可生育者不需要能量處理","explanation":"繁殖及其他生命活動仍需能量支持。"},{"id":"BIO-B01-Ch1.1-B008:D","text":"外形相似已足以證明所有生理活動相同","explanation":"外形相似不能證明所有生理狀態一致。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：題設已給兩者生命維持活動，差異僅在生育能力。由一項能力差異不能推為生命與非生命之別，也不能假定其餘全部活動完全相同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B009","topicId":"BIO-C1.1I-LIFE","stem":"某展示把生命性質簡化成三句：「有秩序就一定活著；會耗能就一定活著；會動就一定活著。」三句共同的問題是什麼？","correct":"BIO-B01-Ch1.1-B009:C","options":[{"id":"BIO-B01-Ch1.1-B009:A","text":"它們都把個體變成族群","explanation":"三句主要錯在充分條件，未涉及必然的族群尺度轉換。"},{"id":"BIO-B01-Ch1.1-B009:B","text":"它們都要求多代資料","explanation":"三句均未要求世代資料，這不是共同問題。"},{"id":"BIO-B01-Ch1.1-B009:C","text":"它們把單一非專有性質當成生命充分條件","explanation":"三者都可能錯納非生命物，需回到整體生命活動。"},{"id":"BIO-B01-Ch1.1-B009:D","text":"它們都否認生物有結構","explanation":"第一句正談結構秩序，並沒有否認結構。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：秩序、能量利用與運動都可在非生命系統出現。共通錯誤不在於生物沒有這些現象，而在於把單一現象當作必然有生命的證明。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B010","topicId":"BIO-C1.1I-LIFE","stem":"評估某已知活體時，觀察者這一小時未見它繁殖。哪項紀錄最嚴謹？","correct":"BIO-B01-Ch1.1-B010:D","options":[{"id":"BIO-B01-Ch1.1-B010:A","text":"已證明所有同類均無繁殖能力","explanation":"短時間一個個體的資料不能推到全部同類。"},{"id":"BIO-B01-Ch1.1-B010:B","text":"已證明此活體當時沒有任何生命活動","explanation":"未見繁殖不能否定能量處理及其他活動。"},{"id":"BIO-B01-Ch1.1-B010:C","text":"已證明生命不包含繁殖性質","explanation":"繁殖仍是生命延續的重要性質，並未被此觀察推翻。"},{"id":"BIO-B01-Ch1.1-B010:D","text":"本次未觀察到繁殖，不能據此否定它是生命","explanation":"此紀錄界定觀察限度，沒有過度推論。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：「本次未見」是特定時間的觀察，不等同一生或整個類群都不繁殖。即使個體不孕，也不能單由繁殖能力否定其生命。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B011","topicId":"BIO-C1.1I-ORDER","stem":"甲紀錄描述葉片內不同構造有一定配置；乙紀錄同一植株一週後高度增加。若分別判斷最直接的生命性質，何者正確？","correct":"BIO-B01-Ch1.1-B011:D","options":[{"id":"BIO-B01-Ch1.1-B011:A","text":"甲繁殖；乙秩序","explanation":"甲沒有後代資料，乙並非主要描述排列。"},{"id":"BIO-B01-Ch1.1-B011:B","text":"甲能量處理；乙演化適應","explanation":"甲未描述供能，個體變高也非跨代演化。"},{"id":"BIO-B01-Ch1.1-B011:C","text":"甲演化適應；乙回應環境","explanation":"甲無世代變化，乙未給特定刺激反應關係。"},{"id":"BIO-B01-Ch1.1-B011:D","text":"甲秩序；乙生長","explanation":"結構配置對應秩序，同個體高度增加對應生長。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：甲提供空間安排，乙比較同一個體的大小隨時間增加。先分清結構與過程，便可避免把所有變化或排列混成同一性質。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B012","topicId":"BIO-C1.1I-ORDER","stem":"某人認為細胞中只要各材料的數量相同，如何安排都不影響生命秩序。這個說法忽略了什麼？","correct":"BIO-B01-Ch1.1-B012:A","options":[{"id":"BIO-B01-Ch1.1-B012:A","text":"秩序也包含部分之間的相對配置","explanation":"此項補上結構安排，是原說法缺少的面向。"},{"id":"BIO-B01-Ch1.1-B012:B","text":"生物所有材料必須平均分布","explanation":"平均分布不是秩序的普遍要求。"},{"id":"BIO-B01-Ch1.1-B012:C","text":"每種材料本身都能獨立繁殖","explanation":"細胞材料不都具有獨立繁殖能力。"},{"id":"BIO-B01-Ch1.1-B012:D","text":"材料數量與排列必然完全相同","explanation":"數量與空間配置是不同資訊，不能視為等同。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：有組織性不只在於材料清單，還包括各部分如何配置和連結。相同材料數量不能保證相同組織狀態；本題不需推測具體細胞機制。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B013","topicId":"BIO-C1.1I-ORDER","stem":"人工模型與真實花序都呈現規則排列。僅憑這項共同點，能做哪項判斷？","correct":"BIO-B01-Ch1.1-B013:B","options":[{"id":"BIO-B01-Ch1.1-B013:A","text":"兩者均有遺傳資訊控制發育","explanation":"模型的製作安排不等同活體遺傳資訊控制發育。"},{"id":"BIO-B01-Ch1.1-B013:B","text":"兩者均呈現某種規律，但不因此同為生命","explanation":"這是題設共同點所能支持的有限結論。"},{"id":"BIO-B01-Ch1.1-B013:C","text":"兩者必然具有相同代謝能力","explanation":"外形規律無法證明模型具備代謝。"},{"id":"BIO-B01-Ch1.1-B013:D","text":"兩者一定會產生同類後代","explanation":"產生後代需另有證據，不能由排列推出。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：人工物可模擬生物外形的秩序。可確認的是排列規律相似，不能由此加入代謝、遺傳控制或繁殖等尚未提供的證據。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B014","topicId":"BIO-C1.1I-ORDER","stem":"學生分別研究「某細胞內部構造配置」與「整片森林的生物及環境關係」。哪個理解最能保留組織主題的用途？","correct":"BIO-B01-Ch1.1-B014:C","options":[{"id":"BIO-B01-Ch1.1-B014:A","text":"兩個尺度不能放在同一生命研究框架","explanation":"尺度差異不阻止以同一框架連結生命現象。"},{"id":"BIO-B01-Ch1.1-B014:B","text":"只有細胞尺度才可能有秩序","explanation":"生命秩序不限細胞，較大尺度亦可研究。"},{"id":"BIO-B01-Ch1.1-B014:C","text":"生命可在不同尺度研究，再連結各層次的安排","explanation":"此項同時保留各尺度差異及跨尺度連結。"},{"id":"BIO-B01-Ch1.1-B014:D","text":"森林很大，所以其中不會有組織性","explanation":"大小不是判斷組織性有無的標準。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：組織主題讓研究者注意不同尺度及其關聯。尺度不同不代表不能連結；本題只考框架，不要求列出各層級的完整分類。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B015","topicId":"BIO-C1.1I-ORDER","stem":"某觀察筆記寫「構造彼此不同，但在整個個體中各有固定配置」。哪個解讀最合理？","correct":"BIO-B01-Ch1.1-B015:D","options":[{"id":"BIO-B01-Ch1.1-B015:A","text":"構造不同表示整個個體毫無秩序","explanation":"異質部分也能有序配置，兩者不矛盾。"},{"id":"BIO-B01-Ch1.1-B015:B","text":"有固定配置表示每個構造都必能獨立存活","explanation":"是否能獨立存活不能由位置固定推出。"},{"id":"BIO-B01-Ch1.1-B015:C","text":"固定配置表示個體永遠不會發育","explanation":"生物的有序構造仍可隨生長發育改變。"},{"id":"BIO-B01-Ch1.1-B015:D","text":"差異化的部分仍可共同形成有組織的整體","explanation":"此項保留組織性與部分差異可並存的觀念。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：秩序容許不同部分具有不同位置與角色。結構安排不是要求所有部分相同、獨立存活或永遠不變，而是呈現整體的組織關係。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B016","topicId":"BIO-C1.1I-ORDER","stem":"哪項敘述把「生命秩序」錯解成不必要的條件？","correct":"BIO-B01-Ch1.1-B016:A","options":[{"id":"BIO-B01-Ch1.1-B016:A","text":"每個生物的形狀必須完全對稱，才算有秩序","explanation":"完全對稱不是生命秩序的普遍必要條件，因此此項錯解。"},{"id":"BIO-B01-Ch1.1-B016:B","text":"有序安排可能需要顯微鏡才能看清","explanation":"小尺度秩序可依儀器觀察，這是合理敘述。"},{"id":"BIO-B01-Ch1.1-B016:C","text":"內部構造可有不同但有規律的配置","explanation":"部分不同與排列有組織並不衝突。"},{"id":"BIO-B01-Ch1.1-B016:D","text":"結構排列是生命整體判斷的一項線索","explanation":"秩序可作線索，但不單獨完成生命判斷，此項合理。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：秩序不限定左右對稱或任一幾何形式。辨認有組織的安排，不能額外要求所有生物外形都符合單一模型。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B017","topicId":"BIO-C1.1I-ORDER","stem":"研究者先量各部分的相對位置，再問這些部分如何共同構成一個生命系統。相較於只記材料總量，這個做法多加入哪項資訊？","correct":"BIO-B01-Ch1.1-B017:B","options":[{"id":"BIO-B01-Ch1.1-B017:A","text":"各部分是否具有意識","explanation":"結構觀察不直接提供主觀意識證據。"},{"id":"BIO-B01-Ch1.1-B017:B","text":"結構組織與相互配置的資訊","explanation":"材料如何安排與連結是組織主題所需資訊。"},{"id":"BIO-B01-Ch1.1-B017:C","text":"族群全部後代的遺傳頻率","explanation":"族群頻率需要世代及個體統計，題目沒有。"},{"id":"BIO-B01-Ch1.1-B017:D","text":"所有能量轉換途徑的精確產率","explanation":"能量產率需額外測量，位置資料不能代替。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：相對位置與部分如何構成整體直接涉及組織。由這些觀察不能推出意識、族群遺傳頻率或能量產率等不同問題的答案。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B018","topicId":"BIO-C1.1I-ORDER","stem":"「組織」與「繁殖」兩項概念，哪個比較正確？","correct":"BIO-B01-Ch1.1-B018:C","options":[{"id":"BIO-B01-Ch1.1-B018:A","text":"組織指產生後代，繁殖指部位排列","explanation":"此項把兩者的焦點互換。"},{"id":"BIO-B01-Ch1.1-B018:B","text":"兩者都只指個體體積增加","explanation":"體積增加是生長，不能概括這兩項。"},{"id":"BIO-B01-Ch1.1-B018:C","text":"組織關注結構層次，繁殖關注生命後代的產生","explanation":"這組對應保留結構與生命延續的差別。"},{"id":"BIO-B01-Ch1.1-B018:D","text":"兩者都必須有跨多代的特徵頻率變化","explanation":"多代頻率變化是演化的線索，非兩者共同定義。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：組織強調生命部分的安排與尺度；繁殖強調形成同類後代。結構可支持繁殖活動，但兩個概念的判別焦點不同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B019","topicId":"BIO-C1.1I-ORDER","stem":"同一活體的構造在發育中改變，但仍呈現可辨認的配置。這是否與生命有秩序矛盾？","correct":"BIO-B01-Ch1.1-B019:D","options":[{"id":"BIO-B01-Ch1.1-B019:A","text":"矛盾，秩序代表任何構造都不可改變","explanation":"秩序不等於構造永遠固定。"},{"id":"BIO-B01-Ch1.1-B019:B","text":"矛盾，發育後必須失去所有秩序","explanation":"發育可使組織更分化，並非必然失序。"},{"id":"BIO-B01-Ch1.1-B019:C","text":"不矛盾，因為秩序只描述非生命物","explanation":"秩序也適用生物，並非專屬非生命物。"},{"id":"BIO-B01-Ch1.1-B019:D","text":"不矛盾，有組織的構造可在發育中重整","explanation":"此項容許發育中的有序重整，沒有概念衝突。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：生命秩序描述有組織性，沒有要求終身保持同一排列。發育可產生新構造和新配置，仍然有序；變動與無秩序不能直接畫等號。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B020","topicId":"BIO-C1.1I-ORDER","stem":"四份摘要中，哪份以「組織」為主要觀察焦點，且未加入資料以外的推論？","correct":"BIO-B01-Ch1.1-B020:A","options":[{"id":"BIO-B01-Ch1.1-B020:A","text":"細胞中的構造位置有規律，因此可描述其組織安排","explanation":"規律位置直接支持有組織的結構描述。"},{"id":"BIO-B01-Ch1.1-B020:B","text":"幼苗變高，因此已證明族群完成演化","explanation":"個體長高是生長，不能證明族群演化。"},{"id":"BIO-B01-Ch1.1-B020:C","text":"花序規則，因此每朵花必有意識","explanation":"花序規則不提供主觀意識的證據。"},{"id":"BIO-B01-Ch1.1-B020:D","text":"物體排列整齊，因此已證明可自行繁殖","explanation":"排列整齊不等同可形成同類後代。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：第一份僅由構造位置描述安排，推論與證據相稱。其餘由長大或整齊越級推到演化、意識與繁殖，超出各自資料。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B021","topicId":"BIO-C1.1I-REPRO","stem":"連續觀察同一株幼苗：第1天有2片葉，第7天有5片葉，未形成新植株。哪項判讀正確？","correct":"BIO-B01-Ch1.1-B021:C","options":[{"id":"BIO-B01-Ch1.1-B021:A","text":"葉數增加已證明繁殖三次","explanation":"葉片是原植物的構造，不能計為三個後代。"},{"id":"BIO-B01-Ch1.1-B021:B","text":"只要細胞數增加就必是繁殖","explanation":"多細胞個體的細胞增加也可支持生長，不必等於個體繁殖。"},{"id":"BIO-B01-Ch1.1-B021:C","text":"資料直接支持原個體生長發育，尚非新個體繁殖","explanation":"同一植株長葉符合生長發育，且題設排除新個體。"},{"id":"BIO-B01-Ch1.1-B021:D","text":"資料證明該植物永遠不能繁殖","explanation":"七天的觀察不足以推定終生繁殖能力。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：題設明確追蹤同一個體，增加的是葉片，不是新植株。器官形成屬發育；沒有本次繁殖紀錄也不能推論一生不繁殖。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B022","topicId":"BIO-C1.1I-REPRO","stem":"某單細胞生物由一個親代分成兩個可各自維持生命活動的後代。若以整個生物個體為單位，最直接屬於何者？","correct":"BIO-B01-Ch1.1-B022:D","options":[{"id":"BIO-B01-Ch1.1-B022:A","text":"只有器官形成","explanation":"題目是完整單細胞個體分出後代，不是器官形成。"},{"id":"BIO-B01-Ch1.1-B022:B","text":"只有外觀秩序","explanation":"有無秩序不是題設分裂事件的主要判準。"},{"id":"BIO-B01-Ch1.1-B022:C","text":"只有單一個體變胖","explanation":"兩個後代不等於原個體僅增加體積。"},{"id":"BIO-B01-Ch1.1-B022:D","text":"繁殖，因為形成新的同類個體","explanation":"以生物個體為單位，後代形成直接符合繁殖。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：本題已給單細胞生物及兩個可各自生活的後代，判斷單位清楚。與多細胞個體內部細胞增加不同，此處形成新個體，故屬繁殖。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B023","topicId":"BIO-C1.1I-REPRO","stem":"甲紀錄成年動物產下幼體；乙紀錄同一幼體逐漸長成成年。兩份紀錄應如何配對？","correct":"BIO-B01-Ch1.1-B023:A","options":[{"id":"BIO-B01-Ch1.1-B023:A","text":"甲繁殖；乙生長發育","explanation":"此配對對應新後代與原個體成熟的差異。"},{"id":"BIO-B01-Ch1.1-B023:B","text":"甲生長發育；乙繁殖","explanation":"此項互換兩個過程，忽略個體身分。"},{"id":"BIO-B01-Ch1.1-B023:C","text":"甲調節；乙演化適應","explanation":"產下幼體不是主要描述內部控制；成熟也非族群演化。"},{"id":"BIO-B01-Ch1.1-B023:D","text":"甲演化適應；乙調節","explanation":"有後代不等於已證明演化適應，成熟亦非此處調節。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：甲涉及親代與新個體，乙涉及同一個體的成長與成熟。題面沒有族群特徵跨代改變或內部條件控制，不能配成演化或調節。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B024","topicId":"BIO-C1.1I-REPRO","stem":"某研究只記錄一隻動物體重由20 g增加到30 g，未記錄任何後代。下列結論何者成立？","correct":"BIO-B01-Ch1.1-B024:B","options":[{"id":"BIO-B01-Ch1.1-B024:A","text":"至少繁殖出10個後代","explanation":"質量單位g不是個體數，不能換算後代。"},{"id":"BIO-B01-Ch1.1-B024:B","text":"原個體體重增加，不能由此推出已繁殖","explanation":"此項保留原個體增重的資料意義及推論限制。"},{"id":"BIO-B01-Ch1.1-B024:C","text":"該物種已演化為較大的新物種","explanation":"單一個體增重不能證明物種形成或跨代演化。"},{"id":"BIO-B01-Ch1.1-B024:D","text":"因為增加10 g，所以不存在能量處理","explanation":"增重可涉及物質與能量利用，不能反推沒有能量處理。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：30−20＝10 g是原個體的體重增量，不是後代數。生長可與能量利用相關，但體重資料不能代替繁殖或族群演化證據。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B025","topicId":"BIO-C1.1I-REPRO","stem":"若要區分「原個體長大」與「產生新後代」，哪項紀錄最值得優先補上？","correct":"BIO-B01-Ch1.1-B025:C","options":[{"id":"BIO-B01-Ch1.1-B025:A","text":"個體體色是否漂亮","explanation":"美感與後代是否形成無直接關係。"},{"id":"BIO-B01-Ch1.1-B025:B","text":"培養容器是否對稱","explanation":"容器形狀不能判斷生物個體是否增加。"},{"id":"BIO-B01-Ch1.1-B025:C","text":"追蹤個體身分及新個體與親代的關係","explanation":"個體追蹤可把生長與繁殖的判斷單位分清。"},{"id":"BIO-B01-Ch1.1-B025:D","text":"測量桌子的溫度","explanation":"桌面溫度不能直接提供親代與後代身分。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：需知道增加的是同一個體的構造或大小，還是新的後代。追蹤身分可直接回答此差異，外觀美感和周邊物件無法替代。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B026","topicId":"BIO-C1.1I-REPRO","stem":"一群動物有些個體未留下後代，但整體族群仍持續繁殖。哪項說明最正確？","correct":"BIO-B01-Ch1.1-B026:D","options":[{"id":"BIO-B01-Ch1.1-B026:A","text":"沒有後代的個體都屬非生命","explanation":"是否有後代不是個體生命的唯一判準。"},{"id":"BIO-B01-Ch1.1-B026:B","text":"未留下後代表示其所有細胞已死亡","explanation":"缺少後代不代表細胞死亡，此推論無據。"},{"id":"BIO-B01-Ch1.1-B026:C","text":"族群會繁殖表示每個成員都必有相同生育能力","explanation":"整體繁殖不能推出成員能力完全相同。"},{"id":"BIO-B01-Ch1.1-B026:D","text":"生命延續可在族群中發生，不要求每個成員都留下後代","explanation":"此項區分系統延續與個體差異，符合生命性質的理解。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：族群持續產生後代與其中個體是否皆成功繁殖是兩個問題。繁殖能力及結果可有差異，不能據此將未繁殖者排除於活體。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B027","topicId":"BIO-C1.1I-REPRO","stem":"學生看見多細胞幼體內的細胞數增加，就宣布「一定新增許多生物個體」。最適當的修正是什麼？","correct":"BIO-B01-Ch1.1-B027:A","options":[{"id":"BIO-B01-Ch1.1-B027:A","text":"細胞增加可支持同一個體生長，需另證明後代形成","explanation":"此項分清細胞層次與完整個體層次。"},{"id":"BIO-B01-Ch1.1-B027:B","text":"任何細胞增加都不能算生命活動","explanation":"細胞增加可以是正常生長活動，並非非生命現象。"},{"id":"BIO-B01-Ch1.1-B027:C","text":"多細胞生物不可能繁殖","explanation":"多細胞生物也可產生後代，不能因本例否定。"},{"id":"BIO-B01-Ch1.1-B027:D","text":"只有體積不變才會形成後代","explanation":"繁殖與親代體積是否變動沒有此種必然條件。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：判斷繁殖先確定觀察單位。多細胞個體內部的細胞增加可屬成長的一部分，不能直接把每個細胞都算作新生物個體。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B028","topicId":"BIO-C1.1I-REPRO","stem":"親代形成後代，使基因攜帶的資訊傳至下一代。若題目分別問「生命性質」與「統整主題」，最直接的配對為何？","correct":"BIO-B01-Ch1.1-B028:B","options":[{"id":"BIO-B01-Ch1.1-B028:A","text":"調節；組織","explanation":"題面未描述內部條件穩定，也未以結構尺度為主。"},{"id":"BIO-B01-Ch1.1-B028:B","text":"繁殖；資訊","explanation":"兩個對應分別抓住後代形成與遺傳訊息。"},{"id":"BIO-B01-Ch1.1-B028:C","text":"演化適應；能量與物質","explanation":"後代形成不自動證明適應性改變，資訊亦非能量本身。"},{"id":"BIO-B01-Ch1.1-B028:D","text":"秩序；交互作用","explanation":"題幹沒有以排列或彼此影響作主要焦點。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：形成後代屬繁殖；遺傳訊息跨代延續則對應資訊主題。只是傳遞資訊並不足以證明族群特徵比例已跨代改變。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B029","topicId":"BIO-C1.1I-REPRO","stem":"一株植物長出分枝，分枝仍是同一植株的一部分；另一株植物形成新的同類幼體。何者是正確判斷？","correct":"BIO-B01-Ch1.1-B029:C","options":[{"id":"BIO-B01-Ch1.1-B029:A","text":"兩者都只能算繁殖","explanation":"第一例僅說同個體形成構造，不能當繁殖。"},{"id":"BIO-B01-Ch1.1-B029:B","text":"分枝一定是另一個獨立生物","explanation":"此項與題設「同一植株的一部分」矛盾。"},{"id":"BIO-B01-Ch1.1-B029:C","text":"前者主要是生長發育，後者可支持繁殖","explanation":"此項依題面提供的身分關係作區分。"},{"id":"BIO-B01-Ch1.1-B029:D","text":"兩者都已證明演化適應","explanation":"兩例都未提供跨代可遺傳特徵變化的資料。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：題設明定分枝仍屬原個體，另例則形成新同類幼體。依個體身分及後代關係判別即可，不需額外判斷植物生殖方式。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B030","topicId":"BIO-C1.1I-REPRO","stem":"某報告將「幼體長成成體」及「親代產生幼體」都稱為繁殖。修正文句時應保留哪項原則？","correct":"BIO-B01-Ch1.1-B030:D","options":[{"id":"BIO-B01-Ch1.1-B030:A","text":"只要有新外形出現就是新個體","explanation":"同一個體發育也會形成新外形，未必產生新個體。"},{"id":"BIO-B01-Ch1.1-B030:B","text":"只要身體使用能量就是繁殖","explanation":"能量支持多類活動，不專屬繁殖。"},{"id":"BIO-B01-Ch1.1-B030:C","text":"只要存在遺傳資訊就是已產生後代","explanation":"已有遺傳資訊不代表此時正在產生後代。"},{"id":"BIO-B01-Ch1.1-B030:D","text":"繁殖須辨認新後代，原個體成熟應另列為發育","explanation":"此原則分清個體發育與生命延續。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：個體身分連續的成熟過程屬發育；親代與新幼體的關係才直接支持繁殖。成長與繁殖可前後相關，但不能合併為同義詞。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B031","topicId":"BIO-C1.1I-GROW","stem":"兩株幼苗體重相同，但甲已形成根與葉的分工構造，乙尚未形成這些構造。由此最能說明什麼？","correct":"BIO-B01-Ch1.1-B031:B","options":[{"id":"BIO-B01-Ch1.1-B031:A","text":"相同體重保證發育狀態完全相同","explanation":"題設已說構造狀態不同，體重不能消除差別。"},{"id":"BIO-B01-Ch1.1-B031:B","text":"發育狀態不能只用體重一項數據判定","explanation":"這一比較顯示分化資訊無法由體重取代。"},{"id":"BIO-B01-Ch1.1-B031:C","text":"甲已在個體一生中演化成新物種","explanation":"發育差異不足以支持物種轉變。"},{"id":"BIO-B01-Ch1.1-B031:D","text":"乙沒有任何遺傳資訊","explanation":"尚未形成構造不表示沒有基因或遺傳資訊。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：重量是大小或物質量的指標，構造分化則是發育的重要面向。相同重量可對應不同構造狀態，不能據此推論物種或遺傳資訊有無。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B032","topicId":"BIO-C1.1I-GROW","stem":"研究者追蹤同一株植物，記錄高度由3 cm到6 cm，且出現新的特定構造。哪項結論最完整且不過度？","correct":"BIO-B01-Ch1.1-B032:C","options":[{"id":"BIO-B01-Ch1.1-B032:A","text":"只要變高就證明已形成多個後代","explanation":"同株變高不代表新個體形成。"},{"id":"BIO-B01-Ch1.1-B032:B","text":"增加3 cm就證明族群適應環境","explanation":"厘米是長度，不是族群遺傳變化的證據。"},{"id":"BIO-B01-Ch1.1-B032:C","text":"有生長且有發育的證據，不能因此宣稱演化","explanation":"此項同時使用高度與構造兩類資料並限制推論。"},{"id":"BIO-B01-Ch1.1-B032:D","text":"只要有新構造就必與遺傳資訊無關","explanation":"基因資訊可參與構造形成，不能反向否定。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：高度增加3 cm支持生長，新特定構造支持發育；兩者仍為同一個體的歷程。數值描述個體尺寸，不能換成世代的遺傳變化。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B033","topicId":"BIO-C1.1I-GROW","stem":"若題目要考「遺傳資訊控制發育模式」，哪個敘述最能作直接證據線索？","correct":"BIO-B01-Ch1.1-B033:D","options":[{"id":"BIO-B01-Ch1.1-B033:A","text":"觀察桌面上的水滴變大","explanation":"水滴增加體積不是題設的生命發育控制。"},{"id":"BIO-B01-Ch1.1-B033:B","text":"觀察沙堆加入沙後增高","explanation":"沙粒堆積不能直接當作遺傳資訊作用。"},{"id":"BIO-B01-Ch1.1-B033:C","text":"觀察汽車加油後能行駛","explanation":"車輛用能不表示有基因控制發育。"},{"id":"BIO-B01-Ch1.1-B033:D","text":"觀察幼體依基因資訊逐步形成特定構造","explanation":"這項直接連結基因資訊與發育模式。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：最後一項同時給出生命個體、基因資訊及構造形成的關係。其他例子雖可能增大或用能，沒有提供生命發育與遺傳控制的連結。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B034","topicId":"BIO-C1.1I-GROW","stem":"某同學說：「幼苗和成株外形不同，因此幼苗在一生中演化成了成株。」最佳修正為何？","correct":"BIO-B01-Ch1.1-B034:A","options":[{"id":"BIO-B01-Ch1.1-B034:A","text":"這是同一個體的生長發育，非族群跨代演化","explanation":"此項以個體身分及時間尺度修正原說法。"},{"id":"BIO-B01-Ch1.1-B034:B","text":"外形不同就一定屬不同物種","explanation":"同一物種不同發育階段可有不同外形。"},{"id":"BIO-B01-Ch1.1-B034:C","text":"成株必定是另一個親代產生的新個體","explanation":"題目是同一幼苗長大，不能任意改成另一親代後代。"},{"id":"BIO-B01-Ch1.1-B034:D","text":"幼苗的構造變化不算生命活動","explanation":"生長發育本來就是生命性質。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：題設身分連續，差異發生於個體成長與成熟。演化的判斷需族群、遺傳變異及世代，不因外形變化就成立。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B035","topicId":"BIO-C1.1I-GROW","stem":"假想研究中，兩組幼苗得到相同外界條件，某遺傳資訊差異與構造形成模式的差異相連。只問最直接的主題關聯，何者合適？","correct":"BIO-B01-Ch1.1-B035:B","options":[{"id":"BIO-B01-Ch1.1-B035:A","text":"能量來源必相反","explanation":"外界條件相同且未給能量差異，不能推相反來源。"},{"id":"BIO-B01-Ch1.1-B035:B","text":"資訊與生長發育有關","explanation":"遺傳資訊與發育模式的關係正是題面焦點。"},{"id":"BIO-B01-Ch1.1-B035:C","text":"兩組都已產生後代","explanation":"構造形成不等於形成下一代。"},{"id":"BIO-B01-Ch1.1-B035:D","text":"兩組必有主觀意識","explanation":"發育差異不能提供意識證據。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：題設以遺傳差異連到構造形成，支援資訊參與發育。這項概念關聯不需要猜測基因機制，也不能直接推出繁殖或意識。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B036","topicId":"BIO-C1.1I-GROW","stem":"關於「生長」與「發育」，哪項比較能避免混淆？","correct":"BIO-B01-Ch1.1-B036:C","options":[{"id":"BIO-B01-Ch1.1-B036:A","text":"生長只在非生命物；發育只在機器","explanation":"生物當然會生長發育，此分類不成立。"},{"id":"BIO-B01-Ch1.1-B036:B","text":"兩者都一定是產生後代的同義詞","explanation":"繁殖須形成後代，與同個體改變不同。"},{"id":"BIO-B01-Ch1.1-B036:C","text":"生長關注大小增加；發育還包括分化與成熟","explanation":"此項正確區分兩者焦點並保留關聯。"},{"id":"BIO-B01-Ch1.1-B036:D","text":"發育完全不涉及構造，只看體積","explanation":"發育的重要面向就是構造與功能的分化。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：生長與發育常相伴，但觀察重點不同。可先記錄大小變化，再補上構造、分化和成熟，不能把兩者都縮成繁殖或單一體積。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B037","topicId":"BIO-C1.1I-GROW","stem":"學生以照片記錄幼苗，只有「第1天較小、第10天較大」兩句說明。若要補足發育的描述，哪項最相關？","correct":"BIO-B01-Ch1.1-B037:D","options":[{"id":"BIO-B01-Ch1.1-B037:A","text":"相機外殼顏色是否改變","explanation":"相機顏色與幼苗發育無直接關係。"},{"id":"BIO-B01-Ch1.1-B037:B","text":"桌子面積是否增加","explanation":"桌面面積不提供植物構造形成資訊。"},{"id":"BIO-B01-Ch1.1-B037:C","text":"照片檔案大小是否增加","explanation":"檔案容量是影像資料屬性，不是幼苗發育指標。"},{"id":"BIO-B01-Ch1.1-B037:D","text":"幼苗是否形成新的分化構造及成熟特徵","explanation":"構造分化與成熟能補上發育面向。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：較小到較大主要描述生長；若要理解發育，還須記錄生命個體內部或形態的分化及成熟，而非周邊設備或檔案資料。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B038","topicId":"BIO-C1.1I-GROW","stem":"一個幼體逐漸形成不同構造，同時需要食物提供的能量。對此應如何理解？","correct":"BIO-B01-Ch1.1-B038:A","options":[{"id":"BIO-B01-Ch1.1-B038:A","text":"生長發育可與能量處理相互連結","explanation":"此項保留兩個觀察焦點的連結。"},{"id":"BIO-B01-Ch1.1-B038:B","text":"只要需能量，就不能算發育","explanation":"需能量不會取消構造形成的發育性質。"},{"id":"BIO-B01-Ch1.1-B038:C","text":"只要形成構造，就不需物質與能量","explanation":"形成構造仍需材料與能量，不能由此排除。"},{"id":"BIO-B01-Ch1.1-B038:D","text":"兩種生命性質在同一個體中不能共存","explanation":"多項生命活動經常同時發生。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：生命性質不是互斥分類。構造形成是發育，而支持這些活動的能量取得與利用是能量處理，兩者可在同一過程中同時呈現。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B039","topicId":"BIO-C1.1I-GROW","stem":"同一植物在遺傳資訊影響下逐漸成熟。若要把它寫成「演化適應」題，還欠缺哪類核心資料？","correct":"BIO-B01-Ch1.1-B039:B","options":[{"id":"BIO-B01-Ch1.1-B039:A","text":"原植物的高度單位","explanation":"長度單位有助描述生長，但不足以證明演化。"},{"id":"BIO-B01-Ch1.1-B039:B","text":"族群可遺傳特徵與繁殖成功跨世代的變化","explanation":"此項補上族群、遺傳性與世代的必要面向。"},{"id":"BIO-B01-Ch1.1-B039:C","text":"原植物葉片的拍照角度","explanation":"拍攝角度不提供跨代遺傳變化。"},{"id":"BIO-B01-Ch1.1-B039:D","text":"培養容器的材質","explanation":"容器材質不能代替族群演化資料。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：個體成熟已有發育證據，但演化適應必須轉到族群多代、遺傳差異及選擇結果。增加照片或尺寸細節不能補上缺失的尺度。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B040","topicId":"BIO-C1.1I-GROW","stem":"某解說把「形成新葉」寫成「植物複製出一個完整後代」。題設只觀察同一株長葉。哪項修正最精確？","correct":"BIO-B01-Ch1.1-B040:C","options":[{"id":"BIO-B01-Ch1.1-B040:A","text":"新葉必然是另一物種","explanation":"器官形成沒有物種改變的證據。"},{"id":"BIO-B01-Ch1.1-B040:B","text":"形成器官表示植物有意識","explanation":"形成構造不能直接推出主觀意識。"},{"id":"BIO-B01-Ch1.1-B040:C","text":"應記為個體構造發育；未證明形成新植株","explanation":"此項準確依個體與器官尺度修正。"},{"id":"BIO-B01-Ch1.1-B040:D","text":"只要沒有後代，植物就沒有生命","explanation":"生育與否不是生命的唯一判準。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：新葉是原植物的構造。除非題目另給新生物個體的證據，不能把器官形成記成繁殖；此修正保留其真實的發育意義。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B041","topicId":"BIO-C1.1I-ENERGY","stem":"某昆蟲攝入花蜜後可維持飛行，報告寫成「昆蟲把不存在的能量製造出來」。哪項修正最適合？","correct":"BIO-B01-Ch1.1-B041:D","options":[{"id":"BIO-B01-Ch1.1-B041:A","text":"昆蟲飛行完全不需能量","explanation":"飛行等活動需要能量，不能否定。"},{"id":"BIO-B01-Ch1.1-B041:B","text":"花蜜只提供遺傳資訊","explanation":"花蜜在本例提供燃料，不是遺傳訊息的主要來源。"},{"id":"BIO-B01-Ch1.1-B041:C","text":"只要飛行，能量守恆就不適用","explanation":"生物活動同樣受能量守恆約束。"},{"id":"BIO-B01-Ch1.1-B041:D","text":"花蜜已有化學能，昆蟲透過代謝轉換以支持飛行","explanation":"此項清楚交代既有來源、轉換與活動三步關係。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：能量來源已由食物提供；個體進行的是轉換與利用。題目不需計算ATP產量，也不能因活動發生就取消守恆。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B042","topicId":"BIO-C1.1I-ENERGY","stem":"某封閉於物質交換的假想裝置仍持續接受光能。下列哪項判斷最嚴謹？","correct":"BIO-B01-Ch1.1-B042:A","options":[{"id":"BIO-B01-Ch1.1-B042:A","text":"物質不交換不代表能量也不交換","explanation":"題設已說光能持續輸入，兩種邊界不能混為一談。"},{"id":"BIO-B01-Ch1.1-B042:B","text":"物質封閉必表示光能無法進入","explanation":"此項與「持續接受光能」的條件矛盾。"},{"id":"BIO-B01-Ch1.1-B042:C","text":"有光能進入就表示裝置可創造能量","explanation":"接受外來能量是轉移，不是創造。"},{"id":"BIO-B01-Ch1.1-B042:D","text":"只要接受光就能證明裝置是生命","explanation":"非生命裝置也可接受光，不能單獨證明生命。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：題設明確區分物質與能量邊界。光能可作外來輸入，不是裝置自行創造；是否有生命仍需多項活動證據。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B043","topicId":"BIO-C1.1I-ENERGY","stem":"假想模型在觀察期間輸入100 J能量，對外作功40 J，沒有能量儲存改變；輸出只分對外作功及散熱，輸入等於兩者之和。散熱多少？","correct":"BIO-B01-Ch1.1-B043:B","options":[{"id":"BIO-B01-Ch1.1-B043:A","text":"40 J","explanation":"40 J是已列的對外作功，不是散熱。"},{"id":"BIO-B01-Ch1.1-B043:B","text":"60 J","explanation":"100 J扣除對外作功40 J，散熱為60 J。"},{"id":"BIO-B01-Ch1.1-B043:C","text":"100 J","explanation":"若散熱100 J再加作功40 J，總輸出超過輸入。"},{"id":"BIO-B01-Ch1.1-B043:D","text":"140 J","explanation":"140 J把輸入和作功相加，並非題設剩餘的輸出。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：依題設同一收支邊界，輸入＝對外作功＋散熱，故散熱＝100−40＝60 J。此模型沒有儲存改變，兩類輸出分別計算；不是某物種的固定生理效率。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B044","topicId":"BIO-C1.1I-ENERGY","stem":"一個教學模型中，同一批物質可在生物與環境間再利用，但能量持續輸入並有熱散出。下列摘要何者符合模型？","correct":"BIO-B01-Ch1.1-B044:C","options":[{"id":"BIO-B01-Ch1.1-B044:A","text":"材料再利用表示能量也全部原樣循環","explanation":"材料與能量的路徑不同，不能由物質循環推出能量全回收。"},{"id":"BIO-B01-Ch1.1-B044:B","text":"有熱散出表示能量被消滅","explanation":"熱是能量的轉移形式之一，散出不等於消滅。"},{"id":"BIO-B01-Ch1.1-B044:C","text":"物質可循環，能量仍需分別追蹤輸入與輸出","explanation":"此項保留物質循環與能量收支的差別。"},{"id":"BIO-B01-Ch1.1-B044:D","text":"生物不再需要能量來源","explanation":"題設仍持續輸入能量，不能反推不需要來源。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：物質的再次利用不等於所有能量回到相同狀態。模型同時呈現材料循環與能量流經系統，散熱應算入能量輸出。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B045","topicId":"BIO-C1.1I-ENERGY","stem":"研究紀錄包含「食物進入個體」「體內進行能量轉換」「肌肉活動」。若只問這三段的共同主軸，何者最適合？","correct":"BIO-B01-Ch1.1-B045:D","options":[{"id":"BIO-B01-Ch1.1-B045:A","text":"親代與後代的形成","explanation":"記錄沒有新個體與親代關係。"},{"id":"BIO-B01-Ch1.1-B045:B","text":"族群可遺傳特徵跨代累積","explanation":"記錄追蹤個體用能，沒有多代族群變化。"},{"id":"BIO-B01-Ch1.1-B045:C","text":"細胞構造的空間排列","explanation":"題幹不是量各構造的相對位置。"},{"id":"BIO-B01-Ch1.1-B045:D","text":"能量的取得、轉換與使用","explanation":"此項涵蓋三段共同的能量處理關係。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：三段組成來源到利用的流程。題幹沒有要求肌肉分子機制，只需理解食物化學能如何支持工作。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B046","topicId":"BIO-C1.1I-ENERGY","stem":"某學生說「只要不移動，生物就完全不處理能量」。哪項反駁最合理？","correct":"BIO-B01-Ch1.1-B046:A","options":[{"id":"BIO-B01-Ch1.1-B046:A","text":"維持內部條件與細胞活動也需要能量","explanation":"生命維持仍需能量，足以反駁只看位移的說法。"},{"id":"BIO-B01-Ch1.1-B046:B","text":"只有繁殖才需要能量","explanation":"繁殖以外還有維持、生長與運動等需求。"},{"id":"BIO-B01-Ch1.1-B046:C","text":"只有肉眼看得見的動作才耗能","explanation":"細胞層次的活動可耗能而不呈現整體動作。"},{"id":"BIO-B01-Ch1.1-B046:D","text":"生物靜止時一定沒有細胞活動","explanation":"靜止不等於內部活動全停，題面亦無此證據。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：能量不只支持整體位移，也支持細胞活動、維持及生長。外表不動不能直接推定內部停止運作。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B047","topicId":"BIO-C1.1I-ENERGY","stem":"甲紀錄原子被吸收、組成生物材料後再進入環境；乙紀錄食物化學能支持活動後有熱散出。最直接的區分是什麼？","correct":"BIO-B01-Ch1.1-B047:B","options":[{"id":"BIO-B01-Ch1.1-B047:A","text":"甲只關於意識；乙只關於繁殖","explanation":"兩份資料均未測意識或新後代。"},{"id":"BIO-B01-Ch1.1-B047:B","text":"甲追蹤物質去向；乙追蹤能量去向","explanation":"此項分清原子材料與能量形式。"},{"id":"BIO-B01-Ch1.1-B047:C","text":"甲證明能量被創造；乙證明原子消失","explanation":"兩者都不支持無中生有或原子被消滅。"},{"id":"BIO-B01-Ch1.1-B047:D","text":"兩者必完全相同，無法區分","explanation":"相關不等於相同，題目可清楚區分追蹤對象。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：甲以物質組成與去向為焦點，乙以能量形式和流出為焦點。兩者可在同一系統發生，但追蹤對象及描述量不同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B048","topicId":"BIO-C1.1I-ENERGY","stem":"假想模型在同一觀察期間輸入80 J能量，對外作功30 J並散熱50 J，無能量儲存改變及其他輸出。依輸入應等於輸出總和的原則，何種評論正確？","correct":"BIO-B01-Ch1.1-B048:C","options":[{"id":"BIO-B01-Ch1.1-B048:A","text":"散熱50 J代表50 J能量消失","explanation":"能量以熱離開邊界仍屬能量轉移，不是消滅。"},{"id":"BIO-B01-Ch1.1-B048:B","text":"對外作功30 J大於輸入80 J，所以不守恆","explanation":"30 J小於80 J，數值比較已不成立。"},{"id":"BIO-B01-Ch1.1-B048:C","text":"30＋50＝80 J，模型的收支相符","explanation":"作功及散熱總和與輸入相同，符合題設收支。"},{"id":"BIO-B01-Ch1.1-B048:D","text":"此組數據證明所有物種對外作功效率固定為30/80","explanation":"單一假想模型不足以推廣全部物種的固定效率。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：依題設把兩種對外輸出相加：作功30 J＋散熱50 J＝80 J，與輸入相同，且無儲存改變。熱流出不是能量消失；這組假想數據也不保證所有物種的效率相同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B049","topicId":"BIO-C1.1I-ENERGY","stem":"能量與物質主題中，「能量來源」和「生命身分」應如何區分？","correct":"BIO-B01-Ch1.1-B049:D","options":[{"id":"BIO-B01-Ch1.1-B049:A","text":"有能源輸入即可判定任何系統有生命","explanation":"非生命裝置亦可有能源輸入。"},{"id":"BIO-B01-Ch1.1-B049:B","text":"能耗越高表示生命性質越完整","explanation":"能耗多寡不能量化是否具整套生命性質。"},{"id":"BIO-B01-Ch1.1-B049:C","text":"非生命物絕不可能轉換能量","explanation":"機器等非生命物可轉換能量，此說錯誤。"},{"id":"BIO-B01-Ch1.1-B049:D","text":"能量轉換是生命活動的一面，但不是單獨充分的生命判準","explanation":"此項區分生命常見活動與充分生命判準。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：機械裝置也能轉換能量。生物的能量處理需放在有組織、調節、發育及生命延續等整體中理解，不能只憑輸入能源就完成判定。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B050","topicId":"BIO-C1.1I-ENERGY","stem":"某植物吸收材料形成新構造，並利用外來能量維持活動。最合適的教學結論為何？","correct":"BIO-B01-Ch1.1-B050:A","options":[{"id":"BIO-B01-Ch1.1-B050:A","text":"構造形成涉及物質利用，活動還需要能量處理","explanation":"此項同時交代材料與能量各自的角色。"},{"id":"BIO-B01-Ch1.1-B050:B","text":"只要形成構造就不需要能量","explanation":"構造形成並不取消能量需求。"},{"id":"BIO-B01-Ch1.1-B050:C","text":"材料進入就表示能量憑空增加","explanation":"材料及所攜能量皆有來源，不能稱憑空增加。"},{"id":"BIO-B01-Ch1.1-B050:D","text":"能量轉換會使所有材料都消失","explanation":"能量轉換不表示所有物質被消滅。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：生命需要材料作為結構與反應的參與者，也需要能量支持活動。兩者相互關聯，但物質吸收與能量輸入不能混作創造或消滅。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B051","topicId":"BIO-C1.1I-REG","stem":"假想動物的可運作體溫範圍為36～38 °C，三次量得36.8、37.2、37.0 °C。單憑這組數據，哪項評論最合理？","correct":"BIO-B01-Ch1.1-B051:C","options":[{"id":"BIO-B01-Ch1.1-B051:A","text":"三值不同，所以一定沒有調節","explanation":"數值不相等不能直接否定範圍內控制。"},{"id":"BIO-B01-Ch1.1-B051:B","text":"三值不同，所以每次都已死亡","explanation":"題設數值在可運作範圍，無死亡證據。"},{"id":"BIO-B01-Ch1.1-B051:C","text":"小幅波動仍在給定範圍，不能因不完全相等就否定調節","explanation":"此項正確比較數值並限制機制推論。"},{"id":"BIO-B01-Ch1.1-B051:D","text":"三值在範圍內，已證明全部調節機制","explanation":"範圍內讀值不能識別全部控制過程或因果。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：三個數值皆介於36及38之間，與可運作範圍一致。這不能單憑讀值證明具體機制，但足以反駁「調節必為數值完全不變」的判準。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B052","topicId":"BIO-C1.1I-REG","stem":"題設某動物原有熱累積，增加與外界熱交換後體溫回到可運作範圍。哪項是此段最直接的因果關係？","correct":"BIO-B01-Ch1.1-B052:D","options":[{"id":"BIO-B01-Ch1.1-B052:A","text":"體溫回穩使整個族群立即演化","explanation":"個體短期回穩沒有族群跨代資料。"},{"id":"BIO-B01-Ch1.1-B052:B","text":"散熱必使能量從宇宙消失","explanation":"熱離開個體仍是能量轉移，不是消滅。"},{"id":"BIO-B01-Ch1.1-B052:C","text":"增加熱交換就是產生新的後代","explanation":"熱交換不是後代形成。"},{"id":"BIO-B01-Ch1.1-B052:D","text":"調整熱交換有助於降低原先的體溫偏離","explanation":"這一關係完整對應題設的偏離、調整與結果。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：題面明確給出原先偏離、控制活動及回穩結果。調節關係成立於這個模型；不必再推到後代、族群演化或能量消滅。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B053","topicId":"BIO-C1.1I-REG","stem":"兩個假想裝置中的活體原本都在可運作範圍。環境變動後，甲能調整內部條件回到範圍；乙持續偏離且未見恢復。哪項判讀最合適？","correct":"BIO-B01-Ch1.1-B053:A","options":[{"id":"BIO-B01-Ch1.1-B053:A","text":"甲有本次調節的支持證據，乙的控制效果仍不足","explanation":"此項依題設恢復結果判斷，且不擴張乙的結論。"},{"id":"BIO-B01-Ch1.1-B053:B","text":"甲沒有調節，因為曾出現變化","explanation":"曾偏離仍可在控制後恢復，不能否定調節。"},{"id":"BIO-B01-Ch1.1-B053:C","text":"乙一定已演化出新性狀","explanation":"短期偏離不能證明跨代遺傳變化。"},{"id":"BIO-B01-Ch1.1-B053:D","text":"甲與乙都因環境變化而不再是生命","explanation":"遇到環境改變不會自動取消生命身分。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：比較要看擾動後內部狀態及恢復，而非要求完全不曾變動。乙未恢復顯示本次控制效果不足，但不能直接推出演化或非生命。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B054","topicId":"BIO-C1.1I-REG","stem":"某敘述只寫「葉片受碰觸後閉合」，未提供內部條件資料。若把它直接斷言為「體溫恆定調節」，哪項修正最合理？","correct":"BIO-B01-Ch1.1-B054:B","options":[{"id":"BIO-B01-Ch1.1-B054:A","text":"閉合一定只可能是繁殖","explanation":"閉合動作沒有新後代形成，非繁殖證據。"},{"id":"BIO-B01-Ch1.1-B054:B","text":"可確認回應刺激，但未提供體溫維持的證據","explanation":"此項保留已知反應並指出體溫控制證據缺口。"},{"id":"BIO-B01-Ch1.1-B054:C","text":"只要葉片有動作就一定有意識","explanation":"動作不能直接證明主觀意識。"},{"id":"BIO-B01-Ch1.1-B054:D","text":"沒有體溫資料代表植物沒有生命","explanation":"缺少某項測量不等於沒有生命活動。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：刺激與閉合直接支持環境反應。要更窄地稱為體溫調節，需另外知道所控制的內部量及維持效果；不能用未給資料補因果。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B055","topicId":"BIO-C1.1I-REG","stem":"某動物在熱環境下改變耳部血流。題目已說此改變能幫助體溫維持範圍。若問最直接性質，為何應選調節？","correct":"BIO-B01-Ch1.1-B055:C","options":[{"id":"BIO-B01-Ch1.1-B055:A","text":"因為所有血流改變都一定產生後代","explanation":"血流改變與新後代之間沒有必然關係。"},{"id":"BIO-B01-Ch1.1-B055:B","text":"因為題設只描述固定構造排列","explanation":"題目描述過程與功能，不是靜態排列。"},{"id":"BIO-B01-Ch1.1-B055:C","text":"因為控制活動與內部穩定的目的有明確連結","explanation":"此項說出調節所需的內部目標及控制關聯。"},{"id":"BIO-B01-Ch1.1-B055:D","text":"因為一隻動物已代表多個世代","explanation":"一個個體短期觀察不能取代多代族群資料。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：判別重點不只「變動血流」，而是這項變動能維持內部體溫。題設提供控制目標，足以區別一般反應與此處強調的調節功能。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B056","topicId":"BIO-C1.1I-REG","stem":"報告寫「調節良好，所以一個活體的體溫、水分與其他內部量永不波動」。其中錯誤在何處？","correct":"BIO-B01-Ch1.1-B056:D","options":[{"id":"BIO-B01-Ch1.1-B056:A","text":"把內部條件誤認為生命的一部分","explanation":"內部條件正是調節可作用的對象。"},{"id":"BIO-B01-Ch1.1-B056:B","text":"把调節錯當成需要能量的活動","explanation":"調節可有能量需求，這並非報告的錯誤。"},{"id":"BIO-B01-Ch1.1-B056:C","text":"未把每次波動都判成演化","explanation":"短期波動不是族群演化，沒有必要如此判定。"},{"id":"BIO-B01-Ch1.1-B056:D","text":"把可運作範圍內的穩定誤寫成絕對不變","explanation":"此項精確指出範圍與絕對常數被混淆。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：良好調節表示能把擾動控制在可接受範圍；各量仍可隨時間小幅波動。不能由功能穩定擴張成所有數值終身不變。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B057","topicId":"BIO-C1.1I-REG","stem":"某假想系統允許的內部量為8～12單位。受擾動升至14後，控制活動使其依序降為11、10。哪項結論與資料相符？","correct":"BIO-B01-Ch1.1-B057:A","options":[{"id":"BIO-B01-Ch1.1-B057:A","text":"控制後回到給定範圍，支持本次調節有效","explanation":"先偏離再回到範圍，符合題設的控制效果。"},{"id":"BIO-B01-Ch1.1-B057:B","text":"14在8～12之內，所以沒有偏離","explanation":"14大於12，區間判斷錯誤。"},{"id":"BIO-B01-Ch1.1-B057:C","text":"從14下降就一定代表個體死亡","explanation":"下降至可運作範圍不等於死亡。"},{"id":"BIO-B01-Ch1.1-B057:D","text":"降到10表示相關性狀已在族群固定","explanation":"個體內部數值與族群性狀固定不同。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：14高於上限12，11及10都在8～12中；觀察支持此控制使內在狀態恢復。題設數字僅供區間判斷，不代表某實際生理量的常值。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B058","topicId":"BIO-C1.1I-REG","stem":"同一動物今天調整散熱，明天仍可再次調整。另一資料顯示族群中可遺傳保護色在多代增加。兩者的觀察尺度如何區分？","correct":"BIO-B01-Ch1.1-B058:B","options":[{"id":"BIO-B01-Ch1.1-B058:A","text":"兩者都只是同一個體成長","explanation":"散熱與族群多代變化都不能概括成個體長大。"},{"id":"BIO-B01-Ch1.1-B058:B","text":"前者為個體短期調節，後者為族群跨代變化","explanation":"此項正確區分對象及時間尺度。"},{"id":"BIO-B01-Ch1.1-B058:C","text":"前者必是演化，後者必是體溫控制","explanation":"此項把兩種過程倒置。"},{"id":"BIO-B01-Ch1.1-B058:D","text":"兩者都必定產生新的物種","explanation":"資料不支持任一過程必然形成新物種。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：反覆可發生的個體散熱控制屬於調節；族群的可遺傳保護色多代增加屬於演化的尺度。不能把「改變」全用同一名詞。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B059","topicId":"BIO-C1.1I-REG","stem":"研究者欲證明某反應有助於內部穩定，除了記錄反應本身，最應補充哪項資料？","correct":"BIO-B01-Ch1.1-B059:C","options":[{"id":"BIO-B01-Ch1.1-B059:A","text":"觀察者喜歡哪種顏色","explanation":"個人偏好不是內部條件的測量。"},{"id":"BIO-B01-Ch1.1-B059:B","text":"動物的名字長短","explanation":"名字不提供生理控制效果資訊。"},{"id":"BIO-B01-Ch1.1-B059:C","text":"受控制內部條件在反應前後是否維持可運作範圍","explanation":"前後的內部量與範圍可直接檢查穩定效果。"},{"id":"BIO-B01-Ch1.1-B059:D","text":"桌面物品的排列順序","explanation":"桌面排列不是活體內部狀態。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：調節不是只要有任何反應。需把控制活動與內部量的結果連上，才能支持其穩定功能；本題不要求再推測特定分子機制。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B060","topicId":"BIO-C1.1I-REG","stem":"哪項說法能同時保留「有反應」與「能調節」可能重疊的關係？","correct":"BIO-B01-Ch1.1-B060:D","options":[{"id":"BIO-B01-Ch1.1-B060:A","text":"只要對外界反應就絕不可能調節內部","explanation":"有些反應正能支持內部穩定，兩者不互斥。"},{"id":"BIO-B01-Ch1.1-B060:B","text":"任何反應都必能使所有內部值穩定","explanation":"並非所有反應都控制內部量，不能一概推論。"},{"id":"BIO-B01-Ch1.1-B060:C","text":"調節一定只能發生於無環境變動時","explanation":"環境擾動正可能觸發調節，無此限制。"},{"id":"BIO-B01-Ch1.1-B060:D","text":"若外界刺激引起的反應有助維持內部條件，可同時涉及兩者","explanation":"此項以明確功能條件連結兩者，沒有過度概括。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：兩項生命性質可共同出現，但需題設的功能證據。由外界熱刺激到散熱、再到體溫回穩，即可從不同焦點描述反應與調節。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B061","topicId":"BIO-C1.1I-RESPONSE","stem":"假想觀察中，活植物葉片在觸碰後閉合，但未量測體溫，也未追蹤後代。哪項是最直接且不過度的紀錄？","correct":"BIO-B01-Ch1.1-B061:C","options":[{"id":"BIO-B01-Ch1.1-B061:A","text":"已確認體溫控制的完整機制","explanation":"未測體溫就不能確認其控制機制。"},{"id":"BIO-B01-Ch1.1-B061:B","text":"已確認族群演化速度","explanation":"沒有後代與多代資料，不能算演化速度。"},{"id":"BIO-B01-Ch1.1-B061:C","text":"觀察到對觸碰的反應，其他兩項仍無足夠資料","explanation":"此項與實際觀察範圍一致。"},{"id":"BIO-B01-Ch1.1-B061:D","text":"已證明此植物具有人的思考方式","explanation":"葉片閉合不提供人類式思考的證據。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：題設有刺激及葉片反應，卻缺體溫與世代資訊。應記錄已知反應，保留調節機制、演化及意識的推論限制。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B062","topicId":"BIO-C1.1I-RESPONSE","stem":"甲說植物固定在土中，所以不可能回應環境；乙提出其葉片可因觸碰而閉合。乙的例子直接反駁哪項混淆？","correct":"BIO-B01-Ch1.1-B062:D","options":[{"id":"BIO-B01-Ch1.1-B062:A","text":"把後代與親代視為不同個體","explanation":"親代與後代本來就是不同個體，非此例焦點。"},{"id":"BIO-B01-Ch1.1-B062:B","text":"把分化與成熟列為發育","explanation":"分化與成熟屬發育，此例並未反駁。"},{"id":"BIO-B01-Ch1.1-B062:C","text":"把熱散出視為能量輸出","explanation":"熱散出屬能量轉移，與此題的錯誤無關。"},{"id":"BIO-B01-Ch1.1-B062:D","text":"把整體位移誤當所有環境反應的必要形式","explanation":"此項精確指出甲把反應形式限得太窄。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：葉片閉合是局部變化，整株仍可留原地。乙由此指出反應不等於整體位移，沒有否定其他生命性質。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B063","topicId":"BIO-C1.1I-RESPONSE","stem":"某活體在外界訊號出現後改變活動。若要把此事進一步稱為「調節內部條件」，還需要哪項資訊？","correct":"BIO-B01-Ch1.1-B063:A","options":[{"id":"BIO-B01-Ch1.1-B063:A","text":"反應是否有助於某內部量保持可運作範圍","explanation":"此資料能建立反應與內部穩定的功能關係。"},{"id":"BIO-B01-Ch1.1-B063:B","text":"活體是否具有與桌子相同的顏色","explanation":"顏色相似不提供內部穩定證據。"},{"id":"BIO-B01-Ch1.1-B063:C","text":"訊號名稱是否包含英文字母","explanation":"訊號命名方式不決定生理功能。"},{"id":"BIO-B01-Ch1.1-B063:D","text":"觀察者是否覺得反應很聰明","explanation":"覺得聰明不是內部條件控制的測量。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：一般反應需刺激與變化；調節還需連到內在條件的維持功能。因此要補的是控制目標與效果，而非外觀或擬人化評語。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B064","topicId":"BIO-C1.1I-RESPONSE","stem":"同一植物在數秒內閉合葉片，研究者卻稱這是「當下完成的演化適應」。哪項修正正確？","correct":"BIO-B01-Ch1.1-B064:B","options":[{"id":"BIO-B01-Ch1.1-B064:A","text":"閉合是構造永遠不變的秩序","explanation":"題目描述動作改變，不是完全不變的結構。"},{"id":"BIO-B01-Ch1.1-B064:B","text":"本次是個體的刺激反應，不能代替族群跨代適應證據","explanation":"此項區分個體反應事件與族群演化尺度。"},{"id":"BIO-B01-Ch1.1-B064:C","text":"任何植物反應都與生命無關","explanation":"刺激反應是生命的常見活動。"},{"id":"BIO-B01-Ch1.1-B064:D","text":"數秒反應可直接證明所有後代性狀改變","explanation":"未追蹤後代，無法判斷其性狀是否改變。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：生理反應能力本身可能有演化歷史，但一次閉合的直接證據只在個體短時間。不可把能力的歷史來源與本次動作當成同一事件。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B065","topicId":"BIO-C1.1I-RESPONSE","stem":"某人看見植物受觸碰後閉合，就說它「想抓住碰它的物體」。只依所見，何種敘述較嚴謹？","correct":"BIO-B01-Ch1.1-B065:C","options":[{"id":"BIO-B01-Ch1.1-B065:A","text":"植物一定具有和人完全相同的意圖","explanation":"人的意圖不能直接投射到植物上。"},{"id":"BIO-B01-Ch1.1-B065:B","text":"所有葉片閉合必然都是隨機現象","explanation":"題設給刺激與反應，不能無據改寫成完全隨機。"},{"id":"BIO-B01-Ch1.1-B065:C","text":"植物對觸碰作出反應，尚不能證明主觀意圖","explanation":"此項將觀察事實與心理推論分開。"},{"id":"BIO-B01-Ch1.1-B065:D","text":"植物從此一定失去繁殖能力","explanation":"一次閉合無法判斷其繁殖能力變化。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：行為描述應先保留可觀察的刺激與反應。把反應寫成「想要」會增加未測到的心理原因；也不能反向武斷否認觀察到的刺激關係。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B066","topicId":"BIO-C1.1I-RESPONSE","stem":"假想課堂觀察：同種植物除是否觸碰外，其餘條件相同。觸碰組8株中6株閉合，未觸碰組8株均未閉合。僅就此資料，何者最合理？","correct":"BIO-B01-Ch1.1-B066:D","options":[{"id":"BIO-B01-Ch1.1-B066:A","text":"所有植物遇任何刺激必閉合","explanation":"題目只測某同種植物的一種條件，不能全稱推廣。"},{"id":"BIO-B01-Ch1.1-B066:B","text":"已有充分證據證明植物意識","explanation":"閉合比例不直接測主觀意識。"},{"id":"BIO-B01-Ch1.1-B066:C","text":"觸碰組有2株未閉合，所以完全沒有反應證據","explanation":"部分未閉合不會抹去其餘6株的反應資料。"},{"id":"BIO-B01-Ch1.1-B066:D","text":"本次資料支持觸碰與閉合有關，但不能推及所有植物或意識","explanation":"此項使用兩組資料並適當限制外推。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：本組有6/8對0/8的差異，可支持本次條件下的刺激反應關聯。仍不可由有限資料保證所有個體所有情境必反應，也沒有意識測量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B067","topicId":"BIO-C1.1I-RESPONSE","stem":"刺激與反應的箭頭若寫為「外界觸碰→葉片閉合」，在本題中主要表示什麼？","correct":"BIO-B01-Ch1.1-B067:A","options":[{"id":"BIO-B01-Ch1.1-B067:A","text":"題設刺激先於所觀察的反應","explanation":"箭頭描述觸碰刺激及其後反應，符合題目。"},{"id":"BIO-B01-Ch1.1-B067:B","text":"葉片閉合是產生後代","explanation":"閉合不是後代形成。"},{"id":"BIO-B01-Ch1.1-B067:C","text":"所有刺激一定使葉片永久閉合","explanation":"圖示關係未給永久性或所有刺激皆同效的條件。"},{"id":"BIO-B01-Ch1.1-B067:D","text":"葉片已在當下創造新的遺傳資訊","explanation":"動作反應不能直接推出新的遺傳資訊形成。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：箭頭在這個明確題設中連結刺激與隨後反應，不表示繁殖、永久狀態或遺傳改寫。要依箭頭所定義的關係解讀。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B068","topicId":"BIO-C1.1I-RESPONSE","stem":"植物在光照改變後調整生理活動，但整株位置沒有改變。下列解讀何者正確？","correct":"BIO-B01-Ch1.1-B068:B","options":[{"id":"BIO-B01-Ch1.1-B068:A","text":"沒有位移就沒有反應","explanation":"此項把反應誤限成整體位移。"},{"id":"BIO-B01-Ch1.1-B068:B","text":"生理活動的改變仍可構成對環境的反應","explanation":"此項依給定生理變化判定反應，符合定義。"},{"id":"BIO-B01-Ch1.1-B068:C","text":"所有植物必須先產生後代才能反應","explanation":"刺激反應不以先繁殖為必要條件。"},{"id":"BIO-B01-Ch1.1-B068:D","text":"只要光照改變就已證明族群演化","explanation":"環境改變本身不能取代族群跨代證據。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：回應環境可表現在生理活動而非位置改變。題面已給光照與活動調整的關係，無須另要求移動、後代或多代改變。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B069","topicId":"BIO-C1.1I-RESPONSE","stem":"若把「植物會對刺激反應」改寫成「植物對每種刺激都作同一反應」，新增了哪個未經支持的主張？","correct":"BIO-B01-Ch1.1-B069:C","options":[{"id":"BIO-B01-Ch1.1-B069:A","text":"植物可有生命活動","explanation":"植物的反應能力確是生命活動之一，非新增錯誤。"},{"id":"BIO-B01-Ch1.1-B069:B","text":"特定刺激後可觀察變化","explanation":"這仍是原觀念的合理表述。"},{"id":"BIO-B01-Ch1.1-B069:C","text":"所有刺激與反應形式均相同","explanation":"此項就是由部分能力擴張為所有條件相同。"},{"id":"BIO-B01-Ch1.1-B069:D","text":"反應不一定需要位移","explanation":"這是反應形式的正確理解，不是該改寫新增主張。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：原句只宣告植物具有反應能力，沒有給出所有刺激的效果。改寫加入「每種」和「同一」，擴張到未觀察的條件，是不合理的普遍化。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B070","topicId":"BIO-C1.1I-RESPONSE","stem":"一個自動門與活植物都會受外界輸入而動作。比較時哪項最嚴謹？","correct":"BIO-B01-Ch1.1-B070:D","options":[{"id":"BIO-B01-Ch1.1-B070:A","text":"兩者有反應，所以一定同為生物","explanation":"人工系統反應不足以構成生命的充分證據。"},{"id":"BIO-B01-Ch1.1-B070:B","text":"自動門會動，植物便不能算生命","explanation":"一方會動不影響植物已有的生命活動。"},{"id":"BIO-B01-Ch1.1-B070:C","text":"活植物反應證明它一定像人思考","explanation":"生物的反應也不直接等於人的思考。"},{"id":"BIO-B01-Ch1.1-B070:D","text":"可有表面相似的刺激反應，但生命與意識都需另作判斷","explanation":"此項分清反應相似性、生命判準及意識推論。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：非生命裝置可模擬反應。比較應保留系統背景，不能從一個共同動作直接斷定生命身分，更不能據此推定主觀意識。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／
