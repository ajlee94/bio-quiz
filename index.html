域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：分辨DNA所在區域與細胞核，名稱包含核不能代替核膜證據。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B096","topicId":"BIO-1.1.1-TYPE","stem":"某微生物只觀察到體積小，尚未看清核與內部胞器。可否立刻斷定它是原核？","correct":"BIO-B01-Ch1.1.1-B096:B","options":[{"id":"BIO-B01-Ch1.1.1-B096:A","text":"不能；因所有小細胞都屬真核","explanation":"不正確。小也不必然真核，仍需證據。"},{"id":"BIO-B01-Ch1.1.1-B096:B","text":"不能確定；應補查核與膜狀胞器的構造證據","explanation":"正確。大小只能作一般線索，不能取代分類構造。"},{"id":"BIO-B01-Ch1.1.1-B096:C","text":"可以；大小是唯一分類標準","explanation":"不正確。兩類細胞的大小不是唯一標準。"},{"id":"BIO-B01-Ch1.1.1-B096:D","text":"可以；所有微生物都沒有細胞核","explanation":"不正確。微生物也可能是真核。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：目前僅有大小，缺少典型構造判別資訊，應保留待確認。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B097","topicId":"BIO-1.1.1-TYPE","stem":"一個細胞有膜包圍的DNA區域，另有多種膜狀胞器。若要設計最簡潔的分類說明，應強調哪點？","correct":"BIO-B01-Ch1.1.1-B097:C","options":[{"id":"BIO-B01-Ch1.1.1-B097:A","text":"只強調「有分子」，因真核由分子而原核不是","explanation":"不正確。兩類細胞都由化學物質構成。"},{"id":"BIO-B01-Ch1.1.1-B097:B","text":"只強調「能做某種工作」，因原核沒有功能","explanation":"不正確。原核細胞也進行基本生命活動。"},{"id":"BIO-B01-Ch1.1.1-B097:C","text":"膜包圍的核及其他膜狀胞器支持真核判斷","explanation":"正確。典型真核的核與膜狀胞器構造是直接根據。"},{"id":"BIO-B01-Ch1.1.1-B097:D","text":"只強調「有DNA」，因原核都沒有DNA","explanation":"不正確。原核有DNA，故這個理由錯。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：說明必須指出能區分兩者的構造，而非兩者共有的特徵。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B098","topicId":"BIO-1.1.1-TYPE","stem":"某比較表寫「原核：沒有細胞核，也沒有DNA；真核：有細胞核」。最必要的修正是什麼？","correct":"BIO-B01-Ch1.1.1-B098:D","options":[{"id":"BIO-B01-Ch1.1.1-B098:A","text":"把原核改為「核區就是有核膜的細胞核」","explanation":"不正確。核區沒有核膜，不能與細胞核等同。"},{"id":"BIO-B01-Ch1.1.1-B098:B","text":"把真核改為「典型細胞核沒有膜包圍」","explanation":"不正確。典型真核的細胞核受膜包圍。"},{"id":"BIO-B01-Ch1.1.1-B098:C","text":"把原核改為「有核膜，但沒有任何遺傳物質」","explanation":"不正確。原核有DNA且無核膜，這個修正兩點都錯。"},{"id":"BIO-B01-Ch1.1.1-B098:D","text":"把原核的「沒有DNA」改為「有DNA，但無膜包圍的細胞核」","explanation":"正確。原核仍有DNA，差異在膜包圍的核。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：表格主要錯在將無核與無遺傳物質等同，修正此句即可恢復核心比較。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B099","topicId":"BIO-1.1.1-TYPE","stem":"細菌與古菌都屬原核，但不能因此說兩者沒有生命的基本單位。哪句話最能說清原因？","correct":"BIO-B01-Ch1.1.1-B099:A","options":[{"id":"BIO-B01-Ch1.1.1-B099:A","text":"兩者本身由原核細胞構成，無核膜不代表不是細胞","explanation":"正確。細胞基本單位包括原核，核不是所有細胞必要構造。"},{"id":"BIO-B01-Ch1.1.1-B099:B","text":"原核只有DNA而無任何其他成分","explanation":"不正確。原核是組織化細胞，不是只有DNA。"},{"id":"BIO-B01-Ch1.1.1-B099:C","text":"只有帶細胞核者才能執行任何反應","explanation":"不正確。無核的原核仍能進行生命活動。"},{"id":"BIO-B01-Ch1.1.1-B099:D","text":"古菌名稱不同，因此必是多細胞器官","explanation":"不正確。名稱不能推出器官身分，古菌為原核。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：細胞作為基本單位與有無細胞核是不同分類問題。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true},{"id":"BIO-B01-Ch1.1.1-B100","topicId":"BIO-1.1.1-TYPE","stem":"甲有膜包圍的核，乙只有無膜包圍的核區；兩者都具有DNA。下列哪種總結最完整？","correct":"BIO-B01-Ch1.1.1-B100:B","options":[{"id":"BIO-B01-Ch1.1.1-B100:A","text":"有核區表示乙也有膜包圍的細胞核","explanation":"不正確。核區沒有核膜，不能當成真核細胞核。"},{"id":"BIO-B01-Ch1.1.1-B100:B","text":"DNA可為兩者共有；核膜包圍與否可區分其典型細胞型態","explanation":"正確。共有遺傳物質不排除核的組織方式差異。"},{"id":"BIO-B01-Ch1.1.1-B100:C","text":"只要共有DNA，兩者所有構造必定相同","explanation":"不正確。共同一項特徵不能推出所有構造相同。"},{"id":"BIO-B01-Ch1.1.1-B100:D","text":"只要核構造不同，乙必定沒有任何生命活動","explanation":"不正確。原核仍是生命細胞，差異不取消基本活動。"}],"concept":"典型真核細胞具有膜包圍的細胞核及其他膜狀胞器；原核細胞沒有膜包圍的細胞核及這些胞器。原核仍有DNA，集中區域稱核區或擬核，不能把核區當成有核膜的細胞核。細菌與古菌屬原核；分類判斷須看構造證據，不能只憑單細胞生活或大小。\n本題判斷：共同點與差異需同時記住：都有DNA，但DNA是否被核膜包圍不同。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1 — New Properties Emerge at Successive Levels of Biological Organization｜印刷 6 頁（PDF 55 頁）｜本節筆記 正文第13頁／正式第15張（22_imagegen_page_15.png）","shuffle":true}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"bio-chapter-01-concept-1-1-child-02-theme-life-s-processes-involve-the-expression-and-transmission-of-genetic-information","title":"Ch1.1.2 主題：生命活動涉及遺傳資訊的表現與傳遞","version":"B01-v2-20260911:7ca5f1c6728ee6ef1b3e","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["Campbell Biology 12e｜第一輪","Ch1 演化、生物學主題與科學探究","Ch1.1 生命的統整主題"],"comparison":{"status":"BASELINE","reason":"中國醫為主要題庫及唯一比對基準。"},"banks":[{"depth":"掃過","target":50,"questions":[{"id":"BIO-B01-Ch1.1.2-S001","topicId":"BIO-Ch1.1.2-T01","stem":"研究者在一條染色體的DNA上標出三段可指導細胞產物形成的區域。這三段區域最適合稱為什麼？","correct":"BIO-B01-Ch1.1.2-S001:B","options":[{"id":"BIO-B01-Ch1.1.2-S001:A","text":"三套基因體","explanation":"基因體是整套DNA資訊，不是任意三段。"},{"id":"BIO-B01-Ch1.1.2-S001:B","text":"三個基因","explanation":"每一段具有產物資訊，符合基因的意義。"},{"id":"BIO-B01-Ch1.1.2-S001:C","text":"三條染色體","explanation":"三段都在同一條染色體上，不能改算三條。"},{"id":"BIO-B01-Ch1.1.2-S001:D","text":"三種蛋白質","explanation":"標記的是DNA區域；蛋白質是可由資訊指導合成的產物。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：題目標出的是DNA的功能片段，因此各為基因；標出三段不會讓原染色體變成三條。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S002","topicId":"BIO-Ch1.1.2-T01","stem":"以一條未複製的真核染色體為例，下列哪一項描述正確？","correct":"BIO-B01-Ch1.1.2-S002:A","options":[{"id":"BIO-B01-Ch1.1.2-S002:A","text":"含一個雙股DNA分子","explanation":"一個長雙股DNA分子是此階段的正確描述。"},{"id":"BIO-B01-Ch1.1.2-S002:B","text":"只由蛋白質組成","explanation":"染色體含DNA與蛋白質，不能省略DNA。"},{"id":"BIO-B01-Ch1.1.2-S002:C","text":"每條只能含一個基因","explanation":"長DNA分子上可分布許多基因。"},{"id":"BIO-B01-Ch1.1.2-S002:D","text":"兩條DNA股各算一個染色體","explanation":"核苷酸股、DNA分子與染色體是不同計數層級。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：未複製染色體中的兩股共同組成一個DNA分子，該分子可有多個基因。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S003","topicId":"BIO-Ch1.1.2-T01","stem":"下列哪組「對象—主要描述」配對最恰當？","correct":"BIO-B01-Ch1.1.2-S003:D","options":[{"id":"BIO-B01-Ch1.1.2-S003:A","text":"基因—整套遺傳指令","explanation":"整套遺傳指令稱為基因體，尺度較大。"},{"id":"BIO-B01-Ch1.1.2-S003:B","text":"染色體—四種游離核苷酸","explanation":"染色體是組織化結構，不是四個游離單位。"},{"id":"BIO-B01-Ch1.1.2-S003:C","text":"DNA—細胞製造的全部蛋白質","explanation":"DNA是核酸；蛋白質集合不是DNA。"},{"id":"BIO-B01-Ch1.1.2-S003:D","text":"基因—DNA上的功能資訊片段","explanation":"基因位於DNA上，包含製造細胞產物的資訊。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：判斷時先分辨整套資訊、載體結構與局部片段；基因屬於局部功能資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S004","topicId":"BIO-Ch1.1.2-T01","stem":"若把DNA比喻成長篇文字，基因最適合比喻成哪一項？","correct":"BIO-B01-Ch1.1.2-S004:C","options":[{"id":"BIO-B01-Ch1.1.2-S004:A","text":"紙張旁的所有讀者","explanation":"讀者較像使用資訊的細胞系統，不是DNA片段。"},{"id":"BIO-B01-Ch1.1.2-S004:B","text":"所有書籍的總集合","explanation":"整套書籍較接近基因體尺度，非單一基因。"},{"id":"BIO-B01-Ch1.1.2-S004:C","text":"具有特定功能資訊的一段文字","explanation":"有功能資訊的一段文字對應DNA上的基因。"},{"id":"BIO-B01-Ch1.1.2-S004:D","text":"印刷時使用的單一字母","explanation":"單一字母較像一個核苷酸符號，不足以代表整段基因。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：此比喻只表達包含關係：DNA包含功能片段，不能把基因縮成單一核苷酸。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S005","topicId":"BIO-Ch1.1.2-T01","stem":"學生寫下「基因、DNA和染色體是三個完全相同的名稱」。最適當的訂正是？","correct":"BIO-B01-Ch1.1.2-S005:A","options":[{"id":"BIO-B01-Ch1.1.2-S005:A","text":"染色體含DNA，基因是DNA的一段","explanation":"此句正確區分三者的層級。"},{"id":"BIO-B01-Ch1.1.2-S005:B","text":"DNA由許多染色體接成","explanation":"關係倒置；染色體包含DNA。"},{"id":"BIO-B01-Ch1.1.2-S005:C","text":"染色體是基因表現後的蛋白質","explanation":"染色體承載資訊，不是表現後的蛋白質成品。"},{"id":"BIO-B01-Ch1.1.2-S005:D","text":"基因只能存在於蛋白質上","explanation":"本題細胞基因位於DNA，而非蛋白質上。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：三個詞分別指結構、資訊分子與功能片段，存在包含關係而非同義關係。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S006","topicId":"BIO-Ch1.1.2-T02","stem":"人類正常受精時，形成受精卵的核DNA主要由哪兩者共同提供？","correct":"BIO-B01-Ch1.1.2-S006:C","options":[{"id":"BIO-B01-Ch1.1.2-S006:A","text":"父母各一個完整體細胞","explanation":"受精使用配子，不是兩個完整體細胞融合。"},{"id":"BIO-B01-Ch1.1.2-S006:B","text":"母親兩個卵","explanation":"正常受精的兩套分別來自父方精子與母方卵。"},{"id":"BIO-B01-Ch1.1.2-S006:C","text":"一個精子與一個卵","explanation":"精卵是傳遞雙親核DNA的配子。"},{"id":"BIO-B01-Ch1.1.2-S006:D","text":"只有精子","explanation":"只計精子會漏掉卵提供的母方核DNA。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：父方核DNA隨精子、母方核DNA隨卵進入受精卵，兩者各貢獻一套。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S007","topicId":"BIO-Ch1.1.2-T02","stem":"組織生長時，一個一般體細胞要分成兩個子細胞。哪個過程有助於兩個子細胞都得到DNA資訊？","correct":"BIO-B01-Ch1.1.2-S007:A","options":[{"id":"BIO-B01-Ch1.1.2-S007:A","text":"分裂前先複製DNA","explanation":"複製為後續分配準備DNA拷貝。"},{"id":"BIO-B01-Ch1.1.2-S007:B","text":"先把DNA全部轉成蛋白質","explanation":"DNA資訊可指導蛋白質合成，DNA本身不需被耗盡。"},{"id":"BIO-B01-Ch1.1.2-S007:C","text":"分裂時丟棄一半基因","explanation":"一般生長分裂並非以丟棄一半基因為目的。"},{"id":"BIO-B01-Ch1.1.2-S007:D","text":"只複製細胞外的蛋白質","explanation":"細胞外蛋白質不能替代子細胞所需的DNA。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：先增加DNA拷貝再分配，才可讓增加的細胞持有原有資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S008","topicId":"BIO-Ch1.1.2-T02","stem":"下列哪個例子最直接屬於遺傳資訊「傳遞」？","correct":"BIO-B01-Ch1.1.2-S008:D","options":[{"id":"BIO-B01-Ch1.1.2-S008:A","text":"DNA序列保存在細胞內","explanation":"此例描述儲存，未強調交給下一代。"},{"id":"BIO-B01-Ch1.1.2-S008:B","text":"細胞依mRNA製造酵素","explanation":"這是基因表現中的蛋白質合成。"},{"id":"BIO-B01-Ch1.1.2-S008:C","text":"胺基酸鏈折成特定形狀","explanation":"折疊涉及蛋白質形成與功能，非世代傳遞。"},{"id":"BIO-B01-Ch1.1.2-S008:D","text":"親代經配子將DNA交給子代","explanation":"配子將雙親資訊送入子代，符合傳遞。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：傳遞強調資訊接收者改變，從親代到子代；不是同一細胞內讀出資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S009","topicId":"BIO-Ch1.1.2-T02","stem":"孩子的某項性狀與父母相似。以遺傳資訊觀點，最合理的基本解釋為何？","correct":"BIO-B01-Ch1.1.2-S009:B","options":[{"id":"BIO-B01-Ch1.1.2-S009:A","text":"父母把完成的器官縮小後放入配子","explanation":"器官成品不是此遺傳傳遞的單位。"},{"id":"BIO-B01-Ch1.1.2-S009:B","text":"子代取得DNA資訊並在發育中使用","explanation":"取得並使用DNA資訊可連結遺傳與發育。"},{"id":"BIO-B01-Ch1.1.2-S009:C","text":"子代只繼承父母已製造的全部蛋白質","explanation":"全部親代蛋白質不是可取代DNA的遺傳資訊庫。"},{"id":"BIO-B01-Ch1.1.2-S009:D","text":"相似性狀表示完全不需發育","explanation":"相似性不取消子代自身的發育過程。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：DNA提供性狀形成的資訊基礎，性狀須透過細胞活動和發育逐步形成。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S010","topicId":"BIO-Ch1.1.2-T02","stem":"下列哪一句能區分遺傳資訊傳遞與基因表現？","correct":"BIO-B01-Ch1.1.2-S010:A","options":[{"id":"BIO-B01-Ch1.1.2-S010:A","text":"傳遞是交給下一代，表現是依資訊製造細胞產物","explanation":"正確區分資訊交接與資訊使用。"},{"id":"BIO-B01-Ch1.1.2-S010:B","text":"傳遞是製造蛋白質，表現是精卵結合","explanation":"將兩種概念的方向對調了。"},{"id":"BIO-B01-Ch1.1.2-S010:C","text":"兩者都表示DNA分子被消耗成RNA","explanation":"轉錄利用DNA資訊合成RNA，非消耗DNA來變形。"},{"id":"BIO-B01-Ch1.1.2-S010:D","text":"兩者都只在父母生殖時發生","explanation":"細胞也會表現基因，體細胞分裂也傳遞DNA。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：傳遞描述接收資訊的世代或細胞；表現描述資訊如何被使用。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S011","topicId":"BIO-Ch1.1.2-T03","stem":"兩段DNA都呈雙股螺旋，卻可帶有不同遺傳資訊。最直接的原因為何？","correct":"BIO-B01-Ch1.1.2-S011:B","options":[{"id":"BIO-B01-Ch1.1.2-S011:A","text":"它們必定屬不同化學元素","explanation":"資訊差異不需假設使用不同元素。"},{"id":"BIO-B01-Ch1.1.2-S011:B","text":"核苷酸排列順序可以不同","explanation":"核苷酸順序正是資訊內容的關鍵。"},{"id":"BIO-B01-Ch1.1.2-S011:C","text":"雙螺旋不能容納資訊","explanation":"DNA的序列可儲存資訊，雙螺旋不會排除此能力。"},{"id":"BIO-B01-Ch1.1.2-S011:D","text":"所有DNA序列其實相同","explanation":"DNA序列可不同，不能一概視為相同。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：共同外形並不保證構件的順序相同；資訊差別可在序列層次呈現。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S012","topicId":"BIO-Ch1.1.2-T03","stem":"在DNA字母序列中，A、T、C、G最直接代表哪一類構件？","correct":"BIO-B01-Ch1.1.2-S012:D","options":[{"id":"BIO-B01-Ch1.1.2-S012:A","text":"四種胺基酸","explanation":"胺基酸組成蛋白質，不能與DNA四種構件混用。"},{"id":"BIO-B01-Ch1.1.2-S012:B","text":"四套染色體","explanation":"染色體是較高層結構，不是這四個字母的意義。"},{"id":"BIO-B01-Ch1.1.2-S012:C","text":"四個完整基因","explanation":"每個字母只記錄構件類別，不是完整功能片段。"},{"id":"BIO-B01-Ch1.1.2-S012:D","text":"四種DNA核苷酸","explanation":"四種核苷酸按序連接，構成DNA的資訊序列。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：這四種符號用來記錄核苷酸種類及排列，不是蛋白質的胺基酸代號集合。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S013","topicId":"BIO-Ch1.1.2-T03","stem":"若要記錄一小段DNA的資訊內容，下列哪項資料最重要？","correct":"BIO-B01-Ch1.1.2-S013:A","options":[{"id":"BIO-B01-Ch1.1.2-S013:A","text":"各位置核苷酸的先後排列","explanation":"依序記錄A、T、C、G可保存逐位置資訊。"},{"id":"BIO-B01-Ch1.1.2-S013:B","text":"該段核苷酸的總個數","explanation":"相同長度仍可能有不同排列。"},{"id":"BIO-B01-Ch1.1.2-S013:C","text":"各類核苷酸在片段的比例","explanation":"相同比例不保證每個位置相同。"},{"id":"BIO-B01-Ch1.1.2-S013:D","text":"DNA分子的雙股螺旋外形","explanation":"雙股螺旋是共同構造，不能代替序列內容。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：序列記錄每個位置的構件；總長度、各類比例及雙螺旋外形都不足以還原排列。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S014","topicId":"BIO-Ch1.1.2-T03","stem":"「書中使用相同字母，仍可寫出不同句子」最適合說明DNA的哪項特性？","correct":"BIO-B01-Ch1.1.2-S014:C","options":[{"id":"BIO-B01-Ch1.1.2-S014:A","text":"資訊只由DNA長度決定","explanation":"相同長度也能有不同序列。"},{"id":"BIO-B01-Ch1.1.2-S014:B","text":"每個物種一定使用不同字母","explanation":"不同生物仍可使用相同四種DNA構件。"},{"id":"BIO-B01-Ch1.1.2-S014:C","text":"同種構件的不同排列可帶來不同資訊","explanation":"排列順序使相同構件形成不同資訊內容。"},{"id":"BIO-B01-Ch1.1.2-S014:D","text":"DNA只要有四種構件就有完全相同資訊","explanation":"四種構件是共同字母表，並非固定的一篇文章。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：比喻關鍵是順序；構件種類相同不表示排列內容相同。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S015","topicId":"BIO-Ch1.1.2-T03","stem":"下列哪個敘述正確區分DNA形狀與DNA資訊？","correct":"BIO-B01-Ch1.1.2-S015:A","options":[{"id":"BIO-B01-Ch1.1.2-S015:A","text":"雙股螺旋是構造，核苷酸順序記錄資訊","explanation":"同時保留分子構造與序列的不同角色。"},{"id":"BIO-B01-Ch1.1.2-S015:B","text":"雙股螺旋表示所有基因完全相同","explanation":"共同形狀不會使所有基因序列相同。"},{"id":"BIO-B01-Ch1.1.2-S015:C","text":"核苷酸的順序與資訊無關","explanation":"資訊正是由特定核苷酸順序承載。"},{"id":"BIO-B01-Ch1.1.2-S015:D","text":"只有單股DNA才可能具有序列","explanation":"雙股DNA的每一股同樣具有核苷酸序列。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：形狀與序列是不同面向，DNA具有雙螺旋構造，也具有能表示資訊的排列。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S016","topicId":"BIO-Ch1.1.2-T04","stem":"某細胞以DNA資訊合成mRNA，這一步稱為什麼？","correct":"BIO-B01-Ch1.1.2-S016:C","options":[{"id":"BIO-B01-Ch1.1.2-S016:A","text":"轉譯","explanation":"轉譯是依mRNA合成胺基酸鏈。"},{"id":"BIO-B01-Ch1.1.2-S016:B","text":"DNA複製","explanation":"DNA複製的產物是DNA拷貝。"},{"id":"BIO-B01-Ch1.1.2-S016:C","text":"轉錄","explanation":"DNA資訊被讀出形成mRNA，正是轉錄。"},{"id":"BIO-B01-Ch1.1.2-S016:D","text":"蛋白質折疊","explanation":"折疊改變胺基酸鏈構形，不製造mRNA。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：直接產物是mRNA，且模板為DNA，符合轉錄。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S017","topicId":"BIO-Ch1.1.2-T04","stem":"某細胞讀取mRNA上的資訊，將胺基酸連成一條鏈。這一步最直接稱為何？","correct":"BIO-B01-Ch1.1.2-S017:A","options":[{"id":"BIO-B01-Ch1.1.2-S017:A","text":"轉譯","explanation":"轉譯依mRNA序列合成胺基酸鏈。"},{"id":"BIO-B01-Ch1.1.2-S017:B","text":"轉錄","explanation":"轉錄的直接產物是RNA，不是胺基酸鏈。"},{"id":"BIO-B01-Ch1.1.2-S017:C","text":"受精","explanation":"受精是精卵結合，不是此細胞內合成步驟。"},{"id":"BIO-B01-Ch1.1.2-S017:D","text":"DNA複製","explanation":"DNA複製增加DNA，不以胺基酸鏈為產物。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：題目從mRNA資訊走向胺基酸鏈，是轉譯階段。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S018","topicId":"BIO-Ch1.1.2-T04","stem":"以一般蛋白質編碼基因為例，哪個資訊流程順序正確？","correct":"BIO-B01-Ch1.1.2-S018:B","options":[{"id":"BIO-B01-Ch1.1.2-S018:A","text":"蛋白質→DNA→mRNA","explanation":"此順序不是題設蛋白質編碼基因的表現流程。"},{"id":"BIO-B01-Ch1.1.2-S018:B","text":"DNA→mRNA→胺基酸鏈","explanation":"DNA提供資訊，mRNA作中介，胺基酸鏈為轉譯產物。"},{"id":"BIO-B01-Ch1.1.2-S018:C","text":"mRNA→蛋白質→DNA","explanation":"把DNA放在最後，顛倒此流程的資訊來源。"},{"id":"BIO-B01-Ch1.1.2-S018:D","text":"胺基酸鏈→mRNA→DNA","explanation":"把產物倒當起點，與一般表現方向相反。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：先轉錄出mRNA，再由其資訊指導轉譯，形成胺基酸鏈。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S019","topicId":"BIO-Ch1.1.2-T04","stem":"在DNA→mRNA→蛋白質的簡化流程中，mRNA主要扮演什麼角色？","correct":"BIO-B01-Ch1.1.2-S019:D","options":[{"id":"BIO-B01-Ch1.1.2-S019:A","text":"完整染色體套數","explanation":"mRNA是RNA分子，不是一套染色體。"},{"id":"BIO-B01-Ch1.1.2-S019:B","text":"胺基酸鏈的最終折疊形狀","explanation":"蛋白質形狀由胺基酸鏈折疊形成，mRNA不是該形狀。"},{"id":"BIO-B01-Ch1.1.2-S019:C","text":"親代傳給子代的器官成品","explanation":"mRNA不是器官或性狀成品。"},{"id":"BIO-B01-Ch1.1.2-S019:D","text":"連結DNA資訊與蛋白質合成的中介","explanation":"此中介角色能連結轉錄和轉譯兩步。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：mRNA先依DNA資訊形成，再提供轉譯所需的序列資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S020","topicId":"BIO-Ch1.1.2-T04","stem":"學生把「轉錄」說成「DNA分子本身變成RNA」。正確訂正為何？","correct":"BIO-B01-Ch1.1.2-S020:A","options":[{"id":"BIO-B01-Ch1.1.2-S020:A","text":"細胞以DNA為模板合成新的RNA","explanation":"正確區分模板和新合成產物。"},{"id":"BIO-B01-Ch1.1.2-S020:B","text":"DNA先變成蛋白質再變RNA","explanation":"不是此一般轉錄途徑，且混淆資訊與物質。"},{"id":"BIO-B01-Ch1.1.2-S020:C","text":"RNA只能由既有蛋白質切下","explanation":"RNA由核苷酸合成，非蛋白質片段。"},{"id":"BIO-B01-Ch1.1.2-S020:D","text":"轉錄完全不使用DNA資訊","explanation":"轉錄使用DNA資訊，不能將其排除。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：模板提供序列資訊，新RNA另行合成；DNA不需要被轉換成RNA材料。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S021","topicId":"BIO-Ch1.1.2-T05","stem":"基因資訊經表現形成某蛋白質，該蛋白質協助細胞執行反應。哪項最能描述蛋白質在此的角色？","correct":"BIO-B01-Ch1.1.2-S021:B","options":[{"id":"BIO-B01-Ch1.1.2-S021:A","text":"整套遺傳指令","explanation":"整套遺傳指令是基因體的概念。"},{"id":"BIO-B01-Ch1.1.2-S021:B","text":"細胞功能的執行分子","explanation":"蛋白質可參與細胞反應等功能。"},{"id":"BIO-B01-Ch1.1.2-S021:C","text":"親代的一套染色體","explanation":"蛋白質不是一套染色體。"},{"id":"BIO-B01-Ch1.1.2-S021:D","text":"DNA四種構件之一","explanation":"DNA構件為核苷酸，蛋白質由胺基酸構成。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：題目的蛋白質正在執行細胞活動，不是遺傳資訊片段或整套資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S022","topicId":"BIO-Ch1.1.2-T05","stem":"以crystallin為例，它在水晶體中主要協助哪項功能？","correct":"BIO-B01-Ch1.1.2-S022:D","options":[{"id":"BIO-B01-Ch1.1.2-S022:A","text":"複製全部核DNA","explanation":"此例的角色是水晶體功能，不是DNA複製。"},{"id":"BIO-B01-Ch1.1.2-S022:B","text":"產生精子與卵","explanation":"生殖配子形成不是crystallin的此項作用。"},{"id":"BIO-B01-Ch1.1.2-S022:C","text":"把mRNA改造成DNA","explanation":"反向合成DNA不是此蛋白質的功能。"},{"id":"BIO-B01-Ch1.1.2-S022:D","text":"維持透明並使光線聚焦","explanation":"符合水晶體透明蛋白質的教學例子。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：crystallin是水晶體的重要透明蛋白質，適當構造及排列有助光線通過與聚焦。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S023","topicId":"BIO-Ch1.1.2-T05","stem":"蛋白質合成後，胺基酸鏈形成特定形狀。這個過程最直接稱為什麼？","correct":"BIO-B01-Ch1.1.2-S023:A","options":[{"id":"BIO-B01-Ch1.1.2-S023:A","text":"折疊","explanation":"折疊使胺基酸鏈形成特定構形。"},{"id":"BIO-B01-Ch1.1.2-S023:B","text":"受精","explanation":"受精涉及精卵結合，不是分子構形改變。"},{"id":"BIO-B01-Ch1.1.2-S023:C","text":"轉錄","explanation":"轉錄形成RNA，不是胺基酸鏈折疊。"},{"id":"BIO-B01-Ch1.1.2-S023:D","text":"DNA複製","explanation":"複製產生DNA拷貝，對象不同。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：題目描述鏈的空間構造形成，而非新RNA或DNA的合成。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S024","topicId":"BIO-Ch1.1.2-T05","stem":"下列哪項最適合說明基因與蛋白質的差別？","correct":"BIO-B01-Ch1.1.2-S024:C","options":[{"id":"BIO-B01-Ch1.1.2-S024:A","text":"基因是蛋白質的另一個名稱","explanation":"兩者的分子類別和角色不同。"},{"id":"BIO-B01-Ch1.1.2-S024:B","text":"蛋白質只負責儲存全部DNA資訊","explanation":"蛋白質有許多功能，整套DNA資訊不是其此處定義。"},{"id":"BIO-B01-Ch1.1.2-S024:C","text":"基因提供資訊，蛋白質可執行細胞功能","explanation":"此句清楚連結資訊與功能產物。"},{"id":"BIO-B01-Ch1.1.2-S024:D","text":"蛋白質先變成DNA才執行功能","explanation":"蛋白質不需先變成DNA才能執行活動。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：對蛋白質編碼基因而言，資訊先經mRNA中介，再形成可執行功能的蛋白質。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S025","topicId":"BIO-Ch1.1.2-T05","stem":"想完整表示crystallin從基因資訊到功能的主線，哪項順序合理？","correct":"BIO-B01-Ch1.1.2-S025:A","options":[{"id":"BIO-B01-Ch1.1.2-S025:A","text":"DNA資訊→mRNA→胺基酸鏈合成與折疊→蛋白質功能","explanation":"先轉錄、再轉譯及折疊，才銜接蛋白質的作用。"},{"id":"BIO-B01-Ch1.1.2-S025:B","text":"mRNA→DNA資訊→胺基酸鏈合成與折疊→蛋白質功能","explanation":"本題蛋白質編碼基因的正常表現先由DNA轉錄出mRNA，順序相反。"},{"id":"BIO-B01-Ch1.1.2-S025:C","text":"DNA資訊→胺基酸鏈合成與折疊→mRNA→蛋白質功能","explanation":"對此蛋白質編碼基因，須先有mRNA才能依其資訊合成胺基酸鏈。"},{"id":"BIO-B01-Ch1.1.2-S025:D","text":"胺基酸鏈合成與折疊→DNA資訊→mRNA→蛋白質功能","explanation":"折疊需要已合成的胺基酸鏈，不能放在DNA資訊表現的起點。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：正確主線包含資訊中介、蛋白質形成與功能，而不是把資訊當成直接的光學成品。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S026","topicId":"BIO-Ch1.1.2-T06","stem":"某基因產生RNA，該RNA本身可在細胞中發揮功能。此過程是否屬於基因表現？","correct":"BIO-B01-Ch1.1.2-S026:A","options":[{"id":"BIO-B01-Ch1.1.2-S026:A","text":"是，功能性RNA也可為基因產物","explanation":"這個定義涵蓋RNA與蛋白質兩類產物。"},{"id":"BIO-B01-Ch1.1.2-S026:B","text":"否，產物必須是蛋白質","explanation":"把表現限於蛋白質過於狹窄。"},{"id":"BIO-B01-Ch1.1.2-S026:C","text":"否，RNA不能有功能","explanation":"有些RNA可參與機器組成或調節。"},{"id":"BIO-B01-Ch1.1.2-S026:D","text":"是，但RNA必須先變成染色體","explanation":"功能性RNA不需要變成染色體。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：基因資訊指導功能性RNA形成，已符合表現，不須再產生蛋白質才算。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S027","topicId":"BIO-Ch1.1.2-T06","stem":"下列哪一項可作為「RNA不只是蛋白質合成資訊中介」的例子？","correct":"BIO-B01-Ch1.1.2-S027:C","options":[{"id":"BIO-B01-Ch1.1.2-S027:A","text":"DNA具有雙股結構","explanation":"DNA結構沒有直接說明RNA的其他功能。"},{"id":"BIO-B01-Ch1.1.2-S027:B","text":"所有RNA都由胺基酸組成","explanation":"RNA由核苷酸組成，不是胺基酸。"},{"id":"BIO-B01-Ch1.1.2-S027:C","text":"某RNA本身參與調節基因表現","explanation":"此例直接展示RNA自身的調節作用。"},{"id":"BIO-B01-Ch1.1.2-S027:D","text":"每個RNA都必定被轉譯","explanation":"不是每種RNA都被轉譯，此句反而錯誤。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：調節是RNA分子自身的功能，與提供蛋白質序列資訊的中介角色不同。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S028","topicId":"BIO-Ch1.1.2-T06","stem":"以基因產物而言，下列敘述何者正確？","correct":"BIO-B01-Ch1.1.2-S028:D","options":[{"id":"BIO-B01-Ch1.1.2-S028:A","text":"所有基因只製造蛋白質","explanation":"忽略以RNA為功能產物的基因。"},{"id":"BIO-B01-Ch1.1.2-S028:B","text":"所有RNA都沒有細胞作用","explanation":"功能性RNA能參與多種細胞活動。"},{"id":"BIO-B01-Ch1.1.2-S028:C","text":"以RNA為產物的基因不含資訊","explanation":"以功能性RNA為產物的基因仍是帶有資訊的DNA區段，不能因產物不是蛋白質而否定基因資訊。"},{"id":"BIO-B01-Ch1.1.2-S028:D","text":"有些基因的功能產物是RNA","explanation":"正確保留基因產物的多樣性。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：基因可提供功能性RNA的資訊，不能用蛋白質編碼基因代表全部基因。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S029","topicId":"BIO-Ch1.1.2-T06","stem":"某RNA是製造蛋白質的細胞機器的一部分。最適當的判斷是？","correct":"BIO-B01-Ch1.1.2-S029:B","options":[{"id":"BIO-B01-Ch1.1.2-S029:A","text":"它一定就是所製成的蛋白質","explanation":"機器組件和機器的產物不同。"},{"id":"BIO-B01-Ch1.1.2-S029:B","text":"它可用RNA身分參與細胞工作","explanation":"RNA本身可具有結構或其他功能角色。"},{"id":"BIO-B01-Ch1.1.2-S029:C","text":"它一定是完整DNA分子","explanation":"RNA與DNA不同，不能改稱DNA分子。"},{"id":"BIO-B01-Ch1.1.2-S029:D","text":"它沒有被轉譯便完全沒功能","explanation":"此RNA已因參與機器而有功能。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：RNA可作為機器組件發揮作用，參與製造不等於自己被製成蛋白質。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S030","topicId":"BIO-Ch1.1.2-T06","stem":"下列哪句對基因表現的定義最完整？","correct":"BIO-B01-Ch1.1.2-S030:A","options":[{"id":"BIO-B01-Ch1.1.2-S030:A","text":"細胞依基因資訊形成RNA或蛋白質等產物","explanation":"定義兼顧兩種產物類別。"},{"id":"BIO-B01-Ch1.1.2-S030:B","text":"只有把DNA複製成DNA","explanation":"DNA複製屬資訊拷貝，不能取代表現定義。"},{"id":"BIO-B01-Ch1.1.2-S030:C","text":"只要基因存在就算全部表現完成","explanation":"存在資訊不代表已使用並形成產物。"},{"id":"BIO-B01-Ch1.1.2-S030:D","text":"只有親代把DNA送給子代","explanation":"此句描述世代傳遞，和表現不同。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：表現聚焦資訊被使用產生產物，可涵蓋功能性RNA與蛋白質。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S031","topicId":"BIO-Ch1.1.2-T07","stem":"「不同生命形式基本上使用相同遺傳密碼」主要指什麼？","correct":"BIO-B01-Ch1.1.2-S031:B","options":[{"id":"BIO-B01-Ch1.1.2-S031:A","text":"全部DNA排列完全相同","explanation":"共通規則不等於相同序列。"},{"id":"BIO-B01-Ch1.1.2-S031:B","text":"序列的解讀規則大致共通","explanation":"此句符合遺傳密碼的意義。"},{"id":"BIO-B01-Ch1.1.2-S031:C","text":"所有物種外形相同","explanation":"共同分子規則可與外形多樣性並存。"},{"id":"BIO-B01-Ch1.1.2-S031:D","text":"每個細胞蛋白質數量相同","explanation":"表現量可隨細胞情境改變。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：共同的是解讀規則，不是每個生物的整套內容或產物。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S032","topicId":"BIO-Ch1.1.2-T07","stem":"DNA序列與遺傳密碼的關係，最像哪一組區分？","correct":"BIO-B01-Ch1.1.2-S032:C","options":[{"id":"BIO-B01-Ch1.1.2-S032:A","text":"書的重量與書架高度","explanation":"重量與高度未呈現內容和規則的差別。"},{"id":"BIO-B01-Ch1.1.2-S032:B","text":"紙張顏色與頁面大小","explanation":"顏色和大小都不是解讀規則的類比。"},{"id":"BIO-B01-Ch1.1.2-S032:C","text":"實際寫出的文字與解讀文字的規則","explanation":"這個類比保留內容和解讀方式的區分。"},{"id":"BIO-B01-Ch1.1.2-S032:D","text":"所有書都是同一本書","explanation":"共用規則不能推出所有內容同一。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：一者是具體排列內容，一者是解讀規則；不同內容可以使用相同規則。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S033","topicId":"BIO-Ch1.1.2-T07","stem":"遺傳密碼的普遍性最能支持哪項觀點？","correct":"BIO-B01-Ch1.1.2-S033:D","options":[{"id":"BIO-B01-Ch1.1.2-S033:A","text":"所有生命彼此毫無關聯","explanation":"普遍共通性支持關聯，而非毫無關聯。"},{"id":"BIO-B01-Ch1.1.2-S033:B","text":"每種生物必有完全不同的核苷酸","explanation":"DNA通常共用四種構件，不須每種生物另造一套。"},{"id":"BIO-B01-Ch1.1.2-S033:C","text":"生物差異只可能來自不同密碼規則","explanation":"序列內容及表現差異也可帶來差異。"},{"id":"BIO-B01-Ch1.1.2-S033:D","text":"生命之間具有共同性與關聯","explanation":"這是普遍遺傳密碼的重要意義。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：許多不同生命共用基本解讀規則，可作為生命相關的分子證據之一。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S034","topicId":"BIO-Ch1.1.2-T07","stem":"兩種生物共用相同遺傳密碼，但具有不同DNA序列。這兩項敘述是否衝突？","correct":"BIO-B01-Ch1.1.2-S034:A","options":[{"id":"BIO-B01-Ch1.1.2-S034:A","text":"不衝突，規則相同仍可有不同內容","explanation":"正確區分規則與內容。"},{"id":"BIO-B01-Ch1.1.2-S034:B","text":"衝突，共用規則就必須內容相同","explanation":"將共同解讀規則錯當相同資訊。"},{"id":"BIO-B01-Ch1.1.2-S034:C","text":"衝突，DNA不能存在序列差異","explanation":"DNA序列可以不同。"},{"id":"BIO-B01-Ch1.1.2-S034:D","text":"不衝突，因DNA不攜帶資訊","explanation":"DNA攜帶資訊，因此此理由錯誤。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：如同同語言能寫不同句子，同規則仍可解讀不同序列。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S035","topicId":"BIO-Ch1.1.2-T07","stem":"哪一句對遺傳密碼普遍性的表達最精確？","correct":"BIO-B01-Ch1.1.2-S035:B","options":[{"id":"BIO-B01-Ch1.1.2-S035:A","text":"每種生物都有完全獨立的規則","explanation":"與生命形式間的規則普遍性相反。"},{"id":"BIO-B01-Ch1.1.2-S035:B","text":"不同生命形式基本上共用解讀規則","explanation":"保留共通性，也避免零例外的絕對用語。"},{"id":"BIO-B01-Ch1.1.2-S035:C","text":"每種生物的所有基因體必相同","explanation":"基因體內容與解讀規則不同。"},{"id":"BIO-B01-Ch1.1.2-S035:D","text":"只要外形相似才會共用規則","explanation":"規則共通不限定於外形相似者。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：教材採基本上共通的描述，不以相同外形為條件，也不宣稱內容一樣。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S036","topicId":"BIO-Ch1.1.2-T08","stem":"想以DNA序列比較取得物種關係線索，首先應注意哪項條件？","correct":"BIO-B01-Ch1.1.2-S036:A","options":[{"id":"BIO-B01-Ch1.1.2-S036:A","text":"先確認比較的是可對應的同源基因區域","explanation":"同源及可對應位置是合理比較的基礎。"},{"id":"BIO-B01-Ch1.1.2-S036:B","text":"任選兩段DNA，只需長度不同","explanation":"任意片段可能無可比性，不能直接判親緣。"},{"id":"BIO-B01-Ch1.1.2-S036:C","text":"只看樣本名稱是否相似","explanation":"名稱不提供分子序列的關係證據。"},{"id":"BIO-B01-Ch1.1.2-S036:D","text":"只計每段出現幾種字母","explanation":"種類數不保留逐位置序列差異。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：先確認可比的同源區域，才能讓對應位置的差異具有意義。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S037","topicId":"BIO-Ch1.1.2-T08","stem":"兩物種的同源基因序列很相似。哪個說法最合適？","correct":"BIO-B01-Ch1.1.2-S037:C","options":[{"id":"BIO-B01-Ch1.1.2-S037:A","text":"已證明兩物種完全相同","explanation":"基因相似不足以定義兩物種完全相同。"},{"id":"BIO-B01-Ch1.1.2-S037:B","text":"已證明所有蛋白質功能相同","explanation":"只比較一段不能推全部蛋白質功能。"},{"id":"BIO-B01-Ch1.1.2-S037:C","text":"可提供親緣及功能推論的線索","explanation":"採線索用語保留適當推論限制。"},{"id":"BIO-B01-Ch1.1.2-S037:D","text":"已證明不必做任何其他研究","explanation":"仍可需要其他序列或功能資料查核。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：相似度可供推論，但單一基因不保證整個生物或所有功能相同。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S038","topicId":"BIO-Ch1.1.2-T08","stem":"在已對齊、相同長度的同源DNA區域，哪個情況代表序列較相似？","correct":"BIO-B01-Ch1.1.2-S038:B","options":[{"id":"BIO-B01-Ch1.1.2-S038:A","text":"不同位置越多","explanation":"差異越多表示該區域相似程度較低。"},{"id":"BIO-B01-Ch1.1.2-S038:B","text":"不同位置越少","explanation":"一致位置較多，故該區域序列較相似。"},{"id":"BIO-B01-Ch1.1.2-S038:C","text":"只要各類核苷酸比例相同","explanation":"比例相同仍可有不同排列。"},{"id":"BIO-B01-Ch1.1.2-S038:D","text":"只要兩段都呈雙股螺旋","explanation":"共同螺旋外形不能表示序列相似程度。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：相同長度下，比對位置差異較少，表示一致位置較多。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S039","topicId":"BIO-Ch1.1.2-T08","stem":"下列哪個推論過度擴張序列比較的能力？","correct":"BIO-B01-Ch1.1.2-S039:D","options":[{"id":"BIO-B01-Ch1.1.2-S039:A","text":"同源序列比較可提供線索","explanation":"這是保留限制的合理描述。"},{"id":"BIO-B01-Ch1.1.2-S039:B","text":"比較前要確認可對應的區域","explanation":"確認比較對象是必要的品質條件。"},{"id":"BIO-B01-Ch1.1.2-S039:C","text":"相似基因可能提示功能關聯","explanation":"以可能及線索表述，未保證全部功能。"},{"id":"BIO-B01-Ch1.1.2-S039:D","text":"任意四個DNA字母相同就證明兩物種是最近親","explanation":"從任意極短片段直接判最近親，超過證據。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：任意短片段的巧合不能取代同源性、代表性及更多關係證據。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S040","topicId":"BIO-Ch1.1.2-T08","stem":"以某蛋白質基因的序列研究物種關係，與以遺傳密碼普遍性研究生命共同性，主要差別為何？","correct":"BIO-B01-Ch1.1.2-S040:A","options":[{"id":"BIO-B01-Ch1.1.2-S040:A","text":"前者比較內容，後者看解讀規則","explanation":"精確區分兩個比較對象。"},{"id":"BIO-B01-Ch1.1.2-S040:B","text":"兩者都只觀察染色體外形","explanation":"兩者不是單純外形觀察。"},{"id":"BIO-B01-Ch1.1.2-S040:C","text":"前者完全不涉及DNA","explanation":"基因序列可直接是DNA資料。"},{"id":"BIO-B01-Ch1.1.2-S040:D","text":"後者要求每種DNA都相同","explanation":"解讀規則共通不等於DNA內容相同。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：序列資料描述排列，遺傳密碼描述規則，兩者可共同提供不同層面的理解。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S041","topicId":"BIO-Ch1.1.2-T09","stem":"研究者取得某生物整套DNA資訊，包括基因和其他DNA區域。最適合稱為什麼？","correct":"BIO-B01-Ch1.1.2-S041:C","options":[{"id":"BIO-B01-Ch1.1.2-S041:A","text":"一個基因","explanation":"一個基因只是局部資訊片段。"},{"id":"BIO-B01-Ch1.1.2-S041:B","text":"一個mRNA","explanation":"mRNA是RNA分子，非全部DNA。"},{"id":"BIO-B01-Ch1.1.2-S041:C","text":"一套基因體資料","explanation":"整套DNA資訊符合基因體的定義。"},{"id":"BIO-B01-Ch1.1.2-S041:D","text":"一套蛋白體資料","explanation":"蛋白體指已表現的蛋白質集合。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：研究範圍是整套DNA，因此對應基因體，不限於單一基因或當下蛋白質。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S042","topicId":"BIO-Ch1.1.2-T09","stem":"下列哪句正確說明基因與基因體？","correct":"BIO-B01-Ch1.1.2-S042:A","options":[{"id":"BIO-B01-Ch1.1.2-S042:A","text":"基因是DNA片段，基因體是整套DNA資訊","explanation":"正確描述兩者尺度。"},{"id":"BIO-B01-Ch1.1.2-S042:B","text":"一個基因必等於全基因體","explanation":"局部不等於整體。"},{"id":"BIO-B01-Ch1.1.2-S042:C","text":"基因體只指一種蛋白質","explanation":"蛋白質不是基因體的定義對象。"},{"id":"BIO-B01-Ch1.1.2-S042:D","text":"沒有表現的DNA就不屬基因體","explanation":"基因體並非只計當下表現的DNA。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：區分局部功能片段與整套資料，是否正在表現不改變DNA屬於整套資訊的事實。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S043","topicId":"BIO-Ch1.1.2-T09","stem":"關於基因體的範圍，下列何者正確？","correct":"BIO-B01-Ch1.1.2-S043:D","options":[{"id":"BIO-B01-Ch1.1.2-S043:A","text":"只包含現在大量表現的基因","explanation":"當下表現狀態不能界定全部DNA範圍。"},{"id":"BIO-B01-Ch1.1.2-S043:B","text":"只包含蛋白質的胺基酸序列","explanation":"這是蛋白質層面，不是DNA資料。"},{"id":"BIO-B01-Ch1.1.2-S043:C","text":"只包含單一基因的RNA產物","explanation":"單一RNA產物不等於整套DNA。"},{"id":"BIO-B01-Ch1.1.2-S043:D","text":"包含基因，也包含其他DNA序列","explanation":"符合基因體包含各種DNA區域的定義。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：整套DNA資料不因某區域未編碼蛋白質或未被讀出就被排除。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S044","topicId":"BIO-Ch1.1.2-T09","stem":"教材說「人類每套核染色體約有30億DNA鹼基對」。下列哪個讀法正確？","correct":"BIO-B01-Ch1.1.2-S044:B","options":[{"id":"BIO-B01-Ch1.1.2-S044:A","text":"每個基因都有30億鹼基對","explanation":"單一基因不是整套核染色體。"},{"id":"BIO-B01-Ch1.1.2-S044:B","text":"這是每一套核染色體的約略DNA量","explanation":"保留原來的基準、單位和約略性。"},{"id":"BIO-B01-Ch1.1.2-S044:C","text":"每個蛋白質有30億胺基酸","explanation":"鹼基對屬DNA計量，不是胺基酸。"},{"id":"BIO-B01-Ch1.1.2-S044:D","text":"每個正常配子都有兩套核染色體","explanation":"正常人類配子核染色體是一套。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：數值基準是一套核染色體，單位是鹼基對，不能轉移到單個基因或蛋白質。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S045","topicId":"BIO-Ch1.1.2-T09","stem":"將基因體比喻為整套資料庫時，最合適的說明是？","correct":"BIO-B01-Ch1.1.2-S045:C","options":[{"id":"BIO-B01-Ch1.1.2-S045:A","text":"資料庫只含一個當下使用的條目","explanation":"單一當下條目不能代表完整資訊庫。"},{"id":"BIO-B01-Ch1.1.2-S045:B","text":"資料庫就是所有製好的蛋白質","explanation":"蛋白質集合是產物層面的資料。"},{"id":"BIO-B01-Ch1.1.2-S045:C","text":"其中有許多基因條目，也有其他DNA資訊","explanation":"同時保留基因與非基因DNA的範圍。"},{"id":"BIO-B01-Ch1.1.2-S045:D","text":"資料庫必須每時每刻全部被讀取","explanation":"全部資訊不一定同時表現。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：整套資料庫表示DNA資訊廣度；不需要每個區域同時被使用。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S046","topicId":"BIO-Ch1.1.2-T10","stem":"團隊比較多個物種的整套DNA序列與基因資訊。此研究最直接屬於哪個領域？","correct":"BIO-B01-Ch1.1.2-S046:C","options":[{"id":"BIO-B01-Ch1.1.2-S046:A","text":"蛋白體學","explanation":"蛋白體學的直接對象是所表現的蛋白質集合。"},{"id":"BIO-B01-Ch1.1.2-S046:B","text":"單基因功能研究","explanation":"只研究單一基因，範圍小於題目的完整DNA集合。"},{"id":"BIO-B01-Ch1.1.2-S046:C","text":"基因體學","explanation":"基因體學研究整套DNA及其基因，符合完整DNA的比較。"},{"id":"BIO-B01-Ch1.1.2-S046:D","text":"單一蛋白質結構研究","explanation":"單一蛋白質的結構不等於整個基因體的DNA資料。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：研究對象是整套DNA資料及其比較，符合基因體學的尺度。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S047","topicId":"BIO-Ch1.1.2-T10","stem":"研究某組織在指定時間表現的蛋白質集合及其性質，最直接稱為？","correct":"BIO-B01-Ch1.1.2-S047:B","options":[{"id":"BIO-B01-Ch1.1.2-S047:A","text":"DNA複製","explanation":"複製產生DNA，非此研究集合。"},{"id":"BIO-B01-Ch1.1.2-S047:B","text":"蛋白體學","explanation":"蛋白體學研究整體蛋白質及其性質。"},{"id":"BIO-B01-Ch1.1.2-S047:C","text":"基因體學","explanation":"DNA資料和當下蛋白質集合不同。"},{"id":"BIO-B01-Ch1.1.2-S047:D","text":"精卵資訊傳遞","explanation":"題目不是親代把資訊交給子代。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：集合的成員是蛋白質，故選蛋白體學；指定時間也提醒這是表現產物的狀態。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S048","topicId":"BIO-Ch1.1.2-T10","stem":"某計畫利用電腦儲存、整理並比較大量基因序列資料。最直接用到哪項能力？","correct":"BIO-B01-Ch1.1.2-S048:A","options":[{"id":"BIO-B01-Ch1.1.2-S048:A","text":"生物資訊學","explanation":"三種資料處理功能符合生物資訊學。"},{"id":"BIO-B01-Ch1.1.2-S048:B","text":"受精作用","explanation":"生殖過程不能代替資料處理。"},{"id":"BIO-B01-Ch1.1.2-S048:C","text":"胺基酸鏈折疊","explanation":"蛋白質折疊不等於電腦分析序列。"},{"id":"BIO-B01-Ch1.1.2-S048:D","text":"DNA模板被消耗成RNA","explanation":"轉錄並非DNA被消耗，且不描述資料分析工具。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：題目重點是運算工具處理生物資料，涵蓋儲存、整理和分析。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S049","topicId":"BIO-Ch1.1.2-T10","stem":"某技術能在短時間分析大量生物樣本。這項特色最符合什麼概念？","correct":"BIO-B01-Ch1.1.2-S049:D","options":[{"id":"BIO-B01-Ch1.1.2-S049:A","text":"單一基因作用的深入解析","explanation":"這描述研究的深度與對象，並未指明同時處理大量資料。"},{"id":"BIO-B01-Ch1.1.2-S049:B","text":"單次測量完全沒有誤差","explanation":"快速分析大量樣本不保證每次測量都沒有誤差。"},{"id":"BIO-B01-Ch1.1.2-S049:C","text":"所有基因功能均已確認","explanation":"處理量大不代表已確認全部基因的功能。"},{"id":"BIO-B01-Ch1.1.2-S049:D","text":"高通量技術的大量快速分析","explanation":"高通量強調短時間處理或分析大量樣本及資料。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：高通量的重點是快速處理大量樣本或資料，不代表自動保證所有結論。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-S050","topicId":"BIO-Ch1.1.2-T10","stem":"基因體與蛋白體的主要差別為何？","correct":"BIO-B01-Ch1.1.2-S050:A","options":[{"id":"BIO-B01-Ch1.1.2-S050:A","text":"前者是整套DNA資訊，後者是表現的蛋白質集合","explanation":"正確區分資料對象及範圍。"},{"id":"BIO-B01-Ch1.1.2-S050:B","text":"前者只是一個RNA，後者只是一個基因","explanation":"兩者都不是單一RNA或單一基因。"},{"id":"BIO-B01-Ch1.1.2-S050:C","text":"兩者都只能表示一條核苷酸","explanation":"都是整套概念，不能縮成單個構件。"},{"id":"BIO-B01-Ch1.1.2-S050:D","text":"兩者必定逐一相同且不受表現影響","explanation":"表現結果可隨細胞情境變化。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：基因體屬DNA資訊層面，蛋白體屬功能產物集合層面。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1.1.2-B001","topicId":"BIO-Ch1.1.2-T01","stem":"某模型以一條未複製染色體為對象，畫出一個雙股DNA分子並圈出8段基因。下列計數何者正確？","correct":"BIO-B01-Ch1.1.2-B001:B","options":[{"id":"BIO-B01-Ch1.1.2-B001:A","text":"8個DNA分子、1個基因","explanation":"圈出功能片段不會把DNA分子分割成8個。"},{"id":"BIO-B01-Ch1.1.2-B001:B","text":"1個DNA分子、8個基因","explanation":"一個DNA可含8段乃至更多基因，符合題面。"},{"id":"BIO-B01-Ch1.1.2-B001:C","text":"2個DNA分子、8條染色體","explanation":"兩股不算兩分子，8段也不算8條染色體。"},{"id":"BIO-B01-Ch1.1.2-B001:D","text":"8條染色體、2個基因","explanation":"把片段數及股數都當成其他層級，計數錯置。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：圈出的8段共用同一個長DNA分子；雙股只表示該分子的兩條鏈。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B002","topicId":"BIO-Ch1.1.2-T01","stem":"一個示意圖有甲、乙、丙三個標籤：甲是含DNA的細胞結構；乙是其中的長雙股資訊分子；丙是乙上可指導產物形成的一段。甲、乙、丙依序為何？","correct":"BIO-B01-Ch1.1.2-B002:D","options":[{"id":"BIO-B01-Ch1.1.2-B002:A","text":"DNA、基因、染色體","explanation":"DNA是分子，不是此題甲所指的較大結構。"},{"id":"BIO-B01-Ch1.1.2-B002:B","text":"基因、DNA、基因體","explanation":"基因不是甲的結構層級；基因體也不是丙的局部片段。"},{"id":"BIO-B01-Ch1.1.2-B002:C","text":"染色體、基因、DNA","explanation":"乙是整個DNA分子，丙才是基因，兩者互換了。"},{"id":"BIO-B01-Ch1.1.2-B002:D","text":"染色體、DNA、基因","explanation":"三個標籤逐一符合題面的層級與包含關係。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：依「結構→分子→功能片段」逐層對應，可唯一得到染色體、DNA、基因。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B003","topicId":"BIO-Ch1.1.2-T01","stem":"研究者只測得一個基因的DNA序列，便宣稱已取得該細胞全部遺傳資訊。此推論最大的問題是？","correct":"BIO-B01-Ch1.1.2-B003:A","options":[{"id":"BIO-B01-Ch1.1.2-B003:A","text":"局部基因序列不等於整套DNA資訊","explanation":"指出局部和整體的差別，直接限制此推論。"},{"id":"BIO-B01-Ch1.1.2-B003:B","text":"DNA序列不能攜帶任何資訊","explanation":"DNA序列正是遺傳資訊的載體。"},{"id":"BIO-B01-Ch1.1.2-B003:C","text":"基因只由蛋白質組成","explanation":"基因在此是DNA片段，並非蛋白質本身。"},{"id":"BIO-B01-Ch1.1.2-B003:D","text":"整套DNA只能有一個基因","explanation":"整套DNA通常有許多基因，並不限一個。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：一個基因只占DNA的一段；其他基因及非基因序列仍未被測定，資料範圍不足以代表全套。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B004","topicId":"BIO-Ch1.1.2-T01","stem":"甲同學說「DNA雙股代表兩條染色體」；乙同學說「同一個DNA分子可有多個基因」。以未複製染色體為例，何者正確？","correct":"BIO-B01-Ch1.1.2-B004:C","options":[{"id":"BIO-B01-Ch1.1.2-B004:A","text":"只有甲","explanation":"甲把兩條核苷酸鏈誤算成兩條染色體。"},{"id":"BIO-B01-Ch1.1.2-B004:B","text":"甲乙都正確","explanation":"甲錯誤，因此不能說兩者都正確。"},{"id":"BIO-B01-Ch1.1.2-B004:C","text":"只有乙","explanation":"乙正確；雙股DNA中的多個基因仍屬同一分子。"},{"id":"BIO-B01-Ch1.1.2-B004:D","text":"甲乙都錯誤","explanation":"乙的多基因描述正確，不能一併否定。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：甲混淆鏈與染色體；乙正確描述一個DNA分子可以容納多段功能資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B005","topicId":"BIO-Ch1.1.2-T01","stem":"某細胞的核內有6條尚未複製的染色體，每條含一個雙股DNA分子。只計這6條染色體，共有幾個DNA分子？","correct":"BIO-B01-Ch1.1.2-B005:B","options":[{"id":"BIO-B01-Ch1.1.2-B005:A","text":"3個","explanation":"沒有將兩條染色體合算一分子的依據。"},{"id":"BIO-B01-Ch1.1.2-B005:B","text":"6個","explanation":"6條各含1個，乘積為6。"},{"id":"BIO-B01-Ch1.1.2-B005:C","text":"12個","explanation":"12是這些DNA的核苷酸鏈數，不是分子數。"},{"id":"BIO-B01-Ch1.1.2-B005:D","text":"24個","explanation":"24多乘了一次2，題目未提供此倍增過程。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：每條1個，故6×1＝6個DNA分子；若改問核苷酸鏈才是12條。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B006","topicId":"BIO-Ch1.1.2-T01","stem":"某未複製染色體的DNA有甲、乙兩個基因。僅憑這項資料，可以確定哪一件事？","correct":"BIO-B01-Ch1.1.2-B006:D","options":[{"id":"BIO-B01-Ch1.1.2-B006:A","text":"甲乙一定製造相同蛋白質","explanation":"同處一個DNA不代表產物相同。"},{"id":"BIO-B01-Ch1.1.2-B006:B","text":"甲乙各自等於完整基因體","explanation":"基因體是整套DNA資訊，單一基因不是整套。"},{"id":"BIO-B01-Ch1.1.2-B006:C","text":"甲乙分別位於兩個DNA分子","explanation":"兩個基因都在同一未複製染色體的DNA上。"},{"id":"BIO-B01-Ch1.1.2-B006:D","text":"甲乙是同一DNA上的不同功能片段","explanation":"這是由題面直接得到、未超出資訊的描述。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：題目只提供位置及功能片段身分，沒有提供產物相同的證據。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B007","topicId":"BIO-Ch1.1.2-T01","stem":"製作教材模型時，想同時呈現「染色體含DNA」與「DNA有許多基因」。哪種標法最合理？","correct":"BIO-B01-Ch1.1.2-B007:A","options":[{"id":"BIO-B01-Ch1.1.2-B007:A","text":"在染色體中畫長DNA，再在DNA上框出數段","explanation":"三層表示法與來源的包含關係一致。"},{"id":"BIO-B01-Ch1.1.2-B007:B","text":"把DNA畫成含有數條完整染色體的大箱子","explanation":"將DNA放在染色體外層，顛倒兩者層級。"},{"id":"BIO-B01-Ch1.1.2-B007:C","text":"把每個核苷酸都標成完整基因體","explanation":"單個核苷酸遠小於整套遺傳資訊。"},{"id":"BIO-B01-Ch1.1.2-B007:D","text":"把染色體只標為一種基因產物","explanation":"染色體是資訊載體結構，不能只當成基因產物。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：放大關係應保持由結構到分子再到片段，框線可代表DNA上不同基因區域。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B008","topicId":"BIO-Ch1.1.2-T01","stem":"有人將一條未複製染色體上的5個基因稱為「5種DNA基本單位」。這句話應如何修正？","correct":"BIO-B01-Ch1.1.2-B008:C","options":[{"id":"BIO-B01-Ch1.1.2-B008:A","text":"基本單位應稱染色體","explanation":"染色體是更高層結構，不是DNA的基本單位。"},{"id":"BIO-B01-Ch1.1.2-B008:B","text":"每個基因都只有一個核苷酸","explanation":"基因需要一段序列，不能一般化為單一核苷酸。"},{"id":"BIO-B01-Ch1.1.2-B008:C","text":"DNA基本單位是核苷酸，基因是核苷酸排列成的功能片段","explanation":"此句保留DNA組成與基因功能兩種層級。"},{"id":"BIO-B01-Ch1.1.2-B008:D","text":"5個基因必須等於5套基因體","explanation":"五段局部資訊不能當成五套完整資訊。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：基本構件和功能片段不同：核苷酸連成DNA鏈，特定連續區域包含基因資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B009","topicId":"BIO-Ch1.1.2-T01","stem":"研究某DNA區域時，證實它能提供製造功能性RNA的資訊。若要判定它是否可稱基因，下列理由何者適當？","correct":"BIO-B01-Ch1.1.2-B009:B","options":[{"id":"BIO-B01-Ch1.1.2-B009:A","text":"不能，基因產物只能是蛋白質","explanation":"排除RNA產物使定義過窄。"},{"id":"BIO-B01-Ch1.1.2-B009:B","text":"可以，基因資訊可指導功能性RNA形成","explanation":"功能性RNA也是基因表現產物，因此可以。"},{"id":"BIO-B01-Ch1.1.2-B009:C","text":"不能，RNA必須直接由染色體蛋白質變成","explanation":"RNA是依DNA資訊合成，不是染色體蛋白質變形。"},{"id":"BIO-B01-Ch1.1.2-B009:D","text":"可以，但該區域必須等於整條染色體","explanation":"基因是一段區域，無須占整條染色體。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：基因定義重點在可指導細胞產物形成；功能性RNA亦是合格產物，無須成為蛋白質。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第4、9張（正文第2、7頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B010","topicId":"BIO-Ch1.1.2-T01","stem":"觀察一個雙股DNA分子，發現不同區域可提供不同細胞產物的資訊。下列何者最能解釋這項結果？","correct":"BIO-B01-Ch1.1.2-B010:D","options":[{"id":"BIO-B01-Ch1.1.2-B010:A","text":"每區域都是不同物種的整套基因體","explanation":"區域差異不足以代表不同物種或整套基因體。"},{"id":"BIO-B01-Ch1.1.2-B010:B","text":"DNA每次只容許一種功能資訊","explanation":"一個DNA可以包含多段不同功能資訊。"},{"id":"BIO-B01-Ch1.1.2-B010:C","text":"每區域都必須是獨立染色體","explanation":"基因區域不必各自成為獨立染色體。"},{"id":"BIO-B01-Ch1.1.2-B010:D","text":"同一DNA分子可具有多個不同基因","explanation":"多基因共存於一分子可以直接解釋觀察。"}],"concept":"染色體是承載遺傳資訊的細胞結構，含DNA與相關蛋白質。DNA是由核苷酸組成的資訊分子；基因則是DNA上含有製造細胞產物資訊的一段。未複製染色體含一個長的雙股DNA分子，一個DNA分子上可有許多基因。雙股是兩條核苷酸鏈，不能因此算成兩個DNA分子，也不能把一個基因等同整條染色體。\n本題判斷：長DNA可容納多個基因，各段資訊可指導不同產物，不須把DNA切成多條染色體。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 6、7、8 頁（PDF 55、56、57 頁）｜本節筆記 正式第4、6、12、14張（正文第2、4、10、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B011","topicId":"BIO-Ch1.1.2-T02","stem":"甲紀錄「精卵結合後，受精卵含雙親核DNA」；乙紀錄「水晶體細胞依基因資訊製造蛋白質」。甲乙依序屬於何種主題？","correct":"BIO-B01-Ch1.1.2-B011:C","options":[{"id":"BIO-B01-Ch1.1.2-B011:A","text":"表現、傳遞","explanation":"兩個主題正好顛倒。"},{"id":"BIO-B01-Ch1.1.2-B011:B","text":"儲存、複製","explanation":"甲重點是跨世代取得，乙不是DNA複製。"},{"id":"BIO-B01-Ch1.1.2-B011:C","text":"傳遞、表現","explanation":"甲為資訊傳遞，乙為資訊使用。"},{"id":"BIO-B01-Ch1.1.2-B011:D","text":"轉譯、受精","explanation":"甲沒有合成胺基酸鏈，乙也沒有精卵融合。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：甲追蹤資訊跨世代，乙追蹤資訊轉為產物，因此先傳遞後表現。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B012","topicId":"BIO-Ch1.1.2-T02","stem":"以簡化模型描述一次正常體細胞分裂：分裂前共有10個DNA分子，先完成一輪複製，再平均分給兩子細胞。每子細胞得幾個DNA分子？","correct":"BIO-B01-Ch1.1.2-B012:B","options":[{"id":"BIO-B01-Ch1.1.2-B012:A","text":"5個","explanation":"5只做了分配，漏掉先複製的一輪。"},{"id":"BIO-B01-Ch1.1.2-B012:B","text":"10個","explanation":"完成複製後平均分配，每個得到10個。"},{"id":"BIO-B01-Ch1.1.2-B012:C","text":"20個","explanation":"20是分配前兩份總量。"},{"id":"BIO-B01-Ch1.1.2-B012:D","text":"40個","explanation":"40多算了未給定的額外複製。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：10×2＝20個，再20÷2＝10個；先複製再分配可維持每子細胞的資訊量。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B013","topicId":"BIO-Ch1.1.2-T02","stem":"一個正常受精卵開始連續進行一般體細胞分裂；若DNA每輪均正確複製與分配，為何後來的細胞仍可取得雙親遺傳資訊？","correct":"BIO-B01-Ch1.1.2-B013:D","options":[{"id":"BIO-B01-Ch1.1.2-B013:A","text":"每次都需要新的精子再受精","explanation":"體細胞增生不需每輪再加入配子。"},{"id":"BIO-B01-Ch1.1.2-B013:B","text":"每次都從環境吸收雙親DNA","explanation":"一般胚胎發育不靠環境提供雙親DNA。"},{"id":"BIO-B01-Ch1.1.2-B013:C","text":"只有最初受精卵保留DNA","explanation":"題設已說正確分配，子細胞也會得到DNA。"},{"id":"BIO-B01-Ch1.1.2-B013:D","text":"原受精卵的DNA資訊以拷貝傳給子細胞","explanation":"複製與分配連結初始受精卵和後續細胞。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：雙親DNA先進入受精卵，此後藉複製及分配延續至新細胞，不需重複受精。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B014","topicId":"BIO-Ch1.1.2-T02","stem":"某學生推論：「一般體細胞分裂前DNA會複製，所以所有生殖過程都產生與原體細胞完全相同的配子。」問題在哪裡？","correct":"BIO-B01-Ch1.1.2-B014:C","options":[{"id":"BIO-B01-Ch1.1.2-B014:A","text":"DNA從不會複製","explanation":"DNA複製是正常資訊傳遞的一環，不能否認。"},{"id":"BIO-B01-Ch1.1.2-B014:B","text":"配子不是細胞","explanation":"精子與卵都是細胞。"},{"id":"BIO-B01-Ch1.1.2-B014:C","text":"把一般體細胞分裂的敘述套用到所有生殖過程","explanation":"適用條件被擴張，結論並非由前提保證。"},{"id":"BIO-B01-Ch1.1.2-B014:D","text":"親代不會傳遞任何DNA","explanation":"親代會經配子傳遞DNA，錯不在是否傳遞。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：前提限於一般體細胞生長分裂，不能據此推出所有配子的資訊組合都不變。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B015","topicId":"BIO-Ch1.1.2-T02","stem":"某個體細胞保有某基因的DNA，但目前沒有偵測到相應RNA或蛋白質。僅依這些觀察，何者最合理？","correct":"BIO-B01-Ch1.1.2-B015:A","options":[{"id":"BIO-B01-Ch1.1.2-B015:A","text":"DNA仍可儲存資訊，不能只因有基因就認定正在表現","explanation":"此句區分儲存與當下產物，並保留偵測限制。"},{"id":"BIO-B01-Ch1.1.2-B015:B","text":"該基因必定已從DNA消失","explanation":"題目已確認DNA存在，不能說消失。"},{"id":"BIO-B01-Ch1.1.2-B015:C","text":"資訊儲存必須同時有大量蛋白質產生","explanation":"儲存資訊不要求每時每刻大量生產蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B015:D","text":"該細胞不可能在分裂時傳遞此DNA","explanation":"DNA可在複製分配時傳遞，不以當下產物為必要條件。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：基因存在是儲存層面的證據；目前產物未檢出不能等同DNA不存在，也不足以宣稱正積極表現。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B016","topicId":"BIO-Ch1.1.2-T02","stem":"題設某DNA含量模型：母細胞原有4單位，分裂前變成8單位，兩子細胞各4單位。哪個說明吻合？","correct":"BIO-B01-Ch1.1.2-B016:C","options":[{"id":"BIO-B01-Ch1.1.2-B016:A","text":"母細胞把DNA變成蛋白質後分配","explanation":"DNA含量加倍不是DNA轉成蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B016:B","text":"子細胞憑空生成資訊","explanation":"題目提供母細胞複製來源，並非憑空產生。"},{"id":"BIO-B01-Ch1.1.2-B016:C","text":"複製使總量增加，分配讓各子細胞取得拷貝","explanation":"兩階段的數量及因果都符合模型。"},{"id":"BIO-B01-Ch1.1.2-B016:D","text":"DNA資訊在第一次分裂後必然全失","explanation":"各4單位代表仍有DNA，不能推全失。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：4→8符合複製加倍，8→4＋4符合分配；總量變化與資訊延續可同時成立。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B017","topicId":"BIO-Ch1.1.2-T02","stem":"若只看人類正常受精時的核染色體套數，父方精子與母方卵各提供一套，兩者合成的受精卵有幾套？","correct":"BIO-B01-Ch1.1.2-B017:B","options":[{"id":"BIO-B01-Ch1.1.2-B017:A","text":"一套，只來自父方","explanation":"忽略母方卵提供的一套。"},{"id":"BIO-B01-Ch1.1.2-B017:B","text":"兩套，分別來自雙親","explanation":"相加得到兩套，來源分別是精卵。"},{"id":"BIO-B01-Ch1.1.2-B017:C","text":"四套，分別來自雙親體細胞","explanation":"配子各一套，不能拿體細胞兩套來相加。"},{"id":"BIO-B01-Ch1.1.2-B017:D","text":"零套，受精會消耗DNA","explanation":"受精讓資訊結合，並非全部消耗。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：一套＋一套＝兩套；題目特別限定核染色體及正常受精，無須擴張到胞器遺傳。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B018","topicId":"BIO-Ch1.1.2-T02","stem":"某教具把親代的DNA卡放入配子，合成受精卵後，經複製把資訊卡分給新細胞。哪項補充最能避免學生誤解？","correct":"BIO-B01-Ch1.1.2-B018:D","options":[{"id":"BIO-B01-Ch1.1.2-B018:A","text":"每張資訊卡就是完整器官","explanation":"資訊載體不等於器官成品。"},{"id":"BIO-B01-Ch1.1.2-B018:B","text":"配子必須來自父母兩個體細胞的直接融合","explanation":"正常受精是精卵融合，不是體細胞直接融合。"},{"id":"BIO-B01-Ch1.1.2-B018:C","text":"DNA卡不用被細胞讀取就能成為所有性狀","explanation":"僅擁有資訊不代表已完成所有產物與發育。"},{"id":"BIO-B01-Ch1.1.2-B018:D","text":"資訊仍須經細胞使用與發育才形成性狀","explanation":"補上資訊使用過程，避免成品遺傳的錯誤想像。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：卡片只是資訊傳遞比喻，還需說明表現與發育，不能把卡片當成性狀成品。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B019","topicId":"BIO-Ch1.1.2-T02","stem":"細胞甲正在複製DNA，細胞乙正在依mRNA合成胺基酸鏈。兩者最主要的任務分別是？","correct":"BIO-B01-Ch1.1.2-B019:A","options":[{"id":"BIO-B01-Ch1.1.2-B019:A","text":"準備DNA拷貝、使用資訊合成產物","explanation":"甲的產物是DNA拷貝，乙的產物是胺基酸鏈。"},{"id":"BIO-B01-Ch1.1.2-B019:B","text":"使用資訊合成產物、準備DNA拷貝","explanation":"把DNA複製與轉譯的任務顛倒。"},{"id":"BIO-B01-Ch1.1.2-B019:C","text":"製造配子、吸收親代蛋白質","explanation":"題目未說甲產配子；乙也不是吸收現成蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B019:D","text":"形成性狀成品、刪除遺傳資訊","explanation":"DNA複製不等於完成全部性狀，轉譯不等於刪除資訊。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：甲增加可供分配的DNA，乙執行轉譯；兩個過程都與資訊有關，但產物不同。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第5、14、15張（正文第3、12、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B020","topicId":"BIO-Ch1.1.2-T02","stem":"同一受精卵形成的兩類細胞，題設其核DNA序列相同，卻製造不同種類或數量的蛋白質。最適合的解釋是？","correct":"BIO-B01-Ch1.1.2-B020:C","options":[{"id":"BIO-B01-Ch1.1.2-B020:A","text":"它們必須來自不同親代","explanation":"來源是同一受精卵，不能任意改判親代。"},{"id":"BIO-B01-Ch1.1.2-B020:B","text":"相同DNA禁止出現細胞功能差異","explanation":"基因表現差異可造成不同細胞功能。"},{"id":"BIO-B01-Ch1.1.2-B020:C","text":"保有相同資訊不代表以相同方式表現所有基因","explanation":"區分資訊保存與使用，能解釋題設。"},{"id":"BIO-B01-Ch1.1.2-B020:D","text":"只有其中一類含有基因","explanation":"題設兩類都有相同DNA，不能排除其中一類的基因。"}],"concept":"遺傳傳遞是DNA資訊從親代到子代，或從母細胞交給子細胞。人類正常受精時，精子與卵各提供一套核染色體資訊。一般體細胞生長分裂前先複製DNA，再分配給子細胞，讓細胞數增加時仍保有遺傳指令。子代繼承資訊後，須經基因表現與發育形成性狀；不能把性狀理解成父母已完成的構造直接搬入配子。\n本題判斷：DNA是資訊庫；不同細胞對資訊的使用可不同，因此蛋白質產物不必完全相同。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8、9 頁（PDF 56、57、58 頁）｜本節筆記 正式第7、12、13、14張（正文第5、10、11、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B021","topicId":"BIO-Ch1.1.2-T03","stem":"以相同方向讀取兩段DNA的一股：甲為ATCG，乙為AGCT。下列何者正確？","correct":"BIO-B01-Ch1.1.2-B021:C","options":[{"id":"BIO-B01-Ch1.1.2-B021:A","text":"種類相同，因此序列相同","explanation":"相同構件統計不足以保證先後順序相同。"},{"id":"BIO-B01-Ch1.1.2-B021:B","text":"乙必定不是DNA","explanation":"乙仍由DNA的四種符號構成。"},{"id":"BIO-B01-Ch1.1.2-B021:C","text":"種類與各自數量相同，但排列不同","explanation":"核對位置即可辨別相同組成與不同序列。"},{"id":"BIO-B01-Ch1.1.2-B021:D","text":"甲必定能表現，乙必定不能","explanation":"是否表現需更多基因及細胞條件，短序列不保證。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：兩段都有A、T、C、G各一個，但第2與第4位置不同，因此內容不是同一排列。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B022","topicId":"BIO-Ch1.1.2-T03","stem":"以相同方向讀取兩個DNA片段的一股，各為100個核苷酸，且四種核苷酸的數量各自相同。尚需哪項資料才能確認這兩段所記錄的序列相同？","correct":"BIO-B01-Ch1.1.2-B022:B","options":[{"id":"BIO-B01-Ch1.1.2-B022:A","text":"兩段核苷酸總個數","explanation":"題目已給長度相同，總數不能補上順序。"},{"id":"BIO-B01-Ch1.1.2-B022:B","text":"逐位置的排列順序","explanation":"逐位置比較才能排除同組成的不同排列。"},{"id":"BIO-B01-Ch1.1.2-B022:C","text":"兩段DNA的共同螺旋外形","explanation":"相同雙螺旋外形可具有不同序列。"},{"id":"BIO-B01-Ch1.1.2-B022:D","text":"兩段各種核苷酸的總數","explanation":"各類數量已知相同，但仍缺排列資訊。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：已知長度與組成，只缺各位置的順序；相同統計可以對應多種排列。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B023","topicId":"BIO-Ch1.1.2-T03","stem":"同方向讀取DNA片段：甲AATCGG，乙AAC TGG（空格僅便於閱讀）。不考慮空格，兩段差異最合適的描述是？","correct":"BIO-B01-Ch1.1.2-B023:D","options":[{"id":"BIO-B01-Ch1.1.2-B023:A","text":"甲比乙多一個核苷酸","explanation":"空格不是核苷酸，兩段長度都是6。"},{"id":"BIO-B01-Ch1.1.2-B023:B","text":"甲乙一定屬不同物種","explanation":"短片段差異不能單獨保證物種不同。"},{"id":"BIO-B01-Ch1.1.2-B023:C","text":"兩段序列完全相同","explanation":"第3和第4位置實際不同。"},{"id":"BIO-B01-Ch1.1.2-B023:D","text":"長度相同，但第3、4位置不同","explanation":"逐位比較得到兩個不同位置，且長度相同。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：乙實為AACTGG；與AATCGG相比，第3位T/C及第4位C/T不同，兩者均6個位置。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B024","topicId":"BIO-Ch1.1.2-T03","stem":"某模型把DNA的A、T、C、G各換成固定一種顏色，但保留每個位置及其對應。若另附完整顏色圖例，這種做法能保留哪項資訊？","correct":"BIO-B01-Ch1.1.2-B024:A","options":[{"id":"BIO-B01-Ch1.1.2-B024:A","text":"原片段的排列順序","explanation":"固定映射和順序使原序列可被還原。"},{"id":"BIO-B01-Ch1.1.2-B024:B","text":"該生物所有性狀成品","explanation":"序列表示不是性狀成品的完整觀察。"},{"id":"BIO-B01-Ch1.1.2-B024:C","text":"所有基因的表現量","explanation":"沒有RNA或蛋白量資料，不能取得表現量。"},{"id":"BIO-B01-Ch1.1.2-B024:D","text":"每種蛋白質的實際形狀","explanation":"形狀須涉及合成與折疊，不能由此示意直接讀出。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：一對一符號替換加圖例可還原每個位置的構件，因此保留序列；它未測表現量或蛋白質形狀。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B025","topicId":"BIO-Ch1.1.2-T03","stem":"甲聲稱「兩段DNA同樣長，所以資訊一定相同」；乙聲稱「同樣長仍可能有不同序列」。何者較正確？","correct":"BIO-B01-Ch1.1.2-B025:B","options":[{"id":"BIO-B01-Ch1.1.2-B025:A","text":"只有甲","explanation":"甲把長度誤當完整內容。"},{"id":"BIO-B01-Ch1.1.2-B025:B","text":"只有乙","explanation":"乙符合序列承載資訊的原理。"},{"id":"BIO-B01-Ch1.1.2-B025:C","text":"兩者都正確","explanation":"甲的必然推論不成立，不能同時接受。"},{"id":"BIO-B01-Ch1.1.2-B025:D","text":"兩者都錯誤","explanation":"乙成立，故不能都否定。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：長度只告訴有幾個位置，不告訴每個位置放哪種核苷酸；乙保留排列差異的可能。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B026","topicId":"BIO-Ch1.1.2-T03","stem":"DNA片段的一個核苷酸位置由A改成G。只依這項資料，哪個結論最穩當？","correct":"BIO-B01-Ch1.1.2-B026:D","options":[{"id":"BIO-B01-Ch1.1.2-B026:A","text":"該生物所有蛋白質一定消失","explanation":"單一位置變更不能推所有蛋白質消失。"},{"id":"BIO-B01-Ch1.1.2-B026:B","text":"DNA必定不再是雙股","explanation":"序列替換不等同失去雙股構造。"},{"id":"BIO-B01-Ch1.1.2-B026:C","text":"整套遺傳密碼規則必定更換","explanation":"排列內容改變與解讀規則改變不同。"},{"id":"BIO-B01-Ch1.1.2-B026:D","text":"該位置的序列內容已改變","explanation":"A變G直接表示該序列位置改變。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：可直接確定的是一個位置的符號改變；功能後果與表現狀態尚需其他資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B027","topicId":"BIO-Ch1.1.2-T03","stem":"學生用四種珠子串DNA模型，做出兩串等長且各色珠數相同的鏈。若想證明兩串模型序列相同，下一步應做什麼？","correct":"BIO-B01-Ch1.1.2-B027:C","options":[{"id":"BIO-B01-Ch1.1.2-B027:A","text":"只比較全部珠子的總數","explanation":"總數相同不等於排列順序相同。"},{"id":"BIO-B01-Ch1.1.2-B027:B","text":"只比較每種顏色的珠數","explanation":"各色珠數已給定相同，仍不能決定順序。"},{"id":"BIO-B01-Ch1.1.2-B027:C","text":"按相同方向逐位置比對顏色","explanation":"逐位比對能判定是否同一排列。"},{"id":"BIO-B01-Ch1.1.2-B027:D","text":"只確認兩串都由四種珠子製成","explanation":"構件種類相同仍可排出不同序列。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：同方向、對應位置的比對才會檢查序列本身；數量相同不夠。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B028","topicId":"BIO-Ch1.1.2-T03","stem":"某段DNA同方向序列為ATAT，另一段為TATA。四種構件的統計只出現A、T各兩個。下列判讀何者正確？","correct":"BIO-B01-Ch1.1.2-B028:A","options":[{"id":"BIO-B01-Ch1.1.2-B028:A","text":"兩段組成相同但序列不同","explanation":"A、T數量相同，先後順序卻不同。"},{"id":"BIO-B01-Ch1.1.2-B028:B","text":"兩段各有四種不同核苷酸","explanation":"只有兩種類型，四是總位置數。"},{"id":"BIO-B01-Ch1.1.2-B028:C","text":"兩段因只有A、T所以不能是DNA片段","explanation":"局部片段可以只出現部分種類。"},{"id":"BIO-B01-Ch1.1.2-B028:D","text":"每個位置的資訊完全相同","explanation":"同方向逐位比較，四個位置的符號都不同。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：DNA局部片段不必四種核苷酸都出現；兩段皆由合法構件組成，但每位置排列不同。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B029","topicId":"BIO-Ch1.1.2-T03","stem":"若只保留一段DNA每種核苷酸的總數，卻刪掉原來的排列順序，主要失去什麼？","correct":"BIO-B01-Ch1.1.2-B029:D","options":[{"id":"BIO-B01-Ch1.1.2-B029:A","text":"每種核苷酸是否存在","explanation":"每種類的總數仍保留，可知是否存在。"},{"id":"BIO-B01-Ch1.1.2-B029:B","text":"片段核苷酸總個數","explanation":"將各類總數相加仍可求出總個數。"},{"id":"BIO-B01-Ch1.1.2-B029:C","text":"每種核苷酸所占比例","explanation":"各類數量除以總數仍可得比例。"},{"id":"BIO-B01-Ch1.1.2-B029:D","text":"能區分不同排列的序列資訊","explanation":"刪除順序會失去逐位置資訊。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：總數把許多不同排列合併成同一份統計，無法再還原每位置的內容。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B030","topicId":"BIO-Ch1.1.2-T03","stem":"一個雙股DNA分子兩條鏈的顏色在教材圖中分別用藍、紫表示。僅憑顏色可否認定它們是兩種不同遺傳密碼？","correct":"BIO-B01-Ch1.1.2-B030:B","options":[{"id":"BIO-B01-Ch1.1.2-B030:A","text":"可以，兩個顏色就是兩套規則","explanation":"顏色並非遺傳密碼規則的資料。"},{"id":"BIO-B01-Ch1.1.2-B030:B","text":"不可以，顏色只是區別兩條鏈的圖示方式","explanation":"此結論正確限制由示意顏色可推論的內容。"},{"id":"BIO-B01-Ch1.1.2-B030:C","text":"可以，DNA每股都使用獨立字母表","explanation":"兩條鏈均用DNA基本構件，不能因配色推出獨立規則。"},{"id":"BIO-B01-Ch1.1.2-B030:D","text":"不可以，因DNA完全沒有資訊","explanation":"否定資訊存在是錯誤理由；DNA序列可承載資訊。"}],"concept":"DNA由兩條核苷酸鏈構成雙股螺旋，A、T、C、G代表四種基本構件。資訊取決於這些構件的排列順序，不只取決於種類、總數或雙螺旋外形。就像相同字母可排出不同文字，含有相同數量各種核苷酸的DNA片段仍可有不同序列。序列有差異表示排列內容不同，但僅憑任意短片段不能保證功能、性狀或物種一定不同。\n本題判斷：圖示配色區別構造，不代表解讀規則；要討論資訊必須看核苷酸序列及其解讀。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、10、11張（正文第4、8、9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B031","topicId":"BIO-Ch1.1.2-T04","stem":"模型記錄甲步驟的模板為DNA、產物為mRNA；乙步驟的資訊依據為mRNA、產物為胺基酸鏈。甲乙依序為？","correct":"BIO-B01-Ch1.1.2-B031:D","options":[{"id":"BIO-B01-Ch1.1.2-B031:A","text":"轉譯、折疊","explanation":"甲不產胺基酸鏈，乙也不是單純折疊。"},{"id":"BIO-B01-Ch1.1.2-B031:B","text":"複製、轉錄","explanation":"甲產RNA而非DNA，乙產胺基酸鏈而非RNA。"},{"id":"BIO-B01-Ch1.1.2-B031:C","text":"折疊、轉譯","explanation":"甲產新的RNA，不是改變蛋白構形。"},{"id":"BIO-B01-Ch1.1.2-B031:D","text":"轉錄、轉譯","explanation":"兩步的模板、資訊依據和產物都吻合。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：看直接產物即可區分：RNA對應轉錄，胺基酸鏈對應轉譯。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B032","topicId":"BIO-Ch1.1.2-T04","stem":"研究某蛋白質編碼基因，已確認DNA存在且相應mRNA正常，但依該mRNA形成新胺基酸鏈的步驟受阻。最直接受阻的是？","correct":"BIO-B01-Ch1.1.2-B032:B","options":[{"id":"BIO-B01-Ch1.1.2-B032:A","text":"DNA資訊儲存","explanation":"DNA已存在，並非題設的直接受阻點。"},{"id":"BIO-B01-Ch1.1.2-B032:B","text":"轉譯","explanation":"mRNA到胺基酸鏈是轉譯。"},{"id":"BIO-B01-Ch1.1.2-B032:C","text":"受精","explanation":"受精與此細胞內合成阻斷不同。"},{"id":"BIO-B01-Ch1.1.2-B032:D","text":"染色體分配","explanation":"未描述DNA分配問題，不能選此階段。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板
