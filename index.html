h1-B089:A","text":"修正後絕不能再問問題","explanation":"錯誤：新的問題可繼續探究。"},{"id":"BIO-B01-Ch1-B089:B","text":"資料只用來裝飾報告","explanation":"錯誤：資料用來評估假說。"},{"id":"BIO-B01-Ch1-B089:C","text":"假說一定比所有資料更重要","explanation":"錯誤：假說需面對證據。"},{"id":"BIO-B01-Ch1-B089:D","text":"資料可讓探究回到修正後的解釋與下一輪問題","explanation":"正確：這是可反覆進行的探究關係。"}],"concept":"","example":"流程幫助理解關係，不是不可返回的單程宣告。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B090","topicId":"","stem":"一個假說有清楚預測，但研究者還沒取得相關資料。此時適合宣稱什麼？","correct":"BIO-B01-Ch1-B090:A","options":[{"id":"BIO-B01-Ch1-B090:A","text":"已有待檢驗的預期，尚不能宣稱資料已支持","explanation":"正確：預測與已取得支持的證據不同。"},{"id":"BIO-B01-Ch1-B090:B","text":"已有預測就等於檢驗完成","explanation":"錯誤：還需觀察或實驗資料。"},{"id":"BIO-B01-Ch1-B090:C","text":"尚無資料即表示假說永久錯誤","explanation":"錯誤：未檢驗不是永久否定。"},{"id":"BIO-B01-Ch1-B090:D","text":"只要改稱真理就無需檢驗","explanation":"錯誤：改名字不補上證據。"}],"concept":"","example":"先形成預期，再如實記錄結果。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B091","topicId":"","stem":"在相同背景比較兩種可遺傳毛色，研究者先問「哪些遺傳資訊與色差相關」，再問「色差如何影響被發現」。哪項整理正確？","correct":"BIO-B01-Ch1-B091:B","options":[{"id":"BIO-B01-Ch1-B091:A","text":"兩問都是完全相同的問題","explanation":"錯誤：一問性狀資訊，一問情境效果。"},{"id":"BIO-B01-Ch1-B091:B","text":"前者著重資訊，後者著重與環境的交互作用","explanation":"正確：兩者是互補層面的研究。"},{"id":"BIO-B01-Ch1-B091:C","text":"後者會使前者自動沒有意義","explanation":"錯誤：環境問題不取消遺傳問題。"},{"id":"BIO-B01-Ch1-B091:D","text":"前者已保證所有鼠都會存活","explanation":"錯誤：相關資訊不保證存活。"}],"concept":"","example":"把性狀的來源與效果分開，有助保留因果條件。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B092","topicId":"","stem":"一個毛色基因變異與淡毛相關，但某地深色背景讓淡毛較顯眼。哪個推論合理？","correct":"BIO-B01-Ch1-B092:C","options":[{"id":"BIO-B01-Ch1-B092:A","text":"基因只要影響性狀就必定有利","explanation":"錯誤：有遺傳基礎不等於到處有利。"},{"id":"BIO-B01-Ch1-B092:B","text":"不利效果證明毛色沒有遺傳基礎","explanation":"錯誤：有利性與遺傳基礎是兩件事。"},{"id":"BIO-B01-Ch1-B092:C","text":"遺傳資訊影響性狀，不代表該性狀在每個背景都有利","explanation":"正確：資訊作用與情境優勢需分開判斷。"},{"id":"BIO-B01-Ch1-B092:D","text":"環境能直接取消所有 DNA","explanation":"錯誤：沒有此因果結論。"}],"concept":"","example":"淡毛在白沙和深土的效果可不同。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B093","topicId":"","stem":"學生畫「遺傳資訊→性狀」，接著添上「因此不需要能量與物質」。這最後一步的問題是什麼？","correct":"BIO-B01-Ch1-B093:D","options":[{"id":"BIO-B01-Ch1-B093:A","text":"把性狀寫成中文","explanation":"錯誤：中文不影響科學意義。"},{"id":"BIO-B01-Ch1-B093:B","text":"沒有畫足四支箭頭","explanation":"錯誤：箭頭數不是判斷依據。"},{"id":"BIO-B01-Ch1-B093:C","text":"缺少研究者姓名","explanation":"錯誤：姓名無法補正推論。"},{"id":"BIO-B01-Ch1-B093:D","text":"把資訊的作用誤當成可以取代生命資源","explanation":"正確：生命既需資訊，也需能量與物質。"}],"concept":"","example":"基因相關資訊不等同食物提供的能量與材料。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B094","topicId":"","stem":"同種小鼠具有多種毛色，以下哪句最能兼顧遺傳資訊與族群變異？","correct":"BIO-B01-Ch1-B094:A","options":[{"id":"BIO-B01-Ch1-B094:A","text":"毛色相關的可遺傳資訊可能不同，不能預設全部個體完全相同","explanation":"正確：同種族群可存在與毛色相關的可遺傳變異。"},{"id":"BIO-B01-Ch1-B094:B","text":"同種就必須每段 DNA 都完全一致","explanation":"錯誤：同種不代表所有遺傳資訊完全一致。"},{"id":"BIO-B01-Ch1-B094:C","text":"毛色不同代表每隻鼠都沒有 DNA","explanation":"錯誤：差異不否定DNA的存在。"},{"id":"BIO-B01-Ch1-B094:D","text":"有資訊就不可能有任何變異","explanation":"錯誤：遺傳資訊可有變異。"}],"concept":"","example":"差異是章首天擇例子的一項起點。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B095","topicId":"","stem":"一份說明以毛色為例介紹資訊主題，哪個結尾最恰當？","correct":"BIO-B01-Ch1-B095:B","options":[{"id":"BIO-B01-Ch1-B095:A","text":"所有生命現象都只需一個毛色基因解釋","explanation":"錯誤：單一毛色基因不能涵蓋所有生命現象。"},{"id":"BIO-B01-Ch1-B095:B","text":"資訊是理解性狀的一個角度，也可與其他主題合用","explanation":"正確：資訊與組織、能量、互動及演化可連結。"},{"id":"BIO-B01-Ch1-B095:C","text":"只要研究 DNA 就應刪掉環境條件","explanation":"錯誤：DNA研究不排除環境。"},{"id":"BIO-B01-Ch1-B095:D","text":"毛色基因可以取代整隻小鼠的組織結構","explanation":"錯誤：資訊載體不能代替整體結構。"}],"concept":"","example":"同一毛色例子能連到不同主題。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B096","topicId":"","stem":"一份筆記把小鼠的細胞組織、毛色資訊及取食放在一起。如何整理最合理？","correct":"BIO-B01-Ch1-B096:C","options":[{"id":"BIO-B01-Ch1-B096:A","text":"只保留一項，否則不是生物學","explanation":"錯誤：不同面向可以共同研究。"},{"id":"BIO-B01-Ch1-B096:B","text":"把三項都稱為能量永久循環","explanation":"錯誤：不是每項都屬能量且能量不永久循環。"},{"id":"BIO-B01-Ch1-B096:C","text":"分別用組織層級、資訊、能量與物質等主題建立連結","explanation":"正確：主題可協助整理同一生命系統的不同面向。"},{"id":"BIO-B01-Ch1-B096:D","text":"把所有部分都改稱個體主動演化","explanation":"錯誤：個體主動演化是錯誤描述。"}],"concept":"","example":"五主題可使同一個例子的不同關係更清楚。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B097","topicId":"","stem":"學習者已能背五個主題名稱，卻無法用它們解釋任何例子。接下來哪種練習最符合章介紹的用途？","correct":"BIO-B01-Ch1-B097:D","options":[{"id":"BIO-B01-Ch1-B097:A","text":"只背主題的字數","explanation":"錯誤：字數不幫助理解生命。"},{"id":"BIO-B01-Ch1-B097:B","text":"刪去所有生命現象例子","explanation":"錯誤：例子有助連結概念。"},{"id":"BIO-B01-Ch1-B097:C","text":"保證每一主題只能對應一種物種","explanation":"錯誤：主題不限單一物種。"},{"id":"BIO-B01-Ch1-B097:D","text":"將同一生命現象的不同面向對應到相關主題","explanation":"正確：主題架構應能用來整理與理解現象。"}],"concept":"","example":"小鼠可同時提供多個主題的例子。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B098","topicId":"","stem":"甲說同一小鼠可用多個主題分析；乙說只要談遺傳資訊，就不能再談取食。如何判斷？","correct":"BIO-B01-Ch1-B098:A","options":[{"id":"BIO-B01-Ch1-B098:A","text":"甲合理，乙把互補主題誤當成互斥","explanation":"正確：資訊與能量物質可同時影響生命。"},{"id":"BIO-B01-Ch1-B098:B","text":"乙合理，資訊與資源需求不能同時存在","explanation":"錯誤：兩種需求並不互斥。"},{"id":"BIO-B01-Ch1-B098:C","text":"兩者都合理，因為生物只能有一種特徵","explanation":"錯誤：生物有多種可分析面向。"},{"id":"BIO-B01-Ch1-B098:D","text":"兩者都錯，主題不能用來理解生物","explanation":"錯誤：統一主題正是理解架構。"}],"concept":"","example":"遺傳毛色與吃植物可在同一個體上同時發生。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B099","topicId":"","stem":"研究提綱列出「結構在哪個尺度」「毛色有哪些遺傳因素」「能量從哪裡來」。這三問有何共同用途？","correct":"BIO-B01-Ch1-B099:B","options":[{"id":"BIO-B01-Ch1-B099:A","text":"證明所有問題只能用同一答案","explanation":"錯誤：不同問題需要相應解釋。"},{"id":"BIO-B01-Ch1-B099:B","text":"用不同主題拆解並連結同一生命現象","explanation":"正確：尺度、資訊與能量是互補的整理角度。"},{"id":"BIO-B01-Ch1-B099:C","text":"保證不用任何後續資料","explanation":"錯誤：主題不能替代資料。"},{"id":"BIO-B01-Ch1-B099:D","text":"把生命研究縮成只有名詞背誦","explanation":"錯誤：還需理解關係與證據。"}],"concept":"","example":"同一小鼠的生命活動可由多種問題切入。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true},{"id":"BIO-B01-Ch1-B100","topicId":"","stem":"在章首頁的小鼠例子中，有人只描述毛色外觀而忽略DNA、食物與背景。若要更完整使用五主題，最合理的補充方向為何？","correct":"BIO-B01-Ch1-B100:C","options":[{"id":"BIO-B01-Ch1-B100:A","text":"宣稱外觀足以永久證明所有假說","explanation":"錯誤：外觀描述不能永久證明所有假說。"},{"id":"BIO-B01-Ch1-B100:B","text":"把背景當作沒有作用的裝飾","explanation":"錯誤：背景影響隱蔽效果。"},{"id":"BIO-B01-Ch1-B100:C","text":"連結遺傳資訊、資源取得、環境互動與不同觀察尺度","explanation":"正確：這些是章首例子已提供的互補面向。"},{"id":"BIO-B01-Ch1-B100:D","text":"把所有尚未知處都歸為鼠自己的意願","explanation":"錯誤：個體意願不是萬用生物解釋。"}],"concept":"","example":"五主題提供可繼續追問的生命研究架構。","source":"Campbell Biology 12e｜Chapter 1 章介紹；所列後續頁僅核實本節已教主張｜印刷 2 頁（PDF 51 頁）｜本節筆記 正式第2、3、4張；正文1、2、3/10","shuffle":true}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"bio-chapter-01-concept-1-1-intro","title":"Ch1.1 概念介紹：概念1.1 生命的研究揭示出生物學中彼此統整的核心主題","version":"B01-v1:ee9edeef7c7236a0d7df","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["Campbell Biology 12e｜第一輪","Ch1 演化、生物學主題與科學探究","Ch1.1 生命的統整主題"],"comparison":{"status":"BASELINE","reason":"中國醫為主要題庫及唯一比對基準。"},"banks":[{"depth":"掃過","target":50,"questions":[{"id":"BIO-B01-Ch1.1-S001","topicId":"","stem":"面對一個陌生對象，依本節觀點應如何判斷它是否有生命？","correct":"BIO-B01-Ch1.1-S001:A","options":[{"id":"BIO-B01-Ch1.1-S001:A","text":"綜合觀察一組生命活動","explanation":"生命通常由多項性質與活動辨認，不能只靠單項外觀。"},{"id":"BIO-B01-Ch1.1-S001:B","text":"只要看它是否會位移","explanation":"汽車也會位移，因此位移不能單獨證明有生命。"},{"id":"BIO-B01-Ch1.1-S001:C","text":"只要看它是否很大","explanation":"大小並不是本節用來區分生命的單一標準。"},{"id":"BIO-B01-Ch1.1-S001:D","text":"只要看它是否顏色鮮豔","explanation":"顏色鮮豔不代表具備生命活動。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S002","topicId":"","stem":"生物學（biology）最適當的中文說明是哪一項？","correct":"BIO-B01-Ch1.1-S002:B","options":[{"id":"BIO-B01-Ch1.1-S002:A","text":"只研究物品的外觀顏色","explanation":"生命的結構、活動等也屬研究範圍，並非只看顏色。"},{"id":"BIO-B01-Ch1.1-S002:B","text":"以科學方式研究生命","explanation":"biology的研究對象是生命與生命現象。"},{"id":"BIO-B01-Ch1.1-S002:C","text":"研究所有會移動的物品","explanation":"移動物品包括非生命，不能代表生物學的核心範圍。"},{"id":"BIO-B01-Ch1.1-S002:D","text":"只替動物取名字","explanation":"生物學不只研究動物，也不只處理命名。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S003","topicId":"","stem":"汽車能在道路上行駛，這個例子最能提醒我們什麼？","correct":"BIO-B01-Ch1.1-S003:C","options":[{"id":"BIO-B01-Ch1.1-S003:A","text":"所有生命都不會移動","explanation":"題幹沒有否定動物等生命的移動能力。"},{"id":"BIO-B01-Ch1.1-S003:B","text":"生命只存在於會行駛的物體","explanation":"行駛不是生命的必要定義。"},{"id":"BIO-B01-Ch1.1-S003:C","text":"會移動不能單獨證明有生命","explanation":"汽車是可移動的非生命例子，否定只靠移動的判準。"},{"id":"BIO-B01-Ch1.1-S003:D","text":"所有能移動的對象都有生命","explanation":"汽車恰好是此說法的反例。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S004","topicId":"","stem":"一株盆栽長在原地，仍能生長並對環境有反應。應如何理解？","correct":"BIO-B01-Ch1.1-S004:D","options":[{"id":"BIO-B01-Ch1.1-S004:A","text":"沒有走動就一定不是生命","explanation":"忽略了植物具有其他生命活動。"},{"id":"BIO-B01-Ch1.1-S004:B","text":"植物完全不會產生任何運動","explanation":"本節只提醒整體主動位移的差異，不等於完全無運動。"},{"id":"BIO-B01-Ch1.1-S004:C","text":"生長證明所有固定物體都活著","explanation":"不能從一株植物推論所有固定物體都有生命。"},{"id":"BIO-B01-Ch1.1-S004:D","text":"不作整體主動位移也可能有生命","explanation":"植物仍有生命活動，不能因留在原地就排除。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S005","topicId":"","stem":"Campbell以多項生命特徵作為導入，最主要的原因為何？","correct":"BIO-B01-Ch1.1-S005:A","options":[{"id":"BIO-B01-Ch1.1-S005:A","text":"生命不容易被單一句話完整定義","explanation":"由活動與性質辨認生命比僵硬單一標準更合適。"},{"id":"BIO-B01-Ch1.1-S005:B","text":"生命沒有任何可觀察的特徵","explanation":"本節正列出秩序、繁殖等可辨認特徵。"},{"id":"BIO-B01-Ch1.1-S005:C","text":"只要背一個動作就能涵蓋所有生命","explanation":"單一動作不是完整判準。"},{"id":"BIO-B01-Ch1.1-S005:D","text":"生命特徵只適用於第一章","explanation":"這些概念會在後續生物學內容反覆使用。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S006","topicId":"","stem":"觀察到生物體內構造有組織地排列，最直接呈現哪項生命特徵？","correct":"BIO-B01-Ch1.1-S006:B","options":[{"id":"BIO-B01-Ch1.1-S006:A","text":"演化適應","explanation":"沒有描述族群跨世代的可遺傳變化。"},{"id":"BIO-B01-Ch1.1-S006:B","text":"有秩序","explanation":"組織化的構造正是秩序的意義。"},{"id":"BIO-B01-Ch1.1-S006:C","text":"繁殖","explanation":"沒有描述產生後代。"},{"id":"BIO-B01-Ch1.1-S006:D","text":"回應環境","explanation":"沒有描述受到刺激後的反應。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S007","topicId":"","stem":"生命的「有秩序」最接近下列哪個意思？","correct":"BIO-B01-Ch1.1-S007:C","options":[{"id":"BIO-B01-Ch1.1-S007:A","text":"生物必須一直保持靜止","explanation":"靜止不是秩序的定義。"},{"id":"BIO-B01-Ch1.1-S007:B","text":"所有生物都要呈現相同顏色","explanation":"結構組織性和統一顏色不同。"},{"id":"BIO-B01-Ch1.1-S007:C","text":"生物構造具有組織性","explanation":"秩序著重結構的組織，而非隨機堆積。"},{"id":"BIO-B01-Ch1.1-S007:D","text":"每個個體都必須完全相同","explanation":"秩序不要求個體間沒有差異。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S008","topicId":"","stem":"若筆記要為「order」配上一句繁體中文解釋，何者最恰當？","correct":"BIO-B01-Ch1.1-S008:D","options":[{"id":"BIO-B01-Ch1.1-S008:A","text":"生命能從無到有創造能量","explanation":"既不是秩序的意義，也把能量轉換誤寫為創造。"},{"id":"BIO-B01-Ch1.1-S008:B","text":"生命每一刻都產生後代","explanation":"這不是秩序，也不是繁殖的必要時間條件。"},{"id":"BIO-B01-Ch1.1-S008:C","text":"生命會因願望立刻演化","explanation":"個體願望不構成族群演化。"},{"id":"BIO-B01-Ch1.1-S008:D","text":"生命的結構並非雜亂的隨機混合","explanation":"此句點出有組織的構造。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S009","topicId":"","stem":"同學把細胞內各部分有組織的配置歸入「有秩序」，此配對是否適當？","correct":"BIO-B01-Ch1.1-S009:A","options":[{"id":"BIO-B01-Ch1.1-S009:A","text":"適當，因為重點是結構的組織性","explanation":"有組織的配置符合秩序。"},{"id":"BIO-B01-Ch1.1-S009:B","text":"不適當，秩序只指個體產生後代","explanation":"產生後代是繁殖，不是秩序。"},{"id":"BIO-B01-Ch1.1-S009:C","text":"不適當，秩序只指取得食物能量","explanation":"取得並轉換能量是能量處理。"},{"id":"BIO-B01-Ch1.1-S009:D","text":"不適當，秩序必須有個體主動位移","explanation":"位移不是秩序成立的條件。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S010","topicId":"","stem":"「生命具有有組織的構造」和哪一個五大主題最容易連結？","correct":"BIO-B01-Ch1.1-S010:B","options":[{"id":"BIO-B01-Ch1.1-S010:A","text":"能量與物質","explanation":"此主題主要關注能量與物質的轉移、轉換。"},{"id":"BIO-B01-Ch1.1-S010:B","text":"組織","explanation":"結構的組織性與生命層級屬組織主題。"},{"id":"BIO-B01-Ch1.1-S010:C","text":"資訊","explanation":"資訊主題主要關注遺傳資訊的作用。"},{"id":"BIO-B01-Ch1.1-S010:D","text":"演化","explanation":"演化關注跨世代改變與生命統一性、多樣性。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S011","topicId":"","stem":"生命系統產生同類後代，最直接稱為什麼？","correct":"BIO-B01-Ch1.1-S011:C","options":[{"id":"BIO-B01-Ch1.1-S011:A","text":"調節","explanation":"調節著重內部條件的維持。"},{"id":"BIO-B01-Ch1.1-S011:B","text":"有秩序","explanation":"秩序著重構造的組織性。"},{"id":"BIO-B01-Ch1.1-S011:C","text":"繁殖","explanation":"繁殖的關鍵是出現同類後代。"},{"id":"BIO-B01-Ch1.1-S011:D","text":"生長","explanation":"生長著重個體變大，不能與產生後代混同。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S012","topicId":"","stem":"某個體因不孕而無法產生後代，是否因此就不是生命？","correct":"BIO-B01-Ch1.1-S012:D","options":[{"id":"BIO-B01-Ch1.1-S012:A","text":"是，繁殖失敗就表示從來沒有生命","explanation":"把生命系統的特徵誤當每個個體的絕對條件。"},{"id":"BIO-B01-Ch1.1-S012:B","text":"是，只有已生育的個體才有生命","explanation":"是否已生育不能單獨界定生命。"},{"id":"BIO-B01-Ch1.1-S012:C","text":"不是，因為所有非生命都能繁殖","explanation":"非生命並沒有普遍的生物繁殖能力，理由錯誤。"},{"id":"BIO-B01-Ch1.1-S012:D","text":"不是，生命判斷不要求每個個體都能繁殖","explanation":"不孕不抹去其餘生命活動。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S013","topicId":"","stem":"下列哪句敘述最明確涉及繁殖，而非同一個體的生長？","correct":"BIO-B01-Ch1.1-S013:A","options":[{"id":"BIO-B01-Ch1.1-S013:A","text":"成體產生了下一代","explanation":"出現下一代是繁殖的直接線索。"},{"id":"BIO-B01-Ch1.1-S013:B","text":"同一隻幼鳥的體型逐漸變大","explanation":"描述的是個體生長。"},{"id":"BIO-B01-Ch1.1-S013:C","text":"同一株幼苗逐漸形成葉片","explanation":"描述的是生長與發育。"},{"id":"BIO-B01-Ch1.1-S013:D","text":"動物內部條件維持可運作範圍","explanation":"描述的是調節。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S014","topicId":"","stem":"本節用工蜂仍是生命的例子，主要避免哪個誤解？","correct":"BIO-B01-Ch1.1-S014:B","options":[{"id":"BIO-B01-Ch1.1-S014:A","text":"認為生命需要處理能量","explanation":"能量處理是生命性質，並非此例要推翻的觀念。"},{"id":"BIO-B01-Ch1.1-S014:B","text":"把個體能否繁殖當成生命唯一判準","explanation":"生命系統的繁殖性質不等於每個個體都必須繁殖。"},{"id":"BIO-B01-Ch1.1-S014:C","text":"認為生物完全不能產生後代","explanation":"本節沒有否定生物繁殖。"},{"id":"BIO-B01-Ch1.1-S014:D","text":"認為生長和繁殖不同","explanation":"生長和繁殖本來就不同，此理解不需被否定。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S015","topicId":"","stem":"辨識繁殖題幹時，最有指向性的關鍵詞是哪個？","correct":"BIO-B01-Ch1.1-S015:C","options":[{"id":"BIO-B01-Ch1.1-S015:A","text":"受到碰觸後閉合","explanation":"較直接指向回應環境。"},{"id":"BIO-B01-Ch1.1-S015:B","text":"同一個體變大","explanation":"較直接指向生長。"},{"id":"BIO-B01-Ch1.1-S015:C","text":"產生後代","explanation":"直接指向繁殖。"},{"id":"BIO-B01-Ch1.1-S015:D","text":"維持體溫","explanation":"較直接指向調節。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S016","topicId":"","stem":"幼苗逐漸形成根、莖、葉，最直接代表哪項生命特徵？","correct":"BIO-B01-Ch1.1-S016:D","options":[{"id":"BIO-B01-Ch1.1-S016:A","text":"繁殖","explanation":"題幹沒有形成下一代。"},{"id":"BIO-B01-Ch1.1-S016:B","text":"演化適應","explanation":"未比較族群多個世代的遺傳特徵。"},{"id":"BIO-B01-Ch1.1-S016:C","text":"回應環境","explanation":"題幹重點並非一次外在刺激引起反應。"},{"id":"BIO-B01-Ch1.1-S016:D","text":"生長與發育","explanation":"個體逐步形成不同構造，包含生長與發育。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S017","topicId":"","stem":"對「發育」的說明，何者最恰當？","correct":"BIO-B01-Ch1.1-S017:A","options":[{"id":"BIO-B01-Ch1.1-S017:A","text":"包含分化與形成特定構造","explanation":"發育不僅是增加尺寸，還包括有方向的構造形成。"},{"id":"BIO-B01-Ch1.1-S017:B","text":"只代表物體體積膨脹","explanation":"把生物發育縮成單純尺寸變化，忽略分化。"},{"id":"BIO-B01-Ch1.1-S017:C","text":"等同產生下一代","explanation":"下一代的產生是繁殖。"},{"id":"BIO-B01-Ch1.1-S017:D","text":"等同族群經世代改變","explanation":"族群跨世代改變屬演化討論。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S018","topicId":"","stem":"Campbell以幼苗為例指出，什麼影響生長發育的模式？","correct":"BIO-B01-Ch1.1-S018:B","options":[{"id":"BIO-B01-Ch1.1-S018:A","text":"物質完全隨機堆積而沒有組織","explanation":"此說法不符合生物發育的組織性。"},{"id":"BIO-B01-Ch1.1-S018:B","text":"基因攜帶的遺傳資訊","explanation":"來源指出遺傳資訊控制生長與發育的模式。"},{"id":"BIO-B01-Ch1.1-S018:C","text":"幼苗想要變成哪種植物的願望","explanation":"發育不能以主觀願望解釋。"},{"id":"BIO-B01-Ch1.1-S018:D","text":"個體當下替全族群作出的決定","explanation":"個體發育不是全族群的主動決策。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S019","topicId":"","stem":"一隻幼獸長成成獸，題幹沒有描述其生育。最適合的分類是什麼？","correct":"BIO-B01-Ch1.1-S019:C","options":[{"id":"BIO-B01-Ch1.1-S019:A","text":"族群演化適應","explanation":"沒有跨世代族群資料。"},{"id":"BIO-B01-Ch1.1-S019:B","text":"食物中能量被創造","explanation":"既不是題幹焦點，也不是正確能量觀。"},{"id":"BIO-B01-Ch1.1-S019:C","text":"生長與發育","explanation":"同一個體長大成熟屬生長發育。"},{"id":"BIO-B01-Ch1.1-S019:D","text":"繁殖","explanation":"沒有描述產生後代，不能只因成熟就選繁殖。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S020","topicId":"","stem":"哪一句最能區分生長發育與繁殖？","correct":"BIO-B01-Ch1.1-S020:D","options":[{"id":"BIO-B01-Ch1.1-S020:A","text":"前者只發生在非生命，後者只發生在生命","explanation":"生物本身會生長發育。"},{"id":"BIO-B01-Ch1.1-S020:B","text":"前者和後者都是體型增加的同義詞","explanation":"繁殖不是體型增加的同義詞。"},{"id":"BIO-B01-Ch1.1-S020:C","text":"前者必須經過許多族群世代，後者沒有後代","explanation":"兩部分都顛倒了對象與尺度。"},{"id":"BIO-B01-Ch1.1-S020:D","text":"前者描述個體形成與成熟，後者描述產生後代","explanation":"兩者比較的重點分別是個體改變與下一代形成。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S021","topicId":"","stem":"動物利用食物中的能量維持活動，最直接呈現哪項性質？","correct":"BIO-B01-Ch1.1-S021:A","options":[{"id":"BIO-B01-Ch1.1-S021:A","text":"能量處理","explanation":"取得與轉換能量支持活動符合此性質。"},{"id":"BIO-B01-Ch1.1-S021:B","text":"有秩序","explanation":"秩序關注結構組織，非題幹最直接重點。"},{"id":"BIO-B01-Ch1.1-S021:C","text":"繁殖","explanation":"題幹沒有產生後代。"},{"id":"BIO-B01-Ch1.1-S021:D","text":"演化適應","explanation":"題幹沒有族群跨世代的可遺傳變化。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S022","topicId":"","stem":"「能量處理」中的處理，最適合解釋成什麼？","correct":"BIO-B01-Ch1.1-S022:B","options":[{"id":"BIO-B01-Ch1.1-S022:A","text":"把所有能量永遠封存在體內","explanation":"生命活動持續利用能量，並非永遠封存。"},{"id":"BIO-B01-Ch1.1-S022:B","text":"取得並轉換能量","explanation":"生命利用能量來源並轉換形式維持活動。"},{"id":"BIO-B01-Ch1.1-S022:C","text":"憑空製造能量","explanation":"轉換不是從無到有創造。"},{"id":"BIO-B01-Ch1.1-S022:D","text":"完全不需要任何能量來源","explanation":"與生命需取得能量的敘述相反。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S023","topicId":"","stem":"蝴蝶利用花蜜支持飛行，花蜜對此過程的重要性是什麼？","correct":"BIO-B01-Ch1.1-S023:C","options":[{"id":"BIO-B01-Ch1.1-S023:A","text":"使飛行變成不耗能的活動","explanation":"飛行需要能量支持。"},{"id":"BIO-B01-Ch1.1-S023:B","text":"直接代表產生同類後代","explanation":"取食支持飛行不等於繁殖。"},{"id":"BIO-B01-Ch1.1-S023:C","text":"提供可利用的化學能來源","explanation":"食物中儲存的化學能可經轉換支持活動。"},{"id":"BIO-B01-Ch1.1-S023:D","text":"使蝴蝶不再需要轉換能量","explanation":"取得食物後仍需能量轉換。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S024","topicId":"","stem":"哪一句符合生命的能量觀？","correct":"BIO-B01-Ch1.1-S024:D","options":[{"id":"BIO-B01-Ch1.1-S024:A","text":"生物可因需要而新增宇宙中的能量","explanation":"需求不能使能量憑空出現。"},{"id":"BIO-B01-Ch1.1-S024:B","text":"只有非生命會涉及能量","explanation":"生物活動同樣需要能量。"},{"id":"BIO-B01-Ch1.1-S024:C","text":"只要能量改變形式就一定有生命","explanation":"非生命系統也可有能量轉換，不能單項判定。"},{"id":"BIO-B01-Ch1.1-S024:D","text":"生命活動需要能量，並涉及形式轉換","explanation":"與取得並轉換能量的定義一致。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S025","topicId":"","stem":"在生命特徵配對中，「食物作為活動燃料」應優先放在哪一格？","correct":"BIO-B01-Ch1.1-S025:A","options":[{"id":"BIO-B01-Ch1.1-S025:A","text":"能量處理","explanation":"燃料與活動的連結直接指向取得並使用能量。"},{"id":"BIO-B01-Ch1.1-S025:B","text":"繁殖","explanation":"沒有後代形成的線索。"},{"id":"BIO-B01-Ch1.1-S025:C","text":"演化適應","explanation":"沒有世代累積的線索。"},{"id":"BIO-B01-Ch1.1-S025:D","text":"回應環境中的意識","explanation":"能量使用不等於主觀意識。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S026","topicId":"","stem":"生物把內部條件控制在適合運作的範圍，稱為什麼？","correct":"BIO-B01-Ch1.1-S026:B","options":[{"id":"BIO-B01-Ch1.1-S026:A","text":"單純變大","explanation":"單純變大屬生長線索，不是內部控制。"},{"id":"BIO-B01-Ch1.1-S026:B","text":"調節","explanation":"調節的功能是維持內部可運作範圍。"},{"id":"BIO-B01-Ch1.1-S026:C","text":"繁殖","explanation":"繁殖描述產生後代。"},{"id":"BIO-B01-Ch1.1-S026:D","text":"演化適應","explanation":"演化適應涉及族群跨世代的遺傳特徵。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S027","topicId":"","stem":"下列何者正確描述生物調節？","correct":"BIO-B01-Ch1.1-S027:C","options":[{"id":"BIO-B01-Ch1.1-S027:A","text":"內部條件完全隨外界任意變動","explanation":"任意失控不符合調節。"},{"id":"BIO-B01-Ch1.1-S027:B","text":"只有產生後代時才有調節","explanation":"調節也可持續支援個體平時的生命活動。"},{"id":"BIO-B01-Ch1.1-S027:C","text":"容許一定變動並將其維持在可運作範圍","explanation":"調節並非每時每刻毫無變化。"},{"id":"BIO-B01-Ch1.1-S027:D","text":"內部所有數值必須永遠完全相同","explanation":"零變化不是調節的必要條件。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S028","topicId":"","stem":"野兔調整耳部血流以幫助散熱，題幹最直接強調哪項性質？","correct":"BIO-B01-Ch1.1-S028:D","options":[{"id":"BIO-B01-Ch1.1-S028:A","text":"繁殖","explanation":"沒有產生後代。"},{"id":"BIO-B01-Ch1.1-S028:B","text":"有秩序","explanation":"雖有器官構造，題幹焦點是體溫維持。"},{"id":"BIO-B01-Ch1.1-S028:C","text":"演化適應","explanation":"當下血流控制不等於族群經世代的演化。"},{"id":"BIO-B01-Ch1.1-S028:D","text":"調節","explanation":"調整熱交換以維持體溫範圍，是內部條件的調節。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S029","topicId":"","stem":"讀到「讓體內條件維持可運作」，最應聯想到哪個詞？","correct":"BIO-B01-Ch1.1-S029:A","options":[{"id":"BIO-B01-Ch1.1-S029:A","text":"regulation（調節）","explanation":"此詞對應內部條件控制。"},{"id":"BIO-B01-Ch1.1-S029:B","text":"reproduction（繁殖）","explanation":"此詞對應產生後代。"},{"id":"BIO-B01-Ch1.1-S029:C","text":"order（秩序）","explanation":"此詞對應有組織的結構。"},{"id":"BIO-B01-Ch1.1-S029:D","text":"evolutionary adaptation（演化適應）","explanation":"此詞對應跨世代的適應性遺傳特徵累積。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S030","topicId":"","stem":"某動物今日因環境變熱而調整散熱。若只討論這個當下過程，哪個尺度最合適？","correct":"BIO-B01-Ch1.1-S030:B","options":[{"id":"BIO-B01-Ch1.1-S030:A","text":"幼體形成成熟構造","explanation":"題幹沒有描述發育過程。"},{"id":"BIO-B01-Ch1.1-S030:B","text":"個體當下的生理調節","explanation":"題幹是同一個體即時維持內部條件。"},{"id":"BIO-B01-Ch1.1-S030:C","text":"族群數十代後的演化適應","explanation":"題幹沒有多代族群改變。"},{"id":"BIO-B01-Ch1.1-S030:D","text":"同類後代的產生","explanation":"散熱不是繁殖的描述。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S031","topicId":"","stem":"捕蠅草受到碰觸後閉合葉片，最直接是哪項生命性質？","correct":"BIO-B01-Ch1.1-S031:C","options":[{"id":"BIO-B01-Ch1.1-S031:A","text":"繁殖","explanation":"閉合葉片沒有產生後代。"},{"id":"BIO-B01-Ch1.1-S031:B","text":"生長與發育","explanation":"快速閉合不是個體長大或成熟。"},{"id":"BIO-B01-Ch1.1-S031:C","text":"回應環境","explanation":"外在刺激引起反應，符合回應環境。"},{"id":"BIO-B01-Ch1.1-S031:D","text":"演化適應","explanation":"瞬間閉合不是跨世代變化。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S032","topicId":"","stem":"觀察到植物對刺激反應，能否據此斷定它具有意識？","correct":"BIO-B01-Ch1.1-S032:D","options":[{"id":"BIO-B01-Ch1.1-S032:A","text":"能，任何反應都能證明意識","explanation":"將可見反應當成意識的充分證據，推論過度。"},{"id":"BIO-B01-Ch1.1-S032:B","text":"不能，因為植物完全不會反應","explanation":"前提與實際觀察矛盾。"},{"id":"BIO-B01-Ch1.1-S032:C","text":"能，因為植物一定會像動物整體行走","explanation":"反應不要求整體主動位移，也不能證明此說法。"},{"id":"BIO-B01-Ch1.1-S032:D","text":"不能，反應本身不等於意識","explanation":"本節提醒刺激反應與主觀意識不能畫上等號。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S033","topicId":"","stem":"「感受刺激並產生反應」最接近哪項描述？","correct":"BIO-B01-Ch1.1-S033:A","options":[{"id":"BIO-B01-Ch1.1-S033:A","text":"回應環境","explanation":"定義包含環境刺激與生物反應兩端。"},{"id":"BIO-B01-Ch1.1-S033:B","text":"產生同類後代","explanation":"這是繁殖。"},{"id":"BIO-B01-Ch1.1-S033:C","text":"遺傳特徵經多代累積","explanation":"這是演化適應的線索。"},{"id":"BIO-B01-Ch1.1-S033:D","text":"個體形成成熟構造","explanation":"這是生長與發育的線索。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S034","topicId":"","stem":"以下哪個配對最符合本節？","correct":"BIO-B01-Ch1.1-S034:B","options":[{"id":"BIO-B01-Ch1.1-S034:A","text":"捕蠅草受刺激閉合—已證明有主觀意圖","explanation":"由反應不能推論一定有意圖。"},{"id":"BIO-B01-Ch1.1-S034:B","text":"捕蠅草受刺激閉合—回應環境","explanation":"題幹有刺激與反應的連結。"},{"id":"BIO-B01-Ch1.1-S034:C","text":"捕蠅草受刺激閉合—產生下一代","explanation":"閉合與後代形成不同。"},{"id":"BIO-B01-Ch1.1-S034:D","text":"捕蠅草受刺激閉合—族群多代演化","explanation":"快速個體反應不能直接當作族群演化。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S035","topicId":"","stem":"生物回應環境是否必須伴隨整個身體移動到別處？","correct":"BIO-B01-Ch1.1-S035:C","options":[{"id":"BIO-B01-Ch1.1-S035:A","text":"必須，而且必須產生後代","explanation":"繁殖不是環境反應的必備條件。"},{"id":"BIO-B01-Ch1.1-S035:B","text":"不必，因為反應只發生在非生命","explanation":"生物可以回應環境，此理由錯誤。"},{"id":"BIO-B01-Ch1.1-S035:C","text":"不必，局部構造的反應也可符合","explanation":"捕蠅草葉片閉合便不要求整株位移。"},{"id":"BIO-B01-Ch1.1-S035:D","text":"必須，沒有行走就沒有反應","explanation":"把整體位移誤當反應的必要條件。"}],"concept":"","example":"捕蠅草受碰觸而閉合，不必整株移到別處。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S036","topicId":"","stem":"判讀演化適應時，哪一組線索最關鍵？","correct":"BIO-B01-Ch1.1-S036:D","options":[{"id":"BIO-B01-Ch1.1-S036:A","text":"個體、願望、立刻完成","explanation":"願望與即時個體改造不構成演化解釋。"},{"id":"BIO-B01-Ch1.1-S036:B","text":"汽車、行駛、速度增加","explanation":"非生命移動不能直接說明生物演化。"},{"id":"BIO-B01-Ch1.1-S036:C","text":"單次碰觸、同一葉片、閉合","explanation":"此組較適合回應環境。"},{"id":"BIO-B01-Ch1.1-S036:D","text":"族群、可遺傳特徵、世代累積","explanation":"這些線索區分演化適應與個體當下調整。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S037","topicId":"","stem":"哪一種說法是本節要避免的演化誤解？","correct":"BIO-B01-Ch1.1-S037:A","options":[{"id":"BIO-B01-Ch1.1-S037:A","text":"個體為了需要而立即演化出新特徵","explanation":"此說法把族群世代過程寫成個體有意圖的改造。"},{"id":"BIO-B01-Ch1.1-S037:B","text":"可遺傳特徵能在族群世代間改變比例","explanation":"此句符合族群跨世代的描述。"},{"id":"BIO-B01-Ch1.1-S037:C","text":"適應可與生存環境有關","explanation":"適應性特徵的效果與環境相關。"},{"id":"BIO-B01-Ch1.1-S037:D","text":"演化適應需要考慮世代尺度","explanation":"考慮世代正是本節的正確提醒。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S038","topicId":"","stem":"某可遺傳的保護色使個體較易留下後代，且在族群中經多代更常見，應優先聯想到什麼？","correct":"BIO-B01-Ch1.1-S038:B","options":[{"id":"BIO-B01-Ch1.1-S038:A","text":"非生命的能量創造","explanation":"既非題意也非正確能量觀。"},{"id":"BIO-B01-Ch1.1-S038:B","text":"演化適應","explanation":"有利於留下後代的可遺傳保護特徵在族群多代累積，符合演化適應。"},{"id":"BIO-B01-Ch1.1-S038:C","text":"單一個體的即時散熱","explanation":"題幹是族群多代而非個體當下體溫控制。"},{"id":"BIO-B01-Ch1.1-S038:D","text":"同一幼苗形成第一片葉","explanation":"那是個體發育，尺度不同。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S039","topicId":"","stem":"小海馬的外觀有助於隱蔽於環境。依本節，這類適應應如何解釋？","correct":"BIO-B01-Ch1.1-S039:C","options":[{"id":"BIO-B01-Ch1.1-S039:A","text":"海馬吃下一口食物就完成族群演化","explanation":"單次取食不代表族群跨世代改變。"},{"id":"BIO-B01-Ch1.1-S039:B","text":"只要外觀不變就沒有遺傳資訊","explanation":"外觀與遺傳資訊存在與否不能如此推論。"},{"id":"BIO-B01-Ch1.1-S039:C","text":"有利的可遺傳特徵經世代累積","explanation":"適應透過族群長期世代過程形成。"},{"id":"BIO-B01-Ch1.1-S039:D","text":"每隻海馬想隱身就主動設計外觀","explanation":"個體願望不等於遺傳演化機制。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S040","topicId":"","stem":"「個體今日調整散熱」與「保護色多代累積」最大的區別是什麼？","correct":"BIO-B01-Ch1.1-S040:D","options":[{"id":"BIO-B01-Ch1.1-S040:A","text":"兩者都是單一個體主動演化","explanation":"都不能用個體意圖當作演化解釋。"},{"id":"BIO-B01-Ch1.1-S040:B","text":"前者必定繁殖，後者必定生長","explanation":"兩個配對都沒有抓住題幹條件。"},{"id":"BIO-B01-Ch1.1-S040:C","text":"兩者都不屬於生命相關現象","explanation":"兩者都是本節使用的生命現象。"},{"id":"BIO-B01-Ch1.1-S040:D","text":"前者是當下調節，後者是族群世代適應","explanation":"兩者重點分別在個體控制與跨世代遺傳特徵變化。"}],"concept":"","example":"可遺傳的保護色有利於留下後代，能在族群多代間累積。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S041","topicId":"","stem":"哪一組完整列出本節的五個統整主題？","correct":"BIO-B01-Ch1.1-S041:A","options":[{"id":"BIO-B01-Ch1.1-S041:A","text":"組織、資訊、能量與物質、交互作用、演化","explanation":"這是五主題的完整組合。"},{"id":"BIO-B01-Ch1.1-S041:B","text":"組織、資訊、繁殖、調節、回應環境","explanation":"後三者是生命性質用語，未列全五主題。"},{"id":"BIO-B01-Ch1.1-S041:C","text":"生長、繁殖、調節、移動、顏色","explanation":"此組不是五個統整主題。"},{"id":"BIO-B01-Ch1.1-S041:D","text":"資訊、形狀、速度、大小、重量","explanation":"除資訊外其餘不是本節五主題的完整分類。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S042","topicId":"","stem":"若一段導讀把DNA與基因所承載的訊息列為重點，最對應哪個主題？","correct":"BIO-B01-Ch1.1-S042:B","options":[{"id":"BIO-B01-Ch1.1-S042:A","text":"演化","explanation":"題幹沒有討論跨世代改變。"},{"id":"BIO-B01-Ch1.1-S042:B","text":"資訊","explanation":"DNA、基因與生命活動的資訊關係是此主題的概略焦點。"},{"id":"BIO-B01-Ch1.1-S042:C","text":"組織","explanation":"組織關注層級，並非此題訊息的直接焦點。"},{"id":"BIO-B01-Ch1.1-S042:D","text":"能量與物質","explanation":"此題未以能量流動或物質轉換為重點。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S043","topicId":"","stem":"「分子、細胞、個體與環境之間相互影響」最直接對應哪個主題？","correct":"BIO-B01-Ch1.1-S043:C","options":[{"id":"BIO-B01-Ch1.1-S043:A","text":"組織","explanation":"題幹強調相互影響，並非列出層級本身。"},{"id":"BIO-B01-Ch1.1-S043:B","text":"演化","explanation":"沒有強調族群經世代變化。"},{"id":"BIO-B01-Ch1.1-S043:C","text":"交互作用","explanation":"重點是各部分或生物與環境的互動。"},{"id":"BIO-B01-Ch1.1-S043:D","text":"資訊","explanation":"資訊主題著重遺傳訊息，題幹沒有此焦點。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S044","topicId":"","stem":"五個主題中，哪個被指出能解釋生命的統一性與多樣性？","correct":"BIO-B01-Ch1.1-S044:D","options":[{"id":"BIO-B01-Ch1.1-S044:A","text":"能量與物質","explanation":"此主題關注能量與物質的流動轉換，非此題指定功能。"},{"id":"BIO-B01-Ch1.1-S044:B","text":"資訊","explanation":"資訊聚焦遺傳資訊與生命活動，不是本題指定答案。"},{"id":"BIO-B01-Ch1.1-S044:C","text":"交互作用","explanation":"互動重要，但本題所引核心角色是演化。"},{"id":"BIO-B01-Ch1.1-S044:D","text":"演化","explanation":"演化是本節指出的核心統整主題。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S045","topicId":"","stem":"若教材概略討論能量在生命系統中的流動與轉換，應歸入哪個主題？","correct":"BIO-B01-Ch1.1-S045:A","options":[{"id":"BIO-B01-Ch1.1-S045:A","text":"能量與物質","explanation":"題幹直接對應此主題的概略內容。"},{"id":"BIO-B01-Ch1.1-S045:B","text":"繁殖","explanation":"繁殖是一項生命性質，並非題幹對應的五主題名稱。"},{"id":"BIO-B01-Ch1.1-S045:C","text":"有意識","explanation":"意識不是五個主題之一，也不由能量流動推得。"},{"id":"BIO-B01-Ch1.1-S045:D","text":"體型大小","explanation":"大小不是此五主題之一。"}],"concept":"","example":"DNA訊息可連到資訊；生命層級可連到組織。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S046","topicId":"","stem":"五個統整主題在學習上的主要用途是什麼？","correct":"BIO-B01-Ch1.1-S046:B","options":[{"id":"BIO-B01-Ch1.1-S046:A","text":"只作第一章考完就可丟掉的清單","explanation":"五主題仍可用於後續學習。"},{"id":"BIO-B01-Ch1.1-S046:B","text":"協助串聯龐大的生物學內容","explanation":"主題提供跨內容的思考框架。"},{"id":"BIO-B01-Ch1.1-S046:C","text":"把生命硬性縮成五個互不相干動作","explanation":"主題不是孤立動作，也不要求彼此無關。"},{"id":"BIO-B01-Ch1.1-S046:D","text":"取代所有後續章節的閱讀","explanation":"概念框架不能代替具體內容學習。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S047","topicId":"","stem":"「七項生命特徵」與「五個統整主題」應如何區別？","correct":"BIO-B01-Ch1.1-S047:C","options":[{"id":"BIO-B01-Ch1.1-S047:A","text":"五主題只包括生長與繁殖","explanation":"生長與繁殖不是五主題完整名稱。"},{"id":"BIO-B01-Ch1.1-S047:B","text":"七特徵全部都只描述族群多代改變","explanation":"只有演化適應突出此尺度，其他可涉及個體活動。"},{"id":"BIO-B01-Ch1.1-S047:C","text":"前者幫助辨認生命活動，後者組織生命研究觀念","explanation":"兩組框架用途相關但不是同一份名稱清單。"},{"id":"BIO-B01-Ch1.1-S047:D","text":"兩者是完全相同的七個詞","explanation":"數量與名稱並不相同。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S048","topicId":"","stem":"「幼苗長大」與「捕蠅草受刺激閉合」的正確配對為何？","correct":"BIO-B01-Ch1.1-S048:D","options":[{"id":"BIO-B01-Ch1.1-S048:A","text":"繁殖；演化適應","explanation":"兩例都沒有對應後代形成或多代演化。"},{"id":"BIO-B01-Ch1.1-S048:B","text":"有意識；能量創造","explanation":"題幹不能證明意識，能量創造也錯。"},{"id":"BIO-B01-Ch1.1-S048:C","text":"調節；產生後代","explanation":"題幹焦點分別不是內部範圍維持與繁殖。"},{"id":"BIO-B01-Ch1.1-S048:D","text":"生長與發育；回應環境","explanation":"前者是個體形成與成長，後者是刺激引起反應。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S049","topicId":"","stem":"一題強調「產生下一代」，另一題強調「維持內部條件」，依序應選什麼？","correct":"BIO-B01-Ch1.1-S049:A","options":[{"id":"BIO-B01-Ch1.1-S049:A","text":"繁殖；調節","explanation":"後代形成與內部控制分別是兩項定義的直接線索。"},{"id":"BIO-B01-Ch1.1-S049:B","text":"生長；秩序","explanation":"沒有分辨後代與構造、內部控制的差異。"},{"id":"BIO-B01-Ch1.1-S049:C","text":"演化；意識","explanation":"產生下一代本身未必強調演化，內部控制不等於意識。"},{"id":"BIO-B01-Ch1.1-S049:D","text":"能量創造；非生命","explanation":"兩者皆不符合題幹與本節觀念。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S050","topicId":"","stem":"讀到新的生物例子時，哪種做法最符合本節的概念框架？","correct":"BIO-B01-Ch1.1-S050:B","options":[{"id":"BIO-B01-Ch1.1-S050:A","text":"凡是沒有整體移動就判成非生命","explanation":"這會錯排仍有生命活動的植物。"},{"id":"BIO-B01-Ch1.1-S050:B","text":"先找活動線索，再對照生命特徵或統整主題","explanation":"這能把例子與概念及原因連結。"},{"id":"BIO-B01-Ch1.1-S050:C","text":"只挑最熟悉的名詞，不看題幹條件","explanation":"忽略條件容易混淆個體、後代與族群世代。"},{"id":"BIO-B01-Ch1.1-S050:D","text":"凡是有變化就選演化適應","explanation":"個體生長和即時反應也有變化，但不等於演化。"}],"concept":"","example":"先分辨是個體當下活動、產生後代，還是族群多代變化。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true}]},{"depth":"基礎讀","target":100,"questions":[{"id":"BIO-B01-Ch1.1-B001","topicId":"","stem":"有人設計辨認生命的規則：「凡能改變位置者都算生命。」用汽車與盆栽檢查這條規則，哪個評語最合理？","correct":"BIO-B01-Ch1.1-B001:A","options":[{"id":"BIO-B01-Ch1.1-B001:A","text":"會把可移動的汽車誤判成生命，也可能漏掉盆栽","explanation":"單用位移既可能誤納非生命，也可能錯排植物，應綜合活動。"},{"id":"BIO-B01-Ch1.1-B001:B","text":"汽車與盆栽都必定能通過，規則沒有缺點","explanation":"盆栽通常不作整體主動位移，且汽車通過不等於判得正確。"},{"id":"BIO-B01-Ch1.1-B001:C","text":"只要把速度門檻提高就能排除所有錯誤","explanation":"速度高低不能消除移動與生命之間的邏輯缺口。"},{"id":"BIO-B01-Ch1.1-B001:D","text":"汽車有位移，因此它比盆栽更符合生命定義","explanation":"不能用位移程度排列生命資格。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B002","topicId":"","stem":"觀察紀錄只寫「這個物體有漂亮的排列」，沒有其他活動資料。依本節，何種結論最穩妥？","correct":"BIO-B01-Ch1.1-B002:B","options":[{"id":"BIO-B01-Ch1.1-B002:A","text":"只要有排列就一定正在繁殖","explanation":"構造排列與產生後代是不同線索。"},{"id":"BIO-B01-Ch1.1-B002:B","text":"僅這項排列描述不足以完整判定生命","explanation":"生命的辨認要看整組性質，有秩序的單一描述不是充分判準。"},{"id":"BIO-B01-Ch1.1-B002:C","text":"已完全證明它是生命","explanation":"僅憑外觀排列就作完整生命判定，證據不足。"},{"id":"BIO-B01-Ch1.1-B002:D","text":"已完全證明它不是生命","explanation":"缺其他資料不等於已證明非生命。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B003","topicId":"","stem":"同學說：「我只看一次，一株植物沒有走動，所以沒有生命。」他的推論主要錯在哪裡？","correct":"BIO-B01-Ch1.1-B003:C","options":[{"id":"BIO-B01-Ch1.1-B003:A","text":"錯把植物視為可能會發育","explanation":"植物會發育，此認識本身正確。"},{"id":"BIO-B01-Ch1.1-B003:B","text":"沒有先證明植物會想事情","explanation":"有生命不要求已證明具有意識。"},{"id":"BIO-B01-Ch1.1-B003:C","text":"把未見整體位移當成缺少所有生命活動","explanation":"植物仍可生長、處理能量與回應環境，不能以一次未位移否定生命。"},{"id":"BIO-B01-Ch1.1-B003:D","text":"忘記所有非生命都會走動","explanation":"並非所有非生命都走動，且這不是主要錯誤。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B004","topicId":"","stem":"一個對象的紀錄同時顯示有組織的構造、能量處理與內部調節。相比只記錄顏色，這份紀錄的優點是什麼？","correct":"BIO-B01-Ch1.1-B004:D","options":[{"id":"BIO-B01-Ch1.1-B004:A","text":"它保證每個生命個體都已繁殖","explanation":"紀錄未提後代，也不能推出每個個體都能繁殖。"},{"id":"BIO-B01-Ch1.1-B004:B","text":"它證明凡有顏色的物體都不是生命","explanation":"顏色不足作判準不等於有顏色就是非生命。"},{"id":"BIO-B01-Ch1.1-B004:C","text":"它把調節改成完全靜止","explanation":"調節是控制範圍，不是完全靜止。"},{"id":"BIO-B01-Ch1.1-B004:D","text":"它提供多種生命性質的線索","explanation":"多項活動與性質更符合本節辨認生命的方式，但仍按完整脈絡判讀。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B005","topicId":"","stem":"甲依「會動」判斷生命，乙依多項生命活動並注意個體例外判斷。何者較符合本節，理由為何？","correct":"BIO-B01-Ch1.1-B005:A","options":[{"id":"BIO-B01-Ch1.1-B005:A","text":"乙，因為單一特徵可能造成錯誤分類","explanation":"綜合特徵並保留個體例外能避免位移或繁殖的絕對化。"},{"id":"BIO-B01-Ch1.1-B005:B","text":"甲，因為移動是所有生命的唯一共同點","explanation":"植物例子已否定這種單一必要標準。"},{"id":"BIO-B01-Ch1.1-B005:C","text":"甲，因為汽車能移動所以必須算生命","explanation":"汽車是反例，不能因此改成生命。"},{"id":"BIO-B01-Ch1.1-B005:D","text":"乙，因為多項特徵代表不再需要觀察","explanation":"多項特徵仍需實際觀察與判斷，不是放棄觀察。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B006","topicId":"","stem":"若有人把「生命不易一句話定義」解讀成「生命完全無法科學研究」，應如何修正？","correct":"BIO-B01-Ch1.1-B006:B","options":[{"id":"BIO-B01-Ch1.1-B006:A","text":"宣稱每項生命現象都只能靠意識解釋","explanation":"意識不是所有生命活動的必要解釋。"},{"id":"BIO-B01-Ch1.1-B006:B","text":"定義不簡單，仍可研究可觀察的生命性質與活動","explanation":"定義難題不否定生物學對生命現象的科學研究。"},{"id":"BIO-B01-Ch1.1-B006:C","text":"接受此說法，停止觀察生命","explanation":"與生物學的研究目的和本節活動辨認方式相反。"},{"id":"BIO-B01-Ch1.1-B006:D","text":"把科學研究改成只看物體是否鮮豔","explanation":"顏色單項不能取代生命研究。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B007","topicId":"","stem":"甲會移動但沒有呈現整套生命活動，乙不作整體主動位移卻持續呈現生命活動。僅依這些資料，何種提醒最合理？","correct":"BIO-B01-Ch1.1-B007:C","options":[{"id":"BIO-B01-Ch1.1-B007:A","text":"甲必定是生命，因為移動已足夠","explanation":"忽視非生命也能移動。"},{"id":"BIO-B01-Ch1.1-B007:B","text":"甲乙都不能有生命，因為生命必須一直繁殖","explanation":"生命個體不需每刻繁殖，新增了錯誤限制。"},{"id":"BIO-B01-Ch1.1-B007:C","text":"不能只憑甲移動、乙不移動就決定生命資格","explanation":"位移差異不等於生命活動整體差異。"},{"id":"BIO-B01-Ch1.1-B007:D","text":"乙一定不是生命，因為沒有位移","explanation":"忽視題目已說乙有生命活動。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B008","topicId":"","stem":"學生說：「不孕個體不能繁殖，所以其他能量處理與調節的觀察都可忽略。」最合適的反駁為何？","correct":"BIO-B01-Ch1.1-B008:D","options":[{"id":"BIO-B01-Ch1.1-B008:A","text":"能量處理與調節本來就和生命無關","explanation":"這兩項正是本節生命性質。"},{"id":"BIO-B01-Ch1.1-B008:B","text":"不孕就表示該個體從未生長","explanation":"無法由繁殖能力反推從未生長。"},{"id":"BIO-B01-Ch1.1-B008:C","text":"只要改看個體是否漂亮就可判斷","explanation":"美觀不能代替生命活動。"},{"id":"BIO-B01-Ch1.1-B008:D","text":"繁殖不能被當成排除一切其他生命證據的個體必備條件","explanation":"不孕個體仍是生命，應保留整體判讀。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B009","topicId":"","stem":"一本小冊把生命判準寫成「會行走、有漂亮顏色、體積大」。依本節，哪個修訂方向最好？","correct":"BIO-B01-Ch1.1-B009:A","options":[{"id":"BIO-B01-Ch1.1-B009:A","text":"改為討論生命的多項性質，並說明單項判準的限制","explanation":"原三項外觀與位移不能涵蓋生命，應回到生命活動。"},{"id":"BIO-B01-Ch1.1-B009:B","text":"只刪除顏色，保留行走和大體積作絕對條件","explanation":"行走與大小仍不是完整生命判準。"},{"id":"BIO-B01-Ch1.1-B009:C","text":"把行走換成奔跑，就能涵蓋植物","explanation":"奔跑也不能涵蓋植物生命活動。"},{"id":"BIO-B01-Ch1.1-B009:D","text":"只要三項全部出現就不需考慮其他性質","explanation":"三項錯誤判準合併仍不能構成可靠生命定義。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B010","topicId":"","stem":"若課堂只能用一句話概括本節對生命的辨認方式，何者最能保留原意？","correct":"BIO-B01-Ch1.1-B010:B","options":[{"id":"BIO-B01-Ch1.1-B010:A","text":"每個個體必須同時正在繁殖才可判活","explanation":"把系統特徵變成每個個體每刻的條件，錯誤。"},{"id":"BIO-B01-Ch1.1-B010:B","text":"從生命系統的多種活動與性質綜合辨認，留意個體例外","explanation":"此句保留整體觀察與繁殖等個體例外。"},{"id":"BIO-B01-Ch1.1-B010:C","text":"觀察任何單一動作即可涵蓋所有生命","explanation":"單一動作不足。"},{"id":"BIO-B01-Ch1.1-B010:D","text":"有沒有移動比所有其他資料都重要","explanation":"本節沒有賦予位移唯一優先地位。"}],"concept":"","example":"汽車可位移；植物可留在原地生長。只看位移會判錯。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B011","topicId":"","stem":"一份紀錄寫「細胞內的各部分具有有組織的配置」，同學卻歸為繁殖。哪個修正最合理？","correct":"BIO-B01-Ch1.1-B011:C","options":[{"id":"BIO-B01-Ch1.1-B011:A","text":"改歸演化，因為所有排列都表示多代變化","explanation":"排列本身沒有族群世代資訊。"},{"id":"BIO-B01-Ch1.1-B011:B","text":"改歸意識，因為整齊必定需要思考","explanation":"結構組織不能證明主觀思考。"},{"id":"BIO-B01-Ch1.1-B011:C","text":"改歸秩序，因為紀錄談的是結構組織而非後代","explanation":"有組織的配置與秩序相符；沒有後代形成資料。"},{"id":"BIO-B01-Ch1.1-B011:D","text":"保留繁殖，因為任何配置都是後代","explanation":"結構配置不能等同後代形成。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B012","topicId":"","stem":"觀察者把生物的「有秩序」解釋為「各部分必須毫無差別」。這個解釋有何問題？","correct":"BIO-B01-Ch1.1-B012:D","options":[{"id":"BIO-B01-Ch1.1-B012:A","text":"秩序的意思本來就是完全同一","explanation":"混淆組織性與全無差異。"},{"id":"BIO-B01-Ch1.1-B012:B","text":"秩序只適用於正在飛行的動物","explanation":"題材範圍不受飛行限制。"},{"id":"BIO-B01-Ch1.1-B012:C","text":"只要各部分不同就表示沒有生命","explanation":"不同構造不否定生命。"},{"id":"BIO-B01-Ch1.1-B012:D","text":"組織性不要求各部分或各個體完全相同","explanation":"有組織的差異與分工仍可呈現秩序。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B013","topicId":"","stem":"甲描述「各部分如何有組織地排列」，乙描述「物質如何被吸收與轉換」。若只按兩段的焦點，哪個配對最好？","correct":"BIO-B01-Ch1.1-B013:A","options":[{"id":"BIO-B01-Ch1.1-B013:A","text":"甲偏組織，乙偏能量與物質","explanation":"結構安排與物質轉換分別連到兩個主題。"},{"id":"BIO-B01-Ch1.1-B013:B","text":"甲偏繁殖，乙偏意識","explanation":"甲未談後代，乙未談意識。"},{"id":"BIO-B01-Ch1.1-B013:C","text":"甲乙都只是在說體型大小","explanation":"兩段的焦點不是單純尺寸。"},{"id":"BIO-B01-Ch1.1-B013:D","text":"甲偏演化，乙偏繁殖","explanation":"沒有多代遺傳變化或後代形成線索。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B014","topicId":"","stem":"某張教學卡只寫「結構有組織」，另一張只寫「內部條件受控制而維持在可運作範圍內」。要避免混淆，兩張應依序標什麼？","correct":"BIO-B01-Ch1.1-B014:B","options":[{"id":"BIO-B01-Ch1.1-B014:A","text":"演化適應；回應環境","explanation":"沒有跨代遺傳或刺激反應重點。"},{"id":"BIO-B01-Ch1.1-B014:B","text":"秩序；調節","explanation":"前者是結構性質，後者是條件控制。"},{"id":"BIO-B01-Ch1.1-B014:C","text":"調節；秩序","explanation":"兩個定義位置顛倒。"},{"id":"BIO-B01-Ch1.1-B014:D","text":"繁殖；生長","explanation":"沒有後代與尺寸發育線索。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B015","topicId":"","stem":"若學生以「生物由不同層次的有組織構造構成」概括組織主題，何種補充最適當？","correct":"BIO-B01-Ch1.1-B015:C","options":[{"id":"BIO-B01-Ch1.1-B015:A","text":"所以只要生物在生長就沒有秩序","explanation":"生長發育可與有組織構造並存。"},{"id":"BIO-B01-Ch1.1-B015:B","text":"所以每次觀察層級都等於看到繁殖","explanation":"層級結構與後代形成不同。"},{"id":"BIO-B01-Ch1.1-B015:C","text":"此處是層級與組織性的總覽，不能推成所有部分都一樣","explanation":"導入只建框架，組織性不代表同質。"},{"id":"BIO-B01-Ch1.1-B015:D","text":"所以所有生物的每個構造都相同","explanation":"將組織框架誤推成全體同構。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B016","topicId":"","stem":"老師展示一段文字：「生物內各構造有安排，可分辨彼此關係。」為何把它放在秩序格比放在繁殖格更合適？","correct":"BIO-B01-Ch1.1-B016:D","options":[{"id":"BIO-B01-Ch1.1-B016:A","text":"只要有不同構造就必定剛產生後代","explanation":"不同構造不等於新後代。"},{"id":"BIO-B01-Ch1.1-B016:B","text":"繁殖其實就是構造排列","explanation":"定義錯誤。"},{"id":"BIO-B01-Ch1.1-B016:C","text":"秩序只需看物體是否不移動","explanation":"位移與否不是本題的組織性線索。"},{"id":"BIO-B01-Ch1.1-B016:D","text":"文字提供結構組織線索，未提供產生後代的事件","explanation":"判斷依實際描述而非憑空加條件。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B017","topicId":"","stem":"觀察到一隻動物的構造有組織，同時牠正在活動。哪個結論合理？","correct":"BIO-B01-Ch1.1-B017:A","options":[{"id":"BIO-B01-Ch1.1-B017:A","text":"活動與有秩序不衝突，秩序不等於靜止","explanation":"生命可在活動中仍有組織的構造。"},{"id":"BIO-B01-Ch1.1-B017:B","text":"只要開始活動就一定失去生命秩序","explanation":"沒有這種互斥關係。"},{"id":"BIO-B01-Ch1.1-B017:C","text":"有秩序證明牠每一秒都正在繁殖","explanation":"秩序不能推出繁殖時間。"},{"id":"BIO-B01-Ch1.1-B017:D","text":"活動足以取代所有結構觀察","explanation":"不能以單一活動取代整體性質觀察。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B018","topicId":"","stem":"概念圖以「有組織的結構」連到「組織」，再連到生命研究。這條連線在導入層次上合理嗎？","correct":"BIO-B01-Ch1.1-B018:B","options":[{"id":"BIO-B01-Ch1.1-B018:A","text":"合理，因為這已詳細證明所有組織層級機制","explanation":"圖只作概略連結，不能冒稱已證明全部機制。"},{"id":"BIO-B01-Ch1.1-B018:B","text":"合理，因為它把結構性質連到統整主題","explanation":"秩序與組織主題相關，但兩個名稱分屬性質與框架。"},{"id":"BIO-B01-Ch1.1-B018:C","text":"不合理，因為組織只指能量被創造","explanation":"組織不是能量創造。"},{"id":"BIO-B01-Ch1.1-B018:D","text":"不合理，因為結構必定代表意識","explanation":"由結構不能推知意識。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B019","topicId":"","stem":"一題只有「生物構造並非隨機堆積」這項敘述。為何不應優先選演化適應？","correct":"BIO-B01-Ch1.1-B019:C","options":[{"id":"BIO-B01-Ch1.1-B019:A","text":"因為所有有秩序的生物都不能演化","explanation":"兩項性質並不互斥。"},{"id":"BIO-B01-Ch1.1-B019:B","text":"因為演化適應和世代完全無關","explanation":"世代正是演化適應的重要條件。"},{"id":"BIO-B01-Ch1.1-B019:C","text":"尚未提供可遺傳特徵在族群世代間累積的線索","explanation":"現有線索直接是秩序，演化判斷需要合適尺度。"},{"id":"BIO-B01-Ch1.1-B019:D","text":"因為演化適應只會發生在汽車","explanation":"演化適應屬生命族群，不是汽車。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B020","topicId":"","stem":"同學整理兩個詞：「秩序是一項生命性質；組織是統整研究的主題。」最合理的評價是什麼？","correct":"BIO-B01-Ch1.1-B020:D","options":[{"id":"BIO-B01-Ch1.1-B020:A","text":"應把兩詞都改成繁殖","explanation":"與題意和定義不符。"},{"id":"BIO-B01-Ch1.1-B020:B","text":"應刪去秩序，因為生命沒有結構性質","explanation":"秩序正是本節七項性質之一。"},{"id":"BIO-B01-Ch1.1-B020:C","text":"應認為五主題和七特徵完全同一份清單","explanation":"兩組數量與用途不同。"},{"id":"BIO-B01-Ch1.1-B020:D","text":"可保留，兩詞相關但角色與清單不同","explanation":"秩序描述生命結構，組織列在五主題中。"}],"concept":"","example":"細胞各部分有組織的配置，是結構秩序的例子。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B021","topicId":"","stem":"紀錄甲：「同一個體由小變大。」紀錄乙：「成體產生同類後代。」為何只有乙直接證明繁殖事件？","correct":"BIO-B01-Ch1.1-B021:A","options":[{"id":"BIO-B01-Ch1.1-B021:A","text":"乙出現下一代，甲只描述原個體改變","explanation":"繁殖的關鍵是後代形成，不是原個體變大。"},{"id":"BIO-B01-Ch1.1-B021:B","text":"甲太小所以不可能有生命","explanation":"體型大小不決定生命資格。"},{"id":"BIO-B01-Ch1.1-B021:C","text":"乙只要體型大就一定繁殖","explanation":"題幹的有效線索是後代，不是體型。"},{"id":"BIO-B01-Ch1.1-B021:D","text":"甲乙都沒有任何生命相關資訊","explanation":"兩者分別涉及生長與繁殖。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B022","topicId":"","stem":"有人為每隻動物填「是否有生命」，只要尚未產生後代就填否。這種做法會造成什麼問題？","correct":"BIO-B01-Ch1.1-B022:B","options":[{"id":"BIO-B01-Ch1.1-B022:A","text":"證明生物根本沒有繁殖特徵","explanation":"個體例外不否定生命系統的繁殖性質。"},{"id":"BIO-B01-Ch1.1-B022:B","text":"把未繁殖或不能繁殖的生命個體錯誤排除","explanation":"不能把生殖紀錄當作每一個體有生命的唯一條件。"},{"id":"BIO-B01-Ch1.1-B022:C","text":"正確排除所有幼體，因為幼體沒有生命","explanation":"幼體仍有生命活動。"},{"id":"BIO-B01-Ch1.1-B022:D","text":"只影響個體名稱，不影響判斷","explanation":"規則直接把生命個體判成非生命，並非名稱差異。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B023","topicId":"","stem":"一株植物先形成新葉，之後產生下一代。若課堂要把兩段事件分開標記，哪一種最恰當？","correct":"BIO-B01-Ch1.1-B023:C","options":[{"id":"BIO-B01-Ch1.1-B023:A","text":"兩段都只能叫族群演化適應","explanation":"題幹沒有可遺傳特徵多代累積的比較。"},{"id":"BIO-B01-Ch1.1-B023:B","text":"新葉形成證明植物由非生命變生命","explanation":"植物在形成新葉前也可有生命，不能如此推斷。"},{"id":"BIO-B01-Ch1.1-B023:C","text":"新葉形成屬生長發育，下一代出現屬繁殖","explanation":"先後兩事件的判準分別是同個體構造與後代。"},{"id":"BIO-B01-Ch1.1-B023:D","text":"兩段都只能叫繁殖","explanation":"新葉形成並不是下一代的出現。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B024","topicId":"","stem":"學生在「繁殖」的解析寫：「因為原個體體積增大，所以已產生後代。」應怎麼改？","correct":"BIO-B01-Ch1.1-B024:D","options":[{"id":"BIO-B01-Ch1.1-B024:A","text":"保留原句，因為增大必定等於下一代","explanation":"兩概念不等價。"},{"id":"BIO-B01-Ch1.1-B024:B","text":"改成只要不增大就一定繁殖","explanation":"不增大同樣不能證明後代。"},{"id":"BIO-B01-Ch1.1-B024:C","text":"刪掉後代，將繁殖定義成內部溫度控制","explanation":"那是調節，不是繁殖。"},{"id":"BIO-B01-Ch1.1-B024:D","text":"把體積增大和後代形成分開，不能以前者證明後者","explanation":"繁殖與生長是兩個不同事件判準。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B025","topicId":"","stem":"某不孕個體持續生長、取食與維持內部條件。若問它是否有生命，最佳理由是哪個？","correct":"BIO-B01-Ch1.1-B025:A","options":[{"id":"BIO-B01-Ch1.1-B025:A","text":"它仍呈現生命活動，個體不孕不等於非生命","explanation":"綜合活動判讀並保留個體繁殖例外。"},{"id":"BIO-B01-Ch1.1-B025:B","text":"它一定已有後代，只是題幹沒說","explanation":"題幹未提供後代紀錄，不能假定它一定已有後代；是否有生命也不靠此判定。"},{"id":"BIO-B01-Ch1.1-B025:C","text":"取食代表它能創造能量，所以有生命","explanation":"取食是能量取得，不能說成創造。"},{"id":"BIO-B01-Ch1.1-B025:D","text":"它必定會整體移動，所以不必看其他活動","explanation":"題目未給位移，且位移不是唯一標準。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B026","topicId":"","stem":"下列哪一筆新增紀錄，最能讓「這次觀察到了繁殖」的結論有直接依據？","correct":"BIO-B01-Ch1.1-B026:B","options":[{"id":"BIO-B01-Ch1.1-B026:A","text":"同一片葉受到碰觸後閉合","explanation":"這直接支持環境反應。"},{"id":"BIO-B01-Ch1.1-B026:B","text":"原有生命系統產生了同類後代","explanation":"此紀錄直接符合繁殖的定義。"},{"id":"BIO-B01-Ch1.1-B026:C","text":"同一個體的長度增加","explanation":"長度增加直接支持生長。"},{"id":"BIO-B01-Ch1.1-B026:D","text":"同一個體調整散熱","explanation":"這直接支持調節。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B027","topicId":"","stem":"甲說「繁殖是生命系統的性質」，乙說「因此每個活個體此刻都正在繁殖」。對兩句的評價何者正確？","correct":"BIO-B01-Ch1.1-B027:C","options":[{"id":"BIO-B01-Ch1.1-B027:A","text":"甲錯乙對，只有此刻繁殖的個體算生命","explanation":"仍採用了錯誤個體門檻。"},{"id":"BIO-B01-Ch1.1-B027:B","text":"兩句都錯，生命系統絕不繁殖","explanation":"個體例外不否定系統繁殖。"},{"id":"BIO-B01-Ch1.1-B027:C","text":"甲可保留，乙把性質誤變成每個個體每刻的條件","explanation":"繁殖特徵不要求所有個體同時正在生殖。"},{"id":"BIO-B01-Ch1.1-B027:D","text":"兩句都正確，生命每刻都有新後代","explanation":"本節明示不能要求每個個體都繁殖。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B028","topicId":"","stem":"小組比較「幼獸長到成體」和「成體產生幼獸」，希望只用一句理由區分。何者最佳？","correct":"BIO-B01-Ch1.1-B028:D","options":[{"id":"BIO-B01-Ch1.1-B028:A","text":"只要句中有幼獸就都是繁殖","explanation":"應看幼獸是原個體還是新後代，不能只看名詞。"},{"id":"BIO-B01-Ch1.1-B028:B","text":"只要句中有成體就都是演化","explanation":"成熟個體不等於族群演化。"},{"id":"BIO-B01-Ch1.1-B028:C","text":"兩者都要以有無意識判斷","explanation":"意識不是這兩個性質的判準。"},{"id":"BIO-B01-Ch1.1-B028:D","text":"前者追蹤同個體成熟，後者描述下一代的出現","explanation":"抓住原個體與後代可分清生長發育、繁殖。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B029","topicId":"","stem":"某份報告寫「並非每個個體都可繁殖，所以繁殖不能列為生命性質」。最好的修正為何？","correct":"BIO-B01-Ch1.1-B029:A","options":[{"id":"BIO-B01-Ch1.1-B029:A","text":"保留繁殖性質，同時明示它不是每個個體的硬性門檻","explanation":"系統層次的特徵與個體例外可以並存。"},{"id":"BIO-B01-Ch1.1-B029:B","text":"刪除所有生命特徵，只用位移判斷","explanation":"這會回到單一特徵判斷的錯誤。"},{"id":"BIO-B01-Ch1.1-B029:C","text":"宣稱不孕個體仍能隨意產生後代","explanation":"為了套清單而改寫事實不合理。"},{"id":"BIO-B01-Ch1.1-B029:D","text":"把繁殖改稱能量創造就能解決例外","explanation":"錯換定義，且能量創造也不正確。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B030","topicId":"","stem":"題目問「哪個活動最直接把生命延續到同類後代」，哪個推理最符合題意？","correct":"BIO-B01-Ch1.1-B030:B","options":[{"id":"BIO-B01-Ch1.1-B030:A","text":"選回應環境，因為每次反應都必定生殖","explanation":"刺激反應不必伴隨繁殖。"},{"id":"BIO-B01-Ch1.1-B030:B","text":"選繁殖，因為關鍵是後代形成而非個體變大","explanation":"此問法聚焦生命系統產生同類後代。"},{"id":"BIO-B01-Ch1.1-B030:C","text":"選生長，因為同個體變大就等於新個體","explanation":"把生長誤等同繁殖。"},{"id":"BIO-B01-Ch1.1-B030:D","text":"選調節，因為任何內部穩定都已形成後代","explanation":"內部控制不保證新後代。"}],"concept":"","example":"同一隻幼鳥長大是生長；成鳥產生後代才是繁殖。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B031","topicId":"","stem":"同一株幼苗不只增高，還分化出根、莖、葉。為什麼只寫「尺寸變大」不夠完整？","correct":"BIO-B01-Ch1.1-B031:C","options":[{"id":"BIO-B01-Ch1.1-B031:A","text":"因為所有尺寸增加都等於產生後代","explanation":"個體增大不等於後代。"},{"id":"BIO-B01-Ch1.1-B031:B","text":"因為只有族群多代改變才可叫發育","explanation":"發育可發生於一個個體，不需跨族群世代。"},{"id":"BIO-B01-Ch1.1-B031:C","text":"它忽略分化與特定構造形成的發育部分","explanation":"題幹同時包含成長與有方向的構造形成。"},{"id":"BIO-B01-Ch1.1-B031:D","text":"因為形成構造完全不屬於生命","explanation":"構造形成正是生物發育內容。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B032","topicId":"","stem":"學生問：「同一幼苗依基因攜帶的訊息形成構造，該看生命特徵還是主題？」何者回答最準確？","correct":"BIO-B01-Ch1.1-B032:D","options":[{"id":"BIO-B01-Ch1.1-B032:A","text":"只能選其中一個，兩種角度互相排斥","explanation":"生命性質與統整主題不是互斥分類。"},{"id":"BIO-B01-Ch1.1-B032:B","text":"只能看繁殖，因為形成根就是新後代","explanation":"根的形成是原個體發育，非後代形成。"},{"id":"BIO-B01-Ch1.1-B032:C","text":"只能看演化，因為任何基因相關活動都跨世代","explanation":"單一個體依遺傳資訊發育不等於多代演化。"},{"id":"BIO-B01-Ch1.1-B032:D","text":"活動可看生長發育，遺傳訊息的角度可連到資訊主題","explanation":"同一例子可從性質與統整主題兩個層次理解。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B033","topicId":"","stem":"一份紀錄依序畫出同一種子萌發、幼苗長高、根葉形成，並標明沒有下一代資料。最合適的總結為何？","correct":"BIO-B01-Ch1.1-B033:A","options":[{"id":"BIO-B01-Ch1.1-B033:A","text":"這是個體生長發育的連續紀錄","explanation":"同一個體逐步形成與成熟符合生長發育。"},{"id":"BIO-B01-Ch1.1-B033:B","text":"這已證明多代族群演化適應","explanation":"缺乏族群多代遺傳比較。"},{"id":"BIO-B01-Ch1.1-B033:C","text":"這表示每一片新葉都是一代","explanation":"把器官形成錯當世代。"},{"id":"BIO-B01-Ch1.1-B033:D","text":"這只是在描述繁殖的次數","explanation":"沒有後代資料，不能當繁殖次數。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B034","topicId":"","stem":"有人說幼苗發育只是「物質亂堆後變大」。本節提供哪個重要修正？","correct":"BIO-B01-Ch1.1-B034:B","options":[{"id":"BIO-B01-Ch1.1-B034:A","text":"發育與生命的秩序必定衝突","explanation":"有方向的構造形成可呈現秩序，兩者不衝突。"},{"id":"BIO-B01-Ch1.1-B034:B","text":"發育包含受遺傳資訊影響的分化與構造形成","explanation":"不只是無組織體積增加，而有成長發育模式。"},{"id":"BIO-B01-Ch1.1-B034:C","text":"發育由幼苗想變成哪種外形全權決定","explanation":"個體願望不是來源提供的發育解釋。"},{"id":"BIO-B01-Ch1.1-B034:D","text":"發育必須在沒有任何資訊時發生","explanation":"遺傳資訊正與發育控制相關。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B035","topicId":"","stem":"觀察幼獸數週後體型增加且逐漸成熟，沒有比較後代。為何「演化適應」不是最直接答案？","correct":"BIO-B01-Ch1.1-B035:C","options":[{"id":"BIO-B01-Ch1.1-B035:A","text":"因為只要生長就永遠不能參與族群繁殖","explanation":"生長與後續繁殖不互相排斥。"},{"id":"BIO-B01-Ch1.1-B035:B","text":"因為演化必須是個體主動想變","explanation":"這正是本節否定的目的論。"},{"id":"BIO-B01-Ch1.1-B035:C","text":"對象仍是同一個體，缺少族群多世代的遺傳特徵變化","explanation":"這更直接是生長發育。"},{"id":"BIO-B01-Ch1.1-B035:D","text":"因為幼獸不是生命","explanation":"幼獸具有生命活動。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B036","topicId":"","stem":"表中甲欄記「高度增加」，乙欄記「不同構造逐步形成」。若描述的是同一株植物，哪個解釋最好？","correct":"BIO-B01-Ch1.1-B036:D","options":[{"id":"BIO-B01-Ch1.1-B036:A","text":"甲乙都一定代表產生了兩個新個體","explanation":"沒有後代資料。"},{"id":"BIO-B01-Ch1.1-B036:B","text":"甲偏調節，乙偏瞬間刺激反應","explanation":"表中沒有內部範圍控制或即時刺激。"},{"id":"BIO-B01-Ch1.1-B036:C","text":"甲乙都與遺傳資訊無關","explanation":"本節指出遺傳資訊影響生長發育模式。"},{"id":"BIO-B01-Ch1.1-B036:D","text":"甲偏生長，乙突出發育，兩者可合看生長與發育","explanation":"題目分辨尺寸與構造形成，而未把兩者完全割裂。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B037","topicId":"","stem":"若要替「幼苗形成根葉」配上具有解釋力的解析，何者最佳？","correct":"BIO-B01-Ch1.1-B037:A","options":[{"id":"BIO-B01-Ch1.1-B037:A","text":"同一個體形成特定構造，屬生長發育，而非只變大","explanation":"解析同時交代對象與發育內涵。"},{"id":"BIO-B01-Ch1.1-B037:B","text":"因為只要出現葉字就永遠選繁殖","explanation":"關鍵詞機械配對沒有看後代條件。"},{"id":"BIO-B01-Ch1.1-B037:C","text":"因為幼苗為了需要立刻改寫全族群遺傳性狀","explanation":"把發育與個體意圖演化混在一起。"},{"id":"BIO-B01-Ch1.1-B037:D","text":"因為生物構造的形成不受任何資訊影響","explanation":"與基因資訊影響發育模式不符。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B038","topicId":"","stem":"甲說「生長發育研究同一個體如何形成與成熟」，乙說「繁殖關注同類後代的形成」。哪項補充合理？","correct":"BIO-B01-Ch1.1-B038:B","options":[{"id":"BIO-B01-Ch1.1-B038:A","text":"兩句都需要先證明有動物式意識","explanation":"意識不是此區辨所需條件。"},{"id":"BIO-B01-Ch1.1-B038:B","text":"兩句可同時成立，活動不同但可出現在同一生命歷程","explanation":"同個體生長與產生後代可先後發生，不是同義詞。"},{"id":"BIO-B01-Ch1.1-B038:C","text":"兩句矛盾，會生長的生命永遠不能繁殖","explanation":"兩種活動不互斥。"},{"id":"BIO-B01-Ch1.1-B038:D","text":"兩句相同，形成任何構造都是下一代","explanation":"器官形成不是後代形成。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B039","topicId":"","stem":"同一幼苗在一段期間出現新構造。若題目只問其最直接生命特徵，哪種答法最謹慎？","correct":"BIO-B01-Ch1.1-B039:C","options":[{"id":"BIO-B01-Ch1.1-B039:A","text":"判作非生命，因為植物不走動","explanation":"錯用位移作生命判準。"},{"id":"BIO-B01-Ch1.1-B039:B","text":"判作意識，因為構造出現證明它有計畫","explanation":"結構形成不直接證明主觀意識。"},{"id":"BIO-B01-Ch1.1-B039:C","text":"判作生長發育，不額外宣稱全族群已演化","explanation":"已有證據是個體形成構造，未給多代族群變化。"},{"id":"BIO-B01-Ch1.1-B039:D","text":"判作繁殖，因為所有新構造都是新個體","explanation":"新構造不等於同類後代。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B040","topicId":"","stem":"為了保留幼苗發育例子的兩個要點，哪句摘要最完整？","correct":"BIO-B01-Ch1.1-B040:D","options":[{"id":"BIO-B01-Ch1.1-B040:A","text":"個體越長越大，所以每次增高都是新世代","explanation":"增高不等於新世代。"},{"id":"BIO-B01-Ch1.1-B040:B","text":"個體根葉形成，所以不再需要生命活動","explanation":"形成構造不終止其他生命活動。"},{"id":"BIO-B01-Ch1.1-B040:C","text":"個體只依願望成熟，因此與資訊無關","explanation":"願望解釋與資訊無關論都不符來源。"},{"id":"BIO-B01-Ch1.1-B040:D","text":"個體形成構造屬生長發育；其模式與基因攜帶的資訊相關","explanation":"同時保留活動分類與遺傳資訊的作用。"}],"concept":"","example":"幼苗形成根、莖、葉，包含分化與構造形成。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B041","topicId":"","stem":"蝴蝶攝取花蜜後，以其中的化學能支持飛行。有人把解析寫成「花蜜使蝴蝶創造新能量」，應怎樣修正？","correct":"BIO-B01-Ch1.1-B041:A","options":[{"id":"BIO-B01-Ch1.1-B041:A","text":"改成取得並轉換食物中已有的能量","explanation":"能量處理不是憑空創造，而是利用來源並轉換。"},{"id":"BIO-B01-Ch1.1-B041:B","text":"保留創造，因為飛行需要能量","explanation":"需要能量不代表能量可從無到有。"},{"id":"BIO-B01-Ch1.1-B041:C","text":"改成飛行完全不需能量","explanation":"與題幹支持飛行的能量角色相反。"},{"id":"BIO-B01-Ch1.1-B041:D","text":"改成花蜜直接就是同類後代","explanation":"食物燃料不是繁殖的後代。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B042","topicId":"","stem":"題幹只給「食物中的化學能經轉換後支持細胞活動」。為何能量處理比繁殖更直接？","correct":"BIO-B01-Ch1.1-B042:B","options":[{"id":"BIO-B01-Ch1.1-B042:A","text":"因為只要有食物就能證明每個個體已繁殖","explanation":"取食不等於已產生後代。"},{"id":"BIO-B01-Ch1.1-B042:B","text":"描述能量來源與利用，沒有描述後代形成","explanation":"依已有線索應選能量處理。"},{"id":"BIO-B01-Ch1.1-B042:C","text":"因為細胞活動永遠與繁殖無關","explanation":"活動可與繁殖有關，但此題沒有後代重點，不能作絕對否定。"},{"id":"BIO-B01-Ch1.1-B042:D","text":"因為能量處理只發生在非生命","explanation":"生命正需要能量處理。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B043","topicId":"","stem":"某導讀箭頭寫「花蜜中的化學能→能量轉換→支持飛行」。哪個說法最能解釋這段關係？","correct":"BIO-B01-Ch1.1-B043:C","options":[{"id":"BIO-B01-Ch1.1-B043:A","text":"飛行之後才憑願望在過去產生花蜜","explanation":"倒置來源與用途，且引入沒有根據的願望。"},{"id":"BIO-B01-Ch1.1-B043:B","text":"三個步驟其實都是後代形成","explanation":"箭頭沒有繁殖事件。"},{"id":"BIO-B01-Ch1.1-B043:C","text":"把已有能量轉成可用形式以支援活動","explanation":"箭頭呈現來源、轉換、用途，沒有創造能量。"},{"id":"BIO-B01-Ch1.1-B043:D","text":"只要有箭頭就代表能量從無到有","explanation":"圖示方向不是能量創造的證明。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B044","topicId":"","stem":"甲說「生物需要能量」，乙說「因此生物能靠需要創造能量」。哪個判讀正確？","correct":"BIO-B01-Ch1.1-B044:D","options":[{"id":"BIO-B01-Ch1.1-B044:A","text":"甲乙都正確，需求本身會增加能量","explanation":"需求不是能量來源。"},{"id":"BIO-B01-Ch1.1-B044:B","text":"甲錯乙對，生物不需來源也能活動","explanation":"生物活動需要可用能量。"},{"id":"BIO-B01-Ch1.1-B044:C","text":"甲乙都錯，生物不涉及能量","explanation":"本節明列能量處理。"},{"id":"BIO-B01-Ch1.1-B044:D","text":"甲符合生命性質，乙把需求錯當創造能力","explanation":"需求意味要取得、轉換能量，不表示能量可憑空產生。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B045","topicId":"","stem":"學生把「蝴蝶取食支持飛行」歸入能量處理，又說「只有飛行才需要能量」。哪部分要修正？","correct":"BIO-B01-Ch1.1-B045:A","options":[{"id":"BIO-B01-Ch1.1-B045:A","text":"配對可保留，但能量也支持其他生命活動","explanation":"來源指出能量用於飛行與其他工作，不限飛行。"},{"id":"BIO-B01-Ch1.1-B045:B","text":"配對錯誤，取食其實只能叫繁殖","explanation":"題幹未談後代，不能改成繁殖。"},{"id":"BIO-B01-Ch1.1-B045:C","text":"限制正確，靜止個體完全不需要能量","explanation":"內部維持與其他細胞活動仍需要能量。"},{"id":"BIO-B01-Ch1.1-B045:D","text":"兩句都應改成能量由個體意識創造","explanation":"意識不是能量創造的理由。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B046","topicId":"","stem":"若某動物外觀看似靜止，是否可只憑這點判定它完全沒有能量需求？","correct":"BIO-B01-Ch1.1-B046:B","options":[{"id":"BIO-B01-Ch1.1-B046:A","text":"不可，因為靜止會直接創造能量","explanation":"結論方向雖否定，理由仍是錯誤能量觀。"},{"id":"BIO-B01-Ch1.1-B046:B","text":"不可，內部維持等生命活動也需要能量","explanation":"能量需求不只來自整體位移。"},{"id":"BIO-B01-Ch1.1-B046:C","text":"可以，能量只供身體走動","explanation":"將能量用途限於位移過於狹窄。"},{"id":"BIO-B01-Ch1.1-B046:D","text":"可以，靜止表示沒有任何細胞活動","explanation":"外表靜止不足以證明內部無活動。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B047","topicId":"","stem":"一個例子同時說明「取得燃料支持活動」與「能量在系統中轉換」。生命性質及五主題應如何配對？","correct":"BIO-B01-Ch1.1-B047:C","options":[{"id":"BIO-B01-Ch1.1-B047:A","text":"回應環境；資訊","explanation":"沒有刺激反應或遺傳訊息焦點。"},{"id":"BIO-B01-Ch1.1-B047:B","text":"演化適應；意識","explanation":"沒有多代適應，意識也非五主題之一。"},{"id":"BIO-B01-Ch1.1-B047:C","text":"能量處理；能量與物質","explanation":"第一個是性質名稱，第二個是主題名稱，焦點相符。"},{"id":"BIO-B01-Ch1.1-B047:D","text":"繁殖；組織","explanation":"沒有後代與結構層級焦點。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B048","topicId":"","stem":"對「取得能量後，生命將其轉換來維持活動」這句話，哪個補充能避免誤解？","correct":"BIO-B01-Ch1.1-B048:D","options":[{"id":"BIO-B01-Ch1.1-B048:A","text":"只要轉換就一定已產生同類後代","explanation":"能量轉換未必代表繁殖事件。"},{"id":"BIO-B01-Ch1.1-B048:B","text":"只要有能量轉換的物體就必定有生命","explanation":"單一能量轉換不是完整生命判準。"},{"id":"BIO-B01-Ch1.1-B048:C","text":"能量在轉換前不可能有任何形式","explanation":"轉換前本來就有來源形式。"},{"id":"BIO-B01-Ch1.1-B048:D","text":"轉換保留能量來源的概念，不等於無中生有","explanation":"能量處理的核心是來源與形式轉換。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B049","topicId":"","stem":"為何本節把花蜜稱作蝴蝶活動的燃料，卻不把花蜜等同於飛行這個動作？","correct":"BIO-B01-Ch1.1-B049:A","options":[{"id":"BIO-B01-Ch1.1-B049:A","text":"花蜜是能量來源，飛行是能量支援的活動","explanation":"分清來源與用途，才能理解能量轉換關係。"},{"id":"BIO-B01-Ch1.1-B049:B","text":"因為燃料與活動兩詞必須完全同義","explanation":"來源與用途並非同一物或同一過程。"},{"id":"BIO-B01-Ch1.1-B049:C","text":"因為只有花蜜有生命，蝴蝶沒有生命","explanation":"不能由燃料角色得出這種生命判斷。"},{"id":"BIO-B01-Ch1.1-B049:D","text":"因為飛行會先創造花蜜中的化學能","explanation":"把利用食物的方向顛倒。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B050","topicId":"","stem":"某題需要一個能量處理的完整解析，下列何者同時保留來源、過程與用途？","correct":"BIO-B01-Ch1.1-B050:B","options":[{"id":"BIO-B01-Ch1.1-B050:A","text":"能量留在食物中不被利用，也同樣已直接支持一切活動","explanation":"題幹需要利用與轉換，不能省成完全未利用。"},{"id":"BIO-B01-Ch1.1-B050:B","text":"由食物取得化學能，經轉換支持飛行及其他活動","explanation":"三項要素都與本節蝴蝶例子相符。"},{"id":"BIO-B01-Ch1.1-B050:C","text":"因為想飛，所以從無到有產生能量","explanation":"需求不能取代來源，創造說法錯。"},{"id":"BIO-B01-Ch1.1-B050:D","text":"只要看到動物，就不必交代能量來源","explanation":"沒有解釋題目的能量關係。"}],"concept":"","example":"蝴蝶取得花蜜中的化學能，經轉換支持飛行。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B051","topicId":"","stem":"假設教學例指定某內部量的可運作範圍為10～14任意單位。控制過程使數值在11、13、12之間變動，哪個判讀最合理？","correct":"BIO-B01-Ch1.1-B051:C","options":[{"id":"BIO-B01-Ch1.1-B051:A","text":"一定已發生族群演化，因為數字改變","explanation":"單個內部量的短期變動不能直接當族群演化。"},{"id":"BIO-B01-Ch1.1-B051:B","text":"這些數字證明個體已產生三代後代","explanation":"三筆數值不是世代或後代數。"},{"id":"BIO-B01-Ch1.1-B051:C","text":"可與調節相容，因為仍維持在指定範圍","explanation":"調節不要求數值完全相同；此為假設範圍判讀，不是物種生理常數。"},{"id":"BIO-B01-Ch1.1-B051:D","text":"一定沒有調節，因為三次數值不相同","explanation":"錯把零變動當必要條件。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B052","topicId":"","stem":"野兔因環境變熱而調整耳部血流。若學生說「調節應該不准血流改變」，錯在哪裡？","correct":"BIO-B01-Ch1.1-B052:D","options":[{"id":"BIO-B01-Ch1.1-B052:A","text":"因為調節只能靠產生後代","explanation":"繁殖不是此處體溫控制的手段。"},{"id":"BIO-B01-Ch1.1-B052:B","text":"因為調節要求所有內部條件任意失控","explanation":"失控不符合調節目標。"},{"id":"BIO-B01-Ch1.1-B052:C","text":"因為耳部血流與散熱的描述其實是多代族群資料","explanation":"這是個體當下調整，未提供多代資料。"},{"id":"BIO-B01-Ch1.1-B052:D","text":"把調整手段的變動誤當調節失敗","explanation":"血流可改變以調整熱交換，協助維持體溫範圍。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B053","topicId":"","stem":"甲說「內部完全不變才叫調節」，乙說「內部變動受到控制、維持可運作範圍」。誰較符合本節？","correct":"BIO-B01-Ch1.1-B053:A","options":[{"id":"BIO-B01-Ch1.1-B053:A","text":"乙，因為調節容許受控變動","explanation":"可運作範圍而非絕對固定值是此處重點。"},{"id":"BIO-B01-Ch1.1-B053:B","text":"甲，因為任何細微變動都等於非生命","explanation":"小幅變動不否定生命。"},{"id":"BIO-B01-Ch1.1-B053:C","text":"甲，因為調節與控制完全無關","explanation":"調節正涉及控制。"},{"id":"BIO-B01-Ch1.1-B053:D","text":"乙，因為內部越失控越能證明調節","explanation":"乙正確但此理由與調節定義相反。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B054","topicId":"","stem":"一個體在今日調整散熱，另一紀錄描述保護特徵在族群多代累積。為何前者不宜直接稱演化適應？","correct":"BIO-B01-Ch1.1-B054:B","options":[{"id":"BIO-B01-Ch1.1-B054:A","text":"因為演化適應不需要遺傳或世代","explanation":"這否定了本節適應的關鍵條件。"},{"id":"BIO-B01-Ch1.1-B054:B","text":"前者是當下內部條件控制，缺多代遺傳特徵改變","explanation":"時間與對象更適合調節。"},{"id":"BIO-B01-Ch1.1-B054:C","text":"因為前者沒有生命","explanation":"個體散熱控制是生命相關現象。"},{"id":"BIO-B01-Ch1.1-B054:D","text":"因為所有調節都會立刻創造後代","explanation":"調節不等於繁殖。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B055","topicId":"","stem":"某內部條件在觀察期間偏離可運作範圍，而且一直未回到範圍內。哪一項解讀最合理？","correct":"BIO-B01-Ch1.1-B055:C","options":[{"id":"BIO-B01-Ch1.1-B055:A","text":"不能說這是內部條件","explanation":"題幹已指定內部條件。"},{"id":"BIO-B01-Ch1.1-B055:B","text":"不能說它曾在觀察期間持續偏離","explanation":"題幹本來就是持續偏離的資料。"},{"id":"BIO-B01-Ch1.1-B055:C","text":"不能僅憑有變化就說已成功維持可運作範圍","explanation":"變化本身不等於成功控制，需看是否達到範圍維持。"},{"id":"BIO-B01-Ch1.1-B055:D","text":"不能說數值曾經變化","explanation":"題幹已明示有偏離，並非不能說變化。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-B056","topicId":"","stem":"一份報告把「調節成功」寫成「所有內部條件永遠不動」。哪個替代句最好？","correct":"BIO-B01-Ch1.1-B056:D","options":[{"id":"BIO-B01-Ch1.1-B056:A","text":"內部條件完全服從外界、可以任意超出範圍","explanation":"任意超出範圍不代表成功調節。"},{"id":"BIO-B01-Ch1.1-B056:B","text":"只要觀察到產生後代就不必看內部條件","explanation":"繁殖不能代替調節證據。"},{"id":"BIO-B01-Ch1.1-B056:C","text":"只要個體體型更大就表示每項調節都成功","explanation":"體型增大不保證全部內部控制成功。"},{"id":"BIO-B01-Ch1.1-B056:D","text":"內部條件的變動受到控制，維持在可運作範圍","explanation":"保留控制與範圍，不要求每個量毫無變化。"}],"concept":"","example":"野兔調整耳部血流與散熱，協助維持體溫。","source":"Campbell Biology 12e｜Ch1 Concept 1.1導
