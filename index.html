合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：題目已確認mRNA產生，阻斷點指定在依mRNA形成胺基酸鏈，因此定位轉譯。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B033","topicId":"BIO-Ch1.1.2-T04","stem":"某實驗系統只抑制新的mRNA合成，而原有mRNA短時間仍能使用。哪個說法最合理？","correct":"BIO-B01-Ch1.1.2-B033:A","options":[{"id":"BIO-B01-Ch1.1.2-B033:A","text":"新轉錄受抑制，但原有mRNA仍可能支持短時間轉譯","explanation":"符合題設的舊mRNA仍可用條件。"},{"id":"BIO-B01-Ch1.1.2-B033:B","text":"所有舊mRNA立刻變成DNA","explanation":"mRNA不會因轉錄受抑制而自動變DNA。"},{"id":"BIO-B01-Ch1.1.2-B033:C","text":"新轉錄與所有轉譯必在同一瞬間完全停止","explanation":"忽略原有mRNA仍可使用的時間條件。"},{"id":"BIO-B01-Ch1.1.2-B033:D","text":"所有DNA必立即消失","explanation":"抑制新mRNA不等於摧毀DNA。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：轉錄與轉譯不同；題設保留原有可用mRNA，故不能由新RNA受阻推所有蛋白質合成立刻歸零。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B034","topicId":"BIO-Ch1.1.2-T04","stem":"已知細胞完成某蛋白質編碼基因的轉錄。僅憑此結果，能否保證已有具功能的蛋白質？","correct":"BIO-B01-Ch1.1.2-B034:C","options":[{"id":"BIO-B01-Ch1.1.2-B034:A","text":"能，轉錄直接產生完整蛋白質","explanation":"直接產物是RNA，不是完整蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B034:B","text":"能，mRNA與蛋白質是同一分子","explanation":"mRNA由核苷酸組成，蛋白質由胺基酸組成。"},{"id":"BIO-B01-Ch1.1.2-B034:C","text":"不能，尚需轉譯及適當折疊等步驟","explanation":"指出從RNA到功能蛋白質尚有必要步驟。"},{"id":"BIO-B01-Ch1.1.2-B034:D","text":"不能，因基因資訊永遠無法形成蛋白質","explanation":"不能保證與永遠不能不同；正常表現可形成蛋白質。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：轉錄只保證已產RNA；若要蛋白質功能，還要合成胺基酸鏈並形成適當構形。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B035","topicId":"BIO-Ch1.1.2-T04","stem":"用文字表示一個蛋白質編碼基因的表現：①胺基酸鏈折疊；②以DNA合成mRNA；③依mRNA合成胺基酸鏈。正常順序為何？","correct":"BIO-B01-Ch1.1.2-B035:B","options":[{"id":"BIO-B01-Ch1.1.2-B035:A","text":"①②③","explanation":"沒有胺基酸鏈時不能先完成其折疊。"},{"id":"BIO-B01-Ch1.1.2-B035:B","text":"②③①","explanation":"三步依轉錄、轉譯、折疊順序連接。"},{"id":"BIO-B01-Ch1.1.2-B035:C","text":"③①②","explanation":"轉譯放在相應mRNA形成前，流程順序不符。"},{"id":"BIO-B01-Ch1.1.2-B035:D","text":"②①③","explanation":"①需要③的鏈，不能排在③之前。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：先有mRNA資訊，才合成鏈；形成鏈後才談其折疊，故②③①。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B036","topicId":"BIO-Ch1.1.2-T04","stem":"一段教學動畫讓同一條DNA逐漸消失，原位置出現mRNA，再讓mRNA消失變為胺基酸鏈。若用於一般基因表現，哪項修正最必要？","correct":"BIO-B01-Ch1.1.2-B036:D","options":[{"id":"BIO-B01-Ch1.1.2-B036:A","text":"把DNA改標為染色體套數","explanation":"套數不是DNA分子的替代標籤，無法修正因果。"},{"id":"BIO-B01-Ch1.1.2-B036:B","text":"只調整三種分子的顏色","explanation":"換色不會消除分子互變的錯誤訊息。"},{"id":"BIO-B01-Ch1.1.2-B036:C","text":"刪掉mRNA中介","explanation":"刪除中介會破壞蛋白質編碼基因的一般流程。"},{"id":"BIO-B01-Ch1.1.2-B036:D","text":"改用箭頭表示資訊利用，並區分各自合成的分子","explanation":"清楚區分資訊與物質，才能正確表達兩步合成。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：動畫把資訊流程畫成分子材料互變；應表示DNA作模板及mRNA作資訊依據，產物另行合成。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B037","topicId":"BIO-Ch1.1.2-T04","stem":"某蛋白質編碼基因的DNA、mRNA與胺基酸鏈均已檢出。下列哪個配對錯誤？","correct":"BIO-B01-Ch1.1.2-B037:C","options":[{"id":"BIO-B01-Ch1.1.2-B037:A","text":"DNA—資訊來源","explanation":"DNA可提供此基因表現的序列資訊，配對正確。"},{"id":"BIO-B01-Ch1.1.2-B037:B","text":"mRNA—轉錄產物","explanation":"mRNA由轉錄形成，配對正確。"},{"id":"BIO-B01-Ch1.1.2-B037:C","text":"胺基酸鏈—DNA複製的直接產物","explanation":"複製產物應為DNA拷貝，故這項錯誤。"},{"id":"BIO-B01-Ch1.1.2-B037:D","text":"胺基酸鏈—轉譯產物","explanation":"轉譯形成胺基酸鏈，配對正確。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：題目問錯誤配對；DNA複製直接產DNA，而非胺基酸鏈。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B038","topicId":"BIO-Ch1.1.2-T04","stem":"某細胞依同一段DNA資訊先後合成多份mRNA。這項觀察最能支持哪個理解？","correct":"BIO-B01-Ch1.1.2-B038:A","options":[{"id":"BIO-B01-Ch1.1.2-B038:A","text":"DNA可作為可重複使用的資訊模板","explanation":"重複合成符合DNA保有模板資訊。"},{"id":"BIO-B01-Ch1.1.2-B038:B","text":"每做一份mRNA就必須耗掉一整個基因","explanation":"題目同一段資訊被反覆使用，不需每次耗掉基因。"},{"id":"BIO-B01-Ch1.1.2-B038:C","text":"mRNA是從DNA剪下的原片段","explanation":"RNA是依模板合成，不是DNA原片段剪下改名。"},{"id":"BIO-B01-Ch1.1.2-B038:D","text":"多份mRNA表示每份都用不同遺傳密碼","explanation":"拷貝數增加不表示解讀規則改變。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：同一資訊模板可用於多次合成，與DNA本身變成RNA的想像不同。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B039","topicId":"BIO-Ch1.1.2-T04","stem":"某人說「DNA→mRNA→蛋白質中的每個箭頭都稱為轉譯」。何者是正確修正？","correct":"BIO-B01-Ch1.1.2-B039:B","options":[{"id":"BIO-B01-Ch1.1.2-B039:A","text":"兩箭頭都稱DNA複製","explanation":"兩箭頭均不是DNA拷貝形成。"},{"id":"BIO-B01-Ch1.1.2-B039:B","text":"第一箭頭轉錄，第二箭頭轉譯","explanation":"正確區分轉錄和轉譯。"},{"id":"BIO-B01-Ch1.1.2-B039:C","text":"第一箭頭折疊，第二箭頭受精","explanation":"兩箭頭都不是這兩種過程。"},{"id":"BIO-B01-Ch1.1.2-B039:D","text":"第一箭頭轉譯，第二箭頭轉錄","explanation":"把先後名稱顛倒了。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：DNA到mRNA屬RNA合成，mRNA資訊到胺基酸鏈屬轉譯，兩者產物類別不同。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B040","topicId":"BIO-Ch1.1.2-T04","stem":"在簡化系統中，某蛋白質的DNA資訊和mRNA都正常，胺基酸鏈也已合成，但鏈無法形成所需功能構造。最直接應查哪個環節？","correct":"BIO-B01-Ch1.1.2-B040:D","options":[{"id":"BIO-B01-Ch1.1.2-B040:A","text":"精卵融合","explanation":"沒有涉及生殖的觀察。"},{"id":"BIO-B01-Ch1.1.2-B040:B","text":"DNA傳到子代","explanation":"題目不是資訊跨世代傳遞失敗。"},{"id":"BIO-B01-Ch1.1.2-B040:C","text":"DNA是否由四種字母構成","explanation":"已知DNA正常，構件總類不是此處最直接缺口。"},{"id":"BIO-B01-Ch1.1.2-B040:D","text":"蛋白質折疊及功能構形","explanation":"此階段正好對應題設的功能構造障礙。"}],"concept":"基因表現是細胞依基因資訊製造產物。以蛋白質編碼基因為例：先以DNA為模板合成mRNA，稱為轉錄；再依mRNA資訊把胺基酸連成鏈，稱為轉譯；鏈經適當折疊形成蛋白質的功能構造。DNA→mRNA→蛋白質表示資訊流程，不表示DNA被消耗變成RNA，也不表示RNA的核苷酸被改造成胺基酸。判題時應分清各步驟的資訊依據和直接產物。\n本題判斷：題目已排除資訊及鏈合成階段，故直接定位在從鏈到功能構形的步驟。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第7、8、15張（正文第5、6、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B041","topicId":"BIO-Ch1.1.2-T05","stem":"題設兩組細胞產生相同數量的某蛋白質；甲組蛋白質構形正常且有功能，乙組構形異常且無功能。何者最受支持？","correct":"BIO-B01-Ch1.1.2-B041:C","options":[{"id":"BIO-B01-Ch1.1.2-B041:A","text":"數量相同必保證功能相同","explanation":"乙組無功能已反駁此必然說法。"},{"id":"BIO-B01-Ch1.1.2-B041:B","text":"乙組必定完全沒有DNA","explanation":"蛋白構形異常不等於DNA全失。"},{"id":"BIO-B01-Ch1.1.2-B041:C","text":"功能判讀也需考慮蛋白質構形","explanation":"構形是連結蛋白質與功能的重要面向。"},{"id":"BIO-B01-Ch1.1.2-B041:D","text":"乙組蛋白質一定不是胺基酸組成","explanation":"失去功能不會自動改變其胺基酸鏈身分。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：題目給定數量相同的情況下仍有構形與功能差異，顯示不能只憑數量推定功能。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B042","topicId":"BIO-Ch1.1.2-T05","stem":"某水晶體細胞有crystallin基因，卻尚未完成相應蛋白質的合成。最合理的判斷為何？","correct":"BIO-B01-Ch1.1.2-B042:B","options":[{"id":"BIO-B01-Ch1.1.2-B042:A","text":"只要有基因，完整透明蛋白質就必已存在","explanation":"存在資訊不代表產物已製成。"},{"id":"BIO-B01-Ch1.1.2-B042:B","text":"有資訊仍需經表現形成蛋白質產物","explanation":"此句區分資訊保存與功能產物形成。"},{"id":"BIO-B01-Ch1.1.2-B042:C","text":"DNA本身即可直接取代全部crystallin","explanation":"DNA的資訊角色不能當成透明蛋白質的直接替身。"},{"id":"BIO-B01-Ch1.1.2-B042:D","text":"基因必須先離開染色體才有資訊","explanation":"基因位於DNA上即可提供資訊，不需先脫離染色體。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：基因存在只代表資訊可被使用；蛋白質形成仍有轉錄、轉譯及折疊等過程。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B043","topicId":"BIO-Ch1.1.2-T05","stem":"研究者發現一條胺基酸鏈已合成，但其形狀與功能性蛋白質不同。哪項敘述最適當？","correct":"BIO-B01-Ch1.1.2-B043:D","options":[{"id":"BIO-B01-Ch1.1.2-B043:A","text":"轉錄必然直接產生這條鏈","explanation":"直接合成胺基酸鏈的是轉譯，不是轉錄。"},{"id":"BIO-B01-Ch1.1.2-B043:B","text":"此鏈已等同全部基因體","explanation":"胺基酸鏈不是整套DNA資訊。"},{"id":"BIO-B01-Ch1.1.2-B043:C","text":"鏈只要存在就保證功能正常","explanation":"題面指出形狀不同，不能保證正常功能。"},{"id":"BIO-B01-Ch1.1.2-B043:D","text":"需確認是否形成正確功能構形","explanation":"這項確認直接回應構形與功能的關係。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：有鏈和有正常功能是不同證據；題目提示應進一步查構形。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B044","topicId":"BIO-Ch1.1.2-T05","stem":"甲是crystallin基因，乙是其mRNA，丙是crystallin蛋白質。若問「可在水晶體中協助聚焦光線的功能分子」，應選哪個？","correct":"BIO-B01-Ch1.1.2-B044:A","options":[{"id":"BIO-B01-Ch1.1.2-B044:A","text":"丙","explanation":"丙是可執行題設功能的蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B044:B","text":"甲","explanation":"甲提供合成資訊，並非此光學功能的蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B044:C","text":"乙","explanation":"乙傳達合成資訊，不是crystallin成品。"},{"id":"BIO-B01-Ch1.1.2-B044:D","text":"甲乙丙都只是完整染色體","explanation":"三者不是完整染色體，類別也不同。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：三者位於同一資訊主線，但光學功能由適當形成及排列的crystallin蛋白質執行。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B045","topicId":"BIO-Ch1.1.2-T05","stem":"某蛋白質編碼基因表現後可形成酵素。這個例子主要連結哪兩個層面？","correct":"BIO-B01-Ch1.1.2-B045:C","options":[{"id":"BIO-B01-Ch1.1.2-B045:A","text":"DNA複製與RNA直接變成蛋白質","explanation":"蛋白質合成不是DNA複製，也不是RNA材料直接變成蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B045:B","text":"DNA套數與所有細胞完全同功能","explanation":"表現流程不表示DNA套數決定所有細胞具有相同功能。"},{"id":"BIO-B01-Ch1.1.2-B045:C","text":"遺傳資訊與細胞活動的功能分子","explanation":"DNA資訊經表現產生可參與細胞活動的蛋白質，連接資訊與功能。"},{"id":"BIO-B01-Ch1.1.2-B045:D","text":"基因的位置與基因必須離開DNA","explanation":"基因作為DNA上的資訊區段，可被轉錄而不必離開DNA。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：酵素是功能蛋白質，可把基因資訊和細胞反應連起來；不需深入特定催化機制。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B046","topicId":"BIO-Ch1.1.2-T05","stem":"某同學說「蛋白質具有功能，所以蛋白質就是DNA上那段基因」。這句話如何修正？","correct":"BIO-B01-Ch1.1.2-B046:B","options":[{"id":"BIO-B01-Ch1.1.2-B046:A","text":"有功能的分子全部都叫染色體","explanation":"染色體是特定結構，不涵蓋所有功能分子。"},{"id":"BIO-B01-Ch1.1.2-B046:B","text":"基因是DNA資訊片段，蛋白質可為其表現產物","explanation":"此句保留基因身分及蛋白質產物的關係。"},{"id":"BIO-B01-Ch1.1.2-B046:C","text":"DNA必須先變成胺基酸才算基因","explanation":"基因本身是DNA片段，不是變成胺基酸後才成立。"},{"id":"BIO-B01-Ch1.1.2-B046:D","text":"蛋白質只能存在於配子","explanation":"許多細胞都有蛋白質，不限於配子。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：基因與產物不能因功能相關就合併成同一分子；兩者透過表現流程連結。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B047","topicId":"BIO-Ch1.1.2-T05","stem":"題設某細胞DNA與mRNA均正常，蛋白質的胺基酸鏈也完整，但功能降低。僅憑這些資料，哪個追問最直接？","correct":"BIO-B01-Ch1.1.2-B047:D","options":[{"id":"BIO-B01-Ch1.1.2-B047:A","text":"是否仍須先轉錄出同一mRNA","explanation":"題目已給定正常mRNA，不宜把缺乏轉錄當作尚待補足的步驟。"},{"id":"BIO-B01-Ch1.1.2-B047:B","text":"胺基酸鏈是否尚未開始合成","explanation":"題目已給定完整胺基酸鏈，不能判斷合成尚未開始。"},{"id":"BIO-B01-Ch1.1.2-B047:C","text":"是否尚未取得該蛋白的DNA資訊","explanation":"題目已給定正常DNA資訊，不能把未取得資訊當成目前缺口。"},{"id":"BIO-B01-Ch1.1.2-B047:D","text":"蛋白質是否形成及維持所需構形","explanation":"即使鏈已合成，仍須有適當構形才能發揮功能，值得進一步檢查。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：在資訊及鏈合成均正常的條件下，功能構形是仍需核對的重要環節；這是追問，不是已證實病因。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B048","topicId":"BIO-Ch1.1.2-T05","stem":"兩種細胞的DNA序列相同，卻在同一時間製造不同蛋白質集合。能否只憑蛋白質差異推定兩者DNA必不同？","correct":"BIO-B01-Ch1.1.2-B048:A","options":[{"id":"BIO-B01-Ch1.1.2-B048:A","text":"不能，基因表現方式可不同","explanation":"此說法保留資訊與表現的區別。"},{"id":"BIO-B01-Ch1.1.2-B048:B","text":"能，蛋白質差異只可能來自DNA差異","explanation":"將差異來源限縮為DNA，不符合題設。"},{"id":"BIO-B01-Ch1.1.2-B048:C","text":"能，每種蛋白質都等於一套染色體","explanation":"蛋白質不是染色體套數的計量單位。"},{"id":"BIO-B01-Ch1.1.2-B048:D","text":"不能，因蛋白質與基因完全無關","explanation":"蛋白質可由基因資訊指導合成，並非完全無關。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：DNA保存資訊，蛋白質集合反映當下使用資訊的結果；表現差異可使同DNA產生不同集合。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8、9 頁（PDF 56、57、58 頁）｜本節筆記 正式第7、12、13、14張（正文第5、10、11、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B049","topicId":"BIO-Ch1.1.2-T05","stem":"題設某蛋白質只有在形成形狀X後才有功能。已知合成了鏈Y，但未測其形狀。哪個結論最合理？","correct":"BIO-B01-Ch1.1.2-B049:C","options":[{"id":"BIO-B01-Ch1.1.2-B049:A","text":"Y必定已具有形狀X","explanation":"未測構形，不能直接斷言已符合條件。"},{"id":"BIO-B01-Ch1.1.2-B049:B","text":"Y一定永遠無法發揮功能","explanation":"資料不足以否定未來形成X的可能。"},{"id":"BIO-B01-Ch1.1.2-B049:C","text":"須確認Y是否形成X，才能判斷這項功能條件","explanation":"依必要條件判斷，需補充構形證據。"},{"id":"BIO-B01-Ch1.1.2-B049:D","text":"只需知道該基因是否存在便可判斷","explanation":"基因存在不等於蛋白質一定形成適當構形，仍須檢查產物與功能。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：題設把X列為必要條件，未測形狀時既不能保證有功能，也不能保證永遠無功能。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B050","topicId":"BIO-Ch1.1.2-T05","stem":"一份說明寫「基因提供crystallin資訊，因此DNA必須在水晶體中折疊成crystallin」。錯誤主要在哪裡？","correct":"BIO-B01-Ch1.1.2-B050:B","options":[{"id":"BIO-B01-Ch1.1.2-B050:A","text":"crystallin不是蛋白質","explanation":"crystallin確實是水晶體蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B050:B","text":"將資訊來源誤當成折疊的胺基酸鏈","explanation":"指出DNA和胺基酸鏈的對象錯置。"},{"id":"BIO-B01-Ch1.1.2-B050:C","text":"基因無法參與產物形成","explanation":"基因資訊可透過表現指導產物形成。"},{"id":"BIO-B01-Ch1.1.2-B050:D","text":"mRNA就是已折疊crystallin","explanation":"mRNA是資訊中介，不是已折疊蛋白質。"}],"concept":"許多基因的資訊經mRNA中介用來合成胺基酸鏈。胺基酸鏈形成適當構形後，蛋白質才具有相應的功能；蛋白質可參與建構細胞、維持細胞或執行細胞活動。水晶體中的crystallin是透明蛋白質，適當排列可協助折射與聚焦光線。基因是資訊片段，蛋白質是功能分子；有DNA或有蛋白質的數量資料，都不能單獨保證蛋白質已正常發揮功能。\n本題判斷：折疊成crystallin的是轉譯後的胺基酸鏈，DNA只提供其合成資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第7、8張（正文第5、6頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B051","topicId":"BIO-Ch1.1.2-T06","stem":"基因甲產生mRNA供轉譯；基因乙產生RNA，直接參與調節而不被轉譯。哪個結論正確？","correct":"BIO-B01-Ch1.1.2-B051:D","options":[{"id":"BIO-B01-Ch1.1.2-B051:A","text":"只有甲發生基因表現","explanation":"乙的功能性RNA形成也屬表現。"},{"id":"BIO-B01-Ch1.1.2-B051:B","text":"只有乙發生基因表現","explanation":"甲的蛋白質編碼流程同樣屬表現。"},{"id":"BIO-B01-Ch1.1.2-B051:C","text":"兩者都未發生基因表現","explanation":"兩個基因皆已讀出資訊並產RNA。"},{"id":"BIO-B01-Ch1.1.2-B051:D","text":"兩者都發生基因表現，但RNA角色不同","explanation":"此句同時保留表現共通性與RNA角色差異。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：甲RNA作資訊中介，乙RNA直接作功能產物；兩者都由基因資訊產生。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B052","topicId":"BIO-Ch1.1.2-T06","stem":"某研究只檢測蛋白質，未檢測RNA。若某基因的功能產物只是一種RNA，能否由「沒找到相應蛋白質」認定該基因完全未表現？","correct":"BIO-B01-Ch1.1.2-B052:B","options":[{"id":"BIO-B01-Ch1.1.2-B052:A","text":"能，蛋白質是所有基因唯一產物","explanation":"有些基因不以蛋白質為功能產物。"},{"id":"BIO-B01-Ch1.1.2-B052:B","text":"不能，RNA產物可能未被此檢測涵蓋","explanation":"指出方法涵蓋範圍與欲判斷對象不一致。"},{"id":"BIO-B01-Ch1.1.2-B052:C","text":"能，RNA不能由基因產生","explanation":"RNA也可由基因資訊指導合成。"},{"id":"BIO-B01-Ch1.1.2-B052:D","text":"不能，因所有基因一定持續大量表現","explanation":"不能由此斷言所有基因必然大量表現。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：檢測標的不包含此基因的功能性RNA，因此陰性蛋白結果不能否定該RNA的產生。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B053","topicId":"BIO-Ch1.1.2-T06","stem":"觀察某RNA加入蛋白質製造機器，學生據此推論「此RNA一定會被轉譯」。這項推論是否成立？","correct":"BIO-B01-Ch1.1.2-B053:C","options":[{"id":"BIO-B01-Ch1.1.2-B053:A","text":"成立，凡參與機器者都是其產物","explanation":"把製造工具與製造產物混為一談。"},{"id":"BIO-B01-Ch1.1.2-B053:B","text":"成立，RNA和蛋白質是同物質","explanation":"RNA由核苷酸組成，蛋白質由胺基酸組成。"},{"id":"BIO-B01-Ch1.1.2-B053:C","text":"不成立，RNA可作機器組件而不被轉譯","explanation":"正確區分組件角色和mRNA中介角色。"},{"id":"BIO-B01-Ch1.1.2-B053:D","text":"不成立，因RNA不能參與蛋白質製造","explanation":"RNA確實可以參與，錯不在是否參與。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：機器組件不等於被讀取的資訊模板；參與製造不足以推出RNA自身被轉譯。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B054","topicId":"BIO-Ch1.1.2-T06","stem":"題設基因X被讀出後形成RNA-R，RNA-R直接降低另一基因的產物量。哪項描述最恰當？","correct":"BIO-B01-Ch1.1.2-B054:A","options":[{"id":"BIO-B01-Ch1.1.2-B054:A","text":"RNA-R可作基因調節的功能產物","explanation":"符合基因資訊形成調節RNA的主線。"},{"id":"BIO-B01-Ch1.1.2-B054:B","text":"RNA-R必定是另一條染色體","explanation":"RNA分子不能等同染色體結構。"},{"id":"BIO-B01-Ch1.1.2-B054:C","text":"X因未製成蛋白質而不能算基因","explanation":"基因可指導功能性RNA形成，不限於蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B054:D","text":"RNA-R必須變成DNA才能調節","explanation":"題設沒有DNA轉換步驟，也不需要此假設。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：題面已給定RNA直接作用，屬功能性RNA的調節角色；此處不需假設特定小RNA機制。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B055","topicId":"BIO-Ch1.1.2-T06","stem":"甲mRNA提供胺基酸鏈的序列資訊；乙RNA作為細胞機器的一部分。兩者共同點為何？","correct":"BIO-B01-Ch1.1.2-B055:D","options":[{"id":"BIO-B01-Ch1.1.2-B055:A","text":"都是已折疊的蛋白質","explanation":"兩者都是RNA，非胺基酸鏈。"},{"id":"BIO-B01-Ch1.1.2-B055:B","text":"都必須自行合成完整染色體","explanation":"RNA不以自行合成完整染色體為共同角色。"},{"id":"BIO-B01-Ch1.1.2-B055:C","text":"都只負責世代傳遞","explanation":"其描述都是細胞內資訊使用或功能，不只世代傳遞。"},{"id":"BIO-B01-Ch1.1.2-B055:D","text":"都可由基因資訊指導形成","explanation":"基因資訊可以指導兩者形成。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：兩種RNA角色不同，但都可以是基因被轉錄後產生的RNA分子。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B056","topicId":"BIO-Ch1.1.2-T06","stem":"一份表格將基因分成「蛋白質編碼」及「以RNA為功能產物」兩類。哪項理由最能支持此區分？","correct":"BIO-B01-Ch1.1.2-B056:B","options":[{"id":"BIO-B01-Ch1.1.2-B056:A","text":"第二類沒有DNA資訊","explanation":"第二類也由DNA上的基因資訊指導。"},{"id":"BIO-B01-Ch1.1.2-B056:B","text":"不同基因的最終功能產物類別可不同","explanation":"功能產物可以是蛋白質或RNA，分類有意義。"},{"id":"BIO-B01-Ch1.1.2-B056:C","text":"第一類不需要RNA參與","explanation":"蛋白質編碼基因通常需要mRNA中介。"},{"id":"BIO-B01-Ch1.1.2-B056:D","text":"第二類不屬任何生命活動","explanation":"功能性RNA可參與重要生命活動。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：區分依據是RNA是否本身作功能產物；蛋白質編碼基因仍通常經mRNA中介。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B057","topicId":"BIO-Ch1.1.2-T06","stem":"題設某RNA能調節另一基因，且沒有相應的蛋白質產物。這會直接反駁哪個命題？","correct":"BIO-B01-Ch1.1.2-B057:C","options":[{"id":"BIO-B01-Ch1.1.2-B057:A","text":"某些RNA有調節功能","explanation":"題設支持此說法，非反駁。"},{"id":"BIO-B01-Ch1.1.2-B057:B","text":"基因資訊可被細胞使用","explanation":"產生功能性RNA正是資訊被使用。"},{"id":"BIO-B01-Ch1.1.2-B057:C","text":"所有基因表現都必須形成蛋白質","explanation":"此全稱命題被RNA功能產物的反例否定。"},{"id":"BIO-B01-Ch1.1.2-B057:D","text":"mRNA可作蛋白質合成中介","explanation":"題目不否定mRNA的中介角色。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：出現不以蛋白質為產物的表現例子，就足以否定「所有」的絕對說法。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B058","topicId":"BIO-Ch1.1.2-T06","stem":"研究者把「基因表現完成」當成「每一種RNA均已變成蛋白質」。最佳修正為何？","correct":"BIO-B01-Ch1.1.2-B058:A","options":[{"id":"BIO-B01-Ch1.1.2-B058:A","text":"RNA可本身發揮功能；轉譯是利用mRNA資訊合成胺基酸鏈","explanation":"兩個關鍵概念都獲正確澄清。"},{"id":"BIO-B01-Ch1.1.2-B058:B","text":"只把RNA一詞全部改為DNA","explanation":"改名不能修正分子互變及角色一律化的錯誤。"},{"id":"BIO-B01-Ch1.1.2-B058:C","text":"保留原句，因所有RNA功能相同","explanation":"RNA可有中介、機器組件與調節等角色。"},{"id":"BIO-B01-Ch1.1.2-B058:D","text":"補充所有RNA都等於基因體","explanation":"單一RNA不等於整套DNA資訊。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：修正同時處理兩個錯誤：RNA角色不一，且資訊利用不等於RNA分子變成蛋白質。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B059","topicId":"BIO-Ch1.1.2-T06","stem":"甲實驗測DNA拷貝，乙實驗測某基因新產生的功能性RNA。哪一項對兩者的判讀較準確？","correct":"BIO-B01-Ch1.1.2-B059:D","options":[{"id":"BIO-B01-Ch1.1.2-B059:A","text":"甲乙都只能證明蛋白質合成","explanation":"兩者都未直接測蛋白質合成。"},{"id":"BIO-B01-Ch1.1.2-B059:B","text":"甲乙都只能證明精卵受精","explanation":"兩個測量不限定於受精。"},{"id":"BIO-B01-Ch1.1.2-B059:C","text":"乙一定沒有發生基因表現","explanation":"功能性RNA產生也屬基因表現。"},{"id":"BIO-B01-Ch1.1.2-B059:D","text":"甲偏向資訊拷貝，乙可提供基因表現證據","explanation":"此判讀符合兩類分子和過程。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：測量對象不同：DNA拷貝關乎資訊複製，功能性RNA新產生則關乎基因資訊的使用。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B060","topicId":"BIO-Ch1.1.2-T06","stem":"某資料列出RNA-P「提供蛋白質序列資訊」、RNA-Q「直接參與機器運作」、RNA-R「調節其他基因」。何者是合理統整？","correct":"BIO-B01-Ch1.1.2-B060:B","options":[{"id":"BIO-B01-Ch1.1.2-B060:A","text":"三者都必是不同物種的DNA","explanation":"三者是RNA，未提供不同物種DNA的證據。"},{"id":"BIO-B01-Ch1.1.2-B060:B","text":"RNA有多種功能，不能一概視為待轉譯的mRNA","explanation":"此統整保留中介、機器組件與調節的差異。"},{"id":"BIO-B01-Ch1.1.2-B060:C","text":"只有P可能與基因表現有關","explanation":"Q、R的產生也可由基因資訊指導。"},{"id":"BIO-B01-Ch1.1.2-B060:D","text":"Q、R因無蛋白質產物必毫無作用","explanation":"無蛋白質產物不妨礙RNA自身具有功能。"}],"concept":"基因表現不只產生蛋白質。有些基因經轉錄產生RNA，RNA本身就是功能產物，例如作為蛋白質製造機器的一部分，或調節其他基因的表現。mRNA則主要把序列資訊提供給轉譯，讓細胞合成胺基酸鏈。RNA參與蛋白質製造，不表示該RNA自己就是蛋白質，或每種RNA都必須被轉譯。應依RNA的實際角色判斷。\n本題判斷：題面明示三種角色，只有P符合資訊中介的描述；Q、R可本身發揮功能。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第9、15張（正文第7、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B061","topicId":"BIO-Ch1.1.2-T07","stem":"研究者發現甲、乙生物使用大致相同的遺傳密碼，但蛋白質種類不同。下列何者能合理解釋？","correct":"BIO-B01-Ch1.1.2-B061:C","options":[{"id":"BIO-B01-Ch1.1.2-B061:A","text":"它們不可能都是生物","explanation":"蛋白質差異是生命多樣性的正常現象。"},{"id":"BIO-B01-Ch1.1.2-B061:B","text":"至少一者必定沒有基因","explanation":"不同產物不意味缺少基因。"},{"id":"BIO-B01-Ch1.1.2-B061:C","text":"共同規則可解讀不同序列，表現產物因而可不同","explanation":"保留規則共通和內容多樣性，可解釋觀察。"},{"id":"BIO-B01-Ch1.1.2-B061:D","text":"相同規則會禁止蛋白質差異","explanation":"共用規則沒有要求產物完全相同。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：不同DNA序列和表現方式可在相同解讀規則下產生不同蛋白質集合。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B062","topicId":"BIO-Ch1.1.2-T07","stem":"某同學以「甲乙共用遺傳密碼」為由，推定「甲乙屬同一物種」。這個推論為何不足？","correct":"BIO-B01-Ch1.1.2-B062:A","options":[{"id":"BIO-B01-Ch1.1.2-B062:A","text":"廣泛不同物種也可共用基本解讀規則","explanation":"指出此證據欠缺區分同一物種的能力。"},{"id":"BIO-B01-Ch1.1.2-B062:B","text":"遺傳密碼完全不能比較","explanation":"規則可比較，只是結論範圍應受限制。"},{"id":"BIO-B01-Ch1.1.2-B062:C","text":"只有相同蛋白質數量才能定義物種","explanation":"蛋白質數量不是此處可用的單一物種定義。"},{"id":"BIO-B01-Ch1.1.2-B062:D","text":"共用規則表示一定沒有共同祖先","explanation":"共通性與生命關聯相容，非必然排除祖先關係。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：規則普遍性適用範圍很廣，能支持共同性，但不能單獨作同一物種判準。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B063","topicId":"BIO-Ch1.1.2-T07","stem":"已知兩段基因序列不同；學生說「這已證明兩者使用不同遺傳密碼」。哪項訂正正確？","correct":"BIO-B01-Ch1.1.2-B063:D","options":[{"id":"BIO-B01-Ch1.1.2-B063:A","text":"序列不同表示兩者不含核苷酸","explanation":"序列本來就是核苷酸排列。"},{"id":"BIO-B01-Ch1.1.2-B063:B","text":"序列不同表示兩者必是同物種","explanation":"序列差異不能單獨判定物種同異。"},{"id":"BIO-B01-Ch1.1.2-B063:C","text":"每段序列都必須使用獨立解讀表","explanation":"同規則可解讀多種序列，無須每段一表。"},{"id":"BIO-B01-Ch1.1.2-B063:D","text":"內容不同不等於解讀規則不同","explanation":"這是題中內容與規則混淆的正確修正。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：觀察只描述核苷酸排列不同，沒有直接測量或證明解讀規則差異。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B064","topicId":"BIO-Ch1.1.2-T07","stem":"題設把同一段可翻譯的資訊分別放入甲、乙的「理想解讀系統」，其他條件均相同且無例外密碼。若兩系統使用相同規則，預期何者？","correct":"BIO-B01-Ch1.1.2-B064:B","options":[{"id":"BIO-B01-Ch1.1.2-B064:A","text":"一定產生兩種完全不同的解讀結果","explanation":"題設同內容同規則，沒有必然不同的依據。"},{"id":"BIO-B01-Ch1.1.2-B064:B","text":"對這段資訊可給出相同的解讀結果","explanation":"符合條件式模型的解讀原理。"},{"id":"BIO-B01-Ch1.1.2-B064:C","text":"只有甲能使用任何核苷酸","explanation":"共用規則不意味乙不能使用資訊。"},{"id":"BIO-B01-Ch1.1.2-B064:D","text":"乙必須先改成另一物種","explanation":"物種身分不需為此理想規則比較改變。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：同內容加同規則且排除其他條件差異，可預期相同解讀；此模型不宣稱任意實際跨物種轉殖必成功。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B065","topicId":"BIO-Ch1.1.2-T07","stem":"下列四種結論中，哪一項超出「遺傳密碼基本上普遍」這項證據？","correct":"BIO-B01-Ch1.1.2-B065:C","options":[{"id":"BIO-B01-Ch1.1.2-B065:A","text":"生命的資訊處理具有共同性","explanation":"共同規則可支持此觀點。"},{"id":"BIO-B01-Ch1.1.2-B065:B","text":"不同生物可共用解讀規則","explanation":"這是普遍性的核心描述。"},{"id":"BIO-B01-Ch1.1.2-B065:C","text":"所有生物的整套DNA序列完全相同","explanation":"把規則擴張為全部內容相同，超出證據。"},{"id":"BIO-B01-Ch1.1.2-B065:D","text":"這是支持生命彼此相關的證據之一","explanation":"採證據之一的說法，沒有宣稱單一證據解釋全部。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：規則普遍並未抹除不同生物的序列差異，因此整套DNA完全相同屬過度推論。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B066","topicId":"BIO-Ch1.1.2-T07","stem":"教師比較「同一套字典能讀不同文章」與遺傳資訊。若字典代表遺傳密碼，文章應對應什麼？","correct":"BIO-B01-Ch1.1.2-B066:A","options":[{"id":"BIO-B01-Ch1.1.2-B066:A","text":"具體核苷酸序列內容","explanation":"保留同規則能面對不同內容的類比。"},{"id":"BIO-B01-Ch1.1.2-B066:B","text":"一套細胞外能量來源","explanation":"能量來源不是此資訊比喻的內容端。"},{"id":"BIO-B01-Ch1.1.2-B066:C","text":"只有染色體的數量","explanation":"數量不能代表逐位置的排列內容。"},{"id":"BIO-B01-Ch1.1.2-B066:D","text":"所有蛋白質的總重量","explanation":"重量不是序列內容或解讀對象。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：字典代表解讀方式，文章代表被解讀的實際內容，對應核苷酸排列。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B067","topicId":"BIO-Ch1.1.2-T07","stem":"某資料指出少數遺傳密碼解讀例外。這如何影響「生命形式基本上共用規則」的敘述？","correct":"BIO-B01-Ch1.1.2-B067:D","options":[{"id":"BIO-B01-Ch1.1.2-B067:A","text":"使所有物種必定各用完全不同規則","explanation":"少數例外不能推出普遍完全不同。"},{"id":"BIO-B01-Ch1.1.2-B067:B","text":"證明DNA序列沒有資訊","explanation":"解讀例外不否定序列資訊。"},{"id":"BIO-B01-Ch1.1.2-B067:C","text":"證明基因表現不會形成蛋白質","explanation":"與是否能形成蛋白質並非同一問題。"},{"id":"BIO-B01-Ch1.1.2-B067:D","text":"提醒保留「基本上」的條件，不應改寫成絕無例外","explanation":"準確保留原敘述的範圍。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：近乎普遍允許少數例外存在；本題只辨識限定語，不要求例外密碼子細節。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B068","topicId":"BIO-Ch1.1.2-T07","stem":"甲說「不同物種的DNA排列可不同」；乙說「不同物種的基本解讀規則可共通」。兩者關係為何？","correct":"BIO-B01-Ch1.1.2-B068:B","options":[{"id":"BIO-B01-Ch1.1.2-B068:A","text":"甲成立就必否定乙","explanation":"甲描述內容，未否定乙的規則。"},{"id":"BIO-B01-Ch1.1.2-B068:B","text":"兩者可以同時成立","explanation":"各自談不同面向，因此可同時成立。"},{"id":"BIO-B01-Ch1.1.2-B068:C","text":"乙成立就必否定甲","explanation":"規則相同不限制只有一套內容。"},{"id":"BIO-B01-Ch1.1.2-B068:D","text":"兩者都要求所有蛋白質相同","explanation":"兩句均未要求所有表現產物相同。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：內容多樣性與規則共同性相容，是理解生命統一與多樣的一個分子框架。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B069","topicId":"BIO-Ch1.1.2-T07","stem":"只比較甲乙是否使用近乎通用的遺傳密碼，與比較兩者同源基因的序列差異，兩種資料主要有何區別？","correct":"BIO-B01-Ch1.1.2-B069:C","options":[{"id":"BIO-B01-Ch1.1.2-B069:A","text":"前者看實際排列，後者看解讀規則","explanation":"前者是密碼規則、後者才是實際序列，此選項將兩者顛倒。"},{"id":"BIO-B01-Ch1.1.2-B069:B","text":"兩者都在比較實際核苷酸順序","explanation":"遺傳密碼的比較涉及解讀規則，不等於實際序列相同。"},{"id":"BIO-B01-Ch1.1.2-B069:C","text":"前者看解讀規則，後者看實際排列","explanation":"密碼比較看核苷酸資訊如何對應胺基酸；序列比較看逐位置排列，與題目兩者順序一致。"},{"id":"BIO-B01-Ch1.1.2-B069:D","text":"兩者都只在比較RNA及蛋白質數量","explanation":"兩者並不是只測RNA或蛋白質的數量。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：密碼與序列是兩類資料；序列比較需確認同源性才適合作親緣或功能線索。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B070","topicId":"BIO-Ch1.1.2-T07","stem":"面對「細菌、植物與動物基本共用遺傳密碼」的敘述，哪個延伸最合理？","correct":"BIO-B01-Ch1.1.2-B070:A","options":[{"id":"BIO-B01-Ch1.1.2-B070:A","text":"可把共通解讀方式視為生命相關的分子證據","explanation":"這是符合來源、且保留適當範圍的推論。"},{"id":"BIO-B01-Ch1.1.2-B070:B","text":"三者所有基因序列必逐字相同","explanation":"共用規則不保證所有序列一致。"},{"id":"BIO-B01-Ch1.1.2-B070:C","text":"三者每種細胞功能必完全相同","explanation":"表現及組成差異可造成不同功能。"},{"id":"BIO-B01-Ch1.1.2-B070:D","text":"三者必須具有相同染色體套數","explanation":"染色體套數不是規則普遍性的必然結果。"}],"concept":"DNA序列是實際核苷酸的排列內容，遺傳密碼則是序列如何被解讀的規則。不同生命形式基本上共用相同解讀規則，這種普遍性支持生命彼此相關；「基本上」不等於宣稱完全沒有例外。共用規則不代表所有生物具有相同DNA、基因體或蛋白質集合。比較時要分清內容是否相同與解讀方式是否相同，也不能僅憑規則共通就斷言兩者是同一物種。\n本題判斷：遺傳密碼的共同性支持相關性，但不決定全部內容、細胞功能或染色體套數。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第10、14張（正文第8、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B071","topicId":"BIO-Ch1.1.2-T08","stem":"同方向且已對齊的同源片段為：甲ATGCAA、乙ATGTAA、丙ACGTTA。乙與丙何者在此片段較接近甲？","correct":"BIO-B01-Ch1.1.2-B071:B","options":[{"id":"BIO-B01-Ch1.1.2-B071:A","text":"丙，因差異越多越相似","explanation":"差異較多不代表較相似。"},{"id":"BIO-B01-Ch1.1.2-B071:B","text":"乙，與甲只差1位，丙差3位","explanation":"差異數分別1與3，判斷正確。"},{"id":"BIO-B01-Ch1.1.2-B071:C","text":"兩者都和甲完全相同","explanation":"兩者與甲都有不同位置。"},{"id":"BIO-B01-Ch1.1.2-B071:D","text":"無法比較，因DNA不能逐位對照","explanation":"題設已給同源、方向和對齊，可比較此片段。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：甲乙只在第4位不同；甲丙在第2、4、5位不同，因此乙在此片段更相似。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B072","topicId":"BIO-Ch1.1.2-T08","stem":"甲乙同源片段長10位，有2個不同位置；甲丙對應片段長10位，有5個不同位置。哪個結論最穩當？","correct":"BIO-B01-Ch1.1.2-B072:C","options":[{"id":"BIO-B01-Ch1.1.2-B072:A","text":"甲丙必為同一物種","explanation":"相似度低或高都不能由此直接定同一物種。"},{"id":"BIO-B01-Ch1.1.2-B072:B","text":"甲乙所有蛋白質功能相同","explanation":"10位序列不足以判全部蛋白質功能。"},{"id":"BIO-B01-Ch1.1.2-B072:C","text":"甲乙在這10位較相似，可作進一步比較線索","explanation":"保留片段範圍與線索性，符合資料。"},{"id":"BIO-B01-Ch1.1.2-B072:D","text":"甲乙必定完全沒有共同祖先","explanation":"相似序列不能支持必無共同祖先。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：相同分母下，甲乙8位相同、甲丙5位相同，只能先判此區域的相似度。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B073","topicId":"BIO-Ch1.1.2-T08","stem":"甲ATCCGA與乙ATTCGA為已對齊同源DNA片段。下列何者正確？","correct":"BIO-B01-Ch1.1.2-B073:D","options":[{"id":"BIO-B01-Ch1.1.2-B073:A","text":"有3處差異","explanation":"逐位置比較只有一處，並非三處。"},{"id":"BIO-B01-Ch1.1.2-B073:B","text":"每處都不同","explanation":"其餘五個位置相同。"},{"id":"BIO-B01-Ch1.1.2-B073:C","text":"兩者長度不同","explanation":"兩者均6位，長度一致。"},{"id":"BIO-B01-Ch1.1.2-B073:D","text":"只有第3位不同","explanation":"第3位為C與T，是唯一差異。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：由左至右比較A、T、C/T、C、G、A，只有第3個位置不同。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B074","topicId":"BIO-Ch1.1.2-T08","stem":"某學生比較物種甲的一段基因和物種乙任意非對應DNA，發現長度相同便推斷親緣很近。最需要補正的是？","correct":"BIO-B01-Ch1.1.2-B074:A","options":[{"id":"BIO-B01-Ch1.1.2-B074:A","text":"先確認比較對象的同源性與對應位置","explanation":"直接修補比較條件的核心缺口。"},{"id":"BIO-B01-Ch1.1.2-B074:B","text":"只需確認兩段都呈雙股螺旋","explanation":"共同外形不能建立同源及對位關係。"},{"id":"BIO-B01-Ch1.1.2-B074:C","text":"只需確認兩段核苷酸種類相同","explanation":"共同構件種類不能取代可比性。"},{"id":"BIO-B01-Ch1.1.2-B074:D","text":"只需再次確認兩段長度相同","explanation":"長度已知仍不足，重測長度不解決缺口。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：長度相同不代表具有可比較的共同來源，首先須補足同源與對位基礎。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B075","topicId":"BIO-Ch1.1.2-T08","stem":"甲與乙同源基因片段完全相同；題目未提供其他基因或功能試驗。哪個說法仍需更多證據？","correct":"BIO-B01-Ch1.1.2-B075:D","options":[{"id":"BIO-B01-Ch1.1.2-B075:A","text":"這段片段的排列一致","explanation":"完全相同片段直接支持排列一致。"},{"id":"BIO-B01-Ch1.1.2-B075:B","text":"這段片段的不同位置數為0","explanation":"逐位相同就有0個不同位置。"},{"id":"BIO-B01-Ch1.1.2-B075:C","text":"此相同片段可作研究線索","explanation":"作為線索並未過度推論。"},{"id":"BIO-B01-Ch1.1.2-B075:D","text":"甲乙整個基因體及全部功能完全相同","explanation":"從局部擴張到全部內容及功能，尚缺證據。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：局部一致不代表全基因體或全部功能一致，需要更廣資料。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B076","topicId":"BIO-Ch1.1.2-T08","stem":"有三條已對齊同源片段：甲AACCGG、乙AATCGG、丙AATCGA。哪對片段的不同位置最多？","correct":"BIO-B01-Ch1.1.2-B076:B","options":[{"id":"BIO-B01-Ch1.1.2-B076:A","text":"甲乙，差1位","explanation":"差1位屬實，但不是最多。"},{"id":"BIO-B01-Ch1.1.2-B076:B","text":"甲丙，差2位","explanation":"第3與第6位不同，共2位，為最大。"},{"id":"BIO-B01-Ch1.1.2-B076:C","text":"乙丙，差3位","explanation":"乙丙只差第6位，並非3位。"},{"id":"BIO-B01-Ch1.1.2-B076:D","text":"三對皆差0位","explanation":"三條均有不同位置，不能說全部0。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：甲乙差第3位；乙丙差第6位；甲丙差第3與第6位，因此甲丙最多。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B077","topicId":"BIO-Ch1.1.2-T08","stem":"題設甲乙為同源蛋白質，其序列有高度相似性。對蛋白質功能的合理用途為何？","correct":"BIO-B01-Ch1.1.2-B077:C","options":[{"id":"BIO-B01-Ch1.1.2-B077:A","text":"據此保證兩者在所有環境完全同功能","explanation":"線索不能保證所有環境下功能相同。"},{"id":"BIO-B01-Ch1.1.2-B077:B","text":"因此無須確認是否表現","explanation":"序列資訊不能代替是否表現的觀察。"},{"id":"BIO-B01-Ch1.1.2-B077:C","text":"可形成關於功能相似的假說，再以資料驗證","explanation":"以假說和後續驗證使用線索，範圍合宜。"},{"id":"BIO-B01-Ch1.1.2-B077:D","text":"直接把蛋白質改稱同一條染色體","explanation":"蛋白質與染色體是不同對象。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：相似序列可提供功能線索，但實際功能仍可受構形、情境和表現等影響。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B078","topicId":"BIO-Ch1.1.2-T08","stem":"甲乙在已對齊的20位同源片段有1處差異，甲丙在相同區域有4處差異。若只作此片段判讀，應如何表述？","correct":"BIO-B01-Ch1.1.2-B078:A","options":[{"id":"BIO-B01-Ch1.1.2-B078:A","text":"甲乙在此區域更相似，但不能單憑此短片段定整體親緣","explanation":"同時給出正確比較和必要限制。"},{"id":"BIO-B01-Ch1.1.2-B078:B","text":"甲丙因差4位必定是同物種","explanation":"差異數不能直接定同一物種。"},{"id":"BIO-B01-Ch1.1.2-B078:C","text":"甲乙基因體所有位置必相同","explanation":"已有1處差異，更不能推出全部位置相同。"},{"id":"BIO-B01-Ch1.1.2-B078:D","text":"差異數與相似程度永遠無關","explanation":"同區域、同分母下差異數能描述相似程度。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：1/20的差異少於4/20，故甲乙局部相似度較高；短片段的代表性仍有限。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B079","topicId":"BIO-Ch1.1.2-T08","stem":"若兩段序列的讀取方向和對齊位置都未標明，直接計數差異有何風險？","correct":"BIO-B01-Ch1.1.2-B079:B","options":[{"id":"BIO-B01-Ch1.1.2-B079:A","text":"一定得到真實的序列差異數","explanation":"未核對方向與對齊，不能保證逐位置比較有效。"},{"id":"BIO-B01-Ch1.1.2-B079:B","text":"可能誤比不對應位置而誤判差異","explanation":"不對應的位置若被相互比較，差異數可能反映比對方式而非真正序列差異。"},{"id":"BIO-B01-Ch1.1.2-B079:C","text":"只要總長度相同就完全不受影響","explanation":"長度相同不會自動建立相同讀取方向與對應位置。"},{"id":"BIO-B01-Ch1.1.2-B079:D","text":"只要核苷酸比例相同就完全無差異","explanation":"比例相同仍可能有不同排列，也不能修補對位問題。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：比較的前提是相同方向和正確對應位置；未建立這些條件，差異可能只是比對方式造成。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B080","topicId":"BIO-Ch1.1.2-T08","stem":"研究者發現兩物種某同源基因相似，但另一同源區域給出的關係線索不同。依本節的基本原則，應怎麼做？","correct":"BIO-B01-Ch1.1.2-B080:D","options":[{"id":"BIO-B01-Ch1.1.2-B080:A","text":"只保留較喜歡的區域即可定論","explanation":"選擇性丟棄不合結果的資料不能解決矛盾。"},{"id":"BIO-B01-Ch1.1.2-B080:B","text":"宣稱遺傳密碼不再存在","explanation":"區域線索不同不等於解讀規則消失。"},{"id":"BIO-B01-Ch1.1.2-B080:C","text":"把所有相似片段當成同物種證明","explanation":"相似不保證同物種，仍需整體判斷。"},{"id":"BIO-B01-Ch1.1.2-B080:D","text":"保留差異，核對可比性並整合更多資料","explanation":"符合比較需審慎及線索不能取代完整證據的原則。"}],"concept":"不同物種可比較同源基因或同一類蛋白質的序列，以取得功能與親緣關係的線索。比較前要確認對象可比較，並把對應位置依相同方向對齊；在相同長度的對應區域，差異越少表示該區域越相似。序列相似是可供進一步檢驗的線索，不等於任意短片段都能決定整個物種親緣或保證功能完全相同。題面的小序列只示範比較方法，不代表真實物種的完整資料。\n本題判斷：單一區域只是線索；證據不一致時應查比較條件與更廣資料，而非挑選性定論。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8 頁（PDF 57 頁）｜本節筆記 正式第11張（正文第9頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B081","topicId":"BIO-Ch1.1.2-T09","stem":"只計核DNA：每套染色體約30億鹼基對。某正常人類二倍體細胞尚未複製DNA，核內有兩套。其核DNA約多少鹼基對？","correct":"BIO-B01-Ch1.1.2-B081:B","options":[{"id":"BIO-B01-Ch1.1.2-B081:A","text":"15億","explanation":"15億把一套量再減半，與題設不符。"},{"id":"BIO-B01-Ch1.1.2-B081:B","text":"60億","explanation":"2×30億＝60億，保留鹼基對單位。"},{"id":"BIO-B01-Ch1.1.2-B081:C","text":"30億","explanation":"30億只是一套的量。"},{"id":"BIO-B01-Ch1.1.2-B081:D","text":"120億","explanation":"120億多算了一輪未發生的複製。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：兩套×每套30億＝60億鹼基對；題目限定未複製，不能再加倍。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B082","topicId":"BIO-Ch1.1.2-T09","stem":"題設每套人類核染色體約30億鹼基對。正常精子核與正常卵核各一套，受精後尚未複製的核DNA約多少？","correct":"BIO-B01-Ch1.1.2-B082:A","options":[{"id":"BIO-B01-Ch1.1.2-B082:A","text":"60億鹼基對","explanation":"兩套相加得到60億，符合條件。"},{"id":"BIO-B01-Ch1.1.2-B082:B","text":"30億鹼基對","explanation":"只計一方會漏另一配子。"},{"id":"BIO-B01-Ch1.1.2-B082:C","text":"90億鹼基對","explanation":"未提供第三套核染色體。"},{"id":"BIO-B01-Ch1.1.2-B082:D","text":"120億鹼基對","explanation":"把受精與額外複製重複加倍了。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：精子30億＋卵30億＝60億；受精相加和DNA複製是不同事件。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B083","topicId":"BIO-Ch1.1.2-T09","stem":"某假想生物一套核DNA有120萬鹼基對。題設一細胞有兩套且尚未複製。總量應為何？","correct":"BIO-B01-Ch1.1.2-B083:D","options":[{"id":"BIO-B01-Ch1.1.2-B083:A","text":"60萬鹼基對","explanation":"把一套的120萬減半，不符合題設兩套。"},{"id":"BIO-B01-Ch1.1.2-B083:B","text":"120萬鹼基對","explanation":"這是一套的DNA量，尚未乘上兩套。"},{"id":"BIO-B01-Ch1.1.2-B083:C","text":"480萬鹼基對","explanation":"這是四套或兩套又複製一次的量，超過未複製的題設。"},{"id":"BIO-B01-Ch1.1.2-B083:D","text":"240萬鹼基對","explanation":"每套120萬，兩套為120萬×2＝240萬鹼基對。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：依題給單套資料2×120萬＝240萬，這是原創模型，不套用真實物種數值。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B084","topicId":"BIO-Ch1.1.2-T09","stem":"某未複製二倍體核DNA有60億鹼基對。題設隨後完成一輪DNA複製，尚未分配給子細胞。此時核DNA總量約為何？","correct":"BIO-B01-Ch1.1.2-B084:C","options":[{"id":"BIO-B01-Ch1.1.2-B084:A","text":"30億鹼基對","explanation":"複製增加拷貝，不會減半。"},{"id":"BIO-B01-Ch1.1.2-B084:B","text":"60億鹼基對","explanation":"60億是複製前的量。"},{"id":"BIO-B01-Ch1.1.2-B084:C","text":"120億鹼基對","explanation":"60億×2＝120億，符合一輪複製。"},{"id":"BIO-B01-Ch1.1.2-B084:D","text":"240億鹼基對","explanation":"240億需額外再加倍，題目只說一輪。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：一輪複製使60億加倍為120億；此題問DNA總量，沒有把套數或染色體數混入。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B085","topicId":"BIO-Ch1.1.2-T09","stem":"題設某雙股DNA共有1000個鹼基對，每一對含兩個核苷酸。兩股合計有幾個核苷酸？","correct":"BIO-B01-Ch1.1.2-B085:D","options":[{"id":"BIO-B01-Ch1.1.2-B085:A","text":"500個","explanation":"500是錯誤除以2。"},{"id":"BIO-B01-Ch1.1.2-B085:B","text":"1000個","explanation":"1000是成對單位的數，不是兩股合計。"},{"id":"BIO-B01-Ch1.1.2-B085:C","text":"4000個","explanation":"多乘一次2，沒有相應條件。"},{"id":"BIO-B01-Ch1.1.2-B085:D","text":"2000個","explanation":"單位換算正確：一對對應兩個。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：1000對×每對2個＝2000個；這裡改問單個核苷酸，須換算單位。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8 頁（PDF 56、57 頁）｜本節筆記 正式第6、12張（正文第4、10頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B086","topicId":"BIO-Ch1.1.2-T09","stem":"某資料庫只收錄生物的蛋白質編碼基因序列，卻標為「完整基因體」。最大的缺口是？","correct":"BIO-B01-Ch1.1.2-B086:A","options":[{"id":"BIO-B01-Ch1.1.2-B086:A","text":"尚未涵蓋其他DNA區域","explanation":"功能性RNA基因及其他DNA區域等可能未被收錄。"},{"id":"BIO-B01-Ch1.1.2-B086:B","text":"沒有把蛋白質重量加入DNA序列","explanation":"蛋白質重量不屬DNA序列內容。"},{"id":"BIO-B01-Ch1.1.2-B086:C","text":"沒有把單一基因稱作全部染色體","explanation":"改錯名稱不能補齊資料。"},{"id":"BIO-B01-Ch1.1.2-B086:D","text":"沒有剔除所有未表現基因","explanation":"未表現基因仍屬基因體，不應因此剔除。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：完整基因體要包含整套DNA，蛋白質編碼區只是其中部分。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B087","topicId":"BIO-Ch1.1.2-T09","stem":"甲細胞與乙細胞題設具有相同核DNA序列，但各自蛋白質集合不同。下列哪句正確？","correct":"BIO-B01-Ch1.1.2-B087:B","options":[{"id":"BIO-B01-Ch1.1.2-B087:A","text":"蛋白質集合不同就必定基因體不同","explanation":"題設及基因表現差異都不支持必然不同。"},{"id":"BIO-B01-Ch1.1.2-B087:B","text":"相同資訊庫可有不同表現結果","explanation":"區分基因體與表現產物，可解釋此現象。"},{"id":"BIO-B01-Ch1.1.2-B087:C","text":"基因體只在蛋白質最多的細胞存在","explanation":"基因體存在不取決於當下蛋白質多寡。"},{"id":"BIO-B01-Ch1.1.2-B087:D","text":"兩者蛋白質集合都應改叫DNA","explanation":"蛋白質與DNA的分子類別不能改名混用。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：基因體是資訊庫，蛋白質集合是表現結果；兩者不必一一對應為完全相同的當下狀態。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 7、8、9 頁（PDF 56、57、58 頁）｜本節筆記 正式第7、12、13、14張（正文第5、10、11、12頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B088","topicId":"BIO-Ch1.1.2-T09","stem":"某人說「一段DNA目前不製造蛋白質，所以這段一定不屬基因體」。為何錯誤？","correct":"BIO-B01-Ch1.1.2-B088:C","options":[{"id":"BIO-B01-Ch1.1.2-B088:A","text":"基因體只包括蛋白質成品","explanation":"基因體的對象是DNA資訊。"},{"id":"BIO-B01-Ch1.1.2-B088:B","text":"所有DNA區域都必須同時轉譯","explanation":"DNA不是直接轉譯對象，且非所有區域都產蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B088:C","text":"基因體包含整套DNA，是否當下編碼蛋白質不是排除標準","explanation":"指出正確的整套範圍原則。"},{"id":"BIO-B01-Ch1.1.2-B088:D","text":"只有正在分裂的DNA才算基因體","explanation":"細胞當下是否分裂不改變DNA範圍定義。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：非蛋白質編碼區和未表現區仍是整套DNA的一部分，不能用當下產物排除。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B089","topicId":"BIO-Ch1.1.2-T09","stem":"三個資料集分別是甲「某基因的DNA片段」、乙「生物整套DNA」、丙「細胞此時表現的蛋白質集合」。哪個對應正確？","correct":"BIO-B01-Ch1.1.2-B089:D","options":[{"id":"BIO-B01-Ch1.1.2-B089:A","text":"甲蛋白體、乙基因、丙基因體","explanation":"甲乙丙的類別及尺度全被錯置。"},{"id":"BIO-B01-Ch1.1.2-B089:B","text":"甲基因體、乙蛋白體、丙DNA","explanation":"乙是整套DNA而非蛋白質，丙也不是DNA。"},{"id":"BIO-B01-Ch1.1.2-B089:C","text":"三者全是同一個基因","explanation":"局部DNA、全部DNA與蛋白集合不是同一物。"},{"id":"BIO-B01-Ch1.1.2-B089:D","text":"甲基因片段、乙基因體、丙蛋白體","explanation":"三項逐一符合資料集的實際對象。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：先按分子類別分DNA與蛋白質，再按局部或整套範圍區分。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B090","topicId":"BIO-Ch1.1.2-T09","stem":"研究者稱某生物「已取得整套遺傳指令」，卻只展示其中一個酵素的基因序列。審閱時最合理的要求為何？","correct":"BIO-B01-Ch1.1.2-B090:A","options":[{"id":"BIO-B01-Ch1.1.2-B090:A","text":"補足整套DNA資料，或將宣稱縮限為此基因","explanation":"符合基因與基因體的尺度差異。"},{"id":"BIO-B01-Ch1.1.2-B090:B","text":"將單一基因重複列出當成全部DNA","explanation":"重複同一基因不會增加對其他DNA的涵蓋率，不能變成完整基因體資料。"},{"id":"BIO-B01-Ch1.1.2-B090:C","text":"直接認定該生物只有一個基因","explanation":"僅展示一個不表示生物真的只有一個。"},{"id":"BIO-B01-Ch1.1.2-B090:D","text":"用此酵素重量取代其餘DNA資料","explanation":"蛋白質重量不能補足缺少的DNA序列。"}],"concept":"基因體是生物所繼承的整套DNA資訊，不是單一基因，也不等於某時刻製造的蛋白質集合。它包含基因及其他DNA區域；不能把未編碼蛋白質的區域一律視為不屬基因體。教材以人類每套核染色體約30億鹼基對說明資料量。計算須標明是一套或兩套、是否已複製，以及計量是鹼基對或單個核苷酸；典型未複製二倍體核內兩套約合60億鹼基對。\n本題判斷：證據只覆蓋局部，須補資料或縮小宣稱範圍，不能由一個基因代表全套。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第12、13張（正文第10、11頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B091","topicId":"BIO-Ch1.1.2-T10","stem":"甲組取得多物種全部DNA序列；乙組測定某組織的蛋白質集合；丙組建資料庫並運算比對兩組資料。甲、乙、丙最直接對應為何？","correct":"BIO-B01-Ch1.1.2-B091:B","options":[{"id":"BIO-B01-Ch1.1.2-B091:A","text":"蛋白體學、基因體學、受精","explanation":"甲乙對象互換，丙也不是生殖過程。"},{"id":"BIO-B01-Ch1.1.2-B091:B","text":"基因體學、蛋白體學、生物資訊學","explanation":"DNA、蛋白集合及運算處理依序對應正確。"},{"id":"BIO-B01-Ch1.1.2-B091:C","text":"生物資訊學、受精、DNA複製","explanation":"乙丙不符合受精及DNA複製。"},{"id":"BIO-B01-Ch1.1.2-B091:D","text":"三者都是單個基因的轉錄","explanation":"三者皆超出單一基因轉錄的研究描述。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：先看甲乙的研究對象，再看丙的資料處理角色，三者可共同支持系統性研究。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B092","topicId":"BIO-Ch1.1.2-T10","stem":"某研究已取得大量DNA序列，但尚未整理成可查詢格式，也未比較其差異。最直接缺少哪項工作？","correct":"BIO-B01-Ch1.1.2-B092:D","options":[{"id":"BIO-B01-Ch1.1.2-B092:A","text":"只繼續增加樣本但不整理資料","explanation":"單純增加資料量不能解決已取得資料的整理與分析缺口。"},{"id":"BIO-B01-Ch1.1.2-B092:B","text":"只保留檔名而丟棄序列內容","explanation":"檔名不能代替序列內容，刪除內容會失去研究所需資訊。"},{"id":"BIO-B01-Ch1.1.2-B092:C","text":"把不同序列合併成相同標籤","explanation":"抹除差異會失去比較所需的訊息。"},{"id":"BIO-B01-Ch1.1.2-B092:D","text":"使用生物資訊學整理與分析資料","explanation":"生物資訊學以運算方法儲存、整理及分析資料，直接回應目前需要。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：產生資料只是第一步，尚需使資料可用並回答比較問題。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B093","topicId":"BIO-Ch1.1.2-T10","stem":"某計畫稱為基因體學研究，但也使用電腦處理序列。這是否矛盾？","correct":"BIO-B01-Ch1.1.2-B093:A","options":[{"id":"BIO-B01-Ch1.1.2-B093:A","text":"不矛盾，研究對象與所用工具可分別描述","explanation":"正確區分領域目標和資料處理方法。"},{"id":"BIO-B01-Ch1.1.2-B093:B","text":"矛盾，基因體學不能使用運算","explanation":"大量DNA研究常需運算協助。"},{"id":"BIO-B01-Ch1.1.2-B093:C","text":"矛盾，凡用電腦便不再研究DNA","explanation":"使用電腦不會改變研究資料是DNA。"},{"id":"BIO-B01-Ch1.1.2-B093:D","text":"不矛盾，因所有使用電腦的研究都等於基因體學","explanation":"使用電腦是一種方法，不代表研究對象一定是整個基因體。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：基因體學界定研究DNA的範圍，生物資訊學可提供方法，並非只能二選一。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B094","topicId":"BIO-Ch1.1.2-T10","stem":"兩個研究都測定上千種分子：甲測DNA序列，乙測蛋白質及其性質。能否只憑「上千種」便把兩者都叫蛋白體學？","correct":"BIO-B01-Ch1.1.2-B094:C","options":[{"id":"BIO-B01-Ch1.1.2-B094:A","text":"可以，樣本多就等於蛋白質","explanation":"樣本量不決定分子類別。"},{"id":"BIO-B01-Ch1.1.2-B094:B","text":"可以，只要數量相同分子就相同","explanation":"相同數量不能將DNA變為蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B094:C","text":"不可以，仍須看直接研究對象是否為蛋白質集合","explanation":"保留研究對象的分類準則。"},{"id":"BIO-B01-Ch1.1.2-B094:D","text":"不可以，因蛋白體學只能測一種分子","explanation":"蛋白體學正是集合層次，不限一種分子。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：大量只是尺度，分子對象才區分DNA研究和蛋白質集合研究。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B095","topicId":"BIO-Ch1.1.2-T10","stem":"某技術使每日可分析樣本從20個增至2000個，題設其他條件相同。這最直接展示什麼？","correct":"BIO-B01-Ch1.1.2-B095:D","options":[{"id":"BIO-B01-Ch1.1.2-B095:A","text":"分析量變為原來100倍，密碼規則也增加100倍","explanation":"資料處理量不決定遺傳密碼規則數。"},{"id":"BIO-B01-Ch1.1.2-B095:B","text":"分析量變為原來100倍，DNA種類必轉為RNA","explanation":"處理能力改變不會使DNA變成RNA。"},{"id":"BIO-B01-Ch1.1.2-B095:C","text":"分析量變為原來100倍，所有結論便自動正確","explanation":"速度與數量不自動保證推論正確。"},{"id":"BIO-B01-Ch1.1.2-B095:D","text":"分析量變為原來100倍，仍須整理分析與核對","explanation":"2000÷20＝100，但通量不取代分析品質。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：2000÷20＝100，提升的是處理通量；結論品質仍需整理分析與核對。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B096","topicId":"BIO-Ch1.1.2-T10","stem":"團隊已有快速定序設備，但大量資料無法有效整理。計畫下一步邀請資訊與數學專長成員合作，主要理由為何？","correct":"BIO-B01-Ch1.1.2-B096:A","options":[{"id":"BIO-B01-Ch1.1.2-B096:A","text":"資料產生後仍需運算分析與跨領域解釋","explanation":"直接回應大量資料的整理與分析需要。"},{"id":"BIO-B01-Ch1.1.2-B096:B","text":"基因體學必須排除生物學家","explanation":"跨領域是整合，也包括生物學專業。"},{"id":"BIO-B01-Ch1.1.2-B096:C","text":"只要邀請人員就不需驗證","explanation":"合作不取代證據核對。"},{"id":"BIO-B01-Ch1.1.2-B096:D","text":"DNA資訊只能由某一學科獨占","explanation":"不同專長可協作，不需由單一學科獨占。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：高通量、資訊處理與專業合作互補，能把資料轉成可檢驗的生物理解。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B097","topicId":"BIO-Ch1.1.2-T10","stem":"題設同一細胞在時間甲、乙的DNA序列不變，蛋白質種類與量卻有差異。若要直接比較此產物集合，應優先整理哪類資料？","correct":"BIO-B01-Ch1.1.2-B097:B","options":[{"id":"BIO-B01-Ch1.1.2-B097:A","text":"兩時點的全部DNA序列清單","explanation":"題設DNA序列相同，無法直接描述蛋白質集合差異。"},{"id":"BIO-B01-Ch1.1.2-B097:B","text":"兩時點的蛋白體資料","explanation":"蛋白質種類和量可直接回應比較目的。"},{"id":"BIO-B01-Ch1.1.2-B097:C","text":"兩時點的基因名稱清單","explanation":"基因名字不提供兩時點產物的差異。"},{"id":"BIO-B01-Ch1.1.2-B097:D","text":"兩時點的染色體套數紀錄","explanation":"套數資料不能取代蛋白質種類與數量。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：所問是兩時點蛋白質產物的變化，因此需蛋白體資料，而非只靠不變的DNA清單。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B098","topicId":"BIO-Ch1.1.2-T10","stem":"某人說「生物資訊學只是存檔，不包括整理或分析」。哪項訂正最完整？","correct":"BIO-B01-Ch1.1.2-B098:C","options":[{"id":"BIO-B01-Ch1.1.2-B098:A","text":"只要儲存就等於已懂全部生物機制","explanation":"存檔不代表已完成機制推論。"},{"id":"BIO-B01-Ch1.1.2-B098:B","text":"它只研究一條染色體的外觀","explanation":"其範圍不限單一染色體外觀。"},{"id":"BIO-B01-Ch1.1.2-B098:C","text":"它利用運算工具儲存、整理與分析生物資料","explanation":"保留三項核心資料功能。"},{"id":"BIO-B01-Ch1.1.2-B098:D","text":"它只負責讓DNA在細胞內複製","explanation":"DNA細胞內複製與運算資料工作不同。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：生物資訊學不只保存原始檔，還包含讓資料可檢索、比較及分析的工作。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B099","topicId":"BIO-Ch1.1.2-T10","stem":"某計畫只研究一個基因的一個作用，尚未分析整套基因或其他DNA。若依此便宣稱已完成整套基因體學分析，問題為何？","correct":"BIO-B01-Ch1.1.2-B099:D","options":[{"id":"BIO-B01-Ch1.1.2-B099:A","text":"DNA不能被研究","explanation":"DNA可被研究，問題是範圍。"},{"id":"BIO-B01-Ch1.1.2-B099:B","text":"只要研究一個基因就已包含所有DNA","explanation":"一個基因不能代表整套DNA的全部資料。"},{"id":"BIO-B01-Ch1.1.2-B099:C","text":"所有研究都必須同時測蛋白質","explanation":"基因體分析不要求每項都必測蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B099:D","text":"實際研究尺度未涵蓋其整套分析宣稱","explanation":"指出尺度和宣稱不一致的具體問題。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：單基因研究有價值，但證據範圍與整套基因體分析不同；需補足範圍或修正宣稱。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true},{"id":"BIO-B01-Ch1.1.2-B100","topicId":"BIO-Ch1.1.2-T10","stem":"「高通量產生資料→生物資訊整理分析→跨領域團隊解釋」的安排，最合理的目的為何？","correct":"BIO-B01-Ch1.1.2-B100:A","options":[{"id":"BIO-B01-Ch1.1.2-B100:A","text":"把大量分子資料連結到可研究的生物問題","explanation":"完整連結資料工具與生物研究目標。"},{"id":"BIO-B01-Ch1.1.2-B100:B","text":"讓資料數量自動取代所有證據","explanation":"大量資料仍需品質與推論核對。"},{"id":"BIO-B01-Ch1.1.2-B100:C","text":"保證所有基因都只製造同一蛋白質","explanation":"方法整合不限制基因只產同一蛋白質。"},{"id":"BIO-B01-Ch1.1.2-B100:D","text":"使DNA與蛋白質不再有差別","explanation":"工具合作不會改變分子類別。"}],"concept":"基因體學研究一個或多個物種的整套基因及其他DNA序列；蛋白體學研究蛋白質集合及其性質，某細胞、組織或生物體表現的一整套蛋白質稱為蛋白體。高通量技術快速處理大量樣本並產生資料；生物資訊學以運算工具儲存、整理與分析資料。這些研究常需要跨領域團隊合作，把分子資料連回生物問題。研究領域看研究對象，技術則看如何產生或處理資料，兩者可重疊而非互斥。\n本題判斷：三項發展互補：快速取得、有效處理、整合解釋，幫助理解蛋白質與RNA等在生命系統中的活動。","example":"","source":"Campbell Biology 12e｜Chapter 1 / Concept 1.1 / Life’s Processes Involve the Expression and Transmission of Genetic Information｜印刷 8、9 頁（PDF 57、58 頁）｜本節筆記 正式第13、15張（正文第11、13頁）","shuffle":true}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"bio-chapter-01-concept-1-1-child-03-theme-life-requires-the-transfer-and-transformation-of-energy-and-matter","title":"Ch1.1.3 主題：生命需要能量與物質的轉移與轉換","version":"B01-v2-20260911:3dde75ea30ba7cb253ea","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["Campbell Biology 12e｜第一輪","Ch1 演化、生物學主題與科學探究","Ch1.1 生命的統整主題"],"comparison":{"status":"BASELINE","reason":"中國醫為主要題庫及唯一比對基準。"},"banks":[{"depth":"掃過","target":50,"questions":[{"id":"BIO-B01-Ch1.1.3-S001","topicId":"BIO-1.1.3-WORK","stem":"一株幼苗固定在盆中，葉片卻持續長大。就生命活動的能量需求而言，何者最合理？","correct":"BIO-B01-Ch1.1.3-S001:B","options":[{"id":"BIO-B01-Ch1.1.3-S001:A","text":"葉片不位移，生長便不需供能","explanation":"位移不是唯一做功形式，固定幼苗仍會合成物質。"},{"id":"BIO-B01-Ch1.1.3-S001:B","text":"新組織形成包含需要能量的細胞工作","explanation":"形成新組織包含分裂與合成，需要能量支持。"},{"id":"BIO-B01-Ch1.1.3-S001:C","text":"只要根部吸到水，合成便不需能量","explanation":"水是原料之一，不能免除細胞工作的能量需求。"},{"id":"BIO-B01-Ch1.1.3-S001:D","text":"只有細胞數目增加才算需能量的生長","explanation":"細胞變大及合成同樣可能需要能量，不只細胞增數。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n幼苗長大可以包含細胞分裂、細胞變大與新物質合成；能否離開原位置不是判斷能量需求的標準。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S002","topicId":"BIO-1.1.3-WORK","stem":"某細胞外形未變，但正在合成修補受損部位的蛋白質。下列判斷何者正確？","correct":"BIO-B01-Ch1.1.3-S002:D","options":[{"id":"BIO-B01-Ch1.1.3-S002:A","text":"沒有增大表示不需物質原料","explanation":"修補仍須合成新分子，外形不變不能排除原料需求。"},{"id":"BIO-B01-Ch1.1.3-S002:B","text":"修補只需要原料而不需要供能","explanation":"合成除了原料還需要能量，不是只靠材料自動完成。"},{"id":"BIO-B01-Ch1.1.3-S002:C","text":"看不見運動即可排除能量轉換","explanation":"微觀活動也可伴隨能量轉換，外觀運動不是必要線索。"},{"id":"BIO-B01-Ch1.1.3-S002:D","text":"蛋白質合成屬於需要能量的細胞活動","explanation":"合成蛋白質是本節所列細胞工作，需要供能。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n應依正在進行的細胞工作判斷，而非只看體積。替換受損分子即使沒有淨增重，也需要原料和能量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S003","topicId":"BIO-1.1.3-WORK","stem":"將生物的「做功」解釋為僅有肌肉推動肢體，會漏掉下列哪一項需要能量的活動？","correct":"BIO-B01-Ch1.1.3-S003:A","options":[{"id":"BIO-B01-Ch1.1.3-S003:A","text":"細胞製造新的生物分子","explanation":"細胞合成新分子是生命活動中的工作，並不限於肌肉運動。"},{"id":"BIO-B01-Ch1.1.3-S003:B","text":"石塊因重力向下滾動","explanation":"石塊滾動涉及物理能量，但不是生物細胞的工作。"},{"id":"BIO-B01-Ch1.1.3-S003:C","text":"水滴從屋簷落到地面","explanation":"水滴下落不是細胞執行生命活動，不能補足此分類。"},{"id":"BIO-B01-Ch1.1.3-S003:D","text":"陽光被桌面反射","explanation":"光反射不是細胞合成或維持生命的工作。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n題目要求的是生物細胞工作的例子。非生物的物理過程也可能涉及能量，但不能當作細胞活動的例證。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S004","topicId":"BIO-1.1.3-WORK","stem":"生物在繁殖過程中形成新個體，對能量與物質的需求應如何描述？","correct":"BIO-B01-Ch1.1.3-S004:C","options":[{"id":"BIO-B01-Ch1.1.3-S004:A","text":"能量供應原子，物質供應陽光","explanation":"能量不供應原子；原子由物質原料提供。"},{"id":"BIO-B01-Ch1.1.3-S004:B","text":"只需物質，生命能量能自行增加","explanation":"物質原料不代表能量能自行增加，仍須有供能來源。"},{"id":"BIO-B01-Ch1.1.3-S004:C","text":"能量支持工作，物質提供組成原料","explanation":"細胞工作與身體組成分別需要能量及物質，兩者皆必要。"},{"id":"BIO-B01-Ch1.1.3-S004:D","text":"只需能量，新個體的原料不必取得","explanation":"供能不能取代原料，新個體不能只由能量組成。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n新個體形成涉及細胞分裂及物質合成。物質提供組成所需原子，能量支持這些工作，兩種需求要分開辨認。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S005","topicId":"BIO-1.1.3-WORK","stem":"某觀察紀錄只寫「動物正在休息，沒有走動」。單憑這項紀錄，可以作出哪個判斷？","correct":"BIO-B01-Ch1.1.3-S005:B","options":[{"id":"BIO-B01-Ch1.1.3-S005:A","text":"所有細胞都停止工作","explanation":"外部休息不能證明每一細胞都停止工作。"},{"id":"BIO-B01-Ch1.1.3-S005:B","text":"仍可能有需要能量的內部活動","explanation":"內部細胞活動可能持續，因此能量需求仍可能存在。"},{"id":"BIO-B01-Ch1.1.3-S005:C","text":"體內不再發生物質合成","explanation":"是否合成必須有其他觀察，不能由不走動直接否定。"},{"id":"BIO-B01-Ch1.1.3-S005:D","text":"生命活動不再需要能量來源","explanation":"生命維持仍可能需供能，休息不等於供能需求歸零。"}],"concept":"生物學中的做功不限於外觀移動，也包括細胞分裂、分子合成、主動運輸與生長等活動。這些活動需要能量；構成新結構又需要物質作原料。外表靜止不代表內部活動停止，能利用能量也不代表不需要原料。\n\n觀察層級是個體外部行為；它不能完整代表各細胞的活動。休息時仍可能維持、修補或合成，因此不能從不走動推出不需能量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第4張／正文第2頁；正式第7張／正文第5頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S006","topicId":"BIO-1.1.3-LIGHT","stem":"水生藻類吸收光線後製造含化學能的有機物。這段過程中主要描述的能量形式轉換是什麼？","correct":"BIO-B01-Ch1.1.3-S006:C","options":[{"id":"BIO-B01-Ch1.1.3-S006:A","text":"化學能轉成光能","explanation":"這是把本題輸入與儲存形式倒置。"},{"id":"BIO-B01-Ch1.1.3-S006:B","text":"熱轉成物質","explanation":"熱不是題設主要輸入，物質也不是能量形式。"},{"id":"BIO-B01-Ch1.1.3-S006:C","text":"光能轉成化學能","explanation":"藻類將吸收的光能轉成有機物中的化學能。"},{"id":"BIO-B01-Ch1.1.3-S006:D","text":"物質轉成光能","explanation":"原料與能量形式不可混列，題設並非物質產生光。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n題面已給出輸入為光、產物為有機物；辨別轉換應沿著輸入到產物的順序，而非反過來讀。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S007","topicId":"BIO-1.1.3-LIGHT","stem":"在主要依賴光合作用的草原，能量由外界進入生物食物中的關鍵過程為何？","correct":"BIO-B01-Ch1.1.3-S007:A","options":[{"id":"BIO-B01-Ch1.1.3-S007:A","text":"光合生物將光能轉為有機物中的化學能","explanation":"符合草原光合生物把光能轉成食物化學能的功能。"},{"id":"BIO-B01-Ch1.1.3-S007:B","text":"分解者使礦物質變成陽光","explanation":"礦物質是原料，分解不會把它轉成陽光。"},{"id":"BIO-B01-Ch1.1.3-S007:C","text":"草食動物把散失的熱變為葉片","explanation":"動物不能用已散熱直接製造葉片，食物來源方向相反。"},{"id":"BIO-B01-Ch1.1.3-S007:D","text":"植物把土壤原料直接當成光能","explanation":"土壤提供物質，與葉片吸收的光能不同。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n先辨識生態系的主要外來能源，再找把它轉成生物可用食物化學能的過程；此題的限定使光合作用成為入口。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S008","topicId":"BIO-1.1.3-LIGHT","stem":"同學說「植物製造糖，所以能量也由植物從無到有製造」。應如何修正？","correct":"BIO-B01-Ch1.1.3-S008:B","options":[{"id":"BIO-B01-Ch1.1.3-S008:A","text":"糖是能量，不包含物質","explanation":"糖具有原子組成，是攜帶化學能的物質，不是純能量。"},{"id":"BIO-B01-Ch1.1.3-S008:B","text":"植物把外來光能轉換後儲於有機物","explanation":"區分糖的合成與能量來源，才能符合能量轉換觀念。"},{"id":"BIO-B01-Ch1.1.3-S008:C","text":"植物使環境能量總量不受限制地增加","explanation":"能量不是無中生有；把生物及環境一起看仍須計入輸入。"},{"id":"BIO-B01-Ch1.1.3-S008:D","text":"只要改成動物製造能量即可","explanation":"動物也不能憑空創造能量，換生物名稱不能修正概念。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n「製造糖分子」描述物質合成；糖中的能量來自既有能源轉換。造出新分子不等於造出原本不存在的能量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S009","topicId":"BIO-1.1.3-LIGHT","stem":"比較光合作用中的光線與二氧化碳，下列配對何者符合兩者在本節的基本角色？","correct":"BIO-B01-Ch1.1.3-S009:D","options":[{"id":"BIO-B01-Ch1.1.3-S009:A","text":"光線：物質原料；二氧化碳：光源","explanation":"兩種角色顛倒，二氧化碳不發出本題所需光能。"},{"id":"BIO-B01-Ch1.1.3-S009:B","text":"兩者都是植物直接吃到的食物","explanation":"光線不是食物分子，二氧化碳是合成有機物的原料。"},{"id":"BIO-B01-Ch1.1.3-S009:C","text":"兩者都只負責散熱","explanation":"兩者在光合作用中分別供能與供料，不只散熱。"},{"id":"BIO-B01-Ch1.1.3-S009:D","text":"光線：能量來源；二氧化碳：物質來源","explanation":"光能供應能量，二氧化碳提供可納入有機物的碳。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n原料提供構成分子的原子，能源支持轉換與合成。把光線和二氧化碳分別列入這兩種角色，可避免把糖的物質來源與能量來源混淆。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S010","topicId":"BIO-1.1.3-LIGHT","stem":"把「太陽是許多生態系的主要能量來源」改寫成考試敘述，何者保留原意而未過度推論？","correct":"BIO-B01-Ch1.1.3-S010:C","options":[{"id":"BIO-B01-Ch1.1.3-S010:A","text":"每個生物都直接靠吸收陽光取得食物能量","explanation":"消費者多由食物取得化學能，不是都直接光合。"},{"id":"BIO-B01-Ch1.1.3-S010:B","text":"所有地點的能源條件都完全相同","explanation":"不同生態系條件可能不同，原句沒有全稱此結論。"},{"id":"BIO-B01-Ch1.1.3-S010:C","text":"許多生態系藉光合生物引入太陽能","explanation":"保留許多生態系與光合轉能的關係，沒有擴大範圍。"},{"id":"BIO-B01-Ch1.1.3-S010:D","text":"只要日照增加，所有生物一定立刻增多","explanation":"生物增長還受物質等條件影響，不能從日照單一因素保證。"}],"concept":"在以光合作用為主要能量入口的生態系，植物、藻類等吸收光能，將能量轉成糖等有機分子中的化學能。光提供能量，二氧化碳、水等提供物質，兩者角色不同。這是既有能量的轉換，不是從無到有創造能量；也不能把多數生態系的情形說成所有生態系唯一可能的方式。\n\n「許多」描述常見情形，「主要」表示相對重要性，兩者都不等於毫無例外。能源入口也不同於每個生物直接取能的方式。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第8張／正文第6頁；正式第9張／正文第7頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S011","topicId":"BIO-1.1.3-PRODUCER","stem":"池塘中甲能以光能製造有機物，乙靠攝食甲取得食物。依這兩項資訊，何者最合理？","correct":"BIO-B01-Ch1.1.3-S011:A","options":[{"id":"BIO-B01-Ch1.1.3-S011:A","text":"甲是本題的生產者，乙是消費者","explanation":"甲能光合製造有機物，乙取得甲的有機物，角色相符。"},{"id":"BIO-B01-Ch1.1.3-S011:B","text":"甲是消費者，乙是生產者","explanation":"把製造有機物與攝食的角色對調。"},{"id":"BIO-B01-Ch1.1.3-S011:C","text":"甲與乙都只取用環境熱維生","explanation":"題面給的是光能和食物化學能，不是環境熱。"},{"id":"BIO-B01-Ch1.1.3-S011:D","text":"甲會光合，因此沒有細胞工作","explanation":"甲仍需生長及維持細胞活動，能光合不能免除做功。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n生產者與消費者要依題目給出的營養功能判別。能將光能引入自己製造的有機物是甲的特徵；攝食則說明乙的取得方式。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S012","topicId":"BIO-1.1.3-PRODUCER","stem":"某藻類體型極小，但能光合製造有機物。下列哪項特徵最能支持將它列為本節所說的生產者？","correct":"BIO-B01-Ch1.1.3-S012:C","options":[{"id":"BIO-B01-Ch1.1.3-S012:A","text":"體型比動物小","explanation":"大小不決定是否生產有機物，許多小生物是消費者。"},{"id":"BIO-B01-Ch1.1.3-S012:B","text":"生活在水中","explanation":"水中也有消費者和分解者，棲地不能獨自分類。"},{"id":"BIO-B01-Ch1.1.3-S012:C","text":"具有把光能轉成食物化學能的能力","explanation":"光合轉能並製造有機物直接符合此處生產者功能。"},{"id":"BIO-B01-Ch1.1.3-S012:D","text":"在顯微鏡下能移動","explanation":"移動不是此處分類標準，不能只因能動而改判角色。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n本節的生產者是功能角色；位置、體型和運動行為都不足以取代取能方式的判斷。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S013","topicId":"BIO-1.1.3-PRODUCER","stem":"植物被稱為光合生產者，這是否表示植物只儲存能量、不使用能量？","correct":"BIO-B01-Ch1.1.3-S013:B","options":[{"id":"BIO-B01-Ch1.1.3-S013:A","text":"是，只有消費者需要做功","explanation":"植物本身有細胞工作，不能排除其能量使用。"},{"id":"BIO-B01-Ch1.1.3-S013:B","text":"否，植物也利用化學能進行生命活動","explanation":"植物既可製造有機物，也會利用化學能做功。"},{"id":"BIO-B01-Ch1.1.3-S013:C","text":"是，光照使植物所有活動都免供能","explanation":"光是能源之一，不表示工作不需要能量。"},{"id":"BIO-B01-Ch1.1.3-S013:D","text":"否，因為植物必須先吃動物才會生長","explanation":"植物利用自己製造的有機物即可取能，不必先吃動物。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n生產有機物與使用化學能可在同一生物中並存。植物本身的生長、細胞分裂及物質合成也需要能量。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S014","topicId":"BIO-1.1.3-PRODUCER","stem":"在「太陽→水草→蝸牛」的簡化資源傳遞中，水草最關鍵的功能為何？","correct":"BIO-B01-Ch1.1.3-S014:D","options":[{"id":"BIO-B01-Ch1.1.3-S014:A","text":"將蝸牛散失的熱完全送回太陽","explanation":"水草不把蝸牛的熱完整回收，更不送回太陽。"},{"id":"BIO-B01-Ch1.1.3-S014:B","text":"只把礦物質原封不動傳給蝸牛","explanation":"水草會利用原料製造有機物，並非只有原樣礦物質輸送。"},{"id":"BIO-B01-Ch1.1.3-S014:C","text":"提供唯一會自行增加的能量總量","explanation":"生產者不使能量無中生有，必須計入吸收的光能。"},{"id":"BIO-B01-Ch1.1.3-S014:D","text":"把光能轉入可被取食的有機物","explanation":"光合轉能後的有機物可讓蝸牛取得化學能與物質。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n水草是這條光能進入食物路徑的轉換者。傳給蝸牛的有機物同時含物質與化學能，不能只看其中一項。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S015","topicId":"BIO-1.1.3-PRODUCER","stem":"某細菌能吸收光能，並利用環境中的無機原料製造有機物。只依這些已知功能，應如何判斷？","correct":"BIO-B01-Ch1.1.3-S015:B","options":[{"id":"BIO-B01-Ch1.1.3-S015:A","text":"只要是細菌就只能當分解者","explanation":"細菌具有多種生活方式，不能用類群名稱指定唯一角色。"},{"id":"BIO-B01-Ch1.1.3-S015:B","text":"可以扮演本題所說的光合生產者","explanation":"題設能力符合以光能製造有機物的生產者功能。"},{"id":"BIO-B01-Ch1.1.3-S015:C","text":"因體型小而不參與能量流動","explanation":"體型不會排除能量需求，也不影響能量流動角色。"},{"id":"BIO-B01-Ch1.1.3-S015:D","text":"它取得的食物必定由動物製造","explanation":"題目已說它利用無機原料製造，不需先由動物製造。"}],"concept":"本題討論的生產者是光合生物，能吸收光能並將其轉為自己製造的有機物中的化學能。生產者也要利用化學能進行細胞工作，並會散熱。生產者的角色由取得能量與製造有機物的方式判斷，不能只看大小、是否移動或生活位置。\n\n細菌是生物類群名稱，分解者和生產者則是功能角色。題面明列光合製造有機物，應按功能判斷，不能把所有細菌都當分解者。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第5張／正文第3頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S016","topicId":"BIO-1.1.3-CONSUMER","stem":"兔子咀嚼青草，青草對兔子提供的資源應如何描述？","correct":"BIO-B01-Ch1.1.3-S016:C","options":[{"id":"BIO-B01-Ch1.1.3-S016:A","text":"只有能量，沒有物質","explanation":"青草含各種分子與原子，不能說只有能量。"},{"id":"BIO-B01-Ch1.1.3-S016:B","text":"只有原料，沒有化學能","explanation":"有機物含化學能，不能只當結構原料。"},{"id":"BIO-B01-Ch1.1.3-S016:C","text":"含化學能的有機物，兼供能量與物質","explanation":"同一份食物可同時供能和供料，符合取食的意義。"},{"id":"BIO-B01-Ch1.1.3-S016:D","text":"兔子直接吸收的太陽光","explanation":"青草中能量可能源於陽光，但兔子攝入的是食物。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n要區分食物本身和其中攜帶的能量。青草中的有機物可提供化學能，部分物質也可用作兔子體內組成。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the Transfer and Transformation of Energy and Matter；Figure 1.9｜印刷 9 頁（PDF 58 頁）｜本節筆記 正式第3張／正文第1頁；正式第6張／正文第4頁；正式第7張／正文第5頁；正式第8張／正文第6頁；正式第9張／正文第7頁；正式第10張／正文第8頁","shuffle":true},{"id":"BIO-B01-Ch1.1.3-S017","topicId":"BIO-1.1.3-CONSUMER","stem":"蛙吃昆蟲後，從食物取得可供活動使用的哪一種能量？","correct":"BIO-B01-Ch1.1.3-S017:A","options":[{"id":"BIO-B01-Ch1.1.3-S017:A","text":"化學能","explanation":"昆蟲的有機物攜帶化學能，可供蛙的活動使用。"},{"id":"BIO-B01-Ch1.1.3-S017:B","text":"光能","explanation":"蛙並非藉吃昆蟲直接吸收光，取得的是化學能。"},{"id":"BIO-B01-Ch1.1.3-S017:C","text":"已散到空氣中的熱","explanation":"散到空氣的熱不是這份昆蟲食物中的能量形式。"},{"id":"BIO-B01-Ch1.1.3-S017:D","text":"土壤礦物質的質量","explanation":"質量是物質的量，不是本題所問的能量形式。"}],"concept":"消費者攝取其他生物或其遺留的有機物，取得食物中的化學能及構成身體的物質。食物關係中的傳遞箭頭由被吃者指向取食者，表示資源流向。即使食物中的能量可追溯到陽光，動物從食物取得的仍是化學能，不能稱為直接以陽光製造食物。\n\n題目問「從食物取得」，應看食物分子所攜帶的化學能；能量的更早來源和蛙當下取得的形式不能混用。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1：Life Requires the T
