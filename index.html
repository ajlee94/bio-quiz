:C","text":"植物不使用自己取得的能量","explanation":"錯誤。植物也需能量維持及生長。"},{"id":"BIO-B01-Ch1-B044:D","text":"能量形式可改變，並可沿取食關係傳遞","explanation":"正確。題設同時提供轉換與傳遞。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：分別指出植物中的轉換與取食中的傳遞，不混同能量形式與物質組成。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B045","topicId":"CH1-INTRO-T05","stem":"某系統的養分可以反覆被回收。學生因此主張不再需要外來能量。哪項反駁最適當？","correct":"BIO-B01-Ch1-B045:A","options":[{"id":"BIO-B01-Ch1-B045:A","text":"物質回收不會取消能量利用時的熱散失","explanation":"正確。物質循環和能量收支是不同問題。"},{"id":"BIO-B01-Ch1-B045:B","text":"養分回收必使所有能量增加","explanation":"錯誤。回收物質不會憑空產生能量。"},{"id":"BIO-B01-Ch1-B045:C","text":"能量其實就是回收的氮原子","explanation":"錯誤。氮是物質，不是能量本身。"},{"id":"BIO-B01-Ch1-B045:D","text":"只有捕食者需要能量，植物不需要","explanation":"錯誤。植物維持生命也需要能量。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：回收的是材料；維持活動仍需要補充沿途散出的可用能量。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B046","topicId":"CH1-INTRO-T05","stem":"甲示意追蹤陽光→植物→鼠→環境熱；乙追蹤碳由環境進植物再回環境。應如何命名？","correct":"BIO-B01-Ch1-B046:B","options":[{"id":"BIO-B01-Ch1-B046:A","text":"兩者都是族群演化","explanation":"錯誤。未有跨世代遺傳比較。"},{"id":"BIO-B01-Ch1-B046:B","text":"甲為能量流動，乙為物質循環","explanation":"正確。甲追蹤能量轉換散出，乙追蹤原子交換。"},{"id":"BIO-B01-Ch1-B046:C","text":"甲為物質循環，乙為能量流動","explanation":"錯誤。兩個追蹤對象顛倒。"},{"id":"BIO-B01-Ch1-B046:D","text":"兩者都是能量永久循環","explanation":"錯誤。乙是物質，甲也不是永久回收。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：先辨認箭頭所代表的實體，再命名；箭頭形狀不能代替物理意義。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B047","topicId":"CH1-INTRO-T05","stem":"某簡化能量帳：植物收到200單位，題設其中150單位散成熱，餘下全部成為可提供下一步的化學能。下一步可取得的上限為何？","correct":"BIO-B01-Ch1-B047:C","options":[{"id":"BIO-B01-Ch1-B047:A","text":"200單位","explanation":"錯誤。200忽略題設的散出。"},{"id":"BIO-B01-Ch1-B047:B","text":"350單位","explanation":"錯誤。350把流出能量當新增能量。"},{"id":"BIO-B01-Ch1-B047:C","text":"50單位","explanation":"正確。剩餘為200−150＝50，不能超出保留量。"},{"id":"BIO-B01-Ch1-B047:D","text":"150單位","explanation":"錯誤。150已以熱散出。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：計算只用題給收支，不假設固定傳遞效率；上限是200減150等於50單位。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B048","topicId":"CH1-INTRO-T05","stem":"在以光合作用為能量入口的系統中，若光能輸入停止而儲能逐漸耗盡，只有養分回收仍正常，哪項判斷合理？","correct":"BIO-B01-Ch1-B048:D","options":[{"id":"BIO-B01-Ch1-B048:A","text":"養分回收會自動把熱變回同量光能","explanation":"錯誤。分解循環不會把熱完整還原為光。"},{"id":"BIO-B01-Ch1-B048:B","text":"只要碳原子存在就不需能量","explanation":"錯誤。原料存在與能量供應不同。"},{"id":"BIO-B01-Ch1-B048:C","text":"分解者可不使用能量完成所有活動","explanation":"錯誤。分解者同樣有能量需求。"},{"id":"BIO-B01-Ch1-B048:D","text":"養分循環本身不能保證原有生命活動持續","explanation":"正確。維持生命還需要可用能量供應。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：題設同時排除新光輸入且耗盡儲能，材料可回收仍無法代替能量來源。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B049","topicId":"CH1-INTRO-T05","stem":"有人說「熱離開生態系就表示違反能量守恆」。哪項修正正確？","correct":"BIO-B01-Ch1-B049:A","options":[{"id":"BIO-B01-Ch1-B049:A","text":"要把流入、儲存及流出一併計入；流出不是毀滅","explanation":"正確。系統邊界外的能量流出仍要納入收支。"},{"id":"BIO-B01-Ch1-B049:B","text":"能量守恆只適用植物，不適用動物","explanation":"錯誤。守恆不是依生物類別決定。"},{"id":"BIO-B01-Ch1-B049:C","text":"熱沒有能量，所以不用計算","explanation":"錯誤。熱反映能量傳遞，不能忽略。"},{"id":"BIO-B01-Ch1-B049:D","text":"只計生態系內部剩餘量就能得全部收支","explanation":"錯誤。只看剩餘會漏掉已離開邊界的部分。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：能量守恆描述總收支，生態系散熱是跨邊界流出，不是能量消失。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B050","topicId":"CH1-INTRO-T05","stem":"同一植物既儲存食物化學能，也利用其中一部分維持生命並散熱。這兩種過程是否相容？","correct":"BIO-B01-Ch1-B050:B","options":[{"id":"BIO-B01-Ch1-B050:A","text":"相容，因為散熱一定全部變回植物食物","explanation":"錯誤。相容的原因不是熱完整回收。"},{"id":"BIO-B01-Ch1-B050:B","text":"相容，能量可在儲存與利用間分配","explanation":"正確。儲存與做功是可同時存在的能量去向。"},{"id":"BIO-B01-Ch1-B050:C","text":"不相容，有儲能就完全不能散熱","explanation":"錯誤。儲能不排除其他部分被利用。"},{"id":"BIO-B01-Ch1-B050:D","text":"不相容，植物只有物質沒有能量","explanation":"錯誤。植物也接受、轉換與利用能量。"}],"concept":"生命維持結構、進行代謝、生長與繁殖都需要能量。多數生態系以太陽能為主要輸入，生產者把光能轉為食物的化學能，消費者經取食取得化學能。生產者和消費者利用能量做功時均有部分能量以熱散入環境，因此生態系需要持續能量輸入，不能把散出的熱當作能像養分一樣循環供生產者使用。能量轉換為熱不等於能量憑空消失。\n\n本題判斷：不可把生產者只畫成不消耗能量的儲物箱；它也需維持自身生命活動。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、6、10張；正文2、5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B051","topicId":"CH1-INTRO-T06","stem":"某碳原子先存在於環境中的分子，後進入植物，再隨取食進入小鼠，最後又回到環境。這足以說明哪項？","correct":"BIO-B01-Ch1-B051:C","options":[{"id":"BIO-B01-Ch1-B051:A","text":"沿途全部能量也必回到植物","explanation":"錯誤。原子回收不能推出能量完整回收。"},{"id":"BIO-B01-Ch1-B051:B","text":"該原子永遠維持相同分子形式","explanation":"錯誤。化學形式可在生物活動中改變。"},{"id":"BIO-B01-Ch1-B051:C","text":"同一物質原子可跨生物與環境循環","explanation":"正確。原子在不同位置與形式之間轉移，符合物質循環。"},{"id":"BIO-B01-Ch1-B051:D","text":"原子每移動一步就變成能量而消失","explanation":"錯誤。物質轉移不等於原子化成能量消失。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：依同一碳原子的去向判為物質循環；題目沒有提供能量循環的證據。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B052","topicId":"CH1-INTRO-T06","stem":"某物質循環圖只有「動物遺體→分解者」，卻漏畫生產者來源。哪項補充最直接？","correct":"BIO-B01-Ch1-B052:D","options":[{"id":"BIO-B01-Ch1-B052:A","text":"加入「太陽光→分解者」作為有機物","explanation":"錯誤。陽光是能量，不能代替有機物來源。"},{"id":"BIO-B01-Ch1-B052:B","text":"把熱箭頭改稱落葉","explanation":"錯誤。熱與落葉的物理意義不同。"},{"id":"BIO-B01-Ch1-B052:C","text":"刪掉動物遺體箭頭","explanation":"錯誤。動物遺體本來是合法來源，應補而非刪。"},{"id":"BIO-B01-Ch1-B052:D","text":"加入「植物落葉與遺體→分解者」","explanation":"正確。植物殘體也可提供分解材料。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：完整基礎示意需同時保留生產者與消費者的殘體或排出物來源。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B053","topicId":"CH1-INTRO-T06","stem":"在簡化封閉碳帳中，共追蹤80個標記碳原子，最後20個在動物、35個在植物，其餘在非生物環境，無其他去向。環境中有多少？","correct":"BIO-B01-Ch1-B053:A","options":[{"id":"BIO-B01-Ch1-B053:A","text":"25個","explanation":"正確。80−20−35＝25。"},{"id":"BIO-B01-Ch1-B053:B","text":"55個","explanation":"錯誤。55是植物與動物的合計。"},{"id":"BIO-B01-Ch1-B053:C","text":"80個","explanation":"錯誤。80是全部原子，不能全算環境。"},{"id":"BIO-B01-Ch1-B053:D","text":"135個","explanation":"錯誤。135把已包含的去向再加一次。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：依題設守住總量：環境＝總量80−動物20−植物35＝25個，沒有原子消失。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B054","topicId":"CH1-INTRO-T06","stem":"分解者將植物與動物殘體中的部分物質回到環境，但自身也利用能量並散熱。哪項判斷正確？","correct":"BIO-B01-Ch1-B054:B","options":[{"id":"BIO-B01-Ch1-B054:A","text":"分解者把熱完整變成新碳原子","explanation":"錯誤。熱不是用來直接生成碳原子的材料。"},{"id":"BIO-B01-Ch1-B054:B","text":"物質可回收與能量散出同時成立","explanation":"正確。物質去向與能量去向是不同帳目。"},{"id":"BIO-B01-Ch1-B054:C","text":"物質回收表示分解者不會散熱","explanation":"錯誤。分解者的生命活動也有能量利用。"},{"id":"BIO-B01-Ch1-B054:D","text":"分解者散熱表示物質不能回收","explanation":"錯誤。散熱不阻止化學物質回到環境。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：分別追蹤材料與能量，就不會把回收物質誤讀為回收全部可用能量。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B055","topicId":"CH1-INTRO-T06","stem":"甲循環模型要求「每個碳原子立刻回到原植物」，乙只要求「物質可經生物與環境轉移而再利用」。哪項評估合理？","correct":"BIO-B01-Ch1-B055:C","options":[{"id":"BIO-B01-Ch1-B055:A","text":"只有回到同一個體才叫循環","explanation":"錯誤。可由其他生物再利用，不限原個體。"},{"id":"BIO-B01-Ch1-B055:B","text":"兩者都要求同一分子形式永不改變","explanation":"錯誤。乙沒有該要求，分子形式也可轉換。"},{"id":"BIO-B01-Ch1-B055:C","text":"乙較符合基本概念，甲加入不必要的時間及對象限制","explanation":"正確。物質循環不要求即時回到同一個體。"},{"id":"BIO-B01-Ch1-B055:D","text":"甲正確，循環必須瞬間完成","explanation":"錯誤。循環可在不同時間尺度發生。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：物質循環說明可再利用的路徑，不是指定每個原子的固定時程與收件者。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B056","topicId":"CH1-INTRO-T06","stem":"植物吸收環境物質，動物吃植物，分解者處理殘體。若示意圖要完成一條回收路徑，最需補哪個方向？","correct":"BIO-B01-Ch1-B056:D","options":[{"id":"BIO-B01-Ch1-B056:A","text":"分解者→太陽，表示全部熱回收","explanation":"錯誤。分解者不把熱完整送回太陽。"},{"id":"BIO-B01-Ch1-B056:B","text":"植物→太陽，表示碳直接變成光","explanation":"錯誤。碳物質與光能不能如此互換。"},{"id":"BIO-B01-Ch1-B056:C","text":"非生物環境→永久消失","explanation":"錯誤。永久消失不符合物質循環。"},{"id":"BIO-B01-Ch1-B056:D","text":"分解者處理後的物質→非生物環境→植物","explanation":"正確。此方向把物質接回可再利用來源。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：將殘體處理連到環境，再連到生產者利用，就構成題設回收路徑。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B057","topicId":"CH1-INTRO-T06","stem":"一份報告把「植物吸收碳」與「植物接收光能」都稱為吸收同一種物質。最應如何修正？","correct":"BIO-B01-Ch1-B057:A","options":[{"id":"BIO-B01-Ch1-B057:A","text":"碳是物質，光能是能量，應分別追蹤","explanation":"正確。生命同時需要材料及能量，兩者不可混稱。"},{"id":"BIO-B01-Ch1-B057:B","text":"兩者都是碳原子的不同名稱","explanation":"錯誤。光能不是碳原子。"},{"id":"BIO-B01-Ch1-B057:C","text":"兩者都是熱，沒有物質差異","explanation":"錯誤。碳物質不能當成熱。"},{"id":"BIO-B01-Ch1-B057:D","text":"植物只能吸收其中一種，不可能同時需要","explanation":"錯誤。植物可以同時取得原料與能量。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：把原料輸入與能量輸入分開記錄，才不會混淆循環及流動。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B058","topicId":"CH1-INTRO-T06","stem":"某簡化碳帳有100個原子，40個進入植物、30個仍留環境、30個進入消費者。哪項結論由數據直接支持？","correct":"BIO-B01-Ch1-B058:B","options":[{"id":"BIO-B01-Ch1-B058:A","text":"消費者得到的30個證明能量完整循環","explanation":"錯誤。原子分布不能代替能量收支。"},{"id":"BIO-B01-Ch1-B058:B","text":"三個去向合計仍為100個原子","explanation":"正確。40＋30＋30＝100，符合題設追蹤總數。"},{"id":"BIO-B01-Ch1-B058:C","text":"有30個原子已變成熱而不在帳內","explanation":"錯誤。三項已合計100，未有帳外消失。"},{"id":"BIO-B01-Ch1-B058:D","text":"植物得到的40個必永遠不再移動","explanation":"錯誤。位置快照不能證明永久停留。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：先核對加總，再區分當下分布與未來流向；100個仍全在列出的去向中。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B059","topicId":"CH1-INTRO-T06","stem":"生態系中某物質可由植物直接進入分解者，也可先經動物再進分解者。哪項理解正確？","correct":"BIO-B01-Ch1-B059:C","options":[{"id":"BIO-B01-Ch1-B059:A","text":"植物直接到分解者一定是能量永久循環","explanation":"錯誤。物質路徑不會變成能量永久回收。"},{"id":"BIO-B01-Ch1-B059:B","text":"一有分岔就不可能回到環境","explanation":"錯誤。多途徑仍可連回環境。"},{"id":"BIO-B01-Ch1-B059:C","text":"物質循環可以有多條途徑","explanation":"正確。生產者殘體與消費者殘體均可回收。"},{"id":"BIO-B01-Ch1-B059:D","text":"只有經動物的才算物質循環","explanation":"錯誤。植物落葉等也可直接被分解。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：循環示意不必是一個單圈；不同來源可匯入分解與回收環節。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B060","topicId":"CH1-INTRO-T06","stem":"某系統追蹤水、碳與氮在生物及環境之間的交換，未量測能量。哪句摘要最準確？","correct":"BIO-B01-Ch1-B060:D","options":[{"id":"BIO-B01-Ch1-B060:A","text":"研究證明所有能量都循環","explanation":"錯誤。物質資料不證明能量循環。"},{"id":"BIO-B01-Ch1-B060:B","text":"只要研究三種物質就已測得熱散失","explanation":"錯誤。沒有能量量測就不能冒稱測得散熱。"},{"id":"BIO-B01-Ch1-B060:C","text":"水、碳、氮都是能量單位","explanation":"錯誤。三者是物質，不是能量單位。"},{"id":"BIO-B01-Ch1-B060:D","text":"研究物質交換與循環，不能因此斷言能量完整回收","explanation":"正確。測量對象是物質，結論應守住範圍。"}],"concept":"物質循環描述碳、水、氮等物質在生物與非生物環境之間交換。植物從環境取得原料，物質可隨取食進入消費者；生產者與消費者的死亡組織、落葉或排出物可被分解者處理，物質回到環境後可再被生產者利用。同一原子可進入不同分子與不同生物，循環不表示分子形式始終不變，也不保證所有物質立刻回到原個體。物質可回收與能量需要持續輸入可以同時成立。\n\n本題判斷：題目追蹤材料的位置和轉換，只能支持相應物質結論。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第6、10張；正文5、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B061","topicId":"CH1-INTRO-T07","stem":"假設原創模擬中，白沙背景淡色模型被發現8次、深色模型24次；深土背景淡色模型21次、深色模型7次。每組各展示40次且其他條件相同。哪項結論最合適？","correct":"BIO-B01-Ch1-B061:A","options":[{"id":"BIO-B01-Ch1-B061:A","text":"與背景相近的模型在各自背景被發現較少","explanation":"正確。白沙8小於24，深土7小於21，符合背景匹配。"},{"id":"BIO-B01-Ch1-B061:B","text":"淡色模型在所有背景都較隱蔽","explanation":"錯誤。深土淡色21次高於深色7次。"},{"id":"BIO-B01-Ch1-B061:C","text":"深色模型在所有背景都較隱蔽","explanation":"錯誤。白沙深色24次高於淡色8次。"},{"id":"BIO-B01-Ch1-B061:D","text":"資料已證明模型產生可遺傳變異","explanation":"錯誤。模型發現率未提供生物遺傳資料。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：分背景比較同分母次數，兩種背景各有不同的低發現毛色；這只是原創模擬資料。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B062","topicId":"CH1-INTRO-T07","stem":"研究者只提供「白沙淡色模型被發現5次，深色模型20次」，卻未交代兩組展示次數。哪項判斷最審慎？","correct":"BIO-B01-Ch1-B062:B","options":[{"id":"BIO-B01-Ch1-B062:A","text":"可確定毛色已經跨代改變","explanation":"錯誤。模型發現記錄未有遺傳或世代資料。"},{"id":"BIO-B01-Ch1-B062:B","text":"還需展示次數，才能比較被發現比例","explanation":"正確。分母不同可能改變比例比較。"},{"id":"BIO-B01-Ch1-B062:C","text":"可直接斷言淡色的比例一定較低","explanation":"錯誤。5次可能來自較少展示，比例未必較低。"},{"id":"BIO-B01-Ch1-B062:D","text":"可確定深色的比例為20%","explanation":"錯誤。20次除以未知次數，不能得20%。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：缺分母時只能比較事件次數，不能把次數直接當風險比例。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B063","topicId":"CH1-INTRO-T07","stem":"白沙地移除某捕食者後，研究者要判斷小鼠毛色與被捕食的關係，哪項說法合理？","correct":"BIO-B01-Ch1-B063:C","options":[{"id":"BIO-B01-Ch1-B063:A","text":"移除捕食者會立刻把所有DNA改成同型","explanation":"錯誤。成員變動不是即時定向改寫DNA。"},{"id":"BIO-B01-Ch1-B063:B","text":"沒有該捕食者便可確定所有生物互動都消失","explanation":"錯誤。仍可能有其他取食及環境互動。"},{"id":"BIO-B01-Ch1-B063:C","text":"捕食條件已變，原背景下的風險關係需重新檢查","explanation":"正確。改變系統成員可能改變毛色的作用脈絡。"},{"id":"BIO-B01-Ch1-B063:D","text":"毛色的效果一定完全不變","explanation":"錯誤。不能無證據假定風險維持原狀。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：系統關係依成員與環境而定，移除一個成員後應重新觀察相關效果。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B064","topicId":"CH1-INTRO-T07","stem":"已知植物、小鼠、猛禽三種生物都在一區，但沒有互動觀察。哪個後續資料最能把成員清單提升為關係描述？","correct":"BIO-B01-Ch1-B064:D","options":[{"id":"BIO-B01-Ch1-B064:A","text":"三者名稱的字數","explanation":"錯誤。名稱長度不是生態互動。"},{"id":"BIO-B01-Ch1-B064:B","text":"研究區招牌顏色","explanation":"錯誤。招牌顏色未被設為影響關係的因子。"},{"id":"BIO-B01-Ch1-B064:C","text":"報告的頁數","explanation":"錯誤。文件頁數不提供科學關係。"},{"id":"BIO-B01-Ch1-B064:D","text":"小鼠取食植物，猛禽捕食小鼠的觀察","explanation":"正確。取食與捕食資料直接建立成員之間的關係。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：出現哪些生物與它們如何互相影響是不同層次資料，應補具體行為關係。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B065","topicId":"CH1-INTRO-T07","stem":"某研究只在白沙背景測得淡毛較隱蔽，研究者想把結果用於深色岩地。哪項處理最好？","correct":"BIO-B01-Ch1-B065:A","options":[{"id":"BIO-B01-Ch1-B065:A","text":"在新背景重新檢驗相對可見度","explanation":"正確。背景是作用條件，改變後需新證據。"},{"id":"BIO-B01-Ch1-B065:B","text":"直接沿用，毛色優勢與背景無關","explanation":"錯誤。原結果不支持環境無關的外推。"},{"id":"BIO-B01-Ch1-B065:C","text":"先假定深色鼠都已演化成淡色","explanation":"錯誤。沒有跨代或遺傳改變資料。"},{"id":"BIO-B01-Ch1-B065:D","text":"把白沙觀察次數改寫成岩地資料","explanation":"錯誤。更改資料標籤不能取代新觀察。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：環境條件是結論的一部分；同一毛色在不同背景的效果不可直接套用。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B066","topicId":"CH1-INTRO-T07","stem":"小鼠吃植物既會影響植物，也會取得食物材料與能量。何者正確分開兩個角度？","correct":"BIO-B01-Ch1-B066:B","options":[{"id":"BIO-B01-Ch1-B066:A","text":"只要有交互作用就沒有物質轉移","explanation":"錯誤。取食互動正可伴隨物質轉移。"},{"id":"BIO-B01-Ch1-B066:B","text":"受取食影響屬交互作用；材料及能量去向屬能量與物質","explanation":"正確。同一事件有關係與轉移兩個面向。"},{"id":"BIO-B01-Ch1-B066:C","text":"兩者都必定只屬資訊","explanation":"錯誤。未以遺傳訊息或訊號內容為主要對象。"},{"id":"BIO-B01-Ch1-B066:D","text":"取得能量就代表植物不受影響","explanation":"錯誤。兩者並不互斥。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：不必選一個角度排除另一個；按照研究問題指出各自焦點。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B067","topicId":"CH1-INTRO-T07","stem":"若分析一隻鼠的生存情境，甲只量鼠的毛色，乙加記沙色、食物與捕食者。乙相對甲主要增加什麼？","correct":"BIO-B01-Ch1-B067:C","options":[{"id":"BIO-B01-Ch1-B067:A","text":"每個基因的遺傳比例","explanation":"錯誤。未提供基因傳遞資料。"},{"id":"BIO-B01-Ch1-B067:B","text":"對所有未來世代的確定答案","explanation":"錯誤。關係資料仍不能保證未來結果。"},{"id":"BIO-B01-Ch1-B067:C","text":"性狀與環境及其他生物的關係資料","explanation":"正確。新增項目建立生存的系統脈絡。"},{"id":"BIO-B01-Ch1-B067:D","text":"全部器官的分子組成","explanation":"錯誤。未量測器官分子。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：乙將個體放回所處系統，但不等於獲得全部尺度的精確資訊。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B068","topicId":"CH1-INTRO-T07","stem":"某模型在相同毛色下只改變背景，結果被發現率改變。哪項結論最直接？","correct":"BIO-B01-Ch1-B068:D","options":[{"id":"BIO-B01-Ch1-B068:A","text":"這些模型必已產生新基因","explanation":"錯誤。模型可見度不提供基因變化證據。"},{"id":"BIO-B01-Ch1-B068:B","text":"毛色從此不可能影響可見度","explanation":"錯誤。背景有作用不否定毛色可能也有作用。"},{"id":"BIO-B01-Ch1-B068:C","text":"所有捕食者在所有場景必有相同反應","explanation":"錯誤。結論只能涵蓋已測條件。"},{"id":"BIO-B01-Ch1-B068:D","text":"在這些條件下，背景影響可見度","explanation":"正確。比較固定毛色時的背景效果。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：由固定毛色比較背景，可判斷背景作用；不要跨到遺傳變化或無限外推。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B069","topicId":"CH1-INTRO-T07","stem":"研究報告稱「某小鼠獨立存在，不受食物、捕食者或物理環境影響」。以章介紹主題判斷，最大缺陷為何？","correct":"BIO-B01-Ch1-B069:A","options":[{"id":"BIO-B01-Ch1-B069:A","text":"忽略維持生命與生存的系統交互作用","explanation":"正確。生物需與周圍交換物質能量並受環境與成員影響。"},{"id":"BIO-B01-Ch1-B069:B","text":"沒有先把小鼠改稱群集","explanation":"錯誤。改名稱不能修復孤立假設。"},{"id":"BIO-B01-Ch1-B069:C","text":"沒有列出全部基因序列","explanation":"錯誤。基因序列不是此問題的必要缺件。"},{"id":"BIO-B01-Ch1-B069:D","text":"沒有保證每次都被捕食","explanation":"錯誤。捕食只是可能關係，並非每次必發生。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：基本系統視角應保留食物、其他生物及物理環境的作用，而非把個體當完全孤立。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B070","topicId":"CH1-INTRO-T07","stem":"在同樣展示100次的原創模型比較中，甲背景淡色被發現10次，乙背景淡色被發現30次。只根據此資料可以說什麼？","correct":"BIO-B01-Ch1-B070:B","options":[{"id":"BIO-B01-Ch1-B070:A","text":"每個真實小鼠的繁殖數都已確定","explanation":"錯誤。模型發現比例不是繁殖數。"},{"id":"BIO-B01-Ch1-B070:B","text":"相同淡色模型在兩背景的被發現比例不同","explanation":"正確。10%與30%顯示背景間可見度差異。"},{"id":"BIO-B01-Ch1-B070:C","text":"淡色模型在甲背景較深色模型安全","explanation":"錯誤。沒有深色模型資料，不能作該比較。"},{"id":"BIO-B01-Ch1-B070:D","text":"乙背景使淡色基因頻率上升","explanation":"錯誤。沒有基因頻率或世代資料。"}],"concept":"交互作用是系統成員之間，以及生物與非生物環境之間的相互影響。取食、捕食，以及背景顏色影響獵物被發現的機會，都可用這個角度研究。捕食者和獵物是生物成員，光線、沙土及水等是非生物環境。物質與能量可經取食關係移動，因此同一事件也能用能量與物質主題分析。判斷時應說明特定關係；僅列出成員名稱，尚未描述它們如何相互影響。\n\n本題判斷：相同分母下10/100與30/100可比較；結論限定淡色模型的兩背景差異。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；9 頁（PDF 51；58 頁）｜本節筆記 正式第3、4、6張；正文2、3、5/10","shuffle":true},{"id":"BIO-B01-Ch1-B071","topicId":"CH1-INTRO-T08","stem":"某地小鼠族群兩代總數皆為100隻；普查發現，可遺傳淡毛性狀由第一代20隻變成第二代35隻。哪個描述符合資料？","correct":"BIO-B01-Ch1-B071:C","options":[{"id":"BIO-B01-Ch1-B071:A","text":"每隻第一代小鼠都已變淡","explanation":"錯誤。群體比例改變不表示每個個體改色。"},{"id":"BIO-B01-Ch1-B071:B","text":"資料證明全部變化必由自然選擇造成","explanation":"錯誤。比例改變本身不識別唯一機制。"},{"id":"BIO-B01-Ch1-B071:C","text":"淡毛比例由20%增至35%，增加15個百分點","explanation":"正確。同分母計得20%與35%，差15個百分點。"},{"id":"BIO-B01-Ch1-B071:D","text":"淡毛比例增加了35個百分點","explanation":"錯誤。35%是第二代比例，不是增幅。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：可遺傳性及世代比較符合演化尺度；計算35−20＝15個百分點，但原因仍需證據。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B072","topicId":"CH1-INTRO-T08","stem":"某族群第一代共200隻，其中40隻淡毛；第二代共100隻，其中30隻淡毛，且差異可遺傳。哪項敘述正確？","correct":"BIO-B01-Ch1-B072:D","options":[{"id":"BIO-B01-Ch1-B072:A","text":"淡毛數量下降，所以比例必下降","explanation":"錯誤。分母同時下降，不能只看分子。"},{"id":"BIO-B01-Ch1-B072:B","text":"兩代淡毛比例都為40%","explanation":"錯誤。兩個實際比例均非40%。"},{"id":"BIO-B01-Ch1-B072:C","text":"第二代30隻表示所有個體都變淡","explanation":"錯誤。30/100仍不是所有個體。"},{"id":"BIO-B01-Ch1-B072:D","text":"淡毛數量下降，但比例由20%升至30%","explanation":"正確。40/200＝20%，30/100＝30%，須區分數量與比例。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：先分別計算每代比例，才能辨認數量減少與比例增加可以同時發生。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B073","topicId":"CH1-INTRO-T08","stem":"一隻鼠曬後外觀改變，另有族群的可遺傳毛色比例連續數代改變。哪項比較最恰當？","correct":"BIO-B01-Ch1-B073:A","options":[{"id":"BIO-B01-Ch1-B073:A","text":"後者符合演化尺度，前者單獨不足以證明演化","explanation":"正確。後者具備族群、遺傳性和世代資料。"},{"id":"BIO-B01-Ch1-B073:B","text":"前者是演化，後者只是成長","explanation":"錯誤。把個體狀態與族群世代變化顛倒。"},{"id":"BIO-B01-Ch1-B073:C","text":"只要外觀變就都一定是演化","explanation":"錯誤。外觀變化可能由非遺傳原因造成。"},{"id":"BIO-B01-Ch1-B073:D","text":"兩者都不可能涉及生物學","explanation":"錯誤。兩種現象都可由生物學研究。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：比較對象與時間尺度，再確認是否涉及可遺傳差異；不能只抓「變」字判斷。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B074","topicId":"CH1-INTRO-T08","stem":"兩種生物具有共同基本特徵，其他性狀有差異。哪項說法與演化的統一性、多樣性觀念相容？","correct":"BIO-B01-Ch1-B074:B","options":[{"id":"BIO-B01-Ch1-B074:A","text":"每個共同特徵都必由當代同一食物造成","explanation":"錯誤。無法將一切共同性歸到同一食物。"},{"id":"BIO-B01-Ch1-B074:B","text":"可由共同繼承及後續累積改變共同解釋","explanation":"正確。繼承留下共同基礎，演化可增加差異。"},{"id":"BIO-B01-Ch1-B074:C","text":"共有特徵要求所有其他特徵也相同","explanation":"錯誤。共享部分特徵不代表全部一致。"},{"id":"BIO-B01-Ch1-B074:D","text":"任何差異都證明完全無親緣","explanation":"錯誤。差異不能直接否定共同祖先。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：共同性和差異性可同時存在，並可放入一段傳承與改變的歷史理解。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B075","topicId":"CH1-INTRO-T08","stem":"某可遺傳性狀在兩代均占40%，但族群總數由100增至200。只根據這一性狀，哪項結論正確？","correct":"BIO-B01-Ch1-B075:C","options":[{"id":"BIO-B01-Ch1-B075:A","text":"比例應由40%自動變成80%","explanation":"錯誤。題設明示均為40%。"},{"id":"BIO-B01-Ch1-B075:B","text":"已證明所有其他性狀都不會演化","explanation":"錯誤。只測一性狀不能替所有特徵下結論。"},{"id":"BIO-B01-Ch1-B075:C","text":"未觀察到其比例改變，不能以總數增加證明此性狀演化","explanation":"正確。總數變化與可遺傳性狀比例變化不同。"},{"id":"BIO-B01-Ch1-B075:D","text":"總數加倍就表示性狀比例加倍","explanation":"錯誤。分母分子若同倍增加，比例不變。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：第一代40/100、第二代80/200皆40%；只有總量增加，不是所測性狀比例改變。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B076","topicId":"CH1-INTRO-T08","stem":"第一代可遺傳深毛比例為70%，第二代為55%。何者正確描述且不過度推論？","correct":"BIO-B01-Ch1-B076:D","options":[{"id":"BIO-B01-Ch1-B076:A","text":"每隻深毛鼠都變成淡毛鼠","explanation":"錯誤。群體比例變化不等於同一個體改色。"},{"id":"BIO-B01-Ch1-B076:B","text":"下降15%必表示所有DNA已改寫","explanation":"錯誤。70%降至55%是下降15個百分點，不是相對下降15%；更不代表全部DNA改變。"},{"id":"BIO-B01-Ch1-B076:C","text":"比例下降證明天擇是唯一可能機制","explanation":"錯誤。不能把任何改變都自動歸於天擇。"},{"id":"BIO-B01-Ch1-B076:D","text":"深毛比例下降15個百分點，但尚需證據判定機制","explanation":"正確。70−55＝15個百分點，比例資料未識別機制。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：先算差值，再將演化尺度判讀和具體機制判定分開。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B077","topicId":"CH1-INTRO-T08","stem":"小鼠群體有20隻淡毛、80隻深毛。若只觀察這一次，且沒有過去或後代資料，哪項最合理？","correct":"BIO-B01-Ch1-B077:A","options":[{"id":"BIO-B01-Ch1-B077:A","text":"可描述當下差異，尚不能由單次快照證明跨代變化","explanation":"正確。一次觀察給出組成，未給世代變化。"},{"id":"BIO-B01-Ch1-B077:B","text":"已證明淡毛比例必定正在上升","explanation":"錯誤。上升需要至少可比較的不同世代資料。"},{"id":"BIO-B01-Ch1-B077:C","text":"已證明每隻深毛鼠曾為淡毛","explanation":"錯誤。個體歷史不在資料中。"},{"id":"BIO-B01-Ch1-B077:D","text":"已知道下一代的確切比例","explanation":"錯誤。當下比例不能自動預測確切後代。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：先確認這是單一時間的20%，不能把存在變異直接當成已觀察演化。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B078","topicId":"CH1-INTRO-T08","stem":"若兩族群有共同祖先，但今天生活在不同環境且性狀不同，哪個研究方向最符合演化主題？","correct":"BIO-B01-Ch1-B078:B","options":[{"id":"BIO-B01-Ch1-B078:A","text":"把所有差異都改稱當日生長","explanation":"錯誤。跨代遺傳差異不能一概化為日常生長。"},{"id":"BIO-B01-Ch1-B078:B","text":"比較可遺傳差異如何在各族群世代間累積","explanation":"正確。焦點是遺傳差異及其族群歷史。"},{"id":"BIO-B01-Ch1-B078:C","text":"只問每隻個體希望變成哪一型","explanation":"錯誤。願望不能代替族群遺傳變化。"},{"id":"BIO-B01-Ch1-B078:D","text":"假定共同祖先不存在而停止查證","explanation":"錯誤。性狀差異不自動否定共同來源。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：共同來源和不同環境提示可研究繼承及後續改變，仍需資料支持具體歷史。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B079","topicId":"CH1-INTRO-T08","stem":"學生把「同一隻鼠由幼年長到成年」與「族群可遺傳毛色比例經數代改變」都稱為演化。應如何修正？","correct":"BIO-B01-Ch1-B079:C","options":[{"id":"BIO-B01-Ch1-B079:A","text":"前者才是演化，後者是個體發育","explanation":"錯誤。將個體與族群尺度顛倒。"},{"id":"BIO-B01-Ch1-B079:B","text":"兩者都必須由個體意願造成","explanation":"錯誤。兩種現象都不以意願為必要原因。"},{"id":"BIO-B01-Ch1-B079:C","text":"前者為個體生長，後者屬演化尺度","explanation":"正確。成長與族群遺傳變化的對象及時間尺度不同。"},{"id":"BIO-B01-Ch1-B079:D","text":"兩者都只能稱為能量循環","explanation":"錯誤。兩者不是能量循環的描述。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：關鍵不是變化幅度，而是變化發生在個體一生或族群世代。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B080","topicId":"CH1-INTRO-T08","stem":"某族群可遺傳淡毛比例從第一代25%升為第二代40%，研究者稱「已觀察到演化，但單靠比例仍不知原因」。哪項評估正確？","correct":"BIO-B01-Ch1-B080:D","options":[{"id":"BIO-B01-Ch1-B080:A","text":"只要不知道原因就不能觀察到比例變化","explanation":"錯誤。現象可先被觀察，原因仍待檢驗。"},{"id":"BIO-B01-Ch1-B080:B","text":"比例變化自動證明所有變化由天擇造成","explanation":"錯誤。其他機制未被這份資料排除。"},{"id":"BIO-B01-Ch1-B080:C","text":"演化只涉及物種數，與族群比例無關","explanation":"錯誤。族群可遺傳特徵變化本是演化尺度。"},{"id":"BIO-B01-Ch1-B080:D","text":"對演化尺度與機制證據作了合理區分","explanation":"正確。可遺傳比例跨代變化與其成因可分開研究。"}],"concept":"演化描述族群可遺傳特徵或遺傳組成在世代之間的改變。個體一生中的生長、暫時生理反應或外表沾染，不等於族群演化。共同祖先及繼承的基本特徵可解釋生命的統一性；族群在不同環境與漫長時間中累積差異，可解釋多樣性。共享祖先不要求今天所有後代都完全相同，具有差異也不直接否定共同祖先。演化的基本判讀需要交代族群、可遺傳性及世代尺度。\n\n本題判斷：觀察現象與解釋機制不是同一驗證步驟；題設只支持前者及比例變化。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第2、7、10、11張；正文1、6、9、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B081","topicId":"CH1-INTRO-T09","stem":"原創簡化情境中，深淺毛色可遺傳；在白沙環境，淡毛親代平均留下4個可繁殖後代，深毛親代平均留下2個。環境及其他條件維持時，哪項方向最合理？","correct":"BIO-B01-Ch1-B081:A","options":[{"id":"BIO-B01-Ch1-B081:A","text":"淡毛相關性狀可能在後續世代變常見","explanation":"正確。淡毛親代的相對繁殖貢獻較大，可推可能趨勢。"},{"id":"BIO-B01-Ch1-B081:B","text":"深毛一定因個體需要而立即變淡","explanation":"錯誤。天擇是差異繁殖，不是每個個體改色。"},{"id":"BIO-B01-Ch1-B081:C","text":"兩型繁殖貢獻相同","explanation":"錯誤。4與2明確不同。"},{"id":"BIO-B01-Ch1-B081:D","text":"淡毛必定只需一代就達100%","explanation":"錯誤。資料不保證一代固定，也未給完整遺傳模型。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：比較4對2的相對後代貢獻，結合可遺傳性只推方向，不臆造確切下一代比例。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B082","topicId":"CH1-INTRO-T09","stem":"兩型毛色可遺傳，在白沙淡毛平均留下較多後代，在深土深毛平均留下較多後代。哪項理解正確？","correct":"BIO-B01-Ch1-B082:B","options":[{"id":"BIO-B01-Ch1-B082:A","text":"兩地不同就表示毛色不可遺傳","explanation":"錯誤。環境效果不同不否定遺傳性。"},{"id":"BIO-B01-Ch1-B082:B","text":"天擇優勢隨環境而變","explanation":"正確。題設顯示不同背景對兩型有不同效果。"},{"id":"BIO-B01-Ch1-B082:C","text":"淡毛必定在所有地方有固定優勢","explanation":"錯誤。與深土深毛優勢矛盾。"},{"id":"BIO-B01-Ch1-B082:D","text":"天擇先讓每個個體取得相同毛色才作用","explanation":"錯誤。天擇需要差異，不先抹去差異。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：將有利性綁定當地條件，不能把某毛色排為普遍較進步。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B083","topicId":"CH1-INTRO-T09","stem":"某毛色變化完全由可洗去染料造成，題設不遺傳；雖暫時降低被發現率，為何仍不能據此推定後代毛色經天擇改變？","correct":"BIO-B01-Ch1-B083:C","options":[{"id":"BIO-B01-Ch1-B083:A","text":"只要外表變化就必傳給後代","explanation":"錯誤。外表的環境處理不必遺傳。"},{"id":"BIO-B01-Ch1-B083:B","text":"只有DNA相同的個體才可有天擇","explanation":"錯誤。天擇相關差異可以有遺傳基礎，不能要求全同。"},{"id":"BIO-B01-Ch1-B083:C","text":"缺少可傳至後代的性狀差異","explanation":"正確。題設明確排除了遺傳性，跨代鏈條未成立。"},{"id":"BIO-B01-Ch1-B083:D","text":"降低被發現率永遠不可能影響生存","explanation":"錯誤。隱蔽效果可能影響生存，但遺傳條件另需滿足。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：暫時生存效果與可遺傳改變是分開條件；不能用前者代替後者。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B084","topicId":"CH1-INTRO-T09","stem":"一種可遺傳毛色使小鼠較常活到老年，但題設兩型一生平均留下的可繁殖後代完全相同。只憑長壽能推出什麼？","correct":"BIO-B01-Ch1-B084:D","options":[{"id":"BIO-B01-Ch1-B084:A","text":"長壽型一定每代比例翻倍","explanation":"錯誤。未有差異繁殖貢獻支持倍增。"},{"id":"BIO-B01-Ch1-B084:B","text":"長壽自動令該基因傳遞率變100%","explanation":"錯誤。長壽不直接改寫單次遺傳規則。"},{"id":"BIO-B01-Ch1-B084:C","text":"兩型後代數相同就表示毛色不能遺傳","explanation":"錯誤。題設已指出可遺傳，後代數是另一條件。"},{"id":"BIO-B01-Ch1-B084:D","text":"不能單憑長壽斷定該毛色有較高繁殖貢獻","explanation":"正確。演化上的貢獻重在後代，題設兩型相同。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：對照的是繁殖貢獻而非壽命排行；本例不能靠長壽單獨建立天擇優勢。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B085","topicId":"CH1-INTRO-T09","stem":"若要用天擇解釋淡毛比例上升，哪組證據最完整？","correct":"BIO-B01-Ch1-B085:A","options":[{"id":"BIO-B01-Ch1-B085:A","text":"原有可遺傳差異、淡毛相對留下較多後代、後續世代比例上升","explanation":"正確。三個環節連接變異、篩選及族群結果。"},{"id":"BIO-B01-Ch1-B085:B","text":"只有某隻鼠想變淡及當天外觀","explanation":"錯誤。願望與單次外觀不建立遺傳鏈。"},{"id":"BIO-B01-Ch1-B085:C","text":"只有土壤顏色與研究者偏好","explanation":"錯誤。偏好不是生存繁殖證據。"},{"id":"BIO-B01-Ch1-B085:D","text":"只有一次拍到淡毛鼠","explanation":"錯誤。一次出現只能顯示存在，不能顯示變化原因。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：按「可遺傳差異→差異繁殖貢獻→跨代比例變化」核對，才能形成有依據的天擇說明。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B086","topicId":"CH1-INTRO-T09","stem":"學生寫道：「有利基因因此更想傳給下一代。」哪項修正最準確？","correct":"BIO-B01-Ch1-B086:B","options":[{"id":"BIO-B01-Ch1-B086:A","text":"只要有利，單次遺傳規則就自動改變","explanation":"錯誤。天擇不等於直接改變基因傳遞規則。"},{"id":"BIO-B01-Ch1-B086:B","text":"帶有有利可遺傳性狀的個體可能留下較多後代","explanation":"正確。天擇改變相對後代貢獻，不靠基因意願。"},{"id":"BIO-B01-Ch1-B086:C","text":"基因會先判断環境再決定是否遺傳","explanation":"錯誤。基因沒有此目的性決策機制。"},{"id":"BIO-B01-Ch1-B086:D","text":"每個有利基因都必定只出現於唯一後代","explanation":"錯誤。不存在題設所說的唯一後代限制。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：把擬人化意願改寫為可觀察的差異繁殖成功，才能避免錯誤因果。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B087","topicId":"CH1-INTRO-T09","stem":"環境由白沙改為深色背景，族群原有深淺兩種可遺傳毛色。若深毛較難被發現且相對留下較多後代，合理預期為何？","correct":"BIO-B01-Ch1-B087:C","options":[{"id":"BIO-B01-Ch1-B087:A","text":"深毛變常見表示沒有使用原有變異","explanation":"錯誤。題設正說明原有可遺傳差異被篩選。"},{"id":"BIO-B01-Ch1-B087:B","text":"白沙曾利淡毛，故新環境永遠仍利淡毛","explanation":"錯誤。優勢可隨環境改變。"},{"id":"BIO-B01-Ch1-B087:C","text":"深毛可能在後續世代變常見","explanation":"正確。原有深毛差異在新環境有較高貢獻，可上升。"},{"id":"BIO-B01-Ch1-B087:D","text":"所有淡毛個體當天必主動變深","explanation":"錯誤。不要求每個個體即時改變。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：將新背景、可見度、後代貢獻連起來，只預期趨勢，不說立即全變。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B088","topicId":"CH1-INTRO-T09","stem":"兩型小鼠毛色可遺傳。淡毛被捕食較少，但題目未提供繁殖資料。哪個結論保持必要界限？","correct":"BIO-B01-Ch1-B088:D","options":[{"id":"BIO-B01-Ch1-B088:A","text":"已算出下一代淡毛一定占90%","explanation":"錯誤。沒有遺傳與繁殖數據支持90%。"},{"id":"BIO-B01-Ch1-B088:B","text":"已證明全部深毛個體都沒有後代","explanation":"錯誤。風險較高不等於所有個體無後代。"},{"id":"BIO-B01-Ch1-B088:C","text":"已經知道每次遺傳的確切比例","explanation":"錯誤。可遺傳不提供具體遺傳模式。"},{"id":"BIO-B01-Ch1-B088:D","text":"已有生存差異線索，跨代天擇效果仍需確認繁殖貢獻","explanation":"正確。生存優勢與後代貢獻需要連接。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：已知一個天擇環節不代表全部鏈條完成；補查後代貢獻而不臆算比例。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B089","topicId":"CH1-INTRO-T09","stem":"某可遺傳性狀比例跨代改變，但不同性狀者的生存及繁殖差異都未測量。應如何評估「一定是天擇」？","correct":"BIO-B01-Ch1-B089:A","options":[{"id":"BIO-B01-Ch1-B089:A","text":"證據不足，尚未建立性狀與差異成功的連結","explanation":"正確。機制判定需更多關於差異成功的證據。"},{"id":"BIO-B01-Ch1-B089:B","text":"正確，所有跨代改變都只有天擇一種原因","explanation":"錯誤。演化並不只有天擇一種機制。"},{"id":"BIO-B01-Ch1-B089:C","text":"錯誤，因為可遺傳比例永遠不能變","explanation":"錯誤。可遺傳比例跨代變化正可發生。"},{"id":"BIO-B01-Ch1-B089:D","text":"正確，只要研究者使用天擇這個詞","explanation":"錯誤。術語不能代替資料。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：觀察到演化尺度的改變仍不自動識別机制，需補上本例天擇的關鍵因果環節。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B090","topicId":"CH1-INTRO-T09","stem":"原創簡化模型中，只計母鼠，每隻幼鼠只計入其母鼠所屬群；甲、乙兩型可遺傳性狀的母鼠各50隻，甲型每隻平均留下3個可繁殖後代，乙型每隻平均留下1個。若只比較親代群體的後代貢獻，哪項正確？","correct":"BIO-B01-Ch1-B090:B","options":[{"id":"BIO-B01-Ch1-B090:A","text":"甲群200個、乙群200個","explanation":"錯誤。兩群總貢獻不同，且各200無依據。"},{"id":"BIO-B01-Ch1-B090:B","text":"甲群150個、乙群50個，甲為乙的3倍","explanation":"正確。50×3＝150，50×1＝50，比值3。"},{"id":"BIO-B01-Ch1-B090:C","text":"甲群50個、乙群150個","explanation":"錯誤。把兩型繁殖數顛倒。"},{"id":"BIO-B01-Ch1-B090:D","text":"甲群3個、乙群1個，不需乘親代數","explanation":"錯誤。這是每隻親代平均值，題問群體需乘50。"}],"concept":"自然選擇造成族群改變的基本鏈條是：族群原有可遺傳差異；在特定環境中，差異使個體有不同的生存或繁殖成功；較能留下後代的性狀可能在之後世代變得常見。被捕食風險降低只有連到繁殖貢獻，才能完整支持跨世代影響。環境篩選變異，不是依個體願望製造所需性狀；有利與否取決於當地環境。天擇是演化的機制之一，不能由任何比例變化一律斷定天擇。\n\n本題判斷：只計親代群體後代貢獻150與50；不把它直接當作後代性狀比例，因題目未給完整遺傳規則。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 2；14–15 頁（PDF 51；63–64 頁）｜本節筆記 正式第3、7、10張；正文2、6、9/10","shuffle":true},{"id":"BIO-B01-Ch1-B091","topicId":"CH1-INTRO-T10","stem":"假說為「某植物缺水會降低生長量」。若要由此形成可檢驗預測，哪項最合適？","correct":"BIO-B01-Ch1-B091:C","options":[{"id":"BIO-B01-Ch1-B091:A","text":"只有研究者相信時才會出現結果","explanation":"錯誤。信念不構成題設可量測條件。"},{"id":"BIO-B01-Ch1-B091:B","text":"直接宣告所有植物已永遠證明如此","explanation":"錯誤。假說尚需檢驗，也不能無限外推。"},{"id":"BIO-B01-Ch1-B091:C","text":"在其他影響條件相同時，缺水組生長量應低於供水組","explanation":"正確。把原因與可量測差異相連。"},{"id":"BIO-B01-Ch1-B091:D","text":"任何組別長得如何都表示假說正確","explanation":"錯誤。無論結果都成立會失去檢驗性。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：由缺水解釋推得「缺水組生長較低」的條件性預測，觀察後才評估支持程度。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B092","topicId":"CH1-INTRO-T10","stem":"原創假設資料：同種植物分為兩組，各10株；其他條件相同，甲每天供水、乙減少供水。在同樣7天觀察期內，平均生長量甲6 mm、乙3 mm。這對「缺水降低生長」假說提供什麼？","correct":"BIO-B01-Ch1-B092:D","options":[{"id":"BIO-B01-Ch1-B092:A","text":"已永遠證明所有物種均如此","explanation":"錯誤。只測此條件與物種，不能推廣全部。"},{"id":"BIO-B01-Ch1-B092:B","text":"證明缺水組完全沒有生長","explanation":"錯誤。乙仍有3 mm生長。"},{"id":"BIO-B01-Ch1-B092:C","text":"證明植物不需要其他條件","explanation":"錯誤。其他條件被控制不代表不重要。"},{"id":"BIO-B01-Ch1-B092:D","text":"本次結果支持預測，仍可繼續檢驗","explanation":"正確。3小於6，方向符合預測；支持仍有範圍。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：比較同條件兩組平均，3 mm低於6 mm，支持本次預測而非永久普遍證明。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B093","topicId":"CH1-INTRO-T10","stem":"假說預測處理會使生長量增加，但本次可靠資料顯示處理與未處理平均相同。最合適的下一步為何？","correct":"BIO-B01-Ch1-B093:A","options":[{"id":"BIO-B01-Ch1-B093:A","text":"檢查假說適用條件，必要時修正再檢驗","explanation":"正確。不一致提示需評估前提與解釋。"},{"id":"BIO-B01-Ch1-B093:B","text":"直接把相同數值改成增加","explanation":"錯誤。改數據會破壞真實檢驗。"},{"id":"BIO-B01-Ch1-B093:C","text":"宣告相同與增加完全同義","explanation":"錯誤。相同不符合題設增加的預測。"},{"id":"BIO-B01-Ch1-B093:D","text":"以研究者資歷推翻所有數據","explanation":"錯誤。資歷不能替代可靠資料。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：本次結果未支持預期增加；可以查條件與測量，但不能先改寫觀察來維持假說。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B094","topicId":"CH1-INTRO-T10","stem":"某假說聲稱「任何能觀察的結果都不可能使它受到質疑」。按可檢驗性判準，主要問題為何？","correct":"BIO-B01-Ch1-B094:B","options":[{"id":"BIO-B01-Ch1-B094:A","text":"研究者尚未畫彩色圖","explanation":"錯誤。圖的色彩不能取代判準。"},{"id":"BIO-B01-Ch1-B094:B","text":"缺少能藉觀察區分支持或不支持的方式","explanation":"正確。排除一切可能反證，使資料無法評估說法。"},{"id":"BIO-B01-Ch1-B094:C","text":"句子不夠長","explanation":"錯誤。文字長度與可檢驗性無必然關係。"},{"id":"BIO-B01-Ch1-B094:D","text":"沒有使用複雜儀器的名字","explanation":"錯誤。簡單觀察也可檢驗假說。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：可檢驗性取決於資料是否能影響結論，不取決於術語或版面複雜度。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B095","topicId":"CH1-INTRO-T10","stem":"甲為「為什麼植物生長變慢？」乙為「可能是水分不足」。丙為「若如此，補水且其他條件相同後生長應改善」。三者角色依序為何？","correct":"BIO-B01-Ch1-B095:C","options":[{"id":"BIO-B01-Ch1-B095:A","text":"資料、問題、定律","explanation":"錯誤。三句都不是已取得資料或定律。"},{"id":"BIO-B01-Ch1-B095:B","text":"假說、預測、永久證明","explanation":"錯誤。丙未被測試，更不是永久證明。"},{"id":"BIO-B01-Ch1-B095:C","text":"問題、假說、預測","explanation":"正確。甲提問，乙給可能原因，丙給條件性結果。"},{"id":"BIO-B01-Ch1-B095:D","text":"預測、資料、假說","explanation":"錯誤。尚未記錄實測資料，且甲為問題。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：用每句在推理中的功能辨認：問原因→提解釋→推預期觀察。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B096","topicId":"CH1-INTRO-T10","stem":"兩個不同假說都能預測相同的觀察結果。當該結果出現，哪項判斷最合理？","correct":"BIO-B01-Ch1-B096:D","options":[{"id":"BIO-B01-Ch1-B096:A","text":"第一個寫出的假說必定真","explanation":"錯誤。提出順序不是驗證依據。"},{"id":"BIO-B01-Ch1-B096:B","text":"兩個假說都已永遠被證明","explanation":"錯誤。符合一次預測不等於永久證明。"},{"id":"BIO-B01-Ch1-B096:C","text":"刪掉其中一個名稱就已完成檢驗","explanation":"錯誤。修改文件不等於新增科學證據。"},{"id":"BIO-B01-Ch1-B096:D","text":"結果不能單獨選出唯一假說，需尋找可區分的預測","explanation":"正確。共同預測不能區分不同解釋。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：觀察可同時相容兩種解釋，下一步應找其預測不同的可檢查條件。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B097","topicId":"CH1-INTRO-T10","stem":"研究者先提出預測、測量後發現不一致，再修正假說並重新觀察。哪項評估最恰當？","correct":"BIO-B01-Ch1-B097:A","options":[{"id":"BIO-B01-Ch1-B097:A","text":"符合依證據反覆改進解釋的探究","explanation":"正確。可靠新證據可以促成修正及後續檢驗。"},{"id":"BIO-B01-Ch1-B097:B","text":"一經修正就不再屬科學","explanation":"錯誤。修正是科學探究的正常部分。"},{"id":"BIO-B01-Ch1-B097:C","text":"假說必須永不改變才可靠","explanation":"錯誤。僵化保持不等於可靠。"},{"id":"BIO-B01-Ch1-B097:D","text":"重複觀察一定沒有價值","explanation":"錯誤。新觀察可檢驗修改後的預測。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：探究不是只走一次固定直線，資料可帶回新的問題與修正。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B098","topicId":"CH1-INTRO-T10","stem":"一份實驗報告只寫「結果與預測一致」，未交代預測內容及測量條件。對讀者而言最直接缺少什麼？","correct":"BIO-B01-Ch1-B098:B","options":[{"id":"BIO-B01-Ch1-B098:A","text":"把支持改為永久證明的措辭","explanation":"錯誤。強化措辭不能代替證據。"},{"id":"BIO-B01-Ch1-B098:B","text":"可檢查結果是否真正符合預測的具體內容","explanation":"正確。需知道預測、條件與結果才能核對推論。"},{"id":"BIO-B01-Ch1-B098:C","text":"研究者喜歡的顏色","explanation":"錯誤。偏好無法補足推理資料。"},{"id":"BIO-B01-Ch1-B098:D","text":"更長的標題","explanation":"錯誤。標題長度不提升可查核性。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：將可評估的預測及條件寫清楚，才能讓支持結論接受檢查。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B099","topicId":"CH1-INTRO-T10","stem":"原創假設資料：預測同種植物在甲供水條件下的7天平均生長量應高於乙供水條件；兩組其他條件相同。設觀察結果為甲12 mm、乙8 mm。何者正確且保留科學界限？","correct":"BIO-B01-Ch1-B099:C","options":[{"id":"BIO-B01-Ch1-B099:A","text":"乙的8 mm等於沒有反應","explanation":"錯誤。8不是0。"},{"id":"BIO-B01-Ch1-B099:B","text":"有數字就不需交代甲乙條件","explanation":"錯誤。數字意義仍依條件與量測對象。"},{"id":"BIO-B01-Ch1-B099:C","text":"12大於8，方向符合本次預測，但仍不排除其他解釋","explanation":"正確。先比較方向，再保留替代解釋及條件限制。"},{"id":"BIO-B01-Ch1-B099:D","text":"兩數相差4，所以所有其他解釋都已被證偽","explanation":"錯誤。差值不是自動排除其他機制的證據。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：計算12−8＝4 mm，甲較高符合預測；只能給相應支持，不能推唯一或永久真理。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true},{"id":"BIO-B01-Ch1-B100","topicId":"CH1-INTRO-T10","stem":"研究者說：「我的解釋可被檢驗，但尚未蒐集資料。」目前最準確的狀態為何？","correct":"BIO-B01-Ch1-B100:D","options":[{"id":"BIO-B01-Ch1-B100:A","text":"只要可檢驗就已被證明","explanation":"錯誤。能測試不等於已經測試成功。"},{"id":"BIO-B01-Ch1-B100:B","text":"沒有資料就表示假說必定錯","explanation":"錯誤。尚缺資料不是反證。"},{"id":"BIO-B01-Ch1-B100:C","text":"提出預測等於已完成實際觀察","explanation":"錯誤。預期結果不是實測結果。"},{"id":"BIO-B01-Ch1-B100:D","text":"已有可檢驗假說，尚不能宣稱本次資料支持它","explanation":"正確。可檢驗性與已有證據是不同門檻。"}],"concept":"科學探究從觀察或問題出發，提出可能解釋的假說，再推得可觀察的預測，蒐集資料核對。假說說明可能原因，預測說明若假說及題設條件成立，預期觀察什麼結果。可檢驗性要求存在能評估該說法的觀察或實驗。結果符合預測會支持假說，但不能保證它是唯一解釋或永遠正確；相反資料出現時應查核資料與前提，必要時修正或放棄假說，再繼續檢驗。\n\n本題判斷：先辨認說法具備檢驗可能，再如實區分尚未取證；不能把計畫當作支持證據。","example":"","source":"Campbell Biology 12e｜Chapter 1 章介紹；後續頁僅核實本節已教主張｜印刷 16–18 頁（PDF 65–67 頁）｜本節筆記 正式第8、11張；正文7、10/10","shuffle":true}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"bio-chapter-01-concept-1-1-intro","title":"Ch1.1 概念介紹：概念1.1 生命的研究揭示出生物學中彼此統整的核心主題","version":"B01-v2-20260911:73e9f2b4d830888875a0","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["Campbell Biology 12e｜第一輪","Ch1 演化、生物學主題與科學探究","Ch1.1 生命的統整主題"],"comparison":{"status":"BASELINE","reason":"中國醫為主要題庫及唯一比對基準。"},"banks":[{"depth":"掃過","target":50,"questions":[{"id":"BIO-B01-Ch1.1-S001","topicId":"BIO-C1.1I-LIFE","stem":"下列哪個研究問題屬於生物學的核心範圍？","correct":"BIO-B01-Ch1.1-S001:B","options":[{"id":"BIO-B01-Ch1.1-S001:A","text":"金屬橋梁能承受多少重量","explanation":"此項主要研究材料力學，題意沒有生命過程。"},{"id":"BIO-B01-Ch1.1-S001:B","text":"幼苗如何形成葉片並維持生命活動","explanation":"此項研究生長發育及生命維持，符合生物學。"},{"id":"BIO-B01-Ch1.1-S001:C","text":"石材受力後何時斷裂","explanation":"此項是岩石材料受力問題，不是題設的生命研究。"},{"id":"BIO-B01-Ch1.1-S001:D","text":"汽車輪胎如何減少磨損","explanation":"此項主要研究機械材料性能；會移動的汽車不因此成為生命。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：幼苗的構造形成與維持涉及生命過程，正是生物學可研究的對象。研究尺度可大可小，不限於列出生物名稱。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S002","topicId":"BIO-C1.1I-LIFE","stem":"玩具車可前進，盆栽留在原處長出新葉。對這兩項觀察，下列判斷何者正確？","correct":"BIO-B01-Ch1.1-S002:C","options":[{"id":"BIO-B01-Ch1.1-S002:A","text":"移動速度足以區分生命與非生命","explanation":"速度描述運動，不能單獨證明生命活動。"},{"id":"BIO-B01-Ch1.1-S002:B","text":"留在原地的對象必然沒有生命","explanation":"植物可固定原地而持續生長發育。"},{"id":"BIO-B01-Ch1.1-S002:C","text":"是否整體位移不能單獨作生命判準","explanation":"兩個對照例子顯示位移與生命不能畫等號。"},{"id":"BIO-B01-Ch1.1-S002:D","text":"能長出葉片表示植物必有移動意圖","explanation":"形成葉片是發育，不足以推定意識或意圖。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：玩具車的移動說明非生命也可位移；盆栽的發育說明生命活動不必伴隨整體位移。兩例共同排除以位移作唯一標準。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S003","topicId":"BIO-C1.1I-LIFE","stem":"關於生命的常見性質，下列哪組全部屬於生命活動的判斷線索？","correct":"BIO-B01-Ch1.1-S003:D","options":[{"id":"BIO-B01-Ch1.1-S003:A","text":"體積大、顏色亮、速度快","explanation":"大小、顏色與速度可見於非生命物，不能取代生命活動。"},{"id":"BIO-B01-Ch1.1-S003:B","text":"質地硬、有稜角、會反光","explanation":"硬度、稜角與反光是物理外觀，生命不以此為共同性質。"},{"id":"BIO-B01-Ch1.1-S003:C","text":"能發聲、能漂浮、能導電","explanation":"非生命物也能發聲、漂浮及導電，這組不足以辨認生命。"},{"id":"BIO-B01-Ch1.1-S003:D","text":"能量處理、調節、生長發育","explanation":"三項都描述生命系統持續進行的活動。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：能量處理支持活動，調節維持內部可運作條件，生長發育使個體增大和成熟；三者均是生命性質，而外觀物性不是相同層次的判準。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S004","topicId":"BIO-C1.1I-LIFE","stem":"一隻不具生育能力的貓仍會進食、成長並調節體溫。下列判斷何者最合適？","correct":"BIO-B01-Ch1.1-S004:A","options":[{"id":"BIO-B01-Ch1.1-S004:A","text":"牠仍是生命，繁殖不是每個個體必須具備的能力","explanation":"繁殖描述生命延續的重要性質，不要求每個個體均可生育。"},{"id":"BIO-B01-Ch1.1-S004:B","text":"牠已不算生命，因為繁殖必須人人具備","explanation":"此項把生命系統的性質錯當為所有個體的必備能力。"},{"id":"BIO-B01-Ch1.1-S004:C","text":"只有進食當下才算生命","explanation":"生命活動持續整合運作，不能以有無正在進食切換判定。"},{"id":"BIO-B01-Ch1.1-S004:D","text":"只有體溫絕對不變時才算生命","explanation":"調節容許可運作範圍內的變動，不要求絕對恆定。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：是否能生育不能單獨決定個體是否活著。題設的貓有整合生命活動，不孕並不使其成為非生命。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S005","topicId":"BIO-C1.1I-LIFE","stem":"只見到一件物體具有規則排列，最合理的結論是什麼？","correct":"BIO-B01-Ch1.1-S005:B","options":[{"id":"BIO-B01-Ch1.1-S005:A","text":"已證明它具有全部生命性質","explanation":"觀察到一項性質不能補足其他未觀察的性質。"},{"id":"BIO-B01-Ch1.1-S005:B","text":"尚不能只憑排列規則就斷定它有生命","explanation":"此結論保留了整體生命判斷所需的證據限制。"},{"id":"BIO-B01-Ch1.1-S005:C","text":"可證明它必能產生後代","explanation":"秩序描述構造，不能直接推出繁殖能力。"},{"id":"BIO-B01-Ch1.1-S005:D","text":"可證明它必有自我意識","explanation":"構造有序與主觀意識不是同一種證據。"}],"concept":"生物學是以科學方法研究生命的學科。生命通常藉一組相關活動辨認：有秩序、繁殖、生長與發育、能量處理、調節、回應環境及族群的演化適應。單一外觀或動作不能獨立當作充分判準；也不能要求每個個體在每一時刻都繁殖或明顯移動。判斷時先看觀察到什麼，再區分它能支持的結論與仍缺的證據。\n\n本題判讀：規則排列是一項可觀察的構造特徵。非生命物也可能規則排列，因此仍須評估其他生命活動，不能由一項線索跳到完整生命判定。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第3張／正文第1頁（10_imagegen_page_03.png）；正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S006","topicId":"BIO-C1.1I-ORDER","stem":"顯微觀察發現植物細胞中的構造有一定配置，並非材料任意堆積。此描述最直接呈現哪項生命性質？","correct":"BIO-B01-Ch1.1-S006:C","options":[{"id":"BIO-B01-Ch1.1-S006:A","text":"演化適應","explanation":"演化適應需可遺傳差異及世代資料，題目沒有。"},{"id":"BIO-B01-Ch1.1-S006:B","text":"繁殖","explanation":"繁殖涉及形成後代，不是單純構造配置。"},{"id":"BIO-B01-Ch1.1-S006:C","text":"有秩序","explanation":"一定的內部配置就是有組織的構造。"},{"id":"BIO-B01-Ch1.1-S006:D","text":"回應環境","explanation":"回應環境須描述刺激後變化，題目只給靜態安排。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：題幹描述的是構造如何安排，未提供後代、刺激反應或跨世代變化，所以最直接對應秩序。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S007","topicId":"BIO-C1.1I-ORDER","stem":"下列哪個觀察最直接用來說明生命具有秩序？","correct":"BIO-B01-Ch1.1-S007:D","options":[{"id":"BIO-B01-Ch1.1-S007:A","text":"花蜜的化學能支持活動","explanation":"此項重點是取得及利用能量。"},{"id":"BIO-B01-Ch1.1-S007:B","text":"耳部血流改變以散熱","explanation":"此項重點是控制熱交換以維持內部條件。"},{"id":"BIO-B01-Ch1.1-S007:C","text":"族群保護色經多代變常見","explanation":"此項涉及族群與世代的遺傳特徵改變。"},{"id":"BIO-B01-Ch1.1-S007:D","text":"花序中的小花呈可辨認的規則安排","explanation":"小花的相對位置展現結構組織性。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：有秩序著重構造安排。花序的規則格局是直接例子；其他選項分別強調能量處理、調節與演化適應。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S008","topicId":"BIO-C1.1I-ORDER","stem":"「生命具有秩序」最合適的解釋是哪一項？","correct":"BIO-B01-Ch1.1-S008:A","options":[{"id":"BIO-B01-Ch1.1-S008:A","text":"生物的構造及其部分有一定組織安排","explanation":"此項說明部分如何組織，符合秩序的意義。"},{"id":"BIO-B01-Ch1.1-S008:B","text":"生物每個部分都完全相同","explanation":"不同構造可有不同功能，有序不等於全都同質。"},{"id":"BIO-B01-Ch1.1-S008:C","text":"所有生物都必須左右對稱","explanation":"左右對稱只是某些生物的形態，不是所有生命的要求。"},{"id":"BIO-B01-Ch1.1-S008:D","text":"只要外表規則就一定是生物","explanation":"非生命物亦可有規律，因此不能反推生命。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：秩序指有組織的安排，並非所有部分相同，也不限定某一種外形。由秩序本身還不能反推一物體一定有生命。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S009","topicId":"BIO-C1.1I-ORDER","stem":"研究者把生命從分子、細胞到整個生物的不同尺度連結思考。此焦點最接近哪個統整主題？","correct":"BIO-B01-Ch1.1-S009:B","options":[{"id":"BIO-B01-Ch1.1-S009:A","text":"資訊","explanation":"資訊著重遺傳訊息及其作用，不是單由尺度區分。"},{"id":"BIO-B01-Ch1.1-S009:B","text":"組織","explanation":"分子、細胞與個體等尺度是組織主題的入口。"},{"id":"BIO-B01-Ch1.1-S009:C","text":"能量與物質","explanation":"此主題著重能量與材料的取得轉換，不是本題主軸。"},{"id":"BIO-B01-Ch1.1-S009:D","text":"演化","explanation":"演化著重跨世代變化，題目未涉及。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：不同尺度與結構層次的連結屬組織主題。題目沒有要求任何詳細層級排序，只需辨認觀察焦點。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S010","topicId":"BIO-C1.1I-ORDER","stem":"關於生命秩序可觀察的位置，何者正確？","correct":"BIO-B01-Ch1.1-S010:C","options":[{"id":"BIO-B01-Ch1.1-S010:A","text":"僅限生物外表的顏色排列","explanation":"細胞及器官內部也有組織安排，並不限外觀。"},{"id":"BIO-B01-Ch1.1-S010:B","text":"只能出現在整個生態系","explanation":"組織性也能在較小尺度觀察。"},{"id":"BIO-B01-Ch1.1-S010:C","text":"可出現在外部形態及細胞內部構造","explanation":"此項同時涵蓋外部與內部的結構安排。"},{"id":"BIO-B01-Ch1.1-S010:D","text":"必須肉眼看得到才屬生命秩序","explanation":"顯微觀察得到的結構秩序仍然有效。"}],"concept":"生命的秩序是構造具有可辨認的安排與組織，並非材料任意混合；它可見於外部形態，也可見於細胞與器官內部。五個統整主題中的組織，進一步提醒我們以不同尺度理解生命。外觀整齊本身不是生命的充分證據，規則晶體或人工物也能有規律。辨題時分清正在描述結構安排、能量利用，還是世代變化。\n\n本題判讀：生命構造的有組織性跨越觀察尺度。放大後才能看見的細胞安排仍可呈現秩序，不以肉眼可見為界線。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S011","topicId":"BIO-C1.1I-REPRO","stem":"某動物由幼體長成成年個體，之後產下同類後代。哪個事件最直接屬於繁殖？","correct":"BIO-B01-Ch1.1-S011:B","options":[{"id":"BIO-B01-Ch1.1-S011:A","text":"原個體體積增大","explanation":"原個體變大是生長，尚未產生後代。"},{"id":"BIO-B01-Ch1.1-S011:B","text":"新一代個體形成","explanation":"形成新一代正是繁殖的核心判準。"},{"id":"BIO-B01-Ch1.1-S011:C","text":"原個體逐漸成熟","explanation":"同一個體成熟屬發育，與產生新個體不同。"},{"id":"BIO-B01-Ch1.1-S011:D","text":"原個體攝取更多食物","explanation":"攝取食物支持活動，但不直接表示已繁殖。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：題目包含成長、成熟及後代產生三類事件。繁殖的判別點是形成下一代，不能只看原個體變大或耗能增加。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S012","topicId":"BIO-C1.1I-REPRO","stem":"下列何者最能區分繁殖與生長？","correct":"BIO-B01-Ch1.1-S012:C","options":[{"id":"BIO-B01-Ch1.1-S012:A","text":"是否有使用任何能量","explanation":"兩種過程都可耗能，不能藉此區分。"},{"id":"BIO-B01-Ch1.1-S012:B","text":"是否發生在生命系統中","explanation":"兩者都發生於生命系統，這是共同點。"},{"id":"BIO-B01-Ch1.1-S012:C","text":"是否產生後代，而非只讓原個體增大","explanation":"此項抓住後代形成與原個體增大的差別。"},{"id":"BIO-B01-Ch1.1-S012:D","text":"是否能以肉眼看到變化","explanation":"微小生物的生長或繁殖也可能需要儀器觀察。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：生長與繁殖均可需要能量，也都屬生命活動。真正區別在於原個體增大，還是形成下一代個體；肉眼能否看見不是定義。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S013","topicId":"BIO-C1.1I-REPRO","stem":"一隻不孕動物仍維持正常代謝。對生命的繁殖性質應如何理解？","correct":"BIO-B01-Ch1.1-S013:D","options":[{"id":"BIO-B01-Ch1.1-S013:A","text":"只要不孕就屬非生命","explanation":"不孕不會取消其代謝等生命活動。"},{"id":"BIO-B01-Ch1.1-S013:B","text":"生命系統完全不需要繁殖","explanation":"繁殖對生命延續仍有意義，不能因個體例外全盤否定。"},{"id":"BIO-B01-Ch1.1-S013:C","text":"所有動物必須每天產生後代","explanation":"繁殖具有生命史與個體差異，並非每日要求。"},{"id":"BIO-B01-Ch1.1-S013:D","text":"繁殖是生命的重要性質，但不要求每個個體都能生育","explanation":"此項兼顧生命延續的性質與個體差異。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：繁殖使生命延續；個體是否能生育與是否活著不能等同。不孕個體仍能維持能量處理、調節等活動。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S014","topicId":"BIO-C1.1I-REPRO","stem":"以下哪項紀錄直接提供產生後代的證據？","correct":"BIO-B01-Ch1.1-S014:A","options":[{"id":"BIO-B01-Ch1.1-S014:A","text":"標記的親代產生了一個新的同類個體","explanation":"有明確親代與新個體的關係，符合繁殖。"},{"id":"BIO-B01-Ch1.1-S014:B","text":"標記的幼體體重增加","explanation":"同一幼體增重是生長，不代表多一個後代。"},{"id":"BIO-B01-Ch1.1-S014:C","text":"標記的個體體溫回穩","explanation":"體溫回穩描述調節而非繁殖。"},{"id":"BIO-B01-Ch1.1-S014:D","text":"標記的植株多長了一片葉","explanation":"原植株形成新葉屬構造發育，題設未形成新個體。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：新同類個體是下一代，直接支持繁殖；同一個體的增重、長葉或體溫回穩，分別是生長發育或調節。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S015","topicId":"BIO-C1.1I-REPRO","stem":"關於繁殖的意義，下列何者正確？","correct":"BIO-B01-Ch1.1-S015:B","options":[{"id":"BIO-B01-Ch1.1-S015:A","text":"讓同一個體永遠只增加體積","explanation":"體積增加是生長，不是繁殖的定義。"},{"id":"BIO-B01-Ch1.1-S015:B","text":"產生同類後代並延續遺傳資訊","explanation":"產生後代與資訊延續是繁殖的重要意義。"},{"id":"BIO-B01-Ch1.1-S015:C","text":"產生完全不來自任何來源的能量","explanation":"生物轉換能量，不會藉繁殖憑空創造能量。"},{"id":"BIO-B01-Ch1.1-S015:D","text":"使每個個體在一生中主動演化","explanation":"演化看族群跨世代，不能說個體主動演化。"}],"concept":"繁殖是生命系統產生同類後代，使生命延續並傳遞遺傳資訊；生長則是原有個體增加大小，發育還包含分化與成熟。關鍵不只是細胞數或體積是否增加，而是是否形成下一代個體。繁殖是生命的重要性質，卻不表示每一個個體都必須有生育能力；不孕動物仍有其他整合的生命活動。\n\n本題判讀：繁殖連結前後世代，遺傳資訊隨後代形成而延續。它與同個體生長、能量處理及族群演化相關，但不等於後三者。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S016","topicId":"BIO-C1.1I-GROW","stem":"某幼苗逐步形成根、莖與葉。題幹最直接描述哪項生命性質？","correct":"BIO-B01-Ch1.1-S016:A","options":[{"id":"BIO-B01-Ch1.1-S016:A","text":"生長與發育","explanation":"構造逐步形成是生長發育的典型表現。"},{"id":"BIO-B01-Ch1.1-S016:B","text":"演化適應","explanation":"單一幼苗的變化不等於族群跨代適應。"},{"id":"BIO-B01-Ch1.1-S016:C","text":"繁殖新個體","explanation":"新器官不是直接等同新個體。"},{"id":"BIO-B01-Ch1.1-S016:D","text":"調節體溫","explanation":"題面未提供熱交換或內部溫度控制。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：同一幼苗形成不同構造，符合發育；若伴隨增大也包含生長。題設未描述新個體或多代族群改變。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S017","topicId":"BIO-C1.1I-GROW","stem":"哪項敘述最能表達「發育」超過單純尺寸增加的意義？","correct":"BIO-B01-Ch1.1-S017:B","options":[{"id":"BIO-B01-Ch1.1-S017:A","text":"只是原有物體同比例膨大","explanation":"同比例膨大不能涵蓋分化及器官形成。"},{"id":"BIO-B01-Ch1.1-S017:B","text":"形成不同的細胞角色與特定構造","explanation":"此項補上分化與構造形成，符合發育的核心。"},{"id":"BIO-B01-Ch1.1-S017:C","text":"只要重量增加就完全描述所有發育","explanation":"重量只描述部分生長，不能完整描述發育。"},{"id":"BIO-B01-Ch1.1-S017:D","text":"必須產生新的下一代個體","explanation":"新後代是繁殖的焦點，非每次發育的必要條件。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：發育涉及分化、構造形成及成熟。只用大小或重量描述，會漏掉形態與組成的有方向變化；發育不必等於繁殖。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S018","topicId":"BIO-C1.1I-GROW","stem":"基因攜帶的遺傳資訊影響幼苗形成構造的模式，最直接連結哪個統整主題？","correct":"BIO-B01-Ch1.1-S018:C","options":[{"id":"BIO-B01-Ch1.1-S018:A","text":"組織","explanation":"構造可涉及組織，但題目重點是遺傳訊息的控制。"},{"id":"BIO-B01-Ch1.1-S018:B","text":"能量與物質","explanation":"題面未以能量或材料的取得及轉換為主要焦點。"},{"id":"BIO-B01-Ch1.1-S018:C","text":"資訊","explanation":"遺傳資訊影響生命活動，直接對應資訊主題。"},{"id":"BIO-B01-Ch1.1-S018:D","text":"交互作用","explanation":"各部分可有交互作用，但題問遺傳訊息控制，最直接屬資訊。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：題目指定基因所攜帶訊息對發育模式的影響，因此焦點是資訊的作用；並非只見幼苗就一定選生長，而須依問題層次回答。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S019","topicId":"BIO-C1.1I-GROW","stem":"同一幼體增重並逐漸成熟，未形成後代。下列哪項用語最合適？","correct":"BIO-B01-Ch1.1-S019:D","options":[{"id":"BIO-B01-Ch1.1-S019:A","text":"已完成整個族群的演化","explanation":"個體成熟不代表族群演化。"},{"id":"BIO-B01-Ch1.1-S019:B","text":"已完成一次繁殖","explanation":"題面明定未形成後代，不能記成繁殖。"},{"id":"BIO-B01-Ch1.1-S019:C","text":"只是無序材料堆積","explanation":"有生命的成長與發育不能簡化成無序堆積。"},{"id":"BIO-B01-Ch1.1-S019:D","text":"生長與發育","explanation":"此項同時描述增重與成熟，與資料相符。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：個體增重屬生長，成熟屬發育。題設追蹤同一幼體，沒有形成新後代，也沒有族群跨世代資料。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S020","topicId":"BIO-C1.1I-GROW","stem":"下列哪項關於生長與發育的說法正確？","correct":"BIO-B01-Ch1.1-S020:A","options":[{"id":"BIO-B01-Ch1.1-S020:A","text":"它們可受基因攜帶的資訊影響","explanation":"資訊參與發育控制，是本節的核心關聯。"},{"id":"BIO-B01-Ch1.1-S020:B","text":"它們與遺傳資訊完全無關","explanation":"否定遺傳資訊影響與生物發育的基本原理不符。"},{"id":"BIO-B01-Ch1.1-S020:C","text":"它們必使原個體變成另一物種","explanation":"成長成熟不是個體轉變物種。"},{"id":"BIO-B01-Ch1.1-S020:D","text":"它們一律只需觀察重量即可完整描述","explanation":"發育包含形態及細胞差異，重量不能完整代表。"}],"concept":"生長著重個體大小或物質量的增加；發育包括細胞分化、特定構造形成與逐步成熟，不能只用尺寸描述。基因攜帶的遺傳資訊參與控制生長發育的模式，故同一現象也能連結資訊主題。這些都是個體一生中的過程，不能因出現新構造就判成族群演化，也不能把同一幼體成熟當成另產後代。\n\n本題判讀：遺傳資訊參與控制生長發育模式；完整描述還需關注分化與構造形成。此概念不意味個體一生中的成長是物種演化。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S021","topicId":"BIO-C1.1I-ENERGY","stem":"昆蟲利用食物中的化學能支持活動，最直接呈現哪項生命性質？","correct":"BIO-B01-Ch1.1-S021:C","options":[{"id":"BIO-B01-Ch1.1-S021:A","text":"繁殖","explanation":"未描述後代形成，不能以繁殖為主要判斷。"},{"id":"BIO-B01-Ch1.1-S021:B","text":"結構秩序","explanation":"題幹不是描述構造的相對安排。"},{"id":"BIO-B01-Ch1.1-S021:C","text":"能量處理","explanation":"食物化學能轉換以支持活動，符合能量處理。"},{"id":"BIO-B01-Ch1.1-S021:D","text":"演化適應","explanation":"個體一次用能不是演化適應的多代證據。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：題目聚焦食物能量的取得與利用，對應能量處理；單次活動未提供後代或族群跨代資料。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S022","topicId":"BIO-C1.1I-ENERGY","stem":"「生物能處理能量」應如何解釋？","correct":"BIO-B01-Ch1.1-S022:D","options":[{"id":"BIO-B01-Ch1.1-S022:A","text":"生物能在完全無能量來源下創造能量","explanation":"沒有來源而創造能量不符合能量守恆。"},{"id":"BIO-B01-Ch1.1-S022:B","text":"所有攝入能量都永久留在體內","explanation":"部分能量可用於活動並以熱散出，非全永久保留。"},{"id":"BIO-B01-Ch1.1-S022:C","text":"生物用過的熱必全部變回原本食物","explanation":"能量散出不等於全部逆轉回原食物。"},{"id":"BIO-B01-Ch1.1-S022:D","text":"生物取得能量並轉換成可支持活動的形式","explanation":"此項保留能量來源與轉換兩個必要部分。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：生物的能量利用涉及來源與轉換，並遵守能量守恆。能量可能流出系統，不是憑空創造或用完後必全部回到原狀。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S023","topicId":"BIO-C1.1I-ENERGY","stem":"動物進食後利用能量維持身體活動。食物所提供的能量在本例中主要以何種形式儲存？","correct":"BIO-B01-Ch1.1-S023:A","options":[{"id":"BIO-B01-Ch1.1-S023:A","text":"化學能","explanation":"食物中的化學能是本題的能量來源。"},{"id":"BIO-B01-Ch1.1-S023:B","text":"動物自己憑空產生的能量","explanation":"能量來自食物，並非動物從無到有創造。"},{"id":"BIO-B01-Ch1.1-S023:C","text":"已完成全部循環的熱","explanation":"熱與食物儲存的化學能不能任意等同。"},{"id":"BIO-B01-Ch1.1-S023:D","text":"純粹的構造排列順序","explanation":"排列秩序是結構面向，不能取代食物能量形式。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：本例的食物含有機物，其中儲存化學能。代謝使此能量可供身體活動，不能把「利用」說成「創造」。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S024","topicId":"BIO-C1.1I-ENERGY","stem":"若討論食物提供燃料，以及材料在生物與環境間被利用，最接近哪個統整主題？","correct":"BIO-B01-Ch1.1-S024:B","options":[{"id":"BIO-B01-Ch1.1-S024:A","text":"資訊","explanation":"資訊主題聚焦遺傳訊息及其作用，不是此處燃料與材料。"},{"id":"BIO-B01-Ch1.1-S024:B","text":"能量與物質","explanation":"此主題同時涵蓋能量利用和物質轉換。"},{"id":"BIO-B01-Ch1.1-S024:C","text":"演化","explanation":"題目未提供族群跨代改變。"},{"id":"BIO-B01-Ch1.1-S024:D","text":"只限組織尺度","explanation":"結構尺度不是此處能量和材料去向的主要焦點。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：燃料對應能量，材料的吸收與再利用對應物質；兩者共同構成能量與物質主題的導入。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S025","topicId":"BIO-C1.1I-ENERGY","stem":"關於生命系統中的能量與物質，何者正確？","correct":"BIO-B01-Ch1.1-S025:C","options":[{"id":"BIO-B01-Ch1.1-S025:A","text":"能量和物質都只能憑空產生","explanation":"生命活動仍遵守守恆，不能憑空創造。"},{"id":"BIO-B01-Ch1.1-S025:B","text":"能量一定完全循環，物質一定消失","explanation":"此項把能量循環與物質消失的錯誤說法相連。"},{"id":"BIO-B01-Ch1.1-S025:C","text":"能量可轉移與轉換，物質可被吸收及重組利用","explanation":"此項分清能量形式與物質利用。"},{"id":"BIO-B01-Ch1.1-S025:D","text":"只有物質會影響生命，能量不需要","explanation":"生命活動需要能量支持，也需要材料。"}],"concept":"能量處理是取得並轉換能量以支持生命活動。動物食物含有化學能，經代謝轉換後可用於運動、維持與生長；這不表示生物能憑空製造能量。能量與物質也要分清：能量在系統中轉移、轉換，部分以熱散出；物質的組成原子可被吸收、重組及再次利用而循環。判斷能量去向時須列入散熱，不能把散熱當作能量消失。\n\n本題判讀：能量流動及轉換與物質的吸收、轉換和循環是不同但相關的過程。生命活動須兼顧兩者，不把能量用完或物質變形當成無中生有。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3；9（補核已審導入正文中的能量與物質總覽） 頁（PDF 52；58 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第6張／正文第4頁（13_imagegen_page_06.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S026","topicId":"BIO-C1.1I-REG","stem":"動物透過調整耳部血流改變散熱，以維持體溫範圍。此描述最直接呈現何者？","correct":"BIO-B01-Ch1.1-S026:B","options":[{"id":"BIO-B01-Ch1.1-S026:A","text":"繁殖","explanation":"沒有形成後代的描述。"},{"id":"BIO-B01-Ch1.1-S026:B","text":"調節","explanation":"調整熱交換以穩定內部條件，符合調節。"},{"id":"BIO-B01-Ch1.1-S026:C","text":"演化適應","explanation":"當下散熱不是族群跨代的適應證據。"},{"id":"BIO-B01-Ch1.1-S026:D","text":"個體生長","explanation":"未描述個體大小增加或成熟。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：題幹給出控制動作及維持體溫的目標，最直接屬調節；不需推測耳部血管的詳細機制。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S027","topicId":"BIO-C1.1I-REG","stem":"「生物可維持較穩定的內部條件」最合適的意思是什麼？","correct":"BIO-B01-Ch1.1-S027:C","options":[{"id":"BIO-B01-Ch1.1-S027:A","text":"內部所有數值每刻完全相同","explanation":"調節不要求數學上的零變化。"},{"id":"BIO-B01-Ch1.1-S027:B","text":"身體不能對環境做任何變化","explanation":"面對環境變動，調整反而可能是維持穩定的必要方式。"},{"id":"BIO-B01-Ch1.1-S027:C","text":"透過調整讓內部變動維持在可運作範圍","explanation":"此項同時保留控制活動與可接受波動。"},{"id":"BIO-B01-Ch1.1-S027:D","text":"只要有一次波動就必定死亡","explanation":"波動不必造成死亡，須看幅度和可運作範圍。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：穩定是功能範圍內的控制，不是絕對靜止。調節可透過變動某些活動來減少內部條件偏離，正常範圍內仍可有波動。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S028","topicId":"BIO-C1.1I-REG","stem":"下列哪項最直接描述調節的目標？","correct":"BIO-B01-Ch1.1-S028:D","options":[{"id":"BIO-B01-Ch1.1-S028:A","text":"讓所有後代具有完全相同外形","explanation":"後代外形與體內狀態控制是不同問題。"},{"id":"BIO-B01-Ch1.1-S028:B","text":"讓個體意志立即改變遺傳特徵","explanation":"個體意願不會構成天擇或遺傳特徵立即改造。"},{"id":"BIO-B01-Ch1.1-S028:C","text":"使生物永遠不需能量","explanation":"維持與調整本身也可能需要能量。"},{"id":"BIO-B01-Ch1.1-S028:D","text":"讓體內條件維持適合生命活動的範圍","explanation":"此項直接表達調節維持功能範圍的意義。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：調節的焦點在內部條件的可運作性。它不是追求所有後代相同，也不是個體主動演化或取消能量需求。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S029","topicId":"BIO-C1.1I-REG","stem":"下列哪個觀察最需要以「調節」解釋？","correct":"BIO-B01-Ch1.1-S029:A","options":[{"id":"BIO-B01-Ch1.1-S029:A","text":"體內水分變動後，控制活動使其回到可運作範圍","explanation":"內部條件經控制恢復範圍，符合調節。"},{"id":"BIO-B01-Ch1.1-S029:B","text":"同類親代形成新的幼體","explanation":"新幼體的形成主要是繁殖。"},{"id":"BIO-B01-Ch1.1-S029:C","text":"幼體長大並形成新構造","explanation":"同一個體的新構造及長大主要是發育。"},{"id":"BIO-B01-Ch1.1-S029:D","text":"某有助增加後代數的可遺傳保護色經多代在族群增加","explanation":"多代的遺傳特徵增加主要是演化適應。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：第一項直接給出內部水分、偏離與恢復範圍的控制關係。其餘分別描述繁殖、發育及演化適應。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S030","topicId":"BIO-C1.1I-REG","stem":"關於調節與短期變化，哪項說法正確？","correct":"BIO-B01-Ch1.1-S030:B","options":[{"id":"BIO-B01-Ch1.1-S030:A","text":"任何內部變化都代表調節不存在","explanation":"受控波動可以和調節並存。"},{"id":"BIO-B01-Ch1.1-S030:B","text":"適度的生理調整可幫助維持穩定","explanation":"透過變動維持可運作狀態是調節的重要意義。"},{"id":"BIO-B01-Ch1.1-S030:C","text":"調節必須跨越多代才看得到","explanation":"個體當下即可調節，不一定需要世代尺度。"},{"id":"BIO-B01-Ch1.1-S030:D","text":"調節只適用生物外觀的規則排列","explanation":"規則排列屬秩序，調節重點是內部條件控制。"}],"concept":"調節是透過控制活動，讓體溫、水分等內部條件維持在生命可運作的範圍。穩定不等於每個讀值完全相同：環境會擾動內部狀態，調整後可有小幅波動。野兔改變耳部血流以調整與空氣的熱交換，是此類例子。辨題時看控制的目標是否為內部條件，以及觀察時間是否屬個體當下；不把短期控制等同世代演化。\n\n本題判讀：生物可改變活動來抵銷擾動，內部值仍在範圍內波動。故「有變化」與「能穩定」不是矛盾，而多代及排列各屬其他焦點。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S031","topicId":"BIO-C1.1I-RESPONSE","stem":"某植物受到碰觸後，葉片迅速改變姿態。此觀察最直接支持哪項生命性質？","correct":"BIO-B01-Ch1.1-S031:B","options":[{"id":"BIO-B01-Ch1.1-S031:A","text":"能產生後代","explanation":"葉片姿態改變不等於形成後代。"},{"id":"BIO-B01-Ch1.1-S031:B","text":"回應環境刺激","explanation":"明確的刺激與反應關係符合回應環境。"},{"id":"BIO-B01-Ch1.1-S031:C","text":"族群演化適應","explanation":"單一反應不能取代族群多代證據。"},{"id":"BIO-B01-Ch1.1-S031:D","text":"個體長大成熟","explanation":"迅速姿態改變不是題設的成長或成熟。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：題目給出碰觸刺激與其後的姿態改變，因此可直接描述回應環境；沒有新個體、長大或多代資料。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S032","topicId":"BIO-C1.1I-RESPONSE","stem":"由捕蠅草受碰觸後閉合，能直接得到哪項結論？","correct":"BIO-B01-Ch1.1-S032:C","options":[{"id":"BIO-B01-Ch1.1-S032:A","text":"已證明植物有主觀思考","explanation":"反應行為本身不能證明主觀意識。"},{"id":"BIO-B01-Ch1.1-S032:B","text":"已證明植物在當下演化","explanation":"單個體短期閉合不是族群跨代演化。"},{"id":"BIO-B01-Ch1.1-S032:C","text":"植物能對特定刺激產生反應","explanation":"此項結論恰好對應刺激與動作資料。"},{"id":"BIO-B01-Ch1.1-S032:D","text":"已證明所有植物每次刺激都相同反應","explanation":"一個例子不能推廣所有植物及所有刺激條件。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：可觀察到的事實是特定刺激後有閉合反應。意識、演化及所有植物的普遍行為都需要不同證據，不能由此直接推出。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S033","topicId":"BIO-C1.1I-RESPONSE","stem":"關於生物回應環境，哪項說法正確？","correct":"BIO-B01-Ch1.1-S033:D","options":[{"id":"BIO-B01-Ch1.1-S033:A","text":"一定要整個個體離開原地","explanation":"葉片反應就可不伴隨整株位移。"},{"id":"BIO-B01-Ch1.1-S033:B","text":"必須先有意識才可能反應","explanation":"刺激反應不要求先證明主觀意識。"},{"id":"BIO-B01-Ch1.1-S033:C","text":"只有動物可能有刺激反應","explanation":"植物亦有反應能力，並非動物專有。"},{"id":"BIO-B01-Ch1.1-S033:D","text":"局部構造或生理活動改變也可能是反應","explanation":"此項涵蓋反應的不同表現方式。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：反應可發生在局部或生理層次，未必呈現整體位移。植物同樣可對刺激反應，不能以動物式行為或意識當必要條件。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S034","topicId":"BIO-C1.1I-RESPONSE","stem":"某同學說「有刺激反應，便可證明有意識」。最適合的修正是什麼？","correct":"BIO-B01-Ch1.1-S034:A","options":[{"id":"BIO-B01-Ch1.1-S034:A","text":"反應可被觀察，但意識不能由此單獨推出","explanation":"此項區分直接觀察及尚未被證明的性質。"},{"id":"BIO-B01-Ch1.1-S034:B","text":"所有有反應的生物都不是生命","explanation":"反應本來就是生命的常見性質，不能反向排除生命。"},{"id":"BIO-B01-Ch1.1-S034:C","text":"有意識與葉片位置是同一種觀察","explanation":"葉片位置是可觀察狀態，不能直接等同主觀覺察。"},{"id":"BIO-B01-Ch1.1-S034:D","text":"只要沒有位移就不可能有反應","explanation":"生理或局部改變也可回應刺激，不必整體位移。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：反應描述刺激後的可觀察變化，意識涉及主觀覺察。兩者不是等價證據，不能因有反應就必然斷言具意識。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S035","topicId":"BIO-C1.1I-RESPONSE","stem":"哪個描述最完整包含環境反應的基本關係？","correct":"BIO-B01-Ch1.1-S035:B","options":[{"id":"BIO-B01-Ch1.1-S035:A","text":"物體只是具有固定外形","explanation":"固定外形沒有提供刺激後變化。"},{"id":"BIO-B01-Ch1.1-S035:B","text":"外界光照改變後，某活體出現相應活動變化","explanation":"此項包含外界變化及相應反應兩部分。"},{"id":"BIO-B01-Ch1.1-S035:C","text":"族群的可遺傳性狀多代增加","explanation":"此項重點是演化的族群世代尺度。"},{"id":"BIO-B01-Ch1.1-S035:D","text":"親代形成同類後代","explanation":"此項重點是繁殖與生命延續。"}],"concept":"回應環境指生物感受刺激後產生變化，例如捕蠅草受觸碰後閉合。反應可能是動作，也可能是生理活動改變，不必使整個個體移動。由刺激與反應只能直接支持反應能力，不能直接證明主觀意識、意圖或思考。反應若同時幫助穩定內部條件，可與調節重疊；沒有內部穩定的證據時，不應額外推定。\n\n本題判讀：刺激與相應反應是判斷核心。題設已給外界光照變動及後續活動變化，足以作概念辨認，但不需猜測其詳細機制。","example":"","source":"Campbell Biology 12e｜Ch1 Concept 1.1導入；Figure 1.2｜印刷 3 頁（PDF 52 頁）｜本節筆記 正式第4張／正文第2頁（11_imagegen_page_04.png）；正式第5張／正文第3頁（12_imagegen_page_05.png）；正式第7張／正文第5頁（14_imagegen_page_07.png）；正式第8張／正文第6頁（15_imagegen_page_08.png）","shuffle":true},{"id":"BIO-B01-Ch1.1-S036","topicId":"BIO-C1.1I-ADAPT","stem":"哪項情境最符合演化適應的判斷尺度？","correct":"BIO-B01-Ch
